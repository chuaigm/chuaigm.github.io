<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>大众网球 · PSP</title>
<style>
  :root {
    --bg: #0e1116;
    --card: #171c24;
    --line: #262d38;
    --fg: #e8edf4;
    --dim: #8b97a8;
    --accent: #4f8cff;
    --ok: #37d67a;
    --err: #ff5c5c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(1200px 600px at 50% -10%, #1b2433 0%, var(--bg) 60%);
    color: var(--fg);
    font: 15px/1.55 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
  }
  .card {
    width: min(520px, 100%);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 26px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  h1 { font-size: 19px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 20px; }
  code.path {
    display: block;
    font: 12px/1.5 ui-monospace, Consolas, monospace;
    color: var(--dim);
    background: #0f1319;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 22px;
    word-break: break-all;
  }
  button.launch {
    width: 100%;
    border: 0;
    border-radius: 16px;
    padding: 20px;
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(180deg, #5b96ff, #3f7ae8);
    cursor: pointer;
    transition: transform .08s, filter .15s;
  }
  button.launch:hover { filter: brightness(1.08); }
  button.launch:active { transform: scale(.985); filter: brightness(.95); }
  .hint { text-align: center; color: var(--dim); font-size: 12px; margin-top: 10px; }
  .status {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 12px;
    background: #0f1319;
    border: 1px solid var(--line);
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-all;
    color: var(--dim);
  }
  .status.ok { border-color: rgba(55,214,122,.4); color: var(--ok); }
  .status.err { border-color: rgba(255,92,92,.4); color: var(--err); }
  .fallback { margin-top: 20px; padding-top: 18px; border-top: 1px dashed var(--line); display: none; }
  .fallback.show { display: block; }
  .fallback h2 { font-size: 14px; margin: 0 0 8px; font-weight: 600; }
  .fallback p { font-size: 12.5px; color: var(--dim); margin: 0 0 10px; }
  pre.cmd {
    margin: 0 0 10px;
    padding: 12px;
    background: #0b0e13;
    border: 1px solid var(--line);
    border-radius: 12px;
    font: 11.5px/1.6 ui-monospace, Consolas, monospace;
    color: #cdd7e5;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .row { display: flex; gap: 10px; }
  .ghost {
    flex: 1;
    border: 1px solid var(--line);
    background: #1d242e;
    color: var(--fg);
    border-radius: 12px;
    padding: 12px;
    font-size: 13px;
    cursor: pointer;
  }
  .ghost:active { background: #232c38; }
  a.retry {
    display: block;
    text-align: center;
    text-decoration: none;
    color: #9dc0ff;
    font-size: 13px;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #1d242e;
  }
</style>
</head>
<body>
  <main class="card">
    <h1>大众网球 · PSP</h1>
    <div class="sub">一键启动 PPSSPP 并载入游戏</div>
    <code class="path">/storage/72E7-1D97/Roms/psp/大众网球.iso</code>

    <button class="launch" id="btn">启动游戏</button>
    <div class="hint">用 Chrome / Edge / Firefox 打开本页</div>
    <div class="status" id="status">等待操作…</div>

    <section class="fallback" id="fallback">
      <h2>没有跳转？</h2>
      <p>浏览器可能拦截了 file:// 链接。可以点下面再试一次，或者复制命令到 Termux 执行。</p>
      <a class="retry" id="retry" href="#">再试一次</a>
      <pre class="cmd" id="cmd"></pre>
      <div class="row">
        <button class="ghost" id="copy">复制 am 命令</button>
      </div>
    </section>
  </main>

<script>
const ISO = '/storage/72E7-1D97/Roms/psp/大众网球.iso';
// 与下面 shell 命令等价：
// am start --user 0 -n org.ppsspp.ppsspp/.PpssppActivity -a android.intent.action.VIEW -d "<ISO>"
const INTENT = 'intent:///storage/72E7-1D97/Roms/psp/%E5%A4%A7%E4%BC%97%E7%BD%91%E7%90%83.iso'
  + '#Intent;scheme=file;action=android.intent.action.VIEW;'
  + 'component=org.ppsspp.ppsspp/.PpssppActivity;end';

const COMMAND = 'am start --user 0 -n org.ppsspp.ppsspp/.PpssppActivity '
  + '-a android.intent.action.VIEW -d "' + ISO + '"';

const btn = document.getElementById('btn');
const statusEl = document.getElementById('status');
const fallbackEl = document.getElementById('fallback');
const retryEl = document.getElementById('retry');
const cmdEl = document.getElementById('cmd');

cmdEl.textContent = COMMAND;
retryEl.href = INTENT;

function setStatus(text, kind) {
  statusEl.textContent = text;
  statusEl.className = 'status' + (kind ? ' ' + kind : '');
}

let leftPage = false;
let timer = 0;

function launch() {
  fallbackEl.classList.remove('show');
  setStatus('正在调起 PPSSPP…');
  leftPage = false;
  clearTimeout(timer);

  timer = setTimeout(() => {
    if (!leftPage && document.visibilityState === 'visible') {
      fallbackEl.classList.add('show');
      setStatus('没有检测到跳转。浏览器可能拦截了 file:// 链接，请看下面的替代方式。', 'err');
    }
  }, 1500);

  location.href = INTENT;
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    leftPage = true;
    clearTimeout(timer);
    setStatus('已跳转到 PPSSPP', 'ok');
  } else if (leftPage) {
    setStatus('已从 PPSSPP 返回', 'ok');
  }
});

btn.addEventListener('click', launch);

document.getElementById('copy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(COMMAND);
    setStatus('命令已复制，粘贴到 Termux 执行即可', 'ok');
  } catch {
    const ta = document.createElement('textarea');
    ta.value = COMMAND;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    setStatus('命令已复制（手动复制模式）', 'ok');
  }
});
</script>
</body>
</html>
