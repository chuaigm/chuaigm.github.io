    // ==================== 空袭 ====================
    function updateStillWarning(dt) {
        stillCheckElapsed += dt;
        const now = performance.now() / 1000;
        playerPosHistory.push({ time: now, x: player.x });
        const cutoff = now - PLAYER_STILL_DURATION;
        while (playerPosHistory.length > 0 && playerPosHistory[0].time < cutoff) playerPosHistory.shift();
        if (stillCheckElapsed < STILL_CHECK_DELAY) return;
        if (!stillWarningActive && playerPosHistory.length >= 2) {
            let minX = Infinity, maxX = -Infinity;
            for (let i = 0; i < playerPosHistory.length; i++) {
                const rx = playerPosHistory[i].x;
                if (rx < minX) minX = rx;
                if (rx > maxX) maxX = rx;
            }
            if (maxX - minX <= HALF_TANK_WIDTH && playerPosHistory.length > 10) {
                stillWarningActive = true;
                stillWarningX = player.x + player.w / 2;
                stillWarningTimer = randomRange(3.0, 5.0);
            }
        }
        if (stillWarningActive) {
            stillWarningTimer -= dt;
            if (stillWarningTimer <= 0) {
                airstrikeBullet = { x: stillWarningX, y: -60 * SCALE, vy: 0, radius: 7 * SCALE * 3, life: 10 };
                stillWarningActive = false;
                stillWarningX = 0;
                stillWarningTimer = 0;
            }
        }
    }

    function updateAirstrikeBullet(dt) {
        if (!airstrikeBullet) return;
        const b = airstrikeBullet;
        b.vy += BULLET_GRAVITY_SCALED * dt;
        b.y += b.vy * dt;
        b.life -= dt;
        const groundY = terrainY(b.x);
        if (b.y >= groundY || b.life <= 0) {
            const explosionRadius = createBigBulletGroundExplosion(b.x, groundY);
            playExplosionSound();
            playTankDestroySound();
            applyAirstrikeExplosionDamage(b.x, groundY, explosionRadius);
            airstrikeBullet = null;
        }
    }

    // ==================== 子弹碰撞 ====================
    function checkBulletCollisions() {
        handleBulletClashes();
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            if (b.life <= 0) {
                bullets.splice(i, 1);
                if (b.isPlayerBullet) onPlayerBulletDestroyed();
                continue;
            }
            const groundY = terrainY(b.x);
            if (b.y >= groundY) {
                if (b.isBig && b.isPlayerBullet) {
                    const explosionRadius = createBigBulletGroundExplosion(b.x, groundY);
                    playExplosionSound();
                    playTankDestroySound();
                    applyBigBulletExplosionDamage(b.x, groundY, explosionRadius);
                } else {
                    createExplosion(b.x, groundY, (b.isBig ? 40 : 24) * SCALE);
                    playExplosionSound();
                }
                bullets.splice(i, 1);
                if (b.isPlayerBullet) onPlayerBulletDestroyed();
                continue;
            }
            if (b.isEnemy) {
                if (!gameOver && pointInTank(b.x, b.y, player, 6, 4)) {
                    if (player.shield > 0) {
                        player.shield = 0;
                    } else {
                        playerHP--;
                        player.splitShot = 1;
                        player.bigBullet = false;
                        updateBuffDisplay();
                        if (playerHP <= 0) {
                            playerHP = 0;
                            gameOver = true;
                            updateHighScore();
                            saveTotalTime();
                            isPlaying = false;
                        }
                        hudDirty = true;
                    }
                    createExplosion(b.x, b.y, 20 * SCALE);
                    playPlayerHitSound();
                    bullets.splice(i, 1);
                    continue;
                }
            } else {
                let hitEnemyIndex = -1;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    const hit = b.isBig ? bigBulletHitsTank(b, e) : pointInTank(b.x, b.y, e, 6, 4);
                    if (hit) { hitEnemyIndex = j; break; }
                }
                if (hitEnemyIndex >= 0) {
                    bullets.splice(i, 1);
                    if (b.isPlayerBullet) onPlayerBulletDestroyed();
                    if (b.isBig) {
                        const explosionRadius = createBigBulletGroundExplosion(b.x, b.y);
                        playExplosionSound();
                        playTankDestroySound();
                        applyBigBulletExplosionDamage(b.x, b.y, explosionRadius);
                    } else {
                        const e = enemies[hitEnemyIndex];
                        e.hp -= 1;
                        createExplosion(b.x, b.y, 16 * SCALE);
                        playHitSound();
                        if (e.hp <= 0) killEnemy(hitEnemyIndex);
                        else hudDirty = true;
                    }
                }
            }
        }
    }

    function updateExplosions(dt) {
        for (let i = explosions.length - 1; i >= 0; i--) {
            const e = explosions[i];
            e.life -= dt;
            switch (e.type) {
                case 'spark':
                case 'boss-particle':
                case 'tank-particle':
                case 'clash-spark':
                case 'big-ground-particle':
                    e.x += e.vx * dt;
                    e.y += e.vy * dt;
                    e.vy += 400 * SCALE * dt;
                    break;
                case 'boss-smoke':
                case 'tank-smoke':
                case 'big-ground-smoke':
                    e.x += e.vx * dt;
                    e.y += e.vy * dt;
                    e.size += 30 * SCALE * dt;
                    break;
                case 'clash-ring':
                case 'clash-ring2':
                case 'boss-ring':
                case 'big-ground-ring': {
                    const t = 1 - e.life / e.maxLife;
                    e.radius = e.maxRadius * t;
                    break;
                }
                default:
                    if (e.maxRadius !== undefined) e.radius = e.maxRadius * (1 - e.life / e.maxLife);
            }
            if (e.life <= 0) explosions.splice(i, 1);
        }
    }

    // ==================== 道具 ====================
    function dropPowerup(x, y) {
        const allTypes = ['heal', 'split2', 'split3', 'shield', 'big'];
        const available = allTypes.filter(t => t !== lastPowerupType);
        const type = (available.length ? available : allTypes)[Math.floor(Math.random() * (available.length || allTypes.length))];
        lastPowerupType = type;
        const size = 36 * SCALE;
        powerups.push({ x: x - size / 2, y, w: size, h: size, type, vy: -2 * FPS_BASE * SCALE, life: 900 / FPS_BASE });
    }

    function updatePowerups(dt) {
        for (let i = powerups.length - 1; i >= 0; i--) {
            const p = powerups[i];
            p.life -= dt;
            p.vy += POWERUP_GRAVITY_SCALED * dt;
            p.y += p.vy * dt;
            const groundY = terrainY(p.x + p.w / 2);
            if (p.y + p.h > groundY) { p.y = groundY - p.h; p.vy = 0; }
            if (!gameOver && p.x < player.x + player.w && p.x + p.w > player.x &&
                p.y < player.y + player.h && p.y + p.h > player.y) {
                playPickupSound();
                applyPowerup(p.type);
                powerups.splice(i, 1);
                continue;
            }
            if (p.life <= 0) powerups.splice(i, 1);
        }
    }

    function applyPowerup(type) {
        switch (type) {
            case 'heal': if (playerHP < maxHP) { playerHP++; hudDirty = true; } break;
            case 'split2': player.splitShot = 2; player.bigBullet = false; break;
            case 'split3': player.splitShot = 3; player.bigBullet = false; break;
            case 'shield': player.shield = 1; break;
            case 'big': player.bigBullet = true; player.splitShot = 1; break;
        }
        updateBuffDisplay();
    }

    // ==================== 刷怪间隔 ====================
    function getDynamicSpawnInterval() {
        let bossPresent = false;
        let normalCount = 0;
        for (let i = 0; i < enemies.length; i++) {
            if (enemies[i].isBoss) bossPresent = true;
            else normalCount++;
        }
        if (bossPresent) return normalCount < BOSS_EXTRA_ENEMY_MIN ? BOSS_EXTRA_SPAWN_FAST : BOSS_EXTRA_SPAWN_SLOW;
        const count = enemies.length;
        if (count < ENEMY_COUNT_THRESHOLD) {
            const ratio = count / ENEMY_COUNT_THRESHOLD;
            return ENEMY_SPAWN_INTERVAL_FAST + (ENEMY_SPAWN_INTERVAL_BASE - ENEMY_SPAWN_INTERVAL_FAST) * ratio;
        } else if (count > ENEMY_COUNT_THRESHOLD) {
            const extra = Math.min(count - ENEMY_COUNT_THRESHOLD, 5);
            return ENEMY_SPAWN_INTERVAL_BASE + extra * (18 / FPS_BASE);
        }
        return ENEMY_SPAWN_INTERVAL_BASE;
    }

    // ==================== 更新 ====================
    function update(dt) {
        if (gameOver) return;

        const canLeft = keys.ArrowLeft || (gamepadConnected && gamepadLeft);
        const canRight = keys.ArrowRight || (gamepadConnected && gamepadRight);
        const pSpeed = player.speed * dt;
        if (canLeft) { player.x -= pSpeed; player.dir = -1; }
        if (canRight) { player.x += pSpeed; player.dir = 1; }
        if (player.x < 0) player.x = 0;
        if (player.x + player.w > W) player.x = W - player.w;
        snapToTerrain(player);

        if (player.reloadTimer > 0) player.reloadTimer -= dt;

        const canFire = player.activeBullets === 0 && player.reloadTimer <= 0;
        if ((keys.Space || (gamepadConnected && gamepadA)) && canFire) {
            const splitCount = player.bigBullet ? 1 : (player.splitShot || 1);
            for (let i = 0; i < splitCount; i++) {
                const spread = splitCount > 1 ? (i - (splitCount - 1) / 2) * 0.22 : 0;
                firePlayerBullet(spread);
            }
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.x += b.vx * dt;
            b.y += b.vy * dt;
            b.vy += BULLET_GRAVITY_SCALED * dt;
            b.life -= dt;
            if (b.x < -300 || b.x > W + 300 || b.y > PLAY_H + 200 || b.life <= 0) {
                bullets.splice(i, 1);
                if (b.isPlayerBullet) onPlayerBulletDestroyed();
            }
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
            const e = enemies[i];
            e.x += e.speed * e.dir * dt;
            snapToTerrain(e);
            if (e.cooldown > 0) e.cooldown -= dt;
            if (e.cooldown <= 0) {
                enemyFire(e);
                e.cooldown = e.maxCooldown + randomRange(-30, 30) / FPS_BASE;
            }
            if (e.x < -200 * SCALE || e.x > W + 200 * SCALE) enemies.splice(i, 1);
        }

        enemySpawnTimer -= dt;
        if (enemySpawnTimer <= 0) {
            let bossPresent = false;
            let normalCount = 0;
            for (let i = 0; i < enemies.length; i++) {
                if (enemies[i].isBoss) bossPresent = true;
                else normalCount++;
            }
            if (!bossPresent) spawnEnemy(false);
            else if (normalCount < BOSS_EXTRA_ENEMY_MIN) spawnEnemy(false);
            enemySpawnTimer = getDynamicSpawnInterval();
        }

        checkBulletCollisions();
        updateExplosions(dt);
        updatePowerups(dt);
        updateStillWarning(dt);
        updateAirstrikeBullet(dt);
        updateClouds(dt);
    }

    // ==================== 状态栏（缓存） ====================
    let hudDirty = true;
    let hudScoreStr = '', hudHsStr = '', hudTimeStr = '', hudBossStr = '';
    let hudScoreW = 0, hudHsW = 0, hudTimeW = 0, hudBossW = 0;
    let hudLastTime = -1;
    let hudLastBossMaxHp = -1;

    function rebuildHudCache() {
        hudScoreStr = 'Score: ' + score;
        hudHsStr = 'High score: ' + highScore;
        hudTimeStr = 'Time: ' + getFormattedTime();
        const bossMaxHp = getBossHpDisplay();
        hudBossStr = 'BOSS ' + bossMaxHp + ' HP';

        const savedFont = ctx.font;
        ctx.font = HUD_FONT;
        const pillPadX = 14;
        hudScoreW = ctx.measureText(hudScoreStr).width + pillPadX * 2;
        hudHsW = ctx.measureText(hudHsStr).width + pillPadX * 2;
        hudTimeW = ctx.measureText(hudTimeStr).width + pillPadX * 2;
        hudBossW = ctx.measureText(hudBossStr).width + pillPadX * 2;
        ctx.font = savedFont;
        hudLastTime = Math.floor(totalPlayTime / 60);
        hudLastBossMaxHp = bossMaxHp;
        hudDirty = false;
    }

    function markHudDirtyIfNeeded() {
        const curTime = Math.floor(totalPlayTime / 60);
        if (curTime !== hudLastTime) hudDirty = true;
        const bossMaxHp = getBossHpDisplay();
        if (bossMaxHp !== hudLastBossMaxHp) hudDirty = true;
    }

    // 通用：药丸背景 + 文字
    function drawPillWithText(x, y, w, h, bgColor, text, textColor) {
        ctx.fillStyle = bgColor;
        roundRectPath(x, y, w, h, h / 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.lineWidth = 1;
        roundRectPath(x + 1, y + 1, w - 2, h - 2, (h - 2) / 2);
        ctx.stroke();

        ctx.fillStyle = textColor;
        ctx.fillText(text, x + 14, y + h / 2 + 1);
    }

    function drawHud() {
        markHudDirtyIfNeeded();
        if (hudDirty) rebuildHudCache();

        ctx.fillStyle = hudBgGrad;
        ctx.fillRect(0, PLAY_H, W, HUD_H);
        ctx.strokeStyle = 'rgba(120, 170, 210, 0.35)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, PLAY_H + 0.5);
        ctx.lineTo(W, PLAY_H + 0.5);
        ctx.stroke();

        const pillH = 36;
        const pillBg = 'rgba(30, 47, 74, 0.85)';
        const pillBgStrong = 'rgba(52, 78, 116, 0.9)';
        const gap = 10;
        const totalW = hudScoreW + hudHsW + hudTimeW + hudBossW + gap * 3;
        let x = (W - totalW) / 2;
        const y = PLAY_H + (HUD_H - pillH) / 2;

        ctx.font = HUD_FONT;
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'left';

        drawPillWithText(x, y, hudScoreW, pillH, pillBg, hudScoreStr, '#dfeef8');
        x += hudScoreW + gap;

        drawPillWithText(x, y, hudHsW, pillH, pillBgStrong, hudHsStr, '#ffd966');
        x += hudHsW + gap;

        drawPillWithText(x, y, hudTimeW, pillH, pillBg, hudTimeStr, '#9bf6b0');
        x += hudTimeW + gap;

        drawPillWithText(x, y, hudBossW, pillH, pillBgStrong, hudBossStr, '#ffd966');
    }

    // ==================== Game Over ====================
    function drawArrowKeyIcon(cx, cy, s, color, dir) {
        ctx.fillStyle = color;
        ctx.beginPath();
        if (dir === 'left') {
            ctx.moveTo(cx - s * 0.55, cy);
            ctx.lineTo(cx + s * 0.15, cy - s * 0.55);
            ctx.lineTo(cx + s * 0.15, cy - s * 0.22);
            ctx.lineTo(cx + s * 0.65, cy - s * 0.22);
            ctx.lineTo(cx + s * 0.65, cy + s * 0.22);
            ctx.lineTo(cx + s * 0.15, cy + s * 0.22);
            ctx.lineTo(cx + s * 0.15, cy + s * 0.55);
        } else {
            ctx.moveTo(cx + s * 0.55, cy);
            ctx.lineTo(cx - s * 0.15, cy - s * 0.55);
            ctx.lineTo(cx - s * 0.15, cy - s * 0.22);
            ctx.lineTo(cx - s * 0.65, cy - s * 0.22);
            ctx.lineTo(cx - s * 0.65, cy + s * 0.22);
            ctx.lineTo(cx - s * 0.15, cy + s * 0.22);
            ctx.lineTo(cx - s * 0.15, cy + s * 0.55);
        }
        ctx.closePath();
        ctx.fill();
    }

    function drawSpaceKeyGraphic(x, y, w, h, color) {
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        roundRectPath(x, y, w, h, 4);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + w * 0.25, y + h * 0.6);
        ctx.lineTo(x + w * 0.75, y + h * 0.6);
        ctx.stroke();
    }

    function drawHintKey(x, y, w, h) {
        ctx.fillStyle = 'rgba(240, 243, 248, 0.92)';
        roundRectPath(x, y, w, h, 5);
        ctx.fill();
        ctx.strokeStyle = 'rgba(90, 111, 136, 0.9)';
        ctx.lineWidth = 2;
        roundRectPath(x, y, w, h, 5);
        ctx.stroke();
    }

    // 通用：键帽 + 居中标签
    function drawHintKeyWithLabel(x, y, w, h, label, labelFont) {
        drawHintKey(x, y, w, h);
        ctx.fillStyle = '#0b1a2f';
        ctx.font = labelFont;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, x + w / 2, y + h / 2 + 1);
    }

    function drawGameOver() {
        ctx.fillStyle = '#000000aa';
        ctx.fillRect(0, 0, W, PLAY_H);

        // 左上角版本号
        ctx.save();
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.font = HUD_FONT;
        ctx.fillStyle = 'rgba(223, 238, 248, 0.85)';
        ctx.shadowColor = '#000000';
        ctx.shadowBlur = 6;
        ctx.fillText('ver: ' + VERSION, 18, 14);
        ctx.restore();

        // 标题
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        ctx.font = GO_TITLE_FONT;
        ctx.fillStyle = '#f3d9b1';
        ctx.shadowColor = '#2e1e0e';
        ctx.shadowBlur = 20;
        ctx.shadowOffsetY = 8;
        ctx.fillText('GAME OVER', W / 2, PLAY_H / 2 - 130);
        ctx.restore();

        // 分数
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        ctx.font = GO_SCORE_FONT;
        ctx.fillStyle = '#dfeef8';
        ctx.fillText('Score: ' + score + '    High score: ' + highScore, W / 2, PLAY_H / 2 - 60);
        ctx.restore();

        // 第一行：左右箭头 + 空格
        const row1Y = PLAY_H / 2 + 10;
        const keyH = 44;
        const keyY1 = row1Y - keyH / 2;

        ctx.save();
        ctx.font = GO_HINT_FONT;
        const moveText = '移动';
        const fireText = '发射';
        const moveTextW = ctx.measureText(moveText).width;
        const fireTextW = ctx.measureText(fireText).width;

        const arrowKeyW = 44;
        const arrowGap = 6;
        const spaceKeyW = 96;
        const arrowsBlockW = arrowKeyW * 2 + arrowGap;
        const interGroup = 30;
        const labelGap = 12;
        const totalW1 = arrowsBlockW + labelGap + moveTextW + interGroup + spaceKeyW + labelGap + fireTextW;
        let x1 = (W - totalW1) / 2;

        drawHintKey(x1, keyY1, arrowKeyW, keyH);
        drawArrowKeyIcon(x1 + arrowKeyW / 2, keyY1 + keyH / 2, arrowKeyW * 0.52, '#0b1a2f', 'left');
        x1 += arrowKeyW + arrowGap;

        drawHintKey(x1, keyY1, arrowKeyW, keyH);
        drawArrowKeyIcon(x1 + arrowKeyW / 2, keyY1 + keyH / 2, arrowKeyW * 0.52, '#0b1a2f', 'right');
        x1 += arrowKeyW + labelGap;

        ctx.fillStyle = '#dfeef8';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(moveText, x1, keyY1 + keyH / 2 + 1);
        x1 += moveTextW + interGroup;

        drawHintKey(x1, keyY1, spaceKeyW, keyH);
        drawSpaceKeyGraphic(x1 + 8, keyY1 + keyH * 0.36, spaceKeyW - 16, keyH * 0.30, '#0b1a2f');
        x1 += spaceKeyW + labelGap;

        ctx.fillStyle = '#dfeef8';
        ctx.fillText(fireText, x1, keyY1 + keyH / 2 + 1);
        ctx.restore();

        // 第二行：ESC / ST / 点击画布
        const row2Y = PLAY_H / 2 + 80;
        const keySize2 = 46;
        const keyY2 = row2Y - keySize2 / 2;

        ctx.save();
        ctx.font = GO_HINT_FONT;
        const clickText = '点击画布重开';
        const clickTextW = ctx.measureText(clickText).width;
        const escLabel = 'ESC';
        const escLabelW = Math.max(50, ctx.measureText(escLabel).width + 16);
        const stLabel = 'ST';
        const stLabelW = 46;
        const orW = 22;
        const clickIconS = 34;
        const totalW2 = escLabelW + 10 + orW + 10 + stLabelW + 10 + orW + 10 + clickIconS + 6 + clickTextW;
        let hx = (W - totalW2) / 2;

        drawHintKeyWithLabel(hx, keyY2, escLabelW, keySize2, escLabel, GO_HINT_FONT);
        hx += escLabelW + 10;

        ctx.fillStyle = '#dfeef8';
        ctx.font = GO_OR_FONT;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('或', hx + orW / 2, keyY2 + keySize2 / 2 + 1);
        hx += orW + 10;

        drawHintKeyWithLabel(hx, keyY2, stLabelW, keySize2, stLabel, GO_HINT_FONT);
        hx += stLabelW + 10;

        ctx.fillStyle = '#dfeef8';
        ctx.font = GO_OR_FONT;
        ctx.fillText('或', hx + orW / 2, keyY2 + keySize2 / 2 + 1);
        hx += orW + 10;

        const clickIconX = hx + clickIconS / 2;
        const clickIconY = keyY2 + keySize2 / 2;
        ctx.save();
        ctx.strokeStyle = '#dfeef8';
        ctx.fillStyle = '#dfeef8';
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.arc(clickIconX, clickIconY, clickIconS * 0.38, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(clickIconX, clickIconY, clickIconS * 0.10, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(clickIconX, clickIconY - clickIconS * 0.38);
        ctx.lineTo(clickIconX, clickIconY - clickIconS * 0.58);
        ctx.moveTo(clickIconX - clickIconS * 0.24, clickIconY - clickIconS * 0.32);
        ctx.lineTo(clickIconX - clickIconS * 0.38, clickIconY - clickIconS * 0.46);
        ctx.moveTo(clickIconX + clickIconS * 0.24, clickIconY - clickIconS * 0.32);
        ctx.lineTo(clickIconX + clickIconS * 0.38, clickIconY - clickIconS * 0.46);
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = '#dfeef8';
        ctx.font = GO_HINT_FONT;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(clickText, hx + clickIconS + 6, keyY2 + keySize2 / 2 + 1);
        ctx.restore();
    }

    // ==================== 绘制坦克/道具 ====================
    function drawPowerup(p) {
        const cx = p.x + p.w / 2, cy = p.y + p.h / 2, half = p.w / 2;
        const cols = COLOR.pickupColors[p.type];
        const base = cols[0], light = cols[1];
        ctx.save();
        ctx.shadowBlur = 20;
        ctx.shadowColor = light;
        ctx.fillStyle = base;
        roundRectPath(p.x, p.y, p.w, p.h, 12);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = light;
        ctx.lineWidth = 3;
        roundRectPath(p.x + 3, p.y + 3, p.w - 6, p.h - 6, 10);
        ctx.stroke();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        roundRectPath(p.x + 1, p.y + 1, p.w - 2, p.h - 2, 12);
        ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        if (p.type === 'heal') {
            const armLen = half * 0.5, thick = 6 * SCALE;
            ctx.fillRect(cx - thick / 2, cy - armLen, thick, armLen * 2);
            ctx.fillRect(cx - armLen, cy - thick / 2, armLen * 2, thick);
        } else if (p.type === 'split2' || p.type === 'split3') {
            drawSplitIcon(ctx, cx, cy, p.type, 1.5, half * 0.9);
        } else if (p.type === 'shield') {
            ctx.beginPath();
            ctx.moveTo(cx, cy - half * 0.6);
            ctx.lineTo(cx + half * 0.5, cy - half * 0.3);
            ctx.lineTo(cx + half * 0.5, cy + half * 0.15);
            ctx.quadraticCurveTo(cx + half * 0.5, cy + half * 0.55, cx, cy + half * 0.7);
            ctx.quadraticCurveTo(cx - half * 0.5, cy + half * 0.55, cx - half * 0.5, cy + half * 0.15);
            ctx.lineTo(cx - half * 0.5, cy - half * 0.3);
            ctx.closePath();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            ctx.fill();
            ctx.strokeStyle = light;
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.strokeStyle = light;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(cx, cy - half * 0.35);
            ctx.lineTo(cx, cy + half * 0.35);
            ctx.moveTo(cx - half * 0.3, cy);
            ctx.lineTo(cx + half * 0.3, cy);
            ctx.stroke();
        } else if (p.type === 'big') {
            ctx.beginPath();
            ctx.arc(cx, cy, half * 0.6, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx - half * 0.2, cy - half * 0.2, half * 0.18, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 220, 100, 0.9)';
            ctx.fill();
        }
        ctx.restore();
    }

    function drawTank(tank, bodyColor, darkColor, lightColor, isEnemy) {
        const x = tank.x, y = tank.y, w = tank.w, h = tank.h, dir = tank.dir;
        const cx = x + w / 2;
        const baseY = y + h;
        const turretX = cx;
        const turretY = y + h * 0.3;
        const barrelLength = w * 0.8;
        const barrelWidth = isEnemy ? 10 : 11;
        let angle;
        if (tank.isBoss) {
            const bossCenterX = cx;
            const playerCenterX = player.x + player.w / 2;
            const aimDir = playerCenterX < bossCenterX ? -1 : 1;
            angle = aimDir === 1 ? -0.5 : Math.PI + 0.5;
        } else {
            angle = dir === 1 ? -0.5 : Math.PI + 0.5;
        }
        ctx.save();
        ctx.translate(turretX, turretY);
        ctx.rotate(angle);
        ctx.fillStyle = darkColor;
        ctx.fillRect(0, -barrelWidth / 2, barrelLength, barrelWidth);
        ctx.fillStyle = '#222';
        ctx.fillRect(barrelLength - 11, -barrelWidth / 2 - 2, 11, barrelWidth + 4);
        ctx.fillStyle = lightColor;
        ctx.globalAlpha = 0.35;
        ctx.fillRect(3, -barrelWidth / 2 + 1.5, barrelLength - 14, 3);
        ctx.restore();
        ctx.fillStyle = bodyColor;
        ctx.beginPath();
        if (dir === 1) {
            ctx.moveTo(x, y + h * 0.45);
            ctx.lineTo(x + w * 0.65, y + h * 0.15);
            ctx.lineTo(x + w, y + h * 0.3);
            ctx.lineTo(x + w, baseY - 4);
            ctx.lineTo(x, baseY - 4);
            ctx.closePath();
        } else {
            ctx.moveTo(x + w, y + h * 0.45);
            ctx.lineTo(x + w * 0.35, y + h * 0.15);
            ctx.lineTo(x, y + h * 0.3);
            ctx.lineTo(x, baseY - 4);
            ctx.lineTo(x + w, baseY - 4);
            ctx.closePath();
        }
        ctx.fill();
        ctx.strokeStyle = darkColor;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.save();
        ctx.fillStyle = lightColor;
        ctx.globalAlpha = 0.35;
        if (dir === 1) ctx.fillRect(x + w * 0.1, y + h * 0.4, w * 0.5, 3.5);
        else ctx.fillRect(x + w * 0.4, y + h * 0.4, w * 0.5, 3.5);
        ctx.restore();
        ctx.fillStyle = '#2a2a2a';
        roundRectPath(x - 4, baseY - 13, w + 8, 13, 5);
        ctx.fill();
        ctx.fillStyle = '#5a5a5a';
        const wheelCount = Math.max(3, Math.floor(w / 16));
        const wheelSpacing = w / wheelCount;
        for (let i = 0; i < wheelCount; i++) {
            const wx = x + 4 + i * wheelSpacing + wheelSpacing / 2;
            ctx.beginPath();
            ctx.arc(wx, baseY - 6.5, 4, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 2;
        roundRectPath(x - 4, baseY - 13, w + 8, 13, 5);
        ctx.stroke();
        const turretW = w * 0.42;
        const turretH = h * 0.55;
        const turretBaseX = dir === 1 ? x + w * 0.22 : x + w * 0.36;
        ctx.fillStyle = darkColor;
        roundRectPath(turretBaseX, y - 1, turretW, turretH, 7);
        ctx.fill();
        ctx.strokeStyle = '#00000066';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.save();
        ctx.fillStyle = lightColor;
        ctx.globalAlpha = 0.5;
        ctx.fillRect(turretBaseX + 4, y + 2, turretW - 8, 3.5);
        ctx.restore();
        ctx.fillStyle = lightColor;
        roundRectPath(turretBaseX + turretW * 0.25, y - 7, turretW * 0.5, 7, 3);
        ctx.fill();
        if (!isEnemy && tank.activeBullets === 0 && tank.reloadTimer <= 0) {
            const angleM = dir === 1 ? -0.5 : Math.PI + 0.5;
            const muzzleX = turretX + Math.cos(angleM) * barrelLength;
            const muzzleY = turretY + Math.sin(angleM) * barrelLength;
            ctx.save();
            ctx.beginPath();
            ctx.arc(muzzleX, muzzleY, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#ffd93d';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ffaa00';
            ctx.fill();
            ctx.restore();
        }
    }

    function drawHealthBar(tankX, tankW, tankTopY, hp, maxHp) {
        const rows = [];
        let remaining = maxHp;
        while (remaining > 0) {
            rows.push(Math.min(remaining, HP_MAX_PER_ROW));
            remaining -= HP_MAX_PER_ROW;
        }
        const totalHeight = rows.length * HP_DOT_SIZE + (rows.length - 1) * HP_GAP;
        let currentY = tankTopY - HP_MARGIN_TOP - totalHeight;
        const tankCenterX = tankX + tankW / 2;
        const hpColor = hp > 3 ? '#4caf50' : (hp === 3 ? '#ffc107' : '#f44336');
        let hpFilled = 0;
        for (let r = 0; r < rows.length; r++) {
            const rowCount = rows[r];
            const rowTotalWidth = rowCount * HP_DOT_SIZE + (rowCount - 1) * HP_GAP;
            const startX = tankCenterX - rowTotalWidth / 2;
            for (let i = 0; i < rowCount; i++) {
                ctx.fillStyle = (hpFilled + i) < hp ? hpColor : '#55555555';
                roundRectPath(startX + i * (HP_DOT_SIZE + HP_GAP), currentY, HP_DOT_SIZE, HP_DOT_SIZE, 3);
                ctx.fill();
            }
            hpFilled += rowCount;
            currentY += (HP_DOT_SIZE + HP_GAP);
        }
    }

    // ==================== 子弹/爆炸绘制 ====================
    function drawBullet(b) {
        const r = b.radius;
        if (b.isBig) {
            ctx.beginPath();
            ctx.arc(b.x, b.y, r * 1.3, 0, Math.PI * 2);
            const halo = ctx.createRadialGradient(b.x, b.y, r * 0.5, b.x, b.y, r * 1.3);
            halo.addColorStop(0, 'rgba(255, 230, 100, 0.6)');
            halo.addColorStop(1, 'rgba(255, 180, 0, 0)');
            ctx.fillStyle = halo;
            ctx.fill();
        }
        ctx.beginPath();
        ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
        const grad = ctx.createRadialGradient(b.x - r * 0.4, b.y - r * 0.4, 1, b.x, b.y, r);
        if (b.isEnemy) {
            grad.addColorStop(0, '#ffcccc');
            grad.addColorStop(0.5, '#ff6b6b');
            grad.addColorStop(1, '#cc0000');
        } else if (b.isBig) {
            grad.addColorStop(0, '#ffffaa');
            grad.addColorStop(0.4, '#ffcc44');
            grad.addColorStop(1, '#cc6600');
        } else {
            grad.addColorStop(0, '#ffffcc');
            grad.addColorStop(0.5, '#ffd93d');
            grad.addColorStop(1, '#cc9900');
        }
        ctx.fillStyle = grad;
        ctx.shadowBlur = b.isBig ? 28 : 16;
        ctx.shadowColor = b.isEnemy ? '#ff0000' : (b.isBig ? '#ff8800' : '#ffaa00');
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    function drawAirstrikeBullet(b) {
        const r = b.radius;
        ctx.beginPath();
        ctx.arc(b.x, b.y, r * 1.3, 0, Math.PI * 2);
        const halo = ctx.createRadialGradient(b.x, b.y, r * 0.5, b.x, b.y, r * 1.3);
        halo.addColorStop(0, 'rgba(255, 100, 100, 0.7)');
        halo.addColorStop(1, 'rgba(255, 0, 0, 0)');
        ctx.fillStyle = halo;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
        const grad = ctx.createRadialGradient(b.x - r * 0.4, b.y - r * 0.4, 1, b.x, b.y, r);
        grad.addColorStop(0, '#ffbbbb');
        grad.addColorStop(0.4, '#ff4444');
        grad.addColorStop(1, '#880000');
        ctx.fillStyle = grad;
        ctx.shadowBlur = 30;
        ctx.shadowColor = '#ff0000';
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    function drawExplosion(e) {
        const alpha = e.life / e.maxLife;
        switch (e.type) {
            case 'spark':
            case 'boss-particle':
            case 'tank-particle':
            case 'clash-spark':
            case 'big-ground-particle':
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
                ctx.fillStyle = e.color;
                ctx.shadowBlur = 16;
                ctx.shadowColor = e.color;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
                break;
            case 'boss-smoke':
            case 'tank-smoke':
            case 'big-ground-smoke':
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(90, 90, 90, ' + (alpha * 0.5) + ')';
                ctx.fill();
                break;
            case 'clash-core': {
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                const cg = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.radius);
                cg.addColorStop(0, 'rgba(255, 255, 255, ' + alpha + ')');
                cg.addColorStop(0.5, 'rgba(255, 255, 180, ' + (alpha * 0.9) + ')');
                cg.addColorStop(1, 'rgba(255, 200, 50, 0)');
                ctx.fillStyle = cg;
                ctx.shadowBlur = 50;
                ctx.shadowColor = '#ffee88';
                ctx.fill();
                ctx.shadowBlur = 0;
                break;
            }
            case 'clash-ring': {
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 220, 80, ' + alpha + ')';
                ctx.lineWidth = 6 + (1 - alpha) * 8;
                ctx.shadowBlur = 35;
                ctx.shadowColor = '#ffcc00';
                ctx.stroke();
                ctx.shadowBlur = 0;
                break;
            }
            case 'clash-ring2': {
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 100, 50, ' + alpha + ')';
                ctx.lineWidth = 4 + (1 - alpha) * 5;
                ctx.shadowBlur = 25;
                ctx.shadowColor = '#ff5500';
                ctx.stroke();
                ctx.shadowBlur = 0;
                break;
            }
            case 'boss-core':
            case 'big-ground-core': {
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                const bg = ctx.createRadialGradient(e.x, e.y, e.radius * 0.2, e.x, e.y, e.radius);
                bg.addColorStop(0, 'rgba(255, 255, 200, ' + alpha + ')');
                bg.addColorStop(0.4, 'rgba(255, 180, 40, ' + (alpha * 0.95) + ')');
                bg.addColorStop(0.8, 'rgba(255, 80, 20, ' + (alpha * 0.8) + ')');
                bg.addColorStop(1, 'rgba(180, 20, 0, 0)');
                ctx.fillStyle = bg;
                ctx.shadowBlur = 45;
                ctx.shadowColor = '#ff4400';
                ctx.fill();
                ctx.shadowBlur = 0;
                break;
            }
            case 'boss-secondary': {
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                const bg = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.radius);
                bg.addColorStop(0, 'rgba(255, 255, 220, ' + alpha + ')');
                bg.addColorStop(0.5, 'rgba(255, 200, 60, ' + (alpha * 0.9) + ')');
                bg.addColorStop(1, 'rgba(255, 100, 0, 0)');
                ctx.fillStyle = bg;
                ctx.shadowBlur = 35;
                ctx.shadowColor = '#ffaa00';
                ctx.fill();
                ctx.shadowBlur = 0;
                break;
            }
            case 'boss-ring': {
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 220, 100, ' + alpha + ')';
                ctx.lineWidth = 6 + (1 - alpha) * 6;
                ctx.shadowBlur = 30;
                ctx.shadowColor = '#ffcc00';
                ctx.stroke();
                ctx.shadowBlur = 0;
                break;
            }
            case 'big-ground-ring': {
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 200, 80, ' + alpha + ')';
                ctx.lineWidth = 8 + (1 - alpha) * 8;
                ctx.shadowBlur = 40;
                ctx.shadowColor = '#ffaa00';
                ctx.stroke();
                ctx.shadowBlur = 0;
                break;
            }
            case 'tank-core': {
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 100, 30, ' + (alpha * 0.9) + ')';
                ctx.shadowBlur = 30;
                ctx.shadowColor = '#ff4400';
                ctx.fill();
                ctx.shadowBlur = 0;
                break;
            }
            default: {
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 180, 50, ' + (alpha * 0.8) + ')';
                ctx.shadowBlur = 30;
                ctx.shadowColor = '#ff6600';
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }
    }

    function drawShield() {
        const pulse = 0.5 + 0.5 * Math.sin(buffPulse);
        const radius = player.w * 0.75 + pulse * 6;
        const cx = player.x + player.w / 2, cy = player.y + player.h / 2;
        const shieldGrad = ctx.createRadialGradient(cx, cy, radius * 0.5, cx, cy, radius);
        shieldGrad.addColorStop(0, 'rgba(249, 202, 36, 0)');
        shieldGrad.addColorStop(0.7, 'rgba(249, 202, 36, ' + (0.25 + pulse * 0.15) + ')');
        shieldGrad.addColorStop(1, 'rgba(249, 202, 36, 0)');
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fillStyle = shieldGrad;
        ctx.fill();
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 220, 100, ' + (0.6 + pulse * 0.3) + ')';
        ctx.lineWidth = 3.5;
        ctx.shadowBlur = 20 + pulse * 12;
        ctx.shadowColor = '#f9ca24';
        ctx.stroke();
        ctx.restore();
        for (let k = 0; k < 6; k++) {
            const angle = buffPulse * 2 + k * Math.PI * 0.33;
            const px = cx + Math.cos(angle) * radius * 0.85;
            const py = cy + Math.sin(angle) * radius * 0.85;
            ctx.beginPath();
            ctx.arc(px, py, 3 + pulse * 2, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 240, 150, ' + (0.7 + pulse * 0.3) + ')';
            ctx.fill();
        }
    }

    function drawStillWarning() {
        const warnBoxSize = 70 * SCALE;
        const warnX = stillWarningX - warnBoxSize / 2;
        const warnY = 22 * SCALE;
        ctx.save();
        ctx.strokeStyle = '#ff2222';
        ctx.lineWidth = 5;
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#ff0000';
        roundRectPath(warnX, warnY, warnBoxSize, warnBoxSize, 10);
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255, 0, 0, 0.18)';
        roundRectPath(warnX, warnY, warnBoxSize, warnBoxSize, 10);
        ctx.fill();
        ctx.fillStyle = '#ff2222';
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ff0000';
        const ex = stillWarningX;
        const barW = warnBoxSize * 0.16;
        const barH = warnBoxSize * 0.40;
        const dotR = warnBoxSize * 0.10;
        const gap = warnBoxSize * 0.06;
        const totalH = barH + gap + dotR * 2;
        const topY = warnY + (warnBoxSize - totalH) / 2;
        roundRectPath(ex - barW / 2, topY, barW, barH, barW / 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(ex, topY + barH + gap + dotR, dotR, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    function drawReloadBar() {
        const barH = 6 * SCALE;
        if (player.reloadTimer > 0) {
            const ratio = 1 - player.reloadTimer / RELOAD_DURATION;
            ctx.fillStyle = '#ffffff44';
            ctx.fillRect(player.x, player.y + player.h + 8 * SCALE, player.w, barH);
            ctx.fillStyle = '#ffd93d';
            ctx.fillRect(player.x, player.y + player.h + 8 * SCALE, player.w * ratio, barH);
        } else if (player.activeBullets > 0) {
            ctx.fillStyle = '#ff6b6b88';
            ctx.fillRect(player.x, player.y + player.h + 8 * SCALE, player.w, barH);
        }
    }

    // ==================== 主绘制 ====================
    let buffPulse = 0;

    function draw() {
        applyCanvasTransform();
        ctx.clearRect(0, 0, W, H);

        buffPulse = (buffPulse + 0.1) % (Math.PI * 2);

        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, W, PLAY_H);

        drawClouds();
        drawMountains();
        drawTerrain();

        for (let i = 0; i < powerups.length; i++) drawPowerup(powerups[i]);

        for (let i = 0; i < enemies.length; i++) {
            const e = enemies[i];
            const colors = e.isBoss ? COLOR.boss :
                          (e.hasSplitShot ? COLOR.enemySplit :
                          (e.hasFastFire ? COLOR.enemyFast : COLOR.enemyNormal));
            drawTank(e, colors[0], colors[1], colors[2], true);
        }

        drawTank(player, COLOR.player[0], COLOR.player[1], COLOR.player[2], false);

        for (let i = 0; i < bullets.length; i++) drawBullet(bullets[i]);
        if (airstrikeBullet) drawAirstrikeBullet(airstrikeBullet);

        for (let i = 0; i < explosions.length; i++) drawExplosion(explosions[i]);

        for (let i = 0; i < enemies.length; i++) {
            const e = enemies[i];
            if (e.maxHp > 1) drawHealthBar(e.x, e.w, e.y, e.hp, e.maxHp);
        }
        drawHealthBar(player.x, player.w, player.y, playerHP, maxHP);

        if (stillWarningActive) drawStillWarning();
        if (player.shield > 0) drawShield();

        drawReloadBar();

        if (gameOver) drawGameOver();

        drawHud();

        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
    }

    // ==================== 手柄 ====================
    function pollGamepad() {
        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        let gp = null;
        for (let i = 0; i < gamepads.length; i++) {
            if (gamepads[i] && gamepads[i].connected) { gp = gamepads[i]; gamepadIndex = i; break; }
        }
        if (gp && !gamepadConnected) {
            gamepadConnected = true;
        } else if (!gp && gamepadConnected) {
            gamepadConnected = false;
            gamepadLeft = false;
            gamepadRight = false;
            gamepadA = false;
            prevGamepadButtons.A = false;
            prevGamepadButtons.Start = false;
        }
        if (!gp) return;
        const buttons = gp.buttons;
        gamepadLeft = !!(buttons[14] && (buttons[14].pressed || buttons[14].value > 0.5));
        gamepadRight = !!(buttons[15] && (buttons[15].pressed || buttons[15].value > 0.5));
        gamepadA = !!(buttons[0] && (buttons[0].pressed || buttons[0].value > 0.5));
        const startPressed = !!(buttons[9] && (buttons[9].pressed || buttons[9].value > 0.5));
        if (startPressed && !prevGamepadButtons.Start && gameOver) restartGame();
        prevGamepadButtons.Start = startPressed;
        prevGamepadButtons.A = gamepadA;
    }

    // ==================== 输入 ====================
    window.addEventListener('keydown', (e) => {
        initAudio();
        const key = e.key;
        if (key === 'ArrowLeft' || key === 'ArrowRight' || key === ' ') e.preventDefault();
        if (key === 'ArrowLeft') keys.ArrowLeft = true;
        else if (key === 'ArrowRight') keys.ArrowRight = true;
        else if (key === ' ') keys.Space = true;
        else if (key === 'Escape') { e.preventDefault(); escPressed = true; }
    });

    window.addEventListener('keyup', (e) => {
        const key = e.key;
        if (key === 'ArrowLeft') keys.ArrowLeft = false;
        else if (key === 'ArrowRight') keys.ArrowRight = false;
        else if (key === ' ') keys.Space = false;
        else if (key === 'Escape') { e.preventDefault(); escPressed = false; }
        if (key === 'ArrowLeft' || key === 'ArrowRight' || key === ' ') e.preventDefault();
    });

    canvas.addEventListener('click', () => {
        initAudio();
        if (gameOver) restartGame();
    });

    // ==================== 重新开始 ====================
    function restartGame() {
        if (isPlaying) saveTotalTime();
        randomizeTerrain();
        generateMountains();
        generateClouds();
        score = 0;
        playerHP = maxHP;
        bossLevel = 0;
        enemyKillCount = 0;
        nextBossThreshold = 10;
        gameOver = false;
        enemies.length = 0;
        bullets.length = 0;
        explosions.length = 0;
        powerups.length = 0;
        enemySpawnTimer = 0;
        lastPowerupType = null;
        resetPlayer();
        keys.ArrowLeft = false;
        keys.ArrowRight = false;
        keys.Space = false;
        gamepadLeft = false;
        gamepadRight = false;
        gamepadA = false;
        escPressed = false;
        prevEscPressed = false;
        sessionStartTime = performance.now();
        isPlaying = true;
        hudDirty = true;
        hudLastTime = 0;
        hudLastBossMaxHp = -1;
    }

    // ==================== 主循环 ====================
    let lastTimestamp = 0;
    function gameLoop(timestamp) {
        if (!lastTimestamp) lastTimestamp = timestamp;
        let dt = (timestamp - lastTimestamp) / 1000;
        lastTimestamp = timestamp;
        if (dt > 0.1) dt = 0.1;
        else if (dt < 0.001) dt = 0.001;

        pollGamepad();

        if (escPressed && !prevEscPressed && gameOver) restartGame();
        prevEscPressed = escPressed;

        if (!gameOver) {
            if (isPlaying && sessionStartTime > 0) totalPlayTime += dt;
            update(dt);
        } else if (isPlaying) {
            saveTotalTime();
            isPlaying = false;
        }
        draw();
        requestAnimationFrame(gameLoop);
    }

    // ==================== 事件 ====================
    window.addEventListener('blur', () => {
        keys.ArrowLeft = false;
        keys.ArrowRight = false;
        keys.Space = false;
        escPressed = false;
    });

    window.addEventListener('gamepadconnected', (e) => {
        gamepadConnected = true;
        gamepadIndex = e.gamepad.index;
        initAudio();
    });

    window.addEventListener('gamepaddisconnected', () => {
        gamepadConnected = false;
        gamepadIndex = -1;
    });

    if (!CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            this.beginPath();
            this.moveTo(x + r, y);
            this.arcTo(x + w, y, x + w, y + h, r);
            this.arcTo(x + w, y + h, x, y + h, r);
            this.arcTo(x, y + h, x, y, r);
            this.arcTo(x, y, x + w, y, r);
            this.closePath();
            return this;
        };
    }

    // ==================== 初始化 ====================
    refreshCachedPad();
    loadHighScore();
    loadTotalTime();
    updateFullscreenButton();
    resizeCanvas();
    rebuildGradients();
    restartGame();
    spawnEnemy(false);
    requestAnimationFrame(() => {
        resizeCanvas();
        requestAnimationFrame(resizeCanvas);
    });
    requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
