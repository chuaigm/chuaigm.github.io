<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坦克大战 · 起伏地形</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #0b1a2f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
        }
        .game-container {
            background: #1e2f4a;
            padding: 20px 20px 18px 20px;
            border-radius: 24px;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            display: block;
            width: 900px;
            height: 400px;
            border-radius: 16px;
            box-shadow: inset 0 0 20px #00000055, 0 6px 12px black;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            width: 900px;
            color: #c4e2f0;
            font-weight: bold;
            font-size: 1.05rem;
            text-shadow: 0 2px 4px black;
            gap: 8px;
        }
        .status-bar .score-box,
        .status-bar .hp-box,
        .status-bar .boss-box {
            background: #0d1b2a;
            padding: 6px 16px;
            border-radius: 40px;
            box-shadow: inset 0 1px 6px #00000088, 0 4px 4px #00000033;
            white-space: nowrap;
        }
        .status-bar .hp-box {
            color: #f28b82;
        }
        .status-bar .boss-box {
            color: #ffd966;
        }
        .status-bar .buff-box {
            display: none;
            align-items: center;
            justify-content: center;
        }
        .status-bar .buff-box.visible {
            display: flex;
        }
        .status-bar .buff-box canvas {
            display: block;
            width: 32px;
            height: 32px;
        }
        .gamepad-icon {
            font-size: 1.2rem;
            background: #0d1b2a;
            padding: 5px 12px;
            border-radius: 30px;
            box-shadow: inset 0 1px 6px #00000088, 0 4px 4px #00000033;
            color: #7ee8a2;
            display: none;
            line-height: 1;
            white-space: nowrap;
        }
        .gamepad-icon.connected {
            display: inline-block;
        }
        .key-hint {
            display: flex;
            gap: 10px;
            color: #aac9e0;
            font-size: 0.8rem;
            background: #0d1b2a90;
            padding: 6px 14px;
            border-radius: 40px;
            white-space: nowrap;
        }
        .key-hint kbd {
            background: #f0f3f8;
            color: #0b1a2f;
            border-radius: 5px;
            padding: 1px 6px;
            font-weight: bold;
            margin: 0 1px;
            box-shadow: 0 2px 0 #5a6f88;
        }
    </style>
</head>
<body>
<div class="game-container">
    <canvas id="gameCanvas" width="900" height="400"></canvas>
    <div class="status-bar">
        <span class="score-box">🏆 分数: <span id="scoreDisplay">0</span></span>
        <span class="hp-box">❤️ 生命: <span id="hpDisplay">5</span></span>
        <span class="boss-box">👑 Boss: <span id="bossDisplay">0</span></span>
        <span class="buff-box" id="buffBox">
            <canvas id="buffCanvas" width="64" height="64"></canvas>
        </span>
        <span class="gamepad-icon" id="gamepadIcon">🎮</span>
        <div class="key-hint">
            <span><kbd>←</kbd><kbd>→</kbd>移动</span>
            <span><kbd>空格</kbd>发射</span>
            <span><kbd>R</kbd>重开</span>
        </div>
    </div>
</div>
<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');
        const hpSpan = document.getElementById('hpDisplay');
        const bossSpan = document.getElementById('bossDisplay');
        const gamepadIcon = document.getElementById('gamepadIcon');
        const buffBox = document.getElementById('buffBox');
        const buffCanvas = document.getElementById('buffCanvas');
        const buffCtx = buffCanvas.getContext('2d');

        const W = 900, H = 400;

        // ---------- 帧率无关基准 ----------
        const FPS_BASE = 60;

        // 抛物线重力加速度：原来的帧重力是 0.18 像素/帧²
        // 换算：0.18 像素/帧² × 60² 帧²/秒² = 648 像素/秒²
        const BULLET_GRAVITY = 0.18 * FPS_BASE * FPS_BASE;   // = 648 像素/秒²

        // 道具重力：0.3 像素/帧² → 0.3 × 3600 = 1080 像素/秒²
        const POWERUP_GRAVITY = 0.3 * FPS_BASE * FPS_BASE;

        // ---------- 音效 ----------
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    audioCtx = null;
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playFireSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.exponentialRampToValueAtTime(60, now + 0.25);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(600, now);
            filter.frequency.exponentialRampToValueAtTime(150, now + 0.25);
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.3);

            const bufferSize = audioCtx.sampleRate * 0.12;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.12, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'lowpass';
            noiseFilter.frequency.setValueAtTime(500, now);
            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noise.start(now);
            noise.stop(now + 0.15);
        }

        function playHitSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.18);
            gain.gain.setValueAtTime(0.22, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(800, now);
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.22);
        }

        function playBulletClashSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const bufferSize = audioCtx.sampleRate * 0.35;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 1.3);
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.55, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(600, now);
            filter.frequency.exponentialRampToValueAtTime(80, now + 0.4);
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start(now);
            noise.stop(now + 0.4);

            const osc = audioCtx.createOscillator();
            const oscGain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
            oscGain.gain.setValueAtTime(0.4, now);
            oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
            osc.connect(oscGain);
            oscGain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.35);
        }

        function playExplosionSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const bufferSize = audioCtx.sampleRate * 0.25;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 1.5);
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.28, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(400, now);
            filter.frequency.exponentialRampToValueAtTime(80, now + 0.3);
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start(now);
            noise.stop(now + 0.3);
        }

        function playPlayerHitSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc1.type = 'square';
            osc2.type = 'sawtooth';
            osc1.frequency.setValueAtTime(220, now);
            osc1.frequency.exponentialRampToValueAtTime(80, now + 0.2);
            osc2.frequency.setValueAtTime(160, now);
            osc2.frequency.exponentialRampToValueAtTime(60, now + 0.2);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1000, now);
            filter.frequency.exponentialRampToValueAtTime(200, now + 0.2);
            osc1.connect(filter);
            osc2.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            osc1.start(now);
            osc2.start(now);
            osc1.stop(now + 0.25);
            osc2.stop(now + 0.25);
        }

        // ---------- 地形 ----------
        let terrainParams = {
            baseOffset: 0,
            wave1: { amp: 0, freq: 0, phase: 0 },
            wave2: { amp: 0, freq: 0, phase: 0 },
            wave3: { amp: 0, freq: 0, phase: 0 }
        };

        function randomRange(min, max) {
            return Math.random() * (max - min) + min;
        }

        function randomizeTerrain() {
            terrainParams = {
                baseOffset: randomRange(-8, 8),
                wave1: {
                    amp: randomRange(10, 26),
                    freq: randomRange(0.005, 0.012),
                    phase: randomRange(0, Math.PI * 2)
                },
                wave2: {
                    amp: randomRange(5, 14),
                    freq: randomRange(0.015, 0.028),
                    phase: randomRange(0, Math.PI * 2)
                },
                wave3: {
                    amp: randomRange(2, 6),
                    freq: randomRange(0.04, 0.07),
                    phase: randomRange(0, Math.PI * 2)
                }
            };
        }

        function terrainY(x) {
            const base = H - 50 + terrainParams.baseOffset;
            const wave1 = Math.sin(x * terrainParams.wave1.freq + terrainParams.wave1.phase) * terrainParams.wave1.amp;
            const wave2 = Math.sin(x * terrainParams.wave2.freq + terrainParams.wave2.phase) * terrainParams.wave2.amp;
            const wave3 = Math.sin(x * terrainParams.wave3.freq + terrainParams.wave3.phase) * terrainParams.wave3.amp;
            return base + wave1 + wave2 + wave3;
        }

        function drawTerrain() {
            ctx.beginPath();
            ctx.moveTo(0, H);
            for (let x = 0; x <= W; x += 4) {
                ctx.lineTo(x, terrainY(x));
            }
            ctx.lineTo(W, H);
            ctx.closePath();
            const grad = ctx.createLinearGradient(0, H - 80, 0, H);
            grad.addColorStop(0, '#6b8f5e');
            grad.addColorStop(0.5, '#4f7048');
            grad.addColorStop(1, '#3a5434');
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.strokeStyle = '#2a3d24';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // ---------- 游戏状态 ----------
        let score = 0;
        let playerHP = 5;
        const maxHP = 5;
        let gameOver = false;
        let bossLevel = 0;
        let enemyKillCount = 0;
        let nextBossThreshold = 10;

        const player = {
            x: 150,
            y: 0,
            w: 56,
            h: 26,
            speed: 2.2 * FPS_BASE,
            dir: 1,
            reloadTimer: 0,
            activeBullets: 0,
            shield: 0,
            splitShot: 1
        };

        const RELOAD_DURATION = 12 / FPS_BASE;

        let enemies = [];
        let bullets = [];
        let explosions = [];
        let powerups = [];

        let enemySpawnTimer = 0;
        const ENEMY_SPAWN_INTERVAL_BASE = 150 / FPS_BASE;
        const ENEMY_SPAWN_INTERVAL_FAST = 40 / FPS_BASE;
        const ENEMY_COUNT_THRESHOLD = 5;

        let lastPowerupType = null;

        let keys = {
            ArrowLeft: false,
            ArrowRight: false,
            Space: false
        };

        let gamepadConnected = false;
        let gamepadIndex = -1;
        let gamepadLeft = false;
        let gamepadRight = false;
        let gamepadA = false;
        let prevGamepadButtons = {
            A: false,
            Start: false
        };

        function getTankBottom(tank) {
            return {
                x: tank.x + tank.w / 2,
                y: terrainY(tank.x + tank.w / 2)
            };
        }

        function snapToTerrain(tank) {
            const bottom = getTankBottom(tank);
            tank.y = bottom.y - tank.h;
        }

        function drawBuffIcon(type) {
            const w = 64, h = 64;
            buffCtx.clearRect(0, 0, w, h);
            if (!type) return;

            const cx = w / 2, cy = h / 2;

            buffCtx.save();
            buffCtx.shadowBlur = 10;
            buffCtx.shadowColor = type === 'split2' ? '#16a085' : '#2980b9';

            buffCtx.fillStyle = '#ffffff';
            if (type === 'split2') {
                drawArrowOnCtx(buffCtx, cx - 12, cy + 4, 0, 16, 8);
                drawArrowOnCtx(buffCtx, cx + 12, cy + 4, 0, 16, 8);
            } else if (type === 'split3') {
                drawArrowOnCtx(buffCtx, cx - 17, cy + 4, 0, 13, 7);
                drawArrowOnCtx(buffCtx, cx, cy + 4, 0, 16, 8);
                drawArrowOnCtx(buffCtx, cx + 17, cy + 4, 0, 13, 7);
            }
            buffCtx.restore();
        }

        function drawArrowOnCtx(c, x, y, angle, length, width) {
            c.save();
            c.translate(x, y);
            c.rotate(angle);
            c.beginPath();
            c.moveTo(0, -length);
            c.lineTo(width, -length + width * 1.5);
            c.lineTo(width * 0.4, -length + width * 1.5);
            c.lineTo(width * 0.4, length * 0.4);
            c.lineTo(-width * 0.4, length * 0.4);
            c.lineTo(-width * 0.4, -length + width * 1.5);
            c.lineTo(-width, -length + width * 1.5);
            c.closePath();
            c.fillStyle = '#ffffff';
            c.fill();
            c.restore();
        }

        function updateBuffDisplay() {
            let type = null;
            if (player.splitShot === 3) {
                type = 'split3';
            } else if (player.splitShot === 2) {
                type = 'split2';
            }

            if (type) {
                drawBuffIcon(type);
                buffBox.classList.add('visible');
            } else {
                buffBox.classList.remove('visible');
            }
        }

        function resetPlayer() {
            player.x = 150;
            player.dir = 1;
            player.reloadTimer = 0;
            player.activeBullets = 0;
            player.shield = 0;
            player.splitShot = 1;
            snapToTerrain(player);
            updateBuffDisplay();
        }

        function spawnEnemy(isBoss = false) {
            const dir = Math.random() < 0.5 ? 1 : -1;
            const startX = dir === 1 ? -70 : W + 70;
            const w = isBoss ? 78 : 52;
            const h = isBoss ? 36 : 24;

            let hp = 1;
            let enemySplitShot = 1;
            let cooldownValue;
            let maxCooldownValue;
            let hasSplitShot = false;
            let hasFastFire = false;

            if (isBoss) {
                hp = 2 + bossLevel;
                const r = Math.random();
                if (r < 0.5) {
                    enemySplitShot = 1;
                    cooldownValue = 55 / FPS_BASE;
                    maxCooldownValue = 70 / FPS_BASE;
                } else if (r < 0.8) {
                    enemySplitShot = 2;
                    cooldownValue = 85 / FPS_BASE;
                    maxCooldownValue = 105 / FPS_BASE;
                } else {
                    enemySplitShot = 3;
                    cooldownValue = 110 / FPS_BASE;
                    maxCooldownValue = 135 / FPS_BASE;
                }
            } else {
                cooldownValue = randomRange(100, 170) / FPS_BASE;
                maxCooldownValue = 160 / FPS_BASE;

                if (Math.random() < 0.05) {
                    enemySplitShot = 2;
                    hasSplitShot = true;
                }

                if (!hasSplitShot && Math.random() < 0.05) {
                    hasFastFire = true;
                    cooldownValue = randomRange(55, 85) / FPS_BASE;
                    maxCooldownValue = 85 / FPS_BASE;
                }
            }

            const enemy = {
                x: startX,
                y: 0,
                w: w,
                h: h,
                speed: (isBoss ? 0.9 : 1.2) * FPS_BASE,
                dir: dir,
                cooldown: cooldownValue,
                maxCooldown: maxCooldownValue,
                hp: hp,
                maxHp: hp,
                isBoss: isBoss,
                splitShot: enemySplitShot,
                hasSplitShot: hasSplitShot,
                hasFastFire: hasFastFire
            };
            snapToTerrain(enemy);
            enemies.push(enemy);
        }

        function firePlayerBullet(angleOffset = 0) {
            const bottom = getTankBottom(player);
            const barrelLength = player.w * 0.75;
            const baseAngle = -0.6;
            const angle = baseAngle + angleOffset;
            const speed = 6.0 * FPS_BASE;
            const vx = Math.cos(angle) * speed * player.dir;
            const vy = Math.sin(angle) * speed;

            const turretX = player.x + player.w / 2;
            const turretY = player.y + player.h * 0.35;
            const muzzleX = turretX + Math.cos(angle) * barrelLength * player.dir;
            const muzzleY = turretY + Math.sin(angle) * barrelLength;

            bullets.push({
                x: muzzleX,
                y: muzzleY,
                vx: vx,
                vy: vy,
                isEnemy: false,
                radius: 7,
                life: 300 / FPS_BASE,
                isPlayerBullet: true,
                id: Math.random()
            });

            player.activeBullets++;
            playFireSound();
        }

        function enemyFire(enemy) {
            let fireDir = enemy.dir;
            if (enemy.isBoss) {
                const bossCenterX = enemy.x + enemy.w / 2;
                const playerCenterX = player.x + player.w / 2;
                fireDir = playerCenterX < bossCenterX ? -1 : 1;
            }

            const splitCount = enemy.splitShot || 1;
            for (let i = 0; i < splitCount; i++) {
                const spread = splitCount > 1 ? (i - (splitCount - 1) / 2) * 0.22 : 0;
                const bottom = getTankBottom(enemy);
                const barrelLength = enemy.w * 0.75;
                const baseAngle = -0.6;
                const angle = baseAngle + spread;
                const speed = 5.0 * FPS_BASE;
                const vx = Math.cos(angle) * speed * fireDir;
                const vy = Math.sin(angle) * speed;

                const turretX = enemy.x + enemy.w / 2;
                const turretY = enemy.y + enemy.h * 0.35;
                const muzzleX = turretX + Math.cos(angle) * barrelLength * fireDir;
                const muzzleY = turretY + Math.sin(angle) * barrelLength;

                bullets.push({
                    x: muzzleX,
                    y: muzzleY,
                    vx: vx,
                    vy: vy,
                    isEnemy: true,
                    radius: 7,
                    life: 300 / FPS_BASE,
                    isPlayerBullet: false,
                    id: Math.random()
                });
            }
        }

        function pointInTank(px, py, tank, paddingX = 4, paddingY = 3) {
            return px > tank.x - paddingX &&
                   px < tank.x + tank.w + paddingX &&
                   py > tank.y - paddingY &&
                   py < tank.y + tank.h + paddingY;
        }

        function bulletsCollide(b1, b2) {
            const dx = b1.x - b2.x;
            const dy = b1.y - b2.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            return dist < b1.radius + b2.radius;
        }

        function onPlayerBulletDestroyed() {
            if (player.activeBullets > 0) {
                player.activeBullets--;
            }
            if (player.activeBullets === 0) {
                player.reloadTimer = RELOAD_DURATION;
            }
        }

        function handleBulletClashes() {
            let clashHappened = false;
            const toRemove = new Set();

            for (let i = 0; i < bullets.length; i++) {
                const b1 = bullets[i];
                if (!b1 || !b1.isPlayerBullet) continue;
                if (toRemove.has(b1.id)) continue;

                for (let j = 0; j < bullets.length; j++) {
                    const b2 = bullets[j];
                    if (!b2 || b1 === b2) continue;
                    if (!b2.isEnemy) continue;
                    if (toRemove.has(b2.id)) continue;

                    if (bulletsCollide(b1, b2)) {
                        const cx = (b1.x + b2.x) / 2;
                        const cy = (b1.y + b2.y) / 2;
                        createExplosion(cx, cy, 22);
                        playBulletClashSound();
                        score += 10;
                        scoreSpan.innerText = score;

                        toRemove.add(b1.id);
                        toRemove.add(b2.id);
                        clashHappened = true;
                        break;
                    }
                }
            }

            if (toRemove.size > 0) {
                for (let i = bullets.length - 1; i >= 0; i--) {
                    if (toRemove.has(bullets[i].id)) {
                        const b = bullets[i];
                        bullets.splice(i, 1);
                        if (b.isPlayerBullet) {
                            onPlayerBulletDestroyed();
                        }
                    }
                }
            }

            return clashHappened;
        }

        function checkBulletCollisions() {
            handleBulletClashes();

            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                if (!b) continue;
                if (b.life <= 0) {
                    bullets.splice(i, 1);
                    if (b.isPlayerBullet) onPlayerBulletDestroyed();
                    continue;
                }

                const groundY = terrainY(b.x);
                if (b.y >= groundY) {
                    createExplosion(b.x, groundY, 24);
                    playExplosionSound();
                    bullets.splice(i, 1);
                    if (b.isPlayerBullet) onPlayerBulletDestroyed();
                    continue;
                }

                if (b.isEnemy) {
                    if (!gameOver && pointInTank(b.x, b.y, player, 6, 4)) {
                        if (player.shield > 0) {
                            player.shield = 0;
                        } else {
                            playerHP--;
                            hpSpan.innerText = playerHP;
                            player.splitShot = 1;
                            updateBuffDisplay();
                            if (playerHP <= 0) {
                                gameOver = true;
                            }
                        }
                        createExplosion(b.x, b.y, 20);
                        playPlayerHitSound();
                        bullets.splice(i, 1);
                        continue;
                    }
                } else {
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        const e = enemies[j];
                        if (pointInTank(b.x, b.y, e, 6, 4)) {
                            e.hp -= 1;
                            createExplosion(b.x, b.y, 16);
                            playHitSound();
                            bullets.splice(i, 1);

                            if (b.isPlayerBullet) onPlayerBulletDestroyed();

                            if (e.hp <= 0) {
                                if (e.isBoss) {
                                    bossLevel++;
                                    bossSpan.innerText = bossLevel;
                                    dropPowerup(e.x + e.w / 2, e.y);
                                } else {
                                    enemyKillCount++;
                                    if (enemyKillCount >= nextBossThreshold) {
                                        enemyKillCount = 0;
                                        spawnEnemy(true);
                                    }
                                }
                                enemies.splice(j, 1);
                                score += 10;
                                scoreSpan.innerText = score;
                            }
                            break;
                        }
                    }
                }
            }
        }

        function createExplosion(x, y, radius) {
            explosions.push({
                x: x,
                y: y,
                radius: radius,
                maxRadius: radius * 1.8,
                life: 15 / FPS_BASE,
                maxLife: 15 / FPS_BASE
            });
        }

        function updateExplosions(dt) {
            for (let i = explosions.length - 1; i >= 0; i--) {
                const e = explosions[i];
                e.life -= dt;
                e.radius = e.maxRadius * (1 - e.life / e.maxLife);
                if (e.life <= 0) {
                    explosions.splice(i, 1);
                }
            }
        }

        function dropPowerup(x, y) {
            const allTypes = ['heal', 'split2', 'split3', 'shield'];
            let available = allTypes.filter(t => t !== lastPowerupType);
            if (available.length === 0) available = allTypes;

            const type = available[Math.floor(Math.random() * available.length)];
            lastPowerupType = type;

            powerups.push({
                x: x - 18,
                y: y,
                w: 36,
                h: 36,
                type: type,
                vy: -2 * FPS_BASE,
                life: 900 / FPS_BASE
            });
        }

        function updatePowerups(dt) {
            for (let i = powerups.length - 1; i >= 0; i--) {
                const p = powerups[i];
                p.life -= dt;
                // 道具重力：使用 POWERUP_GRAVITY
                p.vy += POWERUP_GRAVITY * dt;
                p.y += p.vy * dt;

                const groundY = terrainY(p.x + p.w / 2);
                if (p.y + p.h > groundY) {
                    p.y = groundY - p.h;
                    p.vy = 0;
                }

                if (!gameOver && p.x < player.x + player.w && p.x + p.w > player.x &&
                    p.y < player.y + player.h && p.y + p.h > player.y) {
                    applyPowerup(p.type);
                    powerups.splice(i, 1);
                    continue;
                }

                if (p.life <= 0) {
                    powerups.splice(i, 1);
                }
            }
        }

        function applyPowerup(type) {
            switch (type) {
                case 'heal':
                    if (playerHP < maxHP) {
                        playerHP++;
                        hpSpan.innerText = playerHP;
                    }
                    break;
                case 'split2':
                    player.splitShot = 2;
                    break;
                case 'split3':
                    player.splitShot = 3;
                    break;
                case 'shield':
                    player.shield = 1;
                    break;
            }
            updateBuffDisplay();
        }

        function getDynamicSpawnInterval() {
            const count = enemies.length;
            if (count < ENEMY_COUNT_THRESHOLD) {
                const ratio = count / ENEMY_COUNT_THRESHOLD;
                return ENEMY_SPAWN_INTERVAL_FAST + (ENEMY_SPAWN_INTERVAL_BASE - ENEMY_SPAWN_INTERVAL_FAST) * ratio;
            } else if (count > ENEMY_COUNT_THRESHOLD) {
                const extra = Math.min(count - ENEMY_COUNT_THRESHOLD, 5);
                return ENEMY_SPAWN_INTERVAL_BASE + extra * (18 / FPS_BASE);
            } else {
                return ENEMY_SPAWN_INTERVAL_BASE;
            }
        }

        function update(dt) {
            if (gameOver) return;

            if (keys.ArrowLeft || (gamepadConnected && gamepadLeft)) {
                player.x -= player.speed * dt;
                player.dir = -1;
            }
            if (keys.ArrowRight || (gamepadConnected && gamepadRight)) {
                player.x += player.speed * dt;
                player.dir = 1;
            }
            if (player.x < 0) player.x = 0;
            if (player.x + player.w > W) player.x = W - player.w;
            snapToTerrain(player);

            if (player.reloadTimer > 0) player.reloadTimer -= dt;

            const canFire = player.activeBullets === 0 && player.reloadTimer <= 0;
            const firePressed = keys.Space || (gamepadConnected && gamepadA);
            if (firePressed && canFire) {
                const splitCount = player.splitShot || 1;
                for (let i = 0; i < splitCount; i++) {
                    const spread = splitCount > 1 ? (i - (splitCount - 1) / 2) * 0.22 : 0;
                    firePlayerBullet(spread);
                }
            }

            // ---------- 炮弹物理更新（抛物线） ----------
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                // 水平匀速
                b.x += b.vx * dt;
                // 垂直方向：先应用速度，再施加重力加速度
                b.y += b.vy * dt;
                b.vy += BULLET_GRAVITY * dt;   // 重力（像素/秒²）
                b.life -= dt;

                if (b.x < -50 || b.x > W + 50 || b.y > H + 100 || b.life <= 0) {
                    bullets.splice(i, 1);
                    if (b.isPlayerBullet) onPlayerBulletDestroyed();
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.x += e.speed * e.dir * dt;
                snapToTerrain(e);

                if (e.cooldown > 0) e.cooldown -= dt;

                if (e.cooldown <= 0) {
                    enemyFire(e);
                    e.cooldown = e.maxCooldown + randomRange(-30, 30) / FPS_BASE;
                }

                if (e.x < -120 || e.x > W + 120) {
                    enemies.splice(i, 1);
                }
            }

            enemySpawnTimer -= dt;
            if (enemySpawnTimer <= 0) {
                if (!enemies.some(e => e.isBoss)) {
                    spawnEnemy(false);
                }
                enemySpawnTimer = getDynamicSpawnInterval();
            }

            checkBulletCollisions();
            updateExplosions(dt);
            updatePowerups(dt);
        }

        // ---------- 绘制 ----------
        let buffPulse = 0;

        function draw() {
            buffPulse = (buffPulse + 0.1) % (Math.PI * 2);

            const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
            skyGrad.addColorStop(0, '#b6d8e8');
            skyGrad.addColorStop(0.6, '#d4eef9');
            skyGrad.addColorStop(1, '#e8f4f8');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, W, H);

            ctx.fillStyle = '#a0b8c8';
            ctx.globalAlpha = 0.4;
            for (let i = 0; i < 8; i++) {
                const x = i * 130 + 30;
                ctx.beginPath();
                ctx.moveTo(x - 80, H - 100);
                ctx.lineTo(x, H - 160);
                ctx.lineTo(x + 80, H - 100);
                ctx.closePath();
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            drawTerrain();

            for (let p of powerups) {
                drawPowerup(p);
            }

            for (let e of enemies) {
                let bodyColor = '#c0392b';
                let darkColor = '#7b241c';
                let lightColor = '#e74c3c';

                if (e.isBoss) {
                    bodyColor = '#8b1a1a';
                    darkColor = '#5a0f0f';
                    lightColor = '#c0392b';
                } else if (e.hasSplitShot) {
                    bodyColor = '#8e44ad';
                    darkColor = '#5b2c6f';
                    lightColor = '#bb8fce';
                } else if (e.hasFastFire) {
                    bodyColor = '#27ae60';
                    darkColor = '#145a32';
                    lightColor = '#58d68d';
                }

                drawTank(e, bodyColor, darkColor, lightColor, true);
            }

            drawTank(player, '#3b7a9e', '#1f4a63', '#5ba3c9', false);

            for (let b of bullets) {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                const grad = ctx.createRadialGradient(b.x - 2, b.y - 2, 1, b.x, b.y, b.radius);
                if (b.isEnemy) {
                    grad.addColorStop(0, '#ffcccc');
                    grad.addColorStop(0.5, '#ff6b6b');
                    grad.addColorStop(1, '#cc0000');
                } else {
                    grad.addColorStop(0, '#ffffcc');
                    grad.addColorStop(0.5, '#ffd93d');
                    grad.addColorStop(1, '#cc9900');
                }
                ctx.fillStyle = grad;
                ctx.shadowBlur = 12;
                ctx.shadowColor = b.isEnemy ? '#ff0000' : '#ffaa00';
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            for (let e of explosions) {
                const alpha = e.life / e.maxLife;
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 180, 50, ${alpha * 0.8})`;
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ff6600';
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            for (let e of enemies) {
                if (e.maxHp > 1) {
                    drawHealthBar(e.x + e.w / 2, e.y - 16, e.hp, e.maxHp);
                }
            }
            drawHealthBar(player.x + player.w / 2, player.y - 14, playerHP, maxHP);

            if (player.shield > 0) {
                const pulse = 0.5 + 0.5 * Math.sin(buffPulse);
                const radius = player.w * 0.75 + pulse * 4;

                const shieldGrad = ctx.createRadialGradient(
                    player.x + player.w / 2, player.y + player.h / 2, radius * 0.5,
                    player.x + player.w / 2, player.y + player.h / 2, radius
                );
                shieldGrad.addColorStop(0, 'rgba(249, 202, 36, 0)');
                shieldGrad.addColorStop(0.7, `rgba(249, 202, 36, ${0.25 + pulse * 0.15})`);
                shieldGrad.addColorStop(1, 'rgba(249, 202, 36, 0)');

                ctx.beginPath();
                ctx.arc(player.x + player.w / 2, player.y + player.h / 2, radius, 0, Math.PI * 2);
                ctx.fillStyle = shieldGrad;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(player.x + player.w / 2, player.y + player.h / 2, radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 220, 100, ${0.6 + pulse * 0.3})`;
                ctx.lineWidth = 2.5;
                ctx.shadowBlur = 15 + pulse * 10;
                ctx.shadowColor = '#f9ca24';
                ctx.stroke();
                ctx.shadowBlur = 0;

                for (let k = 0; k < 5; k++) {
                    const angle = buffPulse * 2 + k * Math.PI * 0.4;
                    const px = player.x + player.w / 2 + Math.cos(angle) * radius * 0.85;
                    const py = player.y + player.h / 2 + Math.sin(angle) * radius * 0.85;
                    ctx.beginPath();
                    ctx.arc(px, py, 2 + pulse * 1.5, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 240, 150, ${0.7 + pulse * 0.3})`;
                    ctx.fill();
                }
            }

            if (player.reloadTimer > 0) {
                const ratio = 1 - player.reloadTimer / RELOAD_DURATION;
                ctx.fillStyle = '#ffffff44';
                ctx.fillRect(player.x, player.y + player.h + 6, player.w, 4);
                ctx.fillStyle = '#ffd93d';
                ctx.fillRect(player.x, player.y + player.h + 6, player.w * ratio, 4);
            } else if (player.activeBullets > 0) {
                ctx.fillStyle = '#ff6b6b88';
                ctx.fillRect(player.x, player.y + player.h + 6, player.w, 4);
            }

            if (gameOver) {
                ctx.fillStyle = '#000000aa';
                ctx.fillRect(0, 0, W, H);
                ctx.font = 'bold 52px "Courier New", monospace';
                ctx.fillStyle = '#f3d9b1';
                ctx.shadowColor = '#2e1e0e';
                ctx.shadowBlur = 14;
                ctx.shadowOffsetY = 6;
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', W / 2, H / 2 - 20);
                ctx.font = '26px "Courier New", monospace';
                ctx.fillText('点击或按 R 重新开始', W / 2, H / 2 + 50);
                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;
            }

            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
        }

        function drawPowerup(p) {
            const cx = p.x + p.w / 2;
            const cy = p.y + p.h / 2;
            const half = p.w / 2;

            ctx.save();

            const baseColors = {
                'heal': '#e74c3c',
                'split2': '#16a085',
                'split3': '#2980b9',
                'shield': '#f39c12'
            };
            const lightColors = {
                'heal': '#ff8a80',
                'split2': '#48c9b0',
                'split3': '#5dade2',
                'shield': '#f9ca24'
            };

            ctx.shadowBlur = 15;
            ctx.shadowColor = lightColors[p.type];
            ctx.fillStyle = baseColors[p.type];
            ctx.beginPath();
            ctx.roundRect(p.x, p.y, p.w, p.h, 8);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.strokeStyle = lightColors[p.type];
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(p.x + 2, p.y + 2, p.w - 4, p.h - 4, 6);
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';

            if (p.type === 'heal') {
                const armLen = half * 0.5;
                const thick = 4;
                ctx.fillRect(cx - thick / 2, cy - armLen, thick, armLen * 2);
                ctx.fillRect(cx - armLen, cy - thick / 2, armLen * 2, thick);
            } else if (p.type === 'split2') {
                drawArrow(cx - 6, cy + 2, 0, 7, 4);
                drawArrow(cx + 6, cy + 2, 0, 7, 4);
            } else if (p.type === 'split3') {
                drawArrow(cx - 9, cy + 2, 0, 6, 3.5);
                drawArrow(cx, cy + 2, 0, 7, 4);
                drawArrow(cx + 9, cy + 2, 0, 6, 3.5);
            } else if (p.type === 'shield') {
                ctx.beginPath();
                ctx.moveTo(cx, cy - half * 0.6);
                ctx.lineTo(cx + half * 0.5, cy - half * 0.3);
                ctx.lineTo(cx + half * 0.5, cy + half * 0.15);
                ctx.quadraticCurveTo(cx + half * 0.5, cy + half * 0.55, cx, cy + half * 0.7);
                ctx.quadraticCurveTo(cx - half * 0.5, cy + half * 0.55, cx - half * 0.5, cy + half * 0.15);
                ctx.lineTo(cx - half * 0.5, cy - half * 0.3);
                ctx.closePath();
                ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
                ctx.fill();
                ctx.strokeStyle = lightColors[p.type];
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.strokeStyle = lightColors[p.type];
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(cx, cy - half * 0.35);
                ctx.lineTo(cx, cy + half * 0.35);
                ctx.moveTo(cx - half * 0.3, cy);
                ctx.lineTo(cx + half * 0.3, cy);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawArrow(x, y, angle, length, width) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.moveTo(0, -length);
            ctx.lineTo(width, -length + width * 1.5);
            ctx.lineTo(width * 0.4, -length + width * 1.5);
            ctx.lineTo(width * 0.4, length * 0.4);
            ctx.lineTo(-width * 0.4, length * 0.4);
            ctx.lineTo(-width * 0.4, -length + width * 1.5);
            ctx.lineTo(-width, -length + width * 1.5);
            ctx.closePath();
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.restore();
        }

        function drawTank(tank, bodyColor, darkColor, lightColor, isEnemy) {
            const x = tank.x;
            const y = tank.y;
            const w = tank.w;
            const h = tank.h;
            const cx = x + w / 2;
            const baseY = y + h;
            const dir = tank.dir;

            const turretX = cx;
            const turretY = y + h * 0.3;
            const barrelLength = w * 0.8;
            const barrelWidth = isEnemy ? 7 : 8;

            let angle;
            if (tank.isBoss) {
                const bossCenterX = cx;
                const playerCenterX = player.x + player.w / 2;
                const aimDir = playerCenterX < bossCenterX ? -1 : 1;
                angle = aimDir === 1 ? -0.5 : Math.PI + 0.5;
            } else {
                angle = dir === 1 ? -0.5 : Math.PI + 0.5;
            }

            ctx.save();
            ctx.translate(turretX, turretY);
            ctx.rotate(angle);
            ctx.fillStyle = darkColor;
            ctx.fillRect(0, -barrelWidth / 2, barrelLength, barrelWidth);
            ctx.fillStyle = '#222';
            ctx.fillRect(barrelLength - 8, -barrelWidth / 2 - 1.5, 8, barrelWidth + 3);
            ctx.fillStyle = lightColor;
            ctx.globalAlpha = 0.35;
            ctx.fillRect(2, -barrelWidth / 2 + 1, barrelLength - 10, 2);
            ctx.globalAlpha = 1.0;
            ctx.restore();

            ctx.fillStyle = bodyColor;
            ctx.beginPath();
            if (dir === 1) {
                ctx.moveTo(x, y + h * 0.45);
                ctx.lineTo(x + w * 0.65, y + h * 0.15);
                ctx.lineTo(x + w, y + h * 0.3);
                ctx.lineTo(x + w, baseY - 3);
                ctx.lineTo(x, baseY - 3);
                ctx.closePath();
            } else {
                ctx.moveTo(x + w, y + h * 0.45);
                ctx.lineTo(x + w * 0.35, y + h * 0.15);
                ctx.lineTo(x, y + h * 0.3);
                ctx.lineTo(x, baseY - 3);
                ctx.lineTo(x + w, baseY - 3);
                ctx.closePath();
            }
            ctx.fill();
            ctx.strokeStyle = darkColor;
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.fillStyle = lightColor;
            ctx.globalAlpha = 0.35;
            if (dir === 1) {
                ctx.fillRect(x + w * 0.1, y + h * 0.4, w * 0.5, 2.5);
            } else {
                ctx.fillRect(x + w * 0.4, y + h * 0.4, w * 0.5, 2.5);
            }
            ctx.globalAlpha = 1.0;

            ctx.fillStyle = '#2a2a2a';
            ctx.beginPath();
            ctx.roundRect(x - 3, baseY - 9, w + 6, 9, 4);
            ctx.fill();

            ctx.fillStyle = '#5a5a5a';
            const wheelCount = Math.max(3, Math.floor(w / 11));
            const wheelSpacing = w / wheelCount;
            for (let i = 0; i < wheelCount; i++) {
                const wx = x + 3 + i * wheelSpacing + wheelSpacing / 2;
                ctx.beginPath();
                ctx.arc(wx, baseY - 4.5, 2.8, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.strokeStyle = '#111';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.roundRect(x - 3, baseY - 9, w + 6, 9, 4);
            ctx.stroke();

            const turretW = w * 0.42;
            const turretH = h * 0.55;
            let turretBaseX;
            if (dir === 1) {
                turretBaseX = x + w * 0.22;
            } else {
                turretBaseX = x + w * 0.36;
            }

            ctx.fillStyle = darkColor;
            ctx.beginPath();
            ctx.roundRect(turretBaseX, y - 1, turretW, turretH, 5);
            ctx.fill();
            ctx.strokeStyle = '#00000066';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.fillStyle = lightColor;
            ctx.globalAlpha = 0.5;
            ctx.fillRect(turretBaseX + 3, y + 1.5, turretW - 6, 2.5);
            ctx.globalAlpha = 1.0;

            ctx.fillStyle = lightColor;
            ctx.beginPath();
            ctx.roundRect(turretBaseX + turretW * 0.25, y - 5, turretW * 0.5, 5, 2);
            ctx.fill();

            if (tank.isBoss) {
                ctx.font = '18px monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'alphabetic';
                ctx.fillStyle = '#ffd966';
                ctx.shadowBlur = 6;
                ctx.shadowColor = '#ffaa00';
                ctx.fillText('👑', cx, y - 12);
                ctx.shadowBlur = 0;
            }

            if (!isEnemy && tank.activeBullets === 0 && tank.reloadTimer <= 0) {
                const angleM = dir === 1 ? -0.5 : Math.PI + 0.5;
                const muzzleX = turretX + Math.cos(angleM) * barrelLength;
                const muzzleY = turretY + Math.sin(angleM) * barrelLength;
                ctx.beginPath();
                ctx.arc(muzzleX, muzzleY, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#ffd93d';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#ffaa00';
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function drawHealthBar(cx, y, hp, maxHp) {
            const dotW = 10;
            const dotH = 8;
            const gap = 3;
            const totalW = maxHp * dotW + (maxHp - 1) * gap;
            const startX = cx - totalW / 2;

            for (let i = 0; i < maxHp; i++) {
                let color;
                if (hp > 3) {
                    color = '#4caf50';
                } else if (hp === 3) {
                    color = '#ffc107';
                } else {
                    color = '#f44336';
                }
                if (i < hp) {
                    ctx.fillStyle = color;
                } else {
                    ctx.fillStyle = '#55555555';
                }
                ctx.beginPath();
                ctx.roundRect(startX + i * (dotW + gap), y, dotW, dotH, 3);
                ctx.fill();
            }
        }

        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            };
        }

        function pollGamepad() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            let gp = null;
            for (let i = 0; i < gamepads.length; i++) {
                if (gamepads[i] && gamepads[i].connected) {
                    gp = gamepads[i];
                    gamepadIndex = i;
                    break;
                }
            }

            if (gp && !gamepadConnected) {
                gamepadConnected = true;
                gamepadIcon.classList.add('connected');
            } else if (!gp && gamepadConnected) {
                gamepadConnected = false;
                gamepadIcon.classList.remove('connected');
                gamepadLeft = false;
                gamepadRight = false;
                gamepadA = false;
                prevGamepadButtons.A = false;
                prevGamepadButtons.Start = false;
            }

            if (!gp) return;

            const buttons = gp.buttons;

            gamepadLeft = buttons[14] && (buttons[14].pressed || buttons[14].value > 0.5);
            gamepadRight = buttons[15] && (buttons[15].pressed || buttons[15].value > 0.5);
            gamepadA = buttons[0] && (buttons[0].pressed || buttons[0].value > 0.5);

            const startPressed = buttons[9] && (buttons[9].pressed || buttons[9].value > 0.5);
            if (startPressed && !prevGamepadButtons.Start) {
                if (gameOver) {
                    restartGame();
                }
            }
            prevGamepadButtons.Start = startPressed;
            prevGamepadButtons.A = gamepadA;
        }

        window.addEventListener('keydown', (e) => {
            initAudio();
            const key = e.key;
            if (key === 'ArrowLeft' || key === 'ArrowRight' || key === ' ') {
                e.preventDefault();
            }

            if (key === 'ArrowLeft') {
                keys.ArrowLeft = true;
            } else if (key === 'ArrowRight') {
                keys.ArrowRight = true;
            } else if (key === ' ') {
                keys.Space = true;
            } else if (key === 'r' || key === 'R') {
                e.preventDefault();
                restartGame();
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key;
            if (key === 'ArrowLeft') {
                keys.ArrowLeft = false;
            } else if (key === 'ArrowRight') {
                keys.ArrowRight = false;
            } else if (key === ' ') {
                keys.Space = false;
            }
            if (key === 'ArrowLeft' || key === 'ArrowRight' || key === ' ') {
                e.preventDefault();
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                e.preventDefault();
            }
        }, false);

        canvas.addEventListener('click', () => {
            initAudio();
            if (gameOver) {
                restartGame();
            }
        });

        function restartGame() {
            randomizeTerrain();

            score = 0;
            scoreSpan.innerText = '0';
            playerHP = maxHP;
            hpSpan.innerText = playerHP;
            bossLevel = 0;
            bossSpan.innerText = bossLevel;
            enemyKillCount = 0;
            nextBossThreshold = 10;
            gameOver = false;
            enemies = [];
            bullets = [];
            explosions = [];
            powerups = [];
            enemySpawnTimer = 0;
            lastPowerupType = null;

            resetPlayer();

            keys.ArrowLeft = false;
            keys.ArrowRight = false;
            keys.Space = false;
            gamepadLeft = false;
            gamepadRight = false;
            gamepadA = false;
        }

        let lastTimestamp = 0;
        function gameLoop(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            let dt = (timestamp - lastTimestamp) / 1000;
            lastTimestamp = timestamp;
            if (dt > 0.1) dt = 0.1;
            if (dt < 0.001) dt = 0.001;

            pollGamepad();
            if (!gameOver) {
                update(dt);
            }
            draw();
            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('blur', () => {
            keys.ArrowLeft = false;
            keys.ArrowRight = false;
            keys.Space = false;
        });

        window.addEventListener('gamepadconnected', (e) => {
            gamepadConnected = true;
            gamepadIndex = e.gamepad.index;
            gamepadIcon.classList.add('connected');
            initAudio();
        });

        window.addEventListener('gamepaddisconnected', (e) => {
            gamepadConnected = false;
            gamepadIndex = -1;
            gamepadIcon.classList.remove('connected');
        });

        restartGame();
        spawnEnemy(false);
        requestAnimationFrame(gameLoop);
    })();
</script>
</body>
</html>
