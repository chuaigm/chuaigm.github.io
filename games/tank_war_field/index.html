<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>坦克大战</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            background: #0b1a2f;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            padding: 6px;
        }
        .game-container {
            background: #1e2f4a;
            padding: 10px;
            border-radius: 20px;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
            max-height: 100%;
            transition: border-radius 0.2s;
        }
        .canvas-wrap {
            position: relative;
            width: 100%;
            max-width: 1280px;
            line-height: 0;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1280 / 720;
            border-radius: 14px;
            box-shadow: inset 0 0 20px #00000055, 0 6px 12px black;
            touch-action: none;
        }
        .fullscreen-btn {
            position: absolute;
            top: 6px; right: 6px;
            width: 30px; height: 30px;
            min-width: 30px; min-height: 30px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.45);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            transition: background 0.15s, color 0.15s, transform 0.1s;
            z-index: 10; padding: 0; outline: none;
        }
        .fullscreen-btn:hover { background: rgba(255, 255, 255, 0.18); color: rgba(255, 255, 255, 0.8); }
        .fullscreen-btn:active { background: rgba(255, 255, 255, 0.28); color: #ffffff; transform: scale(0.92); }
        .fullscreen-btn svg { width: 15px; height: 15px; display: block; pointer-events: none; }
        @media (max-width: 720px) {
            .fullscreen-btn { width: 26px; height: 26px; top: 5px; right: 5px; border-radius: 7px; }
            .fullscreen-btn svg { width: 13px; height: 13px; }
        }
        @media (max-width: 420px) {
            .fullscreen-btn { width: 22px; height: 22px; top: 4px; right: 4px; border-radius: 6px; }
            .fullscreen-btn svg { width: 11px; height: 11px; }
        }
        .game-container.is-fullscreen {
            width: 100vw; height: 100vh;
            max-width: none; max-height: none;
            border-radius: 0; padding: 0; background: #000;
            justify-content: center; align-items: center;
        }
        .game-container.is-fullscreen .canvas-wrap {
            width: 100%; height: 100%; max-width: none;
            display: flex; align-items: center; justify-content: center;
        }
        .game-container.is-fullscreen canvas {
            width: auto !important;
            height: auto !important;
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 1280 / 720;
            border-radius: 0; box-shadow: none;
        }
        .game-container.is-fullscreen .fullscreen-btn {
            top: 8px; right: 8px;
            background: rgba(255, 255, 255, 0.10);
            color: rgba(255, 255, 255, 0.55);
            z-index: 30;
        }
    </style>
</head>
<body>
<div class="game-container" id="gameContainer">
    <div class="canvas-wrap" id="canvasWrap">
        <canvas id="gameCanvas" width="1280" height="720"></canvas>
        <button class="fullscreen-btn" id="fullscreenBtn" aria-label="全屏" title="全屏">
            <svg id="fsIconExpand" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 9V4h5"/><path d="M20 9V4h-5"/>
                <path d="M4 15v5h5"/><path d="M20 15v5h-5"/>
            </svg>
            <svg id="fsIconCompress" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
                 style="display:none;">
                <path d="M9 4v5H4"/><path d="M15 4v5h5"/>
                <path d="M9 20v-5H4"/><path d="M15 20v-5h5"/>
            </svg>
        </button>
    </div>
</div>
<script>
(function() {
    'use strict';

    // ==================== 版本号 ====================
    const VERSION = '20261008';

    // ==================== DOM ====================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('gameContainer');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const fsIconExpand = document.getElementById('fsIconExpand');
    const fsIconCompress = document.getElementById('fsIconCompress');

    // ==================== 常量 ====================
    const W = 1280;
    const H = 720;
    const HUD_H = 56;
    const PLAY_H = H - HUD_H;

    const FPS_BASE = 60;
    const BULLET_GRAVITY = 0.18 * FPS_BASE * FPS_BASE;
    const POWERUP_GRAVITY = 0.3 * FPS_BASE * FPS_BASE;
    const SCALE = W / 900;
    const BULLET_GRAVITY_SCALED = BULLET_GRAVITY * SCALE;
    const POWERUP_GRAVITY_SCALED = POWERUP_GRAVITY * SCALE;

    const HP_DOT_SIZE = 13;
    const HP_GAP = 4;
    const HP_MARGIN_TOP = 22 * SCALE;
    const HP_MAX_PER_ROW = 10;

    const PLAYER_BULLET_LIFE = 240 / FPS_BASE;
    const ENEMY_BULLET_LIFE = 300 / FPS_BASE;
    const RELOAD_DURATION = 12 / FPS_BASE;

    const ENEMY_SPAWN_INTERVAL_BASE = 150 / FPS_BASE;
    const ENEMY_SPAWN_INTERVAL_FAST = 40 / FPS_BASE;
    const ENEMY_COUNT_THRESHOLD = 5;
    const BOSS_EXTRA_ENEMY_MIN = 2;
    const BOSS_EXTRA_SPAWN_FAST = 90 / FPS_BASE;
    const BOSS_EXTRA_SPAWN_SLOW = 420 / FPS_BASE;

    const PLAYER_STILL_DURATION = 5.0;
    const HALF_TANK_WIDTH = 28 * SCALE;
    const STILL_CHECK_DELAY = 3.0;

    const CLOUD_COUNT = 8;
    const ENEMY_MIN_SPACING = 10 * SCALE;

    const HUD_FONT = 'bold 18px "Courier New", monospace';
    const GO_TITLE_FONT = 'bold 72px "Courier New", monospace';
    const GO_SCORE_FONT = 'bold 30px "Courier New", monospace';
    const GO_HINT_FONT = 'bold 22px "Courier New", monospace';
    const GO_OR_FONT = 'bold 20px "Courier New", monospace';

    const COLOR = {
        sky0: '#b6d8e8', sky1: '#d4eef9', sky2: '#e8f4f8',
        hill: '#a0b8c8',
        terrain0: '#6b8f5e', terrain1: '#4f7048', terrain2: '#3a5434',
        terrainEdge: '#2a3d24',
        enemyNormal: ['#c0392b', '#7b241c', '#e74c3c'],
        enemySplit: ['#8e44ad', '#5b2c6f', '#bb8fce'],
        enemyFast: ['#27ae60', '#145a32', '#58d68d'],
        boss: ['#8b1a1a', '#5a0f0f', '#c0392b'],
        player: ['#3b7a9e', '#1f4a63', '#5ba3c9'],
        pickupColors: {
            heal: ['#e74c3c', '#ff8a80'],
            split2: ['#16a085', '#48c9b0'],
            split3: ['#2980b9', '#5dade2'],
            shield: ['#f39c12', '#f9ca24'],
            big: ['#e67e22', '#f39c12']
        }
    };

    // ==================== 工具 ====================
    function randomRange(min, max) { return Math.random() * (max - min) + min; }

    function roundRectPath(x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }

    // ==================== 全屏控制 ====================
    const fullscreenApi = {
        request: () => {
            const el = document.documentElement;
            if (el.requestFullscreen) return el.requestFullscreen();
            if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
            if (el.msRequestFullscreen) return el.msRequestFullscreen();
        },
        exit: () => {
            if (document.exitFullscreen) return document.exitFullscreen();
            if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
            if (document.msExitFullscreen) return document.msExitFullscreen();
        },
        isFullscreen: () => !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement)
    };

    function updateFullscreenButton() {
        const fs = fullscreenApi.isFullscreen();
        if (fs) {
            fsIconExpand.style.display = 'none';
            fsIconCompress.style.display = 'block';
            fullscreenBtn.setAttribute('aria-label', '退出全屏');
            fullscreenBtn.setAttribute('title', '退出全屏');
        } else {
            fsIconExpand.style.display = 'block';
            fsIconCompress.style.display = 'none';
            fullscreenBtn.setAttribute('aria-label', '全屏');
            fullscreenBtn.setAttribute('title', '全屏');
        }
    }

    function toggleFullscreen() {
        if (fullscreenApi.isFullscreen()) fullscreenApi.exit();
        else fullscreenApi.request();
    }

    fullscreenBtn.addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        initAudio(); toggleFullscreen();
    });
    fullscreenBtn.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
    fullscreenBtn.addEventListener('touchend', (e) => e.stopPropagation(), { passive: true });

    function onFullscreenChange() {
        const fs = fullscreenApi.isFullscreen();
        container.classList.toggle('is-fullscreen', fs);
        updateFullscreenButton();
        setTimeout(scheduleResize, 60);
        setTimeout(scheduleResize, 200);
        setTimeout(scheduleResize, 500);
    }
    document.addEventListener('fullscreenchange', onFullscreenChange);
    document.addEventListener('webkitfullscreenchange', onFullscreenChange);
    document.addEventListener('msfullscreenchange', onFullscreenChange);

    // ==================== 画布适配 ====================
    let cachedPadX = 0;

    function refreshCachedPad() {
        const cs = getComputedStyle(container);
        const containerPadX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
        const bs = getComputedStyle(document.body);
        const bodyPadX = (parseFloat(bs.paddingLeft) || 0) + (parseFloat(bs.paddingRight) || 0);
        cachedPadX = containerPadX + bodyPadX;
    }

    function applyCanvasTransform() {
        ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    }

    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        let availWidth, availHeight;

        if (fullscreenApi.isFullscreen()) {
            availWidth = window.innerWidth;
            availHeight = window.innerHeight;
        } else {
            availWidth = window.innerWidth - cachedPadX;
            availHeight = window.innerHeight - cachedPadX;
        }

        const availWidthFromHeight = availHeight * (W / H);
        let cssW = Math.min(availWidth, availWidthFromHeight);
        if (!fullscreenApi.isFullscreen()) cssW = Math.min(cssW, 1280);
        if (!isFinite(cssW) || cssW < 100) cssW = Math.max(100, Math.min(availWidth, 1280));
        const cssH = cssW * (H / W);

        canvas.style.width = cssW + 'px';
        canvas.style.height = cssH + 'px';
        canvas.width  = Math.round(cssW * dpr);
        canvas.height = Math.round(cssH * dpr);
        applyCanvasTransform();
    }

    let resizeScheduled = false;
    function scheduleResize() {
        if (resizeScheduled) return;
        resizeScheduled = true;
        requestAnimationFrame(() => { resizeScheduled = false; resizeCanvas(); });
    }
    window.addEventListener('resize', scheduleResize);
    window.addEventListener('orientationchange', () => { setTimeout(scheduleResize, 120); setTimeout(scheduleResize, 350); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleResize);

    // ==================== 渐变缓存 ====================
    let skyGrad = null;
    let terrainGrad = null;
    let hudBgGrad = null;

    function rebuildGradients() {
        skyGrad = ctx.createLinearGradient(0, 0, 0, PLAY_H);
        skyGrad.addColorStop(0, COLOR.sky0);
        skyGrad.addColorStop(0.6, COLOR.sky1);
        skyGrad.addColorStop(1, COLOR.sky2);

        terrainGrad = ctx.createLinearGradient(0, PLAY_H - 140, 0, PLAY_H);
        terrainGrad.addColorStop(0, COLOR.terrain0);
        terrainGrad.addColorStop(0.5, COLOR.terrain1);
        terrainGrad.addColorStop(1, COLOR.terrain2);

        hudBgGrad = ctx.createLinearGradient(0, PLAY_H, 0, H);
        hudBgGrad.addColorStop(0, 'rgba(13, 27, 42, 0.96)');
        hudBgGrad.addColorStop(1, 'rgba(6, 15, 26, 0.98)');
    }

    // ==================== 背景（山、云） ====================
    let mountains = [];
    let clouds = [];

    function generateMountains() {
        mountains = [];
        const count = 10;
        for (let i = 0; i < count; i++) {
            const baseX = i * (W / count) + randomRange(-40, 40);
            const sizeScale = randomRange(0.7, 1.3);
            mountains.push({
                x: baseX, halfWidth: 80 * sizeScale, peakHeight: 110 * sizeScale,
                baseY: PLAY_H - 100, shade: randomRange(0.35, 0.5)
            });
        }
    }

    function generateClouds() {
        clouds = [];
        for (let i = 0; i < CLOUD_COUNT; i++) clouds.push(createCloud(randomRange(0, W)));
    }

    function createCloud(x) {
        const puffCount = Math.floor(randomRange(4, 7));
        const puffs = [];
        const baseW = randomRange(70, 130);
        const baseH = randomRange(24, 40);
        for (let j = 0; j < puffCount; j++) {
            const ry = randomRange(baseH * 0.45, baseH * 0.75);
            const rx = ry * randomRange(1.5, 2.2);
            puffs.push({
                offsetX: randomRange(-baseW * 0.5, baseW * 0.5),
                offsetY: randomRange(-baseH * 0.3, baseH * 0.3),
                rx: rx, ry: ry, rotation: randomRange(-0.15, 0.15)
            });
        }
        return { x, y: randomRange(20, 150), w: baseW, h: baseH, speed: randomRange(8, 22), puffs, alpha: randomRange(0.5, 0.85) };
    }

    function updateClouds(dt) {
        for (let i = clouds.length - 1; i >= 0; i--) {
            const c = clouds[i];
            c.x -= c.speed * dt;
            if (c.x + c.w < -20) { clouds.splice(i, 1); clouds.push(createCloud(W + randomRange(40, 200))); }
        }
    }

    function drawClouds() {
        ctx.fillStyle = '#ffffff';
        for (let i = 0; i < clouds.length; i++) {
            const c = clouds[i];
            ctx.globalAlpha = c.alpha;
            const puffs = c.puffs;
            for (let j = 0; j < puffs.length; j++) {
                const p = puffs[j];
                ctx.save();
                ctx.translate(c.x + p.offsetX, c.y + p.offsetY);
                ctx.rotate(p.rotation);
                ctx.beginPath();
                ctx.ellipse(0, 0, p.rx, p.ry, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
        ctx.globalAlpha = 1;
    }

    function drawMountains() {
        ctx.fillStyle = COLOR.hill;
        for (let i = 0; i < mountains.length; i++) {
            const m = mountains[i];
            ctx.globalAlpha = m.shade;
            ctx.beginPath();
            ctx.moveTo(m.x - m.halfWidth, m.baseY);
            ctx.lineTo(m.x, m.baseY - m.peakHeight);
            ctx.lineTo(m.x + m.halfWidth, m.baseY);
            ctx.closePath();
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }

    // ==================== 音效 ====================
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) {
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
            catch (e) { audioCtx = null; }
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    function createOsc(type, freqStart, freqEnd, duration, gainPeak, filterType, filterFreqStart, filterFreqEnd) {
        if (!audioCtx) return null;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freqStart, now);
        if (freqEnd !== freqStart) osc.frequency.exponentialRampToValueAtTime(freqEnd, now + duration);
        gain.gain.setValueAtTime(gainPeak, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        let target = gain;
        if (filterType) {
            const filter = audioCtx.createBiquadFilter();
            filter.type = filterType;
            filter.frequency.setValueAtTime(filterFreqStart, now);
            if (filterFreqEnd !== filterFreqStart) filter.frequency.exponentialRampToValueAtTime(filterFreqEnd, now + duration);
            osc.connect(filter); target = filter;
        }
        target.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + duration + 0.02);
        return osc;
    }

    function createNoise(duration, gainPeak, filterType, filterFreqStart, filterFreqEnd, decayPower = 1.5) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const bufferSize = audioCtx.sampleRate * duration;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, decayPower);
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(gainPeak, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        let target = gain;
        if (filterType) {
            const filter = audioCtx.createBiquadFilter();
            filter.type = filterType;
            filter.frequency.setValueAtTime(filterFreqStart, now);
            if (filterFreqEnd !== filterFreqStart) filter.frequency.exponentialRampToValueAtTime(filterFreqEnd, now + duration);
            noise.connect(filter); target = filter;
        }
        target.connect(gain); gain.connect(audioCtx.destination);
        noise.start(now); noise.stop(now + duration + 0.02);
    }

    function playFireSound() {
        if (!audioCtx) return;
        createOsc('triangle', 320, 120, 0.14, 0.2, 'lowpass', 600, 150);
        createNoise(0.1, 0.1, 'bandpass', 1200, 700, 2.5);
    }
    function playHitSound() { createOsc('triangle', 400, 80, 0.2, 0.22, 'lowpass', 800, 800); }
    function playBulletClashSound() { createNoise(0.5, 0.6, 'lowpass', 700, 80, 1.3); createOsc('sine', 180, 50, 0.4, 0.45); }
    function playExplosionSound() { createNoise(0.25, 0.28, 'lowpass', 400, 80, 1.5); }
    function playTankDestroySound() { createNoise(0.5, 0.45, 'lowpass', 700, 60, 1.2); createOsc('sine', 140, 35, 0.4, 0.5); }

    function playPlayerHitSound() {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc1.type = 'square'; osc2.type = 'sawtooth';
        osc1.frequency.setValueAtTime(220, now); osc1.frequency.exponentialRampToValueAtTime(80, now + 0.2);
        osc2.frequency.setValueAtTime(160, now); osc2.frequency.exponentialRampToValueAtTime(60, now + 0.2);
        gain.gain.setValueAtTime(0.18, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1000, now);
        filter.frequency.exponentialRampToValueAtTime(200, now + 0.2);
        osc1.connect(filter); osc2.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        osc1.start(now); osc2.start(now);
        osc1.stop(now + 0.25); osc2.stop(now + 0.25);
    }

    function playPickupSound() {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const notes = [523.25, 659.25, 783.99];
        const noteDur = 0.09, gap = 0.02;
        for (let i = 0; i < notes.length; i++) {
            const start = now + i * (noteDur + gap), end = start + noteDur;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(notes[i], start);
            gain.gain.setValueAtTime(0.001, start);
            gain.gain.exponentialRampToValueAtTime(0.22, start + 0.008);
            gain.gain.exponentialRampToValueAtTime(0.001, end);
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass'; filter.frequency.setValueAtTime(3000, start);
            osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
            osc.start(start); osc.stop(end + 0.02);
            const harm = audioCtx.createOscillator();
            const harmGain = audioCtx.createGain();
            harm.type = 'sine';
            harm.frequency.setValueAtTime(notes[i] * 2, start);
            harmGain.gain.setValueAtTime(0.001, start);
            harmGain.gain.exponentialRampToValueAtTime(0.06, start + 0.006);
            harmGain.gain.exponentialRampToValueAtTime(0.001, end);
            harm.connect(harmGain); harmGain.connect(audioCtx.destination);
            harm.start(start); harm.stop(end + 0.02);
        }
    }

    // ==================== 地形 ====================
    let terrainParams = {
        baseOffset: 0,
        wave1: { amp: 0, freq: 0, phase: 0 },
        wave2: { amp: 0, freq: 0, phase: 0 },
        wave3: { amp: 0, freq: 0, phase: 0 }
    };

    function randomizeTerrain() {
        terrainParams.baseOffset = randomRange(-14, 14);
        terrainParams.wave1.amp = randomRange(18, 46);
        terrainParams.wave1.freq = randomRange(0.004, 0.010);
        terrainParams.wave1.phase = randomRange(0, Math.PI * 2);
        terrainParams.wave2.amp = randomRange(9, 25);
        terrainParams.wave2.freq = randomRange(0.012, 0.024);
        terrainParams.wave2.phase = randomRange(0, Math.PI * 2);
        terrainParams.wave3.amp = randomRange(4, 10);
        terrainParams.wave3.freq = randomRange(0.032, 0.06);
        terrainParams.wave3.phase = randomRange(0, Math.PI * 2);
    }

    function terrainY(x) {
        const tp = terrainParams;
        return (PLAY_H - 90 + tp.baseOffset)
            + Math.sin(x * tp.wave1.freq + tp.wave1.phase) * tp.wave1.amp
            + Math.sin(x * tp.wave2.freq + tp.wave2.phase) * tp.wave2.amp
            + Math.sin(x * tp.wave3.freq + tp.wave3.phase) * tp.wave3.amp;
    }

    function drawTerrain() {
        ctx.beginPath();
        ctx.moveTo(0, PLAY_H);
        for (let x = 0; x <= W; x += 8) ctx.lineTo(x, terrainY(x));
        ctx.lineTo(W, PLAY_H);
        ctx.closePath();
        ctx.fillStyle = terrainGrad;
        ctx.fill();
        ctx.strokeStyle = COLOR.terrainEdge;
        ctx.lineWidth = 3;
        ctx.stroke();
    }

    // ==================== 图标绘制 ====================
    function drawForkArrow(c, startX, startY, dirX, dirY, length, headSize, lineWidth) {
        c.strokeStyle = '#ffffff';
        c.lineWidth = lineWidth;
        c.lineCap = 'round';
        c.beginPath();
        c.moveTo(startX, startY);
        c.lineTo(startX + dirX * length, startY + dirY * length);
        c.stroke();
        const endX = startX + dirX * length;
        const endY = startY + dirY * length;
        const angle = Math.atan2(dirY, dirX);
        c.beginPath();
        c.moveTo(endX, endY);
        c.lineTo(endX - Math.cos(angle - 0.5) * headSize, endY - Math.sin(angle - 0.5) * headSize);
        c.moveTo(endX, endY);
        c.lineTo(endX - Math.cos(angle + 0.5) * headSize, endY - Math.sin(angle + 0.5) * headSize);
        c.stroke();
    }

    function drawSplitIcon(c, cx, cy, type, scale, maxRadius) {
        c.save();
        c.translate(cx, cy);
        const startX = -maxRadius * 0.5;
        const startY = 0;
        if (type === 'split2') {
            const len = maxRadius * 1.35;
            drawForkArrow(c, startX, startY, Math.cos(-0.45), Math.sin(-0.45), len, 7 * scale, 3.6 * scale);
            drawForkArrow(c, startX, startY, Math.cos(0.45), Math.sin(0.45), len, 7 * scale, 3.6 * scale);
        } else if (type === 'split3') {
            const lenSide = maxRadius * 1.25;
            const lenMid = maxRadius * 1.5;
            drawForkArrow(c, startX, startY, Math.cos(-0.6), Math.sin(-0.6), lenSide, 6 * scale, 3.2 * scale);
            drawForkArrow(c, startX, startY, 1, 0, lenMid, 7 * scale, 3.6 * scale);
            drawForkArrow(c, startX, startY, Math.cos(0.6), Math.sin(0.6), lenSide, 6 * scale, 3.2 * scale);
        }
        c.restore();
    }

    // ==================== 敌人生成 ====================
    function wouldOverlap(x, w) {
        for (let i = 0; i < enemies.length; i++) {
            const e = enemies[i];
            const leftA = x - ENEMY_MIN_SPACING;
            const rightA = x + w + ENEMY_MIN_SPACING;
            const leftB = e.x;
            const rightB = e.x + e.w;
            if (leftA < rightB && rightA > leftB) return true;
        }
        return false;
    }

    function spawnEnemy(isBoss = false) {
        const w = isBoss ? 78 * SCALE : 52 * SCALE;
        const h = isBoss ? 36 * SCALE : 24 * SCALE;
        let dir = Math.random() < 0.5 ? 1 : -1;
        let startX = dir === 1 ? -100 * SCALE : W + 100 * SCALE;
        const offsetStep = w * 0.6;
        let attempts = 0;
        while (wouldOverlap(startX, w) && attempts < 10) {
            startX += dir === 1 ? -offsetStep : offsetStep;
            attempts++;
        }
        if (wouldOverlap(startX, w)) {
            dir = -dir;
            startX = dir === 1 ? -100 * SCALE : W + 100 * SCALE;
            attempts = 0;
            while (wouldOverlap(startX, w) && attempts < 10) {
                startX += dir === 1 ? -offsetStep : offsetStep;
                attempts++;
            }
            if (wouldOverlap(startX, w)) return;
        }
        let hp = 1;
        let enemySplitShot = 1;
        let cooldownValue, maxCooldownValue;
        let hasSplitShot = false;
        let hasFastFire = false;
        if (isBoss) {
            hp = 2 + bossLevel;
            const r = Math.random();
            if (r < 0.5) { enemySplitShot = 1; cooldownValue = 55 / FPS_BASE; maxCooldownValue = 70 / FPS_BASE; }
            else if (r < 0.8) { enemySplitShot = 2; cooldownValue = 85 / FPS_BASE; maxCooldownValue = 105 / FPS_BASE; }
            else { enemySplitShot = 3; cooldownValue = 110 / FPS_BASE; maxCooldownValue = 135 / FPS_BASE; }
        } else {
            cooldownValue = randomRange(100, 170) / FPS_BASE;
            maxCooldownValue = 160 / FPS_BASE;
            if (Math.random() < 0.05) { enemySplitShot = 2; hasSplitShot = true; }
            if (!hasSplitShot && Math.random() < 0.05) {
                hasFastFire = true;
                cooldownValue = randomRange(55, 85) / FPS_BASE;
                maxCooldownValue = 85 / FPS_BASE;
            }
        }
        const enemy = {
            x: startX, y: 0, w, h,
            speed: (isBoss ? 0.9 : 1.2) * FPS_BASE * SCALE,
            dir, cooldown: cooldownValue, maxCooldown: maxCooldownValue,
            hp, maxHp: hp, isBoss,
            splitShot: enemySplitShot, hasSplitShot, hasFastFire
        };
        snapToTerrain(enemy);
        enemies.push(enemy);
        hudDirty = true;
    }

    // ==================== 发射 ====================
    function firePlayerBullet(angleOffset = 0) {
        const w = player.w;
        const barrelLength = w * 0.75;
        const angle = -0.6 + angleOffset;
        const speed = 6.0 * FPS_BASE * SCALE;
        const dir = player.dir;
        const cosA = Math.cos(angle);
        const sinA = Math.sin(angle);
        const vx = cosA * speed * dir;
        const vy = sinA * speed;
        const turretX = player.x + w / 2;
        const turretY = player.y + player.h * 0.35;
        const muzzleX = turretX + cosA * barrelLength * dir;
        const muzzleY = turretY + sinA * barrelLength;
        const baseRadius = 7 * SCALE;
        const radius = player.bigBullet ? baseRadius * 3 : baseRadius;
        const life = player.bigBullet ? PLAYER_BULLET_LIFE * 2.6 : PLAYER_BULLET_LIFE;
        bullets.push({
            x: muzzleX, y: muzzleY, vx, vy,
            isEnemy: false, radius,
            isBig: player.bigBullet, life,
            isPlayerBullet: true, id: Math.random()
        });
        player.activeBullets++;
        playFireSound();
    }

    function enemyFire(enemy) {
        let fireDir = enemy.dir;
        const ex = enemy.x, ew = enemy.w, eh = enemy.h, ey = enemy.y;
        if (enemy.isBoss) {
            const bossCenterX = ex + ew / 2;
            const playerCenterX = player.x + player.w / 2;
            fireDir = playerCenterX < bossCenterX ? -1 : 1;
        }
        const splitCount = enemy.splitShot || 1;
        for (let i = 0; i < splitCount; i++) {
            const spread = splitCount > 1 ? (i - (splitCount - 1) / 2) * 0.22 : 0;
            const barrelLength = ew * 0.75;
            const angle = -0.6 + spread;
            const speed = 5.0 * FPS_BASE * SCALE;
            const cosA = Math.cos(angle);
            const sinA = Math.sin(angle);
            const vx = cosA * speed * fireDir;
            const vy = sinA * speed;
            const turretX = ex + ew / 2;
            const turretY = ey + eh * 0.35;
            const muzzleX = turretX + cosA * barrelLength * fireDir;
            const muzzleY = turretY + sinA * barrelLength;
            bullets.push({
                x: muzzleX, y: muzzleY, vx, vy,
                isEnemy: true, radius: 7 * SCALE,
                life: ENEMY_BULLET_LIFE,
                isPlayerBullet: false, id: Math.random()
            });
        }
    }

    // ==================== 碰撞辅助 ====================
    function pointInTank(px, py, tank, paddingX = 4, paddingY = 3) {
        const px2 = paddingX * SCALE, py2 = paddingY * SCALE;
        return px > tank.x - px2 && px < tank.x + tank.w + px2 &&
               py > tank.y - py2 && py < tank.y + tank.h + py2;
    }
    function circleRectCollide(cx, cy, r, rectX, rectY, rectW, rectH) {
        const closestX = Math.max(rectX, Math.min(cx, rectX + rectW));
        const closestY = Math.max(rectY, Math.min(cy, rectY + rectH));
        const dx = cx - closestX, dy = cy - closestY;
        return (dx * dx + dy * dy) <= (r * r);
    }
    function bigBulletHitsTank(b, tank) {
        return circleRectCollide(b.x, b.y, b.radius + 6 * SCALE, tank.x, tank.y, tank.w, tank.h);
    }
    function bulletsCollide(b1, b2) {
        const dx = b1.x - b2.x, dy = b1.y - b2.y;
        return dx * dx + dy * dy < (b1.radius + b2.radius) ** 2;
    }
    function onPlayerBulletDestroyed() {
        if (player.activeBullets > 0) player.activeBullets--;
        if (player.activeBullets === 0) player.reloadTimer = RELOAD_DURATION;
    }

    // ==================== 击杀 ====================
    function killEnemy(index) {
        const e = enemies[index];
        if (!e) return;
        let points = 10;
        if (!e.isBoss && (e.hasFastFire || e.hasSplitShot)) points = 15;
        if (e.isBoss) {
            createBossExplosion(e.x + e.w / 2, e.y + e.h / 2, e.w, e.h);
            playTankDestroySound();
            bossLevel++;
            dropPowerup(e.x + e.w / 2, e.y);
        } else {
            createTankDestroyEffect(e.x + e.w / 2, e.y + e.h / 2, e.w, e.h);
            playTankDestroySound();
            enemyKillCount++;
            if (enemyKillCount >= nextBossThreshold) {
                enemyKillCount = 0;
                spawnEnemy(true);
            }
        }
        enemies.splice(index, 1);
        score += points;
        updateHighScore();
        hudDirty = true;
    }

    function applyBigBulletExplosionDamage(x, y, explosionRadius) {
        for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            const eCX = e.x + e.w / 2, eCY = e.y + e.h / 2;
            const dx = eCX - x, dy = eCY - y;
            const combinedRadius = explosionRadius + Math.max(e.w, e.h) * 0.5;
            if (dx * dx + dy * dy <= combinedRadius * combinedRadius) {
                const dmg = e.isBoss ? 2 : e.hp;
                e.hp -= dmg;
                if (e.hp <= 0) killEnemy(j);
                else hudDirty = true;
            }
        }
    }

    function applyAirstrikeExplosionDamage(x, y, explosionRadius) {
        for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            const eCX = e.x + e.w / 2, eCY = e.y + e.h / 2;
            const dx = eCX - x, dy = eCY - y;
            const combinedRadius = explosionRadius + Math.max(e.w, e.h) * 0.5;
            if (dx * dx + dy * dy <= combinedRadius * combinedRadius) {
                e.hp -= 2;
                if (e.hp <= 0) killEnemy(j);
                else hudDirty = true;
            }
        }
        if (!gameOver) {
            const pCX = player.x + player.w / 2, pCY = player.y + player.h / 2;
            const dx = pCX - x, dy = pCY - y;
            const combinedRadius = explosionRadius + Math.max(player.w, player.h) * 0.5;
            if (dx * dx + dy * dy <= combinedRadius * combinedRadius) {
                if (player.shield > 0) {
                    player.shield = 0;
                } else {
                    playerHP -= 2;
                    player.splitShot = 1;
                    player.bigBullet = false;
                    if (playerHP <= 0) {
                        playerHP = 0;
                        gameOver = true;
                        updateHighScore();
                        saveTotalTime();
                        isPlaying = false;
                    }
                    hudDirty = true;
                }
                updateBuffDisplay();
                playPlayerHitSound();
            }
        }
    }

    // ==================== 子弹对撞 ====================
    // 优化：单次遍历收集冲突对，避免二次遍历 + Set
    function handleBulletClashes() {
        const removed = [];
        for (let i = 0; i < bullets.length; i++) {
            const b1 = bullets[i];
            if (!b1 || !b1.isPlayerBullet) continue;
            let alreadyRemoved = false;
            for (let k = 0; k < removed.length; k++) { if (removed[k] === b1) { alreadyRemoved = true; break; } }
            if (alreadyRemoved) continue;
            for (let j = 0; j < bullets.length; j++) {
                const b2 = bullets[j];
                if (!b2 || b1 === b2 || !b2.isEnemy) continue;
                let b2Removed = false;
                for (let k = 0; k < removed.length; k++) { if (removed[k] === b2) { b2Removed = true; break; } }
                if (b2Removed) continue;
                if (bulletsCollide(b1, b2)) {
                    const cx = (b1.x + b2.x) / 2;
                    const cy = (b1.y + b2.y) / 2;
                    if (b1.isBig || b2.isBig) {
                        const explosionRadius = createBigBulletGroundExplosion(cx, cy);
                        playExplosionSound();
                        playTankDestroySound();
                        applyBigBulletExplosionDamage(cx, cy, explosionRadius);
                    } else {
                        createBulletClashExplosion(cx, cy);
                        playBulletClashSound();
                    }
                    score += 1;
                    updateHighScore();
                    removed.push(b1, b2);
                    break;
                }
            }
        }
        if (removed.length > 0) {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                for (let k = 0; k < removed.length; k++) {
                    if (removed[k] === b) {
                        bullets.splice(i, 1);
                        if (b.isPlayerBullet) onPlayerBulletDestroyed();
                        break;
                    }
                }
            }
        }
    }

    function createTankDestroyEffect(x, y, w, h) {

            });

            explosions.push({

    function createBigBulletGroundExplosion(x, y) {
        const baseR = 90 * SCALE * 0.7;
        explosions.push({ type: 'big-ground-core', x, y, radius: 0, maxRadius: baseR, life: 0.6, maxLife: 0.6 });
        explosions.push({ type: 'big-ground-ring', x, y, radius: baseR * 0.3, maxRadius: baseR * 2.4, life: 0.7, maxLife: 0.7 });
        for (let i = 0; i < 24; i++) {
            const angle = -Math.PI * 0.1 - Math.random() * Math.PI * 0.8;
            const speed = randomRange(200, 420) * SCALE;
            explosions.push({
                type: 'big-ground-particle', x, y,
                vx: Math.cos(angle) * speed,
                vy: -Math.abs(Math.sin(angle) * speed) - 100 * SCALE,
                life: randomRange(0.5, 1.0), maxLife: 1.0,
                size: randomRange(4, 9) * SCALE,
                color: Math.random() < 0.5 ? '#ffdd44' : '#ff8800'
            });
        }
        for (let i = 0; i < 10; i++) {
            explosions.push({
                type: 'big-ground-smoke',
                x: x + randomRange(-baseR * 0.6, baseR * 0.6),
                y: y + randomRange(-10, 10) * SCALE,
                vx: randomRange(-60, 60) * SCALE,
                vy: randomRange(-120, -60) * SCALE,
                life: randomRange(0.7, 1.3), maxLife: 1.3,
                size: randomRange(20, 40) * SCALE
            });
        }
        return baseR * 1.6 * 0.7;
