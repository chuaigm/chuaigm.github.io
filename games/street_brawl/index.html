                x += bw + 5 + hash(i * 5 + 4 + seed) * 16;
                i++;
            }
        }
    }

    function drawBelt() {
        const th = THEMES[curLevel().theme];
        ctx.fillStyle = roadGrad;
        ctx.fillRect(0, BELT_BACK, W, H - BELT_BACK);

        // 远处的护栏/路缘
        ctx.fillStyle = th.curb;
        ctx.fillRect(0, BELT_BACK - 10, W, 12);
        ctx.fillStyle = th.curbTop;
        ctx.fillRect(0, BELT_BACK - 10, W, 4);
        ctx.fillStyle = 'rgba(255,255,255,0.10)';
        for (let x = 20; x < W; x += 74) ctx.fillRect(x, BELT_BACK - 8, 4, 8);

        const theme = curLevel().theme;
        if (theme === 'market') {
            // 斑马线：横跨街道的白色条纹
            ctx.fillStyle = 'rgba(230,235,245,0.10)';
            for (let i = 0; i < 9; i++) {
                const x = 150 + i * 118;
                ctx.beginPath();
                ctx.moveTo(x, BELT_BACK + 4);
                ctx.lineTo(x + 62, BELT_BACK + 4);
                ctx.lineTo(x + 30, H);
                ctx.lineTo(x - 26, H);
                ctx.closePath();
                ctx.fill();
            }
            // 积水：映着霓虹
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            for (let i = 0; i < 5; i++) {
                const px = 150 + i * 230 + hash(i * 3 + bgSeed) * 60;
                const py = depthY(0.72 - i * 0.11);
                ctx.fillStyle = i % 2 ? 'rgba(255,95,162,0.10)' : 'rgba(90,209,255,0.10)';
                ctx.beginPath();
                ctx.ellipse(px, py, 88, 12, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        } else if (theme === 'dock') {
            // 危险区斜纹
            ctx.fillStyle = 'rgba(240,200,60,0.13)';
            for (let x = -60; x < W + 60; x += 48) {
                ctx.beginPath();
                ctx.moveTo(x, BELT_BACK + 6);
                ctx.lineTo(x + 26, BELT_BACK + 6);
                ctx.lineTo(x + 6, BELT_BACK + 30);
                ctx.lineTo(x - 20, BELT_BACK + 30);
                ctx.closePath();
                ctx.fill();
            }
            // 油污
            ctx.fillStyle = 'rgba(0,0,0,0.22)';
            for (let i = 0; i < 6; i++) {
                const px = 90 + hash(i * 17 + bgSeed) * (W - 180);
                const d = 0.15 + i * 0.13;
                ctx.beginPath();
                ctx.ellipse(px, depthY(d), 60 + i * 14, 11, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        } else {
            // 天台：分格水泥板
            ctx.strokeStyle = 'rgba(255,255,255,0.045)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 12; i++) {
                const x = i * (W / 12);
                ctx.beginPath();
                ctx.moveTo(x, BELT_BACK + 6);
                ctx.lineTo(x - 40, H);
                ctx.stroke();
            }
            // 停机坪圆环
            ctx.strokeStyle = 'rgba(255,220,150,0.14)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.ellipse(W / 2, depthY(0.5), 210, 52, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(W / 2, depthY(0.5), 170, 42, 0, 0, Math.PI * 2);
            ctx.stroke();
            // 边缘护栏（画在地面最上沿）
            ctx.strokeStyle = 'rgba(180,190,210,0.22)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, BELT_BACK - 2);
            ctx.lineTo(W, BELT_BACK - 2);
            ctx.stroke();
            for (let x = 10; x < W; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, BELT_BACK - 2);
                ctx.lineTo(x, BELT_BACK - 16);
                ctx.stroke();
            }
        }

        // 纵深参考线：帮助判断是否同一水平线
        for (let d = 0; d <= 1.0001; d += 0.125) {
            const y = depthY(d);
            const major = Math.abs(d * 8 - Math.round(d * 8)) < 0.01 && Math.round(d * 8) % 2 === 0;
            ctx.strokeStyle = major ? 'rgba(150, 180, 230, 0.20)' : 'rgba(150, 180, 230, 0.09)';
            ctx.lineWidth = major ? 2 : 1;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(W, y);
            ctx.stroke();
        }

        // 中线
        if (theme !== 'rooftop') {
            ctx.strokeStyle = 'rgba(255, 230, 150, 0.16)';
            ctx.lineWidth = 3;
            ctx.setLineDash([26, 22]);
            ctx.beginPath();
            ctx.moveTo(0, depthY(0.5));
            ctx.lineTo(W, depthY(0.5));
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // 地面纹理
        ctx.strokeStyle = 'rgba(255,255,255,0.035)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 16; i++) {
            const t = i / 16;
            const y0 = depthY(t);
            ctx.beginPath();
            ctx.moveTo(0, y0);
            ctx.lineTo(W, y0 + 8);
            ctx.stroke();
        }
    }

    function drawShadow(f) {
        const y = depthY(f.depth);
        const s = depthScale(f.depth);
        const k = clamp(1 - f.alt / (JUMP_MAX * 2.4), 0.32, 1);
        ctx.save();
        ctx.globalAlpha = 0.34 * k;
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        // 倒地后身体摊平，投影随之变宽变扁
        if (f.dead) {
            ctx.ellipse(f.x, y + 3 * FIG_K, 58 * FIG_K * s, 8 * FIG_K * s, 0, 0, Math.PI * 2);
        } else {
            ctx.ellipse(f.x, y + 4 * FIG_K, 34 * FIG_K * s * k, 10 * FIG_K * s * k, 0, 0, Math.PI * 2);
        }
        ctx.fill();
        ctx.restore();
    }

    function spinProgress(f, ph) {
        const mv = MOVES[f.atk] || { windup: 0.1, active: 0.1, rec: 0.1 };
        const total = mv.windup + mv.active + mv.rec;
        if (ph === 'windup') return -0.25 * (f.atkT / Math.max(0.01, mv.windup));
        if (ph === 'active') return 1;
        return 1 - clamp(f.atkT / Math.max(0.01, mv.rec), 0, 1) * 0.55;
    }

    // ==================== 绘制：人物 ====================
    const OUTLINE = 'rgba(12, 16, 30, 0.55)';

    function drawTube(x1, y1, x2, y2, w, color) {
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = OUTLINE;
        ctx.lineWidth = w + 2.2;
        ctx.beginPath();
        ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        ctx.strokeStyle = color;
        ctx.lineWidth = w;
        ctx.beginPath();
        ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }

    // 整条腿一次成形：髋→膝→踝是一条连续曲线，沿线做变宽偏移后整体填充+描边。
    // 大腿与小腿不再是两个独立图层，膝关节处自然没有硬边接缝。
    function drawLeg(hx, hy, kx, ky, ax, ay, wThigh, wShin, cUp, cDown, S) {
        const N = 20;
        const m0x = (hx + kx) * 0.5, m0y = (hy + ky) * 0.5;
        const m1x = (kx + ax) * 0.5, m1y = (ky + ay) * 0.5;
        const sxp = hx + (ax - hx) * 0.5, syp = hy + (ay - hy) * 0.5;
        // 两段二次贝塞尔的控制点向髋-踝连线靠拢，把膝部的折角抹圆
        const c1x = m0x + (sxp - m0x) * 0.34, c1y = m0y + (syp - m0y) * 0.34;
        const c2x = m1x + (sxp - m1x) * 0.34, c2y = m1y + (syp - m1y) * 0.34;

        const pts = [];
        for (let i = 0; i <= N; i++) {
            const t = i / N;
            const u = t <= 0.5 ? t * 2 : (t - 0.5) * 2;
            const iu = 1 - u;
            let px, py;
            if (t <= 0.5) {
                px = iu * iu * hx + 2 * iu * u * c1x + u * u * kx;
                py = iu * iu * hy + 2 * iu * u * c1y + u * u * ky;
            } else {
                px = iu * iu * kx + 2 * iu * u * c2x + u * u * ax;
                py = iu * iu * ky + 2 * iu * u * c2y + u * u * ay;
            }
            pts.push({ x: px, y: py });
        }

        // 膝在中心线上的参数位置（限制在合理区间，保证半宽锚点单调递增）
        let tkRaw = 0.5, best = Infinity;
        for (let i = 0; i <= N; i++) {
            const ddx = pts[i].x - kx, ddy = pts[i].y - ky;
            const d = ddx * ddx + ddy * ddy;
            if (d < best) { best = d; tkRaw = i / N; }
        }
        const tk = clamp(tkRaw, 0.20, 0.80);

        // 半宽锚点：髋最粗 → 股四头肌 → 膝部收细 → 小腿肚 → 脚踝
        const anchors = [
            [0.00, wThigh * 1.06],
            [Math.max(0.05, tk - 0.36), wThigh * 1.02],
            [Math.max(0.09, tk - 0.12), wThigh * 0.92],
            [tk, wThigh * 0.82],
            [Math.min(0.93, tk + 0.17), wShin * 1.26],
            [Math.min(0.99, tk + 0.36), wShin * 1.00],
            [1.00, wShin * 0.78]
        ];
        const halfAt = (t) => {
            let i = 0;
            while (i < anchors.length - 2 && anchors[i + 1][0] < t) i++;
            const a = anchors[i], b = anchors[i + 1];
            const span = b[0] - a[0] || 1;
            let u = clamp((t - a[0]) / span, 0, 1);
            u = u * u * (3 - 2 * u);
            return (a[1] + (b[1] - a[1]) * u) * 0.5;
        };

        // 法线（局部 +n 指向后侧）与正反两侧的轮廓点
        const nrm = [], fr = [], bk = [];
        for (let i = 0; i <= N; i++) {
            const a = pts[Math.max(0, i - 1)], b = pts[Math.min(N, i + 1)];
            let dx = b.x - a.x, dy = b.y - a.y;
            const L = Math.hypot(dx, dy) || 1;
            const nx = -dy / L, ny = dx / L;
            const w = halfAt(i / N);
            nrm.push({ x: nx, y: ny });
            fr.push({ x: pts[i].x - nx * w, y: pts[i].y - ny * w });
            bk.push({ x: pts[i].x + nx * w, y: pts[i].y + ny * w });
        }
        const ang0 = Math.atan2(nrm[0].y, nrm[0].x);
        const angN = Math.atan2(nrm[N].y, nrm[N].x);
        const wHip = halfAt(0), wAnk = halfAt(1);

        const trace = () => {
            ctx.beginPath();
            ctx.moveTo(fr[0].x, fr[0].y);
            for (let i = 1; i <= N; i++) ctx.lineTo(fr[i].x, fr[i].y);
            ctx.arc(ax, ay, wAnk, angN, angN - Math.PI, true);        // 脚踝端圆头
            for (let i = N - 1; i >= 0; i--) ctx.lineTo(bk[i].x, bk[i].y);
            ctx.arc(hx, hy, wHip, ang0 + Math.PI, ang0, true);        // 髋端圆头
            ctx.closePath();
        };

        ctx.save();
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.strokeStyle = OUTLINE;
        ctx.lineWidth = Math.max(1.8, 1.6 * S);
        trace(); ctx.stroke();
        ctx.fillStyle = cUp;
        trace(); ctx.fill();

        ctx.save();
        trace(); ctx.clip();

        // 小腿换成深一号的裤色，过渡带柔和渐入，膝下不再出现生硬换色
        const ik = Math.round(tk * N);
        ctx.fillStyle = cDown;
        const j0 = Math.max(0, ik - 5);
        for (let j = j0; j < N; j++) {
            ctx.globalAlpha = 0.34 * clamp((j - j0) / 5, 0, 1);
            ctx.beginPath();
            ctx.moveTo(fr[j].x, fr[j].y);
            ctx.lineTo(fr[j + 1].x, fr[j + 1].y);
            ctx.lineTo(bk[j + 1].x, bk[j + 1].y);
            ctx.lineTo(bk[j].x, bk[j].y);
            ctx.closePath();
            ctx.fill();
        }
        ctx.globalAlpha = 1;

        // 后侧压暗 / 前侧受光，做出圆柱体积
        const strip = (innerK, outerK, style) => {
            ctx.fillStyle = style;
            ctx.beginPath();
            for (let i = 0; i <= N; i++) {
                const w = halfAt(i / N), n = nrm[i], p = pts[i];
                const x = p.x + n.x * w * innerK, y = p.y + n.y * w * innerK;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            for (let i = N; i >= 0; i--) {
                const w = halfAt(i / N), n = nrm[i], p = pts[i];
                ctx.lineTo(p.x + n.x * w * outerK, p.y + n.y * w * outerK);
            }
            ctx.closePath();
            ctx.fill();
        };
        strip(0.30, 1.06, 'rgba(8, 12, 26, 0.17)');
        strip(-0.98, -0.46, 'rgba(255, 255, 255, 0.12)');

        // 膝关节细节：上方一道柔和压痕
        const kp = pts[ik], kn = nrm[ik];
        const kw = halfAt(tk);
        const angK = Math.atan2(kn.y, kn.x);
        ctx.lineCap = 'round';
        ctx.strokeStyle = 'rgba(8, 12, 26, 0.20)';
        ctx.lineWidth = Math.max(1, 1.9 * S);
        ctx.beginPath();
        ctx.arc(kp.x, kp.y, kw * 0.86, angK, angK + Math.PI);
        ctx.stroke();

        // 裤脚
        const ic = Math.min(N, Math.round(0.86 * N));
        const cw = halfAt(0.86);
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.26)';
        ctx.lineWidth = Math.max(1.5, 2.6 * S);
        ctx.lineCap = 'butt';
        ctx.beginPath();
        ctx.moveTo(pts[ic].x + nrm[ic].x * cw, pts[ic].y + nrm[ic].y * cw);
        ctx.lineTo(pts[ic].x - nrm[ic].x * cw, pts[ic].y - nrm[ic].y * cw);
        ctx.stroke();
        ctx.restore();
        ctx.restore();
    }

    // 躯干轮廓：绘制空间统一朝右，前（胸）侧外挺、后（背）侧平直，带侧向偏身感
    // nx = 颈轴位置（侧身像下前移到领口开口中心）；颈根那条凹线跟着 nx 走，并做成后窄前宽
    // bx = 背侧最左边界：侧身像里躯干不能比近侧手臂（肩膀）画得更靠左，否则轮廓会多出一块
    function traceTorsoPath(cx, nx, bx, shY, hipY, shHalf, waHalf, hpHalf) {
        const th = hipY - shY;
        const nk = shHalf * 0.34;
        const nkB = nk * 0.82;          // 颈孔后侧（靠后颈）收紧
        const nkF = nk * 1.43;          // 颈孔前侧（靠胸口）放宽，右端正好落在白色 V 领的前端点上
        const backSh = { x: bx, y: shY + th * 0.14 };
        const frontSh = cx + shHalf * 1.04;
        ctx.beginPath();
        // 背侧：较直，整体不越过 bx
        ctx.moveTo(backSh.x, backSh.y);
        ctx.bezierCurveTo(Math.max(cx - shHalf * 1.01, bx), shY + th * 0.44, Math.max(cx - waHalf * 1.06, bx), shY + th * 0.68, Math.max(cx - hpHalf * 0.99, bx), hipY + th * 0.05);
        // 髋底：略向前偏
        ctx.quadraticCurveTo(cx + hpHalf * 0.14, hipY + th * 0.20, cx + hpHalf * 1.03, hipY + th * 0.05);
        // 胸侧：外挺
        ctx.bezierCurveTo(cx + waHalf * 1.30, shY + th * 0.68, cx + shHalf * 1.14, shY + th * 0.44, frontSh, shY + th * 0.14);
        // 斜方肌 + 颈根：衣领与脖子上缘交界的这条凹线，中心与领口开口、脖子对齐
        ctx.quadraticCurveTo(nx + shHalf * 0.62, shY - th * 0.07, nx + nkF, shY - th * 0.038);
        ctx.quadraticCurveTo(nx + nkB * 0.22, shY + th * 0.125, nx - nkB, shY - th * 0.03);
        ctx.quadraticCurveTo(nx - shHalf * 0.60, shY - th * 0.07, backSh.x, backSh.y);
        ctx.closePath();
    }

    // 骨盆/短裤：把两条大腿和躯干衔接起来
    function tracePelvisPath(cx, topY, halfW, drop) {
        ctx.beginPath();
        ctx.moveTo(cx - halfW, topY - drop * 0.55);
        ctx.quadraticCurveTo(cx, topY - drop * 0.90, cx + halfW, topY - drop * 0.55);
        ctx.lineTo(cx + halfW * 0.86, topY + drop * 0.72);
        ctx.quadraticCurveTo(cx, topY + drop, cx - halfW * 0.86, topY + drop * 0.72);
        ctx.closePath();
    }

    // 在肢体上画一圈横向束带（纹身/护腕）
    function drawBand(x0, y0, x1, y1, t, width, thick, color) {
        let dx = x1 - x0, dy = y1 - y0;
        const L = Math.hypot(dx, dy) || 1;
        dx /= L; dy /= L;
        const bx = x0 + dx * L * t, by = y0 + dy * L * t;
        ctx.strokeStyle = color;
        ctx.lineWidth = thick;
        ctx.lineCap = 'butt';
        ctx.beginPath();
        ctx.moveTo(bx + dy * width * 0.5, by - dx * width * 0.5);
        ctx.lineTo(bx - dy * width * 0.5, by + dx * width * 0.5);
        ctx.stroke();
    }

    function drawShoe(x, y, angle, scale, col, accent) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        ctx.rotate(angle);
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

// 鞋帮：后帮 → 鞋口 → 鞋面 → 鞋头（前掌略长、后跟略收）
        const upper = () => {
            ctx.beginPath();
            ctx.moveTo(-7.0, -2.3);
            ctx.quadraticCurveTo(-6.7, -4.6, -4.0, -5.0);
            ctx.quadraticCurveTo(0.2, -2.6, 4.2, -2.6);
            ctx.quadraticCurveTo(8.0, -2.0, 11.2, -1.2);
            ctx.quadraticCurveTo(14.9, -0.1, 16.4, 1.4);
            ctx.quadraticCurveTo(17.5, 3.0, 15.5, 3.8);
            ctx.lineTo(-7.0, 3.8);
            ctx.closePath();
        };
        upper();
        ctx.strokeStyle = OUTLINE;
        ctx.lineWidth = 2.6;
        ctx.stroke();
        ctx.fillStyle = col.shoe;
        ctx.fill();

        // 包头 + 鞋面高光 + 后跟暗部
        ctx.save();
        upper();
        ctx.clip();
        ctx.fillStyle = col.shoeDark;
        ctx.beginPath();
        ctx.moveTo(10.4, -1.9);
        ctx.quadraticCurveTo(15.0, -0.9, 16.7, 1.6);
        ctx.quadraticCurveTo(17.8, 3.0, 15.4, 3.9);
        ctx.lineTo(10.4, 3.9);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.16)';
        ctx.beginPath();
        ctx.ellipse(4.2, -1.7, 6.2, 1.1, -0.14, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.16)';
        ctx.beginPath();
        ctx.ellipse(-6.2, 0.4, 1.8, 3.4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // 侧边特征条
        if (accent) {
            ctx.fillStyle = accent;
            ctx.beginPath();
            ctx.moveTo(-3.4, 0.6);
            ctx.quadraticCurveTo(3.0, 0.0, 8.4, 1.5);
            ctx.lineTo(7.3, 2.6);
            ctx.quadraticCurveTo(2.4, 1.1, -3.6, 1.9);
            ctx.closePath();
            ctx.fill();
        }

        // 鞋带
        ctx.strokeStyle = 'rgba(255,255,255,0.55)';
        ctx.lineWidth = 1.1;
        for (let i = 0; i < 3; i++) {
            const bx = 1.4 + i * 2.3, by = -2.3 + i * 0.45;
            ctx.beginPath();
            ctx.moveTo(bx, by);
            ctx.lineTo(bx + 2.2, by + 0.9);
            ctx.stroke();
        }
        // 鞋口压边：跟着鞋口那段向下的弧
        ctx.strokeStyle = 'rgba(0,0,0,0.26)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(-5.6, -3.5);
        ctx.quadraticCurveTo(0.2, -1.9, 4.8, -1.9);
        ctx.stroke();

        // 中底 + 大底：后跟略厚、前掌翘起，鞋底不再是直板
        const sole = () => {
            ctx.beginPath();
            ctx.moveTo(-7.1, 3.3);
            ctx.quadraticCurveTo(-8.0, 5.4, -5.4, 5.8);
            ctx.lineTo(10.6, 5.8);
            ctx.quadraticCurveTo(14.8, 5.6, 16.7, 2.7);
            ctx.lineTo(15.1, 3.6);
            ctx.closePath();
        };
        sole();
        ctx.strokeStyle = OUTLINE;
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.fillStyle = '#f2f4f8';
        ctx.fill();
        // 橡胶大底：厚度均匀，跟着前掌一起翘起
        ctx.save();
        sole();
        ctx.clip();
        ctx.fillStyle = '#2b2f38';
        ctx.beginPath();
        ctx.moveTo(-8.4, 4.8);
        ctx.lineTo(10.6, 4.8);
        ctx.lineTo(16.9, 1.3);
        ctx.lineTo(18.4, 7.4);
        ctx.lineTo(-8.4, 7.4);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        ctx.restore();
    }

    // 小臂照常绘制，再在小臂末端接上拳头（拳面是指关节轮廓，整体沿小臂方向）
    function drawForearmFist(ex, ey, hx, hy, wF, rF, foreCol, side, col, S) {
        // 小臂
        drawTube(ex, ey, hx, hy, wF, foreCol);

        let dx = hx - ex, dy = hy - ey;
        const L = Math.hypot(dx, dy) || 1;
        dx /= L; dy /= L;
        const px = -dy, py = dx;                            // 局部 +y（手臂方向的左侧）
        const a = Math.min(wF * 0.5, rF * 0.74);            // 腕部半宽
        const bw = Math.min(rF * 0.60, L * 0.42);           // 腕点压在小臂上
        // 拳面轮廓（局部坐标：原点=拳心，+x=出拳方向）；三段指关节凸起 + 两道指间凹口
        const c = [
            [-bw, -a],
            [rF * 0.16, -rF * 0.96], [rF * 0.70, -rF * 0.74], [rF * 0.80, -rF * 0.40],
            [rF * 0.98, -rF * 0.06], [rF * 1.00, rF * 0.16], [rF * 0.80, rF * 0.42],
            [rF * 0.70, rF * 0.76], [rF * 0.16, rF * 0.98],
            [-bw, a]
        ];
        const W = c.map(p => ({ x: hx + dx * p[0] + px * p[1], y: hy + dy * p[0] + py * p[1] }));

        ctx.save();
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(W[0].x, W[0].y);
        // 中点法平滑折线，得到圆润的指关节轮廓
        for (let i = 1; i < W.length - 2; i++) {
            ctx.quadraticCurveTo(W[i].x, W[i].y, (W[i].x + W[i + 1].x) * 0.5, (W[i].y + W[i + 1].y) * 0.5);
        }
        ctx.lineTo(W[W.length - 1].x, W[W.length - 1].y);
        ctx.strokeStyle = OUTLINE;                          // 只描拳面，腕部不画线
        ctx.lineWidth = 2.2;
        ctx.stroke();
        ctx.closePath();
        ctx.fillStyle = col.skin;                           // 填色盖住小臂末端的圆头
        ctx.fill();

        // 拳内部（局部坐标，+x 沿手臂方向）
        ctx.save();
        ctx.translate(hx, hy);
        ctx.rotate(Math.atan2(dy, dx));
        drawFistDetail(rF, side, col);
        ctx.restore();
        ctx.restore();
    }

    // side=-1 远侧手（朝右时=右手）：只有指关节轮廓的体积，不画指缝与拇指
    // side= 1 近侧手（朝右时=左手）：拳心，带指缝；拇指在手臂方向的右侧（局部 -y）
    function drawFistDetail(r, side, col) {
        const dark = col.skinDark;
        const light = 'rgba(255,255,255,0.24)';

        if (side < 0) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(-r * 0.95, -r * 0.70);
            ctx.quadraticCurveTo(-r * 0.30, -r * 0.98, r * 0.30, -r * 0.92);
            ctx.quadraticCurveTo(r * 0.78, -r * 0.76, r * 0.90, -r * 0.20);
            ctx.quadraticCurveTo(r * 0.96, 0, r * 0.90, r * 0.20);
            ctx.quadraticCurveTo(r * 0.78, r * 0.76, r * 0.30, r * 0.92);
            ctx.quadraticCurveTo(-r * 0.30, r * 0.98, -r * 0.95, r * 0.70);
            ctx.closePath();
            ctx.clip();
            ctx.fillStyle = light;
            ctx.beginPath();
            ctx.ellipse(-r * 0.10, -r * 0.44, r * 0.68, r * 0.30, -0.22, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 0.42;                       // 阴影更淡
            ctx.fillStyle = dark;
            ctx.beginPath();
            ctx.ellipse(r * 0.06, r * 0.66, r * 0.50, r * 0.20, -0.16, 0, Math.PI * 2);   // 更窄
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.restore();
            return;
        }

        // 拳心：三条指缝横过拳面（向 -y 反向弯曲）
        ctx.strokeStyle = dark;
        ctx.lineWidth = Math.max(0.8, r * 0.12);
        ctx.lineCap = 'round';
        const seamY = [-0.42, 0.02, 0.44];
        for (let i = 0; i < seamY.length; i++) {
            const y = r * seamY[i];
            ctx.beginPath();
            ctx.moveTo(r * 0.62, y - r * 0.04);
            ctx.quadraticCurveTo(r * 0.16, y + r * 0.11, -r * 0.22, y - r * 0.10);
            ctx.stroke();
        }
        // 拇指：压在最上层，位于手臂方向的右侧
        ctx.save();
        ctx.translate(r * 0.08, -r * 0.44);
        ctx.rotate(0.54);
        roundRectPath(-r * 0.46, -r * 0.25, r * 1.00, r * 0.50, r * 0.25);
        ctx.fillStyle = OUTLINE;
        ctx.lineWidth = Math.max(1.0, r * 0.20);
        ctx.stroke();
        ctx.fill();
        roundRectPath(-r * 0.44, -r * 0.23, r * 0.96, r * 0.46, r * 0.23);
        ctx.fillStyle = col.skin;
        ctx.fill();
        roundRectPath(-r * 0.40, -r * 0.21, r * 0.88, r * 0.15, r * 0.08);
        ctx.fillStyle = light;
        ctx.fill();
        roundRectPath(-r * 0.40, r * 0.10, r * 0.88, r * 0.13, r * 0.07);
        ctx.fillStyle = dark;
        ctx.fill();
        ctx.restore();
    }

    // 上臂：填充后分段描边，skipInner 表示肩部那一侧（局部 -y，屏幕右侧）不描线，与躯干自然融合
    function drawUpperArm(x1, y1, x2, y2, w, color, skipInner, S) {
        let dx = x2 - x1, dy = y2 - y1;
        const L = Math.hypot(dx, dy) || 1;
        dx /= L; dy /= L;
        const nx = -dy, ny = dx;
        const a = w * 0.5;
        const angN = Math.atan2(ny, nx);
        const l1x = x1 + nx * a, l1y = y1 + ny * a;
        const l2x = x2 + nx * a, l2y = y2 + ny * a;
        const r1x = x1 - nx * a, r1y = y1 - ny * a;
        const r2x = x2 - nx * a, r2y = y2 - ny * a;
        ctx.save();
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(l1x, l1y);
        ctx.lineTo(l2x, l2y);
        ctx.arc(x2, y2, a, angN, angN - Math.PI, true);   // 肘端圆头（向后不描线）
        ctx.lineTo(r1x, r1y);
        ctx.arc(x1, y1, a, angN - Math.PI, angN, true);   // 肩端圆头
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = OUTLINE;
        ctx.lineWidth = 2.2;
        // 外侧整条描边
        ctx.beginPath();
        ctx.moveTo(l1x, l1y);
        ctx.lineTo(l2x, l2y);
        ctx.stroke();
        // 内侧：肩部一段省略
        const t0 = skipInner ? 0.46 : 0;
        ctx.beginPath();
        ctx.moveTo(r1x + dx * L * t0, r1y + dy * L * t0);
        ctx.lineTo(r2x, r2y);
        ctx.stroke();
        ctx.restore();
    }

    function drawHair(kind, hairCol, cx, headY, headR, s) {
        ctx.lineJoin = 'round';
        ctx.strokeStyle = OUTLINE;
        ctx.lineWidth = 1.3 * s;
        ctx.fillStyle = hairCol;
        if (kind === 'mohawk') {
            // 头皮底座
            ctx.beginPath();
            ctx.ellipse(cx, headY - headR * 0.58, headR * 0.96, headR * 0.72, 0, Math.PI, 0);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            // 竖起的莫西干
            ctx.beginPath();
            ctx.moveTo(cx - headR * 0.90, headY - headR * 0.50);
            const n = 7;
            for (let i = 0; i <= n; i++) {
                const t = i / n;
                const px = cx + (t - 0.5) * headR * 1.80;
                const hgt = headR * (0.75 + 0.55 * Math.sin(t * Math.PI));
                const jag = (i % 2 === 0) ? headR * 0.24 : 0;
                ctx.lineTo(px, headY - headR * 0.50 - hgt + jag);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        } else if (kind === 'buzz') {
            ctx.beginPath();
            ctx.arc(cx, headY - headR * 0.08, headR * 1.0, Math.PI * 1.03, Math.PI * 1.97);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            // 鬓角
            ctx.fillRect(cx - headR * 1.0, headY - headR * 0.34, headR * 0.17, headR * 0.48);
            ctx.fillRect(cx + headR * 0.83, headY - headR * 0.34, headR * 0.17, headR * 0.48);
        } else if (kind === 'bald') {
            // 光头：只在头顶留一圈发根阴影与高光
            ctx.fillStyle = hairCol;
            ctx.beginPath();
            ctx.arc(cx, headY - headR * 0.10, headR * 0.99, Math.PI * 1.10, Math.PI * 1.90);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,0.22)';
            ctx.beginPath();
            ctx.ellipse(cx + headR * 0.26, headY - headR * 0.62, headR * 0.40, headR * 0.20, -0.35, 0, Math.PI * 2);
            ctx.fill();
        } else if (kind === 'flat') {
            // 平头：紧贴头骨的一圈短发 + 平整刘海
            ctx.beginPath();
            ctx.arc(cx, headY - headR * 0.02, headR * 1.01, Math.PI * 1.06, Math.PI * 1.94);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(cx - headR * 0.92, headY - headR * 0.46);
            ctx.lineTo(cx + headR * 0.94, headY - headR * 0.52);
            ctx.lineTo(cx + headR * 0.92, headY - headR * 0.74);
            ctx.lineTo(cx - headR * 0.90, headY - headR * 0.70);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        } else {
            // 尖刺（玩家）：头皮下缘抬到眼睛之上，头带以下不遮脸
            ctx.beginPath();
            ctx.arc(cx, headY, headR, Math.PI * 1.138, Math.PI * 1.862, false);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            // 尖刺
            const n = 5;
            ctx.beginPath();
            ctx.moveTo(cx - headR * 0.90, headY - headR * 0.44);
            for (let i = 0; i < n; i++) {
                const x1 = cx + (-0.90 + ((i + 0.5) / n) * 1.80) * headR;
                const x2 = cx + (-0.90 + ((i + 1) / n) * 1.80) * headR;
                ctx.lineTo(x1, headY - headR * (1.18 + (i % 2) * 0.14));
                ctx.lineTo(x2, headY - headR * 0.46);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }
    }

    // 脖子几何：颈底锚在颈轴 nx，颈顶随头再前移到 hx（脖子朝胸口前倾）
    function neckGeom(nx, hx, headY, headR, shY, shHalf, h) {
        return {
            nTop: headY + headR * 0.52,
            nBot: shY + h * 0.028,
            topW: headR * 0.46,
            botW: shHalf * 0.42,
            tx: hx, bx: nx
        };
    }

    // 脖子：独立图形，上窄下宽并带下颌投影
    function drawNeck(g, h, col, S) {
        const nTop = g.nTop, nBot = g.nBot, topW = g.topW, botW = g.botW;
        const tx = g.tx, bx = g.bx;
        const mx = bx + (tx - bx) * 0.62;          // 颈身中段的中心（介于颈底与颈顶之间）
        const path = () => {
            ctx.beginPath();
            ctx.moveTo(tx - topW, nTop);
            ctx.quadraticCurveTo(tx, nTop - h * 0.008, tx + topW, nTop);
            ctx.quadraticCurveTo(mx + botW * 0.92, nTop + (nBot - nTop) * 0.62, bx + botW, nBot);
            ctx.quadraticCurveTo(bx, nBot + h * 0.016, bx - botW, nBot);
            ctx.quadraticCurveTo(mx - botW * 0.92, nTop + (nBot - nTop) * 0.62, tx - topW, nTop);
            ctx.closePath();
        };
        ctx.save();
        ctx.lineJoin = 'round';
        ctx.lineWidth = 2.4 * S;
        ctx.strokeStyle = OUTLINE;
        path(); ctx.stroke();
        ctx.fillStyle = col.skin;
        path(); ctx.fill();
        // 下颌投影 + 前侧受光
        ctx.save();
        path(); ctx.clip();
        ctx.fillStyle = 'rgba(96, 50, 24, 0.30)';
        ctx.fillRect(bx - botW * 1.4, nTop, botW * 2.8, (nBot - nTop) * 0.44);
        ctx.fillStyle = 'rgba(255, 240, 214, 0.16)';
        ctx.fillRect(bx + botW * 0.10, nTop, botW * 0.85, nBot - nTop);
        ctx.restore();
        ctx.restore();
    }

    function drawHead(f, style, col, cx, headY, headR, face, s, pose, ph, wf) {
        // 人脸轮廓：上半保持原来的正圆，下颌与下巴收窄
        const headShape = () => {
            ctx.beginPath();
            ctx.arc(cx, headY, headR, Math.PI, 0, false);
            ctx.quadraticCurveTo(cx + headR * 0.96, headY + headR * 0.50, cx + headR * 0.54, headY + headR * 0.84);
            ctx.quadraticCurveTo(cx + headR * 0.26, headY + headR * 1.04, cx, headY + headR * 1.04);
            ctx.quadraticCurveTo(cx - headR * 0.26, headY + headR * 1.04, cx - headR * 0.54, headY + headR * 0.84);
            ctx.quadraticCurveTo(cx - headR * 0.96, headY + headR * 0.50, cx - headR, headY);
            ctx.closePath();
        };

        // 耳朵：侧向只露出靠后的一只
        {
            const ex = cx - headR * 0.88;
            const ey = headY + headR * 0.12;
            ctx.fillStyle = OUTLINE;
            ctx.beginPath(); ctx.arc(ex, ey, headR * 0.25 + 1.1, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = col.skin;
            ctx.beginPath(); ctx.arc(ex, ey, headR * 0.25, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = col.skinDark;
            ctx.beginPath(); ctx.arc(ex + headR * 0.03, ey + headR * 0.02, headR * 0.10, 0, Math.PI * 2); ctx.fill();
        }

        // 脸
        ctx.save();
        ctx.lineJoin = 'round';
        ctx.lineWidth = 2.4 * s * 1.5;
        ctx.strokeStyle = OUTLINE;
        headShape(); ctx.stroke();
        ctx.fillStyle = col.skin;
        headShape(); ctx.fill();
        // 背光侧脸
        ctx.save();
        headShape();
        ctx.clip();
        ctx.fillStyle = 'rgba(110, 60, 30, 0.16)';
        ctx.fillRect(face > 0 ? cx - headR : cx, headY - headR * 1.2, headR, headR * 2.4);
        ctx.restore();

        // 五官整体向前（+x）偏移，形成侧/三四分脸
        const fx = cx + headR * 0.17;

        // 鼻子
        ctx.fillStyle = col.skinDark;
        ctx.beginPath();
        ctx.moveTo(fx + face * headR * 0.66, headY + headR * 0.00);
        ctx.lineTo(fx + face * headR * 0.24, headY + headR * 0.16);
        ctx.lineTo(fx + face * headR * 0.60, headY + headR * 0.24);
        ctx.closePath();
        ctx.fill();

        // 眼睛
        const look = lookTargetX(f);
        const gaze = clamp((look - f.x) / 160, -1, 1) * wf;
        const bl = Math.sin(f.bob * 2.4 + f.depth * 9);
        const blink = bl > 0.972;
        const eyeY = headY - headR * 0.14;
        const eyeR = headR * 0.21;
        const eyes = [fx - headR * 0.40, fx + headR * 0.34];
        for (let i = 0; i < 2; i++) {
            const ex = eyes[i];
            if (pose === 'ko') {
                ctx.strokeStyle = '#1e1e1e';
                ctx.lineWidth = headR * 0.13;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(ex - eyeR * 0.8, eyeY - eyeR * 0.5);
                ctx.lineTo(ex + eyeR * 0.8, eyeY + eyeR * 0.5);
                ctx.moveTo(ex + eyeR * 0.8, eyeY - eyeR * 0.5);
                ctx.lineTo(ex - eyeR * 0.8, eyeY + eyeR * 0.5);
                ctx.stroke();
            } else if (blink) {
                ctx.strokeStyle = '#1e1e1e';
                ctx.lineWidth = headR * 0.11;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(ex - eyeR * 0.85, eyeY);
                ctx.lineTo(ex + eyeR * 0.85, eyeY);
                ctx.stroke();
            } else {
                ctx.fillStyle = '#fdfdfd';
                ctx.beginPath(); ctx.ellipse(ex, eyeY, eyeR, eyeR * 0.92, 0, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#1e1e1e';
                ctx.beginPath();
                ctx.arc(ex + gaze * eyeR * 0.34, eyeY + (pose === 'hurt' ? eyeR * 0.2 : 0), eyeR * 0.52, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.9)';
                ctx.beginPath();
                ctx.arc(ex + gaze * eyeR * 0.34 - eyeR * 0.16, eyeY - eyeR * 0.18, eyeR * 0.18, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 眉毛
        const angry = (pose === 'jab' || pose === 'kick' || pose === 'rise');
        const browT = pose === 'hurt' ? -0.6 : (angry ? style.brow : (pose === 'ko' ? 0 : -0.12));
        ctx.strokeStyle = col.hair;
        ctx.lineWidth = headR * 0.17;
        ctx.lineCap = 'round';
        for (let i = 0; i < 2; i++) {
            const bx = eyes[i];
            const by = headY - headR * 0.48;
            ctx.beginPath();
            ctx.moveTo(bx - headR * 0.24, by + headR * 0.16 * browT);
            ctx.lineTo(bx + headR * 0.24, by - headR * 0.14 * browT);
            ctx.stroke();
        }

        // 嘴
        ctx.strokeStyle = '#1e1e1e';
        ctx.lineWidth = headR * 0.13;
        ctx.lineCap = 'round';
        const mx0 = fx - headR * 0.05;
        const my0 = headY + headR * 0.53;
        ctx.beginPath();
        if (pose === 'hurt' || pose === 'ko') {
            ctx.arc(mx0, my0 + headR * 0.16, headR * 0.34, 1.15 * Math.PI, 1.85 * Math.PI);
        } else if (pose === 'rise') {
            ctx.arc(mx0, my0 + headR * 0.14, headR * 0.30, 1.15 * Math.PI, 1.85 * Math.PI);
        } else if (angry && ph !== 'windup') {
            ctx.moveTo(mx0 - headR * 0.28, my0);
            ctx.lineTo(mx0 + face * headR * 0.30, my0 + headR * 0.06);
        } else {
            // 默认状态：抿嘴，不笑
            ctx.moveTo(mx0 - headR * 0.22, my0 - headR * 0.02);
            ctx.lineTo(mx0 + face * headR * 0.22, my0 + headR * 0.04);
        }
        ctx.stroke();

        // 面罩（foe2）
        if (style.mask) {
            ctx.fillStyle = OUTLINE;
            roundRectPath(fx - headR * 0.82, my0 - headR * 0.22, headR * 1.64, headR * 0.92, headR * 0.30);
            ctx.fill();
            ctx.fillStyle = style.cuffCol || '#3d2a63';
            roundRectPath(fx - headR * 0.76, my0 - headR * 0.18, headR * 1.52, headR * 0.84, headR * 0.28);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.14)';
            roundRectPath(fx - headR * 0.76, my0 - headR * 0.18, headR * 1.52, headR * 0.22, headR * 0.10);
            ctx.fill();
        }

        // 伤疤（foe1）
        if (style.scar) {
            ctx.strokeStyle = 'rgba(120, 50, 40, 0.8)';
            ctx.lineWidth = headR * 0.10;
            ctx.lineCap = 'round';
            const sx = fx - face * headR * 0.46, sy = headY - headR * 0.10;
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.lineTo(sx - face * headR * 0.18, sy + headR * 0.52);
            ctx.stroke();
            for (let i = 0; i < 3; i++) {
                const t = 0.2 + i * 0.3;
                const px = sx - face * headR * 0.18 * t, py = sy + headR * 0.52 * t;
                ctx.beginPath();
                ctx.moveTo(px - headR * 0.12, py - headR * 0.05);
                ctx.lineTo(px + headR * 0.10, py + headR * 0.05);
                ctx.stroke();
            }
        }

        // 头发
        drawHair(style.hair, col.hair, cx, headY, headR, s);

        // 头带 + 飘带（玩家）
        if (style.headband) {
            ctx.fillStyle = style.headband;
            ctx.fillRect(cx - headR * 1.02, headY - headR * 0.56, headR * 2.04, headR * 0.30);
            ctx.strokeStyle = OUTLINE;
            ctx.lineWidth = 1.1 * s;
            ctx.strokeRect(cx - headR * 1.02, headY - headR * 0.56, headR * 2.04, headR * 0.30);
            const kx = cx - face * headR * 0.98;
            const ky = headY - headR * 0.41;
            const flut = Math.sin(f.bob * 7 + f.walkPhase) * headR * 0.16;
            ctx.fillStyle = style.headband;
            ctx.beginPath();
            ctx.moveTo(kx, ky - headR * 0.10);
            ctx.quadraticCurveTo(kx - face * headR * 0.60, ky + headR * 0.34 + flut, kx - face * headR * 0.95, ky + headR * 0.86 + flut * 1.7);
            ctx.quadraticCurveTo(kx - face * headR * 0.52, ky + headR * 0.42 + flut, kx - face * headR * 0.22, ky + headR * 0.30);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.arc(kx, ky, headR * 0.17, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    function fighterPose(f) {
        const air = f.alt > 0.5;
        const ph = attackPhase(f);
        const moving = Math.abs(f.vx) > 20 || Math.abs(f.vDepth) > 0.06;
        let pose = 'idle';
        if (f.dead) pose = 'ko';
        else if (f.stunT > 0) pose = 'hurt';
        else if (ph === 'windup' || ph === 'active' || ph === 'recover') {
            const kind = MOVES[f.atk].kind;
            // 旋风腿复用踢腿骨架，靠 drawFighter 里的附加旋转做横扫
            pose = kind === 'spin' ? 'kick' : kind;
        } else if (f.hurtT > 0 || f.invuln > 0) pose = 'hurt';
        else if (air) pose = 'air';
        else if (f.landT > 0) pose = 'land';
        else if (moving) pose = 'walk';
        return { pose: pose, phase: ph };
    }

    function drawFighter(f) {
        const col = f.col;
        const style = f.style;
        const s = depthScale(f.depth);
        const cx = f.x;
        const wf = f.facing;      // 世界朝向（只用于倾身/视线）
        const face = 1;           // 绘制空间：整体镜像后统一按“朝右”作画
        const info = fighterPose(f);
        const pose = info.pose;
        const ph = info.phase;

        const baseY = depthY(f.depth);
        const feetY = baseY - f.alt;

        // 取消跳起/下落时的压扁与拉伸缩放，体型只由角色本身的 build/height 决定
        const hScale = style.height;
        const wFactor = style.build;

        const h = FIG_H * s * hScale;
        const S = (h / FIG_BASE) * style.height;   // 用于姿势偏移的统一缩放（随 FIG_H 等比放大）

        // ---- 体型比例（以总身高 h 为基准，约 6.5 头身，偏侧向）----
        const headR = FIG_H * 0.078 * s * style.height * (style.headW || 1);
        let shY = feetY - h * 0.805;
        let hipY = feetY - h * 0.53;
        let crotchY = feetY - h * 0.475;
        // 落地缓冲：随时间衰减的下压量（代替被去掉的压扁缩放）
        const landDip = (pose === 'land') ? Math.sin(clamp(f.landT / LAND_T, 0, 1) * Math.PI) * h * 0.038 : 0;
        shY += landDip; hipY += landDip; crotchY += landDip;
        // 可见脖子长度 = 肩颈根到下巴的间距；style.neck < 1 表示更短
        const th0 = hipY - shY;
        const neckLen = (0.184 * h - 2.04 * headR) * (style.neck || 1);
        const headY0 = shY - th0 * 0.04 - neckLen - headR * 1.04;
        // 躯干横向收窄：站立/行走/出招统一宽度；倒地时更窄，避免躺下后身体横向被拉长
        const slim = pose === 'ko' ? 0.74 : 0.80;
        const bodyK = wFactor * slim;
        const shHalf = FIG_H * 0.165 * s * bodyK;
        const waHalf = FIG_H * 0.105 * s * bodyK;
        const hpHalf = FIG_H * 0.142 * s * bodyK;
        const nk = shHalf * 0.36;
        const w = shHalf * 2;
        let headY = headY0;
        // 侧身像共用的一条"颈轴"：领口开口、颈根凹线都挂在这条线上，
        // 凹线右端与白色 V 领的前端点对齐，所以颈轴要压得比躯干中线靠前不少。
        const neckCx = cx + nk * 0.43;
        // 脖子与头在颈轴基础上再往胸口方向推一点（领口与凹线不动，保持对齐关系）
        const neckFb = nk * 0.18;
        const neckX = neckCx + neckFb;
        const headX = neckCx + neckFb + nk * 0.18;
        // 头颈整体再下压一点：颈根凹线前移后脖子露得偏长，压下来头才坐得住
        headY += h * 0.007;

        let lean = 0;
        if (pose === 'jab' || pose === 'kick') lean = wf * (ph === 'windup' ? -0.06 : 0.10);
        else if (pose === 'rise') lean = wf * (ph === 'windup' ? 0.14 : -0.12);
        else if (pose === 'hurt') lean = -wf * 0.20;
        else if (pose === 'ko') lean = -wf * 2.72;
        else lean = clamp(f.vx / 900, -0.10, 0.10);

        ctx.save();
        // 左右朝向直接整体镜像：姿势天然左右对称，鞋头朝向也不再出错
        const rotA = lean * 0.5 * wf;
        ctx.translate(cx, feetY);
        ctx.scale(wf, 1);
        ctx.rotate(rotA);   // 镜像会翻转旋转方向，乘回来保持世界倾角不变
        ctx.translate(-cx, -feetY);

        const breathe = Math.sin(f.bob * 1.6) * 1.4;
        const SHOE_H = 5.9 * S;

        // ---- 腿 ----（绘制空间统一朝右，后腿 = 屏幕左，前腿 = 屏幕右）
        let footL, footR, angL = 0, angR = 0, kneeBend = 3, lifts = [0, 0];
        if (pose === 'ko') {
            // 后仰被击躺：腿一条伸直一条蜷起，收得比较拢，避免横向拉长
            footL = { x: cx - h * 0.168, y: feetY - SHOE_H };
            footR = { x: cx + h * 0.108, y: feetY - SHOE_H - h * 0.050 };
            angL = -0.62; angR = 0.42;
            kneeBend = [7, 22];
        } else if (pose === 'kick') {
            const t = ph === 'windup' ? -0.5 : 1;
            footL = { x: cx - h * 0.115, y: feetY - SHOE_H };
            footR = { x: cx + face * h * 0.36 * t, y: feetY - h * 0.34 * (t > 0 ? 1 : 0.7) - SHOE_H };
            angL = -0.12; angR = face * 0.30;
            kneeBend = [5, 7];
            // 旋风腿：起手收腿，判定帧抡出大幅横扫
            if (f.atk === 'spin') {
                const sp = spinProgress(f, ph);
                footR = { x: cx + face * h * 0.44 * sp, y: feetY - h * 0.40 - SHOE_H };
                angR = face * (1.5 - sp * 1.9);
                footL = { x: cx - h * 0.16, y: feetY - SHOE_H - h * 0.02 };
                angL = -0.30;
                kneeBend = [10, 4];
            }
        } else if (pose === 'dash') {
            // 冲刺：前腿蹬直、后腿拖地，身体压低
            const dp = ph === 'windup' ? 0 : 1;
            footL = { x: cx - h * 0.20 * dp, y: feetY - SHOE_H - h * 0.05 * dp };
            footR = { x: cx + h * 0.15, y: feetY - SHOE_H };
            angL = -0.42 * dp; angR = 0.30;
            kneeBend = [16, 6];
        } else if (pose === 'wave') {
            // 气功波：双掌前推，重心后坐
            footL = { x: cx - h * 0.17, y: feetY - SHOE_H };
            footR = { x: cx + h * 0.10, y: feetY - SHOE_H - h * 0.03 };
            angL = -0.30; angR = 0.22;
            kneeBend = [12, 6];
        } else if (pose === 'rise') {
            footL = { x: cx - h * 0.105, y: feetY - SHOE_H };
            footR = { x: cx + h * 0.065, y: feetY - SHOE_H - h * 0.095 };
            angL = -0.35; angR = 0.30;
            kneeBend = 12;
        } else if (pose === 'air') {
            const tuck = clamp(f.vy / 900, -1, 1);
            footL = { x: cx - h * 0.10, y: feetY - SHOE_H - h * 0.053 };
            footR = { x: cx + h * 0.087, y: feetY - SHOE_H - h * 0.053 - tuck * h * 0.04 };
            angL = -0.30; angR = 0.26;
            kneeBend = 11;
        } else if (pose === 'land') {
            // 落地缓冲：双脚分开踩实、屈膝吸收冲击
            footL = { x: cx - h * 0.140, y: feetY - SHOE_H };
            footR = { x: cx + h * 0.118, y: feetY - SHOE_H };
            angL = -0.26; angR = 0.22;
            kneeBend = [17, 15];
        } else if (pose === 'hurt') {
            footL = { x: cx - face * h * 0.08, y: feetY - SHOE_H };
            footR = { x: cx + face * h * 0.067, y: feetY - SHOE_H - h * 0.04 };
            angL = 0.24; angR = -0.20;
            kneeBend = 10;
        } else if (pose === 'walk') {
            // 标准步行循环：腿反相摆动，支撑腿贴地、摆动腿抬膝
            // leg0 = 后腿(髋在 -x)，leg1 = 前腿(髋在 +x)，两者反相
            const wp = f.walkPhase;
            // 步幅跟随水平速度：纵向游走/近身小步时收紧，避免原地跨大步
            const stride = walkStride(f);
            const c0 = Math.cos(wp);
            // 后腿 φ=0 时在后方(蹬地)、φ=π 时在前方(落地)；前腿相反
            const l0 = Math.max(0, Math.sin(wp));
            const l1 = Math.max(0, -Math.sin(wp));
            footL = { x: cx - stride * c0, y: feetY - SHOE_H - l0 * h * 0.075 };
            footR = { x: cx + stride * c0, y: feetY - SHOE_H - l1 * h * 0.075 };
            // 后脚跟落地脚尖上抬、蹬地脚尖下压，摆动中段放平
            angL = 0.22 * c0;
            angR = -0.22 * c0;
            lifts = [l0, l1];
            kneeBend = [4 + l0 * 16, 4 + l1 * 16];
        } else {
            // 站立/格斗式：一前一后，侧向站位
            footL = { x: cx - h * 0.115, y: feetY - SHOE_H };
            footR = { x: cx + h * 0.085, y: feetY - SHOE_H };
            angL = 0.09; angR = 0.06;
            kneeBend = [6, 4];
            hipY += breathe;
            shY += breathe * 0.7;
            headY += Math.sin(f.bob * 1.6 + 0.7) * 1.2;
        }

// ---- 手臂 ----（侧向：朝右时右臂压在最上层，左臂被身体遮挡）
        const armY0 = shY + h * 0.05;
        // 朝右时：右肩（近侧）压低；左肩（远侧/出拳臂）关节点随姿势移动——
        // 出拳时前移并抬高让大臂多露一截，站立/行走时左移藏进躯干，不露肩
        // 右肩随侧身像的颈轴一起前移；肘的位置由 SH_BACK_REF 决定，肩往前不会把肘带走
        const SH_BACK_REF = cx - shHalf * 0.84;
        const shBack = { x: cx - shHalf * 0.62, y: armY0 + h * 0.002 };
        const shFrontX = pose === 'jab' ? cx + shHalf * 1.00
            : (pose === 'idle' || pose === 'walk') ? cx + shHalf * 0.72 : cx + shHalf * 0.84;
        const shFrontY = pose === 'jab' ? armY0 - h * 0.012 : armY0 + h * 0.020;
        const shFront = { x: shFrontX, y: shFrontY };
        let handB, handF;
        if (pose === 'jab') {
            const ext = ph === 'windup' ? 0.18 : (ph === 'active' ? 1 : 0.55);
            // 右臂（后手）收到胸前，肘部只轻微下沉，保留小臂长度
            handB = { x: cx + w * 0.02, y: armY0 + h * 0.150 };
            handF = { x: cx + face * (w * 0.30 + ext * w * 1.22), y: armY0 - h * 0.055 };
        } else if (pose === 'dash') {
            // 冲刺：双臂后摆，像把手往后压
            const dp = ph === 'windup' ? 0.2 : 1;
            handB = { x: cx - w * 0.70 * dp, y: armY0 + h * 0.16 };
            handF = { x: cx - w * 0.44 * dp, y: armY0 + h * 0.22 };
        } else if (pose === 'wave') {
            // 气功波：双掌并拢前推
            const ext = ph === 'windup' ? 0.25 : (ph === 'active' ? 1 : 0.62);
            handB = { x: cx + face * w * 0.28 * ext, y: armY0 + h * 0.02 };
            handF = { x: cx + face * w * 0.40 * ext, y: armY0 - h * 0.06 };
        } else if (pose === 'kick') {
            handB = { x: cx - w * 0.46, y: armY0 + h * 0.24 };
            handF = { x: cx + face * w * 0.88, y: armY0 - h * 0.06 };
        } else if (pose === 'rise') {
            const up = ph === 'windup' ? 0.15 : 1;
            handB = { x: cx - w * 0.40, y: armY0 + h * 0.26 };
            handF = { x: cx + face * w * 0.44, y: armY0 - h * 0.52 * up };
        } else if (pose === 'hurt') {
            handB = { x: cx - face * w * 0.44, y: armY0 - h * 0.06 };
            handF = { x: cx + face * w * 0.55, y: armY0 + h * 0.24 };
        } else if (pose === 'air') {
            handB = { x: cx - w * 0.56, y: armY0 - h * 0.20 };
            handF = { x: cx + w * 0.64, y: armY0 - h * 0.26 };
        } else if (pose === 'land') {
            // 落地缓冲：双臂自然下沉外张，右臂收到体侧前方，避免甩到背后
            handB = { x: cx - w * 0.26, y: armY0 + h * 0.185 };
            handF = { x: cx + w * 0.60, y: armY0 + h * 0.145 };
        } else if (pose === 'ko') {
            // 手臂摊开但收得较拢，一只压在身下一只甩向侧后方
            handB = { x: cx - w * 0.78, y: armY0 + h * 0.09 };
            handF = { x: cx + w * 0.24, y: armY0 - h * 0.02 };
        } else if (pose === 'walk') {
            // 手臂与同侧腿反相摆动（后臂随前腿前摆）
            const armSw = -Math.cos(f.walkPhase) * h * 0.088;
            handB = { x: cx - w * 0.24 - armSw, y: armY0 + h * 0.26 - Math.abs(armSw) * 0.20 };
            handF = { x: cx + w * 0.30 + armSw, y: armY0 + h * 0.25 - Math.abs(armSw) * 0.20 };
        } else {
            // 站立：手臂自然下垂，拳头朝下；左臂稍向右，前臂让开躯干露出一点身体
            handB = { x: cx - w * 0.20, y: armY0 + h * 0.285 };
            handF = { x: cx + w * 0.30, y: armY0 + h * 0.240 };
        }

        const sleeveLen = style.shirtStyle === 'jacket' ? 1 : (style.shirtStyle === 'tee' ? 0.42 : 0);
        const upperArmW = h * 0.074;
        const foreArmW = h * 0.053;
        const fistR = h * 0.047;
        const armHands = [[shBack, handB, -1, SH_BACK_REF], [shFront, handF, 1, shFrontX]];
        const drawArm = (si) => {
            const sh0 = armHands[si][0], hd0 = armHands[si][1], side = armHands[si][2];
            const shRefX = armHands[si][3];
            // 左臂整体向右（前）平移；肩关节仍锚在躯干内，不会露出躯干边界
            const off = side > 0 ? h * 0.034 : 0;
            const sh = { x: sh0.x, y: sh0.y };
            const hand = { x: hd0.x + off, y: hd0.y };
            // 大臂缩短、小臂加长；肘部向身后（绘制空间 -x）反折
            // 出拳时：出拳臂几乎伸直（外扩小），后手臂大臂向后大幅摆动，把小臂带到胸前
            const isJab = pose === 'jab';
            const punchArm = side > 0;
            const outF = isJab ? (punchArm ? 0.005 : 0.078) : 0.030;
            const dropF = isJab ? (punchArm ? 0.022 : 0.008) : 0;
            // 肘的位置按原肩位推导：右肩前移只改变大臂的起点，肘与小臂维持原样
            const mx = shRefX + (hand.x - shRefX) * 0.38 - h * outF;
            const my = sh.y + (hand.y - sh.y) * 0.38 + h * (outF + dropF);
            const upperCol = sleeveLen > 0.1 ? col.shirtDark : col.skin;
            const foreCol = sleeveLen >= 0.9 ? col.shirtDark : col.skin;
            // 小臂与拳
            drawForearmFist(mx, my, hand.x, hand.y, foreArmW, fistR, foreCol, side, col, S);
            // 大臂：右臂肩部内侧不描轮廓
            drawUpperArm(sh.x, sh.y, mx, my, upperArmW, upperCol, side < 0, S);
            if (style.tattoo) {
                drawBand(sh.x, sh.y, mx, my, 0.50, upperArmW * 0.96, upperArmW * 0.22, 'rgba(30, 42, 78, 0.55)');
                drawBand(sh.x, sh.y, mx, my, 0.76, upperArmW * 0.90, upperArmW * 0.18, 'rgba(30, 42, 78, 0.45)');
            }
        };

        const feet = [footL, footR];
        const angles = [angL, angR];
        const sides = [-1, 1];
        // 走动时躯干更窄，腿要相应加粗，否则大腿与身体衔接像一根杆
        const legK = pose === 'walk' ? 1.22 : (pose === 'air' ? 1.08 : 1);
        const thighW = h * 0.090 * legK;
        const shinW = h * 0.060 * (pose === 'walk' ? 1.10 : 1);
        // 侧面视角下两髋几乎重合，走动时若再分开，摆到后方的腿就会横穿另一条腿
        const hipSep = pose === 'walk' ? hpHalf * 0.16 : hpHalf * 0.42;
        for (let fi = 0; fi < 2; fi++) {
            const foot = feet[fi];
            const side = sides[fi];
            const kb = Array.isArray(kneeBend) ? kneeBend[fi] : kneeBend;
            const liftv = lifts[fi];
            const hipJX = cx + side * hipSep;
            // 髋点略微上移并埋进短裤内部，避免出现关节断口
            const hipJY = hipY + h * 0.012;
            const kx = (hipJX + foot.x) / 2 + face * kb * S * 0.9 + side * S * 2.5;
            const ky = hipJY + (foot.y - hipJY) * (0.54 - liftv * 0.17);
            // 远端腿整体压暗，两腿交叠时仍能分清前后
            const legUp = fi === 0 ? col.pantsDark : col.pants;
            // 髋部球形过渡：抹平大腿根与骨盆之间的硬折角
            ctx.fillStyle = OUTLINE;
            ctx.beginPath();
            ctx.arc(hipJX, hipJY, thighW * 0.60, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = legUp;
            ctx.beginPath();
            ctx.arc(hipJX, hipJY, thighW * 0.60 - 1.2 * S, 0, Math.PI * 2);
            ctx.fill();
            drawLeg(hipJX, hipJY, kx, ky, foot.x, foot.y, thighW, shinW, legUp, col.pantsDark, S);
            drawShoe(foot.x, foot.y, angles[fi], S * 0.90, col, style.shoeAccent);
        }

        // ---- 左臂（绘制空间屏幕右侧）：先画，被身体遮挡 ----
        drawArm(1);

        // ---- 骨盆/短裤：衔接躯干与大腿 ----
        const crotchDrop = crotchY - hipY;
        // 髋部横向过渡块，让短裤到大腿形成连续的斜面而不是两个独立体块
        ctx.fillStyle = OUTLINE;
        tracePelvisPath(cx, hipY - h * 0.028, hpHalf * 1.10, crotchDrop + h * 0.052);
        ctx.fill();
        ctx.fillStyle = col.pantsDark;
        tracePelvisPath(cx, hipY - h * 0.028, hpHalf * 1.06, crotchDrop + h * 0.048);
        ctx.fill();
        ctx.fillStyle = col.pants;
        tracePelvisPath(cx, hipY, hpHalf, crotchDrop);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.22)';
        ctx.lineWidth = 1.6 * S;
        ctx.beginPath();
        ctx.moveTo(cx, hipY + crotchDrop * 0.20);
        ctx.lineTo(cx, hipY + crotchDrop * 0.92);
        ctx.stroke();

        // ---- 脖子 + 头：压在躯干衣服图层之后 ----
        const nkG = neckGeom(neckX, headX, headY, headR, shY, shHalf, h);
        drawNeck(nkG, h, col, S);
        drawHead(f, style, col, headX, headY, headR, face, s, pose, ph, wf);

        // ---- 躯干 ----
        const torsoTh = hipY - shY;
        // 侧身像的背侧收窄：躯干最左不超过近侧手臂（肩膀）画到的最左边
        const backX = shBack.x - upperArmW * 0.5;
        ctx.lineJoin = 'round';
        ctx.lineWidth = 3.0 * S;
        ctx.strokeStyle = OUTLINE;
        traceTorsoPath(cx, neckCx, backX, shY, hipY, shHalf, waHalf, hpHalf);
        ctx.stroke();
        ctx.fillStyle = col.shirt;
        traceTorsoPath(cx, neckCx, backX, shY, hipY, shHalf, waHalf, hpHalf);
        ctx.fill();
        // 体积光影 + 服装细节（统一裁剪到躯干内）
        ctx.save();
        traceTorsoPath(cx, neckCx, backX, shY, hipY, shHalf, waHalf, hpHalf);
        ctx.clip();
        const tX0 = cx - shHalf * 1.3, tW = shHalf * 2.6;
        ctx.fillStyle = 'rgba(8, 12, 26, 0.24)';
        ctx.fillRect(face > 0 ? tX0 : cx, shY - torsoTh * 0.3, tW * 0.5, torsoTh * 1.5);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.14)';
        ctx.fillRect(face > 0 ? cx + shHalf * 0.45 : tX0, shY - torsoTh * 0.3, tW * 0.2, torsoTh * 1.5);

        // 服装款式细节
        // 领口一律以颈轴 neckCx 为基准，并与颈根凹线、脖子共用同一个中心
        const nx0 = neckCx;
        const nY = shY - torsoTh * 0.05;
        if (style.shirtStyle === 'tee') {
            // V 领：后颈侧收窄抬高、前胸侧放宽降低
            ctx.fillStyle = style.cuffCol;
            ctx.beginPath();
            ctx.moveTo(nx0 - nk * 0.93, nY - torsoTh * 0.02);
            ctx.lineTo(nx0 + nk * 1.35, nY + torsoTh * 0.012);
            ctx.quadraticCurveTo(nx0 + nk * 0.80, shY + h * 0.050, nx0 + nk * 0.58, shY + h * 0.058);
            ctx.closePath();
            ctx.fill();
            // 领口罗纹：V 领外圈一圈窄边
            ctx.strokeStyle = style.cuffCol;
            ctx.lineWidth = Math.max(1.2, 2.4 * S);
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(nx0 - nk * 1.74, nY - torsoTh * 0.05);
            ctx.quadraticCurveTo(nx0 + nk * 0.08, shY + h * 0.070, nx0 + nk * 0.50, shY + h * 0.090);
            ctx.quadraticCurveTo(nx0 + nk * 1.42, shY + h * 0.036, nx0 + nk * 2.02, nY + torsoTh * 0.01);
            ctx.stroke();
            // 袖窿缝线：领口端锚在颈轴上
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.lineWidth = Math.max(1, 1.7 * S);
            for (const sd of [-1, 1]) {
                ctx.beginPath();
                ctx.moveTo(nx0 + sd * nk * 1.55, shY + torsoTh * 0.09);
                ctx.quadraticCurveTo(cx + sd * shHalf * 0.82, shY + torsoTh * 0.14, cx + sd * shHalf * 0.99, shY + torsoTh * 0.44);
                ctx.stroke();
            }
        } else if (style.shirtStyle === 'tank') {
            // 露出胸口：以后颈侧浅、前胸侧深的不对称开口，中心同样对齐颈轴
            ctx.fillStyle = col.skin;
            ctx.beginPath();
            ctx.moveTo(nx0 - shHalf * 0.40, shY + 1);
            ctx.lineTo(nx0 + shHalf * 0.76, shY + 1);
            ctx.quadraticCurveTo(nx0 + shHalf * 0.24, shY + h * 0.150, nx0 - shHalf * 0.40, shY + 1);
            ctx.closePath();
            ctx.fill();
            // 粗肩带（贴着肩部斜线）
            ctx.fillStyle = col.shirtDark;
            for (const sd of [-1, 1]) {
                ctx.beginPath();
                ctx.moveTo(cx + sd * shHalf, shY + torsoTh * 0.10);
                ctx.lineTo(cx + sd * shHalf * 0.58, shY - torsoTh * 0.05);
                ctx.lineTo(cx + sd * shHalf * 0.30, shY - torsoTh * 0.05);
                ctx.lineTo(cx + sd * shHalf * 0.62, shY + torsoTh * 0.16);
                ctx.closePath();
                ctx.fill();
            }
        } else {
            // 立领 + 拉链 + 口袋：立领以颈轴为基准，拉链跟着偏向胸口一侧
            ctx.fillStyle = col.shirtDark;
            ctx.beginPath();
            ctx.moveTo(nx0 - shHalf * 1.30, shY - torsoTh * 0.10);
            ctx.lineTo(nx0 + shHalf * 1.30, shY - torsoTh * 0.10);
            ctx.lineTo(nx0 + shHalf * 1.30, shY + h * 0.062);
            ctx.lineTo(nx0 - shHalf * 1.30, shY + h * 0.062);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = 'rgba(225, 228, 240, 0.7)';
            ctx.fillRect(nx0 - 1.3 * S, shY - torsoTh * 0.10, 2.6 * S, torsoTh + h * 0.14);
            ctx.strokeStyle = 'rgba(0,0,0,0.28)';
            ctx.lineWidth = 1.6 * S;
            ctx.strokeRect(cx - shHalf * 0.86, shY + h * 0.16, shHalf * 0.60, h * 0.085);
            ctx.strokeRect(cx + shHalf * 0.26, shY + h * 0.16, shHalf * 0.60, h * 0.085);
        }

        // 布料褶皱：体侧与腋下的柔和折痕（所有款式通用）
        ctx.lineCap = 'round';
        ctx.lineWidth = Math.max(1, 2.4 * S);
        ctx.strokeStyle = 'rgba(8, 12, 26, 0.13)';
        const folds = [
            [cx - waHalf * 0.98, shY + torsoTh * 0.50, cx - waHalf * 0.74, shY + torsoTh * 0.86],
            [cx + waHalf * 1.02, shY + torsoTh * 0.44, cx + waHalf * 0.80, shY + torsoTh * 0.82],
            [cx - shHalf * 0.30, shY + torsoTh * 0.62, cx + shHalf * 0.16, shY + torsoTh * 0.90]
        ];
        for (let i = 0; i < folds.length; i++) {
            const fd = folds[i];
            ctx.beginPath();
            ctx.moveTo(fd[0], fd[1]);
            ctx.quadraticCurveTo((fd[0] + fd[2]) / 2 + face * h * 0.010, (fd[1] + fd[3]) / 2, fd[2], fd[3]);
            ctx.stroke();
        }
        // 褶皱旁的高光
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.10)';
        ctx.lineWidth = Math.max(0.8, 1.6 * S);
        for (let i = 0; i < folds.length; i++) {
            const fd = folds[i];
            ctx.beginPath();
            ctx.moveTo(fd[0] + face * h * 0.006, fd[1]);
            ctx.quadraticCurveTo((fd[0] + fd[2]) / 2 + face * h * 0.018, (fd[1] + fd[3]) / 2, fd[2] + face * h * 0.006, fd[3]);
            ctx.stroke();
        }

        // 腰带：后端高、前端低、中间下垂的弧形带子，绕腰的立体感更强
        const bHalf = shHalf * 1.34;
        const by0 = hipY - h * 0.070;          // 后端上缘（偏高）
        const by1 = by0 + h * 0.030;           // 前端上缘（更低）
        const bH = h * 0.036;                  // 带面厚度
        const bSag = h * 0.012;                // 中段相对两端连线的额外下垂
        // 二次曲线的控制点要压在两端连线之下，中段才会真正往下坠
        const bCtrlY = (by0 + by1) / 2 + bSag * 2;
        const bq = (a, b, c, t) => (1 - t) * (1 - t) * a + 2 * (1 - t) * t * b + t * t * c;
        const beltTop = (t) => bq(by0, bCtrlY, by1, t);
        const beltPath = (dy) => {
            ctx.beginPath();
            ctx.moveTo(cx - bHalf, by0 + dy);
            ctx.quadraticCurveTo(cx, bCtrlY + dy, cx + bHalf, by1 + dy);
            ctx.lineTo(cx + bHalf, by1 + bH + dy);
            ctx.quadraticCurveTo(cx, bCtrlY + bH + dy, cx - bHalf, by0 + bH + dy);
            ctx.closePath();
        };
        // 带子在裤子上压出的投影
        ctx.fillStyle = 'rgba(8, 12, 26, 0.20)';
        beltPath(h * 0.018);
        ctx.fill();
        // 带身
        ctx.fillStyle = col.belt;
        beltPath(0);
        ctx.fill();
        // 上缘受光、下缘背光
        ctx.strokeStyle = 'rgba(255,255,255,0.34)';
        ctx.lineWidth = Math.max(1.2, 2.2 * S);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(cx - bHalf, by0);
        ctx.quadraticCurveTo(cx, bCtrlY, cx + bHalf, by1);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.24)';
        ctx.lineWidth = Math.max(1, 1.7 * S);
        ctx.beginPath();
        ctx.moveTo(cx - bHalf, by0 + bH);
        ctx.quadraticCurveTo(cx, bCtrlY + bH, cx + bHalf, by1 + bH);
        ctx.stroke();
        // 皮带扣：顺着带面的切线倾斜，横向（宽大于高）压在腰带上
        const tb = 0.70;
        const bxc = cx - bHalf + tb * bHalf * 2;
        const byc = beltTop(tb) + bH * 0.5;
        const bslope = 2 * (1 - tb) * (bCtrlY - by0) + 2 * tb * (by1 - bCtrlY);
        ctx.save();
        ctx.translate(bxc, byc);
        ctx.rotate(Math.atan2(bslope, bHalf * 2));
        const bkw = bH * 2.1, bkh = h * 0.056;
        ctx.fillStyle = OUTLINE;
        roundRectPath(-bkw / 2, -bkh / 2, bkw, bkh, h * 0.010);
        ctx.fill();
        ctx.fillStyle = 'rgba(238, 242, 250, 0.92)';
        roundRectPath(-bkw / 2 + h * 0.006, -bkh / 2 + h * 0.005, bkw - h * 0.012, bkh - h * 0.010, h * 0.007);
        ctx.fill();
        // 中间的带舌（竖向穿过扣身）
        ctx.fillStyle = col.belt;
        ctx.fillRect(-h * 0.008, -bkh / 2 + h * 0.005, h * 0.016, bkh - h * 0.010);
        // 扣面上缘受光
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.fillRect(-bkw / 2 + h * 0.006, -bkh / 2 + h * 0.005, bkw - h * 0.012, h * 0.008);
        ctx.restore();
        ctx.restore();

        drawArm(0);   // 右臂（绘制空间屏幕左侧）：后画，压在躯干上

        ctx.restore();

        // ---- 出招瞬间：在拳/脚的实际位置生成打击特效 ----
        // 只在真正打中目标时才出特效（hitIds 在命中帧由 updateAttack 填充）
        if (!f.impactDone && f.atk && !f.dead && (ph === 'active' || ph === 'recover')
            && f.hitIds && f.hitIds.length > 0) {
            f.impactDone = true;
            let lx = handF.x, ly = handF.y, mv = MOVES[f.atk];
            if (mv.kind === 'kick') {
                lx = footR.x + face * h * 0.075;
                ly = footR.y - SHOE_H * 0.35;
            } else if (mv.kind === 'rise') {
                lx = handF.x + face * h * 0.055;
                ly = handF.y - h * 0.012;
            } else if (mv.kind === 'spin') {
                lx = footR.x + face * h * 0.09;
                ly = footR.y - SHOE_H * 0.35;
            } else {
                lx = handF.x + face * h * 0.055;
                ly = handF.y;
            }
            // 绘制空间->世界：绕 (cx,feetY) 旋转 rotA，再按 wf 镜像
            const ox = lx - cx, oy = ly - feetY;
            const ca = Math.cos(rotA), sa = Math.sin(rotA);
            const rx = (ox * ca - oy * sa) * wf;
            const ry = (ox * sa + oy * ca);
            spawnStrikeFx(f, mv, cx + rx, feetY + ry);
        }

        // 受击闪白（倒地后不再显示椭圆白光）
        if (f.flash > 0 && !f.dead) {
            ctx.save();
            ctx.globalAlpha = clamp(f.flash / 0.16, 0, 1) * 0.75;
            ctx.globalCompositeOperation = 'lighter';
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(cx, feetY - h * 0.52, shHalf * 1.55, h * 0.55, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // Boss 暴怒时的红色气焰 + 起手预警闪光
        if (f.isBoss && !f.dead) {
            const baseY = depthY(f.depth);
            if (f.phase >= 1) {
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                for (let i = 0; i < 7; i++) {
                    const t = (clock * 1.5 + i * 0.9) % 1;
                    const rx2 = shHalf * (1.5 - t * 0.7);
                    ctx.globalAlpha = 0.20 * (1 - t);
                    ctx.strokeStyle = '#ff5a5a';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.ellipse(cx, feetY - h * 0.52, rx2, h * 0.58, 0, 0, Math.PI * 2);
                    ctx.stroke();
                }
                ctx.restore();
            }
            if (f.telegraph > 0) {
                const k = 1 - f.telegraph / 0.6;
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                ctx.globalAlpha = 0.35 + 0.35 * Math.sin(clock * 34);
                ctx.fillStyle = '#ff4d6a';
                ctx.beginPath();
                ctx.ellipse(cx, feetY - h * 0.52, shHalf * 1.8, h * 0.62, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                // 头顶的感叹号
                ctx.save();
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = 'bold ' + Math.round(26 * s) + 'px "Courier New", monospace';
                ctx.fillStyle = '#ff4d6a';
                ctx.shadowColor = '#000000';
                ctx.shadowBlur = 6;
                const ey = baseY - h * 1.28 - k * 8;
                ctx.fillText('!', cx, ey);
                ctx.restore();
            }
        }

        // 被场景道具命中：头顶转圈的星星
        if (f.stunT > 0 && !f.dead) {
            ctx.save();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#7ec8ff';
            ctx.shadowColor = '#000000';
            ctx.shadowBlur = 5;
            for (let i = 0; i < 3; i++) {
                const a = clock * 7 + i * (Math.PI * 2 / 3);
                const sx2 = cx + Math.cos(a) * 26 * s;
                const sy2 = baseY - h * 1.22 + Math.sin(a) * 9 * s;
                ctx.fillText('*', sx2, sy2);
            }
            ctx.restore();
        }
    }

    function drawParticles() {
        for (let i = 0; i < particles.length; i++) {
            const q = particles[i];
            const a = clamp(q.life / q.max, 0, 1);
            ctx.save();
            ctx.globalAlpha = a;
            ctx.fillStyle = q.col;
            ctx.beginPath();
            ctx.arc(q.x, q.y, q.r * a + 0.6, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    function drawFloaters() {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = 'bold 24px "Courier New", monospace';
        for (let i = 0; i < floaters.length; i++) {
            const f = floaters[i];
            ctx.globalAlpha = clamp(f.life * 2.2, 0, 1);
            ctx.fillStyle = f.color;
            ctx.shadowColor = '#000000aa';
            ctx.shadowBlur = 5;
            ctx.fillText(f.text, f.x, depthY(f.depth) - f.alt - FIG_H * depthScale(f.depth) * 0.9);
        }
        ctx.restore();
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
    }

    // ==================== 绘制：场景道具 ====================
    function propScale(p) { return depthScale(p.depth); }

    function drawProp(p) {
        const cfg = p.cfg;
        const s = propScale(p);
        const baseY = depthY(p.depth);
        const w = cfg.w * s, h = cfg.h * s;
        const x = p.x - w / 2;
        const y = baseY - h;
        ctx.save();
        if (p.flash > 0) ctx.globalAlpha = 1;

        // 影子
        ctx.fillStyle = 'rgba(0,0,0,0.30)';
        ctx.beginPath();
        ctx.ellipse(p.x, baseY + 3 * s, w * 0.58, 8 * s, 0, 0, Math.PI * 2);
        ctx.fill();

        switch (p.type) {
            case 'bin': drawBin(x, y, w, h, cfg, p); break;
            case 'crate': case 'box': drawCrate(x, y, w, h, cfg, p); break;
            case 'drum': drawDrum(x, y, w, h, cfg, p); break;
            case 'lamp': drawLamp(x, y, w, h, cfg, p); break;
            case 'neon': drawNeonSign(x, y, w, h, cfg, p); break;
            case 'bench': case 'plank': drawBench(x, y, w, h, cfg, p); break;
            case 'net': drawNet(x, y, w, h, cfg, p); break;
            case 'fence': drawFence(x, y, w, h, cfg, p); break;
            case 'container': drawContainer(x, y, w, h, cfg, p); break;
            case 'ac': drawAC(x, y, w, h, cfg, p); break;
            case 'tank': drawTank(x, y, w, h, cfg, p); break;
        }

        if (p.flash > 0) {
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = clamp(p.flash / 0.12, 0, 1) * 0.55;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(x, y, w, h);
        }
        ctx.restore();

        // 未被破坏的道具显示耐久条
        if (!p.dead && p.hp < p.maxHp && !cfg.solid) {
            const bw = w * 0.7;
            ctx.fillStyle = 'rgba(8,10,20,0.75)';
            roundRectPath(p.x - bw / 2, y - 10, bw, 5, 2.5);
            ctx.fill();
            ctx.fillStyle = '#ffd966';
            roundRectPath(p.x - bw / 2 + 1, y - 9, (bw - 2) * clamp(p.hp / p.maxHp, 0, 1), 3, 1.5);
            ctx.fill();
        }
    }

    function propBody(path, x, y, w, h, col, r) {
        ctx.fillStyle = OUTLINE;
        path(x, y, w, h, r);
        ctx.fill();
        ctx.fillStyle = col;
        path(x + 1.5, y + 1.5, w - 3, h - 3, r);
        ctx.fill();
    }

    function drawBin(x, y, w, h, cfg, p) {
        const path = (px, py, pw, ph, r) => {
            ctx.beginPath();
            ctx.moveTo(px + pw * 0.10, py);
            ctx.lineTo(px + pw * 0.90, py);
            ctx.lineTo(px + pw * 0.96, py + ph);
            ctx.lineTo(px + pw * 0.04, py + ph);
            ctx.closePath();
        };
        propBody(path, x, y, w, h, cfg.col, 4);
        ctx.save();
        path(x, y, w, h, 4); ctx.clip();
        ctx.fillStyle = cfg.col2;
        ctx.fillRect(x, y + h * 0.5, w, h * 0.5);
        ctx.fillStyle = 'rgba(255,255,255,0.10)';
        for (let i = 1; i < 3; i++) ctx.fillRect(x + (w / 3) * i - 1, y, 2, h);
        ctx.restore();
        // 桶盖
        ctx.fillStyle = cfg.rim;
        roundRectPath(x - w * 0.05, y - h * 0.07, w * 1.10, h * 0.09, 3);
        ctx.fill();
        ctx.strokeStyle = OUTLINE; ctx.lineWidth = 1.6; ctx.stroke();
        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        ctx.beginPath();
        ctx.ellipse(x + w * 0.5, y - h * 0.02, w * 0.16, h * 0.03, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawCrate(x, y, w, h, cfg, p) {
        const path = (px, py, pw, ph, r) => { roundRectPath(px, py, pw, ph, r); };
        propBody(path, x, y, w, h, cfg.col, 5);
        ctx.save();
        roundRectPath(x, y, w, h, 5); ctx.clip();
        ctx.fillStyle = cfg.col2;
        ctx.fillRect(x, y + h * 0.55, w, h * 0.45);
        // 板条与钉子
        ctx.strokeStyle = cfg.col2;
        ctx.lineWidth = Math.max(1.5, w * 0.03);
        for (let i = 1; i < 3; i++) {
            ctx.beginPath();
            ctx.moveTo(x + 2, y + (h / 3) * i);
            ctx.lineTo(x + w - 2, y + (h / 3) * i);
            ctx.stroke();
        }
        ctx.strokeStyle = 'rgba(0,0,0,0.25)';
        ctx.lineWidth = Math.max(1.5, w * 0.035);
        ctx.beginPath();
        ctx.moveTo(x + 3, y + 3); ctx.lineTo(x + w - 3, y + h - 3);
        ctx.moveTo(x + w - 3, y + 3); ctx.lineTo(x + 3, y + h - 3);
        ctx.stroke();
        ctx.fillStyle = cfg.rim;
        for (let i = 0; i < 4; i++) {
            ctx.beginPath();
            ctx.arc(x + 6 + (i % 2) * (w - 12), y + 6 + Math.floor(i / 2) * (h - 12), Math.max(1.4, w * 0.022), 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    function drawDrum(x, y, w, h, cfg, p) {
        const path = (px, py, pw, ph, r) => {
            ctx.beginPath();
            ctx.moveTo(px + pw * 0.08, py);
            ctx.quadraticCurveTo(px, py + ph * 0.5, px + pw * 0.08, py + ph);
            ctx.lineTo(px + pw * 0.92, py + ph);
            ctx.quadraticCurveTo(px + pw, py + ph * 0.5, px + pw * 0.92, py);
            ctx.closePath();
        };
        propBody(path, x, y, w, h, cfg.col, 4);
        ctx.save();
        path(x, y, w, h, 4); ctx.clip();
        // 上下箍
        ctx.fillStyle = cfg.rim;
        ctx.fillRect(x, y + h * 0.10, w, h * 0.09);
        ctx.fillRect(x, y + h * 0.78, w, h * 0.09);
        ctx.fillStyle = cfg.col2;
        ctx.fillRect(x, y + h * 0.40, w, h * 0.16);
        // 危险标识
        ctx.fillStyle = 'rgba(255,230,120,0.85)';
        ctx.beginPath();
        ctx.moveTo(x + w * 0.5, y + h * 0.52);
        ctx.lineTo(x + w * 0.68, y + h * 0.76);
        ctx.lineTo(x + w * 0.32, y + h * 0.76);
            ctx.closePath();
        ctx.fill();
        ctx.restore();
    }

    function drawLamp(x, y, w, h, cfg, p) {
        // 灯柱
        ctx.fillStyle = '#2a2d3c';
        ctx.fillRect(x + w * 0.42, y, w * 0.16, h);
        ctx.fillStyle = '#3c4157';
        ctx.fillRect(x + w * 0.42, y, w * 0.06, h);
        // 灯头
        const blink = 0.6 + 0.4 * Math.sin(clock * 6 + p.t);
        ctx.fillStyle = cfg.col2;
        roundRectPath(x - w * 0.18, y - h * 0.07, w * 1.36, h * 0.10, 4);
        ctx.fill();
        ctx.strokeStyle = OUTLINE; ctx.lineWidth = 1.6; ctx.stroke();
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.30 * blink;
        ctx.fillStyle = cfg.col;
        ctx.beginPath();
        ctx.ellipse(x + w * 0.5, y + h * 0.02, w * 1.9, h * 0.09, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        // 光锥
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = cfg.col;
        ctx.globalAlpha = 0.08 * blink;
        ctx.beginPath();
        ctx.moveTo(x + w * 0.2, y + h * 0.03);
        ctx.lineTo(x + w * 0.8, y + h * 0.03);
        ctx.lineTo(x + w * 1.5, y + h * 0.52);
        ctx.lineTo(x - w * 0.5, y + h * 0.52);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }

    function drawNeonSign(x, y, w, h, cfg, p) {
        // 支架
        ctx.fillStyle = '#25283a';
        ctx.fillRect(x + w * 0.06, y, w * 0.05, h);
        ctx.fillRect(x + w * 0.90, y, w * 0.05, h);
        // 灯箱
        ctx.fillStyle = '#1c1a2c';
        roundRectPath(x, y, w, h, 8);
        ctx.fill();
        ctx.strokeStyle = OUTLINE; ctx.lineWidth = 2; ctx.stroke();
        const neon = 0.55 + 0.45 * Math.sin(clock * 5 + p.t);
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = neon;
        ctx.strokeStyle = cfg.col;
        ctx.lineWidth = Math.max(2, h * 0.10);
        roundRectPath(x + 8, y + 8, w - 16, h - 16, 5);
        ctx.stroke();
        // "酒" 风格的方块字
        for (let i = 0; i < 3; i++) {
            const bx = x + 18 + i * ((w - 36) / 3);
            ctx.strokeRect(bx, y + h * 0.30, (w - 36) / 3 - 8, h * 0.40);
        }
        ctx.globalAlpha = neon * 0.3;
        ctx.fillStyle = cfg.col;
        roundRectPath(x - 10, y - 10, w + 20, h + 20, 12);
        ctx.fill();
        ctx.restore();
        // 支臂垂下的电线
        ctx.strokeStyle = 'rgba(255,255,255,0.12)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x + w * 0.5, y);
        ctx.quadraticCurveTo(x + w * 0.7, y - 18, x + w * 0.5, y - 34);
        ctx.stroke();
    }

    function drawBench(x, y, w, h, cfg, p) {
        // 座板
        ctx.fillStyle = cfg.col;
        roundRectPath(x, y + h * 0.30, w, h * 0.42, 4);
        ctx.fill();
        ctx.strokeStyle = OUTLINE; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = cfg.col2;
        ctx.fillRect(x, y + h * 0.56, w, h * 0.16);
        // 腿
        ctx.fillStyle = cfg.rim;
        ctx.fillRect(x + w * 0.10, y + h * 0.72, w * 0.06, h * 0.34);
        ctx.fillRect(x + w * 0.84, y + h * 0.72, w * 0.06, h * 0.34);
        // 靠背
        ctx.fillStyle = cfg.col2;
        roundRectPath(x, y, w, h * 0.28, 4);
        ctx.fill();
        ctx.strokeStyle = OUTLINE; ctx.lineWidth = 1.6; ctx.stroke();
    }

    function drawNet(x, y, w, h, cfg, p) {
        ctx.strokeStyle = cfg.rim;
        ctx.lineWidth = Math.max(2, w * 0.022);
        ctx.beginPath();
        ctx.moveTo(x + w * 0.08, y + h);
        ctx.lineTo(x + w * 0.08, y);
        ctx.moveTo(x + w * 0.92, y + h);
        ctx.lineTo(x + w * 0.92, y);
        ctx.stroke();
        ctx.strokeStyle = cfg.col;
        ctx.lineWidth = 1.4;
        for (let i = 0; i <= 8; i++) {
            const gx = x + w * 0.08 + (w * 0.84) * (i / 8);
            ctx.beginPath();
            ctx.moveTo(gx, y);
            ctx.lineTo(gx + (i % 2 ? 4 : -4), y + h);
            ctx.stroke();
        }
        for (let j = 0; j <= 4; j++) {
            const gy = y + h * (j / 4);
            ctx.beginPath();
            ctx.moveTo(x + w * 0.08, gy);
            ctx.lineTo(x + w * 0.92, gy);
            ctx.stroke();
        }
    }

    function drawFence(x, y, w, h, cfg, p) {
        ctx.strokeStyle = cfg.col;
        ctx.lineWidth = Math.max(2, w * 0.03);
        for (let i = 0; i <= 6; i++) {
            const gx = x + (w / 6) * i;
            ctx.beginPath();
            ctx.moveTo(gx, y + h);
            ctx.lineTo(gx, y + 4);
            ctx.stroke();
        }
        ctx.strokeStyle = cfg.col2;
        ctx.lineWidth = Math.max(2, h * 0.09);
        for (let j = 0; j <= 2; j++) {
            const gy = y + 6 + ((h - 8) / 2) * j;
            ctx.beginPath();
            ctx.moveTo(x, gy);
            ctx.lineTo(x + w, gy);
            ctx.stroke();
        }
        ctx.fillStyle = cfg.rim;
        ctx.beginPath();
        ctx.moveTo(x, y + h);
        ctx.lineTo(x + w, y + h);
        ctx.lineTo(x + w - 6, y + h + 6);
        ctx.lineTo(x + 6, y + h + 6);
        ctx.closePath();
        ctx.fill();
    }

    function drawContainer(x, y, w, h, cfg, p) {
        propBody((px, py, pw, ph, r) => { ctx.beginPath(); ctx.rect(px, py, pw, ph); }, x, y, w, h, cfg.col, 0);
        ctx.save();
        ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
        // 波纹板
        ctx.strokeStyle = cfg.col2;
        ctx.lineWidth = Math.max(2, w * 0.012);
        for (let i = 0; i < 14; i++) {
            const gx = x + (w / 14) * i + 4;
            ctx.beginPath();
            ctx.moveTo(gx, y + 4);
            ctx.lineTo(gx, y + h - 4);
            ctx.stroke();
        }
        ctx.fillStyle = cfg.col2;
        ctx.fillRect(x, y, w, h * 0.12);
        ctx.fillRect(x, y + h * 0.88, w, h * 0.12);
        ctx.fillStyle = 'rgba(255,255,255,0.07)';
        ctx.fillRect(x, y + h * 0.12, w, h * 0.06);
        // 编号
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.font = 'bold ' + Math.max(9, h * 0.14) + 'px "Courier New", monospace';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText('CARGO 88-' + (100 + Math.floor(p.t * 7) % 800), x + 8, y + h * 0.55);
        ctx.restore();
    }

    function drawAC(x, y, w, h, cfg, p) {
        propBody((px, py, pw, ph, r) => { roundRectPath(px, py, pw, ph, 6); }, x, y, w, h, cfg.col, 6);
        ctx.save();
        roundRectPath(x, y, w, h, 6); ctx.clip();
        ctx.fillStyle = cfg.col2;
        ctx.fillRect(x, y + h * 0.7, w, h * 0.3);
        // 风扇
        const spin = clock * (5 + p.t * 0.01);
        ctx.strokeStyle = 'rgba(20,24,30,0.85)';
        ctx.lineWidth = Math.max(2, w * 0.03);
        ctx.beginPath();
        ctx.arc(x + w * 0.5, y + h * 0.40, h * 0.28, 0, Math.PI * 2);
        ctx.stroke();
        for (let i = 0; i < 4; i++) {
            const a = spin + i * Math.PI / 2;
            ctx.beginPath();
            ctx.moveTo(x + w * 0.5, y + h * 0.40);
            ctx.quadraticCurveTo(x + w * 0.5 + Math.cos(a) * h * 0.2, y + h * 0.40 + Math.sin(a) * h * 0.2,
                x + w * 0.5 + Math.cos(a + 0.6) * h * 0.28, y + h * 0.40 + Math.sin(a + 0.6) * h * 0.28);
            ctx.stroke();
        }
        // 百叶
        ctx.strokeStyle = 'rgba(0,0,0,0.18)';
        ctx.lineWidth = 1.6;
        for (let i = 1; i < 4; i++) {
            ctx.beginPath();
            ctx.moveTo(x, y + h * (0.68 + i * 0.06));
            ctx.lineTo(x + w, y + h * (0.68 + i * 0.06));
            ctx.stroke();
        }
        ctx.restore();
    }

    function drawTank(x, y, w, h, cfg, p) {
        // 支架腿
        ctx.fillStyle = cfg.col2;
        ctx.fillRect(x + w * 0.10, y + h * 0.72, w * 0.07, h * 0.30);
        ctx.fillRect(x + w * 0.83, y + h * 0.72, w * 0.07, h * 0.30);
        // 水箱
        const ty = y + h * 0.10, th = h * 0.62;
        ctx.fillStyle = '#2b3340';
        ctx.fillRect(x + w * 0.02, ty + th * 0.42, w * 0.96, h * 0.06);
        propBody((px, py, pw, ph, r) => {
            ctx.beginPath();
            ctx.moveTo(px, py + ph * 0.30);
            ctx.quadraticCurveTo(px, py, px + pw * 0.5, py);
            ctx.quadraticCurveTo(px + pw, py, px + pw, py + ph * 0.30);
            ctx.lineTo(px + pw, py + ph * 0.70);
            ctx.quadraticCurveTo(px + pw, py + ph, px + pw * 0.5, py + ph);
            ctx.quadraticCurveTo(px, py + ph, px, py + ph * 0.70);
            ctx.closePath();
        }, x, ty, w, th, cfg.col, 0);
        ctx.save();
        ctx.strokeStyle = cfg.col2;
        ctx.lineWidth = Math.max(2, w * 0.02);
        for (let i = 1; i < 4; i++) {
            const gy = ty + th * (i / 4);
            ctx.beginPath();
            ctx.moveTo(x + 2, gy);
            ctx.lineTo(x + w - 2, gy);
            ctx.stroke();
        }
        // 水渍
        ctx.fillStyle = 'rgba(90,209,255,0.22)';
        ctx.beginPath();
