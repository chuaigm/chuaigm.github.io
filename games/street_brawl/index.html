        ctx.ellipse(x + w * 0.5, ty + th * 0.5, w * 0.36, th * 0.34, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        // 顶部圆盖
        ctx.fillStyle = cfg.rim;
        ctx.beginPath();
        ctx.ellipse(x + w * 0.5, ty, w * 0.22, h * 0.03, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    // ==================== 绘制：掉落物 ====================
    function drawDrop(d) {
        const s = depthScale(d.depth);
        const baseY = depthY(d.depth);
        const y = baseY - d.alt + (d.ground ? d.bob : 0);
        const blink = d.life < 5 && Math.sin(clock * 16) < 0;
        if (blink) return;
        const cfg = d.cfg;
        const bob = d.ground ? Math.sin(d.t * 3) * 2 : 0;
        ctx.save();
        // 地面光圈
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = cfg.col;
        ctx.beginPath();
        ctx.ellipse(d.x, baseY + 2, 20 * s, 5 * s, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        const r = 15 * s;
        ctx.translate(d.x, y + bob);
        ctx.shadowColor = cfg.col;
        ctx.shadowBlur = 14;
        drawDropIcon(d.type, r, cfg);
        ctx.restore();
        // 掉落标签
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = 'bold ' + Math.round(11 * s + 4) + 'px "Courier New", monospace';
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillText(cfg.label, d.x + 1, y - r - 9);
        ctx.fillStyle = cfg.col;
        ctx.fillText(cfg.label, d.x, y - r - 10);
        ctx.restore();
    }

    function drawDropIcon(type, r, cfg) {
        if (type === 'food') {
            ctx.fillStyle = '#c98a4b';
            ctx.beginPath();
            ctx.ellipse(0, 0, r, r * 0.62, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = OUTLINE; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = '#e8b877';
            ctx.beginPath();
            ctx.ellipse(-r * 0.2, -r * 0.12, r * 0.5, r * 0.26, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#f2ead8';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(r * 0.5, -r * 0.2);
            ctx.lineTo(r * 0.95, -r * 0.55);
            ctx.stroke();
        } else if (type === 'soda') {
            ctx.fillStyle = cfg.col;
            roundRectPath(-r * 0.6, -r * 0.85, r * 1.2, r * 1.7, r * 0.25);
            ctx.fill();
            ctx.strokeStyle = OUTLINE; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = cfg.col2;
            ctx.fillRect(-r * 0.6, -r * 0.1, r * 1.2, r * 0.5);
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.fillRect(-r * 0.36, -r * 0.62, r * 0.22, r * 1.2);
        } else if (type === 'beer') {
            ctx.fillStyle = cfg.col;
            roundRectPath(-r * 0.55, -r * 0.6, r * 1.1, r * 1.5, r * 0.2);
            ctx.fill();
            ctx.strokeStyle = OUTLINE; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = '#f8f0dc';
            roundRectPath(-r * 0.42, -r * 0.95, r * 0.84, r * 0.4, r * 0.14);
            ctx.fill();
            ctx.strokeStyle = OUTLINE; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = cfg.col2;
            ctx.fillRect(-r * 0.55, r * 0.2, r * 1.1, r * 0.3);
        } else if (type === 'life') {
            ctx.fillStyle = cfg.col;
            roundRectPath(-r * 0.9, -r * 0.75, r * 1.8, r * 1.5, r * 0.22);
            ctx.fill();
            ctx.strokeStyle = OUTLINE; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold ' + Math.round(r * 1.1) + 'px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('1', 0, 0);
        } else {
            // 现金
            for (let i = 0; i < 3; i++) {
                ctx.fillStyle = i === 2 ? cfg.col : cfg.col2;
                roundRectPath(-r * 0.8 + i * 2, -r * 0.5 + (i % 2) * 3 - i * 2, r * 1.6, r * 1.0, 3);
                ctx.fill();
                ctx.strokeStyle = OUTLINE; ctx.lineWidth = 1.6; ctx.stroke();
            }
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.26, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // ==================== 绘制：投射物与冲击环 ====================
    function drawShots() {
        for (let i = 0; i < shots.length; i++) {
            const s = shots[i];
            const sc = depthScale(s.depth);
            ctx.save();
            ctx.translate(s.x, s.y);
            ctx.globalCompositeOperation = 'lighter';
            if (s.isFlop) {
                ctx.rotate(s.t * 16);
                ctx.globalCompositeOperation = 'source-over';
                ctx.fillStyle = '#8a6a46';
                roundRectPath(-s.r, -s.r * 0.18, s.r * 2, s.r * 0.36, 4);
                ctx.fill();
                ctx.strokeStyle = OUTLINE; ctx.lineWidth = 2; ctx.stroke();
            } else {
                const wob = Math.sin(s.t * 22) * 0.18;
                ctx.rotate(wob);
                ctx.strokeStyle = s.col;
                ctx.lineWidth = Math.max(2, s.r * 0.12);
                ctx.globalAlpha = 0.9;
                ctx.beginPath();
                ctx.arc(0, 0, s.r * sc * (0.9 + Math.sin(s.t * 18) * 0.1), -1.05, 1.05);
                ctx.stroke();
                ctx.globalAlpha = 0.35;
                ctx.beginPath();
                ctx.arc(0, 0, s.r * sc * 1.35, -0.7, 0.7);
                ctx.stroke();
                ctx.fillStyle = '#ffffff';
                ctx.globalAlpha = 0.9;
                ctx.beginPath();
                ctx.ellipse(0, 0, s.r * sc * 0.42, s.r * sc * 0.72, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }
        for (let i = 0; i < rings.length; i++) {
            const g = rings[i];
            const gy = depthY(g.depth) - 8 * depthScale(g.depth);
            const a = clamp(g.life / g.maxLife, 0, 1);
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = a * 0.85;
            ctx.strokeStyle = g.col || '#ffd966';
            ctx.lineWidth = Math.max(2, g.r * 0.14 * a);
            ctx.beginPath();
            ctx.ellipse(g.x, gy, g.r, g.r * 0.30, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalAlpha = a * 0.35;
            ctx.beginPath();
            ctx.ellipse(g.x, gy, g.r * 0.72, g.r * 0.20, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
    }

    // ==================== 绘制：HUD ====================
    function drawBar(x, y, w, h, ratio, fill, back) {
        ctx.fillStyle = back || 'rgba(8, 10, 20, 0.85)';
        roundRectPath(x, y, w, h, h / 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.10)';
        ctx.lineWidth = 1;
        roundRectPath(x + 1, y + 1, w - 2, h - 2, (h - 2) / 2);
        ctx.stroke();
        const fw = Math.max(0, (w - 6) * clamp(ratio, 0, 1));
        if (fw > 1) {
            const g = ctx.createLinearGradient(x, y, x + w, y);
            g.addColorStop(0, fill[0]);
            g.addColorStop(1, fill[1]);
            ctx.fillStyle = g;
            roundRectPath(x + 3, y + 3, fw, h - 6, (h - 6) / 2);
            ctx.fill();
        }
    }

    function drawHud() {
        ctx.fillStyle = hudBgGrad;
        ctx.fillRect(0, 0, W, HUD_H);
        ctx.strokeStyle = 'rgba(120, 170, 210, 0.30)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, HUD_H - 0.5);
        ctx.lineTo(W, HUD_H - 0.5);
        ctx.stroke();
        // HUD 底部渐隐，避免与场景硬接缝
        const fade = ctx.createLinearGradient(0, HUD_H, 0, HUD_H + 26);
        fade.addColorStop(0, 'rgba(8, 10, 20, 0.75)');
        fade.addColorStop(1, 'rgba(8, 10, 20, 0)');
        ctx.fillStyle = fade;
        ctx.fillRect(0, HUD_H, W, 26);

        ctx.textBaseline = 'middle';

        // ---- 玩家生命 ----
        const pw = 392;
        ctx.font = 'bold 16px "Courier New", monospace';
        ctx.textAlign = 'left';
        ctx.fillStyle = '#9bf6b0';
        ctx.fillText('你', 18, 24);
        drawBar(46, 14, pw - 46, 20, player.hp / player.maxHp, ['#7ee08a', '#4cc76a']);
        ctx.font = 'bold 12px "Courier New", monospace';
        ctx.textAlign = 'right';
        ctx.fillStyle = 'rgba(230,240,255,0.85)';
        ctx.fillText(Math.max(0, Math.ceil(player.hp)) + ' / ' + player.maxHp, pw + 16, 24);

        // ---- 气力 ----
        const qiRatio = player.qi / player.qiMax;
        ctx.textAlign = 'left';
        ctx.font = 'bold 12px "Courier New", monospace';
        ctx.fillStyle = player.qi >= player.qiMax ? '#9bf6ff' : '#7ec8ff';
        ctx.fillText('气', 18, 46);
        drawBar(46, 38, 190, 12, qiRatio, ['#9fe8ff', '#3f9fe0']);
        ctx.fillStyle = 'rgba(220,240,255,0.7)';
        ctx.font = 'bold 11px "Courier New", monospace';
        ctx.fillText(String(Math.floor(player.qi)), 244, 45);
        if (player.rageT > 0) {
            ctx.fillStyle = '#ffb74d';
            ctx.font = 'bold 12px "Courier New", monospace';
            ctx.fillText('狂暴 ' + player.rageT.toFixed(1) + 's', 278, 45);
        }

        // ---- 技能冷却 ----
        const order = PLAYER_MOVES;
        for (let i = 0; i < order.length; i++) {
            const key = order[i];
            const mv = MOVES[key];
            const bx = 18 + i * 64;
            const by = 58;
            const bw = 58, bh = 22;
            const ready = player.cooldowns[key] <= 0;
            const affordable = !mv.qi || player.qi >= mv.qi;
            ctx.fillStyle = ready ? (affordable ? 'rgba(60, 96, 140, 0.92)' : 'rgba(52, 44, 60, 0.9)') : 'rgba(32, 38, 56, 0.9)';
            roundRectPath(bx, by, bw, bh, 7);
            ctx.fill();
            const ratio = ready ? 1 : 1 - (player.cooldowns[key] / mv.cd);
            ctx.fillStyle = ready ? (affordable ? 'rgba(155, 246, 176, 0.26)' : 'rgba(255, 180, 120, 0.18)')
                : 'rgba(120, 140, 190, 0.20)';
            roundRectPath(bx, by + bh - bh * clamp(ratio, 0, 1), bw, bh * clamp(ratio, 0, 1), 7);
            ctx.fill();
            ctx.font = 'bold 11px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillStyle = ready ? (affordable ? '#dff5e6' : '#ffc79a') : 'rgba(200,210,230,0.5)';
            ctx.fillText(mv.label + ' ' + mv.key, bx + bw / 2, by + 8);
            if (mv.qi) {
                ctx.font = 'bold 9px "Courier New", monospace';
                ctx.fillStyle = affordable ? 'rgba(158, 200, 255, 0.9)' : 'rgba(255, 140, 140, 0.9)';
                ctx.fillText('气' + mv.qi, bx + bw / 2, by + 17);
            }
        }

        // ---- 敌人 ----
        let shown = 0;
        for (let i = 0; i < foes.length && shown < 3; i++) {
            const f = foes[i];
            if (f.isBoss || f.dead) continue;
            const ew = 200;
            const ex = W - 18 - ew;
            const ey = 14 + shown * 22;
            ctx.font = 'bold 12px "Courier New", monospace';
            ctx.textAlign = 'right';
            ctx.fillStyle = '#ffb3b3';
            ctx.fillText(f.ftype ? f.ftype.name : '打手', ex - 10, ey + 7);
            drawBar(ex, ey, ew, 14, f.hp / f.maxHp, FOE_BAR_COLORS[f.kind] || ['#ff8f8f', '#e04b4b']);
            shown++;
        }

        // ---- 中央信息 ----
        ctx.textAlign = 'center';
        ctx.font = 'bold 15px "Courier New", monospace';
        ctx.fillStyle = '#ffd966';
        ctx.fillText(curLevel().name + '  第 ' + Math.max(1, wave) + '/' + curLevel().waves.length + ' 波', W / 2, 18);
        ctx.font = 'bold 24px "Courier New", monospace';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(String(score), W / 2, 44);

        ctx.font = 'bold 14px "Courier New", monospace';
        ctx.fillStyle = '#ff8fa3';
        for (let i = 0; i < Math.max(0, lives); i++) {
            ctx.fillText('1P', W / 2 - 44 + i * 30, 68);

        if (combo > 1 && comboTimer > 0) {
            ctx.font = 'bold 15px "Courier New", monospace';
            ctx.fillStyle = '#ff9ff3';
            ctx.fillText(combo + ' 连击', W / 2 + 128, 68);
        }
    }

        ctx.font = 'bold 20px "Courier New", monospace';
        ctx.fillStyle = 'rgba(226,236,255,0.85)';
        ctx.fillText('当前得分 ' + score + '　　剩余残机 ' + Math.max(0, lives), W / 2, H / 2 + 26);
        ctx.font = 'bold 17px "Courier New", monospace';
        ctx.fillStyle = 'rgba(255,214,140,' + (0.5 + 0.5 * Math.sin(clock * 3)).toFixed(2) + ')';
        ctx.fillText('按 Enter / 空格 继续', W / 2, H / 2 + 78);
        ctx.restore();
    }

    function drawDeadScreen() {
        const a = clamp(modeT / 0.5, 0, 1);
        ctx.save();
        ctx.globalAlpha = a;
        ctx.fillStyle = 'rgba(30, 4, 10, 0.55)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = 'bold 70px "Courier New", monospace';
        ctx.fillStyle = '#ff6b6b';
        ctx.fillText('K.O.', W / 2, H / 2 - 30);
        ctx.font = 'bold 30px "Courier New", monospace';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('残机 ' + Math.max(0, lives - 1) + ' 剩余', W / 2, H / 2 + 26);
        ctx.font = 'bold 18px "Courier New", monospace';
        ctx.fillStyle = 'rgba(226,236,255,0.8)';
        ctx.fillText('重新挑战 ' + curLevel().name + ' …', W / 2, H / 2 + 70);
        ctx.restore();
    }

    function drawGameOver() {
        const a = clamp(modeT / 0.6, 0, 1);
        ctx.save();
        ctx.globalAlpha = a;
        ctx.fillStyle = 'rgba(5, 6, 12, 0.86)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = 'bold 68px "Courier New", monospace';
        ctx.fillStyle = '#ff6b6b';
        ctx.fillText('GAME OVER', W / 2, H / 2 - 78);
        ctx.font = 'bold 24px "Courier New", monospace';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('得分 ' + score, W / 2, H / 2 - 14);
        ctx.font = 'bold 17px "Courier New", monospace';
        ctx.fillStyle = 'rgba(220,230,255,0.72)';
        ctx.fillText('止步于 ' + curLevel().name + ' 第 ' + Math.max(1, wave) + ' 波　　击倒 ' + koCount + ' 人　　最高连击 ' + maxCombo, W / 2, H / 2 + 22);
        ctx.fillStyle = 'rgba(255,214,140,0.9)';
        ctx.fillText('最高分 ' + bestScore, W / 2, H / 2 + 56);
        ctx.font = 'bold 18px "Courier New", monospace';
        ctx.fillStyle = 'rgba(220,230,255,0.75)';
        ctx.fillText('按 Enter / 空格 回到标题', W / 2, H / 2 + 104);
        ctx.restore();
    }

    function drawEndingScreen() {
        const a = clamp(modeT / 0.8, 0, 1);
        ctx.save();
        ctx.globalAlpha = a;
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, 'rgba(12, 6, 24, 0.90)');
        g.addColorStop(1, 'rgba(4, 6, 14, 0.94)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = 'bold 78px "Courier New", monospace';
        ctx.fillStyle = '#ffd966';
        ctx.shadowColor = '#ff8a3c';
        ctx.shadowBlur = 30;
        ctx.fillText('ENDING', W / 2, 150);
        ctx.shadowBlur = 0;
        ctx.font = 'bold 40px "Courier New", monospace';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('这条街，今晚归你了。', W / 2, 226);

        ctx.font = '19px "Courier New", monospace';
        ctx.fillStyle = 'rgba(214,228,255,0.85)';
        ctx.fillText('影子教父倒在霓虹里，整座城市安静了下来。', W / 2, 300);
        ctx.fillText('你在楼顶坐了很久，直到东边的天开始发白。', W / 2, 336);

        ctx.font = 'bold 20px "Courier New", monospace';
        ctx.fillStyle = '#7ec8ff';
        ctx.fillText('最 终 得 分', W / 2, 410);
        ctx.font = 'bold 62px "Courier New", monospace';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(String(score), W / 2, 466);
        ctx.font = 'bold 18px "Courier New", monospace';
        ctx.fillStyle = 'rgba(226,236,255,0.8)';
        ctx.fillText('击倒 ' + koCount + ' 人　　最高连击 ' + maxCombo + '　　剩余残机 ' + Math.max(0, lives), W / 2, 516);
        ctx.fillStyle = 'rgba(255,214,140,0.95)';
        ctx.fillText('历史最高 ' + bestScore + (score >= bestScore ? '　（新纪录！）' : ''), W / 2, 552);

        ctx.font = 'bold 18px "Courier New", monospace';
        ctx.fillStyle = 'rgba(220,230,255,' + (0.5 + 0.5 * Math.sin(clock * 3)).toFixed(2) + ')';
        ctx.fillText('按 Enter / 空格 回到标题', W / 2, 632);
        ctx.font = 'bold 14px "Courier New", monospace';
        ctx.fillStyle = 'rgba(200,214,240,0.45)';
        ctx.fillText('- STREET BRAWL  ·  谢 谢 游 玩 -', W / 2, 676);
        ctx.restore();
    }

    // ==================== 主渲染 ====================
    function draw() {
        applyCanvasTransform();
        ctx.clearRect(0, 0, W, H);

        const sx = shake > 0 ? rand(-shake, shake) : 0;
        const sy = shake > 0 ? rand(-shake, shake) : 0;
        ctx.save();
        ctx.translate(sx, sy);

        drawBackdrop();

        // 影子画在人物之下
        const all = [player];
        for (let i = 0; i < foes.length; i++) all.push(foes[i]);
        // 封面画面只留布景，不画战斗角色
        if (mode === 'title' || mode === 'howto') all.length = 0;
        for (let i = 0; i < all.length; i++) {
            if (all[i]) drawShadow(all[i]);
        }
        for (let i = 0; i < props.length; i++) {
            const p = props[i];
            if (!p.dead && !p.cfg.solid) drawPropShadow(p);
        }

        // 统一按纵深从远到近排序：道具 / 掉落物 / 人物
        const layer = [];
        for (let i = 0; i < props.length; i++) {
            const p = props[i];
            if (!p.dead) layer.push({ d: p.depth, t: 0, o: p });
        }
        for (let i = 0; i < drops.length; i++) layer.push({ d: drops[i].depth, t: 1, o: drops[i] });
        for (let i = 0; i < all.length; i++) {
            if (all[i]) layer.push({ d: all[i].depth, t: 2, o: all[i] });
        }
        layer.sort((a, b) => (b.d - a.d) || (a.t - b.t));
        for (let i = 0; i < layer.length; i++) {
            const it = layer[i];
            if (it.t === 0) drawProp(it.o);
            else if (it.t === 1) drawDrop(it.o);
            else drawFighter(it.o);
        }

        drawShots();
        drawParticles();
        drawImpacts();
        drawFloaters();

        // 全屏闪光
        if (flashT > 0) {
            ctx.save();
            ctx.globalAlpha = clamp(flashT, 0, 1) * 0.45;
            ctx.globalCompositeOperation = 'lighter';
            ctx.fillStyle = flashCol;
            ctx.fillRect(-20, -20, W + 40, H + 40);
            ctx.restore();
        }

        ctx.restore();

        if (mode === 'title') {
            drawTitleScreen();
            return;
        }

        drawHud();
        drawBossBar();
        drawStageBanner();
        drawBanner();
        if (mode === 'play') { drawHint(); drawTouchGuide(); }

        if (mode === 'brief') drawBriefScreen();
        if (mode === 'pause') drawPauseScreen();
        if (mode === 'clear') drawClearScreen();
        if (mode === 'dead') drawDeadScreen();
        if (mode === 'gameover') drawGameOver();
        if (mode === 'ending') drawEndingScreen();
        if (mode === 'howto') drawHowTo();

        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
    }

    function drawPropShadow(p) {
        const s = depthScale(p.depth);
        ctx.save();
        ctx.globalAlpha = 0.26;
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.ellipse(p.x, depthY(p.depth) + 3 * s, p.cfg.w * 0.55 * s, 7 * s, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    // ==================== 主循环 ====================
    let lastTime = 0;
    function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        let dt = (timestamp - lastTime) / 1000;
        lastTime = timestamp;
        if (dt > 0.1) dt = 0.1;
        if (dt < 0.001) dt = 0.001;

        update(dt);
        draw();
        requestAnimationFrame(gameLoop);
    }

    // ==================== 初始化 ====================
    updateFullscreenButton();
    resizeCanvas();
    // 封面：先把第一关场景搭好当作背景
    startLevel(0);
    mode = 'title';
    modeT = 0;
    menuIndex = 0;
    stageIntroT = 0;
    requestAnimationFrame(() => { resizeCanvas(); requestAnimationFrame(resizeCanvas); });
    requestAnimationFrame(gameLoop);    window.__G = {
        get mode(){return mode;}, get levelIndex(){return levelIndex;}, get wave(){return wave;},
        get player(){return player;}, get foes(){return foes;}, get boss(){return boss;},
        get props(){return props;}, get score(){return score;}, get lives(){return lives;},
        get qi(){return player.qi;},
        startGame:startGame, setMode:setMode, update:update, draw:draw, level:curLevel,
        startAttack:startAttack, MOVES:MOVES, FIG_COLORS:FIG_COLORS, LEVELS:LEVELS, PROPS:PROPS,
        cheat:{
            killAll(){ for(var i=0;i<foes.length;i++){ var f=foes[i]; if(!f.dead) killFighter(f); } },
            killPlayer(){ if(player && !player.dead) killFighter(player); },
            hurtAll(){ for(var i=0;i<foes.length;i++){ var f=foes[i]; if(!f.dead) applyHit(f,{dmg:20,kbx:100,lift:0,kind:'jab'},1,1); } },
            bossMove(n){ if(boss){ boss.cooldowns={}; startAttack(boss,n); } },
            breakAll(){ for(var i=0;i<props.length;i++){ if(!props[i].dead) breakProp(props[i],player); } },
            hitAllProps(){ for(var i=0;i<props.length;i++){ if(!props[i].dead) damageProp(props[i], 99, player); } },
            setLives(n){ lives=n; }, hp(n){ player.hp=n; }, qi2(n){ player.qi=n; },
            spawnAllDrops(){ spawnDrop(400,0.5,'food'); spawnDrop(500,0.5,'soda'); spawnDrop(600,0.5,'beer'); spawnDrop(700,0.5,'cash'); spawnDrop(800,0.5,'life'); }
        }
    };
})();
</script>
</body>
