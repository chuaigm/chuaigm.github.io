<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>街头小霸王</title>    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            background: #0b1a2f;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
        }
        .game-container {
            background: #1e2f4a;
            padding: 0;
            border-radius: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
            max-height: 100%;
            transition: border-radius 0.2s;
        }
        .canvas-wrap {
            position: relative;
            width: 100%;
            max-width: 1280px;
            line-height: 0;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1280 / 720;
            border-radius: 0;
            box-shadow: none;
            touch-action: none;
        }
        .fullscreen-btn {
            position: absolute;
            top: 6px; right: 6px;
            width: 30px; height: 30px;
            min-width: 30px; min-height: 30px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.45);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            transition: background 0.15s, color 0.15s, transform 0.1s;
            z-index: 10; padding: 0; outline: none;
        }
        .fullscreen-btn:hover { background: rgba(255, 255, 255, 0.18); color: rgba(255, 255, 255, 0.8); }
        .fullscreen-btn:active { background: rgba(255, 255, 255, 0.28); color: #ffffff; transform: scale(0.92); }
        .fullscreen-btn svg { width: 15px; height: 15px; display: block; pointer-events: none; }
        @media (max-width: 720px) {
            .fullscreen-btn { width: 26px; height: 26px; top: 5px; right: 5px; border-radius: 7px; }
            .fullscreen-btn svg { width: 13px; height: 13px; }
        }
        .game-container.is-fullscreen {
            width: 100vw; height: 100vh;
            max-width: none; max-height: none;
            border-radius: 0; padding: 0; background: #000;
            justify-content: center; align-items: center;
        }
        .game-container.is-fullscreen .canvas-wrap {
            width: 100%; height: 100%; max-width: none;
            display: flex; align-items: center; justify-content: center;
        }
        .game-container.is-fullscreen canvas {
            width: auto !important;
            height: auto !important;
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 1280 / 720;
            border-radius: 0; box-shadow: none;
        }
        .game-container.is-fullscreen .fullscreen-btn {
            top: 8px; right: 8px;
            background: rgba(255, 255, 255, 0.10);
            color: rgba(255, 255, 255, 0.55);
            z-index: 30;
        }
    </style>
</head>

    // ==================== 全屏控制 ====================
    const fullscreenApi = {
        request: () => {
            const el = document.documentElement;
            if (el.requestFullscreen) return el.requestFullscreen();
            if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
            if (el.msRequestFullscreen) return el.msRequestFullscreen();
        },
        exit: () => {
            if (document.exitFullscreen) return document.exitFullscreen();
            if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
            if (document.msExitFullscreen) return document.msExitFullscreen();
        },
        isFullscreen: () => !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement)
    };

    function updateFullscreenButton() {
        const fs = fullscreenApi.isFullscreen();
        fsIconExpand.style.display = fs ? 'none' : 'block';
        fsIconCompress.style.display = fs ? 'block' : 'none';
        fullscreenBtn.setAttribute('aria-label', fs ? '退出全屏' : '全屏');
        fullscreenBtn.setAttribute('title', fs ? '退出全屏' : '全屏');
    }

    function toggleFullscreen() {
        if (fullscreenApi.isFullscreen()) fullscreenApi.exit();
        else fullscreenApi.request();
    }

    fullscreenBtn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); toggleFullscreen(); });
    fullscreenBtn.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
    fullscreenBtn.addEventListener('touchend', (e) => e.stopPropagation(), { passive: true });

    function onFullscreenChange() {
        container.classList.toggle('is-fullscreen', fullscreenApi.isFullscreen());
        updateFullscreenButton();
        setTimeout(scheduleResize, 60);
        setTimeout(scheduleResize, 200);
        setTimeout(scheduleResize, 500);
    }
    document.addEventListener('fullscreenchange', onFullscreenChange);
    document.addEventListener('webkitfullscreenchange', onFullscreenChange);
    document.addEventListener('msfullscreenchange', onFullscreenChange);

    // ==================== 画布适配 ====================
    function applyCanvasTransform() {
        ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    }

    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        const availWidth = window.innerWidth;
        const availHeight = window.innerHeight;
        const availWidthFromHeight = availHeight * (W / H);
        let cssW = Math.min(availWidth, availWidthFromHeight);
        if (!fullscreenApi.isFullscreen()) cssW = Math.min(cssW, 1280);
        if (!isFinite(cssW) || cssW < 100) cssW = Math.max(100, Math.min(availWidth, 1280));
        const cssH = cssW * (H / W);
        canvas.style.width = cssW + 'px';
        canvas.style.height = cssH + 'px';
        canvas.width = Math.round(cssW * dpr);
        canvas.height = Math.round(cssH * dpr);
        applyCanvasTransform();
    }

    let resizeScheduled = false;
    function scheduleResize() {
        if (resizeScheduled) return;
        resizeScheduled = true;
        requestAnimationFrame(() => { resizeScheduled = false; resizeCanvas(); });
    }
    window.addEventListener('resize', scheduleResize);

    // ==================== 音频 ====================
    let audioCtx = null;
    function ensureAudio() {
        if (!audioCtx) {
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    function tone(type, f0, f1, dur, vol, delay) {
        ensureAudio();
        if (!audioCtx) return;
        const t = audioCtx.currentTime + (delay || 0);
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f0, t);
        if (f1 !== f0) osc.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + dur + 0.02);
    }

    function noiseHit(dur, vol, freq) {
        ensureAudio();
        if (!audioCtx) return;
        const t = audioCtx.currentTime;
        const len = Math.max(0.05, dur);
        const buf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * len), audioCtx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        const f = audioCtx.createBiquadFilter();
        f.type = 'bandpass';
        f.frequency.value = freq;
        f.Q.value = 0.9;
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + len);
        src.connect(f); f.connect(g); g.connect(audioCtx.destination);
        src.start(t);
        src.stop(t + len + 0.02);
    }

    // 波次推进：把队列里的敌人分批放进场
    function updateWaves(dt) {
        if (boss) return;
        const lv = curLevel();
        const alive = foes.filter(f => !f.dead).length;
        if (wave >= lv.waves.length) {
            if (alive === 0) spawnBoss();
            return;
        }
        waveTimer -= dt;
        if (waveQueue.length === 0 && alive === 0) {
            wave++;
            if (wave > lv.waves.length) return;
            waveQueue = lv.waves[wave - 1].foes.slice();
            waveTimer = 1.1;
            if (wave > 1) showBanner('第 ' + wave + ' 波', lv.waves[wave - 1].foes.length + ' 名敌人', 1.4);
            return;
        }
        const maxF = STAGE_MAX_FOES[levelIndex];
        if (waveTimer <= 0 && waveQueue.length > 0 && alive < maxF) {
            const kind = waveQueue.shift();
            const f = makeFighter(kind, 0, 0.5, 0);
            foes.push(f);
            ftypeApply(f, kind);
            spawnFoe(f, false);
            waveTimer = rand(1.0, 1.9);
        }
    }

    function ftypeApply(f, kind) {
        const t = FOE_TYPES[kind];
        f.ftype = t;
        f.maxHp = Math.round(t.hp * (1 + levelIndex * 0.22) * (1 + wave * 0.05));
        f.hp = f.maxHp;
        f.cooldowns = {};
        f.dmgMul = 1;
    }

    function spawnBoss() {
        const lv = curLevel();
        const bd = lv.boss;
        const b = makeFighter(bd.kind, 0, 0.5, bd.hp);
        b.isBoss = true;
        b.hp = bd.hp; b.maxHp = bd.hp;
        b.name = bd.name;
        b.title = bd.title;
        b.cooldowns = {};
        b.aiTimer = 1.6;
        b.telegraph = 0;
        b.phase = 0;
        foes.push(b);
        spawnFoe(b, false);
        boss = b;
        bossIntroT = 2.4;
        bossBar = { t: 0 };
        shake = Math.min(22, shake + 14);
        flashScreen('#ff4d6a', 0.35);
        sfxBoss();

    function spawnFoe(f, silent) {
        // 从屏幕左右两侧外面进场，走到位后再加入战斗
        const side = Math.random() < 0.5 ? -1 : 1;
        const entryX = side < 0 ? -FIG_H * 1.1 : W + FIG_H * 1.1;
        const landX = clamp((player ? player.x : 400) + side * rand(340, 520), STAGE_L + 80, STAGE_R - 80);
        f.x = entryX;
        f.enterX = landX;
        f.entering = true;
        f.landed = true;
        f.depth = clamp((player ? player.depth : 0.5) + rand(-0.16, 0.16), DEPTH_MIN, DEPTH_MAX);
        f.alt = 0; f.vy = 0; f.vx = 0; f.vDepth = 0;
        if (f.ftype) ftypeApply(f, f.kind);
        f.dead = false; f.koT = 0; f.hurtT = 0; f.invuln = 0; f.flash = 0;
        f.atk = null; f.atkT = 0; f.hitIds = null; f.hitProps = null; f.impactDone = true;
        f.atkPhasePrev = 'windup';
        for (const k in f.cooldowns) f.cooldowns[k] = 0;
        f.walkPhase = rand(0, 6.28);
        f.facing = side < 0 ? 1 : -1;
        f.aiMode = 'approach';
        f.stunT = 0; f.wetT = 0;
        f.aiTimer = rand(AI.reactMin, AI.reactMax) + rand(0.2, 0.6);
        if (!silent) sfxReady();

    // ==================== 战斗 ====================
    function startAttack(f, moveName) {
        if (f.dead || f.hurtT > 0 || f.atk || f.stunT > 0) return false;
        const mv = MOVES[moveName];
        if (!mv) return false;
        if (f.cooldowns[moveName] > 0) return false;
        if (f.kind !== 'player' && atkToken && atkToken !== f && !f.isBoss) return false;
        if (f.kind === 'player' && mv.qi && player.qi < mv.qi) return false;

        // 出招时自动朝向最近的敌人
        const target = nearestFoe(f.x);
        if (target) f.facing = target.x >= f.x ? 1 : -1;

        f.atk = moveName;
        f.atkT = 0;
        f.atkPhasePrev = 'windup';
        f.hitIds = [];
        f.hitProps = [];
        f.impactDone = false;
        f.cooldowns[moveName] = mv.cd * (f.rageT > 0 ? 0.7 : 1);
        if (f.kind === 'player') {
            if (mv.qi) player.qi = Math.max(0, player.qi - mv.qi);
            if (f.rageT > 0) f.dmgMul = 1.35; else f.dmgMul = 1;
        } else atkToken = f;
        if (mv.teleport) {
            // 瞬移到玩家背后
            const side = Math.random() < 0.5 ? -1 : 1;
            f.x = clamp(player.x - player.facing * FIG_H * 0.5 + side * FIG_H * 0.2, STAGE_L, STAGE_R);
            f.depth = clamp(player.depth + rand(-0.10, 0.10), DEPTH_MIN, DEPTH_MAX);
            f.facing = player.x >= f.x ? 1 : -1;
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x: f.x + rand(-24, 24), y: depthY(f.depth) - rand(20, 150),
                    vx: rand(-90, 90), vy: rand(-120, 40), r: rand(2, 5),
                    life: rand(0.2, 0.45), max: 0.45, col: '#2a2438', grav: 120
                });
            }
        }
        if (moveName === 'rise' && !f.airborne) {
            f.vy = -JUMP_V * 0.72;
            f.airborne = true;
            f.jumpCut = false;
            f.jumpAge = 0;
        }
        sfxWhoosh();
        return true;
    }

    function attackPhase(f) {
        if (!f.atk) return 'none';
        const mv = MOVES[f.atk];
        if (f.atkT < mv.windup) return 'windup';
        if (f.atkT < mv.windup + mv.active) return 'active';
        if (f.atkT < mv.windup + mv.active + mv.rec) return 'recover';
        return 'done';
    }

    // 招式进入判定帧时的一次性效果：投射物、冲击波、蓄力特效
    function onAttackActive(f, mv) {
        if (mv.proj) {
            const n = mv.volley || 1;
            for (let i = 0; i < n; i++) {
                const py = depthY(f.depth) - f.alt - FIG_H * depthScale(f.depth) * (mv.hy || 0.6);
                shots.push({
                    x: f.x + f.facing * FIG_H * 0.4, y: py,
                    vx: f.facing * mv.proj.spd, depth: f.depth, alt: f.alt,
                    r: mv.proj.r, life: mv.proj.life, max: mv.proj.life,
                    col: mv.proj.col, dmg: mv.dmg, kbx: mv.kbx, lift: mv.lift,
                    owner: f, kind: f.isBoss ? 'foe' : 'player', t: rand(0, 0.5),
                    hitIds: [], pierce: !!mv.pierce
                });
            }
            sfxShot();
        }
        if (mv.shock) {
            rings.push({
                x: f.x + f.facing * 40, depth: f.depth, vx: f.facing * mv.shock.spd,
                r: 24, max: mv.shock.r, life: mv.shock.life, maxLife: mv.shock.life,
                owner: f, hitIds: [], dmg: mv.dmg, kbx: mv.kbx, lift: 0
            });
            sfxBoom();
            shake = Math.min(20, shake + 8);
        }
        if (f.isBoss) {
            const cy = depthY(f.depth) - f.alt - FIG_H * depthScale(f.depth) * 0.6;
            for (let i = 0; i < 14; i++) {
                particles.push({
                    x: cy && f.x + rand(-40, 40), y: cy + rand(-60, 60),
                    vx: rand(-160, 160), vy: rand(-200, 60), r: rand(2, 6),
                    life: rand(0.2, 0.5), max: 0.5, col: '#ffd966', grav: 400
                });
            }
        }
    }

    function updateAttack(f, dt) {
        if (!f.atk) return;
        const mv = MOVES[f.atk];
        f.atkT += dt;
        const ph = attackPhase(f);
        if (ph === 'active') {
            if (f.atkPhasePrev !== 'active') onAttackActive(f, mv);
            // 冲刺位移：判定帧内匀速突进
            if (mv.dashSpeed) f.vx = f.facing * mv.dashSpeed;
            // 多段命中：按间隔清空命中表
            if (mv.hitEvery) {
                f.hitEveryT = (f.hitEveryT || 0) + dt;
                if (f.hitEveryT >= mv.hitEvery) { f.hitEveryT = 0; f.hitIds = []; }
            }
            const targets = f.kind === 'player' ? foes : [player];
            for (let i = 0; i < targets.length; i++) {
                const t = targets[i];
                if (!t || t.dead || t.entering) continue;
                if (f.hitIds.indexOf(t) >= 0) continue;
                if (tryHit(f, t, mv)) f.hitIds.push(t);
            }
            // 场景道具对所有角色都可破坏（Boss 的重招会直接砸烂街景）
            tryHitProps(f, mv);
        }
        if (ph === 'done') {
            f.atk = null;
            f.atkT = 0;
            f.hitIds = null;
            f.hitProps = null;
            f.hitEveryT = 0;
            if (atkToken === f) atkToken = null;
        }
        f.atkPhasePrev = ph;
    }

    function tryHit(att, tgt, mv) {
        if (tgt.entering) return false;   // 入场动画中不可被打中
        const dx = tgt.x - att.x;
        const adx = Math.abs(dx);
        if (adx > mv.range + FIG_H * 0.18) return false;
        if (dx * att.facing <= 0) return false;

        // 必须处于同一水平线（纵深接近）
        if (Math.abs(tgt.depth - att.depth) > mv.dtol) return false;

        // 攻击带（垂直方向）必须与对方身体重叠
        const sAtt = depthScale(att.depth);
        const sTgt = depthScale(tgt.depth);
        const attGroundY = depthY(att.depth);
        const hitY = attGroundY - att.alt - FIG_H * sAtt * mv.hy;
        const strikeTop = hitY - FIG_H * sAtt * 0.30;
        // 滞空时攻击带向下延伸至地面，使跳跃攻击能打中站桩对手
        const strikeBot = att.airborne
            ? attGroundY + FIG_H * sAtt * 0.06
            : hitY + FIG_H * sAtt * 0.10;

        const tgtFeetY = depthY(tgt.depth) - tgt.alt;
        const bodyTop = tgtFeetY - FIG_H * sTgt * 1.02;
        const bodyBot = tgtFeetY + FIG_H * sTgt * 0.06;
        if (strikeBot < bodyTop - 4 || strikeTop > bodyBot + 4) return false;

        applyHit(tgt, mv, att.facing, att.dmgMul);
        return true;
    }

    function applyHit(tgt, mv, dir, dmgMul) {
        // 无敌帧：避免被两个敌人连续硬直锁死
        if (tgt.invuln > 0) return;
        const dmg = Math.max(1, Math.round(mv.dmg * (dmgMul || 1)));
        tgt.hp -= dmg;
        const isHeavy = mv.kind === 'rise' || mv.kind === 'kick' || mv.kind === 'spin';
        tgt.hurtT = mv.stun !== undefined ? mv.stun : (isHeavy ? (mv.kind === 'rise' ? 0.34 : 0.24) : 0.15);
        tgt.invuln = mv.inv !== undefined ? mv.inv : (isHeavy ? (mv.kind === 'rise' ? 0.75 : 0.50) : 0.32);
        tgt.flash = 0.16;
        tgt.vx = dir * mv.kbx;
        if (mv.lift > 0) {
            tgt.vy = -mv.lift;
            tgt.airborne = true;
            tgt.jumpCut = true;
            tgt.jumpAge = 1;
        }
        if (tgt.atk) { tgt.atk = null; tgt.atkT = 0; tgt.hitIds = null; }
        if (atkToken === tgt) atkToken = null;

        const cx = tgt.x - dir * FIG_H * 0.12;
        const cy = depthY(tgt.depth) - tgt.alt - FIG_H * depthScale(tgt.depth) * 0.6;
        spawnHitSpark(cx, cy, mv.kind);
        floaters.push({
            x: tgt.x, depth: tgt.depth, alt: tgt.alt, text: '-' + dmg, life: 0.9, vy: -70,
            color: mv.kind === 'rise' ? '#ff9ff3' : (mv.kind === 'spin' ? '#a0ffe0' : '#ffd966')
        });

        shake = Math.min(18, shake + (mv.hitStop ? mv.hitStop * 70 : (isHeavy ? 9 : 4)));
        hitStop = Math.max(hitStop, mv.hitStop !== undefined ? mv.hitStop : (isHeavy ? 0.08 : 0.04));

        if (tgt.kind === 'player') {
            combo = 0;
            sfxHurt();
            shake = Math.min(20, shake + 3);
            if (tgt.hp <= 0) killFighter(tgt);
            else sfxHitLight();
        } else {
            combo++;
            comboTimer = 1.6;
            if (combo > maxCombo) maxCombo = combo;
            score += dmg * 10 * Math.min(6, combo);
            if (player) player.qi = Math.min(player.qiMax, player.qi + (mv.kind === 'kick' || mv.kind === 'rise' ? 5 : 2));
            sfxHitHeavy();
            if (tgt.hp <= 0) killFighter(tgt);
        }
    }

    function killFighter(f) {
        f.hp = 0;
        f.dead = true;
        f.koT = 0;
        f.invuln = 0;
        f.atk = null; f.atkT = 0; f.hitIds = null; f.hitProps = null; f.impactDone = true;
        f.flash = 0;
        f.entering = false;
        f.vDepth = 0;
        // 空中被打死：取消跳跃截断，直接重力落地，避免慢慢漂移
        if (f.airborne) { f.jumpCut = false; f.jumpHeld = false; }
        f.landed = !f.airborne;
        if (atkToken === f) atkToken = null;
        sfxKO();
        shake = Math.min(22, shake + 13);
        const cy = depthY(f.depth) - f.alt - FIG_H * depthScale(f.depth) * 0.5;
        for (let i = 0; i < 16; i++) spawnHitSpark(f.x, cy, 'star');
        if (f.kind === 'player') {
            onPlayerDeath();
        } else {
            koCount++;
            const base = f.ftype ? f.ftype.score : 1200;
            score += base * (1 + Math.floor(combo / 4) * 0.25 | 0);
            if (player) player.qi = Math.min(player.qiMax, player.qi + (f.isBoss ? 40 : 16));
            floaters.push({
                x: f.x, depth: f.depth, alt: f.alt, text: '+' + base, life: 1.2, vy: -90, color: '#7ee08a'
            });
            // 敌人掉落物
            if (f.ftype && Math.random() < f.ftype.dropChance) spawnDrop(f.x, f.depth, randomDrop());
            if (f.isBoss) {
                onBossDown();
            }
        }
    }

    function randomDrop() {
        const r = Math.random();
        if (r < 0.30) return 'food';
        if (r < 0.58) return 'soda';
        if (r < 0.74) return 'cash';
        if (r < 0.90) return 'beer';
        return 'life';
    }

    function onBossDown() {
        boss = null;
        bossBar = null;
        clearedCount++;
        flashScreen('#ffffff', 0.6);
        shake = Math.min(30, shake + 26);
        hitStop = 0.35;
        score += 3000;
        // 首领倒下会砸出掉落
        for (let i = 0; i < 4; i++) spawnDrop(foes[foes.length - 1].x + rand(-60, 60), 0.4 + i * 0.15, ['food', 'soda', 'cash', 'beer'][i]);
        if (mode === 'play') setMode('clear');
    }

    function onPlayerDeath() {
        if (mode !== 'play') return;
        lives--;
        if (lives <= 0) {
            setMode('gameover');
            if (score > bestScore) {
                bestScore = score;
                try { localStorage.setItem('street_brawl_best', String(bestScore)); } catch (e) { }
            }
        } else {
            setMode('dead');
        }
    }

    function nearestFoe(x) {
        let best = null, bd = Infinity;
        for (let i = 0; i < foes.length; i++) {
            const f = foes[i];
            if (f.dead || f.entering) continue;
            const d = Math.abs(f.x - x);
            if (d < bd) { bd = d; best = f; }
        }
        return best;
    }

    // 视线目标：让角色的眼睛看向对手
    function lookTargetX(f) {
        if (f.kind === 'player') {
            const t = nearestFoe(f.x);
            return t ? t.x : f.x + f.facing * FIG_H * 0.4;
        }
        return (player && !player.dead) ? player.x : f.x + f.facing * FIG_H * 0.4;
    }

    // 出招部位（拳/脚）打击特效
    const STRIKE = {
        jab: { r: 26, col: '#fff3c4', rays: 7 },
        kick: { r: 40, col: '#ffd966', rays: 10 },
        rise: { r: 46, col: '#ff9ff3', rays: 12 },
        dash: { r: 32, col: '#8ff0ff', rays: 8 },
        spin: { r: 52, col: '#a0ffe0', rays: 14 },
        wave: { r: 44, col: '#7ec8ff', rays: 10 }
    };

    function spawnStrikeFx(f, mv, wx, wy) {
        const cfg = STRIKE[mv.kind] || STRIKE.jab;
        const s = depthScale(f.depth);
        const x = wx, y = wy;
        impacts.push({
            x: x, y: y, dir: f.facing, t: 0, life: 0.30,
            r: cfg.r * FIG_K * s * 0.62, col: cfg.col, rays: cfg.rays,
            big: mv.kind !== 'jab', seed: Math.random() * Math.PI * 2
        });
        // 细碎火星沿出拳方向甩出
        const n = mv.kind === 'jab' ? 5 : 9;
        for (let i = 0; i < n; i++) {
            const a = rand(-0.9, 0.9);
            const spd = rand(70, 210) * (mv.kind === 'jab' ? 0.7 : 1.25);
            particles.push({
                x: x, y: y,
                vx: f.facing * Math.cos(a) * spd,
                vy: Math.sin(a) * spd * 0.8 - rand(20, 70),
                r: rand(1.8, mv.kind === 'jab' ? 3.8 : 5.4),
                life: rand(0.14, 0.30), max: 0.32,
                col: cfg.col, grav: 700
            });
        }
    }

    function updateImpacts(dt) {
        for (let i = impacts.length - 1; i >= 0; i--) {
            impacts[i].t += dt;
            if (impacts[i].t >= impacts[i].life) impacts.splice(i, 1);
        }
    }

    function drawImpacts() {
        for (let i = 0; i < impacts.length; i++) {
            const q = impacts[i];
            const p = q.t / q.life;
            const e = 1 - Math.pow(1 - p, 2.2);          // 快速弹出后缓慢消散
            const a = clamp(1 - p, 0, 1);
            const r = q.r * (0.42 + 0.85 * e);
            ctx.save();
            ctx.translate(q.x, q.y);
            ctx.globalCompositeOperation = 'lighter';
            ctx.lineCap = 'round';

            // 放射状冲击线
            ctx.strokeStyle = q.col;
            ctx.globalAlpha = a * 0.85;
            ctx.lineWidth = Math.max(1, q.r * 0.14 * a);
            for (let k = 0; k < q.rays; k++) {
                const ang = q.seed + (k / q.rays) * Math.PI * 2 + Math.sin(q.seed + k) * 0.16;
                const r0 = r * (0.55 + 0.18 * Math.sin(k * 2.3 + q.seed * 3));
                const r1 = r * (1.0 + (q.big ? 0.55 : 0.32));
                ctx.beginPath();
                ctx.moveTo(Math.cos(ang) * r0, Math.sin(ang) * r0);
                ctx.lineTo(Math.cos(ang) * r1, Math.sin(ang) * r1);
                ctx.stroke();
            }

            // 扩散冲击环
            ctx.globalAlpha = a * (q.big ? 0.9 : 0.75);
            ctx.strokeStyle = q.col;
            ctx.lineWidth = Math.max(1, q.r * 0.18 * a);
            ctx.beginPath();
            ctx.ellipse(0, 0, r * 0.92, r * (q.big ? 0.86 : 0.92), 0, 0, Math.PI * 2);
            ctx.stroke();

            // 拳/脚前方的弧形残影
            ctx.globalAlpha = a * 0.5;
            ctx.lineWidth = Math.max(1, q.r * 0.30 * a);
            ctx.strokeStyle = q.col;
            ctx.beginPath();
            ctx.arc(-q.dir * r * 0.18, 0, r * 0.78, -1.15, 1.15, q.dir < 0);
            ctx.stroke();

            // 中心闪点
            ctx.globalAlpha = Math.pow(a, 2);
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.30 * a + 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
    }

    function spawnHitSpark(x, y, kind) {
        const n = kind === 'rise' ? 16 : (kind === 'kick' ? 12 : 7);
        for (let i = 0; i < n; i++) {
            const ang = Math.random() * Math.PI * 2;
            const spd = rand(60, kind === 'rise' ? 300 : 210);
            particles.push({
                x: x, y: y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd * 0.7 - rand(20, 90),
                r: rand(2.5, kind === 'rise' ? 7 : 5.5), life: rand(0.22, 0.5), max: 0.5,
                col: kind === 'rise' ? '#ff9ff3' : (kind === 'kick' ? '#ffd966' : '#fff3c4'),
                grav: 900
            });
        }
    }

    // ==================== 移动与跳跃 ====================
    // 步幅：随水平速度增长，纵向游走/近身小步时收紧，避免原地跨大步
    function walkStride(f) {
        const h = FIG_H * depthScale(f.depth) * (f.style.height || 1);
        const hFrac = clamp(Math.abs(f.vx) / (MOVE_X * 0.30), 0, 1);
        return h * 0.108 * (0.42 + 0.58 * hFrac);
    }

    // 步频：脚在支撑期是相对身体往后撤的，撤的总量 = 2 × 步幅；
    // 同一段时间身体往前走了 v·π/rate。两者相等时脚正好"钉在地上"不滑，
    // 解出的物理匹配步频就是 π·v/(2·步幅)。这里让播放速度按 WALK_MATCH 的比例朝它靠拢：
    // 走得越快，腿摆得越快，脚与地面的关系越贴合；全额匹配在满速下步频过高，故只取一部分。
    function walkRate(f) {
        const spd = Math.abs(f.vx);
        const phys = Math.PI * spd / (2 * Math.max(walkStride(f), 1));
        return WALK_RATE * (1 - WALK_MATCH) + phys * WALK_MATCH;
    }

    function tryJump(f) {
        if (f.dead || f.airborne || f.hurtT > 0 || f.atk) return;
        f.airborne = true;
        f.vy = -JUMP_V;
        f.jumpCut = false;
        f.jumpAge = 0;
        sfxJump();
    }

    function updateMotion(f, dt) {
        // 水平
        f.x += f.vx * dt;
        if (!f.airborne) f.vx *= Math.pow(0.0006, dt);
        // 入场阶段允许停留在画面外，其余情况限制在舞台内
        if (!f.entering) {
            if (f.x < STAGE_L) { f.x = STAGE_L; if (f.vx < 0) f.vx = 0; }
            if (f.x > STAGE_R) { f.x = STAGE_R; if (f.vx > 0) f.vx = 0; }
            resolvePropSolid(f);
        }

        // 纵深
        f.depth += f.vDepth * dt;
        if (f.depth < DEPTH_MIN) { f.depth = DEPTH_MIN; if (f.vDepth < 0) f.vDepth = 0; }
        if (f.depth > DEPTH_MAX) { f.depth = DEPTH_MAX; if (f.vDepth > 0) f.vDepth = 0; }

        // 垂直（可变跳跃高度）
        if (f.airborne) {
            f.jumpAge += dt;
            const rising = f.vy < 0;
            if (rising && !f.jumpHeld && f.jumpAge > 0.05) f.jumpCut = true;
            const thrusting = rising && !f.jumpCut && f.alt < JUMP_MAX;
            if (thrusting) {
                f.alt += -f.vy * dt - 0.5 * HOLD_GRAVITY * dt * dt;
                f.vy += HOLD_GRAVITY * dt;
            } else {
                if (rising && f.jumpCut) {
                    f.vy *= Math.exp(-RELEASE_DECAY * dt);
                    if (f.vy > -1) f.vy = 0;
                }
                f.alt += -f.vy * dt - 0.5 * GRAVITY * dt * dt;
                f.vy += GRAVITY * dt;
            }
            if (f.alt <= 0) {
                const hard = f.vy > 900;
                f.alt = 0; f.vy = 0; f.airborne = false;
                f.jumpCut = false; f.jumpAge = 0;
                f.squash = hard ? 1 : 0.5;
                f.landT = LAND_T * (hard ? 1 : 0.85);   // 落地缓冲动作
                sfxLand();
            }
        } else {
            f.alt = 0;
            f.vy = 0;
            if (f.squash > 0) f.squash -= dt * 4;
            if (f.landT > 0) f.landT -= dt;
        }

        if (f.hurtT > 0) f.hurtT -= dt;
        if (f.invuln > 0) f.invuln -= dt;
        if (f.flash > 0) f.flash -= dt;
        if (f.stunT > 0) f.stunT -= dt;
        if (f.wetT > 0) f.wetT -= dt;
        if (f.rageT > 0) { f.rageT -= dt; if (f.rageT <= 0) f.dmgMul = 1; }
        f.bob += dt;
    }

    // ==================== 场景道具 ====================
    // 实心道具（集装箱等）会挡住人物：同一纵深带内把身体推出道具两侧
    function resolvePropSolid(f) {
        for (let i = 0; i < props.length; i++) {
            const p = props[i];
            if (p.dead || !p.cfg.solid) continue;
            if (Math.abs(p.depth - f.depth) > 0.30) continue;
            const half = p.cfg.w * 0.5 * depthScale(p.depth) + FIG_H * 0.18 * depthScale(f.depth);
            const dx = f.x - p.x;
            if (dx > -half && dx < half) {
                const s = dx >= 0 ? 1 : -1;
                f.x = p.x + s * half;
                if (f.vx * s < 0) f.vx = 0;
            }
        }
    }

    // 攻击判定同样作用于场景道具
    function tryHitProps(f, mv) {
        if (!mv.propPower) return;
        if (!f.hitProps) f.hitProps = [];
        const sAtt = depthScale(f.depth);
        const attGroundY = depthY(f.depth);
        const hitY = attGroundY - f.alt - FIG_H * sAtt * mv.hy;
        const strikeTop = hitY - FIG_H * sAtt * 0.30;
        const strikeBot = f.airborne ? attGroundY + FIG_H * sAtt * 0.06 : hitY + FIG_H * sAtt * 0.10;
        for (let i = 0; i < props.length; i++) {
            const p = props[i];
            if (p.dead || f.hitProps.indexOf(p) >= 0) continue;
            const sp = depthScale(p.depth);
            const top = depthY(p.depth) - p.cfg.h * sp;
            const bot = depthY(p.depth) + 6 * sp;
            if (strikeBot < top || strikeTop > bot) continue;
            const dx = p.x - f.x;
            if (Math.abs(dx) > mv.range + p.cfg.w * 0.5 * sp) continue;
            if (dx * f.facing <= -p.cfg.w * 0.2) continue;
            f.hitProps.push(p);
            damageProp(p, mv.propPower, f);
        }
    }

    function damageProp(p, power, by) {
        p.hp -= power;
        p.flash = 0.12;
        sfxPropHit();
        if (p.hp <= 0) breakProp(p, by);
    }

    function breakProp(p, by) {
        if (p.dead) return;
        p.dead = true;
        p.gone = true;
        const cfg = p.cfg;
        const sp = depthScale(p.depth);
        const baseY = depthY(p.depth);
        sfxBreak();
        shake = Math.min(20, shake + 4);
        for (let i = 0; i < 16; i++) {
            particles.push({
                x: p.x + rand(-cfg.w * 0.4, cfg.w * 0.4) * sp,
                y: baseY - rand(0, cfg.h) * sp,
                vx: rand(-260, 260), vy: rand(-380, -40),
                r: rand(2, 6), life: rand(0.3, 0.7), max: 0.7,
                col: cfg.col2, grav: 1300
            });
        }
        if (cfg.score) score += cfg.score;
        // 掉落
        const drop = Array.isArray(cfg.drop) ? cfg.drop[Math.floor(Math.random() * cfg.drop.length)] : cfg.drop;
        if (drop) spawnDrop(p.x, p.depth, drop);
        // 特殊效果
        if (cfg.boom) areaBurst(p.x, p.depth, cfg.boom.r, cfg.boom.dmg, '#ff9f43', by);
        if (cfg.shock) areaStun(p.x, p.depth, cfg.shock.r, cfg.shock.dmg, cfg.shock.stun, cfg.rim, by);
        if (cfg.soak) areaStun(p.x, p.depth, cfg.soak.r, cfg.soak.dmg, cfg.soak.stun, '#5ad1ff', by);
        if (cfg.flop) {
            shots.push({
                x: p.x, y: baseY - cfg.h * sp * 0.5,
                vx: (by ? Math.sign(by.x - p.x) || 1 : 1) * cfg.flop.spd,
                depth: p.depth, alt: 0, r: cfg.w * 0.4 * sp, life: 1.4, max: 1.4,
                col: cfg.rim, dmg: cfg.flop.dmg, kbx: 420, lift: 130,
                owner: by || p, kind: 'prop', t: 0, hitIds: [], spin: true, isFlop: true
            });
            sfxFlop();
        }
        if (!cfg.solid) {
            rings.push({
                x: p.x, depth: p.depth, vx: 0, r: 10, max: 90, life: 0.4, maxLife: 0.4,
                owner: by, hitIds: [], dmg: 0, kbx: 0, lift: 0, col: cfg.rim
            });
        }
    }

    // 范围爆发：不分敌我，玩家自己站太近也会吃伤害
    function areaBurst(x, depth, radius, dmg, col, by) {
        rings.push({
            x: x, depth: depth, vx: 0, r: 20, max: radius, life: 0.55, maxLife: 0.55,
            owner: by, hitIds: [], dmg: dmg, kbx: 480, lift: 180, col: col, boom: true
        });
        const cy = depthY(depth) - 70;
        for (let i = 0; i < 26; i++) {
            const a = Math.random() * Math.PI * 2;
            const sp = rand(120, 420);
            particles.push({
                x: x, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.6 - 80,
                r: rand(3, 9), life: rand(0.25, 0.6), max: 0.6, col: col, grav: 900
            });
        }
        shake = Math.min(26, shake + 16);
        flashScreen(col, 0.22);
        sfxBoom();
    }

    // 范围异常状态：让范围内的敌人麻痹/湿滑（只对敌人生效，视觉上区分开）
    function areaStun(x, depth, radius, dmg, stunT, col, by) {
        rings.push({
            x: x, depth: depth, vx: 0, r: 16, max: radius, life: 0.6, maxLife: 0.6,
            owner: by, hitIds: [], dmg: dmg, kbx: 0, lift: 0, col: col, stun: stunT
        });
        const cy = depthY(depth) - 70;
        for (let i = 0; i < 18; i++) {
            const a = Math.random() * Math.PI * 2;
            particles.push({
                x: x + Math.cos(a) * rand(0, 40), y: cy + Math.sin(a) * rand(0, 60),
                vx: Math.cos(a) * rand(40, 180), vy: Math.sin(a) * rand(40, 180),
                r: rand(2, 5), life: rand(0.2, 0.5), max: 0.5, col: col, grav: 60
            });
        }
        shake = Math.min(20, shake + 9);
        sfxShock();
    }

    function stunFoes(x, depth, radius, stunT) {
        for (let i = 0; i < foes.length; i++) {
            const f = foes[i];
            if (f.dead || f.entering) continue;
            if (Math.abs(f.x - x) > radius) continue;
            if (Math.abs(f.depth - depth) > 0.55) continue;
            f.stunT = Math.max(f.stunT, stunT);
            f.atk = null; f.atkT = 0;
            if (atkToken === f) atkToken = null;
            floaters.push({ x: f.x, depth: f.depth, alt: f.alt, text: '麻痹', life: 0.8, vy: -50, color: '#7ec8ff' });
        }
    }

    function updateProps(dt) {
        for (let i = 0; i < props.length; i++) {
            const p = props[i];
            if (p.flash > 0) p.flash -= dt;
            p.t += dt;
        }
    }

    // ==================== 掉落物 ====================
    function spawnDrop(x, depth, type) {
        if (!ITEMS[type]) type = 'cash';
        drops.push({
            type: type, cfg: ITEMS[type], x: x, depth: clamp(depth, DEPTH_MIN, DEPTH_MAX),
            alt: 46, vy: -120, t: rand(0, 6.28), life: 26, ground: false, bob: 0
        });
    }

    function updateDrops(dt) {
        for (let i = drops.length - 1; i >= 0; i--) {
            const d = drops[i];
            d.life -= dt;
            if (d.life <= 0) { drops.splice(i, 1); continue; }
            d.t += dt;
            if (!d.ground) {
                d.alt += d.vy * dt;
                d.vy += 1500 * dt;
                if (d.alt <= 0) { d.alt = 0; d.ground = true; d.bob = 0; }
            } else {
                d.bob = Math.sin(d.t * 4) * 5;
            }
            if (d.x < STAGE_L + 10) d.x = STAGE_L + 10;
            if (d.x > STAGE_R - 10) d.x = STAGE_R - 10;
            // 玩家拾取
            if (player && !player.dead) {
                const dx = d.x - player.x;
                if (Math.abs(dx) < FIG_H * 0.34 && Math.abs(d.depth - player.depth) < 0.20) {
                    collectDrop(d);
                    drops.splice(i, 1);
                }
            }
        }
    }

    function collectDrop(d) {
        const cfg = d.cfg;
        const p = player;
        if (d.type === 'life') {
            lives++;
            floaters.push({ x: p.x, depth: p.depth, alt: p.alt, text: '1UP 残机 +1', life: 1.4, vy: -80, color: '#ff8fa3' });
            sfxLife();
            return;
        }
        if (cfg.heal) {
            const before = p.hp;
            p.hp = Math.min(p.maxHp, p.hp + cfg.heal);
            const real = Math.round(p.hp - before);
            if (real > 0) floaters.push({ x: p.x, depth: p.depth, alt: p.alt, text: '+' + real, life: 1.0, vy: -80, color: '#9bf6b0' });
            sfxPickup();
        }
        if (cfg.qi) {
            p.qi = Math.min(p.qiMax, p.qi + cfg.qi);
            floaters.push({ x: p.x, depth: p.depth, alt: p.alt, text: '气 +' + cfg.qi, life: 1.0, vy: -80, color: '#7ec8ff' });
        }
        if (cfg.rage) {
            p.rageT = Math.max(p.rageT, cfg.rage);
            p.dmgMul = 1.35;
            floaters.push({ x: p.x, depth: p.depth, alt: p.alt, text: '狂暴!', life: 1.2, vy: -80, color: '#ffb74d' });
        }
        if (cfg.score) {
            const gain = cfg.score * (1 + Math.floor(combo / 5));
            score += gain;
            floaters.push({ x: p.x, depth: p.depth, alt: p.alt, text: '+' + gain, life: 1.0, vy: -60, color: '#ffd966' });
        }
        sfxPickup();
    }

    // ==================== 投射物 / 冲击环 ====================
    function updateShots(dt) {
        for (let i = shots.length - 1; i >= 0; i--) {
            const s = shots[i];
            s.t += dt;
            s.life -= dt;
            if (s.life <= 0 || s.x < -80 || s.x > W + 80) { shots.splice(i, 1); continue; }
            const scale = depthScale(s.depth);
            s.x += s.vx * dt;
            const targetList = s.kind === 'player' ? foes : (s.kind === 'prop' ? foes : [player]);
            for (let j = 0; j < targetList.length; j++) {
                const t = targetList[j];
                if (!t || t.dead || t.entering) continue;
                if (s.hitIds.indexOf(t) >= 0) continue;
                if (Math.abs(t.x - s.x) > s.r * scale + FIG_H * 0.30) continue;
                if (Math.abs(t.depth - s.depth) > 0.20) continue;
                s.hitIds.push(t);
                applyHit(t, { dmg: s.dmg, kbx: s.kbx, lift: s.lift, kind: 'jab', inv: 0.16 }, s.vx > 0 ? 1 : -1, 1);
                if (!s.pierce) { burstAt(s.x, s.y, s.col); shots.splice(i, 1); break; }
            }
        }
        for (let i = rings.length - 1; i >= 0; i--) {
            const g = rings[i];
            g.life -= dt;
            if (g.life <= 0) { rings.splice(i, 1); continue; }
            g.r = g.max * (1 - Math.pow(g.life / g.maxLife, 1.8));
            g.x += g.vx * dt;
            const list = g.owner && g.owner.kind === 'player' ? foes : [player];
            for (let j = 0; j < list.length; j++) {
                const t = list[j];
                if (!t || t.dead || t.entering) continue;
                if (g.hitIds.indexOf(t) >= 0) continue;
                if (Math.abs(t.x - g.x) > g.r + FIG_H * 0.2) continue;
                if (Math.abs(t.depth - g.depth) > 0.34) continue;
                g.hitIds.push(t);
                if (g.stun) {
                    if (t.kind !== 'player') {
                        t.stunT = Math.max(t.stunT, g.stun);
                        t.wetT = Math.max(t.wetT, g.stun * 0.6);
                        if (t.atk) { t.atk = null; t.atkT = 0; }
                        if (atkToken === t) atkToken = null;
                    }
                }
                if (g.dmg > 0) applyHit(t, { dmg: g.dmg, kbx: g.kbx, lift: g.lift, kind: g.boom ? 'rise' : 'kick' }, g.vx > 0 ? 1 : -1, 1);
            }
            if (g.stun && g.r > g.max * 0.6) stunFoes(g.x, g.depth, g.max, g.stun);
        }
    }

    function burstAt(x, y, col) {
        for (let i = 0; i < 12; i++) {
            const a = Math.random() * Math.PI * 2;
            const sp = rand(80, 280);
            particles.push({
                x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.7,
                r: rand(2, 5), life: rand(0.15, 0.35), max: 0.35, col: col, grav: 500
            });
        }
    }

    function faceByInput(f, dx, dDepth) {
        if (Math.abs(dx) > 0.01) f.facing = dx > 0 ? 1 : -1;
        else if (Math.abs(dDepth) > 0.01 && f.kind === 'player') f.facing = 1;
    }

    // ==================== 玩家输入 ====================
    const touchStates = new Map();
    let touchLeft = false, touchRight = false, touchUp = false, touchDown = false;
    let touchJump = false, touchPunch = false, touchKick = false, touchRise = false;
    let touchDash = false, touchSpin = false, touchWave = false;
    let touchUsed = false;

    // 左半屏十字键 + 右半屏六键（与街机按键布局一致）
    function touchActionFromPoint(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) return null;
        const lx = (clientX - rect.left) * (W / rect.width);
        const ly = (clientY - rect.top) * (H / rect.height);
        if (lx < 0 || lx >= W || ly < 0 || ly >= H) return null;
        if (lx < W * 0.5) {
            if (ly > H * 0.58) return lx < W * 0.25 ? 'left' : 'right';
            return lx < W * 0.25 ? 'up' : 'down';
        }
        const ry = ly / H;
        const leftSide = lx < W * 0.75;
        if (ry > 0.74) return 'jump';
        if (ry > 0.46) return leftSide ? 'punch' : 'kick';
        if (ry > 0.20) return leftSide ? 'dash' : 'spin';
        return leftSide ? 'wave' : 'rise';
    }

    function refreshTouchFlags() {
        touchLeft = touchRight = touchUp = touchDown = false;
        touchJump = touchPunch = touchKick = touchRise = false;
        touchDash = touchSpin = touchWave = false;
        for (const s of touchStates.values()) {
            const a = s.action;
            if (a === 'left') touchLeft = true;
            else if (a === 'right') touchRight = true;
            else if (a === 'up') touchUp = true;
            else if (a === 'down') touchDown = true;
            else if (a === 'jump') touchJump = true;
            else if (a === 'punch') touchPunch = true;
            else if (a === 'kick') touchKick = true;
            else if (a === 'rise') touchRise = true;
            else if (a === 'dash') touchDash = true;
            else if (a === 'spin') touchSpin = true;
            else if (a === 'wave') touchWave = true;
        }
    }

    function touchAttack(name) {
        if (mode !== 'play' || !player || player.dead) return;
        startAttack(player, name);
    }

    canvas.addEventListener('touchstart', (e) => {
        let consumed = false;
        ensureAudio();
        for (let i = 0; i < e.changedTouches.length; i++) {
            const t = e.changedTouches[i];
            const a = touchActionFromPoint(t.clientX, t.clientY);
            if (!a) continue;
            consumed = true;
            touchUsed = true;
            touchStates.set(t.identifier, { action: a });
            if (a === 'jump') { if (mode === 'play') tryJump(player); confirmPressed.ok = true; }
            else if (a === 'punch') touchAttack('punch');
            else if (a === 'kick') touchAttack('kick');
            else if (a === 'rise') touchAttack('rise');
            else if (a === 'dash') touchAttack('dash');
            else if (a === 'spin') touchAttack('spin');
            else if (a === 'wave') touchAttack('wave');
        }
        if (consumed) { e.preventDefault(); refreshTouchFlags(); }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
        let changed = false;
        for (let i = 0; i < e.changedTouches.length; i++) {
            const t = e.changedTouches[i];
            if (!touchStates.has(t.identifier)) continue;
            const a = touchActionFromPoint(t.clientX, t.clientY);
            if (!a) continue;
            const prev = touchStates.get(t.identifier);
            if (prev.action !== a) { prev.action = a; changed = true; }
        }
        if (changed) { e.preventDefault(); refreshTouchFlags(); }
    }, { passive: false });

    function onTouchEnd(e) {
        let changed = false;
        for (let i = 0; i < e.changedTouches.length; i++) {
            const t = e.changedTouches[i];
            if (touchStates.has(t.identifier)) { touchStates.delete(t.identifier); changed = true; }
        }
        if (changed) { e.preventDefault(); refreshTouchFlags(); }
    }
    canvas.addEventListener('touchend', onTouchEnd, { passive: false });
    canvas.addEventListener('touchcancel', onTouchEnd, { passive: false });

    window.addEventListener('keydown', (e) => {
        const c = e.code;
        if (c === 'ArrowLeft' || c === 'ArrowRight' || c === 'ArrowUp' || c === 'ArrowDown') e.preventDefault();
        if (c === 'Space' && mode !== 'play') e.preventDefault();
        ensureAudio();
        keys[c] = true;
        if (!e.repeat) {
            if (c in keyPressed) keyPressed[c] = true;
            if (c === 'ArrowUp' || c === 'KeyW') confirmPressed.up = true;
            if (c === 'ArrowDown' || c === 'KeyS') confirmPressed.down = true;
            if (c === 'Enter' || c === 'Space' || c === 'KeyK') confirmPressed.ok = true;
            if (c === 'Escape') pauseKey = true;
        }
    });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    const kLeft = () => !!(keys['ArrowLeft'] || keys['KeyA']);
    const kRight = () => !!(keys['ArrowRight'] || keys['KeyD']);
    const kUp = () => !!(keys['ArrowUp'] || keys['KeyW']);
    const kDown = () => !!(keys['ArrowDown'] || keys['KeyS']);
    const kJump = () => !!keys['KeyK'];

    // ==================== 手柄 ====================
    let padIndex = -1, padConnected = false;
    let padL = false, padR = false, padU = false, padD = false;
let padA = false, padX = false, padY = false, padB = false, padStart = false;
    let padLB = false, padRB = false, padLT = false, padRT = false;
    let prevA = false, prevX = false, prevY = false, prevB = false, prevStart = false;
    let prevLB = false, prevRB = false, prevLT = false, prevRT = false;
    let prevU = false, prevD = false;

    function pollGamepad() {
        const pads = navigator.getGamepads ? navigator.getGamepads() : [];
        let gp = null;
        for (let i = 0; i < pads.length; i++) {
            if (pads[i] && pads[i].connected) { gp = pads[i]; padIndex = i; break; }
        }
        if (gp && !padConnected) padConnected = true;
        if (!gp) {
            padL = padR = padU = padD = padA = padX = padY = padB = padStart = false;
            padLB = padRB = padLT = padRT = false;
            prevA = prevX = prevY = prevB = prevStart = false;
            prevLB = prevRB = prevLT = prevRT = false;
            prevU = prevD = false;
            padConnected = false;
            return;
        }
        const b = gp.buttons;
        const on = (i) => !!(b[i] && (b[i].pressed || b[i].value > 0.5));
        // 十字键：12 上 / 13 下 / 14 左 / 15 右
        padU = on(12); padD = on(13); padL = on(14); padR = on(15);
        if (gp.axes && gp.axes.length > 0) {
            if (gp.axes[0] < -0.5) padL = true;
            if (gp.axes[0] > 0.5) padR = true;
            if (gp.axes[1] < -0.5) padU = true;
            if (gp.axes[1] > 0.5) padD = true;
        }
        const a = on(0), x = on(2), y = on(3), bk = on(1), st = on(9);
        padLB = on(4); padRB = on(5); padLT = on(6); padRT = on(7);
        padA = a; padX = x; padB = bk; padY = y; padStart = st;
        if (padU && !prevU) confirmPressed.up = true;
        if (padD && !prevD) confirmPressed.down = true;
        if (st && !prevStart) { confirmPressed.ok = true; pauseKey = true; }
        if (a && !prevA && mode === 'play' && player && !player.dead) tryJump(player);
        if (x && !prevX) padAttack('punch');
        if (bk && !prevB) padAttack('kick');
        if (y && !prevY) padAttack('rise');
        if (padLB && !prevLB) padAttack('dash');
        if (padRB && !prevRB) padAttack('wave');
        if (padLT && !prevLT) padAttack('spin');
        if (padRT && !prevRT) padAttack('spin');
        prevA = a; prevX = x; prevB = bk; prevY = y; prevStart = st;
        prevLB = padLB; prevRB = padRB; prevLT = padLT; prevRT = padRT;
        prevU = padU; prevD = padD;
    }

    function padAttack(name) {
        if (mode !== 'play' || !player || player.dead) return;
        startAttack(player, name);
    }

    window.addEventListener('blur', () => {
        for (const k in keys) keys[k] = false;
        for (const k in keyPressed) keyPressed[k] = false;
        touchStates.clear();
        confirmPressed.up = confirmPressed.down = confirmPressed.ok = false;
        pauseKey = false;
        refreshTouchFlags();
    });

    // ==================== 更新 ====================
    function clearPress() {
        for (const k in keyPressed) keyPressed[k] = false;
    }

    function updatePlayer(dt) {
        const p = player;
        if (p.dead || p.stunT > 0) {
            clearPress();
            p.vx *= Math.pow(0.05, dt);
            updateMotion(p, dt);
            return;
        }

        const kx = (kRight() || padR || touchRight ? 1 : 0) - (kLeft() || padL || touchLeft ? 1 : 0);
        // 纵深：depth 越大画面越靠上，因此“上”为正
        const ky = (kUp() || padU || touchUp ? 1 : 0) - (kDown() || padD || touchDown ? 1 : 0);

        p.jumpHeld = kJump() || padA || touchJump;

        const canAct = p.hurtT <= 0 && !p.atk;
        if (canAct) {
            p.vx += kx * PLAYER_SPEED * dt * 14;
            const mx = PLAYER_SPEED;
            if (p.vx > mx) p.vx = mx;
            if (p.vx < -mx) p.vx = -mx;
            if (kx === 0) p.vx *= Math.pow(0.0009, dt);
            p.vDepth += ky * MOVE_DEPTH * dt * 14;
            if (p.vDepth > MOVE_DEPTH) p.vDepth = MOVE_DEPTH;
            if (p.vDepth < -MOVE_DEPTH) p.vDepth = -MOVE_DEPTH;
            if (ky === 0) p.vDepth *= Math.pow(0.0009, dt);
            if (kx !== 0) p.facing = kx > 0 ? 1 : -1;
            if (Math.abs(p.vx) > 20) p.walkPhase += dt * walkRate(p);
            else if (Math.abs(p.vDepth) > 0.05) p.walkPhase += dt * 9;
            if (Math.abs(p.vDepth) > 0.05) p.depthPhase += dt * 8;
        } else {
            p.vx *= Math.pow(0.02, dt);
            p.vDepth *= Math.pow(0.02, dt);
        }

        // 攻击：键盘用按下沿触发（按住不连发），手柄/触屏本身已是沿触发
        if (keyPressed['KeyJ'] || padX || touchPunch) startAttack(p, 'punch');
        if (keyPressed['KeyL'] || padB || touchKick) startAttack(p, 'kick');
        if (keyPressed['KeyI'] || padY || touchRise) startAttack(p, 'rise');
        if (keyPressed['KeyU'] || touchDash) startAttack(p, 'dash');
        if (keyPressed['KeyO'] || touchSpin) startAttack(p, 'spin');
        if (keyPressed['KeyP'] || touchWave) startAttack(p, 'wave');
        if (keyPressed['KeyK'] && !p.airborne) tryJump(p);
        clearPress();

        for (const key in p.cooldowns) {
            if (p.cooldowns[key] > 0) p.cooldowns[key] -= dt;
        }

        updateMotion(p, dt);
        updateAttack(p, dt);
    }

    function updateDeadBody(f, dt) {
        if (f.landed) return;
        f.vx = 0;
        f.vDepth = 0;
        updateMotion(f, dt);
        if (!f.airborne && f.alt <= 0) { f.alt = 0; f.vy = 0; f.landed = true; }
    }

    function updateFoe(f, dt) {
        if (f.dead) {
            // 倒地后彻底静止：只在尚未落地时走完空中抛物线，尸体不消失也不再刷新新敌人
            f.koT += dt;
            updateDeadBody(f, dt);
            return;
        }

        // 入场：从画面外走向指定位置，入场期间不参与战斗
        if (f.entering) {
            const dx = f.enterX - f.x;
            const dir = dx > 0 ? 1 : -1;
            f.facing = dir;
            const cap = MOVE_X * 0.62;
            f.vx += dir * MOVE_X * 9 * dt;
            if (f.vx > cap) f.vx = cap;
            if (f.vx < -cap) f.vx = -cap;
            f.vDepth *= Math.pow(0.02, dt);
            f.walkPhase += dt * 10;
            updateMotion(f, dt);
            if (Math.abs(f.enterX - f.x) < 8) {
                f.entering = false;
                f.vx = 0;
                f.facing = (player && !player.dead) ? (player.x >= f.x ? 1 : -1) : 1;
                f.aiTimer = rand(AI.reactMin, AI.reactMax);
            }
            return;
        }

        const p = player;
        f.jumpHeld = false;
        for (const key in f.cooldowns) if (f.cooldowns[key] > 0) f.cooldowns[key] -= dt;

        if (p.dead || mode !== 'play') {
            f.vx *= Math.pow(0.05, dt);
            f.vDepth *= Math.pow(0.05, dt);
            updateMotion(f, dt);
            return;
        }

        // 被场景道具命中后原地抽搐，无法行动
        if (f.stunT > 0) {
            f.vx *= Math.pow(0.02, dt);
            f.vDepth *= Math.pow(0.02, dt);
            updateMotion(f, dt);
            if (Math.random() < dt * 14) {
                const cy = depthY(f.depth) - f.alt - FIG_H * depthScale(f.depth) * rand(0.2, 0.9);
                particles.push({
                    x: f.x + rand(-24, 24), y: cy, vx: rand(-40, 40), vy: rand(-70, 20),
                    r: rand(2, 4), life: rand(0.12, 0.28), max: 0.28, col: '#7ec8ff', grav: 300
                });
            }
            return;
        }

        if (f.isBoss) { updateBossAI(f, dt); return; }

        const dx = p.x - f.x;
        const dd = p.depth - f.depth;
        const adx = Math.abs(dx);
        const add = Math.abs(dd);
        const reach = MOVES.punch.range;
        const spd = f.ftype ? f.ftype.speed : 1;

        f.aiTimer -= dt;

        if (f.hurtT <= 0 && !f.atk && f.invuln <= 0) {
            if (f.aiMode === 'approach') {
                // 先对齐水平线，再靠近
                if (add > 0.06) {
                    const dir = dd > 0 ? 1 : -1;
                    f.vDepth += dir * MOVE_DEPTH * 9 * AI.speedMul * spd * dt;
                    if (Math.abs(f.vDepth) > MOVE_DEPTH * AI.speedMul * spd) f.vDepth = MOVE_DEPTH * AI.speedMul * spd * dir;
                    // 纵向移动同样要迈步，否则腿会僵在某个中间姿势上跟着身体上下滑
                    f.vx *= Math.pow(0.02, dt);
                    if (Math.abs(f.vx) > 20) f.walkPhase += dt * walkRate(f);
                    else if (Math.abs(f.vDepth) > 0.05) f.walkPhase += dt * 9;
                } else if (adx > reach * 0.72) {
                    const dir = dx > 0 ? 1 : -1;
                    const cap = MOVE_X * 0.72 * AI.speedMul * spd;
                    f.vx += dir * MOVE_X * 9 * AI.speedMul * spd * dt;
                    if (f.vx > cap) f.vx = cap;
                    if (f.vx < -cap) f.vx = -cap;
                    if (Math.abs(f.vDepth) > 0.05) f.vDepth *= Math.pow(0.02, dt);
                    f.walkPhase += dt * walkRate(f);
                } else {
                    f.vx *= Math.pow(0.02, dt);
                    f.vDepth *= Math.pow(0.02, dt);
                    if (f.aiTimer <= 0) {
                        // 同一水平线且够得着 -> 有概率出招
                        const aggro = f.ftype ? f.ftype.aggro : AI.attackChance;
                        if (add <= 0.24 && Math.random() < aggro) {
                            const pool = f.ftype ? f.ftype.moves : ['punch', 'kick', 'rise'];
                            // 只从冷却已好的招式里挑
                            const ready = pool.filter(m => !f.cooldowns[m]);
                            const pick = ready.length ? ready[Math.floor(Math.random() * ready.length)] : pool[0];
                            startAttack(f, pick);
                            f.facing = dx >= 0 ? 1 : -1;
                        }
                        f.aiMode = Math.random() < AI.strafeChance ? 'strafe' : 'approach';
                        f.aiTimer = f.aiMode === 'strafe' ? rand(AI.strafeMin, AI.strafeMax) : rand(AI.reactMin, AI.reactMax);
                        f.aiStrafeDir = Math.random() < 0.5 ? -1 : 1;
                    }
                }
            } else if (f.aiMode === 'strafe') {
                const cap = MOVE_X * 0.72 * AI.speedMul * spd;
                f.vx += f.aiStrafeDir * MOVE_X * 5 * AI.speedMul * spd * dt;
                // 不封顶会一路加速成滑步，封顶后速度可控
                if (f.vx > cap) f.vx = cap;
                if (f.vx < -cap) f.vx = -cap;
                f.vDepth += (Math.random() - 0.5) * MOVE_DEPTH * 3 * AI.speedMul * dt;
                f.vDepth = clamp(f.vDepth, -MOVE_DEPTH * 0.7, MOVE_DEPTH * 0.7);
                // 步频跟随速度，避免身子在滑、腿在原地倒腾
                if (Math.abs(f.vx) > 20) f.walkPhase += dt * walkRate(f) * clamp(Math.abs(f.vx) / cap, 0.40, 1);
                else if (Math.abs(f.vDepth) > 0.05) f.walkPhase += dt * 6;
                f.depthPhase += dt * 6;
                if (f.aiTimer <= 0) {
                    f.aiMode = 'approach';
                    f.aiTimer = rand(AI.reactMin, AI.reactMax);
                }
            }
            if (Math.abs(f.vx) > 20) f.facing = f.vx > 0 ? 1 : -1;
        } else {
            f.vx *= Math.pow(0.05, dt);
            f.vDepth *= Math.pow(0.05, dt);
        }

        // 待机时偶尔跳一下
        if (!f.atk && f.hurtT <= 0 && f.invuln <= 0 && !f.airborne && Math.random() < dt * AI.jumpChance) tryJump(f);

        updateMotion(f, dt);
        updateAttack(f, dt);
    }

    // ==================== Boss AI ====================
    // 招式循环 + 起手预警（身上冒红光）+ 血量阶段变化
    function updateBossAI(f, dt) {
        const p = player;
        const bd = curLevel().boss;
        const dx = p.x - f.x;
        const dd = p.depth - f.depth;
        const adx = Math.abs(dx);
        const add = Math.abs(dd);
        const rage = f.phase >= 2;

        // 阶段推进：掉血后进入更凶的招式表
        const ratio = f.hp / f.maxHp;
        const wantPhase = ratio < 0.30 ? 2 : (ratio < 0.62 ? 1 : 0);
        if (wantPhase > f.phase) {
            f.phase = wantPhase;
            f.atk = null; f.atkT = 0; f.telegraph = 0;
            f.aiTimer = 1.0;
            f.invuln = Math.max(f.invuln, 1.0);
            f.stunT = 0;
            showBanner(wantPhase === 1 ? '暴怒！' : '极限状态！', f.name + ' 加快了攻击', 1.5);
            flashScreen('#ff4d6a', 0.3);
            shake = Math.min(26, shake + 16);
            sfxBoss();
            for (let i = 0; i < 24; i++) {
                particles.push({
                    x: f.x + rand(-60, 60), y: depthY(f.depth) - rand(20, 200),
                    vx: rand(-180, 180), vy: rand(-260, 20), r: rand(3, 7),
                    life: rand(0.3, 0.6), max: 0.6, col: '#ff6b6b', grav: 500
                });
            }
            updateMotion(f, dt);
            return;
        }

        f.aiTimer -= dt;
        // 预警计时：给玩家反应时间后立刻出招
        if (f.telegraph > 0) {
            f.telegraph -= dt;
            f.vx *= Math.pow(0.02, dt);
            f.vDepth *= Math.pow(0.02, dt);
            if (f.telegraph <= 0) {
                startAttack(f, f.nextMove);
                f.facing = dx >= 0 ? 1 : -1;
            }
            updateMotion(f, dt);
            return;
        }

        const spd = rage ? 1.35 : 1.0;
        if (f.hurtT <= 0 && !f.atk && f.invuln <= 0) {
            const inRange = add < 0.36 && adx < 320;
            if (f.aiTimer <= 0) {
                if (inRange) {
                    const list = rage ? bd.enrage : bd.moves;
                    const ready = list.filter(m => !f.cooldowns[m]);
                    const pick = ready.length ? ready[Math.floor(Math.random() * ready.length)] : list[0];
                    f.nextMove = pick;
                    f.telegraph = (rage ? 0.30 : 0.46) * (MOVES[pick].windup > 0.4 ? 1.15 : 1);
                    f.facing = dx >= 0 ? 1 : -1;
                    sfxTelegraph();
                    f.aiTimer = rand(1.1, 2.1) * (rage ? 0.62 : 1);
                } else {
                    f.aiTimer = rand(0.4, 0.9);
                }
            }
            // 移动
            if (add > 0.14) {
                const dir = dd > 0 ? 1 : -1;
                f.vDepth += dir * MOVE_DEPTH * 8 * spd * dt;
                f.vDepth = clamp(f.vDepth, -MOVE_DEPTH * spd, MOVE_DEPTH * spd);
                f.vx *= Math.pow(0.02, dt);
                if (Math.abs(f.vDepth) > 0.05) f.walkPhase += dt * 9;
            } else {
                f.vDepth *= Math.pow(0.02, dt);
                const want = adx > 165 ? (dx > 0 ? 1 : -1) : (adx < 100 ? (dx > 0 ? -1 : 1) : 0);
                const cap = MOVE_X * 0.62 * spd;
                if (want !== 0) {
                    f.vx += want * MOVE_X * 8 * spd * dt;
                    if (f.vx > cap) f.vx = cap;
                    if (f.vx < -cap) f.vx = -cap;
                } else {
                    f.vx *= Math.pow(0.02, dt);
                }
                if (Math.abs(f.vx) > 20) f.walkPhase += dt * walkRate(f);
            }
            if (Math.abs(f.vx) > 20) f.facing = f.vx > 0 ? 1 : -1;
        } else {
            f.vx *= Math.pow(0.05, dt);
            f.vDepth *= Math.pow(0.05, dt);
        }

        updateMotion(f, dt);
        updateAttack(f, dt);
    }

    function updateParticles(dt) {
        updateImpacts(dt);
        for (let i = particles.length - 1; i >= 0; i--) {
            const q = particles[i];
            q.life -= dt;
            if (q.life <= 0) { particles.splice(i, 1); continue; }
            q.x += q.vx * dt;
            q.y += q.vy * dt;
            q.vy += q.grav * dt;
            q.vx *= Math.pow(0.12, dt);
        }
        for (let i = floaters.length - 1; i >= 0; i--) {
            const f = floaters[i];
            f.life -= dt;
            if (f.life <= 0) { floaters.splice(i, 1); continue; }
            f.alt += f.vy * dt;
            f.vy += 120 * dt;
        }
        if (shake > 0) shake = Math.max(0, shake - dt * 42);
        if (comboTimer > 0) {
            comboTimer -= dt;
            if (comboTimer <= 0) combo = 0;
        }
        if (hintTimer > 0) hintTimer -= dt;
        if (stageIntroT > 0) stageIntroT -= dt;
        if (bannerT > 0) bannerT -= dt;
        if (flashT > 0) flashT = Math.max(0, flashT - dt * 2.6);
        if (bossBar) bossBar.t = Math.min(1, bossBar.t + dt * 2);
    }

    // ==================== 游戏主循环（按画面状态分发） ====================
    function update(dt) {
        clock += dt;
        modeT += dt;
        pollGamepad();

        if (mode === 'play') {
            if (pauseKey) {
                pauseKey = false;
                confirmPressed.ok = false;
                clearPress();
                for (const k in keys) keys[k] = false;
                setMode('pause');
                updateParticles(dt);
                return;
            }
            let step = dt;
            if (hitStop > 0) {
                const used = Math.min(hitStop, dt);
                hitStop -= used;
                step = Math.max(0, dt - used);
            }
            if (step > 0) {
                if (modeT > 1.2) updateWaves(step);
                updatePlayer(step);
                for (let i = 0; i < foes.length; i++) updateFoe(foes[i], step);
                updateProps(step);
                updateDrops(step);
                updateShots(step);
                if (boss && bossBar) {
                    // 首领血条延迟出现
                    if (boss.dead) bossBar.t = Math.max(0, bossBar.t - dt * 2);
                    else bossBar.t = Math.min(1, bossBar.t + dt * 1.6);
                }
            }
            if (bossIntroT > 0) bossIntroT -= dt;
            updateParticles(dt);
            updateMenuKeys();
            return;
        }

        if (mode === 'title') { updateTitle(dt); updateMenuKeys(); updateParticles(dt); return; }
        if (mode === 'pause') {
            if (pauseKey || confirmPressed.ok) { pauseKey = false; confirmPressed.ok = false; setMode('play'); }
            confirmPressed.up = false;
            confirmPressed.down = false;
            updateParticles(dt);
            return;
        }
        if (mode === 'howto') { updateHowTo(dt); updateMenuKeys(); updateParticles(dt); return; }
        if (mode === 'brief') { updateBrief(dt); updateParticles(dt); return; }
        if (mode === 'clear') { updateClear(dt); updateParticles(dt); return; }
        if (mode === 'dead') { updateDead(dt); updateParticles(dt); return; }
        if (mode === 'gameover' || mode === 'ending') {
            if (player && player.dead) updateDeadBody(player, dt);
            updateParticles(dt);
            updateMenuKeys();
            return;
        }
        updateParticles(dt);
    }

    function updateMenuKeys() {
        if (confirmPressed.up) {
            confirmPressed.up = false;
            if (mode === 'title') { menuIndex = (menuIndex + TITLE_MENU.length - 1) % TITLE_MENU.length; sfxMenu(); }
            else if (mode === 'howto') setMode('title');
        }
        if (confirmPressed.down) {
            confirmPressed.down = false;
            if (mode === 'title') { menuIndex = (menuIndex + 1) % TITLE_MENU.length; sfxMenu(); }
        }
        if (confirmPressed.ok) {
            confirmPressed.ok = false;
            if (mode === 'title') onTitleConfirm();
            else if (mode === 'howto') setMode('title');
            else if (mode === 'gameover' || mode === 'ending') { setMode('title'); menuIndex = 0; }
        }
        confirmPressed.up = false;
        confirmPressed.down = false;
        confirmPressed.ok = false;
    }

    const TITLE_MENU = ['开始游戏', '玩法说明'];

    function onTitleConfirm() {
        sfxMenu();
        if (menuIndex === 0) startGame();
        else setMode('howto');
    }

    function updateTitle(dt) {
        // 标题画面背景里有两个人影缓慢走动
        titleA.walk += dt * 6.5;
        titleB.walk += dt * 5.2;
    }

    function updateHowTo(dt) { /* 纯静态说明页 */ }

    function updateBrief(dt) {
        if (modeT > 0.6 && confirmPressed.ok) { confirmPressed.ok = false; setMode('play'); return; }
        if (modeT > 4.6) setMode('play');
        confirmPressed.ok = false;
        confirmPressed.up = false;
        confirmPressed.down = false;
    }

    function updateClear(dt) {
        if (modeT < 0.05) sfxClear();
        if (modeT > 3.6 || (modeT > 1.2 && confirmPressed.ok)) {
            confirmPressed.ok = false;
            if (levelIndex + 1 < LEVELS.length) {
                startLevel(levelIndex + 1);
                setMode('brief');
            } else {
                setMode('ending');
                if (score > bestScore) {
                    bestScore = score;
                    try { localStorage.setItem('street_brawl_best', String(bestScore)); } catch (e) { }
                }
            }
        }
        confirmPressed.ok = false;
    }

    function updateDead(dt) {
        if (player && player.dead) updateDeadBody(player, dt);
        if (modeT > 2.6 || (modeT > 1.2 && confirmPressed.ok)) {
            confirmPressed.ok = false;
            const lv = levelIndex;
            startLevel(lv);
            setMode('play');
        }
        confirmPressed.ok = false;
    }

    // ==================== 绘制：背景（三套主题） ====================
    let skyGrad = null, roadGrad = null, hudBgGrad = null;
    function rebuildGradients() {
        const th = THEMES[LEVELS[levelIndex].theme];
        skyGrad = ctx.createLinearGradient(0, 0, 0, BELT_BACK + 30);
        skyGrad.addColorStop(0, th.sky[0]);
        skyGrad.addColorStop(0.42, th.sky[1]);
        skyGrad.addColorStop(0.78, th.sky[2]);
        skyGrad.addColorStop(1, th.sky[3]);
        roadGrad = ctx.createLinearGradient(0, BELT_BACK, 0, H);
        roadGrad.addColorStop(0, th.ground[0]);
        roadGrad.addColorStop(0.5, th.ground[1]);
        roadGrad.addColorStop(1, th.ground[2]);
        hudBgGrad = ctx.createLinearGradient(0, 0, 0, HUD_H);
        hudBgGrad.addColorStop(0, 'rgba(10, 12, 24, 0.95)');
        hudBgGrad.addColorStop(1, 'rgba(6, 8, 16, 0.92)');
    }

    function drawBackdrop() {
        const th = THEMES[curLevel().theme];
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, W, BELT_BACK + 30);
        if (curLevel().theme === 'dock') drawDockSky(th);
        else if (curLevel().theme === 'rooftop') drawRooftopSky(th);
        else drawMoon(th);
        drawSkyline();
        if (curLevel().theme === 'market') drawMarketStalls(th);
        if (curLevel().theme === 'dock') drawDockCranes(th);
        drawBelt();
        // 整屏染色：让三张地图各有味道
        if (curLevel().theme === 'market') {
            ctx.fillStyle = 'rgba(120, 40, 110, 0.07)';
            ctx.fillRect(0, 0, W, H);
        } else if (curLevel().theme === 'dock') {
            ctx.fillStyle = 'rgba(30, 120, 140, 0.08)';
            ctx.fillRect(0, 0, W, H);
        } else {
            ctx.fillStyle = 'rgba(220, 110, 50, 0.06)';
            ctx.fillRect(0, 0, W, H);
        }
    }

    // 天体：夜市是月亮，码头是月亮+海面，天台是落日
    function drawMoon(th) {
        const mx = 1010, my = 96, mr = 34;
        const glow = ctx.createRadialGradient(mx, my, mr * 0.4, mx, my, mr * 2.6);
        glow.addColorStop(0, th.moonGlow);
        glow.addColorStop(1, 'rgba(255,244,210,0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(mx, my, mr * 2.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = th.moon;
        ctx.beginPath();
        ctx.arc(mx, my, mr, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(200, 188, 158, 0.55)';
        ctx.beginPath();
        ctx.arc(mx - 10, my - 7, 6, 0, Math.PI * 2);
        ctx.arc(mx + 9, my + 10, 4.5, 0, Math.PI * 2);
        ctx.fill();
    }

    // 第二关：星空 + 海面 + 月光倒影
    function drawDockSky(th) {
        for (let i = 0; i < 70; i++) {
            const sx = hash(i * 2.7 + bgSeed) * W;
            const sy = hash(i * 5.1 + bgSeed) * (BELT_BACK - 40);
            const tw = 0.35 + 0.65 * Math.abs(Math.sin(clock * (0.7 + hash(i) * 1.6) + i));
            ctx.fillStyle = 'rgba(255,255,255,' + (0.25 + tw * 0.55).toFixed(2) + ')';
            ctx.fillRect(sx, sy, 1.6, 1.6);
        }
        drawMoon(th);
        const seaY = BELT_BACK + 30;
        const sea = ctx.createLinearGradient(0, seaY - 66, 0, seaY + 6);
        sea.addColorStop(0, '#0d2b3a');
        sea.addColorStop(1, '#061821');
        ctx.fillStyle = sea;
        ctx.fillRect(0, seaY - 66, W, 72);
        // 月光在海面拉出的光带
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < 22; i++) {
            const yy = seaY - 62 + i * 3.1;
            const ww = 60 - i * 1.6 + Math.sin(clock * 1.6 + i * 0.7) * 14;
            ctx.fillStyle = 'rgba(200,232,255,' + (0.16 * (1 - i / 22)).toFixed(3) + ')';
            ctx.fillRect(1010 - ww / 2 + Math.sin(clock * 1.1 + i) * 5, yy, ww, 1.6);
        }
        ctx.restore();
        ctx.strokeStyle = 'rgba(140,200,220,0.16)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 16; i++) {
            const yy = seaY - 64 + i * 4.2;
            ctx.beginPath();
            ctx.moveTo(0, yy);
            ctx.lineTo(W, yy);
            ctx.stroke();
        }
    }

    // 第三关：落日 + 云带 + 远处塔吊
    function drawRooftopSky(th) {
        const sx = 330, sy = 168, sr = 62;
        const glow = ctx.createRadialGradient(sx, sy, sr * 0.5, sx, sy, sr * 4.2);
        glow.addColorStop(0, 'rgba(255,190,120,0.36)');
        glow.addColorStop(1, 'rgba(255,120,60,0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(sx, sy, sr * 4.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffd98a';
        ctx.beginPath();
        ctx.arc(sx, sy, sr, 0, Math.PI * 2);
        ctx.fill();
        // 云带：横向条状剪影缓慢右移
        for (let i = 0; i < 7; i++) {
            const cy = 70 + i * 30;
            const cxx = (i * 260 + clock * (7 + i * 2) + bgSeed * 3) % (W + 420) - 210;
            ctx.fillStyle = i % 2 ? 'rgba(60,26,52,0.55)' : 'rgba(38,18,40,0.62)';
            ctx.beginPath();
            ctx.ellipse(cxx, cy, 130 + i * 22, 9 + i * 1.6, 0, 0, Math.PI * 2);
            ctx.ellipse(cxx + 190, cy + 6, 100 + i * 16, 7 + i, 0, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function drawDockCranes(th) {
        // 远处港口龙门吊剪影
        ctx.fillStyle = 'rgba(10, 26, 34, 0.92)';
        for (let i = 0; i < 4; i++) {
            const x = 90 + i * 330 + hash(i * 3 + bgSeed) * 70;
            const baseY = BELT_BACK - 6;
            const topY = baseY - 150 - hash(i * 7 + bgSeed) * 60;
            ctx.fillRect(x, topY, 10, baseY - topY);
            ctx.fillRect(x + 46, topY + 6, 10, baseY - topY - 6);
            ctx.fillRect(x - 40, topY - 12, 190, 12);
            ctx.fillRect(x + 70, topY, 8, 40);
            ctx.fillRect(x + 74, topY + 36, 46, 10);
        }
        // 远处堆叠的集装箱
        for (let i = 0; i < 16; i++) {
            const x = -30 + i * 88 + hash(i * 5 + bgSeed) * 30;
            const hgt = 34 + hash(i * 11 + bgSeed) * 46;
            ctx.fillStyle = i % 3 === 0 ? 'rgba(24,58,64,0.95)' : (i % 3 === 1 ? 'rgba(30,46,66,0.95)' : 'rgba(52,42,44,0.95)');
            ctx.fillRect(x, BELT_BACK - 26 - hgt, 80, hgt);
            ctx.fillStyle = 'rgba(255,255,255,0.06)';
            ctx.fillRect(x, BELT_BACK - 26 - hgt, 80, 5);
        }
    }

    // 第一关：街边摊子 + 拉挂彩灯
    function drawMarketStalls(th) {
        const baseY = BELT_BACK + 30;
        for (let i = 0; i < 5; i++) {
            const x = -60 + i * 300 + hash(i * 9 + bgSeed) * 60;
            const w = 190 + hash(i * 4 + bgSeed) * 70;
            const h = 84;
            // 棚顶
            const hue = ['#c94f6d', '#3f7fc9', '#c99a3f', '#4fae7a', '#8a5fc9'][i % 5];
            ctx.fillStyle = hue;
            ctx.fillRect(x, baseY - h, w, 18);
            ctx.fillStyle = 'rgba(0,0,0,0.28)';
            for (let s = 0; s < w; s += 26) ctx.fillRect(x + s, baseY - h, 12, 18);
            // 支柱与柜台
            ctx.fillStyle = 'rgba(24,18,30,0.9)';
            ctx.fillRect(x + 6, baseY - h + 18, 8, h - 18);
            ctx.fillRect(x + w - 14, baseY - h + 18, 8, h - 18);
            ctx.fillStyle = 'rgba(38,30,46,0.95)';
            ctx.fillRect(x, baseY - 52, w, 34);
            // 摊上的灯笼
            for (let l = 0; l < 3; l++) {
                const lx = x + 30 + l * (w - 60) / 2;
                const ly = baseY - h + 34;
                ctx.fillStyle = 'rgba(255,90,110,0.9)';
                ctx.beginPath();
                ctx.ellipse(lx, ly, 9, 12, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,220,160,' + (0.45 + 0.25 * Math.sin(clock * 3 + i + l)).toFixed(2) + ')';
                ctx.beginPath();
                ctx.ellipse(lx, ly, 14, 18, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        // 横跨街道的灯串
        ctx.strokeStyle = 'rgba(255,255,255,0.10)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-20, BELT_BACK - 200);
        ctx.quadraticCurveTo(W / 2, BELT_BACK - 150, W + 20, BELT_BACK - 206);
        ctx.stroke();
        for (let i = 0; i <= 22; i++) {
            const t = i / 22;
            const bx = -20 + t * (W + 40);
            const by = (1 - t) * (1 - t) * (BELT_BACK - 200) + 2 * (1 - t) * t * (BELT_BACK - 150) + t * t * (BELT_BACK - 206);
            const blink = 0.55 + 0.45 * Math.sin(clock * 4 + i * 1.3);
            ctx.fillStyle = i % 3 === 0 ? 'rgba(255,120,190,' + blink.toFixed(2) + ')'
                : (i % 3 === 1 ? 'rgba(120,220,255,' + blink.toFixed(2) + ')' : 'rgba(255,220,130,' + blink.toFixed(2) + ')');
            ctx.beginPath();
            ctx.arc(bx, by + 8, 4.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,' + (0.14 * blink).toFixed(2) + ')';
            ctx.beginPath();
            ctx.arc(bx, by + 8, 12, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function drawSkyline() {
        const baseY = BELT_BACK + 30;
        const th = THEMES[curLevel().theme];
        const dark = curLevel().theme === 'dock' ? ['rgba(10, 30, 42, 0.95)', 'rgba(6, 18, 28, 0.98)']
            : (curLevel().theme === 'rooftop' ? ['rgba(48, 20, 44, 0.95)', 'rgba(28, 12, 30, 0.98)']
                : ['rgba(30, 26, 52, 0.95)', 'rgba(20, 17, 38, 0.98)']);
        for (let layer = 0; layer < 2; layer++) {
            const seed = layer * 37 + bgSeed;
            const shade = dark[layer];
            const hMin = layer === 0 ? 90 : 130;
            const hMax = layer === 0 ? 190 : 250;
            let x = -60;
            let i = 0;
            while (x < W + 60) {
                const bw = 46 + hash(i * 3 + 1 + seed) * 74;
                const bh = hMin + hash(i * 3 + 2 + seed) * (hMax - hMin);
                const top = baseY - bh - layer * 26;
                ctx.fillStyle = shade;
                ctx.fillRect(x, top, bw, bh + 60);
                if (layer === 1) {
                    const winCol = curLevel().theme === 'rooftop' ? 'rgba(255,196,120,0.55)' : 'rgba(255, 214, 140, 0.55)';
                    ctx.fillStyle = winCol;
                    for (let wy = 0; wy < Math.floor(bh / 26) - 1; wy++) {
                        for (let wx = 0; wx < Math.floor(bw / 22) - 1; wx++) {
                            if (hash(i * 31 + wy * 7 + wx * 3 + seed) > 0.62) {
                                ctx.fillRect(x + 8 + wx * 22, top + 12 + wy * 26, 9, 12);
                            }
                        }
                    }
                    // 楼顶的航空障碍灯
                    if (i % 3 === 0) {
                        const on = Math.sin(clock * 2.4 + i) > 0;
                        ctx.fillStyle = on ? 'rgba(255,80,80,0.95)' : 'rgba(120,40,40,0.7)';
                        ctx.fillRect(x + bw / 2 - 2, top - 6, 4, 4);
                    }
                }
                // 第一关：楼身挂霓虹竖招牌
                if (curLevel().theme === 'market' && layer === 1 && i % 4 === 1) {
                    const ncol = ['rgba(255,95,162,0.9)', 'rgba(90,209,255,0.9)', 'rgba(255,217,102,0.9)'][i % 3];
                    const nh = 40 + hash(i * 13 + seed) * 50;
                    ctx.fillStyle = 'rgba(10,8,20,0.9)';
                    ctx.fillRect(x + bw - 14, top + 16, 12, nh);
                    ctx.fillStyle = ncol;
                    ctx.fillRect(x + bw - 11, top + 19, 6, nh - 6);
                    ctx.save();
                    ctx.globalCompositeOperation = 'lighter';
                    ctx.fillStyle = ncol.replace('0.9', '0.25');
                    ctx.fillRect(x + bw - 20, top + 12, 24, nh + 10);
                    ctx.restore();
                }
