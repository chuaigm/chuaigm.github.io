        // ---- 敌人 ----
        for (let i = 0; i < foes.length; i++) {
            const f = foes[i];
            const ew = 300;
            const ex = W - 20 - ew;
            const ey = 16 + i * 36;
            ctx.font = 'bold 13px "Courier New", monospace';
            ctx.textAlign = 'right';
            ctx.fillStyle = f.dead ? 'rgba(180,180,190,0.5)' : '#ffb3b3';
            ctx.fillText(f.dead ? 'KO' : '打手 ' + (i + 1), W - 20, ey - 3);
            const cols = f.kind === 'foe1' ? ['#ff8f8f', '#e04b4b'] : ['#c39bff', '#8250d8'];
            drawBar(ex, ey, ew, 16, f.hp / f.maxHp, cols);
        }

        // ---- 中央信息 ----
        ctx.textAlign = 'center';
        ctx.font = 'bold 17px "Courier New", monospace';
        ctx.fillStyle = '#ffd966';
        ctx.fillText('第 ' + wave + ' 波', W / 2, 22);
        ctx.font = 'bold 24px "Courier New", monospace';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(String(score), W / 2, 50);

        if (combo > 1 && comboTimer > 0) {
            ctx.font = 'bold 15px "Courier New", monospace';
            ctx.fillStyle = '#ff9ff3';
            ctx.fillText(combo + ' 连击', W / 2, 70);
        }
    }

    function drawHint() {
        if (hintTimer <= 0) return;
        const a = clamp(hintTimer, 0, 1);
        ctx.save();
        ctx.globalAlpha = a;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = 'bold 18px "Courier New", monospace';
        ctx.fillStyle = 'rgba(10, 14, 26, 0.85)';
        const lines = [
            'WASD / 方向键 / 手柄十字键 移动    K 跳跃    J 拳    L 脚    I 技能',
            '手柄：十字键 移动    A 跳跃    X 拳    B 脚    Y 技能',
            '必须与对手处在同一条水平线上才能击中'
        ];
        for (let i = 0; i < lines.length; i++) {
            const tw = ctx.measureText(lines[i]).width + 30;
            const y = HUD_H + 30 + i * 26;
            roundRectPath(W / 2 - tw / 2, y - 12, tw, 24, 12);
            ctx.fill();
            ctx.fillStyle = '#dbe7ff';
            ctx.fillText(lines[i], W / 2, y);
            ctx.fillStyle = 'rgba(10, 14, 26, 0.85)';
        }
        ctx.restore();
    }

    function drawGameOver() {
        const a = clamp(overTimer / 0.6, 0, 1);
        ctx.save();
        ctx.globalAlpha = a * 0.72;
        ctx.fillStyle = '#05060c';
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = a;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = 'bold 62px "Courier New", monospace';
        ctx.fillStyle = '#ff6b6b';
        ctx.fillText('K.O.', W / 2, H / 2 - 40);
        ctx.font = 'bold 24px "Courier New", monospace';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('得分 ' + score + '    到达第 ' + wave + ' 波', W / 2, H / 2 + 16);
        ctx.font = 'bold 18px "Courier New", monospace';
        ctx.fillStyle = 'rgba(220,230,255,0.75)';
        ctx.fillText('按 Enter / R 或 手柄 Start 重新开始', W / 2, H / 2 + 62);
        ctx.restore();
    }

    function draw() {
        applyCanvasTransform();
        ctx.clearRect(0, 0, W, H);

        const sx = shake > 0 ? rand(-shake, shake) : 0;
        const sy = shake > 0 ? rand(-shake, shake) : 0;
        ctx.save();
        ctx.translate(sx, sy);

        drawBackdrop();

        // 影子画在人物之下
        const all = [player, ...foes];
        for (let i = 0; i < all.length; i++) drawShadow(all[i]);

        // 按纵深从远到近排序绘制
        all.sort((a, b) => b.depth - a.depth);
        for (let i = 0; i < all.length; i++) drawFighter(all[i]);

        drawParticles();
        drawFloaters();

        ctx.restore();

        drawHud();
        drawHint();
        if (gameOver) drawGameOver();

        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
    }

    // ==================== 主循环 ====================
    let lastTime = 0;
    function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        let dt = (timestamp - lastTime) / 1000;
        lastTime = timestamp;
        if (dt > 0.1) dt = 0.1;
        if (dt < 0.001) dt = 0.001;

        update(dt);
        draw();
        requestAnimationFrame(gameLoop);
    }

    // ==================== 初始化 ====================
    updateFullscreenButton();
    resizeCanvas();
    rebuildGradients();
    resetGame();
    requestAnimationFrame(() => { resizeCanvas(); requestAnimationFrame(resizeCanvas); });
    requestAnimationFrame(gameLoop);
})();
</script>
</body>
