        }
        ctx.restore();
    }

    // ==================== 剧情阶段 ====================
    function updateCutscene(dt) {
        const c = cut;
        if (!c) return;
        c.t += dt;
        c.walkT += dt * (c.flying ? 0 : 6.2);
        c.blinkT -= dt;
        if (c.blinkT <= 0) { c.blink = 0.14; c.blinkT = 1.6 + Math.random() * 3.4; }
        if (c.blink > 0) c.blink -= dt;
        c.alpha = Math.min(1, c.alpha + dt * 2.2);

        const sp = c.sp;
        const speed = sp.speed;
        const playerFace = c.x < player.x ? 1 : -1;
        player.facing = playerFace;

        if (c.phase === 'calm') {
            c.dir = playerFace;
            if (c.t > 1.5) { c.phase = 'enter'; c.t = 0; c.alpha = 0; }
            return;
        }

        if (c.phase === 'enter') {
            c.dir = playerFace;
            c.alpha = Math.min(1, c.alpha + dt * 2.4);
            const d = c.targetX - c.x;
            const step = speed * dt;
            if (Math.abs(d) <= step) { c.x = c.targetX; c.phase = 'reach'; c.t = 0; }
            else c.x += Math.sign(d) * step;
            if (c.flying) c.y = GROUND_Y - 190 + Math.sin(time * 1.8) * 12;
            if (popups.length === 0 && c.x > -80 && c.x < W + 80) {
                popups.push({ x: player.x, y: GROUND_Y - 150, text: '!', life: 1.1, color: '#ffe08a', vy: -20 });
            }
            return;
        }

        if (c.phase === 'reach') {
            c.dir = playerFace;
            if (c.t > 0.7) { c.phase = 'take'; c.t = 0; }
            return;
        }

        if (c.phase === 'take') {
            c.dir = playerFace;
            if (c.t > 0.85 && !c.carry) {
                c.carry = true;
                sfxThanks();
                popups.push({ x: player.x, y: GROUND_Y - 196, text: '+1 恐龙蛋', life: 1.6, color: '#ffe08a', vy: -30 });
                for (let i = 0; i < 10; i++) {
                    floaters.push({
                        x: c.x + (Math.random() - 0.5) * 60, y: GROUND_Y - 120 - Math.random() * 40,
                        vy: -(40 + Math.random() * 70), life: 0.7 + Math.random() * 0.5,
                        r: 3 + Math.random() * 3.5, col: Math.random() < 0.5 ? SPR.glowYellow : SPR.glowWhite
                    });
                }
            }
            if (c.t > 1.1) { c.phase = 'thanks'; c.t = 0; c.thanks = true; }
            return;
        }

        if (c.phase === 'thanks') {
            c.dir = playerFace;
            c.thanksT += dt;
            c.heartT -= dt;
            if (c.heartT <= 0) {
                c.heartT = 0.42;
                hearts.push({
                    x: c.x + (Math.random() - 0.5) * 50,
                    y: GROUND_Y - (c.flying ? 210 : 180) - Math.random() * 20,
                    vy: -(26 + Math.random() * 26),
                    life: 1.5, rot: (Math.random() - 0.5) * 0.6,
                    spin: (Math.random() - 0.5) * 1.6,
                    s: 7 + Math.random() * 5,
                    col: Math.random() < 0.45 ? '#ff6b81' : '#ffb3c8'
                });
            }
            if (c.t > 3.0) { c.phase = 'leave'; c.t = 0; }
            return;
        }

        if (c.phase === 'leave') {
            c.dir = -playerFace;
            c.x += c.dir * speed * 1.18 * dt;
            if (c.flying) {
                c.y = lerp(c.y, GROUND_Y - 300, dt * 1.2);
                c.alpha -= dt * 0.5;
            } else if (c.x < -260 || c.x > W + 260) {
                c.alpha -= dt * 1.6;
            }
            if (c.x < -320 || c.x > W + 320) { c.phase = 'done'; c.t = 0; }
            return;
        }

        if (c.phase === 'done') {
            endCutscene();
        }
    }

    function cutEggWorldPos() {
        const c = cut;
        const sp = c.sp;
        const a = sp.anchor;
        const p = easeInOut(clamp(c.t / 0.85, 0, 1));
        const sx = player.x + player.facing * 24;
        const sy = GROUND_Y - 80;
        const ex = c.x + c.dir * a[0] * sp.scale;
        const ey = c.y + a[1] * sp.scale;
        const x = lerp(sx, ex, p);
        const y = lerp(sy, ey, p) - Math.sin(p * Math.PI) * 42;
        return { x: x, y: y, t: p };
    }

    function drawCutscene() {
        const c = cut;
        if (!c) return;
        const sp = c.sp;
        const s = sp.scale;

        const dinoLeft = c.x < player.x;
        drawDinoShadow(c.x, c.flying ? GROUND_Y : c.y, 60 * s * (c.flying ? 0.8 : 1), 0.26 * c.alpha);

        if (dinoLeft) {
            drawDino(c.sp.id, { x: c.x, y: c.y, s: s, dir: c.dir, t: c.walkT, blink: c.blink > 0, bow: c.phase === 'thanks' ? 0.8 : 0.25, carry: c.carry, eggPal: sp.egg, alpha: c.alpha });
        }

        if (c.phase === 'take' && !c.carry) {
            const p = cutEggWorldPos();
            drawEggAt(p.x, p.y, 40, 54, sp.egg, time, 0.1 * Math.sin(time * 4), 1);
        }

        if (!dinoLeft) {
            drawDino(c.sp.id, { x: c.x, y: c.y, s: s, dir: c.dir, t: c.walkT, blink: c.blink > 0, bow: c.phase === 'thanks' ? 0.8 : 0.25, carry: c.carry, eggPal: sp.egg, alpha: c.alpha });
        }

        drawPlayer();

        if (c.phase === 'thanks') {
            const a = clamp(c.thanksT * 3.2, 0, 1) * clamp((3.0 - c.thanksT) / 0.7, 0, 1);
            drawBubble(c.x, c.y - (c.flying ? 150 : 230) * s, '谢谢你！', a, time);
        }
    }

    function drawBubble(x, y, text, alpha, t) {
        if (alpha <= 0.01) return;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.font = 'bold 30px ' + FONT_CN;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const tw = ctx.measureText(text).width;
        const bw = tw + 40, bh = 54;
        const bx = clamp(x - bw / 2, 10, W - bw - 10);
        const by = clamp(y - bh, 8, PLAY_H - bh - 8);
        const pop = 1 + 0.06 * Math.sin(t * 6);
        ctx.translate(bx + bw / 2, by + bh / 2);
        ctx.scale(pop, pop);
        ctx.translate(-(bx + bw / 2), -(by + bh / 2));
        ctx.fillStyle = 'rgba(255,252,245,0.97)';
        roundRectPath(bx, by, bw, bh, 20);
        ctx.fill();
        ctx.strokeStyle = 'rgba(120,60,70,0.35)';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x - 14, by + bh - 2);
        ctx.lineTo(x + 2, by + bh + 22);
        ctx.lineTo(x + 16, by + bh - 2);
        ctx.closePath();
        ctx.fillStyle = 'rgba(255,252,245,0.97)';
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#5a2c3a';
        ctx.fillText(text, bx + bw / 2, by + bh / 2 + 2);
        ctx.save();
        ctx.translate(bx + bw - 22, by + 12);
        ctx.scale(Math.max(0.2, Math.abs(Math.cos(t * 5))), 1);
        ctx.fillStyle = '#ff7d95';
        heartPath(0, 0, 10);
        ctx.fill();
        ctx.restore();
        ctx.restore();
    }

    // ==================== 背景绘制 ====================
    let vignetteGrad = null, skyGrad = null, groundGrad = null, hudBgGrad = null;

    function rebuildGradients() {
        skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y + 20);
        skyGrad.addColorStop(0, '#150a1c');
        skyGrad.addColorStop(0.34, '#2e1024');
        skyGrad.addColorStop(0.68, '#63201c');
        skyGrad.addColorStop(1, '#a83c14');

        groundGrad = ctx.createLinearGradient(0, GROUND_Y, 0, PLAY_H);
        groundGrad.addColorStop(0, '#33201f');
        groundGrad.addColorStop(0.5, '#241619');
        groundGrad.addColorStop(1, '#150d11');

        hudBgGrad = ctx.createLinearGradient(0, PLAY_H, 0, H);
        hudBgGrad.addColorStop(0, 'rgba(30, 12, 12, 0.96)');
        hudBgGrad.addColorStop(1, 'rgba(14, 6, 8, 0.98)');

        vignetteGrad = ctx.createRadialGradient(W / 2, PLAY_H * 0.52, PLAY_H * 0.32, W / 2, PLAY_H * 0.52, PLAY_H * 1.05);
        vignetteGrad.addColorStop(0, 'rgba(0,0,0,0)');
        vignetteGrad.addColorStop(1, 'rgba(8,2,4,0.62)');
    }

    function drawSky() {
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, W, PLAY_H + 20);
        const gx = volcano.x;
        const glow = ctx.createRadialGradient(gx, GROUND_Y - 60, 40, gx, GROUND_Y - 60, 620);
        glow.addColorStop(0, 'rgba(255,140,50,0.42)');
        glow.addColorStop(0.4, 'rgba(220,70,25,0.18)');
        glow.addColorStop(1, 'rgba(180,40,10,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, W, PLAY_H + 20);
    }

    function drawFarRidge(seedOff, baseY, amp, color, step) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, PLAY_H);
        ctx.lineTo(0, baseY);
        for (let x = 0; x <= W; x += step) {
            const n = hash(x * 0.004 + seedOff + bgSeed);
            const n2 = hash(x * 0.013 + seedOff * 2 + bgSeed);
            const y = baseY - n * amp - n2 * amp * 0.4;
            ctx.lineTo(x, y);
        }
        ctx.lineTo(W, PLAY_H);
        ctx.closePath();
        ctx.fill();
    }

    function coneYAt(v, t) { return lerp(v.baseY - v.h + 14, v.baseY + 46, clamp(t, 0, 1)); }
    function coneWAt(v, t) { return lerp(v.rimHalf, v.baseHalf, Math.pow(clamp(t, 0, 1), 1.55)); }

    function ribbonEdge(list) {
        ctx.lineTo(list[0].x, list[0].y);
        for (let i = 1; i < list.length - 1; i++) {
            const mx = (list[i].x + list[i + 1].x) / 2;
            const my = (list[i].y + list[i + 1].y) / 2;
            ctx.quadraticCurveTo(list[i].x, list[i].y, mx, my);
        }
        const last = list[list.length - 1];
        ctx.lineTo(last.x, last.y);
    }

    function taperedRibbon(pts, ws) {
        const left = [], right = [];
        for (let i = 0; i < pts.length; i++) {
            const p = pts[i];
            const prev = pts[Math.max(0, i - 1)];
            const next = pts[Math.min(pts.length - 1, i + 1)];
            let dx = next.x - prev.x, dy = next.y - prev.y;
            const len = Math.max(0.001, Math.sqrt(dx * dx + dy * dy));
            const nx = -dy / len, ny = dx / len;
            const hw = ws[i] * 0.5;
            left.push({ x: p.x + nx * hw, y: p.y + ny * hw });
            right.push({ x: p.x - nx * hw, y: p.y - ny * hw });
        }
        ctx.beginPath();
        ctx.moveTo(left[0].x, left[0].y);
        ribbonEdge(left.slice(1));
        for (let i = right.length - 1; i >= 0; i--) ctx.lineTo(right[i].x, right[i].y);
        ctx.closePath();
    }

    function makeConeDetail() {
        const v = volcano;
        lavaScars = [];
        coneRocks = [];
        for (let i = 0; i < 8; i++) {
            const t0 = i < 3 ? (0.03 + hash(i * 7.7 + bgSeed) * 0.09)
                : (0.18 + hash(i * 7.7 + bgSeed) * 0.44);
            const t1 = 0.70 + hash(i * 3.3 + bgSeed) * 0.30;
            const f0 = (hash(i * 11.1 + bgSeed) * 2 - 1) * (i < 3 ? 0.6 : 0.86);
            const f1 = f0 * (0.8 + hash(i * 5.5 + bgSeed) * 0.8) + (hash(i * 2.7 + bgSeed) - 0.5) * 0.26;
            const ph = hash(i * 13.7 + bgSeed) * 6.28;
            const wob = 0.10 + hash(i * 4.9 + bgSeed) * 0.18;
            const N = 17;
            const w0 = 7 + hash(i * 9.3 + bgSeed) * 9;
            const w1 = 24 + hash(i * 6.7 + bgSeed) * 40;
            const pts = [], ws = [];
            for (let k = 0; k < N; k++) {
                const u = k / (N - 1);
                const t = lerp(t0, t1, u);
                const f = lerp(f0, f1, u) + Math.sin(u * 3.1 + ph) * wob * u;
                pts.push({ x: v.x + f * coneWAt(v, t) * 0.93, y: coneYAt(v, t) });
                ws.push(lerp(w0, w1, Math.pow(u, 0.75)));
            }
            const branches = [];
            const bn = 1 + Math.floor(hash(i * 17.3 + bgSeed) * 2);
            for (let b = 0; b < bn; b++) {
                const k0 = 5 + Math.floor(hash(i * 4.3 + b * 2.7 + bgSeed) * 6);
                const dir = hash(i * 8.9 + b * 5.1 + bgSeed) < 0.5 ? -1 : 1;
                const bp = [], bw = [];
                for (let k = k0; k < N; k++) {
                    const u = (k - k0) / (N - 1);
                    const t = pts[k].t !== undefined ? pts[k].t : lerp(t0, t1, k / (N - 1));
                    const f = lerp(f0, f1, k / (N - 1)) + dir * u * (0.16 + hash(i + b) * 0.14);
                    bp.push({ x: v.x + f * coneWAt(v, t) * 0.93, y: coneYAt(v, t) });
                    bw.push(lerp(4, 3 + hash(i * 3 + b) * 10, u));
                }
                if (bp.length > 1) branches.push({ pts: bp, ws: bw });
            }
            lavaScars.push({
                pts: pts, ws: ws, branches: branches,
                hot: Math.max(0, 1 - i * 0.16),
                ph: ph
            });
        }
        for (let i = 0; i < 30; i++) {
            const t = 0.16 + hash(i * 5.7 + bgSeed) * 0.84;
            const f = (hash(i * 9.1 + bgSeed) * 2 - 1) * 0.94;
            coneRocks.push({
                x: v.x + f * coneWAt(v, t) * 0.92,
                y: coneYAt(v, t),
                s: 4 + hash(i * 2.3 + bgSeed) * 10,
                seed: hash(i * 13.1 + bgSeed) * 100,
                lit: hash(i * 7.7 + bgSeed) > 0.45
            });
        }
    }

    function drawLavaScars() {
        const v = volcano;
        for (let i = 0; i < lavaScars.length; i++) {
            const sc = lavaScars[i];
            const pulse = 0.72 + 0.28 * Math.sin(time * (0.7 + sc.hot * 1.4) + sc.ph);
            const crust = 'rgba(26,13,15,0.72)';
            const hot = sc.hot;

            for (let b = 0; b < sc.branches.length; b++) {
                const br = sc.branches[b];
                taperedRibbon(br.pts, br.ws.map(function (x) { return x * 1.5; }));
                ctx.fillStyle = crust;
                ctx.fill();
                taperedRibbon(br.pts, br.ws);
                ctx.fillStyle = 'rgba(' + Math.round(90 + hot * 150) + ',' + Math.round(24 + hot * 52) + ',12,0.85)';
                ctx.fill();
            }

            taperedRibbon(sc.pts, sc.ws.map(function (x) { return x * 1.4; }));
            ctx.fillStyle = crust;
            ctx.fill();

            taperedRibbon(sc.pts, sc.ws);
            const a0 = sc.pts[0], a1 = sc.pts[sc.pts.length - 1];
            const g = ctx.createLinearGradient(a0.x, a0.y, a1.x, a1.y);
            g.addColorStop(0, 'rgba(' + Math.round(60 + hot * 195) + ',' + Math.round(16 + hot * 92) + ',' + Math.round(8 + hot * 26) + ',0.95)');
            g.addColorStop(0.55, 'rgba(' + Math.round(96 + hot * 140) + ',' + Math.round(26 + hot * 50) + ',12,0.92)');
            g.addColorStop(1, 'rgba(58,16,10,0.9)');
            ctx.fillStyle = g;
            ctx.fill();

            taperedRibbon(sc.pts, sc.ws.map(function (x) { return x * 0.42; }));
            ctx.fillStyle = 'rgba(255,' + Math.round(70 + hot * 90) + ',30,' + (0.10 + hot * 0.35) * pulse + ')';
            ctx.fill();

            taperedRibbon(sc.pts, sc.ws.map(function (x) { return x * 0.16; }));
            ctx.fillStyle = 'rgba(255,210,150,' + (0.05 + hot * 0.28) * pulse + ')';
            ctx.fill();

            const last = sc.pts[sc.pts.length - 1];
            const lw = sc.ws[sc.ws.length - 1];
            ctx.fillStyle = 'rgba(48,20,14,0.9)';
            ctx.beginPath();
            ctx.ellipse(last.x, last.y + lw * 0.12, lw * 0.72, lw * 0.34, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,120,40,' + (0.12 + hot * 0.4) * pulse + ')';
            ctx.beginPath();
            ctx.ellipse(last.x, last.y + lw * 0.1, lw * 0.52, lw * 0.22, 0, 0, Math.PI * 2);
            ctx.fill();

            for (let k = 1; k < sc.pts.length - 1; k++) {
                if (hash(k * 7.3 + i * 3.1 + bgSeed) < 0.55) continue;
                drawSprite(SPR.glowOrange, sc.pts[k].x, sc.pts[k].y, sc.ws[k] * 2.6, (0.10 + hot * 0.30) * pulse, false);
            }
        }
    }

    function drawConeRocks() {
        for (let i = 0; i < coneRocks.length; i++) {
            const r = coneRocks[i];
            ctx.save();
            ctx.translate(r.x, r.y);
            ctx.fillStyle = 'rgba(8,4,6,0.35)';
            ctx.beginPath();
            ctx.ellipse(r.s * 0.15, r.s * 0.42, r.s * 0.95, r.s * 0.3, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            const n = 6;
            const top = [];
            for (let k = 0; k < n; k++) {
                const ang = (k / n) * Math.PI * 2 + r.seed;
                const rad = r.s * (0.55 + hash(r.seed + k * 2.7) * 0.6);
                const x = Math.cos(ang) * rad, y = Math.sin(ang) * rad * 0.62;
                if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                top.push({ x: x, y: y });
            }
            ctx.closePath();
            ctx.fillStyle = r.lit ? 'rgba(62,40,44,0.8)' : 'rgba(38,25,29,0.78)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(10,5,8,0.5)';
            ctx.lineWidth = 0.9;
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(top[4].x, top[4].y);
            ctx.lineTo(top[5].x, top[5].y);
            ctx.lineTo(top[0].x, top[0].y);
            ctx.lineTo(top[1].x, top[1].y);
            ctx.strokeStyle = r.lit ? 'rgba(255,178,128,0.16)' : 'rgba(255,160,110,0.08)';
            ctx.lineWidth = 1.3;
            ctx.stroke();
            ctx.restore();
        }
    }

    function drawVolcano() {
        const v = volcano;
        const topY = v.baseY - v.h;
        const rimY = topY + 14;

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(v.x - v.baseHalf, v.baseY + 46);
        ctx.bezierCurveTo(v.x - v.baseHalf * 0.78, v.baseY - v.h * 0.26,
            v.x - v.rimHalf * 2.2, v.baseY - v.h * 0.56,
            v.x - v.rimHalf, rimY);
        ctx.lineTo(v.x - v.rimHalf, topY + 4);
        ctx.quadraticCurveTo(v.x, topY - 16, v.x + v.rimHalf, topY + 4);
        ctx.lineTo(v.x + v.rimHalf, rimY);
        ctx.bezierCurveTo(v.x + v.rimHalf * 2.2, v.baseY - v.h * 0.56,
            v.x + v.baseHalf * 0.78, v.baseY - v.h * 0.26,
            v.x + v.baseHalf, v.baseY + 46);
        ctx.closePath();
        const bodyGrad = ctx.createLinearGradient(0, topY, 0, v.baseY + 46);
        bodyGrad.addColorStop(0, '#6a3a3f');
        bodyGrad.addColorStop(0.28, '#43242b');
        bodyGrad.addColorStop(0.62, '#2a161c');
        bodyGrad.addColorStop(1, '#150b0f');
        ctx.fillStyle = bodyGrad;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,158,96,0.20)';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.save();
        ctx.clip();

        const glow = ctx.createRadialGradient(v.x, rimY, 12, v.x, rimY, v.h * 1.05);
        glow.addColorStop(0, 'rgba(255,175,85,0.58)');
        glow.addColorStop(0.28, 'rgba(244,104,40,0.26)');
        glow.addColorStop(0.62, 'rgba(205,62,20,0.09)');
        glow.addColorStop(1, 'rgba(170,36,8,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(v.x - v.h, topY - 70, v.h * 2, v.h * 1.9);

        const coneT = function (t) {
            return clamp(t, 0, 1);
        };
        const coneY = function (t) { return coneYAt(v, t); };
        const coneW = function (t) { return coneWAt(v, t); };

        const bandT = [0.06, 0.15, 0.25, 0.36, 0.48, 0.61, 0.75, 0.88];
        for (let i = 0; i < bandT.length; i++) {
            const t0 = bandT[i];
            const t1 = t0 + 0.030 + (i % 2) * 0.014;
            const y0 = coneY(t0), y1 = coneY(t1);
            const w0 = coneW(t0), w1 = coneW(t1);
            const sag0 = (y1 - y0) * 2.4, sag1 = (y1 - y0) * 1.9;
            ctx.beginPath();
            ctx.moveTo(v.x - w0, y0);
            ctx.quadraticCurveTo(v.x, y0 + sag0, v.x + w0, y0);
            ctx.lineTo(v.x + w1, y1);
            ctx.quadraticCurveTo(v.x, y1 + sag1, v.x - w1, y1);
            ctx.closePath();
            ctx.fillStyle = i % 2 === 0 ? 'rgba(12,6,9,0.22)' : 'rgba(255,198,150,0.07)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,170,110,0.06)';
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.moveTo(v.x - w0, y0);
            ctx.quadraticCurveTo(v.x, y0 + sag0, v.x + w0, y0);
            ctx.stroke();
        }

        const sideShade = ctx.createLinearGradient(v.x - v.baseHalf, 0, v.x + v.baseHalf, 0);
        sideShade.addColorStop(0, 'rgba(0,0,0,0.40)');
        sideShade.addColorStop(0.38, 'rgba(0,0,0,0.10)');
        sideShade.addColorStop(0.72, 'rgba(0,0,0,0)');
        sideShade.addColorStop(1, 'rgba(255,150,90,0.07)');
        ctx.fillStyle = sideShade;
        ctx.fillRect(v.x - v.h, topY - 70, v.h * 2, v.h * 1.9);

        for (let sd = -1; sd <= 1; sd += 2) {
            for (let k = 0; k < 3; k++) {
                const kf = 1 - k * 0.155;
                const pts = [];
                for (let j = 0; j <= 14; j++) {
                    const u = j / 14;
                    const t = lerp(0.02, 1.0, u);
                    const bow = Math.sin(u * Math.PI);
                    pts.push({
                        x: v.x + sd * (coneW(t) * kf - bow * (26 - k * 7)),
                        y: coneY(t) - bow * (9 - k * 2.2)
                    });
                }
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                ribbonEdge(pts);
                ctx.strokeStyle = k === 0 ? 'rgba(10,5,8,0.34)' : (k === 1 ? 'rgba(255,172,112,0.06)' : 'rgba(10,5,8,0.2)');
                ctx.lineWidth = k === 0 ? 3.2 : (k === 1 ? 1.6 : 2.2);
                ctx.stroke();
            }
        }

        ctx.lineCap = 'round';
        for (let i = 0; i < 15; i++) {
            const f0 = hash(i * 3.1 + bgSeed) * 2 - 1;
            const t0 = 0.12 + hash(i * 7.3 + bgSeed) * 0.44;
            const t1 = 0.74 + hash(i * 5.9 + bgSeed) * 0.28;
            const sx = v.x + f0 * coneW(t0) * 0.9, sy = coneY(t0);
            const gx = v.x + f0 * coneW(t1) * 0.94, gy = coneY(t1);
            ctx.strokeStyle = 'rgba(12,6,9,0.32)';
            ctx.lineWidth = 2 + hash(i * 11.7 + bgSeed) * 3.4;
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.quadraticCurveTo(lerp(sx, gx, 0.5) + f0 * 14, lerp(sy, gy, 0.5), gx, gy);
            ctx.stroke();
            if (i % 3 === 0) {
                ctx.strokeStyle = 'rgba(255,160,95,0.07)';
                ctx.lineWidth = 1.6;
                ctx.beginPath();
                ctx.moveTo(sx + 3, sy + 4);
                ctx.quadraticCurveTo(lerp(sx, gx, 0.5) + f0 * 14 + 4, lerp(sy, gy, 0.5), gx - 3, gy);
                ctx.stroke();
            }
        }

        ctx.fillStyle = '#2c1920';
        ctx.beginPath();
        ctx.moveTo(v.x - v.baseHalf * 0.66, v.baseY + 46);
        ctx.quadraticCurveTo(v.x - v.baseHalf * 0.48, v.baseY - v.h * 0.34, v.x - v.baseHalf * 0.24, v.baseY - v.h * 0.46);
        ctx.quadraticCurveTo(v.x - v.baseHalf * 0.06, v.baseY - v.h * 0.30, v.x + v.baseHalf * 0.06, v.baseY + 46);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(255,160,90,0.045)';
        ctx.beginPath();
        ctx.moveTo(v.x - v.baseHalf * 0.66, v.baseY + 46);
        ctx.quadraticCurveTo(v.x - v.baseHalf * 0.48, v.baseY - v.h * 0.34, v.x - v.baseHalf * 0.24, v.baseY - v.h * 0.46);
        ctx.quadraticCurveTo(v.x - v.baseHalf * 0.42, v.baseY - v.h * 0.32, v.x - v.baseHalf * 0.58, v.baseY + 46);
        ctx.closePath();
        ctx.fill();

        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < 7; i++) {
            const sx = v.x + (hash(i * 4.9 + bgSeed) - 0.5) * v.baseHalf * 1.1;
            const sy = rimY + 40 + hash(i * 8.3 + bgSeed) * (v.h * 0.72);
            const len = 40 + hash(i * 6.1 + bgSeed) * 110;
            const flick = 0.55 + 0.45 * Math.sin(time * 2.2 + i * 1.7);
            ctx.strokeStyle = 'rgba(255,96,26,' + (0.42 * flick) + ')';
            ctx.lineWidth = 3.4;
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.quadraticCurveTo(sx + (hash(i * 2.7 + bgSeed) - 0.5) * 46, sy + len * 0.5, sx + (hash(i * 5.3 + bgSeed) - 0.5) * 70, sy + len);
            ctx.stroke();
            ctx.strokeStyle = 'rgba(255,214,150,' + (0.4 * flick) + ')';
            ctx.lineWidth = 1.3;
            ctx.stroke();
        }
        ctx.restore();

        drawConeRocks();
        drawLavaScars();

        const fieldW = v.baseHalf * 1.05;
        const fieldG = ctx.createLinearGradient(0, v.baseY - 16, 0, v.baseY + 46);
        fieldG.addColorStop(0, 'rgba(255,150,60,0.5)');
        fieldG.addColorStop(0.5, 'rgba(226,74,22,0.32)');
        fieldG.addColorStop(1, 'rgba(140,26,10,0.08)');
        ctx.fillStyle = fieldG;
        ctx.beginPath();
        ctx.moveTo(v.x - fieldW, v.baseY + 46);
        ctx.quadraticCurveTo(v.x, v.baseY - 26, v.x + fieldW, v.baseY + 46);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(38,20,20,0.55)';
        for (let i = 0; i < 12; i++) {
            const px = v.x + (hash(i * 4.3 + bgSeed) - 0.5) * fieldW * 1.8;
            const py = v.baseY - 12 + hash(i * 6.7 + bgSeed) * 44;
            ctx.beginPath();
            ctx.ellipse(px, py, 16 + hash(i * 2.1 + bgSeed) * 30, 7 + hash(i * 3.9 + bgSeed) * 12, 0.2, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();

        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        drawSprite(SPR.glowOrange, v.x, rimY + 12, 430, 0.44 + 0.09 * Math.sin(time * 3.1), false);
        drawSprite(SPR.glowYellow, v.x, rimY + 12, 210, 0.40 + 0.10 * Math.sin(time * 4.7), false);
        ctx.restore();

        ctx.fillStyle = '#34191f';
        ctx.beginPath();
        ctx.ellipse(v.x, rimY + 8, v.rimHalf * 1.2, 21, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,170,90,0.45)';
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.ellipse(v.x, rimY + 7, v.rimHalf * 1.16, 19, 0, Math.PI * 1.02, Math.PI * 1.98);
        ctx.stroke();

        const craterGrad = ctx.createLinearGradient(0, rimY - 4, 0, rimY + 26);
        craterGrad.addColorStop(0, '#ff3d0c');
        craterGrad.addColorStop(0.3, '#ff7d22');
        craterGrad.addColorStop(0.66, '#ffc04f');
        craterGrad.addColorStop(1, '#fff0ad');
        ctx.fillStyle = craterGrad;
        ctx.beginPath();
        ctx.ellipse(v.x, rimY + 10, v.rimHalf * 1.0, 15, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,250,214,0.72)';
        ctx.beginPath();
        ctx.ellipse(v.x - 8, rimY + 7, v.rimHalf * 0.46, 5.4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,120,40,0.5)';
        for (let i = 0; i < 5; i++) {
            const a = (i / 5) * Math.PI * 2 + time * 0.6;
            ctx.beginPath();
            ctx.ellipse(v.x + Math.cos(a) * v.rimHalf * 0.6, rimY + 10 + Math.sin(a) * 7, 9, 3.6, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.fillStyle = '#331b21';
        ctx.beginPath();
        ctx.ellipse(v.x, rimY + 18, v.rimHalf * 1.14, 8, 0, 0, Math.PI);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,140,60,0.32)';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.ellipse(v.x, rimY + 17.5, v.rimHalf * 1.12, 7, 0, 0, Math.PI);
        ctx.stroke();

        for (let i = 0; i < 5; i++) {
            const fx = v.x + (i - 2) * v.rimHalf * 0.52;
            drawSprite(SPR.smoke, fx + Math.sin(time * 0.8 + i) * 8, rimY - 6, 46 + i * 5, 0.16 + 0.05 * Math.sin(time * 1.6 + i), false);
        }
        ctx.restore();
    }

    function drawBombs() {
        const bs = volcano.bombs;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < bs.length; i++) {
            const p = bs[i];
            const a = clamp(p.life / p.max, 0, 1);
            drawSprite(SPR.glowOrange, p.x, p.y, p.r * 6, a * 0.55, false);
            drawSprite(SPR.glowYellow, p.x, p.y, p.r * 2.6, a * 0.8, false);
            if (p.trail.length > 1) {
                ctx.strokeStyle = 'rgba(255,150,60,0.5)';
                ctx.lineWidth = 2.4;
                ctx.beginPath();
                ctx.moveTo(p.trail[0].x, p.trail[0].y);
                for (let j = 1; j < p.trail.length; j++) ctx.lineTo(p.trail[j].x, p.trail[j].y);
                ctx.stroke();
            }
        }
        ctx.restore();
        for (let i = 0; i < bs.length; i++) {
            const p = bs[i];
            ctx.save();
            ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = '#2c1a1c';
            ctx.beginPath();
            for (let k = 0; k < 6; k++) {
                const ang = (k / 6) * Math.PI * 2;
                const r = p.r * (0.72 + hash(p.seed + k * 2.3) * 0.5);
                const x = Math.cos(ang) * r, y = Math.sin(ang) * r;
                if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,150,60,0.8)';
            ctx.lineWidth = 1.4;
            ctx.stroke();
            ctx.restore();
        }
    }

    function drawFountain() {
        const f = volcano.fountain;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < f.length; i++) {
            const p = f[i];
            const a = clamp(p.life / p.max, 0, 1);
            const sz = p.r * (3.0 + (1 - a) * 1.8);
            const flick = 0.68 + 0.5 * Math.sin(time * 26 + p.hot * 21);
            drawSprite(SPR.glowOrange, p.x, p.y, sz, a * 0.5 * flick, false);
            drawSprite(SPR.glowYellow, p.x, p.y, sz * 0.55, a * 0.75 * flick, false);
            if (a > 0.5) drawSprite(SPR.glowWhiteSoft, p.x, p.y, sz * 0.26, a * 0.5, false);
        }
        ctx.restore();
    }

    function drawSmoke() {
        const sm = volcano.smoke;
        for (let i = 0; i < sm.length; i++) {
            const p = sm[i];
            const k = clamp(p.life / p.max, 0, 1);
            drawSprite(SPR.smoke, p.x, p.y, p.r * 2.2, Math.sin(k * Math.PI) * 0.55, false);
        }
    }

    function drawAshClouds() {
        for (let i = 0; i < ashClouds.length; i++) {
            const c = ashClouds[i];
            ctx.save();
            ctx.globalAlpha = c.alpha;
            ctx.fillStyle = '#241a22';
            ctx.beginPath();
            ctx.ellipse(c.x, c.y, c.s, c.s * 0.32, 0, 0, Math.PI * 2);
            ctx.ellipse(c.x - c.s * 0.52, c.y + c.s * 0.07, c.s * 0.48, c.s * 0.19, 0, 0, Math.PI * 2);
            ctx.ellipse(c.x + c.s * 0.56, c.y + c.s * 0.05, c.s * 0.42, c.s * 0.17, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    function strokePoly(pts) {
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
        ctx.stroke();
    }

    function drawGround() {
        ctx.fillStyle = groundGrad;
        ctx.fillRect(0, GROUND_Y, W, PLAY_H - GROUND_Y + 40);

        const hg = ctx.createLinearGradient(0, GROUND_Y - 70, 0, GROUND_Y + 12);
        hg.addColorStop(0, 'rgba(255,90,30,0)');
        hg.addColorStop(1, 'rgba(255,125,45,0.26)');
        ctx.fillStyle = hg;
        ctx.fillRect(0, GROUND_Y - 70, W, 82);

        ctx.fillStyle = '#3a2320';
        ctx.fillRect(0, GROUND_Y, W, 7);
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = 'rgba(255,130,50,0.55)';
        ctx.fillRect(0, GROUND_Y - 1.2, W, 2.4);
        ctx.lineCap = 'round';
        for (let i = 0; i < cracks.length; i++) {
            const c = cracks[i];
            const pulse = 0.45 + 0.35 * Math.sin(time * c.rate + c.phase);
            ctx.strokeStyle = 'rgba(255,86,22,' + (0.26 * pulse) + ')';
            ctx.lineWidth = c.w + 5;
            strokePoly(c.pts);
            ctx.strokeStyle = 'rgba(255,196,100,' + (0.6 * pulse) + ')';
            ctx.lineWidth = c.w;
            strokePoly(c.pts);
        }
        for (let i = 0; i < pools.length; i++) {
            const p = pools[i];
            const pulse = 0.6 + 0.4 * Math.sin(time * p.rate + p.phase);
            const g = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, p.r);
            g.addColorStop(0, 'rgba(255,225,150,' + (0.72 * pulse) + ')');
            g.addColorStop(0.5, 'rgba(255,116,36,' + (0.48 * pulse) + ')');
            g.addColorStop(1, 'rgba(180,40,10,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.ellipse(p.x, p.y, p.r, p.r * 0.38, 0, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    function drawGroundDecor() {
        for (let i = 0; i < decor.length; i++) {
            const d = decor[i];
            ctx.fillStyle = '#190f13';
            if (d.type === 0) {
                ctx.beginPath();
                ctx.moveTo(d.x - d.s, GROUND_Y + 30);
                ctx.lineTo(d.x - d.s * 0.62, GROUND_Y - d.s * 0.52);
                ctx.lineTo(d.x + d.s * 0.5, GROUND_Y - d.s * 0.64);
                ctx.lineTo(d.x + d.s, GROUND_Y + 30);
                ctx.closePath();
                ctx.fill();
            } else {
                ctx.strokeStyle = '#190f13';
                ctx.lineCap = 'round';
                ctx.lineWidth = d.s * 0.24;
                ctx.beginPath();
                ctx.moveTo(d.x, GROUND_Y + 26);
                ctx.lineTo(d.x, GROUND_Y - d.s * 1.5);
                ctx.stroke();
                ctx.lineWidth = d.s * 0.13;
                for (let k = 0; k < 3; k++) {
                    const dir = k % 2 === 0 ? 1 : -1;
                    ctx.beginPath();
                    ctx.moveTo(d.x, GROUND_Y - d.s * (0.8 + k * 0.22));
                    ctx.lineTo(d.x + dir * d.s * (0.5 + k * 0.14), GROUND_Y - d.s * (1.1 + k * 0.28));
                    ctx.stroke();
                }
            }
        }
    }

    function drawEmbers() {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < embers.length; i++) {
            const e = embers[i];
            const a = clamp(e.life / 2.4, 0, 1) * 0.42 * (0.45 + 0.55 * Math.sin(time * 6 + e.seed * 7));
            drawSprite(e.spr, e.x, e.y, e.r * 3.0, a, false);
        }
        ctx.restore();
    }

    function drawRockWarnings() {
        if (state !== S_PLAY) return;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < rocks.length; i++) {
            const rk = rocks[i];
            if (rk.leaving) continue;
            const dist = GROUND_Y - rk.y;
            if (dist < 24) continue;
            const urgency = clamp(1 - dist / 520, 0.18, 1);
            const w = rk.r * (2.1 + urgency * 2.8);
            const pulse = 0.5 + 0.5 * Math.sin(time * 9 + rk.rot * 3);
            ctx.globalAlpha = 0.18 * urgency * (0.45 + pulse * 0.65);
            ctx.fillStyle = '#ff5a20';
            ctx.beginPath();
            ctx.ellipse(rk.x, GROUND_Y + 4, w, w * 0.3, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 0.45 * urgency;
            ctx.strokeStyle = 'rgba(255,170,90,0.9)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(rk.x, GROUND_Y + 4, w * 0.58, w * 0.17, 0, 0, Math.PI * 2);
            ctx.stroke();
        }
        ctx.restore();
    }

    function drawImpacts() {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < impacts.length; i++) {
            const im = impacts[i];
            const k = im.life / im.max;
            drawSprite(SPR.glowRed, im.x, im.y - 8, im.r * 9 * (1.35 - k * 0.4), k * 0.65, false);
            drawSprite(SPR.glowYellow, im.x, im.y - 8, im.r * 4 * (1.35 - k * 0.4), k * 0.8, false);
            ctx.globalAlpha = k * 0.7;
            ctx.strokeStyle = '#ffd27a';
            ctx.lineWidth = 1 + 3 * k;
            ctx.beginPath();
            ctx.ellipse(im.x, im.y, im.r * (1.7 + (1 - k) * 3.4), im.r * (0.65 + (1 - k) * 1.4), 0, 0, Math.PI * 2);
            ctx.stroke();
        }
        ctx.restore();
    }

    function drawSparks() {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < sparks.length; i++) {
            const s = sparks[i];
            drawSprite(s.spr, s.x, s.y, s.r * 4.2, clamp(s.life / s.max, 0, 1) * 0.9, false);
        }
        ctx.restore();
    }

    function drawFloaters() {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < floaters.length; i++) {
            const f = floaters[i];
            drawSprite(f.col, f.x, f.y, f.r * 4, clamp(f.life * 1.6, 0, 1), false);
        }
        ctx.restore();
    }

    function drawHearts() {
        ctx.save();
        for (let i = 0; i < hearts.length; i++) {
            const h = hearts[i];
            ctx.save();
            ctx.globalAlpha = clamp(h.life * 1.4, 0, 1);
            ctx.translate(h.x, h.y);
            ctx.rotate(h.rot);
            ctx.scale(Math.max(0.2, Math.abs(Math.cos(time * 3 + i))), 1);
            ctx.fillStyle = h.col;
            heartPath(0, 0, h.s);
            ctx.fill();
            ctx.restore();
        }
        ctx.restore();
    }

    function drawPopups() {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        for (let i = 0; i < popups.length; i++) {
            const p = popups[i];
            ctx.globalAlpha = clamp(p.life * 2, 0, 1);
            ctx.font = 'bold 26px ' + FONT_CN;
            ctx.fillStyle = p.color;
            ctx.shadowColor = 'rgba(0,0,0,0.75)';
            ctx.shadowBlur = 6;
            ctx.fillText(p.text, p.x, p.y);
        }
        ctx.restore();
        ctx.globalAlpha = 1;
    }

    function drawHeat() {
        const g = ctx.createLinearGradient(0, PLAY_H - 190, 0, PLAY_H);
        g.addColorStop(0, 'rgba(255,90,30,0)');
        g.addColorStop(1, 'rgba(255,110,40,0.14)');
        ctx.fillStyle = g;
        ctx.fillRect(0, PLAY_H - 190, W, 190);
    }

    function drawVignette() {
        ctx.fillStyle = vignetteGrad;
        ctx.fillRect(0, 0, W, PLAY_H);
    }

    // ==================== HUD ====================
    function pill(x, y, w, h, bg) {
        ctx.fillStyle = bg;
        roundRectPath(x, y, w, h, h / 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,180,120,0.16)';
        ctx.lineWidth = 1;
        roundRectPath(x + 1, y + 1, w - 2, h - 2, (h - 2) / 2);
        ctx.stroke();
    }

    function drawHud() {
        ctx.fillStyle = hudBgGrad;
        ctx.fillRect(0, PLAY_H, W, HUD_H);
        ctx.strokeStyle = 'rgba(255,120,60,0.32)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, PLAY_H + 0.5);
        ctx.lineTo(W, PLAY_H + 0.5);
        ctx.stroke();

        const pillH = 36;
        const y = PLAY_H + (HUD_H - pillH) / 2;
        ctx.font = 'bold 18px ' + FONT_CN;
        ctx.textBaseline = 'middle';

        const sp = eggSpecies;
        const label = '恐龙蛋 · ' + (sp ? sp.name : '—');
        const lw = ctx.measureText(label).width + 60;
        pill(16, y, lw, pillH, 'rgba(58, 24, 28, 0.94)');
        if (sp) drawGlyph(sp.id, 40, y + pillH / 2, 25, '#ffd966');
        ctx.textAlign = 'left';
        ctx.fillStyle = '#ffe3a8';
        ctx.fillText(label, 58, y + pillH / 2 + 1);

        const tw = 250;
        const tx = (W - tw) / 2;
        pill(tx, y, tw, pillH, 'rgba(48, 18, 20, 0.94)');
        const t = Math.max(0, roundT);
        const mm = Math.floor(t / 60), ss = Math.floor(t % 60);
        const timeStr = state === S_CUT ? '恐龙妈妈来接蛋'
            : ('喷发倒计时 ' + mm + ':' + (ss < 10 ? '0' : '') + ss);
        ctx.textAlign = 'center';
        ctx.font = 'bold 16px ' + FONT_CN;
        ctx.fillStyle = state === S_CUT ? '#8fe3c4' : '#ffb27a';
        ctx.fillText(timeStr, tx + tw / 2, y + 13);
        ctx.fillStyle = 'rgba(255,255,255,0.10)';
        roundRectPath(tx + 16, y + pillH - 13, tw - 32, 6, 3);
        ctx.fill();
        const p = state === S_CUT ? 1 : clamp(t / ROUND_TIME, 0, 1);
        ctx.fillStyle = state === S_CUT ? '#4fd6a8' : (p < 0.25 ? '#ff4d4d' : '#ff7a2a');
        roundRectPath(tx + 16, y + pillH - 13, (tw - 32) * p, 6, 3);
        ctx.fill();

        const hw = 34 + START_LIVES * 25;
        const rStr = '已拯救 ' + rescued;
        ctx.font = 'bold 18px ' + FONT_CN;
        const rw = ctx.measureText(rStr).width + 28;
        const groupW = rw + 12 + hw;
        const regionL = W / 2 + tw / 2 + 26;
        const regionR = W - 22;
        const rx = regionL + Math.max(0, (regionR - regionL - groupW)) * 0.5;
        const hx = rx + rw + 12;

        pill(rx, y, rw, pillH, 'rgba(58, 26, 30, 0.94)');
        ctx.textAlign = 'left';
        ctx.fillStyle = '#ffe3a8';
        ctx.fillText(rStr, rx + 14, y + pillH / 2 + 1);

        pill(hx, y, hw, pillH, 'rgba(58, 20, 24, 0.94)');
        for (let i = 0; i < START_LIVES; i++) {
            const hcx = hx + (hw - (START_LIVES - 1) * 25) / 2 + i * 25;
            const hcy = y + pillH / 2;
            ctx.save();
            ctx.globalAlpha = i < lives ? 1 : 0.22;
            ctx.fillStyle = i < lives ? '#ff6b81' : '#7a4a52';
            heartPath(hcx, hcy, 9);
            ctx.fill();
            ctx.restore();
        }

        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
    }

    function drawBanner() {
        if (!banner) return;
        const inA = clamp((banner.max - banner.life) / 0.3, 0, 1);
        const outA = clamp(banner.life / 0.6, 0, 1);
        const a = Math.min(inA, outA);
        if (a <= 0.01) return;
        ctx.save();
        ctx.globalAlpha = a;
        ctx.font = 'bold 34px ' + FONT_CN;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const tw = ctx.measureText(banner.text).width;
        const y = 88;
        ctx.fillStyle = 'rgba(26,8,10,0.74)';
        roundRectPath(W / 2 - tw / 2 - 28, y - 27, tw + 56, 54, 27);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,150,90,0.5)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#ffe0a8';
        ctx.fillText(banner.text, W / 2, y + 2);
        ctx.restore();
    }

    function drawTitle() {
        ctx.save();
        ctx.fillStyle = 'rgba(10,4,6,0.58)';
        ctx.fillRect(0, 0, W, PLAY_H);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const pulse = 1 + 0.02 * Math.sin(time * 2);
        ctx.save();
        ctx.translate(W / 2, 176);
        ctx.scale(pulse, pulse);
        ctx.font = 'bold 66px ' + FONT_CN;
        ctx.fillStyle = '#ff9c3e';
        ctx.shadowColor = 'rgba(255,80,20,0.85)';
        ctx.shadowBlur = 26;
        ctx.fillText('火山护蛋记', 0, 0);
        ctx.restore();
        ctx.shadowBlur = 0;
        ctx.font = '21px ' + FONT_CN;
        ctx.fillStyle = 'rgba(255,228,205,0.92)';
        ctx.fillText('左右移动躲避从天而降的火山石，抱着恐龙蛋坚持一分钟', W / 2, 228);
        ctx.fillText('火山平静后，恐龙妈妈会来接走恐龙蛋并说声谢谢', W / 2, 260);
        ctx.font = 'bold 22px ' + FONT_CN;
        ctx.fillStyle = '#ffd966';
        ctx.globalAlpha = 0.55 + 0.45 * Math.sin(time * 3);
        ctx.fillText('按 空格 / 点击屏幕 开始', W / 2, 356);
        ctx.globalAlpha = 1;
        ctx.font = '18px ' + FONT_CN;
        ctx.fillStyle = 'rgba(255,214,170,0.85)';
        ctx.fillText('恐龙图鉴：', W / 2, 418);
        const n = SPECIES.length, step = 126, x0 = W / 2 - (n - 1) * step / 2;
        for (let i = 0; i < n; i++) {
            drawGlyph(SPECIES[i].id, x0 + i * step, 458, 34, '#ffcf8a');
            ctx.font = '15px ' + FONT_CN;
            ctx.fillStyle = 'rgba(255,226,190,0.85)';
            ctx.fillText(SPECIES[i].name, x0 + i * step, 492);
        }
        ctx.restore();
    }

    function drawGameOver() {
        ctx.save();
        ctx.fillStyle = 'rgba(8,3,5,0.76)';
        ctx.fillRect(0, 0, W, PLAY_H);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = 'bold 58px ' + FONT_CN;
        ctx.fillStyle = '#ff8a5c';
        ctx.fillText('游戏结束', W / 2, 158);
        ctx.font = '24px ' + FONT_CN;
        ctx.fillStyle = 'rgba(255,232,208,0.94)';
        ctx.fillText('坚持了 ' + roundIndex + ' 轮 · 成功护送 ' + rescued + ' 颗恐龙蛋', W / 2, 218);
        const ids = savedSpecies;
        if (ids.length === 0) {
            ctx.font = '20px ' + FONT_CN;
            ctx.fillStyle = 'rgba(255,214,180,0.7)';
            ctx.fillText('还没有成功护送任何恐龙蛋…', W / 2, 300);
        } else {
            const step = Math.min(140, 900 / ids.length);
            const x0 = W / 2 - (ids.length - 1) * step / 2;
            ctx.font = '15px ' + FONT_CN;
            for (let i = 0; i < ids.length; i++) {
                const s = SPECIES_MAP[ids[i]];
                if (!s) continue;
                drawGlyph(s.id, x0 + i * step, 292, 34, '#ffd966');
                ctx.fillStyle = '#ffe3a8';
                ctx.fillText(s.name, x0 + i * step, 326);
            }
        }
        ctx.font = 'bold 22px ' + FONT_CN;
        ctx.fillStyle = '#ffd966';
        ctx.globalAlpha = 0.55 + 0.45 * Math.sin(time * 3.2);
        ctx.fillText('按 R / 点击屏幕 重新开始', W / 2, 402);
        ctx.restore();
    }

    // ==================== 主循环 ====================
    function update(dt) {
        time += dt;
        updateAmbient(dt);

        if (state === S_PLAY) {
            updatePlayer(dt, true);
            roundT -= dt;
            if (roundT <= 0) { roundT = 0; beginCutscene(); }
            if (state === S_PLAY) {
                spawnTimer -= dt;
                if (spawnTimer <= 0) {
                    spawnTimer = spawnInterval();
                    let burst = 1;
                    if (roundIndex >= 1 && Math.random() < Math.min(0.92, roundIndex * 0.2)) burst++;
                    if (roundIndex >= 4 && Math.random() < Math.min(0.7, (roundIndex - 3) * 0.14)) burst++;
                    if (roundIndex >= 7 && Math.random() < Math.min(0.5, (roundIndex - 6) * 0.1)) burst++;
                    let lastX = W / 2;
                    for (let b = 0; b < burst && rocks.length < MAX_ROCKS; b++) {
                        const nx = b === 0
                            ? 50 + Math.random() * (W - 100)
                            : clamp(lastX + (Math.random() < 0.5 ? -1 : 1) * (110 + Math.random() * 210), 46, W - 46);
                        lastX = nx;
                        spawnRock(nx);
                    }
                }
            }
        } else if (state === S_CUT) {
            updatePlayer(dt, false);
            updateCutscene(dt);
        } else {
            updatePlayer(dt, false);
        }

        updateRocks(dt);
        updateSparks(dt);
        updateImpacts(dt);
        updateFloaters(dt);
        updateHearts(dt);
        updatePopups(dt);
    }

    function draw() {
        applyCanvasTransform();
        ctx.clearRect(0, 0, W, H);

        ctx.save();
        if (shake > 0.3) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake * 0.7);

        drawSky();
        drawFarRidge(7.7, GROUND_Y - 104, 58, '#3a1e28', 14);
        drawAshClouds();
        drawSmoke();
        drawVolcano();
        drawFarRidge(3.3, GROUND_Y - 58, 36, '#25131f', 11);
        drawFountain();
        drawBombs();
        drawGround();
        drawGroundDecor();
        drawEmbers();
        drawRockWarnings();
        drawImpacts();
        for (let i = 0; i < rocks.length; i++) drawRock(rocks[i]);
        drawSparks();
        drawFloaters();

        if (state === S_CUT) {
            drawCutscene();
        } else {
            drawPlayerShadow();
            drawPlayer();
        }
        drawHearts();
        drawHeat();
        ctx.restore();

        drawVignette();

        if (flash > 0.004) {
            ctx.fillStyle = 'rgba(255,70,30,' + (flash * 0.42) + ')';
            ctx.fillRect(0, 0, W, PLAY_H);
        }

        drawPopups();
        drawBanner();
        if (state === S_TITLE) drawTitle();
        if (state === S_OVER) drawGameOver();
        drawHud();
    }

    let lastTime = 0;
    function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        let dt = (timestamp - lastTime) / 1000;
        lastTime = timestamp;
        if (dt > 0.1) dt = 0.1;
        if (dt < 0.001) dt = 0.001;
        pollGamepad();
        update(dt);
        draw();
        requestAnimationFrame(gameLoop);
    }

    // ==================== 初始化 ====================
    function initScenery() {
        volcano.side = Math.random() < 0.5 ? -1 : 1;
        volcano.x = W * 0.5;
        volcano.craterY = volcano.baseY - volcano.h + 12;
        bgSeed = Math.random() * 1000;
        makeConeDetail();

        cracks = [];
        for (let i = 0; i < 16; i++) {
            const pts = [];
            let x = hash(i * 7.3 + bgSeed) * W;
            let y = GROUND_Y + 12 + hash(i * 3.7 + bgSeed) * 76;
            let dir = (hash(i * 5.1 + bgSeed) - 0.5) * 0.9;
            const n = 4 + Math.floor(hash(i * 2.3 + bgSeed) * 4);
            for (let k = 0; k < n; k++) {
                pts.push({ x: x, y: y });
                dir += (hash(i * 11.3 + k * 3.1 + bgSeed) - 0.5) * 0.9;
                x += Math.cos(dir) * 42;
                y += Math.abs(Math.sin(dir)) * 15 + 5;
            }
            cracks.push({
                pts: pts, w: 1.4 + hash(i * 1.7 + bgSeed) * 2.2,
                rate: 0.8 + hash(i * 4.4 + bgSeed) * 1.6, phase: hash(i * 9.9 + bgSeed) * 6.28
            });
        }

        pools = [];
        for (let i = 0; i < 4; i++) {
            pools.push({
                x: 80 + hash(i * 6.1 + bgSeed) * (W - 160),
                y: GROUND_Y + 32 + hash(i * 8.3 + bgSeed) * 58,
                r: 26 + hash(i * 3.9 + bgSeed) * 40,
                rate: 0.9 + hash(i * 2.1 + bgSeed) * 1.4, phase: hash(i * 7.7 + bgSeed) * 6.28
            });
        }

        decor = [];
        for (let i = 0; i < 15; i++) {
            decor.push({
                x: hash(i * 5.7 + bgSeed + 3) * W,
                s: 9 + hash(i * 2.9 + bgSeed) * 17,
                type: hash(i * 3.3 + bgSeed) < 0.62 ? 0 : 1
            });
        }

        ashClouds = [];
        for (let i = 0; i < 6; i++) {
            ashClouds.push({
                x: hash(i * 4.1 + bgSeed) * W,
                y: 70 + hash(i * 6.3 + bgSeed) * 290,
                s: 90 + hash(i * 8.7 + bgSeed) * 130,
                alpha: 0.14 + hash(i * 5.5 + bgSeed) * 0.2,
                speed: (hash(i * 9.1 + bgSeed) - 0.5) * 11
            });
        }

        embers = [];
        for (let i = 0; i < 46; i++) {
            const r = Math.random();
            embers.push({
                x: Math.random() * W, y: Math.random() * GROUND_Y,
                vy: 20 + Math.random() * 64, vx: (Math.random() - 0.5) * 30,
                life: Math.random() * 6, r: 1.5 + Math.random() * 3,
                seed: Math.random() * 10,
                spr: r < 0.45 ? SPR.glowYellow : (r < 0.78 ? SPR.glowOrange : SPR.glowWhite)
            });
        }
    }

    buildSprites();
    rebuildGradients();
    initScenery();
    shuffleBag();
    eggSpecies = nextSpecies();
    discovered[eggSpecies.id] = true;
    updateFullscreenButton();
    resizeCanvas();
    requestAnimationFrame(() => { resizeCanvas(); requestAnimationFrame(resizeCanvas); });
    requestAnimationFrame(gameLoop);
})();
</script>
</body>
