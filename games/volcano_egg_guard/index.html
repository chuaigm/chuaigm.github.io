<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>火山护蛋记</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            background: #12080c;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Microsoft YaHei', 'PingFang SC', 'Courier New', monospace;
        }
        .game-container {
            background: #1a0c10;
            padding: 0;
            border-radius: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
            max-height: 100%;
            transition: border-radius 0.2s;
        }
        .canvas-wrap {
            position: relative;
            width: 100%;
            max-width: 1280px;
            line-height: 0;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1280 / 720;
            border-radius: 0;
            box-shadow: none;
            touch-action: none;
        }
        .fullscreen-btn {
            position: absolute;
            top: 6px; right: 6px;
            width: 30px; height: 30px;
            min-width: 30px; min-height: 30px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.45);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            transition: background 0.15s, color 0.15s, transform 0.1s;
            z-index: 10; padding: 0; outline: none;
        }
        .fullscreen-btn:hover { background: rgba(255, 255, 255, 0.18); color: rgba(255, 255, 255, 0.8); }
        .fullscreen-btn:active { background: rgba(255, 255, 255, 0.28); color: #ffffff; transform: scale(0.92); }
        .fullscreen-btn svg { width: 15px; height: 15px; display: block; pointer-events: none; }
        @media (max-width: 720px) {
            .fullscreen-btn { width: 26px; height: 26px; top: 5px; right: 5px; border-radius: 7px; }
            .fullscreen-btn svg { width: 13px; height: 13px; }
        }
        .game-container.is-fullscreen {
            width: 100vw; height: 100vh;
            max-width: none; max-height: none;
            border-radius: 0; padding: 0; background: #000;
            justify-content: center; align-items: center;
        }
        .game-container.is-fullscreen .canvas-wrap {
            width: 100%; height: 100%; max-width: none;
            display: flex; align-items: center; justify-content: center;
        }
        .game-container.is-fullscreen canvas {
            width: auto !important;
            height: auto !important;
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 1280 / 720;
            border-radius: 0; box-shadow: none;
        }
        .game-container.is-fullscreen .fullscreen-btn {
            top: 8px; right: 8px;
            background: rgba(255, 255, 255, 0.10);
            color: rgba(255, 255, 255, 0.55);
            z-index: 30;
        }
    </style>
</head>
<body>
<div class="game-container" id="gameContainer">
    <div class="canvas-wrap" id="canvasWrap">
        <canvas id="gameCanvas" width="1280" height="720"></canvas>
        <button class="fullscreen-btn" id="fullscreenBtn" aria-label="全屏" title="全屏">
            <svg id="fsIconExpand" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 9V4h5"/><path d="M20 9V4h-5"/>
                <path d="M4 15v5h5"/><path d="M20 15v5h-5"/>
            </svg>
            <svg id="fsIconCompress" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
                 style="display:none;">
                <path d="M9 4v5H4"/><path d="M15 4v5h5"/>
                <path d="M9 20v-5H4"/><path d="M15 20v-5h5"/>
            </svg>
        </button>
    </div>
</div>
<script>
(function() {
    'use strict';

    const VERSION = '20261012';

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('gameContainer');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const fsIconExpand = document.getElementById('fsIconExpand');
    const fsIconCompress = document.getElementById('fsIconCompress');

    // ==================== 常量 ====================
    const W = 1280, H = 720;
    const HUD_H = 56;
    const PLAY_H = H - HUD_H;
    const GROUND_H = 104;
    const GROUND_Y = PLAY_H - GROUND_H;

    const PLAYER_H = 112;
    const PLAYER_W = 54;
    const MOVE_SPEED = 330;
    const MOVE_ACCEL = 2600;

    const ROUND_TIME = 50;
    const START_LIVES = 3;
    const INVULN_TIME = 1.8;

    const ROCK_GRAVITY_BASE = 430;
    const ROCK_VY_BASE = 70;
    const MAX_ROCKS = 22;
    const TRAIL_LIFE = 0.5;
    const TRAIL_STEP = 0.009;

    const S_TITLE = 0, S_PLAY = 1, S_CUT = 2, S_OVER = 3;

    const FONT_MONO = '"Courier New", Courier, monospace';
    const FONT_CN = '"Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif';

    // ==================== 工具 ====================
    function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

    function hash(n) {
        const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
    }

    function roundRectPath(x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }

    function traceEggPath(w, h) {
        const hw = w / 2, hh = h / 2;
        const wy = hh * 0.28;
        ctx.moveTo(0, -hh);
        ctx.bezierCurveTo(hw * 0.55, -hh, hw * 1.05, -hh * 0.30, hw, wy);
        ctx.bezierCurveTo(hw * 0.97, hh * 0.80, hw * 0.50, hh, 0, hh);
        ctx.bezierCurveTo(-hw * 0.50, hh, -hw * 0.97, hh * 0.80, -hw, wy);
        ctx.bezierCurveTo(-hw * 1.05, -hh * 0.30, -hw * 0.55, -hh, 0, -hh);
        ctx.closePath();
    }

    function heartPath(cx, cy, s) {
        ctx.beginPath();
        ctx.moveTo(cx, cy + s * 0.78);
        ctx.bezierCurveTo(cx - s * 1.22, cy - s * 0.12, cx - s * 0.56, cy - s * 1.08, cx, cy - s * 0.42);
        ctx.bezierCurveTo(cx + s * 0.56, cy - s * 1.08, cx + s * 1.22, cy - s * 0.12, cx, cy + s * 0.78);
        ctx.closePath();
    }

    function limb(x1, y1, x2, y2, x3, y3, w, color) {
        ctx.strokeStyle = color;
        ctx.lineWidth = w;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineTo(x3, y3);
        ctx.stroke();
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x2, y2, w * 0.5, 0, Math.PI * 2);
        ctx.fill();
    }

    // ==================== 精灵预渲染 ====================
    const SPR = {};
    function radialSprite(size, stops) {
        const c = document.createElement('canvas');
        c.width = size; c.height = size;
        const g = c.getContext('2d');
        const r = size / 2;
        const gr = g.createRadialGradient(r, r, 0, r, r, r);
        for (let i = 0; i < stops.length; i++) gr.addColorStop(stops[i][0], stops[i][1]);
        g.fillStyle = gr;
        g.fillRect(0, 0, size, size);
        return c;
    }

    function buildSprites() {
        SPR.glowWhite = radialSprite(96, [
            [0, 'rgba(255,255,255,1)'], [0.25, 'rgba(255,248,214,0.75)'],
            [0.55, 'rgba(255,200,110,0.28)'], [1, 'rgba(255,160,60,0)']
        ]);
        SPR.glowYellow = radialSprite(96, [
            [0, 'rgba(255,246,200,0.95)'], [0.3, 'rgba(255,206,90,0.55)'],
            [0.65, 'rgba(255,140,40,0.2)'], [1, 'rgba(255,90,20,0)']
        ]);
        SPR.glowOrange = radialSprite(96, [
            [0, 'rgba(255,190,110,0.9)'], [0.28, 'rgba(255,130,50,0.6)'],
            [0.6, 'rgba(220,60,20,0.24)'], [1, 'rgba(150,20,10,0)']
        ]);
        SPR.glowRed = radialSprite(96, [
            [0, 'rgba(255,140,90,0.85)'], [0.32, 'rgba(230,60,35,0.5)'],
            [0.65, 'rgba(150,20,15,0.18)'], [1, 'rgba(90,10,10,0)']
        ]);
        SPR.glowWhiteSoft = radialSprite(96, [
            [0, 'rgba(255,255,255,0.9)'], [0.35, 'rgba(255,255,255,0.32)'],
            [1, 'rgba(255,255,255,0)']
        ]);
        SPR.smoke = radialSprite(160, [
            [0, 'rgba(122,102,98,0.95)'], [0.4, 'rgba(88,72,74,0.66)'],
            [0.74, 'rgba(58,46,52,0.26)'], [1, 'rgba(44,34,42,0)']
        ]);
    }

    function drawSprite(img, x, y, size, alpha, lighter) {
        if (alpha <= 0.004) return;
        ctx.save();
        if (lighter) ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = clamp(alpha, 0, 1);
        ctx.drawImage(img, x - size / 2, y - size / 2, size, size);
        ctx.restore();
    }

    // ==================== 全屏控制 ====================
    const fullscreenApi = {
        request: () => {
            const el = document.documentElement;
            if (el.requestFullscreen) return el.requestFullscreen();
            if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
            if (el.msRequestFullscreen) return el.msRequestFullscreen();
        },
        exit: () => {
            if (document.exitFullscreen) return document.exitFullscreen();
            if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
            if (document.msExitFullscreen) return document.msExitFullscreen();
        },
        isFullscreen: () => !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement)
    };

    function updateFullscreenButton() {
        const fs = fullscreenApi.isFullscreen();
        if (fs) {
            fsIconExpand.style.display = 'none';
            fsIconCompress.style.display = 'block';
            fullscreenBtn.setAttribute('aria-label', '退出全屏');
            fullscreenBtn.setAttribute('title', '退出全屏');
        } else {
            fsIconExpand.style.display = 'block';
            fsIconCompress.style.display = 'none';
            fullscreenBtn.setAttribute('aria-label', '全屏');
            fullscreenBtn.setAttribute('title', '全屏');
        }
    }

    function toggleFullscreen() {
        if (fullscreenApi.isFullscreen()) fullscreenApi.exit();
        else fullscreenApi.request();
    }

    fullscreenBtn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); toggleFullscreen(); });
    fullscreenBtn.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
    fullscreenBtn.addEventListener('touchend', (e) => e.stopPropagation(), { passive: true });

    function onFullscreenChange() {
        const fs = fullscreenApi.isFullscreen();
        container.classList.toggle('is-fullscreen', fs);
        updateFullscreenButton();
        setTimeout(scheduleResize, 60);
        setTimeout(scheduleResize, 200);
        setTimeout(scheduleResize, 500);
    }
    document.addEventListener('fullscreenchange', onFullscreenChange);
    document.addEventListener('webkitfullscreenchange', onFullscreenChange);
    document.addEventListener('msfullscreenchange', onFullscreenChange);

    // ==================== 画布适配 ====================
    function applyCanvasTransform() {
        ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    }

    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        const availWidth = window.innerWidth;
        const availHeight = window.innerHeight;
        const availWidthFromHeight = availHeight * (W / H);
        let cssW = Math.min(availWidth, availWidthFromHeight);
        if (!fullscreenApi.isFullscreen()) cssW = Math.min(cssW, 1280);
        if (!isFinite(cssW) || cssW < 100) cssW = Math.max(100, Math.min(availWidth, 1280));
        const cssH = cssW * (H / W);
        canvas.style.width = cssW + 'px';
        canvas.style.height = cssH + 'px';
        canvas.width = Math.round(cssW * dpr);
        canvas.height = Math.round(cssH * dpr);
        applyCanvasTransform();
    }

    let resizeScheduled = false;
    function scheduleResize() {
        if (resizeScheduled) return;
        resizeScheduled = true;
        requestAnimationFrame(() => { resizeScheduled = false; resizeCanvas(); });
    }
    window.addEventListener('resize', scheduleResize);
    window.addEventListener('orientationchange', () => { setTimeout(scheduleResize, 120); setTimeout(scheduleResize, 350); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleResize);

    // ==================== 恐龙图鉴 ====================
    const SPECIES = [
        {
            id: 'trike', name: '三角龙', scale: 1.02, flying: false, speed: 258, anchor: [41, -58], stand: 120, eggScale: 1.0,
            pal: { body: '#79d8a8', belly: '#e6f9ef', dark: '#4aa57f', deep: '#3a8a69', accent: '#ffb3a0', extra: '#fff6df' },
            egg: { shell: '#f9efd6', spot: '#79d8a8', deep: '#dcc79a' }
        },
        {
            id: 'stego', name: '剑龙', scale: 0.98, flying: false, speed: 246, anchor: [41, -53], stand: 120, eggScale: 1.0,
            pal: { body: '#9aa7d6', belly: '#e4e9f9', dark: '#5f6ca4', deep: '#495384', accent: '#ff9f68', extra: '#ffc94d' },
            egg: { shell: '#f6f1e2', spot: '#9aa7d6', deep: '#d8cfb4' }
        },
        {
            id: 'trex', name: '霸王龙', scale: 1.16, flying: false, speed: 300, anchor: [26, -72], stand: 142, eggScale: 1.0,
            pal: { body: '#93c465', belly: '#e3f1c8', dark: '#5e9042', deep: '#497335', accent: '#a9d67c', extra: '#fff8ea' },
            egg: { shell: '#f7f0d2', spot: '#8fbf63', deep: '#d9cb9c' }
        },
        {
            id: 'plesio', name: '蛇颈龙', scale: 1.00, flying: true, speed: 330, anchor: [22, -54], stand: 132, eggScale: 1.0,
            pal: { body: '#71d7d7', belly: '#d9f8f8', dark: '#3fa3ae', deep: '#2e8791', accent: '#ffb0cd', extra: '#bff0ef' },
            egg: { shell: '#eaf8f7', spot: '#71d7d7', deep: '#bfe4e2' }
        },
        {
            id: 'ptero', name: '翼龙', scale: 1.12, flying: true, speed: 362, anchor: [14, -30], stand: 124, eggScale: 0.85,
            pal: { body: '#c08ef5', belly: '#eedeff', dark: '#8d5bd6', deep: '#6d42b0', accent: '#ff85ad', extra: '#f2dfff' },
            egg: { shell: '#f6ecff', spot: '#c08ef5', deep: '#d9c6ef' }
        },
        {
            id: 'raptor', name: '迅猛龙', scale: 0.94, flying: false, speed: 348, anchor: [22, -66], stand: 132, eggScale: 0.95,
            pal: { body: '#f7a44e', belly: '#ffe6bf', dark: '#cb6c22', deep: '#a8521a', accent: '#ff6f6f', extra: '#fff0d0' },
            egg: { shell: '#fdefd4', spot: '#f7a44e', deep: '#e2c9a0' }
        },
        {
            id: 'diplo', name: '梁龙', scale: 1.00, flying: false, speed: 232, anchor: [34, -58], stand: 178, eggScale: 1.0,
            pal: { body: '#7cb7ad', belly: '#d4eee8', dark: '#4e8b82', deep: '#3a6f68', accent: '#a9dad1', extra: '#e8f7f3' },
            egg: { shell: '#eef7f3', spot: '#7cb7ad', deep: '#c3ddd7' }
        },
        {
            id: 'brachio', name: '腕龙', scale: 1.10, flying: false, speed: 218, anchor: [38, -70], stand: 152, eggScale: 1.05,
            pal: { body: '#e2aa6e', belly: '#f9e8cc', dark: '#b17c46', deep: '#8c6034', accent: '#cb9359', extra: '#fff0d8' },
            egg: { shell: '#fcf1dc', spot: '#e2aa6e', deep: '#e3cfa6' }
        }
    ];
    const SPECIES_MAP = {};
    for (let i = 0; i < SPECIES.length; i++) SPECIES_MAP[SPECIES[i].id] = SPECIES[i];

    // ==================== 游戏状态 ====================
    let state = S_TITLE;
    let time = 0;
    let roundT = ROUND_TIME;
    let roundIndex = 0;
    let lives = START_LIVES;
    let rescued = 0;
    let spawnTimer = 1.2;
    let shake = 0;
    let flash = 0;
    let bgSeed = Math.random() * 1000;
    let bag = [];
    let savedSpecies = [];
    let eggSpecies = null;
    let cut = null;
    let banner = null;
    let discovered = {};

    let rocks = [];
    let sparks = [];
    let impacts = [];
    let floaters = [];
    let popups = [];
    let embers = [];
    let hearts = [];
    let ashClouds = [];
    let cracks = [];
    let lavaScars = [];
    let coneRocks = [];
    let pools = [];
    let decor = [];

    const player = {
        x: W / 2, vx: 0, facing: 1, walkPhase: 0, invul: 0, moving: false, breathe: 0
    };

    const keys = { ArrowLeft: false, ArrowRight: false, Space: false, KeyA: false, KeyD: false, KeyR: false };
    const touchStates = new Map();

    const volcano = {
        x: W * 0.5, side: -1, baseY: GROUND_Y + 26,
        h: 456, baseHalf: 470, rimHalf: 86,
        fountain: [], smoke: [], bombs: [], emitT: 0, smokeT: 0, bombT: 0, puff: 0, shake: 0
    };

    // ==================== 输入 ====================
    window.addEventListener('keydown', (e) => {
        const key = e.key;
        if (key === 'ArrowLeft' || key === 'ArrowRight' || key === ' ') e.preventDefault();
        ensureAudio();
        if (key === 'ArrowLeft' || key === 'a' || key === 'A') keys.ArrowLeft = true;
        else if (key === 'ArrowRight' || key === 'd' || key === 'D') keys.ArrowRight = true;
        else if (key === ' ') {
            if (!keys.Space) onConfirm();
            keys.Space = true;
        } else if (key === 'r' || key === 'R') {
            if (!keys.KeyR) onRestart();
            keys.KeyR = true;
        } else if (key === 'Enter') onConfirm();
    });

    window.addEventListener('keyup', (e) => {
        const key = e.key;
        if (key === 'ArrowLeft' || key === 'a' || key === 'A') keys.ArrowLeft = false;
        else if (key === 'ArrowRight' || key === 'd' || key === 'D') keys.ArrowRight = false;
        else if (key === ' ') keys.Space = false;
        else if (key === 'r' || key === 'R') keys.KeyR = false;
    });

    function touchActionFromPoint(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) return null;
        const lx = (clientX - rect.left) * (W / rect.width);
        if (lx < 0 || lx >= W) return null;
        const ly = (clientY - rect.top) * (H / rect.height);
        return lx < W / 2 ? 'left' : 'right';
    }

    let touchLeft = false, touchRight = false;
    function refreshTouchFlags() {
        touchLeft = false; touchRight = false;
        for (const s of touchStates.values()) {
            if (s.action === 'left') touchLeft = true;
            else if (s.action === 'right') touchRight = true;
        }
    }

    function onCanvasDown(e) {
        ensureAudio();
        let consumed = false;
        for (let i = 0; i < e.changedTouches.length; i++) {
            const t = e.changedTouches[i];
            const a = touchActionFromPoint(t.clientX, t.clientY);
            if (!a) continue;
            consumed = true;
            touchStates.set(t.identifier, { action: a });
        }
        if (state === S_TITLE || state === S_OVER) onConfirm();
        if (consumed) { e.preventDefault(); refreshTouchFlags(); }
    }

    function onTouchEnd(e) {
        let changed = false;
        for (let i = 0; i < e.changedTouches.length; i++) {
            const t = e.changedTouches[i];
            if (touchStates.has(t.identifier)) { touchStates.delete(t.identifier); changed = true; }
        }
        if (changed) { e.preventDefault(); refreshTouchFlags(); }
    }

    canvas.addEventListener('touchstart', onCanvasDown, { passive: false });
    canvas.addEventListener('touchend', onTouchEnd, { passive: false });
    canvas.addEventListener('touchcancel', onTouchEnd, { passive: false });
    canvas.addEventListener('mousedown', (e) => {
        if (e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents) return;
        ensureAudio();
        if (state === S_TITLE || state === S_OVER) onConfirm();
        else {
            const a = touchActionFromPoint(e.clientX, e.clientY);
            if (a) { touchStates.set('mouse', { action: a }); refreshTouchFlags(); }
        }
    });
    window.addEventListener('mouseup', () => { if (touchStates.has('mouse')) { touchStates.delete('mouse'); refreshTouchFlags(); } });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    window.addEventListener('blur', () => {
        keys.ArrowLeft = false; keys.ArrowRight = false; keys.Space = false; keys.KeyR = false;
        touchStates.clear(); touchLeft = false; touchRight = false;
    });

    // ==================== 手柄 ====================
    let gamepadConnected = false;
    let gamepadLeft = false, gamepadRight = false, gamepadA = false, gamepadB = false, gamepadStart = false;
    let prevA = false, prevB = false, prevStart = false;

    function pollGamepad() {
        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        let gp = null;
        for (let i = 0; i < gamepads.length; i++) {
            if (gamepads[i] && gamepads[i].connected) { gp = gamepads[i]; break; }
        }
        if (gp && !gamepadConnected) gamepadConnected = true;
        else if (!gp && gamepadConnected) {
            gamepadConnected = false;
            gamepadLeft = gamepadRight = gamepadA = gamepadB = false;
            prevA = prevStart = false;
        }
        if (!gp) { gamepadLeft = gamepadRight = gamepadA = gamepadB = false; return; }
        const b = gp.buttons;
        gamepadLeft = !!(b[14] && (b[14].pressed || b[14].value > 0.5));
        gamepadRight = !!(b[15] && (b[15].pressed || b[15].value > 0.5));
        if (gp.axes && gp.axes.length > 0) {
            if (gp.axes[0] < -0.5) gamepadLeft = true;
            if (gp.axes[0] > 0.5) gamepadRight = true;
        }
        const aPressed = !!(b[0] && (b[0].pressed || b[0].value > 0.5));
        if (aPressed && !prevA) onConfirm();
        prevA = aPressed;
        gamepadA = aPressed;
        const bPressed = !!(b[1] && (b[1].pressed || b[1].value > 0.5));
        if (bPressed && !prevB) onRestart();
        prevB = bPressed;
        gamepadB = bPressed;
        const startPressed = !!(b[9] && (b[9].pressed || b[9].value > 0.5));
        if (startPressed && !prevStart) onRestart();
        prevStart = startPressed;
    }

    // ==================== 音效 ====================
    let audioCtx = null;
    function ensureAudio() {
        if (!audioCtx) {
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    function tone(freq, dur, type, vol, delay, slideTo, slideDur) {
        if (!audioCtx) return;
        const t0 = audioCtx.currentTime + (delay || 0);
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, t0);
        if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + (slideDur || dur));
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.02, dur * 0.3));
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t0);
        osc.stop(t0 + dur + 0.02);
    }

    function noise(dur, freq, q, vol, delay) {
        if (!audioCtx) return;
        const t0 = audioCtx.currentTime + (delay || 0);
        const len = Math.max(0.05, dur);
        const buf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * len), audioCtx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        const flt = audioCtx.createBiquadFilter();
        flt.type = 'bandpass';
        flt.frequency.value = freq;
        flt.Q.value = q;
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(vol, t0);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + len);
        src.connect(flt); flt.connect(g); g.connect(audioCtx.destination);
        src.start(t0);
        src.stop(t0 + len);
    }

    function sfxStart() {
        ensureAudio();
        const notes = [392, 523, 659, 784];
        for (let i = 0; i < notes.length; i++) tone(notes[i], 0.34, 'triangle', 0.12, i * 0.1);
        tone(196, 0.7, 'sine', 0.10, 0.0);
    }

    function sfxHit() {
        ensureAudio();
        noise(0.42, 900, 0.7, 0.34);
        tone(150, 0.42, 'sawtooth', 0.18, 0, 44, 0.4);
        tone(88, 0.55, 'sine', 0.22, 0.02, 38, 0.5);
    }

    function sfxImpact() {
        ensureAudio();
        noise(0.20, 1800, 0.9, 0.10);
        tone(220, 0.16, 'triangle', 0.05, 0, 90, 0.15);
    }

    function sfxCalm() {
        ensureAudio();
        tone(660, 0.5, 'sine', 0.10, 0, 330, 0.45);
        tone(990, 0.7, 'sine', 0.07, 0.08, 440, 0.6);
        noise(0.9, 320, 0.6, 0.09, 0);
    }

    function sfxThanks() {
        ensureAudio();
        const notes = [523, 659, 784, 1047];
        for (let i = 0; i < notes.length; i++) tone(notes[i], 0.42, 'triangle', 0.11, i * 0.11);
        tone(261, 0.9, 'sine', 0.08, 0.05);
    }

    function sfxHeart() {
        ensureAudio();
        tone(880, 0.18, 'sine', 0.07, 0, 1320, 0.16);
    }

    function sfxOver() {
        ensureAudio();
        const notes = [440, 349, 261, 196];
        for (let i = 0; i < notes.length; i++) tone(notes[i], 0.45, 'triangle', 0.12, i * 0.16);
        noise(1.0, 240, 0.6, 0.12, 0.2);

    // ==================== 回合与流程 ====================
    function shuffleBag() {
        bag = [];
        for (let i = 0; i < SPECIES.length; i++) bag.push(i);
        for (let i = bag.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const tmp = bag[i]; bag[i] = bag[j]; bag[j] = tmp;
        }
    }

    function nextSpecies() {
        if (bag.length === 0) shuffleBag();
        return SPECIES[bag.pop()];
    }

    function startGame() {
        state = S_PLAY;
        time = 0;
        roundT = ROUND_TIME;
        roundIndex = 0;
        lives = START_LIVES;
        rescued = 0;
        spawnTimer = 1.4;
        rocks = []; sparks = []; impacts = []; floaters = []; popups = [];
        hearts = []; cut = null; banner = null;
        discovered = {};
        savedSpecies = [];
        player.x = W / 2; player.vx = 0; player.facing = 1; player.invul = 0;
        eggSpecies = nextSpecies();
        discovered[eggSpecies.id] = true;
        shake = 0; flash = 0;
        sfxStart();
        showBanner('火山爆发！保护恐龙蛋！', 2.2);
    }

    function onConfirm() {
        if (state === S_TITLE || state === S_OVER) startGame();
    }

    function onRestart() {
        if (state === S_OVER || state === S_PLAY || state === S_CUT) startGame();
    }

    function showBanner(text, dur) {
        banner = { text: text, life: dur, max: dur };
    }

    function gameOver() {
        state = S_OVER;
        shake = Math.max(shake, 16);
        flash = 0.5;
        sfxOver();
        rocks.length = 0;
    }

    function beginCutscene() {
        state = S_CUT;
        player.vx = 0;
        const sp = eggSpecies;
        const fromLeft = Math.random() < 0.5;
        const dir = fromLeft ? 1 : -1;
        cut = {
            sp: sp,
            phase: 'calm', t: 0,
            x: fromLeft ? -220 : W + 220,
            dir: dir,
            side: fromLeft ? -1 : 1,
            flying: sp.flying,
            y: sp.flying ? GROUND_Y - 190 : GROUND_Y,
            targetX: 0,
            walkT: Math.random() * 4,
            blink: 0, blinkT: 1 + Math.random() * 3,
            carry: false,
            eggT: 0,
            alpha: 0,
            thanks: false,
            thanksT: 0,
            heartT: 0
        };
        cut.targetX = clamp(player.x - dir * sp.stand, 120, W - 120);
        for (let i = 0; i < rocks.length; i++) rocks[i].leaving = true;
        sfxCalm();
        showBanner('火山暂时平息……', 1.8);
    }

    function endCutscene() {
        rescued += 1;
        if (savedSpecies.indexOf(eggSpecies.id) < 0) savedSpecies.push(eggSpecies.id);
        roundIndex += 1;
        eggSpecies = nextSpecies();
        discovered[eggSpecies.id] = true;
        cut = null;
        state = S_PLAY;
        roundT = ROUND_TIME;
        spawnTimer = 1.1;
        showBanner('新的恐龙蛋！继续守护！', 2.2);
        player.invul = Math.max(player.invul, 0.8);
        sfxHeart();
    }

    function loseLife() {
        if (player.invul > 0 || state !== S_PLAY) return;
        lives -= 1;
        player.invul = INVULN_TIME;
        player.vx = player.vx >= 0 ? -260 : 260;
        shake = 18;
        flash = 0.55;
        popups.push({ x: player.x, y: GROUND_Y - 130, text: '-1', life: 1.0, color: '#ff7b6b', vy: -46 });
        for (let i = 0; i < 16; i++) {
            sparks.push(makeSpark(player.x + player.facing * 24, GROUND_Y - 74, 200));
        }
        sfxHit();
        if (lives <= 0) gameOver();
    }

    // ==================== 火山石 ====================
    function rockParams() {
        const t = 60 - roundT;
        const gravity = ROCK_GRAVITY_BASE + Math.min(330, roundIndex * 26 + t * 2.4);
        const vy0 = ROCK_VY_BASE + Math.min(110, roundIndex * 9 + t * 1.1);
        return { gravity: gravity, vy0: vy0 };
    }

    function spawnInterval() {
        const t = 60 - roundT;
        return Math.max(0.32, 1.22 - roundIndex * 0.135 - t * 0.0092);
    }

    function makeRockVerts(seed, n) {
        const v = [];
        for (let i = 0; i < n; i++) {
            const a = (i / n) * Math.PI * 2;
            const r = 0.68 + hash(seed + i * 3.7) * 0.42;
            v.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
        }
        return v;
    }

    function spawnRock(forcedX) {
        if (rocks.length >= MAX_ROCKS) return;
        const p = rockParams();
        const r = 13 + Math.random() * 17;
        const x = forcedX != null ? forcedX : 50 + Math.random() * (W - 100);
        const seed = Math.random() * 1000;
        rocks.push({
            x: x, y: -40 - Math.random() * 60,
            vx: (Math.random() - 0.5) * 46,
            vy: p.vy0 * (0.8 + Math.random() * 0.4),
            g: p.gravity * (0.85 + Math.random() * 0.3),
            r: r,
            rot: Math.random() * Math.PI * 2,
            vrot: (Math.random() - 0.5) * 3.6,
            seed: seed,
            verts: makeRockVerts(seed, 7),
            trail: [],
            emit: 0,
            heat: 0.45 + Math.random() * 0.4,
            leaving: false,
            fade: 1,
            entry: 0
        });
    }

    function makeSpark(x, y, spd) {
        const ang = Math.random() * Math.PI * 2;
        const s = spd * (0.4 + Math.random() * 0.9);
        return {
            x: x, y: y,
            vx: Math.cos(ang) * s,
            vy: Math.sin(ang) * s - 40,
            life: 0.35 + Math.random() * 0.5,
            max: 0.85,
            r: 2.2 + Math.random() * 3.4,
            spr: Math.random() < 0.5 ? SPR.glowYellow : SPR.glowOrange
        };
    }

    function addImpact(x, y, r) {
        impacts.push({ x: x, y: y, r: r, life: 0.55, max: 0.55 });
        for (let i = 0; i < Math.min(16, 6 + r * 0.3); i++) {
            sparks.push(makeSpark(x, y - 4, 120 + r * 3));
        }
        shake = Math.max(shake, Math.min(9, 2 + r * 0.25));
    }

    function updateRocks(dt) {
        for (let i = rocks.length - 1; i >= 0; i--) {
            const rk = rocks[i];
            if (rk.leaving) rk.fade -= dt * 1.6;
            rk.vy += rk.g * dt;
            rk.x += rk.vx * dt;
            rk.y += rk.vy * dt;
            rk.rot += rk.vrot * dt;
            rk.entry = Math.min(1, rk.entry + dt * 3.2);

            rk.emit += dt;
            while (rk.emit >= TRAIL_STEP) {
                rk.emit -= TRAIL_STEP;
                rk.trail.push({
                    x: rk.x - rk.vx * TRAIL_STEP * 0.6 + (Math.random() - 0.5) * rk.r * 0.4,
                    y: rk.y - rk.r * 0.55,
                    life: TRAIL_LIFE, max: TRAIL_LIFE,
                    r: rk.r * (0.42 + Math.random() * 0.34),
                    seed: Math.random() * 10
                });
            }
            for (let j = rk.trail.length - 1; j >= 0; j--) {
                const tp = rk.trail[j];
                tp.life -= dt;
                tp.y -= rk.vy * dt * 0.55;
                if (tp.life <= 0) rk.trail.splice(j, 1);
            }

            if (state === S_PLAY && player.invul <= 0 && hitTestRock(rk)) {
                loseLife();
                rk.fade = 0.5;
                rk.vy = -Math.abs(rk.vy) * 0.42;
                rk.vrot *= 2.6;
                rk.x += player.facing * 26;
            }

            if (rk.y - rk.r > GROUND_Y) {
                addImpact(clamp(rk.x, 8, W - 8), GROUND_Y, rk.r);
                sfxImpact();
                rocks.splice(i, 1);
                continue;
            }
            if (rk.x < -60 || rk.x > W + 60 || rk.fade <= 0) {
                rocks.splice(i, 1);
            }
        }
    }

    function hitTestRock(rk) {
        const rr = rk.r * 0.8;
        const top = GROUND_Y - PLAYER_H;
        const bx = player.x;
        const by = GROUND_Y - 62;
        const ex = bx + player.facing * 24;
        const ey = GROUND_Y - 80;
        const dx = rk.x - bx, dy = rk.y - by;
        const hx = clamp(dx, -PLAYER_W * 0.36, PLAYER_W * 0.36);
        const hy = clamp(dy, top - by, 0);
        if ((dx - hx) * (dx - hx) + (dy - hy) * (dy - hy) < rr * rr) return true;
        const dex = rk.x - ex, dey = rk.y - ey;
        const er = rr + 17;
        return dex * dex + dey * dey < er * er;
    }

    function drawRock(rk) {
        const fade = clamp(rk.fade, 0, 1);
        if (fade <= 0.02) return;
        ctx.save();
        ctx.globalAlpha = fade;

        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < rk.trail.length; i++) {
            const tp = rk.trail[i];
            const a = tp.life / tp.max;
            const flick = 0.88 + 0.16 * Math.sin(time * 22 + tp.seed * 3.1);
            const sz = tp.r * (4.4 + (1 - a) * 3.6);
            drawSprite(SPR.glowOrange, tp.x, tp.y, sz, a * 0.40 * flick, false);
            drawSprite(SPR.glowYellow, tp.x, tp.y, sz * 0.34, a * 0.24 * flick, false);
        }
        ctx.restore();

        const vlen = Math.sqrt(rk.vx * rk.vx + rk.vy * rk.vy);
        if (vlen > 1) {
            const ang = Math.atan2(rk.vy, rk.vx);
            const fl = clamp(vlen * 0.24, 30, 190) * (0.85 + 0.22 * Math.sin(time * 27 + rk.seed));
            const wdt = rk.r * (1.5 + 0.35 * Math.sin(time * 21 + rk.seed * 2));
            ctx.save();
            ctx.globalAlpha = fade * 0.85;
            ctx.globalCompositeOperation = 'lighter';
            ctx.translate(rk.x, rk.y - rk.r * 0.35);
            ctx.rotate(ang);
            ctx.drawImage(SPR.glowOrange, -fl, -wdt, fl * 2, wdt * 2);
            ctx.globalAlpha = fade * 0.6;
            ctx.drawImage(SPR.glowYellow, -fl * 0.62, -wdt * 0.5, fl * 1.24, wdt);
            ctx.restore();
        }

        drawSprite(SPR.glowOrange, rk.x, rk.y, rk.r * 5.4, 0.3 * (rk.heat + 0.4), true);

        ctx.save();
        ctx.translate(rk.x, rk.y);
        ctx.rotate(rk.rot);
        const n = rk.verts.length;
        ctx.beginPath();
        for (let i = 0; i < n; i++) {
            const v = rk.verts[i];
            const x = v.x * rk.r, y = v.y * rk.r;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.closePath();
        const g = ctx.createLinearGradient(0, -rk.r, 0, rk.r);
        g.addColorStop(0, '#6a4a3f');
        g.addColorStop(0.45, '#41302c');
        g.addColorStop(1, '#241a1b');
        ctx.fillStyle = g;
        ctx.fill();
        ctx.strokeStyle = 'rgba(20,12,12,0.9)';
        ctx.lineWidth = 1.6;
        ctx.stroke();

        ctx.save();
        ctx.clip();
        ctx.strokeStyle = 'rgba(255,140,50,0.85)';
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        for (let i = 0; i < 3; i++) {
            const h1 = hash(rk.seed + i * 5.1);
            const h2 = hash(rk.seed + i * 9.7);
            ctx.beginPath();
            ctx.moveTo((h1 - 0.5) * rk.r * 1.6, (h2 - 0.5) * rk.r * 1.6);
            ctx.lineTo((h2 - 0.5) * rk.r * 1.4, (h1 - 0.5) * rk.r * 1.2 + rk.r * 0.2);
            ctx.stroke();
        }
        ctx.fillStyle = 'rgba(255,170,70,0.55)';
        for (let i = 0; i < 4; i++) {
            const hx = (hash(rk.seed + i * 13.3) - 0.5) * rk.r * 1.7;
            const hy = (hash(rk.seed + i * 21.1) - 0.5) * rk.r * 1.7;
            ctx.beginPath();
            ctx.arc(hx, hy, 1.8 + hash(rk.seed + i) * 2.2, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
        ctx.restore();

        ctx.restore();
    }

    // ==================== 通用更新 ====================
    function updateSparks(dt) {
        for (let i = sparks.length - 1; i >= 0; i--) {
            const s = sparks[i];
            s.life -= dt;
            if (s.life <= 0) { sparks.splice(i, 1); continue; }
            s.vy += 520 * dt;
            s.vx *= 1 - Math.min(1, dt * 1.4);
            s.x += s.vx * dt;
            s.y += s.vy * dt;
            if (s.y > GROUND_Y) { s.y = GROUND_Y; s.vy *= -0.32; s.vx *= 0.6; }
        }
    }

    function updateImpacts(dt) {
        for (let i = impacts.length - 1; i >= 0; i--) {
            impacts[i].life -= dt;
            if (impacts[i].life <= 0) impacts.splice(i, 1);
        }
    }

    function updateFloaters(dt) {
        for (let i = floaters.length - 1; i >= 0; i--) {
            const f = floaters[i];
            f.life -= dt;
            f.y += f.vy * dt;
            f.vy *= 1 - Math.min(1, dt * 1.2);
            f.rot += f.spin * dt;
            if (f.life <= 0) floaters.splice(i, 1);
        }
    }

    function updateHearts(dt) {
        for (let i = hearts.length - 1; i >= 0; i--) {
            const h = hearts[i];
            h.life -= dt;
            h.y += h.vy * dt;
            h.vy *= 1 - Math.min(1, dt * 0.9);
            h.rot += h.spin * dt;
            if (h.life <= 0) hearts.splice(i, 1);
        }
    }

    function updatePopups(dt) {
        for (let i = popups.length - 1; i >= 0; i--) {
            const p = popups[i];
            p.life -= dt;
            p.y += p.vy * dt;
            if (p.life <= 0) popups.splice(i, 1);
        }
    }

    function updateAmbient(dt) {
        for (let i = embers.length - 1; i >= 0; i--) {
            const e = embers[i];
            e.life -= dt;
            e.y -= e.vy * dt;
            e.x += (e.vx + Math.sin(time * 1.4 + e.seed) * 16) * dt;
            if (e.life <= 0 || e.y < -20) {
                e.y = GROUND_Y + 10 + Math.random() * 20;
                e.x = Math.random() * W;
                e.vy = 20 + Math.random() * 60;
                e.vx = (Math.random() - 0.5) * 30;
                e.life = 3 + Math.random() * 4;
            }
        }

        const f = volcano.fountain;
        volcano.emitT += dt;
        const emitGap = 0.028;
        while (volcano.emitT >= emitGap && f.length < 190) {
            volcano.emitT -= emitGap;
            const ang = -Math.PI / 2 + (Math.random() - 0.5) * 1.5;
            const sp = 240 + Math.random() * 380;
            f.push({
                x: volcano.x + (Math.random() - 0.5) * volcano.rimHalf * 1.4,
                y: volcano.craterY !== undefined ? volcano.craterY : (volcano.baseY - volcano.h),
                vx: Math.cos(ang) * sp + volcano.side * 26,
                vy: Math.sin(ang) * sp,
                life: 1.1 + Math.random() * 1.6,
                max: 2.7,
                r: 5 + Math.random() * 13,
                hot: Math.random()
            });
        }
        for (let i = f.length - 1; i >= 0; i--) {
            const p = f[i];
            p.life -= dt;
            if (p.life <= 0) { f.splice(i, 1); continue; }
            p.vy += 460 * dt;
            p.vx *= 1 - Math.min(1, dt * 0.5);
            p.x += p.vx * dt;
            p.y += p.vy * dt;
        }

        const sm = volcano.smoke;
        volcano.smokeT += dt;
        while (volcano.smokeT >= 0.062 && sm.length < 76) {
            volcano.smokeT -= 0.062;
            sm.push({
                x: volcano.x + (Math.random() - 0.5) * volcano.rimHalf * 1.3,
                y: volcano.baseY - volcano.h + 2,
                vx: volcano.side * (20 + Math.random() * 52),
                vy: -(66 + Math.random() * 104),
                r: 40 + Math.random() * 60,
                life: 3.4 + Math.random() * 2.8,
                max: 6.2,
                rot: Math.random() * 6.28
            });
        }
        for (let i = sm.length - 1; i >= 0; i--) {
            const p = sm[i];
            p.life -= dt;
            if (p.life <= 0) { sm.splice(i, 1); continue; }
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy *= 1 - Math.min(1, dt * 0.35);
            p.r += 17 * dt;
        }

        const bms = volcano.bombs;
        volcano.bombT -= dt;
        if (volcano.bombT <= 0 && bms.length < 8) {
            volcano.bombT = 0.32 + Math.random() * 0.62;
            const ang = -Math.PI / 2 + (Math.random() - 0.5) * 1.15;
            const sp = 330 + Math.random() * 300;
            bms.push({
                x: volcano.x + (Math.random() - 0.5) * volcano.rimHalf * 1.1,
                y: volcano.baseY - volcano.h + 10,
                vx: Math.cos(ang) * sp + volcano.side * 30,
                vy: Math.sin(ang) * sp,
                r: 6 + Math.random() * 7,
                rot: Math.random() * 6.28,
                seed: Math.random() * 100,
                trail: [],
                life: 2.6 + Math.random() * 1.4,
                max: 4.0
            });
        }
        for (let i = bms.length - 1; i >= 0; i--) {
            const p = bms[i];
            p.life -= dt;
            if (p.life <= 0 || p.y > GROUND_Y + 10) {
                if (p.y > GROUND_Y - 30) {
                    for (let k = 0; k < 6; k++) sparks.push(makeSpark(p.x, GROUND_Y - 4, 90 + p.r * 6));
                }
                bms.splice(i, 1);
                continue;
            }
            p.vy += 520 * dt;
            p.vx *= 1 - Math.min(1, dt * 0.22);
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.rot += dt * 2.4;
            p.trail.push({ x: p.x, y: p.y });
            if (p.trail.length > 7) p.trail.shift();
        }

        for (let i = 0; i < ashClouds.length; i++) {
            const c = ashClouds[i];
            c.x += c.speed * dt;
            if (c.x - c.s > W + 80) c.x = -c.s - 80;
            else if (c.x + c.s < -80) c.x = W + c.s + 80;
        }

        if (shake > 0) shake = Math.max(0, shake - dt * 42);
        if (flash > 0) flash = Math.max(0, flash - dt * 2.2);
        if (banner) {
            banner.life -= dt;
            if (banner.life <= 0) banner = null;
        }
    }

    // ==================== 玩家 ====================
    function updatePlayer(dt, canMove) {
        const left = keys.ArrowLeft || gamepadLeft || touchLeft;
        const right = keys.ArrowRight || gamepadRight || touchRight;
        player.moving = false;
        if (canMove) {
            if (left && !right) {
                player.vx -= MOVE_ACCEL * dt;
                player.facing = -1;
                player.moving = true;
            } else if (right && !left) {
                player.vx += MOVE_ACCEL * dt;
                player.facing = 1;
                player.moving = true;
            }
        }
        if (!player.moving) {
            const d = MOVE_ACCEL * 1.6 * dt;
            if (player.vx > d) player.vx -= d;
            else if (player.vx < -d) player.vx += d;
            else player.vx = 0;
        }
        player.vx = clamp(player.vx, -MOVE_SPEED, MOVE_SPEED);
        player.x += player.vx * dt;
        if (player.x < 42) { player.x = 42; player.vx = 0; }
        if (player.x > W - 42) { player.x = W - 42; player.vx = 0; }
        if (player.moving) player.walkPhase += dt * 11;
        else player.walkPhase *= 1 - Math.min(1, dt * 6);
        if (player.invul > 0) player.invul -= dt;
        player.breathe += dt * 2.2;
    }

    function drawPlayer() {
        if (player.invul > 0 && Math.floor(player.invul * 14) % 2 === 0) return;
        const cx = player.x, feetY = GROUND_Y;
        const h = PLAYER_H;
        const bob = player.moving ? 0 : Math.sin(player.breathe) * 1.6;
        const hipY = feetY - h * 0.45 + bob;
        const shoulderY = feetY - h * 0.71 + bob;
        const headR = h * 0.125;
        const headY = shoulderY - headR + 2;
        const w = PLAYER_W;

        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        let footL, footR, angL = 0, angR = 0;
        if (player.moving) {
            const s = Math.sin(player.walkPhase);
            const liftL = Math.max(0, Math.sin(player.walkPhase + Math.PI / 2)) * 14;
            const liftR = Math.max(0, Math.sin(player.walkPhase + 3 * Math.PI / 2)) * 14;
            footL = { x: cx + player.facing * s * 18, y: feetY - 8 - liftL };
            footR = { x: cx - player.facing * s * 18, y: feetY - 8 - liftR };
            angL = -(liftL / 14) * 0.55;
            angR = -(liftR / 14) * 0.55;
        } else {
            footL = { x: cx - 11, y: feetY - 8 };
            footR = { x: cx + 11, y: feetY - 8 };
        }
        const hip = { x: cx, y: hipY };
        const feet = [footL, footR];
        const angles = [angL, angR];
        for (let fi = 0; fi < 2; fi++) {
            const foot = feet[fi];
            const kneeBend = player.moving ? Math.min(17, 3 + (feetY - 8 - foot.y) * 0.85) : 3;
            const mx = (hip.x + foot.x) / 2 + player.facing * kneeBend * 0.9;
            const my = (hip.y + foot.y) / 2;
            limb(hip.x, hip.y, mx, my, foot.x, foot.y, 8, '#1f4a63');
            drawShoe(foot.x, foot.y, angles[fi]);
        }

        let carryEgg = state !== S_OVER && !!eggSpecies;
        if (cut && (cut.carry || cut.phase === 'take')) carryEgg = false;
        const f = player.facing;
        const ex = cx + f * 24;
        const ey = GROUND_Y - 80 + bob * 0.6;
        const swing = player.moving ? Math.sin(player.walkPhase) * 11 * f : Math.sin(player.breathe) * 2;
        const shOuter = { x: cx - f * w * 0.16, y: shoulderY + 8 };
        const shFront = { x: cx + f * w * 0.24, y: shoulderY + 8 };

        if (!carryEgg) {
            const eX = cx - f * w * 0.32 + swing * 0.35;
            const eY = shoulderY + 24 + bob;
            drawUpperArm(shOuter.x, shOuter.y, eX, eY, 7, '#2a6ba3');
            drawForeArm(eX, eY, cx - f * w * 0.34 + swing * 0.8, shoulderY + 44 + bob, 6.4, '#2a6ba3', '#e9c7a2');
        }

        ctx.fillStyle = '#3b9ddd';
        roundRectPath(cx - w * 0.28, shoulderY, w * 0.56, hipY - shoulderY + 8, 10);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        roundRectPath(cx - w * 0.22, shoulderY + 5, w * 0.16, hipY - shoulderY - 2, 6);
        ctx.fill();

        ctx.fillStyle = '#ffdcb8';
        ctx.beginPath();
        ctx.arc(cx, headY, headR, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#1e1e1e';
        const eyeDx = player.facing > 0 ? 4 : -4;
        const blink = (Math.sin(time * 0.9 + 3) > 0.985) ? 1 : 0;
        if (blink) {
            ctx.strokeStyle = '#1e1e1e';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx - 8 + eyeDx, headY - 3);
            ctx.lineTo(cx - 2 + eyeDx, headY - 3);
            ctx.moveTo(cx + 2 + eyeDx, headY - 3);
            ctx.lineTo(cx + 8 + eyeDx, headY - 3);
            ctx.stroke();
        } else {
            ctx.beginPath();
            ctx.arc(cx - 5 + eyeDx, headY - 3, 2.6, 0, Math.PI * 2);
            ctx.arc(cx + 5 + eyeDx, headY - 3, 2.6, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.strokeStyle = '#1e1e1e';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.arc(cx + eyeDx, headY + 4, 4.6, 0.12 * Math.PI, 0.88 * Math.PI);
        ctx.stroke();

        ctx.fillStyle = '#e84c3d';
        ctx.beginPath();
        ctx.arc(cx, headY - headR * 0.45, headR * 0.85, Math.PI, 0);
        ctx.fill();
        ctx.fillRect(cx - headR * 0.95, headY - headR * 0.55, headR * 1.9, headR * 0.32);

        if (carryEgg) {
            const elbowX = cx + f * 7;
            const elbowY = shoulderY + 21;
            drawUpperArm(shOuter.x, shOuter.y, elbowX, elbowY, 7.6, '#2f7fb8');
            drawEggAt(ex, ey, 40, 54, eggSpecies.egg, time, 0.05 * Math.sin(time * 2.2), 1);
            drawForeArm(elbowX, elbowY, ex + f * 6, ey + 9, 6.8, '#2a6ba3');
        } else {
            const eX = cx + f * w * 0.40 + swing * 0.35;
            const eY = shoulderY + 17 + bob;
            const hX = cx + f * w * 0.30 + swing;
            const hY = shoulderY + 33 + bob;
            drawUpperArm(shFront.x, shFront.y, eX, eY, 7.6, '#2f7fb8');
            drawForeArm(eX, eY, hX, hY, 6.8, '#2a6ba3');
        }

        ctx.restore();
    }

    function drawUpperArm(sx, sy, exx, eyy, w, color) {
        limb(sx, sy, (sx + exx) / 2, (sy + eyy) / 2, exx, eyy, w, color);
    }

    function drawForeArm(exx, eyy, hx, hy, w, color, handCol) {
        limb(exx, eyy, (exx + hx) / 2, (eyy + hy) / 2, hx, hy, w, color);
        ctx.fillStyle = handCol || '#ffdcb8';
        ctx.beginPath();
        ctx.arc(hx, hy, 5.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(150,95,60,0.3)';
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.arc(hx, hy, 5.6, 0.3 * Math.PI, 0.95 * Math.PI);
        ctx.stroke();
    }

    function drawShoe(x, y, angle) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(player.facing, 1);
        ctx.rotate(angle);
        ctx.fillStyle = '#e84c3d';
        ctx.beginPath();
        ctx.moveTo(-5, -3);
        ctx.quadraticCurveTo(1, -5, 7, -2);
        ctx.quadraticCurveTo(14, 0, 14.5, 3.5);
        ctx.quadraticCurveTo(15, 6, 11, 6);
        ctx.lineTo(-6, 6);
        ctx.quadraticCurveTo(-7.5, 0, -5, -3);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#c0392b';
        ctx.beginPath();
        ctx.moveTo(8.5, -1.2);
        ctx.quadraticCurveTo(14, 0.6, 14.5, 3.5);
        ctx.quadraticCurveTo(15, 6, 11, 6);
        ctx.lineTo(8.5, 6);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#f5f6fa';
        ctx.beginPath();
        ctx.moveTo(-7, 5);
        ctx.lineTo(15, 5);
        ctx.quadraticCurveTo(16, 5, 15.5, 6.6);
        ctx.lineTo(14.5, 8);
        ctx.lineTo(-6, 8);
        ctx.quadraticCurveTo(-7.5, 8, -7.5, 6.4);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }

    function drawPlayerShadow() {
        const a = 0.3;
        ctx.save();
        ctx.globalAlpha = a;
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.ellipse(player.x, GROUND_Y + 5, 30, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    // ==================== 恐龙蛋 ====================
    function drawEggAt(x, y, w, h, eggPal, t, rot, alpha) {
        ctx.save();
        ctx.globalAlpha = alpha == null ? 1 : alpha;
        ctx.translate(x, y);
        if (rot) ctx.rotate(rot);
        drawSprite(SPR.glowYellow, 0, -h * 0.16, h * 2.0, 0.22 + 0.10 * Math.sin(t * 2.6), true);
        const eggGrad = ctx.createRadialGradient(-w * 0.12, -h * 0.20, h * 0.06, 0, 0, h * 0.72);
        eggGrad.addColorStop(0, '#ffffff');
        eggGrad.addColorStop(0.28, eggPal.shell);
        eggGrad.addColorStop(1, eggPal.deep);
        ctx.fillStyle = eggGrad;
        ctx.beginPath();
        traceEggPath(w, h);
        ctx.fill();
        ctx.save();
        ctx.beginPath();
        traceEggPath(w, h);
        ctx.clip();
        ctx.fillStyle = eggPal.spot;
        ctx.globalAlpha = alpha * 0.8;
        const spots = [[-0.42, -0.12, 0.26, 0.7], [0.34, 0.16, 0.3, -0.4], [0.02, -0.42, 0.2, 0.2],
                      [-0.1, 0.4, 0.17, -0.6], [0.5, -0.3, 0.14, 0.9]];
        for (let i = 0; i < spots.length; i++) {
            const s = spots[i];
            ctx.beginPath();
            ctx.ellipse(s[0] * w * 0.5, s[1] * h * 0.5, s[2] * w * 0.42, s[2] * h * 0.34, s[3], 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
        ctx.strokeStyle = 'rgba(90,60,40,0.22)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        traceEggPath(w, h);
        ctx.stroke();
        for (let k = 0; k < 3; k++) {
            const tw = Math.sin(t * 3.2 + k * 2.1);
            const a2 = tw > 0 ? tw * tw * 0.75 : 0;
            if (a2 <= 0.01) continue;
            const ox = (k - 1) * w * 0.55;
            const oy = -h * (k === 1 ? 0.62 : 0.30);
            const ss = 2.4 + tw * 2.8;
            ctx.save();
            ctx.globalAlpha = alpha * a2;
            ctx.fillStyle = '#fff3c0';
            starPath(ox, oy, ss, ss * 0.45);
            ctx.fill();
            ctx.restore();
        }
        ctx.restore();
    }

    function starPath(cx, cy, r, ri) {
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
            const ang = (i / 8) * Math.PI * 2 - Math.PI / 2;
            const rad = i % 2 === 0 ? r : ri;
            const x = cx + Math.cos(ang) * rad, y = cy + Math.sin(ang) * rad;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath();
    }

    // ==================== 恐龙绘制 ====================
    function dinoEye(x, y, r, blink, look) {
        if (blink) {
            ctx.strokeStyle = '#3a2a33';
            ctx.lineWidth = r * 0.55;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(x, y, r * 1.05, Math.PI * 0.12, Math.PI * 0.88, true);
            ctx.stroke();
            return;
        }
        ctx.fillStyle = '#33242e';
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.beginPath();
        ctx.arc(x + r * 0.32, y - r * 0.34, r * 0.36, 0, Math.PI * 2);
        ctx.arc(x - r * 0.30, y + r * 0.36, r * 0.18, 0, Math.PI * 2);
        ctx.fill();
        if (look) {
            ctx.fillStyle = 'rgba(255,255,255,0.75)';
            ctx.beginPath();
            ctx.arc(x + r * 0.62, y + r * 0.28, r * 0.14, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function dinoBlush(x, y, r, alpha) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#ff9aa8';
        ctx.beginPath();
        ctx.ellipse(x, y, r, r * 0.68, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    function dinoLeg(x, hipY, footX, footY, w, color, toeDir) {
        const mx = (x + footX) / 2 + (footX - x) * 0.25;
        const my = (hipY + footY) / 2 - 2;
        limb(x, hipY, mx, my, footX, footY, w, color);
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.ellipse(footX + (toeDir || 1) * w * 0.22, footY + w * 0.12, w * 0.95, w * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    function dinoTrike(pal, o) {
        const t = o.t;
        const ph = Math.sin(t * 5.4), ph2 = Math.sin(t * 5.4 + Math.PI);
        const bow = o.bow * 6;
        ctx.fillStyle = pal.body;
        ctx.beginPath();
        ctx.moveTo(-42, -60);
        ctx.quadraticCurveTo(-76, -66 + ph * 5, -100, -52 + ph * 8);
        ctx.quadraticCurveTo(-74, -48, -42, -38);
        ctx.closePath();
        ctx.fill();
        dinoLeg(-34, -34, -42 + ph2 * 9, -2, 13, pal.dark);
        dinoLeg(24, -34, 18 + ph * 9, -2, 13, pal.dark);
        ctx.fillStyle = pal.body;
        ctx.beginPath();
        ctx.ellipse(-4, -52, 48, 34, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = pal.belly;
        ctx.beginPath();
        ctx.ellipse(-2, -36, 36, 17, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = pal.dark;
        for (let i = 0; i < 4; i++) {
            ctx.beginPath();
            ctx.ellipse(-34 + i * 17, -70 - (i === 1 || i === 2 ? 4 : 0), 8, 6, 0.2, 0, Math.PI * 2);
            ctx.fill();
        }
        dinoLeg(-16, -34, -22 + ph * 10, -2, 14, pal.body);
        dinoLeg(40, -34, 34 + ph2 * 10, -2, 14, pal.body);

        ctx.save();
        ctx.translate(24, -100 + bow * 0.4);
        ctx.rotate(-0.2 + bow * 0.012);
        ctx.fillStyle = pal.dark;
        ctx.beginPath();
        ctx.moveTo(10, 26);
        ctx.quadraticCurveTo(-22, 6, 2, -32);
        ctx.quadraticCurveTo(28, -62, 48, -28);
        ctx.quadraticCurveTo(62, -2, 42, 24);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = pal.body;
        ctx.beginPath();
        ctx.moveTo(12, 22);
        ctx.quadraticCurveTo(-12, 4, 6, -24);
        ctx.quadraticCurveTo(26, -48, 42, -22);
        ctx.quadraticCurveTo(52, 0, 36, 20);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = pal.accent;
        ctx.beginPath();
        ctx.arc(4, -8, 5.5, 0, Math.PI * 2);
        ctx.arc(28, -18, 4.2, 0, Math.PI * 2);
        ctx.arc(34, 4, 3.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        limb(30, -62, 44, -70 + bow * 0.5, 54, -78 + bow, 32, pal.body);

        ctx.fillStyle = pal.body;
        ctx.beginPath();
        ctx.ellipse(54 + bow, -78 + bow, 22, 18, -0.12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = pal.extra;
        ctx.beginPath();
        ctx.moveTo(72 + bow, -78 + bow);
        ctx.quadraticCurveTo(86 + bow, -74 + bow, 84 + bow, -68 + bow);
        ctx.quadraticCurveTo(76 + bow, -68 + bow, 70 + bow, -70 + bow);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = pal.extra;
        ctx.lineCap = 'round';
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.moveTo(44 + bow, -88 + bow);
        ctx.lineTo(52 + bow, -118 + bow);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(60 + bow, -86 + bow);
        ctx.lineTo(70 + bow, -114 + bow);
        ctx.stroke();
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(76 + bow, -72 + bow);
        ctx.lineTo(82 + bow, -92 + bow);
        ctx.stroke();

        dinoBlush(66 + bow, -68 + bow, 7, 0.5);
        dinoEye(60 + bow, -84 + bow, 4.2, o.blink, true);
        ctx.strokeStyle = '#3a2a33';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.arc(70 + bow, -72 + bow, 5, 0.15 * Math.PI, 0.8 * Math.PI);
        ctx.stroke();
    }

    function dinoStego(pal, o) {
        const t = o.t;
        const ph = Math.sin(t * 5.0), ph2 = Math.sin(t * 5.0 + Math.PI);
        const bow = o.bow * 6;
        ctx.fillStyle = pal.body;
        ctx.beginPath();
        ctx.moveTo(-44, -56);
        ctx.quadraticCurveTo(-82, -60 + ph * 5, -104, -66 + ph * 7);
        ctx.quadraticCurveTo(-80, -46, -44, -38);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = pal.extra;
        for (let i = 0; i < 4; i++) {
            const a = -0.2 + i * 0.42;
            ctx.beginPath();
            ctx.moveTo(-104, -66 + ph * 7);
            ctx.lineTo(-104 - Math.cos(a) * 26, -66 + ph * 7 - Math.sin(a) * 26);
            ctx.lineTo(-98, -66 + ph * 7 + 4);
            ctx.closePath();
            ctx.fill();
        }
        dinoLeg(-32, -36, -38 + ph2 * 8, -2, 12, pal.dark);
        dinoLeg(14, -36, 8 + ph * 8, -2, 12, pal.dark);
        ctx.fillStyle = pal.body;
        ctx.beginPath();
        ctx.ellipse(0, -54, 50, 32, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = pal.belly;
        ctx.beginPath();
        ctx.ellipse(2, -38, 38, 16, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = pal.deep;
        for (let i = 0; i < 5; i++) {
            ctx.beginPath();
            ctx.ellipse(-32 + i * 16, -58 + (i % 2) * 5, 6, 4.4, 0.3, 0, Math.PI * 2);
            ctx.fill();
        }
        dinoLeg(-18, -36, -24 + ph * 9, -2, 13, pal.body);
        dinoLeg(30, -36, 24 + ph2 * 9, -2, 13, pal.body);

        const plateCols = [pal.accent, pal.extra, '#ff7b6b'];
        for (let i = 0; i < 7; i++) {
            const px = -34 + i * 12;
            const ph2h = 22 + Math.sin((i / 6) * Math.PI) * 20;
            const py = -80;
            ctx.fillStyle = plateCols[i % 3];
            ctx.beginPath();
            ctx.moveTo(px - 9, py + 6);
            ctx.quadraticCurveTo(px - 4, py - ph2h, px + 2, py - ph2h);
            ctx.quadraticCurveTo(px + 9, py - ph2h * 0.7, px + 9, py + 6);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.beginPath();
            ctx.moveTo(px - 6, py + 2);
            ctx.quadraticCurveTo(px - 3, py - ph2h * 0.6, px + 1, py - ph2h * 0.8);
            ctx.lineTo(px + 2, py + 2);
            ctx.closePath();
            ctx.fill();
        }

        limb(34, -66, 44, -66 + bow * 0.4, 54, -64 + bow, 24, pal.body);
        ctx.fillStyle = pal.body;
        ctx.beginPath();
        ctx.ellipse(58 + bow, -64 + bow, 16, 13, -0.1, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = pal.extra;
        ctx.beginPath();
        ctx.moveTo(70 + bow, -62 + bow);
        ctx.quadraticCurveTo(80 + bow, -60 + bow, 79 + bow, -56 + bow);
        ctx.quadraticCurveTo(72 + bow, -56 + bow, 68 + bow, -58 + bow);
        ctx.closePath();
        ctx.fill();
        dinoBlush(66 + bow, -58 + bow, 6, 0.45);
        dinoEye(62 + bow, -69 + bow, 3.8, o.blink, true);
        ctx.strokeStyle = '#3a2a33';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(70 + bow, -60 + bow, 4.4, 0.15 * Math.PI, 0.8 * Math.PI);
        ctx.stroke();
    }

    function dinoTrex(pal, o) {
        const t = o.t;
        const ph = Math.sin(t * 5.8), ph2 = Math.sin(t * 5.8 + Math.PI);
        const bow = o.bow * 7;
        ctx.fillStyle = pal.body;
        ctx.beginPath();
        ctx.moveTo(-12, -74);
        ctx.quadraticCurveTo(-62, -78 + ph * 6, -104, -46 + ph * 9);
        ctx.quadraticCurveTo(-66, -44, -16, -46);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = pal.deep;
        for (let i = 0; i < 5; i++) {
            ctx.beginPath();
            ctx.ellipse(-34 - i * 14, -66 + i * 4 + ph * 5, 7, 5, -0.2, 0, Math.PI * 2);
            ctx.fill();
        }
        dinoLeg(-2, -46, -16 + ph2 * 12, -2, 22, pal.dark);
        dinoLeg(16, -46, 26 + ph * 12, -2, 22, pal.dark);

    function drawDino(id, o) {
        const sp = SPECIES_MAP[id];
        if (!sp) return;
        ctx.save();
        ctx.globalAlpha = o.alpha == null ? 1 : o.alpha;
        ctx.translate(o.x, o.y);
        ctx.scale(o.s * o.dir, o.s);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        const fn = DINO_FN[id];
        if (fn) fn(sp.pal, o);
        if (o.carry && o.eggPal) {
            const a = sp.anchor;
            drawEggAt(a[0], a[1], 40 * sp.eggScale * 0.62, 54 * sp.eggScale * 0.62, o.eggPal, time, 0.06 * Math.sin(time * 2), 1);
        }
        ctx.restore();
    }

    function drawDinoShadow(x, y, w, alpha) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.ellipse(x, y + 6, w, w * 0.22, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    // ==================== 简笔轮廓图标 ====================
    function drawGlyph(id, x, y, size, color) {
        const s = size / 100;
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(s, s);
        ctx.fillStyle = color;
        ctx.strokeStyle = color;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        switch (id) {
            case 'trike':
                ctx.beginPath();
                ctx.moveTo(-40, 10); ctx.lineTo(-42, -18);
                ctx.quadraticCurveTo(-32, -42, -14, -34);
                ctx.quadraticCurveTo(-18, -12, -26, 4);
                ctx.closePath(); ctx.fill();
                ctx.beginPath(); ctx.ellipse(-4, 6, 30, 19, 0, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath();
                ctx.moveTo(-28, -14); ctx.quadraticCurveTo(-48, -10, -56, 8);
                ctx.lineTo(-30, 8); ctx.closePath(); ctx.fill();
                ctx.beginPath(); ctx.ellipse(34, -6, 16, 11, 0, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath();
                ctx.moveTo(30, -16); ctx.lineTo(38, -44); ctx.lineTo(43, -14);
                ctx.closePath(); ctx.fill();
                ctx.beginPath();
                ctx.moveTo(46, -13); ctx.lineTo(57, -36); ctx.lineTo(59, -10);
                ctx.closePath(); ctx.fill();
                ctx.fillRect(-30, 24, 12, 22); ctx.fillRect(6, 24, 12, 22);
                break;
            case 'stego':
                ctx.beginPath(); ctx.ellipse(-4, 6, 34, 18, 0, 0, Math.PI * 2); ctx.fill();
                for (let i = 0; i < 5; i++) {
                    ctx.beginPath();
                    ctx.moveTo(-30 + i * 14 - 6, -8);
                    ctx.lineTo(-30 + i * 14, -34 + (i % 2) * 8);
                    ctx.lineTo(-30 + i * 14 + 6, -8);
                    ctx.closePath(); ctx.fill();
                }
                ctx.beginPath(); ctx.ellipse(36, -2, 12, 9, 0, 0, Math.PI * 2); ctx.fill();
                ctx.fillRect(-30, 20, 10, 24); ctx.fillRect(14, 20, 10, 24);
                break;
            case 'trex':
                ctx.beginPath();
                ctx.moveTo(-10, 0); ctx.quadraticCurveTo(-44, 6, -54, 28);
                ctx.lineTo(-14, 34); ctx.quadraticCurveTo(4, 30, 8, 10);
                ctx.closePath(); ctx.fill();
                ctx.beginPath(); ctx.ellipse(4, -6, 24, 30, 0, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(26, -36, 26, 18, -0.15, 0, Math.PI * 2); ctx.fill();
                ctx.fillRect(-12, 18, 15, 32); ctx.fillRect(12, 18, 15, 32);
                break;
            case 'plesio':
                ctx.beginPath(); ctx.ellipse(-6, 8, 24, 16, 0, 0, Math.PI * 2); ctx.fill();
                ctx.lineWidth = 10;
                ctx.beginPath();
                ctx.moveTo(6, 0); ctx.bezierCurveTo(30, -20, 4, -40, 18, -58);
                ctx.stroke();
                ctx.beginPath(); ctx.ellipse(22, -64, 13, 10, 0, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath();
                ctx.moveTo(2, 14); ctx.lineTo(-26, 34); ctx.lineTo(4, 24);
                ctx.closePath(); ctx.fill();
                ctx.beginPath();
                ctx.moveTo(12, 12); ctx.lineTo(38, 30); ctx.lineTo(14, 22);
                ctx.closePath(); ctx.fill();
                break;
            case 'ptero':
                ctx.beginPath();
                ctx.moveTo(-2, 4); ctx.quadraticCurveTo(-32, -36, -60, -22);
                ctx.quadraticCurveTo(-46, -6, -34, 12); ctx.closePath(); ctx.fill();
                ctx.beginPath();
                ctx.moveTo(2, 4); ctx.quadraticCurveTo(34, -32, 62, -20);
                ctx.quadraticCurveTo(48, -4, 38, 14); ctx.closePath(); ctx.fill();
                ctx.beginPath(); ctx.ellipse(2, 8, 15, 11, 0, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath();
                ctx.moveTo(12, 2); ctx.quadraticCurveTo(36, -10, 54, -6);
                ctx.lineTo(26, 10); ctx.closePath(); ctx.fill();
                ctx.beginPath();
                ctx.moveTo(10, -2); ctx.lineTo(-8, -20); ctx.lineTo(14, -10);
                ctx.closePath(); ctx.fill();
                break;
            case 'raptor':
                ctx.lineWidth = 8;
                ctx.beginPath();
                ctx.moveTo(-12, -6); ctx.quadraticCurveTo(-38, -8, -58, -16);
                ctx.stroke();
                ctx.beginPath(); ctx.ellipse(0, -12, 20, 24, 0.1, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(26, -44, 15, 11, -0.2, 0, Math.PI * 2); ctx.fill();
                ctx.lineWidth = 9;
                ctx.beginPath(); ctx.moveTo(0, 6); ctx.lineTo(-8, 44); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(12, 6); ctx.lineTo(20, 44); ctx.stroke();
                break;
            case 'diplo':
                ctx.lineWidth = 12;
                ctx.beginPath();
                ctx.moveTo(10, -22); ctx.quadraticCurveTo(26, -50, 22, -70);
                ctx.stroke();
                ctx.beginPath(); ctx.ellipse(24, -74, 13, 9, 0, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(-6, -20, 34, 18, 0, 0, Math.PI * 2); ctx.fill();
                ctx.lineWidth = 8;
                ctx.beginPath();
                ctx.moveTo(-34, -14); ctx.quadraticCurveTo(-60, -4, -68, 22);
                ctx.stroke();
                ctx.fillRect(-28, -6, 12, 26); ctx.fillRect(4, -6, 12, 26);
                break;
            case 'brachio':
                ctx.lineWidth = 13;
                ctx.beginPath();
                ctx.moveTo(8, -30); ctx.quadraticCurveTo(30, -58, 26, -80);
                ctx.stroke();
                ctx.beginPath(); ctx.ellipse(28, -84, 14, 10, 0, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(-6, -22, 32, 20, -0.05, 0, Math.PI * 2); ctx.fill();
                ctx.fillRect(-26, -8, 14, 34); ctx.fillRect(6, -8, 14, 34);
