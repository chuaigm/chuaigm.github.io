    // ==================== 道具三选一 ====================
    // 不操作时三个道具静止（一个在头上，两个在身侧），
    // 按 左/右 方向轮换顺序，按 J 确认头顶那个，选完清空。
    function pkgItems() { return world.pkg; }
    // 开启一轮选择（重新计时）
    function openPkg(items) {
        world.pkg = items;
        world.pkgSel = 0;
        world.pkgTimer = PKG_TIME;
    }
    // 结算当前选择：auto 为超时/重复拾取导致的自动选择
    function confirmPkg(auto) {
        if (!world.pkg || !world.pkg.length) { world.pkgTimer = 0; return; }
        const id = world.pkg[world.pkgSel];
        if (auto) addPopup(world.player.x, world.player.y - 66, '超时自动选用：' + ITEM_BY_ID[id].name, '#cfe4ff', true);
        applyItem(id);
        world.pkg = null;
        world.pkgSel = 0;
        world.pkgTimer = 0;
    }
    function rotatePkg(dir) {
        if (!world.pkg || world.pkg.length < 2) return;
        const n = world.pkg.length;
        world.pkgSel = ((world.pkgSel + dir) % n + n) % n;
        sfx('uiMove');
    }
    function updatePkgTimer(dt) {
        if (!world.pkg || !world.pkg.length) return;
        world.pkgTimer -= dt;
        if (world.pkgTimer <= 0) {
            confirmPkg(true);
            // 队列里还有则继续下一轮
            if (world.pkgQueue.length) openPkg(world.pkgQueue.shift());
        }
    }
    function drawPkgRing(px, py, t) {
        const n = world.pkg.length;
        if (!n) return;
        const R = 66;
        const top = world.pkgSel;
        const slots = [];
        slots.push({ id: world.pkg[top], x: px, y: py - 104, top: true });
        if (n > 1) slots.push({ id: world.pkg[(top + 1) % n], x: px + R, y: py - 46, top: false });
        if (n > 2) slots.push({ id: world.pkg[(top + 2) % n], x: px - R, y: py - 46, top: false });
        for (let i = 0; i < slots.length; i++) {
            const sl = slots[i];
            const size = sl.top ? 26 : 17;
            if (sl.top) {
                const g = ctx.createRadialGradient(sl.x, sl.y, 2, sl.x, sl.y, 34);
                g.addColorStop(0, 'rgba(255,255,255,0.42)');
                g.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(sl.x, sl.y, 34, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.save();
            ctx.globalAlpha = sl.top ? 1 : 0.6;
            ctx.fillStyle = 'rgba(12,20,34,0.82)';
            ctx.beginPath();
            ctx.arc(sl.x, sl.y, size * 0.95, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = ITEM_BY_ID[sl.id].color;
            ctx.lineWidth = sl.top ? 3 : 1.5;
            ctx.stroke();
            ctx.restore();
            drawItemIcon(sl.id, sl.x, sl.y, size * 0.86, sl.top ? 1 : 0.78);
            // 方向指示（只在头顶上方画）
            if (sl.top) {
                ctx.save();
                ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 5);
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(sl.x, sl.y - 46);
                ctx.lineTo(sl.x - 7, sl.y - 58);
                ctx.lineTo(sl.x + 7, sl.y - 58);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
        }
        // 左右尖端提示
        ctx.save();
        ctx.globalAlpha = 0.55;
        setFont(11, 'bold');
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#cfe4ff';
        ctx.fillText('← 切换 →', px, py - 132);
        ctx.restore();
        // 选择倒计时圆环
        if (world.pkgTimer > 0) {
            const k = clamp(world.pkgTimer / PKG_TIME, 0, 1);
            const low = k < 0.3;
            const cxp = px, cyp = py - 104;
            ctx.save();
            ctx.strokeStyle = 'rgba(255,255,255,0.16)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(cxp, cyp, PKG_TIMER_R, 0, Math.PI * 2);
            ctx.stroke();
            ctx.strokeStyle = low ? 'rgba(255,120,120,' + (0.6 + 0.4 * Math.abs(Math.sin(t * 8))) + ')'
                : 'rgba(255,224,102,0.9)';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(cxp, cyp, PKG_TIMER_R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k);
            ctx.stroke();
            ctx.lineCap = 'butt';
            setFont(11, 'bold');
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = low ? '#ff9b9b' : '#ffe066';
            ctx.fillText(Math.ceil(world.pkgTimer) + 's', cxp, cyp + PKG_TIMER_R + 13);
            ctx.restore();
        }
    }

// ==================== 特效 ====================
    function addFx(o) { world.fx.push(o); }
    function addPopup(x, y, text, col, follow) {
        world.popups.push({ x: x, y: y, text: text, col: col || '#ffd966', life: 1.3, follow: !!follow });
    }
    function wrapDX(wx) { let d = wx - world.cam.x; const hw = MAP_W / 2; if (d > hw) d -= MAP_W; else if (d < -hw) d += MAP_W; return d; }
    function wrapDY(wy) { let d = wy - world.cam.y; const hh = MAP_H / 2; if (d > hh) d -= MAP_H; else if (d < -hh) d += MAP_H; return d; }
    function dX(a, b) { let d = a - b; const hw = MAP_W / 2; if (d > hw) d -= MAP_W; else if (d < -hw) d += MAP_W; return d; }
    function dY(a, b) { let d = a - b; const hh = MAP_H / 2; if (d > hh) d -= MAP_H; else if (d < -hh) d += MAP_H; return d; }
    function scrX(wx) { return W / 2 + wrapDX(wx); }
    function scrY(wy) { return PLAY_H / 2 + wrapDY(wy); }

    // ==================== 敌人 ====================
    function enemyStat(tier, kind) {
        const base = 58 + Math.random() * 24;
        const speed = base * (1 + tier * 0.18) * (kind === 'runner' ? 1.5 : 1);
        // 第一波（tier 0）一枪就能打死：固定 1 点血
        let hp = 1;
        if (tier > 0) hp = Math.max(1, Math.round((1 + tier) * (kind === 'runner' ? 0.7 : 1) * (kind === 'ranged' ? 1.5 : 1)));
        return { speed: speed, hp: hp };
    }
    function spawnEnemy(forcedKind) {
        const p = world.planet;
        if (!p.enemy) return;
        const cam = world.cam;
        const m = 60;
        const side = randInt(0, 3);
        let x = 0, y = 0;
        if (side === 0) { x = cam.x + rand(-W / 2 - m, W / 2 + m); y = cam.y - PLAY_H / 2 - m; }
        else if (side === 1) { x = cam.x + rand(-W / 2 - m, W / 2 + m); y = cam.y + PLAY_H / 2 + m; }
        else if (side === 2) { x = cam.x - W / 2 - m; y = cam.y + rand(-PLAY_H / 2 - m, PLAY_H / 2 + m); }
        else { x = cam.x + W / 2 + m; y = cam.y + rand(-PLAY_H / 2 - m, PLAY_H / 2 + m); }
        let kind = 'grunt';
        if (world.tier >= 1 && Math.random() < 0.28) kind = 'runner';
        // 5 级后小概率出现远程射击敌人
        if (world.level >= 5 && Math.random() < 0.10 + (world.level - 5) * 0.012) kind = 'ranged';
        if (forcedKind) kind = forcedKind;
        const st = enemyStat(world.tier, kind);
        world.enemies.push({
            x: wrapVal(x, MAP_W), y: wrapVal(y, MAP_H),
            hp: st.hp, maxHp: st.hp, speed: st.speed, kind: kind,
            r: kind === 'runner' ? 13 : (kind === 'ranged' ? 17 : 16),
            ph: Math.random() * Math.PI * 2,
            flash: 0, cd: rand(0.5, 2.2), ang: Math.random() * Math.PI * 2
        });
    }

    function drawEnemy(e) {
        const x = scrX(e.x), y = scrY(e.y);
        const m = 60 / viewZoom;
        if (x < -m || x > W + m || y < -m || y > PLAY_H + m) return;
        const p = world.planet;
        const c = p.enemy;
        ctx.save();
        ctx.translate(x, y);
        // 影子
        ctx.globalAlpha = 0.25;
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.ellipse(3, e.r * 0.72, e.r * 0.85, e.r * 0.36, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        const wob = Math.sin(world.t * 6 + e.ph) * 0.10;
        if (e.kind === 'runner') {
            ctx.rotate(wob * 2);
            ctx.fillStyle = e.flash > 0 ? '#ffffff' : c.body;
            ctx.beginPath();
            ctx.moveTo(e.r * 1.15, 0);
            ctx.lineTo(-e.r * 0.6, -e.r * 0.85);
            ctx.lineTo(-e.r * 0.2, 0);
            ctx.lineTo(-e.r * 0.6, e.r * 0.85);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = c.dark;
            ctx.beginPath();
            ctx.moveTo(-e.r * 0.6, 0);
            ctx.lineTo(-e.r * 1.15, -e.r * 0.5);
            ctx.lineTo(-e.r * 1.15, e.r * 0.5);
            ctx.closePath();
            ctx.fill();
        } else if (e.kind === 'ranged') {
            ctx.fillStyle = e.flash > 0 ? '#ffffff' : c.dark;
            ctx.beginPath();
            ctx.ellipse(0, 0, e.r * 1.05, e.r * 1.15, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = e.flash > 0 ? '#ffffff' : c.body;
            ctx.beginPath();
            ctx.ellipse(0, -e.r * 0.2, e.r * 0.8, e.r * 0.8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.fillRect(-e.r * 0.9, e.r * 0.35, e.r * 1.8, e.r * 0.22);
        } else {
            ctx.rotate(wob);
            ctx.fillStyle = e.flash > 0 ? '#ffffff' : c.body;
            ctx.beginPath();
            ctx.ellipse(0, 0, e.r * 1.05, e.r * 1.15, 0, 0, Math.PI * 2);
            ctx.fill();
            // 触角
            ctx.strokeStyle = c.dark;
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            for (let i = 0; i < 3; i++) {
                const a = -Math.PI * 0.75 + i * (Math.PI * 0.75) + wob * 2;
                ctx.beginPath();
                ctx.moveTo(Math.cos(a) * e.r * 0.7, Math.sin(a) * e.r * 0.75);
                ctx.lineTo(Math.cos(a) * e.r * 1.35, Math.sin(a) * e.r * 1.4 - 3);
                ctx.stroke();
                ctx.fillStyle = c.eye;
                ctx.beginPath();
                ctx.arc(Math.cos(a) * e.r * 1.35, Math.sin(a) * e.r * 1.4 - 3, 2.6, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.fillStyle = c.dark;
            ctx.beginPath();
            ctx.ellipse(0, e.r * 0.28, e.r * 0.72, e.r * 0.5, 0, 0, Math.PI * 2);
            ctx.fill();
        }
        // 眼睛
        if (e.kind !== 'runner') {
            const dirX = dX(world.player.x, e.x);
            const dirY = dY(world.player.y, e.y);
            const m = Math.max(1, Math.hypot(dirX, dirY));
            const ex = dirX / m * e.r * 0.34, ey = dirY / m * e.r * 0.3 - e.r * 0.16;
            ctx.fillStyle = e.flash > 0 ? '#ff4444' : c.eye;
            ctx.beginPath();
            ctx.arc(ex - 3, ey, 3, 0, Math.PI * 2);
            ctx.arc(ex + 3, ey, 3, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
        if (e.maxHp > 1 && e.hp < e.maxHp) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(x - e.r, y - e.r - 11, e.r * 2, 3.5);
            ctx.fillStyle = '#7cf07c';
            ctx.fillRect(x - e.r, y - e.r - 11, e.r * 2 * (e.hp / e.maxHp), 3.5);
        }
    }

    function killEnemy(e, i, gainXp) {
        world.enemies.splice(i, 1);
        world.kills++;
        world.score += 10 + world.tier * 5;
        const val = e.kind === 'ranged' ? 3 : (e.kind === 'runner' ? 2 : 1);
        world.orbs.push({ x: e.x, y: e.y, val: gainXp === false ? 0 : val, ph: Math.random() * 6, homing: false });
        addFx({ kind: 'boom', x: e.x, y: e.y, life: 0.36, max: 0.36, r: e.r * 2.2, col: world.planet.accent });
        sfx('enemyDie');
    }

    function damagePlayer(dmg, fromX, fromY) {
        const p = world.player;
        if (p.invuln > 0 || p.rollT > 0 || world.over || world.bossDefeated) return;
        p.hp -= dmg;
        p.invuln = 1.5;
        p.hitFlash = 0.35;
        addFx({ kind: 'boom', x: p.x, y: p.y, life: 0.3, max: 0.3, r: 40, col: '#ff6b6b' });
        sfx('hurt');
        if (fromX !== undefined) {
            const dx = dX(p.x, fromX), dy = dY(p.y, fromY);
            const m = Math.max(1, Math.hypot(dx, dy));
            p.x = wrapVal(p.x + dx / m * 34, MAP_W);
            p.y = wrapVal(p.y + dy / m * 34, MAP_H);
        }
        if (p.hp <= 0) {
            p.hp = 0;
            world.over = true;
            sfx('explode');
        }
    }

    // ==================== BOSS ====================
    function spawnBoss() {
        const p = world.planet;
        if (!p.boss) return;
        const cam = world.cam;
        world.boss = {
            x: wrapVal(cam.x + W / 2 + 90, MAP_W),
            y: wrapVal(cam.y, MAP_H),
            hp: 50, maxHp: 50,
            r: 54,
            ang: Math.PI,
            speed: 54 + world.tier * 10,
            cd: 2.0, cd2: 3.4,
            ph: 0, flash: 0, hurtT: 0, dying: 0
        };
        world.bossDefeated = false;
        sfx('boss');
        addPopup(wrapDX(world.boss.x) + W / 2, wrapDY(world.boss.y) + PLAY_H / 2 - 70, '警报：' + p.boss, '#ff6b6b');
    }

    function bossShootBullet(x, y, ang, spd, r, col, homing) {
        world.enemyBullets.push({
            x: wrapVal(x, MAP_W), y: wrapVal(y, MAP_H),
            vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
            r: r || 6, life: 5.5, col: col || world.planet.accent, homing: homing || 0, ph: Math.random() * 6
        });
    }
    function bossAddZone(x, y, r, type, life) {
        world.zones.push({ x: wrapVal(x, MAP_W), y: wrapVal(y, MAP_H), r: r, type: type, life: life || 7, tick: 0, ph: Math.random() * 6 });
    }

    function bossUpdate(dt) {
        const b = world.boss;
        if (!b) return;
        if (world.bossDefeated) {
            // 击败后完全静止：不再位移、不再旋转，只让受击闪光消退
            if (b.flash > 0) b.flash -= dt;
            if (b.hurtT > 0) b.hurtT -= dt;
            return;
        }
        const p = world.player;
        const dx = dX(p.x, b.x), dy = dY(p.y, b.y);
        const d = Math.max(1, Math.hypot(dx, dy));
        b.ph += dt;
        // 保持中距离游走
        const want = 250;
        const moveDir = d < want - 40 ? -1 : (d > want + 60 ? 1 : 0);
        const wob = Math.sin(b.ph * 0.9) * 0.9;
        const mx = (dx / d), my = (dy / d);
        const px2 = -my, py2 = mx;
        const sp = b.speed;
        b.x = wrapVal(b.x + (mx * moveDir + px2 * wob) * sp * dt, MAP_W);
        b.y = wrapVal(b.y + (my * moveDir + py2 * wob) * sp * dt, MAP_H);
        b.ang += (angDiff(Math.atan2(dy, dx), b.ang)) * Math.min(1, dt * 3);
        b.cd -= dt;
        b.cd2 -= dt;
        if (b.flash > 0) b.flash -= dt;
        if (b.hurtT > 0) b.hurtT -= dt;

        const abil = world.planet.ability;
        // 普通弹幕
        if (b.cd <= 0) {
            b.cd = 1.5 - world.tier * 0.12;
            const base = Math.atan2(dy, dx);
            const n = 3 + world.tier;
            for (let i = 0; i < n; i++) {
                const a = base + (i - (n - 1) / 2) * 0.22;
                bossShootBullet(b.x, b.y, a, 190 + world.tier * 18, 6.5, world.planet.accent);
            }
        }
        if (b.cd2 <= 0) {
            b.cd2 = 5.2 - world.tier * 0.5;
            const px3 = wrapVal(p.x + rand(-90, 90), MAP_W);
            const py3 = wrapVal(p.y + rand(-90, 90), MAP_H);
            switch (abil) {
                case 'water':
                    bossAddZone(px3, py3, rand(95, 150), 'slow', 8);
                    bossAddZone(wrapVal(p.x, MAP_W), wrapVal(p.y, MAP_H), rand(90, 130), 'slow', 7);
                    break;
                case 'acid':
                    bossAddZone(px3, py3, rand(70, 100), 'acid', 8);
                    bossAddZone(wrapVal(b.x, MAP_W), wrapVal(b.y, MAP_H), 120, 'acid', 5);
                    break;
                case 'fire':
                    bossAddZone(px3, py3, rand(60, 85), 'fire', 6.5);
                    for (let i = 0; i < 2; i++) bossAddZone(wrapVal(p.x + rand(-150, 150), MAP_W), wrapVal(p.y + rand(-150, 150), MAP_H), rand(55, 80), 'fire', 5.5);
                    break;
                case 'thunder':
                    world.marks.push({ kind: 'strike', x: px3, y: py3, r: 62, life: 0.85, max: 0.85 });
                    break;
                case 'blade':
                    world.blades.push({ x: b.x, y: b.y, ang: b.ang, spin: 2.5, life: 7, r: 118, hitT: 0, n: 2 });
                    break;
                case 'laser':
                    world.beams.push({
                        x: b.x, y: b.y, ang: Math.atan2(dy, dx) + rand(-0.5, 0.5),
                        warn: 0.95, life: 0.55, width: 26, len: 1800, hitT: 0
                    });
                    break;
                case 'homing':
                    for (let i = 0; i < 4; i++) {
                        const a = b.ph * 2 + i * Math.PI / 2;
                        bossShootBullet(b.x, b.y, a, 130, 8, '#bfe8ff', 1.5);
                    }
                    break;
                case 'summon':
                    spawnEnemy('grunt'); spawnEnemy('runner');
                    world.marks.push({ kind: 'pulse', x: b.x, y: b.y, r: 0, life: 1.1, max: 1.1, speed: 300 });
                    break;
            }
            sfx(abil === 'laser' ? 'laser' : 'hit');
        }
    }

    function drawBoss() {
        const b = world.boss;
        if (!b) return;
        const x = scrX(b.x), y = scrY(b.y);
        const m = 140 / viewZoom;
        if (x < -m || x > W + m || y < -m || y > PLAY_H + m) return;
        const c = world.planet.bossCol;
        const t = world.t;
        ctx.save();
        ctx.translate(x, y);
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.ellipse(4, b.r * 0.8, b.r * 0.95, b.r * 0.34, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.rotate(b.ang);
        const flash = b.flash > 0;
        // 主体
        ctx.fillStyle = flash ? '#ffffff' : c.dark;
        ctx.beginPath();
        ctx.ellipse(0, 0, b.r * 1.05, b.r * 0.92, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = flash ? '#ffffff' : c.body;
        ctx.beginPath();
        ctx.ellipse(-b.r * 0.08, -b.r * 0.12, b.r * 0.78, b.r * 0.68, 0, 0, Math.PI * 2);
        ctx.fill();
        // 甲壳纹路
        ctx.strokeStyle = 'rgba(0,0,0,0.25)';
        ctx.lineWidth = 3;
        for (let i = 0; i < 3; i++) {
            ctx.beginPath();
            ctx.arc(-b.r * 0.1, -b.r * 0.1, b.r * (0.3 + i * 0.16), -0.8, 0.8);
            ctx.stroke();
        }
        // 眼睛
        ctx.fillStyle = flash ? '#ff5555' : c.eye;
        ctx.beginPath();
        ctx.ellipse(b.r * 0.52, -b.r * 0.22, 6.5, 8, 0, 0, Math.PI * 2);
        ctx.ellipse(b.r * 0.52, b.r * 0.26, 5, 6.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.beginPath();
        ctx.ellipse(b.r * 0.56, -b.r * 0.22, 2.4, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        // 尖刺
        ctx.fillStyle = flash ? '#ffffff' : shadeHex(c.dark, -0.2);
        for (let i = 0; i < 6; i++) {
            const a = -Math.PI * 0.85 + i * (Math.PI * 1.7 / 5);
            ctx.save();
            ctx.rotate(a);
            ctx.beginPath();
            ctx.moveTo(b.r * 0.9, -7);
            ctx.lineTo(b.r * 1.32, 0);
            ctx.lineTo(b.r * 0.9, 7);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }
        ctx.restore();
        // 核心
        ctx.save();
        // 击败后核心停止脉动
        ctx.globalAlpha = world.bossDefeated ? 0.25 : 0.55 + 0.3 * Math.sin(t * 5);
        const g = ctx.createRadialGradient(x, y, 4, x, y, b.r * 1.5);
        g.addColorStop(0, world.bossDefeated ? '#5a5f6a' : c.eye);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, b.r * 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
    function shadeHex(h, amt) { return shade(h, amt); }

    // ==================== 玩家动作 ====================
    function applyItem(id) {
        const p = world.player;
        world.stats.items[id] = (world.stats.items[id] || 0) + 1;
        switch (id) {
            case 'heart':
                if (p.hp < p.maxHp) { p.hp++; addPopup(p.x, p.y - 30, '+1 生命', '#ff8fa3', true); }
                else { world.score += 50; addPopup(p.x, p.y - 30, '+50 分数', '#ffd966', true); }
                break;
            case 'shoes':
                p.speedMul += 0.10;
                addPopup(p.x, p.y - 30, '移动速度 +10%', '#5ad2a0', true);
                break;
            case 'magnet':
                p.pickupMul += 0.10;
                addPopup(p.x, p.y - 30, '拾取范围 +10%', '#6fb7ff', true);
                break;
            case 'rate':
                p.rate += 0.10;
                addPopup(p.x, p.y - 30, '射速 +10%', '#ffc857', true);
                break;
            case 'multi':
                p.bullets += 1;
                p.weapon = 'multi';
                addPopup(p.x, p.y - 30, '子弹 +1 发', '#c58cff', true);
                break;
            case 'dmg':
                p.dmg += 1;
                addPopup(p.x, p.y - 30, '攻击力 +1', '#ff8080', true);
                break;
            case 'rocket':
                p.rockets += 1;
                p.dmg += 1;
                p.weapon = 'rocket';
                addPopup(p.x, p.y - 30, p.rockets > 1 ? '火箭炮强化 · 攻击力 +1' : '获得火箭炮 · 攻击力 +1', '#ff8a3d', true);
                break;
        }
        sfx('item');
    }

    // J：选用头顶道具（BOSS 击败后依然可以选择已拾取的武器包）
    function handleAction() {
        if (world.over) return;
        if (world.pkg && world.pkg.length) {
            confirmPkg(false);
            if (world.pkgQueue.length) openPkg(world.pkgQueue.shift());
        }
    }

    // K：翻滚（无敌），冷却 3 秒，方向按当前移动方向
    // 战斗结束（BOSS 已击败）后依然可以翻滚
    function tryRoll() {
        const p = world.player;
        if (world.over) return;
        if (p.rollCd > 0 || p.rollT > 0) return;
        p.rollT = ROLL_TIME;
        p.rollCd = ROLL_CD;
        p.rollAngle = 0;
        // 按当前移动方向滚动：优先使用移动方向，如果没有移动则使用朝向
        const mv = moveVector();
        let dirIdx;
        if (mv.x || mv.y) {
            dirIdx = dirFromVec(mv.x, mv.y);
        } else {
            dirIdx = p.moveDirIdx;
        }
        p.rollDir = dirIdx;
        const d = DIRS[dirIdx];
        const v = ROLL_DIST / ROLL_TIME;
        p.rollVX = d.ix * v;
        p.rollVY = d.iy * v;
        p.dirIdx = dirIdx;            // 滚动时朝向也同步
        p.moveDirIdx = dirIdx;
        sfx('roll');
        for (let i = 0; i < 6; i++) {
            addFx({
                kind: 'spark', x: p.x + rand(-14, 14), y: p.y + rand(-10, 10),
                life: 0.4, max: 0.4, r: rand(3, 7), col: '#ffffff'
            });
        }
    }

    function playerFire() {
        const p = world.player;
        const by = playerBodyY();   // 身形中心（与范围圈一致）
        let target = null, bd = 1e9;
        const pool = world.boss ? world.enemies.concat([world.boss]) : world.enemies;
        for (let i = 0; i < pool.length; i++) {
            const e = pool[i];
            const dx = dX(e.x, p.x), dy = dY(e.y, by);
            const d = dx * dx + dy * dy;
            if (d < bd) { bd = d; target = e; }
        }
        const range = FIRE_RANGE * (p.rockets > 0 ? 1.15 : 1);
        if (!target || Math.sqrt(bd) > range) return;
        const tx = dX(target.x, p.x), ty = dY(target.y, p.y);
        const base = Math.atan2(ty, tx);
        // 朝向：目标大致在前方时才转身，避免边走边打出现"倒着走"
        const mv = moveVector();
        if (!mv.x && !mv.y || (mv.x * tx + mv.y * ty) > 0) {
            p.dirIdx = dirFromVec(tx, ty);
        }
        const isRocket = p.rockets > 0;
        const n = p.bullets;
        const spread = n > 1 ? 0.14 : 0;
        const dmg = p.dmg;   // 火箭弹与脉冲弹同伤害，不再额外加层
        for (let i = 0; i < n; i++) {
            const off = (i - (n - 1) / 2) * spread;
            const spd = isRocket ? 520 : 760;
            world.bullets.push({
                x: wrapVal(p.x + Math.cos(base) * 26, MAP_W),
                y: wrapVal(p.y + Math.sin(base) * 26, MAP_H),
                vx: Math.cos(base + off) * spd, vy: Math.sin(base + off) * spd,
                dmg: dmg, life: isRocket ? 1.25 : 0.95, rocket: isRocket, r: isRocket ? 9 : 5.5
            });
        }
        world.stats.weapons[p.weapon] = (world.stats.weapons[p.weapon] || 0) + n;
        p.muzz = 0.08;
        p.fireCd = BASE_FIRE_CD / p.rate;
        sfx(isRocket ? 'shootRocket' : 'shoot');
        const mx = wrapVal(p.x + Math.cos(base) * 30, MAP_W), my = wrapVal(p.y + Math.sin(base) * 30, MAP_H);
        addFx({ kind: 'muzzle', x: mx, y: my, ang: base, life: 0.09, max: 0.09, col: isRocket ? '#ffb066' : '#bff0ff' });
    }

    function gainXp(v) {
        world.xp += v;
        const newLevel = Math.floor(world.xp / 10) + 1;
        while (world.level < newLevel) {
            world.level++;
            world.score += 25;
            sfx('levelup');
            addPopup(world.player.x, world.player.y - 40, 'LEVEL UP! Lv.' + world.level, '#ffe066', true);
            dropPackage();
            if (world.level === 10 && world.upgrades < 1) {
                world.upgrades = 1;
                world.tier = 1;
                addPopup(world.player.x, world.player.y - 70, '怪物强度提升！', '#ff9b6b', true);
            } else if (world.level === 20) {
                world.upgrades = 2;
                world.tier = 2;
                addPopup(world.player.x, world.player.y - 70, '怪物强化！BOSS 降临', '#ff6b6b', true);
                if (!world.boss && !world.planet.home) spawnBoss();
            }
        }
    }

    const DROP_HEIGHT = PLAY_H * 0.62 + 90;
    function dropPackage() {
        const cam = world.cam;
        // 落点：当前屏幕内的随机地面位置
        const tx = wrapVal(cam.x + rand(-W * 0.36, W * 0.36), MAP_W);
        const ty = wrapVal(cam.y + rand(-PLAY_H * 0.26, PLAY_H * 0.30), MAP_H);
        // 从屏幕最上方下落
        const startY = wrapVal(ty - DROP_HEIGHT, MAP_H);
        const pool = ITEMS.slice();
        const picks = [];
        for (let i = 0; i < 3 && pool.length; i++) {
            const k = randInt(0, pool.length - 1);
            picks.push(pool.splice(k, 1)[0].id);
        }
        world.packages.push({
            x: tx, y: startY, tx: tx, ty: ty, tx0: DROP_HEIGHT,
            vy: 40, items: picks, landed: false, ph: Math.random() * 6
        });
        sfx('drop');
    }

    // ==================== 玩法更新 ====================
    function updatePlay(dt) {
        const p = world.player;
        world.t += dt;
        if (world.launch) {
            // 取舍阶段：仅播放动画，场景保持原样
            updateLaunch(dt);
            return;
        }
        if (world.landing) {
            // 着陆阶段：仅播放动画，与正式游戏场景无缝衔接
            updateLanding(dt);
            for (let i = world.fx.length - 1; i >= 0; i--) {
                const f = world.fx[i];
                f.life -= dt;
                if (f.kind === 'spark') {
                    f.x = wrapVal(f.x + (f.vx || 0) * dt, MAP_W);
                    f.y = wrapVal(f.y + (f.vy || 0) * dt, MAP_H);
                }
                if (f.life <= 0) world.fx.splice(i, 1);
            }
            return;
        }
        if (!world.over) world.runTime += dt;
        const cam = world.cam;
        const planet = world.planet;

        // 失败锁定：人物不可控、场景静止、画面完全定格
        if (world.over) { cam.x = p.x; cam.y = p.y; return; }

        // 区域减速/伤害
        let slow = 1;
        let dmgT = 0;
        for (let i = 0; i < world.zones.length; i++) {
            const z = world.zones[i];
            const dz = Math.hypot(dX(z.x, p.x), dY(z.y, p.y));
            if (dz < z.r) {
                if (z.type === 'slow') slow = 0.32;
                else dmgT += dt;
            }
        }
        world.slowFactor = slow;
        if (dmgT > 0) {
            p.zoneTick = (p.zoneTick || 0) + dmgT;
            if (p.zoneTick >= 0.9) { p.zoneTick = 0; damagePlayer(1); }
        }

        // 移动
        const mv = moveVector();
        p.moving = false;
        if (p.rollT > 0) {
            p.rollT -= dt;
            p.rollAngle += dt * 13;
            p.x = wrapVal(p.x + p.rollVX * dt, MAP_W);
            p.y = wrapVal(p.y + p.rollVY * dt, MAP_H);
        } else if (mv.x || mv.y) {
            const sp = BASE_SPEED * p.speedMul * slow;
            p.x = wrapVal(p.x + mv.x * sp * dt, MAP_W);
            p.y = wrapVal(p.y + mv.y * sp * dt, MAP_H);
            p.dirIdx = dirFromVec(mv.x, mv.y);
            p.moveDirIdx = dirFromVec(mv.x, mv.y);
            p.walkPhase += dt * (8.5 * sp / BASE_SPEED);
            p.moving = true;
        }
        if (p.rollCd > 0) p.rollCd -= dt;
        if (p.invuln > 0) p.invuln -= dt;
        if (p.hitFlash > 0) p.hitFlash -= dt;
        if (p.muzz > 0) p.muzz -= dt;

        // 自动开火
        p.fireCd -= dt;
        if (!world.over && !world.bossDefeated && !planet.home && p.fireCd <= 0) playerFire();

        // 道具环
        // 道具三选一：左/右轮换，静止时不动；10 秒未选则自动结算头顶
        if (world.pkg) {
            updatePkgTimer(dt);
            if (world.pkg) {
                if (menuEdge('left')) rotatePkg(-1);
                if (menuEdge('right')) rotatePkg(1);
            }
        }
        if (actPress()) playerAction();
        if (rollPress()) tryRoll();

        // 刷新敌人
        if (!planet.home && !world.bossDefeated && !world.over) {
            world.spawnTimer -= dt;
            if (world.spawnTimer <= 0) {
                world.spawnTimer = Math.max(0.20, 0.80 - world.tier * 0.24) * rand(0.7, 1.25);
                const maxN = 55 + world.tier * 18;
                // 单次刷怪数量：等级越高一次刷得越多
                let n = 1;
                if (Math.random() < 0.25 + world.level * 0.03) n++;
                if (world.level >= 8 && Math.random() < 0.16 + world.tier * 0.08) n++;
                for (let s = 0; s < n; s++) {
                    if (world.enemies.length < maxN) spawnEnemy();
                }
            }
        }

        // 敌人
        for (let i = world.enemies.length - 1; i >= 0; i--) {
            const e = world.enemies[i];
            if (e.flash > 0) e.flash -= dt;
            const dx = dX(p.x, e.x), dy = dY(p.y, e.y);
            const d = Math.max(1, Math.hypot(dx, dy));
            const wob = Math.sin(world.t * 2.4 + e.ph) * 0.35;
            const nx = dx / d, ny = dy / d;
            e.x = wrapVal(e.x + (nx + -ny * wob) * e.speed * dt, MAP_W);
            e.y = wrapVal(e.y + (ny + nx * wob) * e.speed * dt, MAP_H);
            e.ang = Math.atan2(dy, dx);
            if (e.kind === 'ranged') {
                e.cd -= dt;
                if (e.cd <= 0 && d < 430) {
                    e.cd = rand(1.8, 3.0);
                    const a = Math.atan2(dy, dx) + rand(-0.12, 0.12);
                    world.enemyBullets.push({
                        x: wrapVal(e.x + Math.cos(a) * 18, MAP_W), y: wrapVal(e.y + Math.sin(a) * 18, MAP_H),
                        vx: Math.cos(a) * 230, vy: Math.sin(a) * 230, r: 4.5, life: 3.4, col: planet.accent, homing: 0, ph: 0
                    });
                }
            }
            if (d < e.r + CHAR_S * 0.40) {
                e.x = wrapVal(e.x - nx * 46, MAP_W);
                e.y = wrapVal(e.y - ny * 46, MAP_H);
                damagePlayer(1, e.x, e.y);
                killEnemy(e, i, false);
            }
            // 分离力：避免所有怪挤成一团
            for (let k = 0; k < world.enemies.length; k++) {
                const o = world.enemies[k];
                if (o === e) continue;
                const ox = dX(o.x, e.x), oy = dY(o.y, e.y);
                const dd = Math.hypot(ox, oy);
                if (dd < e.r + o.r && dd > 0.01) {
                    const push = (1 - dd / (e.r + o.r)) * 40 * dt;
                    e.x = wrapVal(e.x - ox / dd * push, MAP_W);
                    e.y = wrapVal(e.y - oy / dd * push, MAP_H);
                }
            }
        }

        // BOSS
        if (world.boss) bossUpdate(dt);
        if (world.boss && !world.bossDefeated) {
            const b = world.boss;
            const d = Math.hypot(dX(b.x, p.x), dY(b.y, p.y));
            if (d < b.r + CHAR_S * 0.45) damagePlayer(1, b.x, b.y);
        }

        // 玩家子弹
        for (let i = world.bullets.length - 1; i >= 0; i--) {
            const bu = world.bullets[i];
            bu.life -= dt;
            bu.x = wrapVal(bu.x + bu.vx * dt, MAP_W);
            bu.y = wrapVal(bu.y + bu.vy * dt, MAP_H);
            if (bu.rocket) {
                addFx({ kind: 'trail', x: bu.x, y: bu.y, life: 0.24, max: 0.24, r: 7, col: '#ffb066' });
            }
            let hitSomething = false;
            for (let j = world.enemies.length - 1; j >= 0; j--) {
                const e = world.enemies[j];
                if (Math.hypot(dX(e.x, bu.x), dY(e.y, bu.y)) < e.r + bu.r) {
                    if (bu.rocket) explodeRocket(bu);
                    else { e.hp -= bu.dmg; e.flash = 0.12; sfx('hit'); }
                    if (e.hp <= 0) killEnemy(e, j);
                    hitSomething = true;
                    break;
                }
            }
            if (!hitSomething && world.boss && !world.bossDefeated) {
                const b = world.boss;
                if (Math.hypot(dX(b.x, bu.x), dY(b.y, bu.y)) < b.r + bu.r) {
                    if (bu.rocket) explodeRocket(bu);
                    else {
                        b.hp -= bu.dmg; b.flash = 0.1; b.hurtT = 0.12; sfx('hit');
                    }
                    hitSomething = true;
                }
            }
            if (hitSomething || bu.life <= 0) world.bullets.splice(i, 1);
        }

        if (world.boss && !world.bossDefeated && world.boss.hp <= 0) {
            const b = world.boss;
            world.bossDefeated = true;
            world.score += 800;
            addFx({ kind: 'boom', x: b.x, y: b.y, life: 1.2, max: 1.2, r: 200, col: planet.accent });
            addFx({ kind: 'boom', x: b.x, y: b.y, life: 1.6, max: 1.6, r: 300, col: '#ffffff' });
            for (let i = 0; i < 8; i++) {
                addFx({ kind: 'boom', x: wrapVal(b.x + rand(-90, 90), MAP_W), y: wrapVal(b.y + rand(-90, 90), MAP_H), life: rand(0.6, 1.1), max: 1.1, r: rand(60, 130), col: planet.accent });
            }
            sfx('explode');
            sfx('clear');
            addPopup(scrX(b.x), scrY(b.y) - 60, 'BOSS 已被击败！', '#ffe066');
            // 清场
            for (let i = world.enemies.length - 1; i >= 0; i--) killEnemy(world.enemies[i], i);
            world.enemyBullets.length = 0;
            for (let i = 0; i < 14; i++) {
                world.orbs.push({ x: wrapVal(b.x + rand(-120, 120), MAP_W), y: wrapVal(b.y + rand(-120, 120), MAP_H), val: 2, ph: Math.random() * 6, homing: false });
            }
            recordRun(true);
        }

        // 敌弹
        for (let i = world.enemyBullets.length - 1; i >= 0; i--) {
            const eb = world.enemyBullets[i];
            eb.life -= dt;
            if (eb.homing > 0) {
                const dx = dX(p.x, eb.x), dy = dY(p.y, eb.y);
                const d = Math.max(1, Math.hypot(dx, dy));
                const cur = Math.atan2(eb.vy, eb.vx);
                const ta = Math.atan2(dy, dx);
                const na = cur + clamp(angDiff(ta, cur), -eb.homing * dt, eb.homing * dt);
                const sp = Math.hypot(eb.vx, eb.vy);
                eb.vx = Math.cos(na) * sp; eb.vy = Math.sin(na) * sp;
            }
            eb.x = wrapVal(eb.x + eb.vx * dt, MAP_W);
            eb.y = wrapVal(eb.y + eb.vy * dt, MAP_H);
            if (Math.hypot(dX(eb.x, p.x), dY(eb.y, p.y)) < eb.r + CHAR_S * 0.36) {
                damagePlayer(1, eb.x, eb.y);
                world.enemyBullets.splice(i, 1);
                continue;
            }
            if (eb.life <= 0) world.enemyBullets.splice(i, 1);
        }

        // 旋刃
        for (let i = world.blades.length - 1; i >= 0; i--) {
            const bl = world.blades[i];
            bl.life -= dt;
            bl.ang += bl.spin * dt;
            if (bl.hitT > 0) bl.hitT -= dt;
            for (let k = 0; k < bl.n; k++) {
                const a = bl.ang + k * Math.PI;
                const bx = wrapVal(bl.x + Math.cos(a) * bl.r, MAP_W);
                const by = wrapVal(bl.y + Math.sin(a) * bl.r * 0.85, MAP_H);
                if (Math.hypot(dX(bx, p.x), dY(by, p.y)) < 34 && bl.hitT <= 0) {
                    bl.hitT = 1.0;
                    damagePlayer(1, bx, by);
                }
            }
            if (bl.life <= 0) world.blades.splice(i, 1);
        }

        // 激光
        for (let i = world.beams.length - 1; i >= 0; i--) {
            const bm = world.beams[i];
            if (bm.warn > 0) bm.warn -= dt;
            else {
                bm.life -= dt;
                if (bm.hitT > 0) bm.hitT -= dt;
                const dx = dX(p.x, bm.x), dy = dY(p.y, bm.y);
                const proj = dx * Math.cos(bm.ang) + dy * Math.sin(bm.ang);
                const perp = Math.abs(-dx * Math.sin(bm.ang) + dy * Math.cos(bm.ang));
                if (proj > 0 && proj < bm.len && perp < bm.width * 0.5 + 14 && bm.hitT <= 0) {
                    bm.hitT = 1.2;
                    damagePlayer(1, bm.x, bm.y);
                }
            }
            if (bm.warn <= 0 && bm.life <= 0) world.beams.splice(i, 1);
        }

        // 区域
        for (let i = world.zones.length - 1; i >= 0; i--) {
            const z = world.zones[i];
            z.life -= dt;
            if (z.life <= 0) world.zones.splice(i, 1);
        }
        // 标记（雷击 / 脉冲）
        for (let i = world.marks.length - 1; i >= 0; i--) {
            const mk = world.marks[i];
            mk.life -= dt;
            if (mk.kind === 'pulse') mk.r += mk.speed * dt;
            if (mk.kind === 'strike' && mk.life <= 0) {
                const d = Math.hypot(dX(mk.x, p.x), dY(mk.y, p.y));
                addFx({ kind: 'boom', x: mk.x, y: mk.y, life: 0.5, max: 0.5, r: mk.r, col: '#ffe066' });
                sfx('explode');
                if (d < mk.r) damagePlayer(1, mk.x, mk.y);
                world.marks.splice(i, 1);
                continue;
            }
            if (mk.kind === 'pulse' && mk.life <= 0) {
                addFx({ kind: 'boom', x: mk.x, y: mk.y, life: 0.4, max: 0.4, r: 90, col: '#c58cff' });
                const d = Math.hypot(dX(mk.x, p.x), dY(mk.y, p.y));
                if (d < mk.r) damagePlayer(1, mk.x, mk.y);
                world.marks.splice(i, 1);
                continue;
            }
            if (mk.life <= 0) world.marks.splice(i, 1);
        }

        // 经验球：必须先进入拾取圈才会被吸引；一旦被吸引必定拾取到
        // BOSS 击败后停止拾取，场上光点冻结为纯装饰
        const pickR = PICKUP_BASE * p.pickupMul;
        // 判定略宽于绘制的圈，抵消取整误差并让圈边缘的手感更跟手
        const lockR = pickR * PICKUP_TOL;
        const oby = playerBodyY();        // 身形中心（与范围圈一致）
        for (let i = world.orbs.length - 1; i >= 0; i--) {
            const o = world.orbs[i];
            if (world.bossDefeated) continue;   // 场上光点冻结为纯装饰
            let dx = dX(p.x, o.x), dy = dY(oby, o.y);
            let d = Math.hypot(dx, dy);
            if (!o.homing) {
                // 未拾取的经验光点本局内不会消失，只有踏入拾取圈才会被吸引
                if (d > lockR) continue;
                o.homing = true;
            }
            if (d <= 6 || d <= dt * ORB_HOMING_SPEED) {
                gainXp(o.val);
                world.score += 2;
                sfx('pickup');
                addFx({ kind: 'spark', x: o.x, y: o.y, life: 0.25, max: 0.25, r: 12, col: '#9bf6b0' });
                world.orbs.splice(i, 1);
                continue;
            }
            // 锁定后匀速直取玩家，速度高于玩家最大移动速度 => 必定拾取
            o.x = wrapVal(o.x + dx / d * ORB_HOMING_SPEED * dt, MAP_W);
            o.y = wrapVal(o.y + dy / d * ORB_HOMING_SPEED * dt, MAP_H);
        }

        // 武器包
        for (let i = world.packages.length - 1; i >= 0; i--) {
            const pk = world.packages[i];
            if (!pk.landed) {
                pk.vy += 760 * dt;
                const step = pk.vy * dt;
                const remain = dY(pk.ty, pk.y);   // 剩余下落距离
                if (remain <= 0 || step >= remain) {
                    pk.y = pk.ty;
                    pk.vy = 0;
                    pk.landed = true;
                    addFx({ kind: 'boom', x: pk.x, y: pk.y, life: 0.45, max: 0.45, r: 66, col: '#ffffff' });
                    sfx('drop');
                } else {
                    pk.y = wrapVal(pk.y + step, MAP_H);
                }
            }
            if (Math.hypot(dX(pk.x, p.x), dY(pk.y, p.y)) < CHAR_S * 0.7) {
                // 未选择状态下又拾取新箱：当前头顶的直接算作已选，再开启新的一轮
                if (world.pkg && world.pkg.length) confirmPkg(true);
                world.pkgQueue.push(pk.items.slice());
                openPkg(world.pkgQueue.shift());
                addFx({ kind: 'spark', x: pk.x, y: pk.y, life: 0.5, max: 0.5, r: 40, col: '#ffe066' });
                addPopup(pk.x, pk.y - 30, '获得 3 个道具！' + PKG_TIME + ' 秒内按 J 选择', '#ffe066');
                sfx('item');
                world.packages.splice(i, 1);
            }
        }

        // 特效 / 飘字
        updateWorldFx(dt);

        // 摄像机
        cam.x = p.x; cam.y = p.y;
    }
    // 特效与飘字的衰减
    function updateWorldFx(dt) {
        const p = world.player;
        for (let i = world.fx.length - 1; i >= 0; i--) {
            const f = world.fx[i];
            f.life -= dt;
            if (f.kind === 'spark') {
                f.x = wrapVal(f.x + (f.vx || 0) * dt, MAP_W);
                f.y = wrapVal(f.y + (f.vy || 0) * dt, MAP_H);
            }
            if (f.life <= 0) world.fx.splice(i, 1);
        }
        for (let i = world.popups.length - 1; i >= 0; i--) {
            const pp = world.popups[i];
            pp.life -= dt;
            if (pp.follow) { pp.x = p.x; pp.y = p.y; }
            if (pp.life <= 0) world.popups.splice(i, 1);
        }
    }

    // J：确认（登船 / 选用道具）；K：翻滚
    function playerAction() {
        const p = world.player;
        if (world.over) return;
        if (world.planet.home || world.bossDefeated) {
            const dr = Math.hypot(dX(world.rocket.x, p.x), dY(world.rocket.y, p.y));
            if (dr < 92) { launchSequence(); return; }
        }
        handleAction();
    }

    function explodeRocket(bu) {
        const R = 96;
        addFx({ kind: 'boom', x: bu.x, y: bu.y, life: 0.5, max: 0.5, r: R, col: '#ff9a3d' });
        sfx('explode');
        for (let j = world.enemies.length - 1; j >= 0; j--) {
            const e = world.enemies[j];
            const d = Math.hypot(dX(e.x, bu.x), dY(e.y, bu.y));
            if (d < R + e.r) {
                e.hp -= bu.dmg; e.flash = 0.2;
                if (e.hp <= 0) killEnemy(e, j);
            }
        }
        if (world.boss && !world.bossDefeated) {
            const b = world.boss;
            if (Math.hypot(dX(b.x, bu.x), dY(b.y, bu.y)) < R + b.r) {
                b.hp -= bu.dmg; b.flash = 0.2;
            }
        }
    }

    function recordRun(cleared) {
        if (world.recorded) return;
        world.recorded = true;
        const id = world.planet.id;
        const rec = save.planets[id];
        rec.runs++;
        rec.kills += world.kills;
        rec.totalScore += world.score;
        rec.bestScore = Math.max(rec.bestScore, world.score);
        rec.bestLevel = Math.max(rec.bestLevel, world.level);
        rec.totalTime += world.runTime;
        if (cleared) {
            rec.clears++;
            if (world.runTime > 0 && (rec.bestTime === 0 || world.runTime < rec.bestTime)) rec.bestTime = world.runTime;
        }
        for (const k in world.stats.weapons) rec.weapons[k] = (rec.weapons[k] || 0) + world.stats.weapons[k];
        for (const k in world.stats.items) rec.items[k] = (rec.items[k] || 0) + world.stats.items[k];
        save.totalScore += world.score;
        save.totalKills += world.kills;
        persist();
    }

// ==================== 玩法绘制 ====================
    function drawRocketAt(x, y, ang, t, flame, scale) {
        const S = scale || 1;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(ang);
        ctx.scale(S, S);
        // 地面投影
        ctx.save();
        ctx.globalAlpha = 0.34;
        const sg = ctx.createRadialGradient(0, 46, 4, 0, 48, 58);
        sg.addColorStop(0, 'rgba(0,0,0,0.85)');
        sg.addColorStop(0.6, 'rgba(0,0,0,0.35)');
        sg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = sg;
        ctx.beginPath();
        ctx.ellipse(0, 46, 52, 17, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        // 尾焰
        if (flame > 0) {
            const fl = 34 + 30 * flame + 14 * Math.sin(t * 22);
            const fg = ctx.createRadialGradient(0, 44, 2, 0, 46, fl * 1.1);
            fg.addColorStop(0, 'rgba(255,220,150,0.22)');
            fg.addColorStop(1, 'rgba(255,90,20,0)');
            ctx.fillStyle = fg;
            ctx.beginPath();
            ctx.arc(0, 46, fl * 1.1, 0, Math.PI * 2);
            ctx.fill();
            const g = ctx.createLinearGradient(0, 40, 0, 40 + fl);
            g.addColorStop(0, 'rgba(255,248,214,0.95)');
            g.addColorStop(0.3, 'rgba(255,190,86,0.72)');
            g.addColorStop(0.66, 'rgba(255,110,40,0.34)');
            g.addColorStop(1, 'rgba(255,60,20,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.moveTo(-20, 40);
            ctx.quadraticCurveTo(-13, 40 + fl * 1.02, 0, 40 + fl * 1.32);
            ctx.quadraticCurveTo(13, 40 + fl * 1.02, 20, 40);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,240,0.5)';
            ctx.beginPath();
            ctx.moveTo(-7, 40);
            ctx.quadraticCurveTo(0, 40 + fl * 0.62, 7, 40);
            ctx.closePath();
            ctx.fill();
        }
        // 支腿（先画，被机身压住）
        for (let s = -1; s <= 1; s += 2) {
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#6f7a8c';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(s * 13, 20);
            ctx.lineTo(s * 42, 52);
            ctx.stroke();
            ctx.strokeStyle = '#aab4c4';
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.moveTo(s * 13, 20);
            ctx.lineTo(s * 42, 52);
            ctx.stroke();
            ctx.strokeStyle = '#8b96a8';
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.moveTo(s * 26, 36);
            ctx.lineTo(s * 40, 33);
            ctx.stroke();
            ctx.fillStyle = '#5e6878';
            ctx.beginPath();
            ctx.ellipse(s * 44, 55, 11, 5, s * 0.28, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(215,232,255,0.28)';
            ctx.beginPath();
            ctx.ellipse(s * 44, 53, 8, 2.6, s * 0.28, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.lineCap = 'butt';
        // 尾翼
        for (let s = -1; s <= 1; s += 2) {
            const fg = ctx.createLinearGradient(s * 13, 0, s * 46, 46);
            fg.addColorStop(0, '#e8634f');
            fg.addColorStop(1, '#9c2b24');
            ctx.fillStyle = fg;
            ctx.beginPath();
            ctx.moveTo(s * 13, 2);
            ctx.lineTo(s * 46, 38);
            ctx.lineTo(s * 41, 45);
            ctx.lineTo(s * 13, 33);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = 'rgba(30,10,10,0.35)';
            ctx.lineWidth = 1;
            ctx.stroke();
        }
        // 机身
        const g2 = ctx.createLinearGradient(-30, 0, 30, 0);
        g2.addColorStop(0, '#7a8698');
        g2.addColorStop(0.16, '#bcc5d3');
        g2.addColorStop(0.4, '#ffffff');
        g2.addColorStop(0.66, '#dae0ea');
        g2.addColorStop(1, '#74808f');
        ctx.fillStyle = g2;
        ctx.beginPath();
        ctx.moveTo(0, -68);
        ctx.bezierCurveTo(15, -62, 25, -46, 27, -27);
        ctx.lineTo(27, 22);
        ctx.quadraticCurveTo(27, 33, 17, 33);
        ctx.lineTo(-17, 33);
        ctx.quadraticCurveTo(-27, 33, -27, 22);
        ctx.lineTo(-27, -27);
        ctx.bezierCurveTo(-25, -46, -15, -62, 0, -68);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(24,32,48,0.45)';
        ctx.lineWidth = 1.3;
        ctx.stroke();
        // 面板线
        ctx.strokeStyle = 'rgba(40,52,74,0.16)';
        ctx.lineWidth = 1;
        for (let y = -32; y <= 12; y += 16) {
            ctx.beginPath();
            ctx.moveTo(-27, y); ctx.lineTo(27, y); ctx.stroke();
        }
        // 涂装带
        ctx.fillStyle = '#e04b3c';
        ctx.fillRect(-27, 16, 54, 7);
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(-27, 16, 54, 2);
        // 驾驶舱
        const cg = ctx.createRadialGradient(-4, -32, 2, 0, -25, 17);
        cg.addColorStop(0, '#8ce8ff');
        cg.addColorStop(0.45, '#3a7fb8');
        cg.addColorStop(1, '#14304d');
        ctx.fillStyle = cg;
        ctx.beginPath();
        ctx.ellipse(0, -25, 13, 15, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(228,244,255,0.8)';
        ctx.lineWidth = 1.8;
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath();
        ctx.ellipse(-5, -30, 3.4, 5.8, -0.5, 0, Math.PI * 2);
        ctx.fill();
        // 舷窗
        ctx.fillStyle = '#2f4f7a';
        ctx.strokeStyle = 'rgba(200,225,255,0.55)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(-14, -2, 5, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
        ctx.beginPath();
        ctx.arc(14, -2, 5, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
        // 引擎喷口
        ctx.fillStyle = '#525d6e';
        ctx.beginPath();
        ctx.moveTo(-14, 30); ctx.lineTo(14, 30); ctx.lineTo(18, 41); ctx.lineTo(-18, 41);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(20,26,38,0.6)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = '#2b3242';
        ctx.beginPath();
        ctx.ellipse(0, 41, 18, 5.5, 0, 0, Math.PI * 2);
        ctx.fill();
        // 航行灯
        if ((t % 1.2) < 0.62) {
            ctx.fillStyle = 'rgba(255,96,96,0.95)';
            ctx.beginPath(); ctx.arc(-30, -12, 2.8, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(120,255,170,0.95)';
            ctx.beginPath(); ctx.arc(30, -12, 2.8, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
    }

    function drawZones() {
        for (let i = 0; i < world.zones.length; i++) {
            const z = world.zones[i];
            const x = scrX(z.x), y = scrY(z.y);
            const m = 220 / viewZoom;
            if (x < -m || x > W + m || y < -m || y > PLAY_H + m) continue;
            const fade = Math.min(1, z.life);
            const pulse = 0.5 + 0.5 * Math.sin(world.t * 3 + z.ph);
            ctx.save();
            ctx.translate(x, y);
            if (z.type === 'slow') {
                const g = ctx.createRadialGradient(0, 0, z.r * 0.2, 0, 0, z.r);
                g.addColorStop(0, 'rgba(120,210,255,' + (0.42 * fade) + ')');
                g.addColorStop(0.75, 'rgba(60,150,230,' + (0.30 * fade) + ')');
                g.addColorStop(1, 'rgba(40,120,200,0)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.ellipse(0, 0, z.r, z.r * 0.78, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(190,240,255,' + (0.5 * fade) + ')';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(0, 0, z.r * 0.9, z.r * 0.7, 0, 0, Math.PI * 2);
                ctx.stroke();
            } else if (z.type === 'fire') {
                for (let k = 0; k < 5; k++) {
                    const a = z.ph + k * 1.25;
                    const rr = z.r * (0.35 + 0.5 * ((k * 0.37 + pulse) % 1));
                    const fh = 26 + 22 * Math.sin(world.t * 9 + k + z.ph);
                    const g = ctx.createRadialGradient(Math.cos(a) * rr * 0.5, Math.sin(a) * rr * 0.35, 2, Math.cos(a) * rr * 0.5, Math.sin(a) * rr * 0.35, fh);
                    g.addColorStop(0, 'rgba(255,240,150,' + (0.75 * fade) + ')');
                    g.addColorStop(0.4, 'rgba(255,140,40,' + (0.55 * fade) + ')');
                    g.addColorStop(1, 'rgba(200,40,10,0)');
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.ellipse(Math.cos(a) * rr * 0.5, Math.sin(a) * rr * 0.35, fh * 0.6, fh, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else { // acid
                const g = ctx.createRadialGradient(0, 0, 2, 0, 0, z.r);
                g.addColorStop(0, 'rgba(190,255,120,' + (0.5 * fade) + ')');
                g.addColorStop(0.7, 'rgba(110,190,60,' + (0.34 * fade) + ')');
                g.addColorStop(1, 'rgba(70,140,30,0)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.ellipse(0, 0, z.r, z.r * 0.8, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(220,255,160,' + (0.25 * fade) + ')';
                for (let k = 0; k < 4; k++) {
                    const a = world.t * 1.4 + k * 1.6 + z.ph;
                    ctx.beginPath();
                    ctx.arc(Math.cos(a) * z.r * 0.4, Math.sin(a) * z.r * 0.3, 3 + 3 * pulse, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.restore();
        }
    }

    function drawMarks() {
        for (let i = 0; i < world.marks.length; i++) {
            const mk = world.marks[i];
            const x = scrX(mk.x), y = scrY(mk.y);
            if (mk.kind === 'strike') {
                const t = 1 - mk.life / mk.max;
                ctx.save();
                ctx.strokeStyle = 'rgba(255,230,100,' + (0.4 + 0.5 * t) + ')';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(x, y, mk.r * (0.4 + 0.6 * t), 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x - mk.r, y); ctx.lineTo(x + mk.r, y);
                ctx.moveTo(x, y - mk.r); ctx.lineTo(x, y + mk.r);
                ctx.stroke();
                ctx.restore();
            } else if (mk.kind === 'pulse') {
                ctx.save();
                ctx.strokeStyle = 'rgba(200,140,255,' + (mk.life / mk.max) + ')';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(x, y, mk.r, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();

    function drawPackages() {
        for (let i = 0; i < world.packages.length; i++) {
            const pk = world.packages[i];
            const x = scrX(pk.x), y = scrY(pk.y);
            const bob = pk.landed ? Math.sin(world.t * 4 + pk.ph) * 3 : 0;
            if (!pk.landed) {
                // 落点在地面上的轻微阴影（越接近越清晰）
                const gx = scrX(pk.tx), gy = scrY(pk.ty);
                const fall = clamp(1 - Math.abs(dY(pk.y, pk.ty)) / pk.tx0, 0, 1);
                ctx.save();
                ctx.globalAlpha = 0.10 + 0.30 * fall;
                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.ellipse(gx, gy + 26, 20 + 20 * (1 - fall), 6 + 7 * (1 - fall), 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            ctx.save();
            ctx.translate(x, y + bob);
            if (pk.landed) {
                ctx.fillStyle = 'rgba(0,0,0,0.25)';
                ctx.beginPath();
                ctx.ellipse(0, 28, 26, 9, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            if (!pk.landed) {
                // 降落伞
                ctx.strokeStyle = '#dfe8f5';
                ctx.lineWidth = 2.4;
                ctx.beginPath();
                ctx.moveTo(-30, -56); ctx.lineTo(0, 0);
                ctx.moveTo(30, -56); ctx.lineTo(0, 0);
                ctx.stroke();
                ctx.fillStyle = '#ff5c5c';
                ctx.beginPath();
                ctx.arc(0, -62, 30, Math.PI, 0);
                ctx.fill();
                ctx.fillStyle = '#f5f7fa';
                ctx.beginPath();
                ctx.arc(0, -62, 30, Math.PI, 1.5 * Math.PI);
                ctx.fill();
                ctx.fillStyle = '#ff5c5c';
                ctx.beginPath();
                ctx.arc(0, -62, 30, 2.5 * Math.PI, 2 * Math.PI);
                ctx.fill();
            } else {
                // 醒目脉冲光环
                const glow = 0.35 + 0.35 * Math.sin(world.t * 5 + pk.ph);
                const g = ctx.createRadialGradient(0, 0, 4, 0, 0, 72);
                g.addColorStop(0, 'rgba(255,236,140,' + (0.5 * glow) + ')');
                g.addColorStop(0.55, 'rgba(255,176,48,' + (0.22 * glow) + ')');
                g.addColorStop(1, 'rgba(255,140,20,0)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(0, 0, 72, 0, Math.PI * 2);
                ctx.fill();
            }
            // ===== 箱体（52×42，比原来更大）=====
            const BW = 52, BH = 42, BX = -BW / 2, BY = -18;
            // 外壳
            const bg = ctx.createLinearGradient(0, BY, 0, BY + BH);
            bg.addColorStop(0, '#ffd75e');
            bg.addColorStop(0.5, '#ff9f1c');
            bg.addColorStop(1, '#e06a00');
            ctx.fillStyle = bg;
            roundRectPath(BX, BY, BW, BH, 8);
            ctx.fill();
            ctx.strokeStyle = '#7a3c00';
            ctx.lineWidth = 2.5;
            ctx.stroke();
            // 顶部高光
            ctx.fillStyle = 'rgba(255,255,255,0.45)';
            roundRectPath(BX + 4, BY + 3, BW - 8, 8, 4);
            ctx.fill();
            // 深色腰带 + 铆钉
            ctx.fillStyle = '#5a2d00';
            ctx.fillRect(BX, BY + 16, BW, 9);
            ctx.fillStyle = 'rgba(255,220,140,0.9)';
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.arc(BX + 7 + i * 9.5, BY + 20.5, 1.8, 0, Math.PI * 2);
                ctx.fill();
            }
            // 四角护角
            ctx.fillStyle = '#8a4a00';
            for (const [cx2, cy2] of [[BX + 5, BY + 5], [BX + BW - 5, BY + 5], [BX + 5, BY + BH - 5], [BX + BW - 5, BY + BH - 5]]) {
                ctx.beginPath();
                ctx.arc(cx2, cy2, 4.2, 0, Math.PI * 2);
                ctx.fill();
            }
            // 中央发光标记（惊叹号）
            ctx.fillStyle = '#3a1c00';
            roundRectPath(-5, BY + 7, 10, 18, 4);
            ctx.fill();
            ctx.fillStyle = '#fff4c2';
            roundRectPath(-2.6, BY + 9.5, 5.2, 9, 2.2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(0, BY + 22.5, 3, 0, Math.PI * 2);
            ctx.fill();
            // 底部锁扣
            ctx.fillStyle = '#8a8f9a';
            roundRectPath(-7, BY + BH - 3, 14, 7, 2);
            ctx.fill();
            ctx.fillStyle = '#dfe4ec';
            ctx.fillRect(-5, BY + BH - 1, 10, 2);
            ctx.restore();
        }
    }

    function drawOrbs() {
        for (let i = 0; i < world.orbs.length; i++) {
            const o = world.orbs[i];
            const x = scrX(o.x), y = scrY(o.y);
            const bob = Math.sin(world.t * 4 + o.ph) * 3;
            const fade = world.bossDefeated ? 0.55 : 1;
            const pulse = 1 + 0.05 * Math.sin(world.t * 8 + o.ph);
            const R = (o.homing ? 15 : 16) * pulse;
            ctx.save();
            const g = ctx.createRadialGradient(x, y + bob, 1, x, y + bob, R);
            g.addColorStop(0, 'rgba(180,255,220,' + (0.5 * fade) + ')');
            g.addColorStop(1, 'rgba(120,255,190,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(x, y + bob, R, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = o.homing ? 'rgba(255,255,255,' + fade + ')' : 'rgba(190,255,225,' + fade + ')';
            ctx.beginPath();
            ctx.arc(x, y + bob, 5 * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,' + (0.9 * fade) + ')';
            ctx.beginPath();
            ctx.arc(x - 1.4, y + bob - 1.6, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    function drawFx() {
        for (let i = 0; i < world.fx.length; i++) {
            const f = world.fx[i];
            const x = scrX(f.x), y = scrY(f.y);
            const t = 1 - f.life / f.max;
            if (f.kind === 'boom') {
                const g = ctx.createRadialGradient(x, y, f.r * 0.15 * t, x, y, f.r * (0.4 + 0.6 * t));
                g.addColorStop(0, 'rgba(255,255,255,' + (0.85 * (1 - t)) + ')');
                g.addColorStop(0.45, f.col + 'aa');
                g.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.globalAlpha = 1 - t;
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(x, y, f.r * (0.4 + 0.6 * t), 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            } else if (f.kind === 'spark') {
                ctx.globalAlpha = (1 - t) * 0.9;
                ctx.fillStyle = f.col;
                ctx.beginPath();
                ctx.arc(x, y, f.r * (1 - t * 0.6), 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            } else if (f.kind === 'muzzle') {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(f.ang);
                ctx.globalAlpha = 1 - t;
                ctx.fillStyle = f.col;
                ctx.beginPath();
                ctx.moveTo(0, -7);
                ctx.lineTo(20, 0);
                ctx.lineTo(0, 7);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
                ctx.globalAlpha = 1;
            } else if (f.kind === 'trail') {
                ctx.globalAlpha = (1 - t) * 0.5;
                ctx.fillStyle = f.col;
                ctx.beginPath();
                ctx.arc(x, y, f.r * (1 - t * 0.5), 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }
    }

    // ==================== 地球：碑文与陈列柜 ====================
    function buildEarthLayout() {
        const cx = MAP_W * 0.5, cy = MAP_H * 0.62;
        world.stones = [];
        const targets = PLANETS.filter((p) => !p.home);
        for (let i = 0; i < targets.length; i++) {
            const a = Math.PI * (1.02 + i * (0.96 / (targets.length - 1)));
            const r = 660;
            const x = wrapVal(cx + Math.cos(a) * r, MAP_W);
            const y = wrapVal(cy + Math.sin(a) * r * 0.92, MAP_H);
            world.stones.push({
                id: targets[i].id, x: x, y: y,
                caseX: wrapVal(cx + Math.cos(a) * (r + 118), MAP_W),
                caseY: wrapVal(cy + Math.sin(a) * (r + 118) * 0.92, MAP_H)
            });
        }
    }
    function topWeapon(rec) {
        let best = null, bv = 0;
        for (const k in rec.weapons) {
            if (rec.weapons[k] > bv) { bv = rec.weapons[k]; best = k; }
        }
        return best;
    }
    function topItems(rec) {
        const arr = [];
        for (const k in rec.items) if (rec.items[k] > 0) arr.push([k, rec.items[k]]);
        arr.sort((a, b) => b[1] - a[1]);
        return arr;
    }
    function fmtTime(s) {
        const m = Math.floor(s / 60), ss = Math.floor(s % 60);
        return (m < 10 ? '0' : '') + m + ':' + (ss < 10 ? '0' : '') + ss;
    }

    function drawDirectionMarker(wx, wy, col, label) {
        const x = scrX(wx), y = scrY(wy);
        const margin = 54;
        if (x > margin && x < W - margin && y > margin && y < PLAY_H - margin) return;
        const cx = W / 2, cy = PLAY_H / 2;
        let dx = x - cx, dy = y - cy;
        const len = Math.max(1, Math.hypot(dx, dy));
        dx /= len; dy /= len;
        const tx = dx !== 0 ? (W / 2 - margin) / Math.abs(dx) : Infinity;
        const ty = dy !== 0 ? (PLAY_H / 2 - margin) / Math.abs(dy) : Infinity;
        const tt = Math.min(tx, ty);
        const px = cx + dx * tt, py = cy + dy * tt;
        const dist = Math.round(len / 10);
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(Math.atan2(dy, dx));
        ctx.fillStyle = 'rgba(8,12,22,0.75)';
        ctx.beginPath();
        ctx.arc(0, 0, 17, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.moveTo(11, 0); ctx.lineTo(-7, -8); ctx.lineTo(-7, 8);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        setFont(11, 'bold');
        ctx.fillStyle = col;
        ctx.fillText(label + ' ' + dist + 'm', clamp(px + dx * 26, 50, W - 50), clamp(py + dy * 26, 24, PLAY_H - 14));
        ctx.restore();
    }

    function drawPlay() {
        if (!world) return;
        const p = world.player;
        // 升空拉远 / 着陆推近：整幅场景的镜头缩放
        const lz = world.launch ? launchZoom(world.launch.t)
            : (world.landing ? landingZoom(world.landing.t) : 1);
        viewZoom = lz;
        if (lz < 1) {
            ctx.fillStyle = world.planet.ground;
            ctx.fillRect(0, 0, W, H);
            ctx.save();
            ctx.translate(W / 2, PLAY_H / 2);
            ctx.scale(lz, lz);
            ctx.translate(-W / 2, -PLAY_H / 2);
        }
        drawGround();
        if (world.planet.home) drawEarthHub();
        drawZones();
        drawMarks();
        if (!world.landing && !world.launch) drawRocketAt(scrX(world.rocket.x), scrY(world.rocket.y), world.rocket.angle, world.t, 0, ROCKET_SCALE);
        drawPackages();
        drawOrbs();
        // 拾取 / 射击范围圈（跟随主角的身形中心，画在角色之下）
        if (!world.landing && !world.launch) drawRangeRings(W / 2, PLAYER_CY - BODY_OFF, world.t);
        drawBlades();
        drawBeams();
        for (let i = 0; i < world.enemies.length; i++) drawEnemy(world.enemies[i]);
        drawBoss();
        drawBullets();
        if (!world.launch) drawFx();
        // 主角（着陆时未出舱则不画，避免地面上凭空出现人物）
        const flick = p.invuln > 0 && Math.floor(world.t * 18) % 2 === 0;
        const showHero = !world.launch && (!world.landing || world.landing.t > LAND_EXIT);
        if (showHero && !flick) {
            drawAstronaut(W / 2, PLAYER_CY, p.dirIdx, p.walkPhase, p.moving, {
                t: world.t, roll: p.rollT > 0 ? 1 : 0, rollAngle: p.rollAngle,
                rocket: p.rockets > 0, pkg: world.pkg
            });

        if (showHero && p.rollCd > 0 && p.rollT <= 0) {
            ctx.save();
            ctx.strokeStyle = 'rgba(140,230,255,0.75)';
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.arc(W / 2, PLAYER_CY - BODY_OFF, 34, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - p.rollCd / ROLL_CD));
            ctx.stroke();
            ctx.restore();
        }
        if (world.landing) drawLanding();
        if (world.launch) drawLaunch();
        if (lz < 1) { ctx.restore(); viewZoom = 1; }
        if (world.launch) drawLaunchOverlay();
        if (world.landing) drawLandingOverlay();
        drawVignette();
        if (world.landing) drawLandingFade();
        if (!world.over && !world.landing && !world.launch) {
            ctx.save();
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            setFont(12, 'normal');
            ctx.fillStyle = 'rgba(210,225,250,0.40)';

        }
