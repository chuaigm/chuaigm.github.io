                hp: MAX_HP, maxHp: MAX_HP,
                speedMul: 1, pickupBonus: 0, dodge: 0, fireBonus: 0, fireCdMs: FIRE_CD_MS, bullets: 1, dmg: BASE_DMG,
                rollCdMul: 1, boomLv: 0, relics: {},
                weapon: 'pistol',
                fireCd: 0, fireTimer: 0,
                rollT: 0, rollCd: 0, rollAngle: 0, rollDir: 4, rollVX: 0, rollVY: 0,
                invuln: 0, hitFlash: 0,
                muzz: 0
            },
            rocket: { x: startX, y: startY, angle: 0 },
            enemies: [], enemyBullets: [], bullets: [], orbs: [], packages: [],
            zones: [], blades: [], beams: [], fx: [], popups: [], marks: [],
            pend: [], warns: [],
            rFx: [], relicT: {},
            beacon: null, hidden: null, found: null,
            dig: { cd: 0, dust: 0 }, dust: [],
            pkg: null, pkgQueue: [], pkgSel: 0, pkgTimer: 0,
            xp: 0, level: 1, score: 0, kills: 0,
            tier: 0, upgrades: 0, boss: null, bossDefeated: false, spawnTimer: 1.2,
            slowFactor: 1,
            stats: { weapons: { pistol: 0 }, items: {} },
            supply: null, supplyNear: false,
            inv: { on: false, ai: 0, c: 0, r: 0, msg: '', msgT: 0 },
            recorded: false,
            over: false
        };
    }

    // ==================== 地形绘制 ====================
    // 地面景物（树 / 建筑 / 纪念碑 / 火箭）按世界 y 排序，形成前后遮挡
    // 注意：主角的遮挡基准一律取「脚的位置」（world.player.y），不是人物图形的中心
    let groundProps = [];
    function playerFeetY() { return world.player.y; }
    function drawGroundProps(front) {
        if (!front) groundProps.sort((a, b) => a.wy - b.wy);
        const py = playerFeetY();
        for (let i = 0; i < groundProps.length; i++) {
            const o = groundProps[i];
            if ((o.wy >= py) !== front) continue;
            o.draw();
        }
    }
    function drawGround() {
        const p = world.planet;
        const cam = world.cam;
        const vz = viewZoom;
        const cx = W / 2, cy = PLAY_H / 2;
        // 缩放后实际可见的整幅画面（含状态栏区域）在 scrX/scrY 空间中的范围
        const hw = (W / 2) / vz + TILE;          // 左右半宽
        const hUp = cy / vz + TILE;              // 上半高
        const hDn = (H - cy) / vz + TILE;        // 下半高（画布比 PLAY_H 高）
        ctx.fillStyle = p.ground;
        ctx.fillRect(cx - hw, cy - hUp, hw * 2, hUp + hDn);
        groundProps.length = 0;
        const tx0 = Math.floor((cam.x - hw) / TILE) - 1;
        const tx1 = Math.ceil((cam.x + hw) / TILE) + 1;
        const ty0 = Math.floor((cam.y - hUp) / TILE) - 1;
        const ty1 = Math.ceil((cam.y + hDn) / TILE) + 1;
        for (let ty = ty0; ty <= ty1; ty++) {
            for (let tx = tx0; tx <= tx1; tx++) {
                const wx = wrapVal(tx * TILE, MAP_W);
                const wy = wrapVal(ty * TILE, MAP_H);
                const sx = wx - cam.x + W / 2;
                const sy = wy - cam.y + PLAY_H / 2;
                drawDecorTile(p, tx, ty, sx, sy, hash2(tx * 1.7, ty * 2.3), world.t);
            }
        }
    }
    // ---------------- 树木 ----------------
    // 四种树形：阔叶 / 针叶 / 棕榈 / 秋色（花树），带树干纹理、三层树冠与随风摆动
    function drawTreeProp(wx, wy, seed, t) {
        const x = scrX(wx), y = scrY(wy);
        const m = 260;
        if (x < -m || x > W + m || y < -m || y > PLAY_H + m) return;
        const s = 1.2 + hash2(seed * 2.3, seed * 5.1) * 0.45;
        const kind = Math.floor(hash2(seed * 3.7 + 1.1, seed * 1.9) * 4);
        const sway = Math.sin(t * 0.85 + seed * 2.3) * 0.032;
        // 地面投影：外淡内浓两层
        ctx.fillStyle = 'rgba(0,0,0,0.10)';
        ctx.beginPath();
        ctx.ellipse(x + 15 * s, y + 7 * s, 40 * s, 16 * s, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath();
        ctx.ellipse(x + 8 * s, y + 5 * s, 26 * s, 10 * s, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(sway);
        ctx.scale(s, s);
        if (kind === 1) treePine(seed);
        else if (kind === 2) treePalm(seed, t);
        else treeBroad(seed, kind === 3);
        ctx.restore();
    }
    function treeTrunk(w, top, seed) {
        // 树干：上窄下宽 + 树皮纹 + 根部外扩
        ctx.fillStyle = '#6b4a2b';
        ctx.beginPath();
        ctx.moveTo(-w, 0);
        ctx.quadraticCurveTo(-w * 0.72, -top * 0.55, -w * 0.55, -top);
        ctx.lineTo(w * 0.55, -top);
        ctx.quadraticCurveTo(w * 0.72, -top * 0.55, w, 0);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#5a3d22';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(w * 0.3, -top * 0.5, w * 0.55, -top);
        ctx.lineTo(w, 0);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(40,26,14,0.5)';
        ctx.lineWidth = 1.2;
        for (let i = 0; i < 3; i++) {
            const yy = -top * (0.18 + i * 0.26) - hash2(seed + i, seed * 2) * 3;
            ctx.beginPath();
            ctx.moveTo(-w * 0.5 + i, yy);
            ctx.lineTo(-w * 0.15 + i * 1.6, yy - 2.5);
            ctx.stroke();
        }
        ctx.fillStyle = 'rgba(255,255,255,0.14)';      // 左侧受光
        ctx.beginPath();
        ctx.moveTo(-w * 0.85, -2);
        ctx.quadraticCurveTo(-w * 0.6, -top * 0.55, -w * 0.42, -top * 0.92);
        ctx.lineTo(-w * 0.2, -top * 0.9);
        ctx.quadraticCurveTo(-w * 0.38, -top * 0.5, -w * 0.5, -2);
        ctx.closePath();
        ctx.fill();
    }
    function treeBroad(seed, autumn) {
        const top = 44;
        treeTrunk(5.5, top, seed);
        // 枝干
        ctx.strokeStyle = '#6b4a2b';
        ctx.lineWidth = 3.4;
        ctx.lineCap = 'round';
        for (let i = 0; i < 3; i++) {
            const a = -2.5 + i * 0.75 + hash2(seed + i, 3) * 0.3;
            ctx.beginPath();
            ctx.moveTo(0, -top * 0.82);
            ctx.lineTo(Math.cos(a) * 15, -top * 0.82 + Math.sin(a) * 13);
            ctx.stroke();
        }
        const dk = autumn ? '#9a5a22' : '#2c6034';
        const md = autumn ? '#c87a2c' : '#3d7f3f';
        const lt = autumn ? '#e8a94a' : '#57a04c';
        // 底层树冠
        const blobs = 6;
        for (let i = 0; i < blobs; i++) {
            const a = (i / blobs) * Math.PI * 2 + seed;
            const r = 15 + hash2(seed + i * 2.7, i) * 7;
            ctx.fillStyle = dk;
            ctx.beginPath();
            ctx.arc(Math.cos(a) * 17, -top - 8 + Math.sin(a) * 11, r, 0, Math.PI * 2);
            ctx.fill();
        }
        // 中层
        for (let i = 0; i < 5; i++) {
            const a = (i / 5) * Math.PI * 2 + seed * 1.7;
            ctx.fillStyle = md;
            ctx.beginPath();
            ctx.arc(Math.cos(a) * 13, -top - 13 + Math.sin(a) * 9, 12 + hash2(seed + i, 7) * 4, 0, Math.PI * 2);
            ctx.fill();
        }
        // 顶层高光 + 边缘叶簇
        ctx.fillStyle = lt;
        ctx.beginPath();
        ctx.arc(-7, -top - 18, 10, 0, Math.PI * 2);
        ctx.arc(5, -top - 15, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = md;
        for (let i = 0; i < 5; i++) {
            const a = (i / 5) * Math.PI * 2 + 0.6;
            ctx.beginPath();
            ctx.arc(Math.cos(a) * 24, -top - 8 + Math.sin(a) * 16, 5.5, 0, Math.PI * 2);
            ctx.fill();
        }
        if (autumn) {                                   // 花果点缀
            ctx.fillStyle = '#e8556d';
            for (let i = 0; i < 6; i++) {
                const a = hash2(seed + i * 5.3, i * 2.1) * Math.PI * 2;
                const rr = 6 + hash2(i, seed) * 18;
                ctx.beginPath();
                ctx.arc(Math.cos(a) * rr, -top - 10 + Math.sin(a) * rr * 0.6, 2.2, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }
    function treePine(seed) {
        const top = 74;
        treeTrunk(4.6, top, seed);
        const tiers = 4;
        for (let i = 0; i < tiers; i++) {
            const k = i / (tiers - 1);
            const y = -16 - i * 15;
            const w = 27 - i * 5;
            ctx.fillStyle = '#2a5c33';
            ctx.beginPath();
            ctx.moveTo(-w, y);
            ctx.quadraticCurveTo(-w * 0.5, y - 10, 0, y - 22);
            ctx.quadraticCurveTo(w * 0.5, y - 10, w, y);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#3c7a41';
            ctx.beginPath();
            ctx.moveTo(-w * 0.92, y - 1);
            ctx.quadraticCurveTo(-w * 0.5, y - 9, -2, y - 19);
            ctx.lineTo(-6, y - 8);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = 'rgba(20,48,26,0.5)';
            ctx.lineWidth = 1;
            for (let j = 0; j < 3; j++) {
                const yy = y - 4 - j * 5;
                ctx.beginPath();
                ctx.moveTo(-w * (0.72 - j * 0.16), yy);
                ctx.lineTo(w * (0.72 - j * 0.16), yy);
                ctx.stroke();
            }
        }
        ctx.fillStyle = '#4c8f4a';
        ctx.beginPath();
        ctx.moveTo(0, -top - 4);
        ctx.lineTo(3.4, -top + 8);
        ctx.lineTo(-3.4, -top + 8);
        ctx.closePath();
        ctx.fill();
    }
    function treePalm(seed, t) {
        const top = 62;
        const bend = (hash2(seed, 3) - 0.5) * 10;
        // 弯曲树干 + 环节
        ctx.strokeStyle = '#8a6b45';
        ctx.lineWidth = 7;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(bend * 0.6, -top * 0.5, bend, -top);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(60,42,22,0.55)';
        ctx.lineWidth = 1.4;
        for (let i = 1; i < 7; i++) {
            const k = i / 7;
            const px = bend * 0.6 * 2 * k * (1 - k) * 2 + bend * k * k;
            const py = -top * k;
            ctx.beginPath();
            ctx.moveTo(px - 3.4, py); ctx.lineTo(px + 3.4, py);
            ctx.stroke();
        }
        // 叶片
        const n = 7;
        for (let i = 0; i < n; i++) {
            const a = -Math.PI * 0.92 + (i / (n - 1)) * Math.PI * 0.84 + Math.sin(t * 1.1 + seed + i) * 0.04;
            const L = 34 + hash2(seed + i, i * 3) * 10;
            ctx.save();
            ctx.translate(bend, -top);
            ctx.rotate(a);
            ctx.fillStyle = i % 2 ? '#3f8a43' : '#2f6f38';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(L * 0.55, -6.5, L, 2.5);
            ctx.quadraticCurveTo(L * 0.5, 5.5, 0, 0);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = 'rgba(22,54,28,0.5)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(1, 0.5); ctx.lineTo(L - 2, 1.4);
            ctx.stroke();
            ctx.restore();
        }
        ctx.fillStyle = '#8a6b45';
        ctx.beginPath();
        ctx.arc(bend, -top, 3.4, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawDecorTile(p, tx, ty, sx, sy, h, t) {
        const T = TILE;
        switch (p.decor) {
            case 'crater': {
                ctx.fillStyle = 'rgba(255,255,255,0.05)';
                ctx.fillRect(sx, sy, T, T);
                const n = 2;
                for (let i = 0; i < n; i++) {
                    const cx = sx + h * T + (hash2(tx * 3 + i, ty * 7) * (1 - h)) * T;
                    const cy = sy + hash2(tx * 11 + i, ty * 5) * T;
                    const r = 14 + hash2(tx + i * 2, ty - i) * 26;
                    ctx.fillStyle = 'rgba(0,0,0,0.16)';
                    ctx.beginPath();
                    ctx.ellipse(cx + 3, cy + 3, r, r * 0.72, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = shade(p.ground, 0.22);
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, r, r * 0.72, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(0,0,0,0.12)';
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, r * 0.62, r * 0.44, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                break;
            }
            case 'dune': {
                ctx.strokeStyle = 'rgba(255,235,180,0.16)';
                ctx.lineWidth = 3;
                for (let i = 0; i < 3; i++) {
                    const yy = sy + (0.25 + i * 0.28 + hash2(tx + i, ty) * 0.08) * T;
                    ctx.beginPath();
                    ctx.moveTo(sx, yy);
                    for (let k = 0; k <= 8; k++) {
                        ctx.lineTo(sx + k * T / 8, yy + Math.sin(k * 0.9 + tx + i) * 6);
                    }
                    ctx.stroke();
                }
                ctx.fillStyle = 'rgba(120,75,25,0.35)';
                for (let i = 0; i < 2; i++) {
                    const rx = sx + hash2(tx * 5 + i, ty * 9) * T;
                    const ry = sy + hash2(tx * 13 + i, ty * 3) * T;
                    const rr = 7 + hash2(tx * 2 + i, ty * 7) * 9;
                    ctx.beginPath();
                    ctx.ellipse(rx, ry, rr, rr * 0.7, hash2(tx, ty + i), 0, Math.PI * 2);
                    ctx.fill();
                }
                break;
            }
            case 'grass': {
                if (h > 0.62) {
                    const twx = wrapVal(tx * TILE + 28 + hash2(tx * 5, ty * 3) * (T - 56), MAP_W);
                    const twy = wrapVal(ty * TILE + 46 + hash2(tx * 9, ty * 7) * (T - 80), MAP_H);
                    if (!treeBlocked(twx, twy)) {          // 已有绘图的范围不种树
                        const seed = hash2(tx * 2.9, ty * 4.3);
                        groundProps.push({ wy: twy, draw: (function (a, b, c) { return function () { drawTreeProp(a, b, c, t); }; })(twx, twy, seed) });
                    }
                } else if (h < 0.22) {
                    ctx.strokeStyle = 'rgba(150,215,120,0.35)';
                    ctx.lineWidth = 2;
                    for (let i = 0; i < 7; i++) {
                        const gx = sx + hash2(tx * 17 + i, ty * 19) * T;
                        const gy = sy + hash2(tx * 23 + i, ty * 29) * T;
                        ctx.beginPath();
                        ctx.moveTo(gx, gy);
                        ctx.lineTo(gx + 4, gy - 9);
                        ctx.stroke();
                    }
                } else {
                    ctx.fillStyle = 'rgba(0,0,0,0.12)';
                    ctx.beginPath();
                    ctx.ellipse(sx + h * T, sy + (1 - h) * T, 12, 8, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                break;
            }
            case 'rock': {
                ctx.fillStyle = 'rgba(0,0,0,0.10)';
                ctx.fillRect(sx, sy, T, T);
                for (let i = 0; i < 3; i++) {
                    const rx = sx + hash2(tx * 3 + i * 5, ty * 7) * T;
                    const ry = sy + hash2(tx * 11 + i * 3, ty * 5) * T;
                    const rr = 9 + hash2(tx + i, ty * 2 + i) * 17;
                    ctx.fillStyle = 'rgba(0,0,0,0.2)';
                    ctx.beginPath();
                    ctx.ellipse(rx + 4, ry + 4, rr, rr * 0.6, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = h > 0.5 ? shade(p.ground, 0.18) : shade(p.ground2, -0.08);
                    ctx.beginPath();
                    ctx.moveTo(rx - rr, ry + rr * 0.5);
                    ctx.lineTo(rx - rr * 0.3, ry - rr * 0.7);
                    ctx.lineTo(rx + rr * 0.5, ry - rr * 0.5);
                    ctx.lineTo(rx + rr, ry + rr * 0.45);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.10)';
                    ctx.beginPath();
                    ctx.moveTo(rx - rr * 0.3, ry - rr * 0.7);
                    ctx.lineTo(rx + rr * 0.5, ry - rr * 0.5);
                    ctx.lineTo(rx + rr * 0.1, ry - rr * 0.1);
                    ctx.closePath();
                    ctx.fill();
                }
                break;
            }
            case 'bands': {
                const bands = 5;
                for (let i = 0; i < bands; i++) {
                    const yy = sy + (i / bands) * T;
                    ctx.fillStyle = i % 2 ? 'rgba(255,255,255,0.045)' : 'rgba(0,0,0,0.05)';
                    const wob = Math.sin(t * 0.5 + i + tx * 0.6) * 5;
                    ctx.beginPath();
                    ctx.moveTo(sx, yy);
                    for (let k = 0; k <= 8; k++) ctx.lineTo(sx + k * T / 8, yy + Math.sin(k * 0.8 + tx * 0.5 + t * 0.4) * 4 + wob);
                    ctx.lineTo(sx + T, yy + T / bands);
                    for (let k = 8; k >= 0; k--) ctx.lineTo(sx + k * T / 8, yy + T / bands + Math.sin(k * 0.8 + tx * 0.5 + t * 0.4) * 4 + wob);
                    ctx.closePath();
                    ctx.fill();
                }
                if (h > 0.78) {
                    ctx.fillStyle = 'rgba(255,255,255,0.09)';
                    ctx.beginPath();
                    ctx.ellipse(sx + T * 0.5, sy + T * 0.5, 30, 18, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(0,0,0,0.08)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.ellipse(sx + T * 0.5, sy + T * 0.5, 30, 18, 0, 0, Math.PI * 2);
                    ctx.stroke();
                }
                break;
            }
            case 'crystal': {
                ctx.fillStyle = 'rgba(255,255,255,0.07)';
                ctx.fillRect(sx, sy, T, T);
                for (let i = 0; i < 3; i++) {
                    const cx = sx + hash2(tx * 7 + i * 3, ty * 11) * T;
                    const cy = sy + hash2(tx * 13 + i, ty * 17) * T;
                    const s = 10 + hash2(tx * 5 + i, ty * 3) * 20;
                    const rot = hash2(tx + i, ty - i) * Math.PI;
                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.rotate(rot);
                    ctx.fillStyle = 'rgba(0,0,0,0.15)';
                    ctx.beginPath();
                    ctx.moveTo(-s * 0.6, s * 0.4); ctx.lineTo(s * 0.6, s * 0.4); ctx.lineTo(s * 0.8, s * 0.6); ctx.lineTo(-s * 0.8, s * 0.6);
                    ctx.closePath(); ctx.fill();
                    const g = ctx.createLinearGradient(0, -s, 0, s * 0.5);
                    g.addColorStop(0, 'rgba(255,255,255,0.75)');
                    g.addColorStop(1, 'rgba(140,225,235,0.45)');
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.moveTo(0, -s);
                    ctx.lineTo(s * 0.6, 0);
                    ctx.lineTo(0, s * 0.42);
                    ctx.lineTo(-s * 0.6, 0);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                }
                break;
            }
            case 'geyser': {
                ctx.fillStyle = 'rgba(0,0,0,0.12)';
                ctx.fillRect(sx, sy, T, T);
                for (let i = 0; i < 2; i++) {
                    const cx = sx + hash2(tx * 9 + i * 7, ty * 5) * T;
                    const cy = sy + hash2(tx * 3 + i, ty * 19) * T;
                    const rr = 13 + hash2(tx + i, ty + i) * 14;
                    const pulse = 0.5 + 0.5 * Math.sin(t * 1.6 + tx + i);
                    ctx.fillStyle = 'rgba(10,25,70,0.45)';
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, rr, rr * 0.6, 0, 0, Math.PI * 2);
                    ctx.fill();
                    const g = ctx.createRadialGradient(cx, cy, 2, cx, cy, rr * 1.6);
                    g.addColorStop(0, 'rgba(150,215,255,' + (0.20 + 0.25 * pulse) + ')');
                    g.addColorStop(1, 'rgba(150,215,255,0)');
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, rr * 1.6, rr, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                break;
            }
            case 'heart': {
                ctx.fillStyle = 'rgba(255,255,255,0.05)';
                ctx.fillRect(sx, sy, T, T);
                if (h > 0.45) {
                    const cx = sx + T * 0.5, cy = sy + T * 0.5, s = 34 + h * 16;
                    ctx.fillStyle = 'rgba(255,246,235,0.55)';
                    ctx.beginPath();
                    ctx.moveTo(cx, cy + s * 0.5);
                    ctx.bezierCurveTo(cx - s * 0.6, cy - s * 0.2, cx - s * 0.2, cy - s * 0.55, cx, cy - s * 0.2);
                    ctx.bezierCurveTo(cx + s * 0.2, cy - s * 0.55, cx + s * 0.6, cy - s * 0.2, cx, cy + s * 0.5);
                    ctx.fill();
                }
                ctx.fillStyle = 'rgba(0,0,0,0.14)';
                for (let i = 0; i < 2; i++) {
                    const rx = sx + hash2(tx * 5 + i * 3, ty * 9) * T;
                    const ry = sy + hash2(tx * 15 + i, ty * 3) * T;
                    ctx.beginPath();
                    ctx.ellipse(rx, ry, 10 + hash2(tx + i, ty) * 12, 7, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                break;
            }
        }
    }

    // ==================== 主角绘制（八方向） ====================
    const TAU = Math.PI * 2;

    // 腿部运动学参数：每个朝向给出「迈步」在屏幕上的投影
    //  hipX  两腿静止时的水平间距      ax/ay  迈步方向的屏幕分量（ay>0 ＝朝画面下方＝更靠近镜头）
    //  lift  摆动腿的抬起高度            depth  迈步时的透视缩放
    //  far   该视角下处于远端的腿（-1 表示正/背面，无需区分远近）
    //  tilt  鞋子的最大翘起角度（侧身迈步幅度大，鞋子压得更平）
    //  up    鞋头固定角度（负＝鞋头上扬，正＝鞋头下压；背向迈步上扬、朝镜头迈步下压）
    // 左下 / 左上 整幅镜像自右下 / 右上，因此直接复用其参数
    const LEG_VIEW = [
        { hipX: 6.2, ax: 0.62, ay: 0.72, lift: 6, depth: 0.28, far: -1, tilt: 0.14, up: 0.16 },   // 0 下
        { hipX: 5.4, ax: 0.78, ay: 0.62, lift: 6.4, depth: 0.26, far: -1, tilt: 0.14, up: 0.16 }, // 1 左下＝镜像 7
        { hipX: 2.8, ax: 1.00, ay: 0.18, lift: 7, depth: 0.38, far: 1, tilt: 0.05, up: 0 },        // 2 左
        { hipX: 4.9, ax: 0.72, ay: -0.68, lift: 5.6, depth: -0.24, far: -1, tilt: 0.14, up: -0.26 }, // 3 左上＝镜像 5
        { hipX: 5.8, ax: 0.6, ay: -0.8, lift: 5.2, depth: -0.26, far: -1, tilt: 0.14, up: -0.27 },  // 4 上
        { hipX: 4.9, ax: 0.72, ay: -0.68, lift: 5.6, depth: -0.24, far: -1, tilt: 0.14, up: -0.26 }, // 5 右上
        { hipX: 2.8, ax: 1.00, ay: 0.18, lift: 7, depth: 0.38, far: 1, tilt: 0.05, up: 0 },        // 6 右
        { hipX: 5.4, ax: 0.78, ay: 0.62, lift: 6.4, depth: 0.26, far: -1, tilt: 0.14, up: 0.16 }  // 7 右下
    ];

    // 单腿步态：f 为迈步量（-1 在身后 / +1 在身前），up 为抬腿高度
    // 前 62% 是支撑期（脚贴地由身前滑到身后），后 38% 是摆动期（收腿抬脚再迈出）
    function legCycle(ph) {
        const STANCE = 0.62;
        if (ph < STANCE) {
            const k = ph / STANCE;
            return { f: 1 - 2 * k, up: 0 };
        }
        const k = (ph - STANCE) / (1 - STANCE);
        return { f: -1 + 2 * k, up: Math.sin(k * Math.PI) };
    }

    // 解算一条腿的髋 / 膝 / 脚，并按「越靠近镜头越大」做透视缩放
    function solveLeg(cfg, cyc, hipX, hipY, stride) {
        const len = Math.hypot(cfg.ax, cfg.ay) || 1;
        const nx = cfg.ax / len, ny = cfg.ay / len;
        const footX = hipX + cyc.f * stride * cfg.ax;
        const footY = -cyc.up * cfg.lift + cyc.f * stride * cfg.ay;
        const bend = 1.0 + 5.4 * cyc.up;      // 摆动期膝盖明显前屈，支撑期几乎伸直
        return {
            hipX: hipX, hipY: hipY,
            kneeX: (hipX + footX) * 0.5 + bend * nx,
            kneeY: (hipY + footY) * 0.5 - (0.6 + 2.8 * cyc.up),
            footX: footX, footY: footY,
            sc: 1 + cyc.f * cfg.depth * 0.35,
            near: cyc.f * cfg.ay                  // 越大＝脚越靠画面下方＝越靠近镜头
        };
    }

    // 眨眼：约每 3.7 秒眨一次，其中一轮会连眨两下
    function blinkAmt(t) {
        const p = t % 3.7;
        if (p < 0.15) return Math.sin(p / 0.15 * Math.PI);
        if (p > 0.44 && p < 0.59) return Math.sin((p - 0.44) / 0.15 * Math.PI);
        return 0;
    }

    // 眼睛：正面双眼与侧面单眼共用同一套表现，眨眼时上下压扁成缝
    // eyes 每项为 [x, y, 横向半径, 纵向缩放]
    function drawEyes(t, eyes) {
        const eh = Math.max(0.2, 1.7 * (1 - blinkAmt(t)));
        ctx.fillStyle = '#ffffff';
        for (let i = 0; i < eyes.length; i++) {
            const e = eyes[i];
            ctx.beginPath();
            ctx.ellipse(e[0], e[1], e[2], Math.max(0.2, eh * e[3]), 0, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function drawAstronaut(px, py, dirIdx, phase, moving, opts) {
        opts = opts || {};
        const view = DIR_VIEW[dirIdx];
        const roll = opts.roll || 0;
        let flip = view.sx < 0 ? -1 : 1;
        // 直上直下的两个朝向（tilt = 0）本身分不出左右，改用最近一次朝左 / 朝右的姿态，
        // 这样从侧面转向正上正下时图形不会突然左右翻面
        if (view.tilt === 0 && opts.faceSide) flip = opts.faceSide;
        const t = opts.t || 0;
        const bob = moving ? Math.abs(Math.sin(phase)) * 2.2 : Math.sin(t * 2.2) * 0.8;

        ctx.save();
        ctx.translate(px, py);

        // 翻滚：整体蜷成球状，球心与身形中心（BODY_OFF）重合，不再旋转站姿图形
        if (roll > 0) {
            drawRollBall(0, -BODY_OFF, dirIdx, opts);
            ctx.restore();
            if (opts.pkg) drawPkgRing(px, py, t);
            return;
        }

        // 影子
        ctx.save();
        ctx.globalAlpha = 0.28;
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.ellipse(3, 2, 15, 5.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        const bodyY = -bob;

        ctx.save();
        ctx.scale(flip, 1);
        ctx.rotate(view.tilt * 0.5);

        // 腿：两条腿相差半个周期，远端那条先画并压暗
        const cfg = LEG_VIEW[dirIdx];
        const hipY = bodyY - 26;
        const stride = moving ? 9.6 : 2.2;
        const legs = [];
        for (let i = 0; i < 2; i++) {
            const ph = moving ? ((phase / TAU + i * 0.5) % 1) : (0.06 + i * 0.5);
            legs.push(solveLeg(cfg, legCycle(ph), i === 0 ? -cfg.hipX : cfg.hipX, hipY, stride));
        }
        // 图层关系：靠镜头的那条腿压在上面
        // 侧身视角两条腿重叠，由 far 指定前后；其余视角按脚的高低（越靠下越近）决定
        let order;
        if (cfg.far >= 0) {
            order = [cfg.far, 1 - cfg.far];
        } else {
            order = legs[1].near < legs[0].near ? [1, 0] : [0, 1];
        }
        for (let oi = 0; oi < order.length; oi++) {
            const far = cfg.far >= 0 && order[oi] === cfg.far;
            drawLeg(legs[order[oi]], far, cfg.tilt, cfg.up);
        }

        // 背包（背面视角，画在躯干之下）
        const bT = bodyY - 46, bH = 26;          // 躯干外框
        if (view.face === 'back') {
            ctx.fillStyle = '#8e9cb2';
            roundRectPath(-15.5, bT - 1, 31, 27, 10);
            ctx.fill();
            ctx.fillStyle = '#a9b5c7';
            roundRectPath(-13, bT - 5, 9.5, 23, 4.5);
            ctx.fill();
            roundRectPath(3.5, bT - 5, 9.5, 23, 4.5);
            ctx.fill();
            ctx.fillStyle = 'rgba(58,74,99,0.35)';
            roundRectPath(-13, bT + 5, 9.5, 3.5, 1.6);
            ctx.fill();
            roundRectPath(3.5, bT + 5, 9.5, 3.5, 1.6);
            ctx.fill();
            // 背部散热格栅
            ctx.fillStyle = '#77859b';
            for (let i = 0; i < 3; i++) {
                roundRectPath(-8, bT + 11 + i * 3.4, 16, 2, 1);
                ctx.fill();
            }
            // 推进喷口微光
            const pz = 0.5 + 0.5 * Math.sin(t * 7);
            ctx.fillStyle = 'rgba(120,220,255,' + (0.35 + 0.4 * pz) + ')';
            ctx.beginPath();
            ctx.arc(-8.5, bT + 24, 2.4, 0, TAU);
            ctx.arc(8.5, bT + 24, 2.4, 0, TAU);
            ctx.fill();
            // 天线
            ctx.strokeStyle = '#9aa6ba';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(0, bT - 4);
            ctx.lineTo(2.5, bT - 15);
            ctx.stroke();
            ctx.fillStyle = '#ff6b6b';
            ctx.beginPath();
            ctx.arc(2.5, bT - 16, 2.1, 0, TAU);
            ctx.fill();
        }

        // 躯干 + 肩甲（侧身视角横向压窄，符合透视）
        ctx.save();
        if (view.face === 'side') ctx.scale(0.78, 1);
        ctx.fillStyle = '#f6f9ff';
        ctx.strokeStyle = 'rgba(126,144,172,0.55)';
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.ellipse(-11.8, bT + 4.5, 4.2, 5.4, -0.35, 0, TAU);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(11.8, bT + 4.5, 4.2, 5.4, 0.35, 0, TAU);
        ctx.fill();
        ctx.stroke();
        const bGrad = ctx.createLinearGradient(-13.5, bT, 13.5, bT + bH);
        bGrad.addColorStop(0, '#ffffff');
        bGrad.addColorStop(0.45, '#eef3fa');
        bGrad.addColorStop(1, '#b3bfd2');
        ctx.fillStyle = bGrad;
        roundRectPath(-13.5, bT, 27, bH, 11);
        ctx.fill();
        // 颈环：头盔与躯干之间加一圈压边，让衔接自然（画在肩甲之下）
        ctx.fillStyle = '#b7c2d4';
        ctx.beginPath();
        ctx.ellipse(0, bT + 1.4, 14.6, 5.6, 0, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#94a1b6';
        ctx.beginPath();
        ctx.ellipse(0, bT + 0.2, 11, 3.6, 0, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#7f8da3';
        ctx.beginPath();
        ctx.ellipse(0, bT - 0.6, 8.2, 2.4, 0, 0, TAU);
        ctx.fill();
        // 腰部束带
        ctx.fillStyle = '#aeb9cb';
        roundRectPath(-12.5, bT + bH - 8, 25, 6.5, 3.2);
        ctx.fill();
        ctx.fillStyle = '#e0563f';
        roundRectPath(-11, bT + bH - 7.2, 22, 2.4, 1.2);
        ctx.fill();
        // 腰带扣
        ctx.fillStyle = '#8794a8';
        roundRectPath(-2.6, bT + bH - 8.6, 5.2, 7.6, 1.8);
        ctx.fill();
        // 肩部接缝
        ctx.strokeStyle = 'rgba(120,138,166,0.5)';
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.moveTo(-8.5, bT + 1.5); ctx.quadraticCurveTo(-12.5, bT + 5, -12, bT + 10);
        ctx.moveTo(8.5, bT + 1.5); ctx.quadraticCurveTo(12.5, bT + 5, 12, bT + 10);
        ctx.stroke();
        if (view.face === 'front') {
            // 胸口控制面板
            ctx.fillStyle = '#5b8def';
            roundRectPath(-7, bT + 5, 14, 10, 3.2);
            ctx.fill();
            ctx.fillStyle = '#27364c';
            roundRectPath(-5.4, bT + 6.4, 10.8, 7, 2.2);
            ctx.fill();
            ctx.fillStyle = 'rgba(120,225,255,' + (0.45 + 0.45 * Math.sin(t * 4.5)) + ')';
            roundRectPath(-3.8, bT + 8, 7.6, 3.2, 1.6);
            ctx.fill();
            // 胸前警示条
            ctx.fillStyle = '#e0563f';
            roundRectPath(-11.5, bT + 17.5, 23, 2.3, 1.15);
            ctx.fill();
        } else if (view.face === 'side') {
            ctx.fillStyle = '#5b8def';
            roundRectPath(1, bT + 6, 9, 9, 3);
            ctx.fill();
            ctx.fillStyle = '#27364c';
            roundRectPath(2.2, bT + 7.4, 6.6, 6.2, 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(120,225,255,' + (0.45 + 0.45 * Math.sin(t * 4.5)) + ')';
            roundRectPath(3.4, bT + 8.8, 4.8, 3, 1.5);
            ctx.fill();
            ctx.fillStyle = '#e0563f';
            roundRectPath(-9, bT + 17.5, 16, 2.3, 1.15);
            ctx.fill();
        } else {
            ctx.fillStyle = 'rgba(120,138,166,0.35)';
            roundRectPath(-9, bT + 7, 18, 7, 3);
            ctx.fill();
            ctx.fillStyle = '#5b8def';
            roundRectPath(-9, bT + 7, 6, 7, 2.4);
            ctx.fill();
            roundRectPath(3, bT + 7, 6, 7, 2.4);
            ctx.fill();
        }
        ctx.restore();

        // 手臂与持枪：三种视角各取所需 —— 正面只画右臂持枪和枪后露出的左大臂，
        // 背面只画两条大臂和胸前探出的枪头，侧身只画右臂与侧视的枪
        const tipC = '#7fe8ff';
        const sw = moving ? Math.sin(phase) : 0;
        if (view.face === 'front') {
            // 左臂：大臂加一小截前臂，后半段被枪身挡住，只露出大臂
            limb([[11.8, bT + 4.5], [14.6, bT + 11.4], [11.4, bT + 12.6]], 7.4, ARM_TONE);
            // 能量步枪斜跨胸前，枪口朝前下方，越过左臂肘部
            drawRifle(-2 + sw * 1.1, bT + 2 - Math.abs(sw) * 1.2, 0.56 + sw * 0.05, 22, tipC);
            // 右臂：弯曲到胸前握住枪身
            limb([[-11.8, bT + 4.5], [-12.8, bT + 12.4], [-2.2, bT + 6.4]], 7.8, ARM_TONE);
            ctx.fillStyle = ARM_GLOVE;
            ctx.beginPath();
            ctx.arc(-2.5, bT + 5.4, 3.6, 0, TAU);
            ctx.fill();
        } else if (view.face === 'back') {
            // 背面只见两条大臂，压在躯干里的部分不留边界线；其余部分被身体挡住
            const bw = sw * 2.1;
            limbBlended([[-11.8, bT + 4.5 + sw * 1.3], [-14.4, bT + 12 + bw]], 7.4, ARM_TONE_BACK, bT, bH);
            limbBlended([[11.8, bT + 4.5 - sw * 1.3], [14.4, bT + 12 - bw]], 7.4, ARM_TONE_BACK, bT, bH);
            // 枪在身前，从右肩后方探出一截枪头
            drawGunTip(8.5, bT - 3, -0.5, tipC);
        } else {
            // 侧身：近镜头一侧的右臂，与正对前方的枪（整体跟随躯干压窄）
            ctx.save();
            ctx.scale(0.82, 1);
            limb([[10.4, bT + 5.5], [14.2, bT + 15.5 + sw * 2.2], [18.2, bT + 9.5]], 7.6, ARM_TONE);
            drawRifle(18.2, bT + 9 - Math.abs(sw) * 1.3, -0.03 + sw * 0.05, 18, tipC);
            ctx.fillStyle = ARM_GLOVE;
            ctx.beginPath();
            ctx.arc(17.6, bT + 9.4, 3.5, 0, TAU);
            ctx.fill();
            ctx.restore();
        }

        // 头盔（整体略上移，收短头与身体之间的颈部）
        ctx.save();
        ctx.translate(0, bodyY - 56);
        ctx.fillStyle = '#eef3fa';
        ctx.beginPath();
        ctx.arc(0, 0, 13, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#c3ccdb';
        ctx.beginPath();
        ctx.arc(0, 3, 12, 0, Math.PI * 2);
        ctx.fill();
if (view.face === 'front') {
            ctx.fillStyle = '#2c3a52';
            ctx.beginPath();
            ctx.ellipse(1.5, -1.5, 8.5, 7, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(120,220,255,0.45)';
            ctx.beginPath();
            ctx.ellipse(4, -4, 3.4, 2.4, -0.5, 0, 0, Math.PI * 2);
            ctx.fill();
            drawEyes(t, [[-1.5, -1, 1.7, 1], [4.5, -1, 1.7, 1]]);
        } else if (view.face === 'side') {
            ctx.fillStyle = '#2c3a52';
            ctx.beginPath();
            ctx.ellipse(7, -1, 4.4, 7.4, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(120,220,255,0.5)';
            ctx.beginPath();
            ctx.ellipse(8, -4, 2, 3, 0, 0, Math.PI * 2);
            ctx.fill();
            // 侧脸只露出一只眼睛，眨眼表现与正面一致
            drawEyes(t, [[7.6, -0.6, 1.5, 0.88]]);
            ctx.fillStyle = '#ffd166';
            ctx.beginPath();
            ctx.arc(-7, -8, 2.4, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.fillStyle = '#b8c2d2';
            ctx.beginPath();
            ctx.ellipse(0, 1, 10, 9, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#9aa6ba';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, 7, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = '#ff6b6b';
            ctx.beginPath();
            ctx.arc(0, -10, 2, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
        ctx.restore();
        ctx.restore();

        // 道具环（在世界坐标下绘制）
        if (opts.pkg) drawPkgRing(px, py, t);
    }

    // ---------- 手臂与能量步枪 ----------
    const ARM_TONE = '#e0e7f3';       // 近镜头一侧的手臂
    const ARM_TONE_BACK = '#cfd8e6';  // 背面视角的手臂，压暗一档
    const ARM_GLOVE = '#aeb9cb';
    const ARM_EDGE = 'rgba(104,124,156,0.55)';
    // 一段折线肢体：先描边再填色，与腿部同一套画法；noEdge 时只填色不描边
    function limb(pts, w, tone, noEdge) {
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
        if (!noEdge) {
            ctx.strokeStyle = ARM_EDGE;
            ctx.lineWidth = w + 1.8;
            ctx.stroke();
        }
        ctx.strokeStyle = tone;
        ctx.lineWidth = w;
        ctx.stroke();
    }
    // 躯干 + 肩甲的外轮廓，作为手臂与身体衔接处的分界（调用前需先 beginPath）
    function bodySilhouettePath(bT, bH) {
        ctx.moveTo(-2.5, bT);
        ctx.arcTo(13.5, bT, 13.5, bT + bH, 11);
        ctx.arcTo(13.5, bT + bH, -13.5, bT + bH, 11);
        ctx.arcTo(-13.5, bT + bH, -13.5, bT, 11);
        ctx.arcTo(-13.5, bT, 13.5, bT, 11);
        ctx.closePath();
        ctx.moveTo(-16.2, bT + 4.5);
        ctx.ellipse(-11.8, bT + 4.5, 4.2, 5.4, -0.35, 0, TAU);
        ctx.moveTo(16.2, bT + 4.5);
        ctx.ellipse(11.8, bT + 4.5, 4.2, 5.4, 0.35, 0, TAU);
    }
    // 与躯干相接的手臂：压在身体里的那一段不画边界线，只保留躯干外的轮廓。
    // 同一条肢体画两遍——一遍只填色并裁在轮廓内，一遍描边并裁在轮廓外，
    // 这样边界线不会再横穿肩部，肩臂看起来与身体连成一体
    function limbBlended(pts, w, tone, bT, bH) {
        ctx.save();
        ctx.beginPath();
        bodySilhouettePath(bT, bH);
        ctx.clip();
        limb(pts, w, tone, true);
        ctx.restore();
        ctx.save();
        ctx.beginPath();
        ctx.rect(-90, bT - 90, 180, bH + 180);
        bodySilhouettePath(bT, bH);
        ctx.clip('evenodd');
        limb(pts, w, tone, false);
        ctx.restore();
    }
    // 能量步枪：整支枪，(gx,gy) 为握把位置，ang 为枪口朝向，len 为枪身长度
    function drawRifle(gx, gy, ang, len, tip) {
        ctx.save();
        ctx.translate(gx, gy);
        ctx.rotate(ang);
        ctx.fillStyle = '#4a5a78';
        roundRectPath(-4, -3.8, len * 0.88, 7.6, 3);
        ctx.fill();
        ctx.fillStyle = '#6f7f9c';
        roundRectPath(-2, -3, len * 0.46, 2.6, 1.3);
        ctx.fill();
        // 弹匣与扳机护圈
        ctx.fillStyle = '#2c3a52';
        roundRectPath(1.5, 2, 6, 5.6, 1.8);
        ctx.fill();
        // 枪管与散热片
        ctx.fillStyle = '#5b6b86';
        roundRectPath(len * 0.82, -2.4, len * 0.34, 4.8, 1.9);
        ctx.fill();
        ctx.fillStyle = '#8494b0';
        for (let i = 0; i < 3; i++) {
            roundRectPath(len * 0.86 + i * 2.5, -3.2, 1.3, 6.4, 0.65);
            ctx.fill();
        }
        // 能量枪口
        ctx.fillStyle = tip;
        ctx.beginPath();
        ctx.arc(len * 1.16, 0, 2.4, 0, TAU);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.beginPath();
        ctx.arc(len * 1.16, 0, 1, 0, TAU);
        ctx.fill();
        ctx.restore();
    }
    // 背面视角：只露出的那一小截枪头，沿 +x 方向伸出
    function drawGunTip(gx, gy, ang, tip) {
        ctx.save();
        ctx.translate(gx, gy);
        ctx.rotate(ang);
        ctx.fillStyle = '#4a5a78';
        roundRectPath(-2, -3.2, 14.5, 6.4, 2.4);
        ctx.fill();
        ctx.fillStyle = '#8494b0';
        roundRectPath(5.5, -4.2, 2.6, 8.4, 1.2);
        ctx.fill();
        ctx.fillStyle = tip;
        ctx.beginPath();
        ctx.arc(13.8, 0, 2.6, 0, TAU);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.beginPath();
        ctx.arc(13.8, 0, 1.1, 0, TAU);
        ctx.fill();
        ctx.restore();
    }

    // 一条腿：大腿 / 小腿两段 + 膝盖关节 + 靴子
    function drawLeg(L, far, tiltMax, tiltUp) {
        const tone = far ? '#c2cddd' : '#e9eef6';
        ctx.save();
        ctx.translate(L.hipX, L.hipY);
        ctx.scale(L.sc, L.sc);
        ctx.translate(-L.hipX, -L.hipY);
        if (far) ctx.translate(0, -1.6);
        ctx.lineCap = 'round';
        // 大腿（较粗）
        ctx.beginPath();
        ctx.moveTo(L.hipX, L.hipY);
        ctx.lineTo(L.kneeX, L.kneeY);
        ctx.strokeStyle = 'rgba(112,132,162,0.4)';    // 描边，让腿部在白色背景上更清晰
        ctx.lineWidth = 10.2;
        ctx.stroke();
        ctx.strokeStyle = tone;
        ctx.lineWidth = 8.8;
        ctx.stroke();
        // 小腿（较细）
        ctx.beginPath();
        ctx.moveTo(L.kneeX, L.kneeY);
        ctx.lineTo(L.footX, L.footY - 3);
        ctx.strokeStyle = 'rgba(112,132,162,0.4)';
        ctx.lineWidth = 9;
        ctx.stroke();
        ctx.strokeStyle = tone;
        ctx.lineWidth = 7.4;
        ctx.stroke();
        // 膝盖
        ctx.fillStyle = tone;
        ctx.beginPath();
        ctx.arc(L.kneeX, L.kneeY, 4.1, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = 'rgba(112,132,162,0.35)';
        ctx.lineWidth = 1;
        ctx.stroke();
        // 膝盖内侧暗部
        ctx.fillStyle = 'rgba(86,104,132,0.28)';
        ctx.beginPath();
        ctx.arc(L.kneeX, L.kneeY + 2, 3.4, 0, TAU);
        ctx.fill();
        // 靴子：大头皮鞋造型 —— 厚薄适中的中底 + 前伸的大鞋头 + 低帮鞋面
        ctx.save();
        ctx.translate(L.footX, L.footY - 0.4);
        ctx.rotate(clamp(Math.atan2(L.footY - 3 - L.kneeY, L.footX - L.kneeX) * 0.16, -tiltMax, tiltMax) + (tiltUp || 0));
        const soleC = far ? '#8e9aad' : '#9da9bb';
        const shoeHi = far ? '#d2dae6' : '#ffffff';
        const shoeLo = far ? '#a9b4c5' : '#bfc9d8';
        const edgeC = 'rgba(100,116,144,0.5)';
        // 中底：偏薄，前端上翘让鞋头更明显
        ctx.fillStyle = soleC;
        ctx.beginPath();
        ctx.moveTo(-6.6, -0.2);
        ctx.quadraticCurveTo(-7.2, 2.4, -4.8, 2.6);
        ctx.lineTo(6.8, 2.6);
        ctx.quadraticCurveTo(10, 2.4, 10.4, 0);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(70,84,106,0.22)';               // 底沿暗部
        ctx.beginPath();
        ctx.moveTo(-5.4, 1.5); ctx.lineTo(7, 1.5);
        ctx.quadraticCurveTo(9.6, 1.4, 9.9, 0.2);
        ctx.lineTo(-6.8, 0.2);
        ctx.closePath();
        ctx.fill();
        // 鞋面：低帮，鞋头明显前伸
        const shoeG = ctx.createLinearGradient(0, -5.8, 0, 0.6);
        shoeG.addColorStop(0, shoeHi);
        shoeG.addColorStop(1, shoeLo);
        ctx.fillStyle = shoeG;
        ctx.beginPath();
        ctx.moveTo(-3.4, -5.6);
        ctx.bezierCurveTo(-5.8, -5.3, -6.4, -3.2, -6.1, -0.4);
        ctx.lineTo(-4.2, 0.4);
        ctx.lineTo(6.2, 0.4);
        ctx.quadraticCurveTo(9.6, 0.2, 9.8, -2.6);
        ctx.bezierCurveTo(9.9, -4.4, 7.4, -5.4, 3.2, -5.6);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = edgeC;
        ctx.lineWidth = 0.9;
        ctx.stroke();
        // 包头缝
        ctx.strokeStyle = 'rgba(110,128,158,0.45)';
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(4.4, -5.3);
        ctx.quadraticCurveTo(5.6, -3.2, 5.2, 0.3);
        ctx.stroke();
        // 鞋眼鞋带
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-2.6, -4.6); ctx.lineTo(1.8, -3.8);
        ctx.moveTo(-2.2, -2.9); ctx.lineTo(2.2, -2.1);
        ctx.stroke();
        // 鞋头高光
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.beginPath();
        ctx.ellipse(6.6, -3.6, 2.4, 1.6, -0.3, 0, TAU);
        ctx.fill();
        // 鞋口
        ctx.fillStyle = far ? '#9aa6b8' : '#b3bdcd';
        ctx.beginPath();
        ctx.ellipse(-0.2, -5.5, 3.4, 1.4, 0, 0, TAU);
        ctx.fill();
        ctx.restore();
        ctx.restore();
    }

    // 翻滚姿态：四肢蜷成一团近似球体，球心与身形中心（BODY_OFF）重合；
    // 用「蜷起的四肢沿球面绕行 + 残影 + 速度线」表现翻滚，而不是旋转站姿图形
    function drawRollBall(cx, cy, dirIdx, opts) {
        const t = opts.t || 0;
        const view = DIR_VIEW[dirIdx];
        const flip = view.sx < 0 ? -1 : 1;
        const d = DIRS[dirIdx];
        const fx = d.ix * flip, fy = d.iy;       // 翻滚方向在屏幕上的单位向量
        const R = 19;
        const prog = opts.rollProg === undefined ? 0.5 : clamp(opts.rollProg, 0, 1);
        const vis = clamp(prog / 0.18, 0, 1) * clamp((1 - prog) / 0.14, 0, 1);
        const spin = (opts.rollAngle || 0) * 1.15;

        // 地面投影（球体腾空，影子略小）
        ctx.save();
        ctx.globalAlpha = 0.24 * vis;
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.ellipse(2, 3, 12, 4.6, 0, 0, TAU);
        ctx.fill();
        ctx.restore();

        // 残影：沿翻滚反方向依次淡出
        for (let i = 5; i >= 1; i--) {
            const a = vis * 0.26 * (1 - (i - 1) / 6);
            if (a < 0.005) continue;
            ctx.save();
            ctx.globalAlpha = a;
            ctx.translate(cx - fx * i * 6.2, cy - fy * i * 6.2);
            ctx.rotate(Math.atan2(fy, fx));
            ctx.scale(1.12, 0.84);
            ctx.fillStyle = '#7cc9f2';
            ctx.beginPath();
            ctx.arc(0, 0, R * (1 - i * 0.03), 0, TAU);
            ctx.fill();
            ctx.strokeStyle = 'rgba(214,246,255,0.7)';
            ctx.lineWidth = 1.4;
            ctx.stroke();
            ctx.restore();
        }

        // 速度线：拖在球体后方
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(Math.atan2(fy, fx));
        ctx.lineCap = 'round';
        for (let i = 0; i < 7; i++) {
            const ang = Math.PI - 1.25 + i * (2.5 / 6);
            const rr = R + 3 + (i % 3) * 4;
            const al = (0.1 + 0.24 * vis) * (0.55 + 0.45 * Math.sin(t * 22 + i * 1.7));
            ctx.strokeStyle = 'rgba(150,225,255,' + al.toFixed(3) + ')';
            ctx.lineWidth = 1.6 + (i % 2) * 1.3;
            ctx.beginPath();
            ctx.arc(0, 0, rr, ang, ang + 0.5);
            ctx.stroke();
        }
        ctx.restore();

        ctx.save();
        ctx.translate(cx, cy);

        // 球体本体
        const bGrad = ctx.createRadialGradient(-R * 0.38, -R * 0.42, R * 0.15, 0, 0, R * 1.12);
        bGrad.addColorStop(0, '#ffffff');
        bGrad.addColorStop(0.5, '#e6ecf6');
        bGrad.addColorStop(1, '#9dabbf');
        ctx.fillStyle = bGrad;
        ctx.beginPath();
        ctx.arc(0, 0, R, 0, TAU);
        ctx.fill();

        // 蜷起的双腿：根部收在球心附近，鞋尖沿球面绕行
        const at = (ang, rad) => ({ x: Math.cos(ang + spin) * rad, y: Math.sin(ang + spin) * rad });
        const limbs = [
            { ang: 2.35, rad: R * 0.82, w: 8.6, knee: R * 0.5, boot: 1 },
            { ang: 3.95, rad: R * 0.76, w: 8.2, knee: R * 0.48, boot: 1 }
        ];
        ctx.lineCap = 'round';
        for (let i = 0; i < limbs.length; i++) {
            const L = limbs[i];
            const p = at(L.ang, L.rad);
            const mid = at(L.ang, L.knee);
            const root = at(L.ang, R * 0.16);
            ctx.beginPath();
            ctx.moveTo(root.x, root.y);
            ctx.lineTo(mid.x, mid.y);
            ctx.lineTo(p.x, p.y);
            ctx.strokeStyle = 'rgba(104,124,154,0.5)';       // 描边，让四肢在白色球面上分得开
            ctx.lineWidth = L.w + 1.8;
            ctx.stroke();
            ctx.strokeStyle = i === 0 ? '#e2e9f4' : '#cdd8e8';
            ctx.lineWidth = L.w;
            ctx.stroke();
            ctx.fillStyle = i === 0 ? '#e2e9f4' : '#cdd8e8';
            ctx.beginPath();
            ctx.arc(mid.x, mid.y, L.w * 0.42, 0, TAU);
            ctx.fill();
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(L.ang + spin + Math.PI / 2);
            ctx.fillStyle = '#9da9bb';
            roundRectPath(-5.4, -0.4, 11, 3.6, 1.8);
            ctx.fill();
            const bootG = ctx.createLinearGradient(0, -6, 0, 0.4);
            bootG.addColorStop(0, '#ffffff');
            bootG.addColorStop(1, '#c2ccdb');
            ctx.fillStyle = bootG;
            ctx.beginPath();
            ctx.moveTo(-2.9, -5.2);
            ctx.bezierCurveTo(-4.8, -4.9, -5.4, -2.8, -5.1, -0.6);
            ctx.lineTo(-3.6, 0);
            ctx.lineTo(4.4, 0);
            ctx.quadraticCurveTo(7.2, -0.2, 7.4, -2.2);
            ctx.bezierCurveTo(7.5, -3.9, 5.8, -5, 2.6, -5.2);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = 'rgba(100,116,144,0.5)';
            ctx.lineWidth = 0.9;
            ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,0.55)';
            ctx.beginPath();
            ctx.ellipse(4.8, -3.2, 1.9, 1.4, -0.3, 0, TAU);
            ctx.fill();
            ctx.restore();
        }

        // 背包（露在头盔下方）
        ctx.fillStyle = '#7f8da3';
        roundRectPath(-9.5, 1.5, 19, 13, 5.5);
        ctx.fill();
        ctx.fillStyle = '#9aa7bb';
        roundRectPath(-8, 3, 16, 5, 2.5);
        ctx.fill();

        // 头盔：始终朝翻滚方向，只有轻微晃动
        const hw = -0.34 + Math.sin(spin * 2) * 0.11;
        ctx.save();
        ctx.translate(Math.cos(hw) * R * 0.44, Math.sin(hw) * R * 0.44);
        ctx.rotate(hw * 0.75);
        ctx.fillStyle = '#eef3fa';
        ctx.beginPath();
        ctx.arc(0, 0, 11.4, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = 'rgba(104,124,154,0.55)';
        ctx.lineWidth = 1.6;
        ctx.stroke();
        ctx.fillStyle = '#c3ccdb';
        ctx.beginPath();
        ctx.arc(0, 2.4, 10.4, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#2c3a52';
        ctx.beginPath();
        ctx.ellipse(1.2, -1.4, 7.4, 6.2, 0, 0, TAU);
        ctx.fill();
        ctx.fillStyle = 'rgba(120,220,255,0.45)';
        ctx.beginPath();
        ctx.ellipse(3.4, -3.6, 2.8, 2, -0.5, 0, TAU);
        ctx.fill();
        const bl = blinkAmt(t);
        const eh = Math.max(0.2, 1.5 * (1 - bl));
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(-1, -0.9, 1.5, eh, 0, 0, TAU);
        ctx.ellipse(4.2, -0.9, 1.5, eh, 0, 0, TAU);
        ctx.fill();
        ctx.restore();

        // 球体边缘暗部 + 无敌光环
        ctx.strokeStyle = 'rgba(88,106,134,0.55)';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(0, 0, R - 0.8, 0, TAU);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(88,106,134,0.35)';
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.arc(0, 0, R - 2.6, 1.5, 3.4);
        ctx.stroke();
        const hGrad = ctx.createRadialGradient(0, 0, R * 0.88, 0, 0, R * 1.34);
        hGrad.addColorStop(0, 'rgba(140,230,255,0)');
        hGrad.addColorStop(0.6, 'rgba(140,230,255,' + (0.2 * vis).toFixed(3) + ')');
        hGrad.addColorStop(1, 'rgba(140,230,255,0)');
        ctx.fillStyle = hGrad;
        ctx.beginPath();
        ctx.arc(0, 0, R * 1.34, 0, TAU);
        ctx.fill();

        ctx.restore();
    }

    // ==================== 道具图标 ====================
    const ITEMS = [
        { id: 'heart', name: ITEM_NAMES.heart, color: '#ff6b8a' },

    const ITEM_BY_ID = {};

    // 各图标的自然绘制范围宽窄不一，这里统一缩放，保证视觉尺寸一致

    };
    // 道具图标共用的手枪侧视图：原点在套筒中心，枪口朝 +x
    function drawItemPistol(body, dark, light) {

// 射速增加 / 子弹分裂 / 攻击增加 共用同一套基准变换，保证三把枪的大小与位置完全一致
// 枪口朝右上方 37.8°（比 45° 略平），整体再放大一档并整体左移
    const GUN_ROT = -0.66, GUN_SCALE = 1.30, GUN_TX = -1.7, GUN_TY = 0, GUN_SHIFT_X = -3.5;
    function gunFrame(body, dark, light) {
        ctx.save();
        ctx.translate(GUN_SHIFT_X, 0);
        ctx.rotate(GUN_ROT);

    }

    // 闪避增长 / 闪避冷却 共用的跑动小人：朝左奔跑，膝盖与手肘有明显折角，后腿后臂压低
    function drawRunnerFigure(longTrail) {
        // 拖影画在未镜像的坐标系里，位于人物身后（画面右侧）
        const trails = longTrail
            ? [[26, -12, 8, 0.22, 2.6], [28, -4, 9, 0.28, 2.8], [24, 3, 8, 0.24, 2.6], [26, 10, 9, 0.26, 2.8], [21, 16, 8, 0.2, 2.4]]
            : [[16, -11, 6, 0.26, 2.4], [17, -4, 6, 0.3, 2.6], [15, 4, 6, 0.24, 2.4], [14, 12, 6, 0.2, 2.2]];
        ctx.save();
        ctx.strokeStyle = '#7ce0ff';
        ctx.lineWidth = 4.4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.scale(-1, 1);                   // 人物朝左奔跑
        ctx.beginPath();                    // 前腿：大腿前摆 → 膝 → 小腿向前上方踢
        ctx.moveTo(0, 3); ctx.lineTo(8, 5); ctx.lineTo(13, -1);
        ctx.stroke();
        ctx.beginPath();                    // 后腿：压低，大腿后蹬 → 膝 → 小腿向后下甩
        ctx.moveTo(0, 3); ctx.lineTo(-7, 10); ctx.lineTo(-4, 17);
        ctx.stroke();
        ctx.beginPath();                    // 躯干前倾
        ctx.moveTo(0, 3); ctx.lineTo(5, -8);

        ctx.moveTo(4, -7); ctx.lineTo(-4, -3); ctx.lineTo(-9, 2);

        ctx.beginPath();                    // 前臂
        ctx.moveTo(4, -7); ctx.lineTo(11, -6); ctx.lineTo(14, -11);
        ctx.stroke();
        ctx.lineCap = 'butt';
        ctx.fillStyle = '#dff5ff';
        const JOINTS = [[8, 5], [-7, 10], [-4, -3], [11, -6]];
        for (let i = 0; i < JOINTS.length; i++) {
            ctx.beginPath();
            ctx.arc(JOINTS[i][0], JOINTS[i][1], 2, 0, TAU);
            ctx.fill();
        }
        ctx.beginPath();

        ctx.strokeStyle = 'rgba(124,224,255,0.55)';

            ctx.moveTo(tr[0], tr[1]); ctx.lineTo(tr[2], tr[1]);

        }

    }

    // 星球特色装备图标：统一的六边形能量核心 + 各自招式的符号
    function drawRelicIconBody(abil, col) {
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        const g = ctx.createRadialGradient(0, -2, 1, 0, 0, 20);
        g.addColorStop(0, '#ffffff');
        g.addColorStop(0.3, col);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(0, 0, 19, 0, TAU);
        ctx.fill();
        ctx.fillStyle = 'rgba(9,15,26,0.80)';
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
            const a = -Math.PI / 2 + i * Math.PI / 3;
            const vx = Math.cos(a) * 14.5, vy = Math.sin(a) * 14.5;
            if (i === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
        }
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = col;
        ctx.lineWidth = 2.2;
        ctx.stroke();
        ctx.fillStyle = col;
        ctx.strokeStyle = col;
        ctx.lineWidth = 2.1;
        switch (abil) {
            case 'water':                       // 漫地水幕：三道下垂的水纹
                for (let i = -1; i <= 1; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * 6, -10);
                    ctx.bezierCurveTo(i * 6 + 4, -3, i * 6 - 4, 3, i * 6, 11);
                    ctx.stroke();
                }
                break;
            case 'acid':                        // 酸雨灼烧：液滴 + 气泡
                ctx.beginPath();
                ctx.moveTo(0, -12);
                ctx.bezierCurveTo(9, -2, 10, 3, 6, 8);
                ctx.bezierCurveTo(3, 12, -3, 12, -6, 8);
                ctx.bezierCurveTo(-10, 3, -9, -2, 0, -12);
                ctx.fill();
                ctx.lineWidth = 1.6;
                ctx.beginPath();
                ctx.arc(-6, -8, 1.8, 0, TAU);
                ctx.arc(7, -9, 1.4, 0, TAU);
                ctx.fill();
                break;
            case 'fire':                        // 烈焰地火：火苗
                ctx.beginPath();
                ctx.moveTo(0, -13);
                ctx.bezierCurveTo(7, -5, 10, 0, 6, 6);
                ctx.bezierCurveTo(3, 11, -4, 11, -7, 6);
                ctx.bezierCurveTo(-10, 0, -5, -3, -3, -8);
                ctx.bezierCurveTo(-1, -5, 2, -4, 0, -13);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.75)';
                ctx.beginPath();
                ctx.moveTo(0, -1);
                ctx.bezierCurveTo(3, 2, 3, 5, 0, 7);
                ctx.bezierCurveTo(-3, 5, -3, 2, 0, -1);
                ctx.fill();
                break;
            case 'thunder':                     // 雷霆天罚：闪电
                ctx.beginPath();
                ctx.moveTo(3, -13); ctx.lineTo(-7, 1); ctx.lineTo(-1, 1);
                ctx.lineTo(-3, 13); ctx.lineTo(7, -2); ctx.lineTo(1, -2);
                ctx.closePath();
                ctx.fill();
                break;
            case 'blade':                       // 光环旋刃：两道交叉的旋臂
                for (let s = -1; s <= 1; s += 2) {
                    ctx.lineWidth = 2.8;
                    ctx.beginPath();
                    ctx.arc(0, 0, 10, s > 0 ? -0.9 : Math.PI - 0.9, s > 0 ? 0.9 : Math.PI + 0.9);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(Math.cos(s > 0 ? 0.9 : Math.PI + 0.9) * 10, Math.sin(s > 0 ? 0.9 : Math.PI + 0.9) * 10, 2.4, 0, TAU);
                    ctx.fill();
                }
                ctx.lineWidth = 2.2;
                ctx.beginPath();
                ctx.arc(0, 0, 2.6, 0, TAU);
                ctx.fill();
                break;
            case 'laser':                       // 贯穿激光：光束 + 箭头
                ctx.lineWidth = 3.2;
                ctx.beginPath();
                ctx.moveTo(-13, 0); ctx.lineTo(6, 0);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(13, 0); ctx.lineTo(4, -6); ctx.lineTo(4, 6);
                ctx.closePath();
                ctx.fill();
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(-13, -5); ctx.lineTo(-13, 5);
                ctx.stroke();
                break;
            case 'homing':                      // 深渊追踪：螺旋 + 追踪箭头
                ctx.lineWidth = 2.2;
                ctx.beginPath();
                for (let i = 0; i <= 26; i++) {
                    const a = i * 0.42, rr = 1.2 + i * 0.42;
                    const vx = Math.cos(a) * rr - 2, vy = Math.sin(a) * rr;
                    if (i === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
                }
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(12, -3); ctx.lineTo(6, 1); ctx.lineTo(12, 5);
                ctx.closePath();
                ctx.fill();
                break;
            default:                            // 冥府召唤：扩散脉冲
                for (let i = 0; i < 3; i++) {
                    ctx.lineWidth = 2.4 - i * 0.5;
                    ctx.beginPath();
                    ctx.arc(0, 0, 4 + i * 5, -2.5, -0.6);
                    ctx.stroke();
                }
                ctx.beginPath();
                ctx.arc(-1, 0, 3, 0, TAU);
                ctx.fill();
                break;
        }
        ctx.restore();
    }

    // 人物身形中心的世界纵坐标：与 drawRangeRings 画在屏幕上的圆心完全一致
    function playerBodyY() { return world.player.y + PLAYER_SCR_OFF - BODY_OFF; }

    // ==================== 战备配置：五区配置菜单 ====================
    // 存档 save.loadout = { item:[4], itemStore:[16], fixed:[4], equipStore:[16], equip:[4] }
    // 每格存道具 id 或 null；道具 ↔ 道具仓库、装备 ↔ 装备仓库 可互换，固定栏只读
    function areaById(id) {
        for (let i = 0; i < INV_AREAS.length; i++) if (INV_AREAS[i].id === id) return INV_AREAS[i];
        return null;
    }
    function areaIndex(id) {
        for (let i = 0; i < INV_AREAS.length; i++) if (INV_AREAS[i].id === id) return i;
        return 0;
    }
    function invSlots(id) { return save.loadout[id]; }
    function slotAt(id, c, r) {
        const L = invSlots(id);
        const i = r * areaById(id).cols + c;
        return (i >= 0 && i < L.length) ? L[i] : null;
    }
    function setSlotAt(id, c, r, val) {
        const L = invSlots(id);
        const i = r * areaById(id).cols + c;
        if (i >= 0 && i < L.length) L[i] = val;
    }
    function firstEmpty(id) {
        const L = invSlots(id);
        for (let i = 0; i < L.length; i++) if (!L[i]) return i;
        return -1;
    }
    function countFilled(id) {
        const L = invSlots(id);
        let n = 0;
        for (let i = 0; i < L.length; i++) if (L[i]) n++;
        return n;
    }
    // 区域归属：固定栏锁死四项；装备类道具（爆炸子弹 / 星球特色装备）只出现在装备区，仅由装备补给箱与挖掘产出
    const FIXED_IDS = ['heart', 'shoes', 'dmg', 'scope'];
    const EQUIP_IDS = ['boom'].concat(RELIC_IDS);
    function areaAllows(id, a) {
        if (a.id === 'fixed') return FIXED_IDS.indexOf(id) >= 0;
        if (a.id === 'equip' || a.id === 'equipStore') return EQUIP_IDS.indexOf(id) >= 0;
        return FIXED_IDS.indexOf(id) < 0 && EQUIP_IDS.indexOf(id) < 0;
    }
    // 校验存档：逐区按尺寸重建，去掉无效 id 与区内重复；该区没有存档时用初始配置填充
    function loadoutDefault(id) {
        if (id === 'fixed') return FIXED_IDS.slice();
        if (id === 'equipStore') return ['boom'];
        if (id === 'itemStore') return ITEMS.map((it) => it.id).filter((v) => areaAllows(v, { id: 'itemStore' }));
        return [];
    }
    function normalizeLoadout() {
        const src = (save.loadout && typeof save.loadout === 'object') ? save.loadout : {};
        const L = {};
        for (let i = 0; i < INV_AREAS.length; i++) {
            const a = INV_AREAS[i];
            const arr = new Array(INV_SLOTS[a.id]).fill(null);
            const old = Array.isArray(src[a.id]) ? src[a.id] : loadoutDefault(a.id);
            const seen = Object.create(null);
            for (let k = 0; k < arr.length; k++) {
                const id = old[k];
                if (!ITEM_BY_ID[id] || seen[id] || !areaAllows(id, a)) continue;
                seen[id] = 1; arr[k] = id;
            }
            // 固定区始终锁定为这四个道具
            if (a.id === 'fixed') {
                for (let k = 0; k < arr.length; k++) arr[k] = k < FIXED_IDS.length ? FIXED_IDS[k] : null;
            }
            L[a.id] = arr;
        }
        save.loadout = L;
    }
    // 道具补给箱候选池 = 道具栏 + 固定栏
    function itemPool() {
        const out = [];
        const src = save.loadout.item.concat(save.loadout.fixed);
        for (let i = 0; i < src.length; i++) {
            if (src[i] && ITEM_BY_ID[src[i]]) out.push(ITEM_BY_ID[src[i]]);
        }
        return out;
    }
    // 装备补给箱候选池（装备栏内容，全部为装备类道具；为空时由调用方改用道具补给箱）
    function weaponPool() {
        const out = [];
        for (let i = 0; i < save.loadout.equip.length; i++) {
            const id = save.loadout.equip[i];
            if (id && ITEM_BY_ID[id]) out.push(ITEM_BY_ID[id]);
        }
        return out;
    }
    // 挖到的星球特色装备存入地球战备栏的装备仓库
    function grantRelicItem(itemId) {
        const L = invSlots('equipStore');
        let k = -1;
        for (let i = 0; i < INV_SLOTS.equipStore; i++) { if (!L[i]) { k = i; break; } }
        if (k < 0) { sfx('uiBack'); return false; }
        L[k] = itemId;
        persist();
        return true;
    }
    function openInvMenu() {
        const inv = world.inv;
        inv.on = true;
        inv.ai = 0;
        inv.c = 0; inv.r = 0;
        inv.msg = ''; inv.msgT = 0;
        sfx('uiSelect');
    }
    function invMsg(msg) {
        world.inv.msg = msg;
        world.inv.msgT = 1.8;
    }
    // J / A：把光标道具移到同一对中的另一个区域；固定栏与空位不可移动
    function moveInvItem() {
        const inv = world.inv;
        const a = INV_AREAS[inv.ai];
        if (!a.pair) { sfx('uiBack'); invMsg('固定栏不可移动'); return; }
        const id = slotAt(a.id, inv.c, inv.r);
        if (!id || !ITEM_BY_ID[id]) { sfx('uiBack'); invMsg('这里是空的'); return; }
        const k = firstEmpty(a.pair);
        if (k < 0) { sfx('uiBack'); invMsg('目标栏已满'); return; }
        setSlotAt(a.id, inv.c, inv.r, null);
        invSlots(a.pair)[k] = id;
        persist();
        sfx('item');
        invMsg(ITEM_NAMES[id] + '　已移动到' + INV_AREAS[areaIndex(a.pair)].title);
    }
    // 菜单打开时：方向键归菜单所有，K / B 关闭
    function updateInvMenu(dt) {
        const inv = world.inv;
        if (inv.msgT > 0) inv.msgT -= dt;
        const a = INV_AREAS[inv.ai];
        let moved = false;
        if (menuEdge('up')) { inv.r = (inv.r + INV_ROWS - 1) % INV_ROWS; moved = true; }
        if (menuEdge('down')) { inv.r = (inv.r + 1) % INV_ROWS; moved = true; }
        if (menuEdge('left')) {
            if (inv.c > 0) { inv.c--; moved = true; }
            else if (inv.ai > 0) { inv.ai--; inv.c = INV_AREAS[inv.ai].cols - 1; moved = true; }
        }
        if (menuEdge('right')) {
            if (inv.c < a.cols - 1) { inv.c++; moved = true; }
            else if (inv.ai < INV_AREAS.length - 1) { inv.ai++; inv.c = 0; moved = true; }
        }
        if (moved) sfx('uiMove');
        if (menuConfirm()) moveInvItem();
        if (menuBack()) { inv.on = false; sfx('uiBack'); }
    }
    // 面板横坐标：1x4 / 4x4 / 1x4 / 4x4 / 1x4 依次排开，整体水平居中
    function invPanelW(i) { return INV_AREAS[i].cols * INV_PITCH - INV_GAP + INV_PAD * 2; }

        let total = INV_GAPX * (INV_AREAS.length - 1);
        for (let k = 0; k < INV_AREAS.length; k++) total += invPanelW(k);
        let x = (W - total) / 2;
        for (let k = 0; k < i; k++) x += invPanelW(k) + INV_GAPX;
        return x;
    }
    function invPanelRect(i) {
        return {
            x: invPanelX(i),
            y: INV_TOP - INV_HEAD - INV_PAD,
            w: invPanelW(i),

    // ==================== 范围圈 / 能力面板 ====================
    function playerStats() {
        const p = world.player;
        return {
            dmg: p.dmg,
            fireGap: p.fireCdMs,
            boomR: boomRadius(p.boomLv),
            bullets: p.bullets,
            speed: Math.round(BASE_SPEED * p.speedMul * world.slowFactor),
            pickup: Math.round(PICKUP_BASE + p.pickupBonus),
            dodge: Math.round(DODGE_BASE + p.dodge),

    // ==================== 范围光影（拾取高亮 + 射程压暗） ====================
    // 拾取范围与射击范围合并为同一套人物周身的光影效果，分两层绘制：
    //   ① 身前层 drawRangeRings(cx, cy, t)：拾取范围以人物为中心轻微加亮
    //   ② 身后层 drawRangeShade(cx, cy)：射击范围之内完全透明，范围之外径向渐变压暗
    function drawRangeRings(cx, cy, t) {
        const st = playerStats();
        ctx.save();
        // 闪避距离：青蓝色虚线安全圈，只有堆了力场道具才画
        if (st.dodge > 0) {
            ctx.setLineDash([3, 7]);
            ctx.lineDashOffset = -t * 18;
            ctx.strokeStyle = 'rgba(124,224,255,0.30)';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.arc(cx, cy, st.dodge, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
        }
        // 拾取范围：中心轻微加亮，边缘彻底化开
        const pr = st.pickup;
        const pg = ctx.createRadialGradient(cx, cy, pr * 0.08, cx, cy, pr);
        pg.addColorStop(0, 'rgba(172,255,216,0.15)');
        pg.addColorStop(0.40, 'rgba(132,248,190,0.10)');
        pg.addColorStop(0.78, 'rgba(120,240,170,0.042)');
        pg.addColorStop(1, 'rgba(120,240,170,0)');
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = pg;
        ctx.beginPath();
        ctx.arc(cx, cy, pr, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
    // 射击范围：圈内保持原样，圈外由内向外逐渐压暗（比原先的暗角略深）
    function drawRangeShade(cx, cy) {
        const r0 = playerStats().fireRange;
        const g = ctx.createRadialGradient(cx, cy, r0, cx, cy, PLAY_H * 0.95);
        g.addColorStop(0, 'rgba(0,0,0,0)');
        g.addColorStop(0.45, 'rgba(0,0,0,0.30)');
        g.addColorStop(1, 'rgba(0,0,0,0.56)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, PLAY_H);
    }

    // ==================== 道具三选一 ====================
    // 不操作时三个道具静止（一个在头上，两个在身侧），
    // 按 左/右 方向轮换顺序，按 J 确认头顶那个，选完清空。
    function pkgItems() { return world.pkg; }
    // 开启一轮选择（重新计时）
    function openPkg(items) {
        world.pkg = items;
        world.pkgSel = 0;
        world.pkgTimer = PKG_TIME;
    }
    // 结算当前选择：auto 为超时/重复拾取导致的自动选择
    function confirmPkg(auto) {
        if (!world.pkg || !world.pkg.length) { world.pkgTimer = 0; return; }
        const id = world.pkg[world.pkgSel];
        if (auto) addPopup(world.player.x, world.player.y - 66, '超时自动选用：' + ITEM_BY_ID[id].name, '#cfe4ff', true);
        applyItem(id);
        world.pkg = null;
        world.pkgSel = 0;
        world.pkgTimer = 0;
    }
    function rotatePkg(dir) {
        if (!world.pkg || world.pkg.length < 2) return;
        const n = world.pkg.length;
        world.pkgSel = ((world.pkgSel + dir) % n + n) % n;
        sfx('uiMove');
    }
    function updatePkgTimer(dt) {
        if (!world.pkg || !world.pkg.length) return;
        world.pkgTimer -= dt;
        if (world.pkgTimer <= 0) {
            confirmPkg(true);
            // 队列里还有则继续下一轮
            if (world.pkgQueue.length) openPkg(world.pkgQueue.shift());
        }
    }
    function drawPkgRing(px, py, t) {
        const n = world.pkg.length;
        if (!n) return;
        const R = 66;
        const top = world.pkgSel;
        const slots = [];
        slots.push({ id: world.pkg[top], x: px, y: py - 104, top: true });
        if (n > 1) slots.push({ id: world.pkg[(top + 1) % n], x: px + R, y: py - 46, top: false });
        if (n > 2) slots.push({ id: world.pkg[(top + 2) % n], x: px - R, y: py - 46, top: false });
        for (let i = 0; i < slots.length; i++) {
            const sl = slots[i];
            const size = sl.top ? 26 : 17;
            if (sl.top) {
                const g = ctx.createRadialGradient(sl.x, sl.y, 2, sl.x, sl.y, 34);
                g.addColorStop(0, 'rgba(255,255,255,0.42)');
                g.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(sl.x, sl.y, 34, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.save();
            ctx.globalAlpha = sl.top ? 1 : 0.6;
            ctx.fillStyle = 'rgba(12,20,34,0.82)';

            ctx.arc(sl.x, sl.y, size * 0.95, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = ITEM_BY_ID[sl.id].color;
