            ctx.stroke();
            ctx.restore();
            drawItemIcon(sl.id, sl.x, sl.y, size * 0.86, sl.top ? 1 : 0.78);
            // 方向指示（只在头顶上方画）
            if (sl.top) {
                ctx.save();
                ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 5);
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(sl.x, sl.y - 46);
                ctx.lineTo(sl.x - 7, sl.y - 58);
                ctx.lineTo(sl.x + 7, sl.y - 58);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
        }
        // 左右尖端提示
        ctx.save();
        ctx.globalAlpha = 0.55;
        setFont(11, 'bold');
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#cfe4ff';
        ctx.fillText('← 切换 →', px, py - 132);
        ctx.restore();
        // 选择倒计时圆环
        if (world.pkgTimer > 0) {
            const k = clamp(world.pkgTimer / PKG_TIME, 0, 1);
            const low = k < 0.3;
            const cxp = px, cyp = py - 104;
            ctx.save();
            ctx.strokeStyle = 'rgba(255,255,255,0.16)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(cxp, cyp, PKG_TIMER_R, 0, Math.PI * 2);
            ctx.stroke();
            ctx.strokeStyle = low ? 'rgba(255,120,120,' + (0.6 + 0.4 * Math.abs(Math.sin(t * 8))) + ')'
                : 'rgba(255,224,102,0.9)';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(cxp, cyp, PKG_TIMER_R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k);
            ctx.stroke();
            ctx.lineCap = 'butt';
            setFont(11, 'bold');
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = low ? '#ff9b9b' : '#ffe066';
            ctx.fillText(Math.ceil(world.pkgTimer) + 's', cxp, cyp + PKG_TIMER_R + 13);
            ctx.restore();
        }
    }

// ==================== 特效 ====================
    function addFx(o) { world.fx.push(o); }
    function addPopup(x, y, text, col, follow) {
        world.popups.push({ x: x, y: y, text: text, col: col || '#ffd966', life: 1.3, follow: !!follow });
    }
    function wrapDX(wx) { let d = wx - world.cam.x; const hw = MAP_W / 2; if (d > hw) d -= MAP_W; else if (d < -hw) d += MAP_W; return d; }
    function wrapDY(wy) { let d = wy - world.cam.y; const hh = MAP_H / 2; if (d > hh) d -= MAP_H; else if (d < -hh) d += MAP_H; return d; }
    function dX(a, b) { let d = a - b; const hw = MAP_W / 2; if (d > hw) d -= MAP_W; else if (d < -hw) d += MAP_W; return d; }
    function dY(a, b) { let d = a - b; const hh = MAP_H / 2; if (d > hh) d -= MAP_H; else if (d < -hh) d += MAP_H; return d; }
    function scrX(wx) { return W / 2 + wrapDX(wx); }
    function scrY(wy) { return PLAY_H / 2 + wrapDY(wy); }

    // ==================== 敌人 ====================
    // 杂兵血量 = 触手数量：每 5 级刷新的杂兵 +1 点血
    function enemyStat(tier, kind) {
        const base = 58 + Math.random() * 24;
        const speed = base * (1 + tier * 0.18) * (kind === 'runner' ? 1.5 : 1);
        const hp = 1 + Math.floor(world.level / 5);
        return { speed: speed, hp: hp };
    }
    function spawnEnemy(forcedKind) {
        const p = world.planet;
        if (!p.enemy) return;
        const cam = world.cam;
        const m = 60;
        const side = randInt(0, 3);
        let x = 0, y = 0;
        if (side === 0) { x = cam.x + rand(-W / 2 - m, W / 2 + m); y = cam.y - PLAY_H / 2 - m; }
        else if (side === 1) { x = cam.x + rand(-W / 2 - m, W / 2 + m); y = cam.y + PLAY_H / 2 + m; }
        else if (side === 2) { x = cam.x - W / 2 - m; y = cam.y + rand(-PLAY_H / 2 - m, PLAY_H / 2 + m); }
        else { x = cam.x + W / 2 + m; y = cam.y + rand(-PLAY_H / 2 - m, PLAY_H / 2 + m); }
        let kind = 'grunt';
        if (world.tier >= 1 && Math.random() < 0.28) kind = 'runner';
        // 5 级后小概率出现远程射击敌人
        if (world.level >= 5 && Math.random() < 0.10 + (world.level - 5) * 0.012) kind = 'ranged';
        if (forcedKind) kind = forcedKind;
        const st = enemyStat(world.tier, kind);
        world.enemies.push({
            x: wrapVal(x, MAP_W), y: wrapVal(y, MAP_H),
            hp: st.hp, maxHp: st.hp, speed: st.speed, kind: kind,
            r: kind === 'runner' ? 13 : (kind === 'ranged' ? 17 : 16),
            ph: Math.random() * Math.PI * 2,
            flash: 0, cd: rand(1.0, 2.6), ang: Math.random() * Math.PI * 2
        });
    }

    function drawEnemy(e) {
        const x = scrX(e.x), y = scrY(e.y);
        const m = 60 / viewZoom;
        if (x < -m || x > W + m || y < -m || y > PLAY_H + m) return;
        const p = world.planet;
        const c = p.enemy;
        ctx.save();
        ctx.translate(x, y);
        // 影子
        ctx.globalAlpha = 0.25;
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.ellipse(3, e.r * 0.72, e.r * 0.85, e.r * 0.36, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        const wob = Math.sin(world.t * 6 + e.ph) * 0.10;
        if (e.kind === 'runner') {
            ctx.rotate(wob * 2);
            ctx.fillStyle = e.flash > 0 ? '#ffffff' : c.body;
            ctx.beginPath();
            ctx.moveTo(e.r * 1.15, 0);
            ctx.lineTo(-e.r * 0.6, -e.r * 0.85);
            ctx.lineTo(-e.r * 0.2, 0);
            ctx.lineTo(-e.r * 0.6, e.r * 0.85);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = c.dark;
            ctx.beginPath();
            ctx.moveTo(-e.r * 0.6, 0);
            ctx.lineTo(-e.r * 1.15, -e.r * 0.5);
            ctx.lineTo(-e.r * 1.15, e.r * 0.5);
            ctx.closePath();
            ctx.fill();
        } else if (e.kind === 'ranged') {
            ctx.fillStyle = e.flash > 0 ? '#ffffff' : c.dark;
            ctx.beginPath();
            ctx.ellipse(0, 0, e.r * 1.05, e.r * 1.15, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = e.flash > 0 ? '#ffffff' : c.body;
            ctx.beginPath();
            ctx.ellipse(0, -e.r * 0.2, e.r * 0.8, e.r * 0.8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.fillRect(-e.r * 0.9, e.r * 0.35, e.r * 1.8, e.r * 0.22);
        } else {
            ctx.rotate(wob);
            ctx.fillStyle = e.flash > 0 ? '#ffffff' : c.body;
            ctx.beginPath();
            ctx.ellipse(0, 0, e.r * 1.05, e.r * 1.15, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = c.dark;
            ctx.beginPath();
            ctx.ellipse(0, e.r * 0.28, e.r * 0.72, e.r * 0.5, 0, 0, Math.PI * 2);
            ctx.fill();
        }
        // 触手数量 = 当前血量（不再画血条）
        const tn = clamp(e.hp, 1, 9);
        ctx.strokeStyle = e.flash > 0 ? '#ffffff' : c.dark;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        for (let i = 0; i < tn; i++) {
            const a = tn === 1 ? -Math.PI / 2
                : (-Math.PI * 0.78 + (i / (tn - 1)) * Math.PI * 1.56 + wob * 2);
            const tx = Math.cos(a) * e.r * 1.38, ty = Math.sin(a) * e.r * 1.42 - 3;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * e.r * 0.66, Math.sin(a) * e.r * 0.72);
            ctx.lineTo(tx, ty);
            ctx.stroke();
            ctx.fillStyle = e.flash > 0 ? '#ffffff' : c.eye;
            ctx.beginPath();
            ctx.arc(tx, ty, 2.6, 0, Math.PI * 2);
            ctx.fill();
        }
        // 眼睛
        if (e.kind !== 'runner') {
            const dirX = dX(world.player.x, e.x);
            const dirY = dY(world.player.y, e.y);
            const m = Math.max(1, Math.hypot(dirX, dirY));
            const ex = dirX / m * e.r * 0.34, ey = dirY / m * e.r * 0.3 - e.r * 0.16;
            ctx.fillStyle = e.flash > 0 ? '#ff4444' : c.eye;
            ctx.beginPath();
            ctx.arc(ex - 3, ey, 3, 0, Math.PI * 2);
            ctx.arc(ex + 3, ey, 3, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    function killEnemy(e, i, gainXp) {
        world.enemies.splice(i, 1);
        world.kills++;
        world.score += 10 + world.tier * 5;
        const val = e.kind === 'ranged' ? 3 : (e.kind === 'runner' ? 2 : 1);
        world.orbs.push({ x: e.x, y: e.y, val: gainXp === false ? 0 : val, ph: Math.random() * 6, homing: false, age: 0 });
        addFx({ kind: 'boom', x: e.x, y: e.y, life: 0.36, max: 0.36, r: e.r * 2.2, col: world.planet.accent });
        sfx('enemyDie');
    }

    function damagePlayer(dmg, fromX, fromY) {
        const p = world.player;
        if (p.invuln > 0 || p.rollT > 0 || world.over || world.bossDefeated) return;
        p.hp -= dmg;
        p.invuln = 1.5;
        p.hitFlash = 0.35;
        addFx({ kind: 'boom', x: p.x, y: p.y, life: 0.3, max: 0.3, r: 40, col: '#ff6b6b' });
        sfx('hurt');
        if (fromX !== undefined) {
            const dx = dX(p.x, fromX), dy = dY(p.y, fromY);
            const m = Math.max(1, Math.hypot(dx, dy));
            p.x = wrapVal(p.x + dx / m * 34, MAP_W);
            p.y = wrapVal(p.y + dy / m * 34, MAP_H);
        }
        if (p.hp <= 0) {
            p.hp = 0;
            world.over = true;
            sfx('explode');
        }
    }

    // ==================== BOSS ====================
    function spawnBoss() {
        const p = world.planet;
        if (!p.boss) return;
        const cam = world.cam;
        world.boss = {
            x: wrapVal(cam.x + W / 2 + 90, MAP_W),
            y: wrapVal(cam.y, MAP_H),
            hp: 50, maxHp: 50,
            r: 54,
            ang: Math.PI,
            speed: 54 + world.tier * 10,
            cd: 2.0, cd2: 3.4,
            ph: 0, flash: 0, hurtT: 0, dying: 0
        };
        world.bossDefeated = false;
        sfx('boss');
        addPopup(wrapDX(world.boss.x) + W / 2, wrapDY(world.boss.y) + PLAY_H / 2 - 70, '警报：' + p.boss, '#ff6b6b');
    }

    function bossShootBullet(x, y, ang, spd, r, col, homing) {
        world.enemyBullets.push({
            x: wrapVal(x, MAP_W), y: wrapVal(y, MAP_H),
            vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
            r: r || 6, life: 5.5, col: col || world.planet.accent, homing: homing || 0, ph: Math.random() * 6
        });
    }
    function bossAddZone(x, y, r, type, life) {
        world.zones.push({ x: wrapVal(x, MAP_W), y: wrapVal(y, MAP_H), r: r, type: type, life: life || 7, tick: 0, ph: Math.random() * 6 });
    }
    function zoneWarnColor(type) {
        if (type === 'slow') return '#8fd8ff';
        if (type === 'fire') return '#ff9d5c';
        return '#b6ff6b';
    }
    // BOSS 特殊攻击：先把攻击范围画成预警图形倒计时，预警走完才真正发动，留下躲避窗口
    function queueBossAbility(abil, b, p) {
        const span = BOSS_WARN_TIME;
        const px3 = wrapVal(p.x + rand(-90, 90), MAP_W);
        const py3 = wrapVal(p.y + rand(-90, 90), MAP_H);
        const zones = [];
        const warns = [];
        let fire = null;
        switch (abil) {
            case 'water':
                zones.push({ x: px3, y: py3, r: rand(95, 150), type: 'slow', life: 8 });
                zones.push({ x: wrapVal(p.x, MAP_W), y: wrapVal(p.y, MAP_H), r: rand(90, 130), type: 'slow', life: 7 });
                break;
            case 'acid':
                zones.push({ x: px3, y: py3, r: rand(70, 100), type: 'acid', life: 8 });
                zones.push({ x: wrapVal(b.x, MAP_W), y: wrapVal(b.y, MAP_H), r: 120, type: 'acid', life: 5 });
                break;
            case 'fire':
                zones.push({ x: px3, y: py3, r: rand(60, 85), type: 'fire', life: 6.5 });
                zones.push({ x: wrapVal(p.x + rand(-150, 150), MAP_W), y: wrapVal(p.y + rand(-150, 150), MAP_H), r: rand(55, 80), type: 'fire', life: 5.5 });
                zones.push({ x: wrapVal(p.x + rand(-200, 200), MAP_W), y: wrapVal(p.y + rand(-200, 200), MAP_H), r: rand(48, 70), type: 'fire', life: 5 });
                break;
            case 'thunder':
                warns.push({ kind: 'circle', x: px3, y: py3, r: 62, col: '#ffe066' });
                fire = function () { world.marks.push({ kind: 'strike', x: px3, y: py3, r: 62, life: 0.85, max: 0.85 }); };
                break;
            case 'blade':
                warns.push({ kind: 'ring', x: b.x, y: b.y, r: 118, col: '#ffe9b8' });
                fire = function () { world.blades.push({ x: b.x, y: b.y, ang: b.ang, spin: 2.5, life: 7, r: 118, hitT: 0, n: 2 }); };
                break;
            case 'laser': {
                const ang = Math.atan2(dY(p.y, b.y), dX(p.x, b.x)) + rand(-0.5, 0.5);
                warns.push({ kind: 'beam', x: b.x, y: b.y, ang: ang, len: 1800, width: 26, col: '#ff8fd0' });
                fire = function () { world.beams.push({ x: b.x, y: b.y, ang: ang, warn: 0, life: 0.55, width: 26, len: 1800, hitT: 0 }); };
                break;
            }
            case 'homing': {
                const ph = b.ph * 2;
                for (let i = 0; i < 4; i++) warns.push({ kind: 'spoke', x: b.x, y: b.y, ang: ph + i * Math.PI / 2, len: 300, col: '#bfe8ff' });
                fire = function () {
                    for (let i = 0; i < 4; i++) bossShootBullet(b.x, b.y, ph + i * Math.PI / 2, 130, 8, '#bfe8ff', 1.5);
                };
                break;
            }
            case 'summon':
                warns.push({ kind: 'ring', x: b.x, y: b.y, r: 170, col: '#c58cff' });
                fire = function () {
                    spawnEnemy('grunt'); spawnEnemy('runner');
                    world.marks.push({ kind: 'pulse', x: b.x, y: b.y, r: 0, life: 1.1, max: 1.1, speed: 300 });
                };
                break;
        }
        for (let i = 0; i < zones.length; i++) {
            warns.push({ kind: 'circle', x: zones[i].x, y: zones[i].y, r: zones[i].r, col: zoneWarnColor(zones[i].type) });
        }
        if (!fire && !zones.length) return;
        for (let i = 0; i < warns.length; i++) { warns[i].t = span; warns[i].max = span; world.warns.push(warns[i]); }
        world.pend.push({
            t: span, max: span,
            fire: function () {
                if (fire) fire();
                for (let i = 0; i < zones.length; i++) bossAddZone(zones[i].x, zones[i].y, zones[i].r, zones[i].type, zones[i].life);
                sfx(abil === 'laser' ? 'laser' : 'hit');
            }
        });
    }
    // BOSS 技能预警图形：红色虚线范围 + 收拢的内环，临近发动时闪烁加快
    function drawBossWarns() {
        for (let i = 0; i < world.warns.length; i++) {
            const w = world.warns[i];
            const k = clamp(w.t / w.max, 0, 1);
            const x = scrX(w.x), y = scrY(w.y);
            const m = 2200 / viewZoom;
            if (x < -m || x > W + m || y < -m || y > PLAY_H + m) continue;
            const fast = 8 + 16 * (1 - k);
            const pulse = 0.5 + 0.5 * Math.sin(world.t * fast);
            const near = 0.55 + 0.35 * k;
            ctx.save();
            if (w.kind === 'circle') {
                const g = ctx.createRadialGradient(x, y, w.r * 0.2, x, y, w.r);
                g.addColorStop(0, hexA(w.col, 0.16 * near));
                g.addColorStop(1, hexA(w.col, 0));
                ctx.fillStyle = g;
                ctx.beginPath(); ctx.arc(x, y, w.r, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = hexA(w.col, 0.55 + 0.35 * pulse);
                ctx.lineWidth = 2.6;
                ctx.setLineDash([13, 10]);
                ctx.lineDashOffset = -world.t * 46;
                ctx.beginPath(); ctx.arc(x, y, w.r, 0, Math.PI * 2); ctx.stroke();
                ctx.setLineDash([]);
                ctx.strokeStyle = hexA(w.col, 0.85);
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(x, y, w.r * (1 - k) * 0.96 + w.r * 0.04, 0, Math.PI * 2); ctx.stroke();
            } else if (w.kind === 'ring') {
                ctx.strokeStyle = hexA(w.col, 0.6 + 0.3 * pulse);
                ctx.lineWidth = 5;
                ctx.setLineDash([26, 18]);
                ctx.lineDashOffset = world.t * 60;
                ctx.beginPath(); ctx.arc(x, y, w.r * (0.25 + 0.75 * (1 - k)), 0, Math.PI * 2); ctx.stroke();
                ctx.setLineDash([]);
                ctx.strokeStyle = hexA(w.col, 0.75);
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(x, y, w.r, 0, Math.PI * 2); ctx.stroke();
            } else if (w.kind === 'beam') {
                ctx.translate(x, y);
                ctx.rotate(w.ang);
                ctx.strokeStyle = hexA(w.col, 0.30 + 0.30 * pulse);
                ctx.lineWidth = 2.4;
                ctx.setLineDash([16, 13]);
                ctx.lineDashOffset = -world.t * 70;
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(w.len, 0); ctx.stroke();
                ctx.setLineDash([]);
                ctx.strokeStyle = hexA(w.col, 0.75);
                ctx.lineWidth = w.width * (0.3 + 0.7 * k);
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(w.len, 0); ctx.stroke();
            } else if (w.kind === 'spoke') {
                ctx.translate(x, y);
                ctx.rotate(w.ang);
                ctx.strokeStyle = hexA(w.col, 0.45 + 0.35 * pulse);
                ctx.lineWidth = 4;
                ctx.setLineDash([10, 16]);
                ctx.lineDashOffset = -world.t * 120;
                ctx.beginPath(); ctx.moveTo(24, 0); ctx.lineTo(w.len * (0.2 + 0.8 * k), 0); ctx.stroke();
                ctx.setLineDash([]);
                ctx.strokeStyle = hexA(w.col, 0.8);
                ctx.lineWidth = 2.4;
                ctx.beginPath(); ctx.arc(w.len * k, 0, 9, 0, Math.PI * 2); ctx.stroke();
            }
            ctx.restore();
        }
    }

    function bossUpdate(dt) {
        const b = world.boss;
        if (!b) return;
        if (world.bossDefeated) {
            // 击败后完全静止：不再位移、不再旋转，只让受击闪光消退
            if (b.flash > 0) b.flash -= dt;
            if (b.hurtT > 0) b.hurtT -= dt;
            return;
        }
        const p = world.player;
        const dx = dX(p.x, b.x), dy = dY(p.y, b.y);
        const d = Math.max(1, Math.hypot(dx, dy));
        b.ph += dt;
        // 保持中距离游走
        const want = 250;
        const moveDir = d < want - 40 ? -1 : (d > want + 60 ? 1 : 0);
        const wob = Math.sin(b.ph * 0.9) * 0.9;
        const mx = (dx / d), my = (dy / d);
        const px2 = -my, py2 = mx;
        const sp = b.speed;
        b.x = wrapVal(b.x + (mx * moveDir + px2 * wob) * sp * dt, MAP_W);
        b.y = wrapVal(b.y + (my * moveDir + py2 * wob) * sp * dt, MAP_H);
        b.ang += (angDiff(Math.atan2(dy, dx), b.ang)) * Math.min(1, dt * 3);
        b.cd -= dt;
        b.cd2 -= dt;
        if (b.flash > 0) b.flash -= dt;
        if (b.hurtT > 0) b.hurtT -= dt;

        const abil = world.planet.ability;
        // 普通弹幕
        if (b.cd <= 0) {
            b.cd = 1.5 - world.tier * 0.12;
            const base = Math.atan2(dy, dx);
            const n = 3 + world.tier;
            for (let i = 0; i < n; i++) {
                const a = base + (i - (n - 1) / 2) * 0.22;
                bossShootBullet(b.x, b.y, a, 190 + world.tier * 18, 6.5, world.planet.accent);
            }
        }
        if (b.cd2 <= 0) {
            b.cd2 = 5.2 - world.tier * 0.5;
            queueBossAbility(abil, b, p);
        }
    }

    function drawBoss() {
        const b = world.boss;
        if (!b) return;
        const x = scrX(b.x), y = scrY(b.y);
        const m = 140 / viewZoom;
        if (x < -m || x > W + m || y < -m || y > PLAY_H + m) return;
        const c = world.planet.bossCol;
        const t = world.t;
        ctx.save();
        ctx.translate(x, y);
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.ellipse(4, b.r * 0.8, b.r * 0.95, b.r * 0.34, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.rotate(b.ang);
        const flash = b.flash > 0;
        // 主体
        ctx.fillStyle = flash ? '#ffffff' : c.dark;
        ctx.beginPath();
        ctx.ellipse(0, 0, b.r * 1.05, b.r * 0.92, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = flash ? '#ffffff' : c.body;
        ctx.beginPath();
        ctx.ellipse(-b.r * 0.08, -b.r * 0.12, b.r * 0.78, b.r * 0.68, 0, 0, Math.PI * 2);
        ctx.fill();
        // 甲壳纹路
        ctx.strokeStyle = 'rgba(0,0,0,0.25)';
        ctx.lineWidth = 3;
        for (let i = 0; i < 3; i++) {
            ctx.beginPath();
            ctx.arc(-b.r * 0.1, -b.r * 0.1, b.r * (0.3 + i * 0.16), -0.8, 0.8);
            ctx.stroke();
        }
        // 眼睛
        ctx.fillStyle = flash ? '#ff5555' : c.eye;

        bc.fly = Math.max(0, bc.fly - dt);
        const k = 1 - bc.fly / bc.flyMax;
        const e = easeOutCubic(k);
        bc.gx = wrapVal(lerp(bc.fromX, bc.tx, e), MAP_W);
        bc.gy = wrapVal(lerp(bc.fromY, bc.ty, e), MAP_H);
        bc.z = Math.sin(Math.PI * k) * BEACON_HOP;
        bc.x = bc.gx;
        bc.y = bc.gy - bc.z;
        if (bc.fly <= 0) {
            bc.z = 0;
            bc.x = bc.tx; bc.y = bc.ty;
            sfx('drop');
            addFx({ kind: 'boom', x: bc.tx, y: bc.ty, life: 0.42, max: 0.42, r: 46, col: '#ffe066' });
            for (let i = 0; i < 7; i++) {
                addFx({ kind: 'spark', x: bc.tx + rand(-16, 16), y: bc.ty + rand(-6, 6), life: 0.45, max: 0.45, r: rand(2, 5), col: '#ffe9b0' });
            }
        }
    }
    if (!bc.held) {
        if (Math.hypot(dX(p.x, bc.x), dY(p.y, bc.y)) < PICKUP_BASE + p.pickupBonus) {
            bc.held = true;
            bc.vx = 0; bc.vy = 0; bc.wander = 0; bc.ox = 0; bc.oy = 0; bc.z = 0; bc.gx = bc.x; bc.gy = bc.y;
            sfx('item');
            addFx({ kind: 'spark', x: bc.x, y: bc.y, life: 0.6, max: 0.6, r: 44, col: '#ffe066' });
            addPopup(p.x, p.y - 44, '拾取闪光信标！', '#ffe066', true);
        }
    } else {
        // 漂浮在人物头部附近的随机位置：每 0.7~1.6 秒在头部四周重选一个偏移点，
        // 再以很快的插值追过去，因此始终紧贴人物、落点又是不固定的
        bc.wander -= dt;
        if (bc.wander <= 0) {
            bc.wander = rand(0.7, 1.6);
            const a = rand(0, Math.PI * 2);
            const rr = rand(14, BEACON_HEAD_R);
            bc.ox = Math.cos(a) * rr;
            bc.oy = Math.sin(a) * rr * 0.8;
        }
        const gx = wrapVal(p.x + bc.ox, MAP_W);
        const gy = wrapVal(p.y - BEACON_HEAD_OFF + bc.oy, MAP_H);
        const k = Math.min(1, dt * 9);
        bc.x = wrapVal(bc.x + dX(gx, bc.x) * k, MAP_W);
        bc.y = wrapVal(bc.y + dY(gy, bc.y) * k, MAP_H);
        bc.gx = bc.x; bc.gy = bc.y;
    }
    if (bc.silent) { bc.flash = Math.max(0, (bc.flash || 0) - dt * 4); return; }
    // 越靠近隐藏道具，闪烁与嘀嘀提示音越急促
    const sig = bc.held ? beaconSignal() : 0.25;
    const gap = bc.held ? lerp(BEACON_BEAT_FAR, BEACON_BEAT_NEAR, sig) : 1.5;
    bc.beat -= dt;
    if (bc.beat <= 0) {
        bc.beat = gap;
        bc.flash = 1;
        beaconBeep(sig);
    }
    if (bc.flash > 0) bc.flash = Math.max(0, bc.flash - dt * 5);
}
function tryDig() {
    const dg = world.dig;
    if (dg.locked || dg.cd > 0 || !world.beacon || !world.beacon.held) return;
    dg.cd = DIG_CD;
    dg.dust = DIG_FX;
    sfx('dig');
    for (let i = 0; i < 3; i++) {
        world.dust.push({ x: world.player.x, y: world.player.y, r: 10, life: DIG_FX * (0.78 + i * 0.11), max: DIG_FX, ph: Math.random() * 6 });
    }
    const hid = world.hidden;
    if (hid && Math.hypot(dX(world.player.x, hid.x), dY(world.player.y, hid.y)) <= DIG_HIT_R) resolveDig();
}
// 挖掘结算：80% 本星球特色装备（挖过就不再出现）/ 20% 本星球宝石 / 其余空手
// 注意：这里只负责判定并把东西弹到人物附近，暂不入库；等玩家真正拾取时才写存档。
function resolveDig() {
    const p = world.player;
    const pid = world.planet.id;
    const relic = RELIC_BY_ID[pid];
    const hx = world.hidden.x, hy = world.hidden.y;
    const canRelic = relic && !save.relics[pid];
    // 装备还能挖到时：80% 装备 / 20% 宝石；已经挖出过则只剩 20% 宝石，其余空手而归
    const kind = canRelic
        ? (Math.random() < 0.8 ? 'relic' : 'gem')
        : (Math.random() < 0.2 ? 'gem' : 'none');
    world.hidden = null;
    world.beacon = null;                 // 挖完即消失，信标不再继续提示
    world.dig.locked = true;
    if (kind === 'none') {
        world.found = null;
        addPopup(p.x, p.y - 58, '什么都没挖到…', '#c9d4e6', true);
        sfx('uiBack');
        return;
    }
    // 与信标同样的跳出效果：从埋藏点弹起，落到人物附近两个身位的随机地面点上
    const a = rand(0, Math.PI * 2);
    const rr = rand(FIND_HOP_R * 0.62, FIND_HOP_R);
    const tx = wrapVal(p.x + Math.cos(a) * rr, MAP_W);
    const ty = wrapVal(p.y + Math.sin(a) * rr, MAP_H);
    const item = kind === 'relic' ? relic.item : gemItemId(pid);
    const name = kind === 'relic' ? relic.name : gemName(pid);
    const col = kind === 'relic' ? relic.col : '#bfe8ff';
    world.found = {
        x: hx, y: hy, gx: hx, gy: hy, z: 0,
        fromX: hx, fromY: hy, tx: tx, ty: ty, fly: BEACON_FLY, flyMax: BEACON_FLY,
        item: item, name: name, kind: kind, pid: pid,
        life: 0, collect: false, collectT: 0
    };
    addPopup(p.x, p.y - 58, '挖到 ' + name + '！', col, true);
    addPopup(p.x, p.y - 26, '走过去拾取它，拾取后才入库', '#cfe4ff', true);
    sfx('found');
    addFx({ kind: 'boom', x: hx, y: hy, life: 0.8, max: 0.8, r: 80, col: col });
    for (let i = 0; i < 16; i++) addFx({ kind: 'spark', x: hx, y: hy, life: 0.8, max: 0.8, r: rand(3, 8), col: col });
}
// 真正拾取到的那一刻才入库并落盘
function storeFound(f) {
    if (f.kind === 'relic') {
        save.relics[f.pid] = 1;
        const ok = grantRelicItem(f.item);
        addPopup(world.player.x, world.player.y - 58,
            ok ? '已存入地球 · 装备仓库' : '装备仓库已满，装备遗失了', ok ? '#cfe4ff' : '#ff9b9b', true);
    } else {
        save.gems[f.pid] = (save.gems[f.pid] || 0) + 1;
        addPopup(world.player.x, world.player.y - 26, '已陈列于地球 · 展览柜', '#cfe4ff', true);
    }
    persist();
}
function updateDig(dt) {
    const dg = world.dig;
    if (dg.cd > 0) dg.cd = Math.max(0, dg.cd - dt);
    if (dg.dust > 0) dg.dust = Math.max(0, dg.dust - dt);
    for (let i = world.dust.length - 1; i >= 0; i--) {
        const d = world.dust[i];
        d.life -= dt;
        d.r += 46 * dt;
        if (d.life <= 0) world.dust.splice(i, 1);
    }
    updateFound(dt);
}
function foundColor(f) {
    if (f.kind === 'gem') return '#bfe8ff';
    const r = RELIC_BY_ITEM[f.item];
    return r ? r.col : '#ffffff';
}
function foundName(f) {
    if (f.name) return f.name;
    return ITEM_NAMES[f.item] || '战利品';
}
// 挖出来的东西会跳出埋藏点、落到人物附近，等角色走过去拾取；拾取完成才入库
function updateFound(dt) {
    const f = world.found;
    if (!f) return;
    const p = world.player;
    f.life += dt;
    if (f.fly > 0) {
        // 跳出动画：水平缓出、竖直抛物线，落地后才可以被拾取
        f.fly = Math.max(0, f.fly - dt);
        const k = 1 - f.fly / f.flyMax;
        const e = easeOutCubic(k);
        f.gx = wrapVal(lerp(f.fromX, f.tx, e), MAP_W);
        f.gy = wrapVal(lerp(f.fromY, f.ty, e), MAP_H);
        f.z = Math.sin(Math.PI * k) * BEACON_HOP;
        f.x = f.gx;
        f.y = f.gy - f.z;
        if (f.fly <= 0) {
            f.z = 0;
            f.x = f.tx; f.y = f.ty;
            sfx('drop');
            addFx({ kind: 'boom', x: f.tx, y: f.ty, life: 0.42, max: 0.42, r: 50, col: foundColor(f) });
            for (let i = 0; i < 7; i++) {
                addFx({ kind: 'spark', x: f.tx + rand(-18, 18), y: f.ty + rand(-6, 6), life: 0.45, max: 0.45, r: rand(2, 5), col: foundColor(f) });
            }
        }
        return;
    }
    if (f.collect) {
        // 被吸向人物，动画结束后才真正入库
        f.collectT = (f.collectT || 0) + dt;
        f.x = wrapVal(lerp(f.x, p.x, Math.min(1, dt * 7)), MAP_W);
        f.y = wrapVal(lerp(f.y, p.y - 22, Math.min(1, dt * 7)), MAP_H);
        if (f.collectT >= 0.42) {
            storeFound(f);
            world.found = null;
        }
        return;
    }
    if (Math.hypot(dX(p.x, f.x), dY(p.y, f.y)) < PICKUP_BASE + p.pickupBonus) {
        f.collect = true;
        f.collectT = 0;
        sfx('pickup');
        addFx({ kind: 'spark', x: f.x, y: f.y, life: 0.5, max: 0.5, r: 50, col: foundColor(f) });
        addPopup(p.x, p.y - 58, '拾取 ' + foundName(f), foundColor(f), true);
    }
}
// 挖掘的尘土特效：向外扩散并逐渐隐去，尘土散尽即代表冷却结束

// 信标本体：掉落时从 BOSS 处跳出，落地后顶部按信号强度闪烁，拾取后在人物周围缓慢随机飘动
function drawBeacon() {
    const bc = world.beacon;
    if (!bc) return;
    const x = scrX(bc.x), y = scrY(bc.y);
    const gx = scrX(bc.gx === undefined ? bc.x : bc.gx);
    const gy = scrY(bc.gy === undefined ? bc.y : bc.gy);
    const m = 220 / viewZoom;
    if (x < -m || x > W + m || y < -m || y > PLAY_H + m) return;
    const fl = bc.flash || 0;
    const z = bc.z || 0;
    const air = clamp(z / BEACON_HOP, 0, 1);
    const bob = bc.held ? Math.sin(bc.t * 3) * 3 : 0;
    const cy = y + bob;

    // 地面投影：跳得越高，影子越大越淡
    ctx.save();
    ctx.globalAlpha = 0.34 * (1 - air * 0.62);
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(gx + 2, gy + 4, 9 * (1 + air * 0.55), 3.4 * (1 + air * 0.45), 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 尚未拾取时，向外辐射的光芒把方向指给玩家
    if (!bc.held) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < 10; i++) {
            const a = bc.t * 0.55 + i * (Math.PI / 5);
            const len = 44 + 26 * fl + 10 * Math.sin(bc.t * 2 + i);
            const g = ctx.createLinearGradient(x, cy - 24, x + Math.cos(a) * len, cy - 24 + Math.sin(a) * len);
            g.addColorStop(0, 'rgba(255,232,160,' + (0.30 + 0.30 * fl) + ')');
            g.addColorStop(1, 'rgba(255,190,70,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.moveTo(x + Math.cos(a - 0.12) * 8, cy - 24 + Math.sin(a - 0.12) * 8);
            ctx.lineTo(x + Math.cos(a) * len, cy - 24 + Math.sin(a) * len);
            ctx.lineTo(x + Math.cos(a + 0.12) * 8, cy - 24 + Math.sin(a + 0.12) * 8);
            ctx.closePath();
            ctx.fill();
        }
        ctx.restore();
    }

    ctx.save();
    ctx.translate(x, cy);
    ctx.scale(1.25, 1.25);
    ctx.translate(-x, -cy);
    // 棒身
    const bg = ctx.createLinearGradient(x - 3, 0, x + 3, 0);
    bg.addColorStop(0, '#5d6b78');
    bg.addColorStop(0.45, '#e4ecf5');
    bg.addColorStop(1, '#48545f');
    ctx.fillStyle = bg;
    roundRectPath(x - 3, cy - 22, 6, 26, 2.6);
    ctx.fill();
    ctx.fillStyle = '#3d4854';
    roundRectPath(x - 6, cy + 2, 12, 4, 1.8);
    ctx.fill();
    // 灯头 + 辉光
    const g = ctx.createRadialGradient(x, cy - 24, 1, x, cy - 24, 30 + 18 * fl);
    g.addColorStop(0, 'rgba(255,255,240,' + (0.35 + 0.65 * fl) + ')');
    g.addColorStop(0.32, 'rgba(255,214,102,' + (0.22 + 0.5 * fl) + ')');
    g.addColorStop(1, 'rgba(255,180,60,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, cy - 24, 30 + 18 * fl, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,246,200,' + (0.35 + 0.65 * fl) + ')';
    ctx.beginPath();
    ctx.arc(x, cy - 24, 4.6 + 2 * fl, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    if (bc.held && !bc.silent) {
        const sig = beaconSignal();
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        setFont(11, 'bold');
        ctx.fillStyle = sig > 0.85 ? '#ffe066' : (sig > 0.4 ? '#bff0a8' : 'rgba(200,215,240,0.75)');
        ctx.fillText(sig > 0.85 ? '信号最强' : (sig > 0.4 ? '信号清晰' : '信号微弱'), x, cy - 46);
        ctx.restore();
    }
}
// 挖出来的东西：从埋藏点跳出落到人物附近，四周向外辐射光芒，等角色走近即可拾取
function drawFoundItem() {

    const fade = f.collect ? clamp(1 - (f.collectT || 0) / 0.42, 0, 1) : 1;
    const air = clamp((f.z || 0) / BEACON_HOP, 0, 1);

    // 向外辐射的光芒

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

        const a = t * 0.4 + i * (Math.PI / 6);

        const g = ctx.createLinearGradient(0, -30, Math.cos(a) * len, -30 + Math.sin(a) * len);
        g.addColorStop(0, hexA(col, 0.34));

        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a - 0.1) * 22, -30 + Math.sin(a - 0.1) * 22);
        ctx.lineTo(Math.cos(a) * len, -30 + Math.sin(a) * len);
        ctx.lineTo(Math.cos(a + 0.1) * 22, -30 + Math.sin(a + 0.1) * 22);
        ctx.closePath();
        ctx.fill();
    }
    ctx.restore();
    const g2 = ctx.createRadialGradient(0, -30, 3, 0, -30, 66);
    g2.addColorStop(0, hexA(col, 0.55));
    g2.addColorStop(0.45, hexA(col, 0.18));
    g2.addColorStop(1, hexA(col, 0));
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(0, -30, 66, 0, Math.PI * 2); ctx.fill();
    ctx.scale(S, S);
    ctx.fillStyle = 'rgba(12,20,34,0.86)';
    ctx.beginPath(); ctx.arc(0, -30, 30, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = hexA(col, 0.95);

    drawItemIcon(f.item, 0, -30, 24, 1);

    for (let i = 0; i < 4; i++) {
        const a = t * 2.2 + i * Math.PI / 2;

        ctx.fillStyle = hexA(col, al);
        ctx.beginPath();
        ctx.arc(Math.cos(a) * rr, -30 + Math.sin(a) * rr * 0.62, 3.2, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
}

function explodeBullet(bu) {

    function playerFire() {

        let target = null, bd = 1e9;

        for (let i = 0; i < pool.length; i++) {
            const e = pool[i];
            const dx = dX(e.x, p.x), dy = dY(e.y, by);
            const d = dx * dx + dy * dy;
            if (d < bd) { bd = d; target = e; }

        const range = FIRE_RANGE + p.fireBonus;
        if (!target || Math.sqrt(bd) > range) return;
        const tx = dX(target.x, p.x), ty = dY(target.y, p.y);
        const base = Math.atan2(ty, tx);
        // 朝向：目标大致在前方时才转身，避免边走边打出现"倒着走"
        const mv = moveVector();
if (!mv.x && !mv.y || (mv.x * tx + mv.y * ty) > 0) {
     p.dirIdx = dirFromVec(tx, ty);
            rememberFaceSide(p, p.dirIdx);
        }
        const n = p.bullets;
        const spread = n > 1 ? 0.14 : 0;

        const boomR = boomRadius(p.boomLv);
        for (let i = 0; i < n; i++) {
            const off = (i - (n - 1) / 2) * spread;
            world.bullets.push({
                x: wrapVal(p.x + Math.cos(base) * 26, MAP_W),
                y: wrapVal(p.y + Math.sin(base) * 26, MAP_H),
                vx: Math.cos(base + off) * 760, vy: Math.sin(base + off) * 760,
                dmg: dmg, life: 0.95, r: boom ? 7 : 5.5,
                boom: boom, boomR: boomR
            });
        }
        world.stats.weapons[p.weapon] = (world.stats.weapons[p.weapon] || 0) + n;
        p.muzz = 0.08;
        p.fireCd = p.fireCdMs / 1000;
        sfx('shoot');
        // 星球特色装备：跟着开火一起发动，打敌人，不做预警
        triggerRelics();
        const mx = wrapVal(p.x + Math.cos(base) * 30, MAP_W), my = wrapVal(p.y + Math.sin(base) * 30, MAP_H);
        addFx({ kind: 'muzzle', x: mx, y: my, ang: base, life: 0.09, max: 0.09, col: '#bff0ff' });
    }

    // ==================== 经验与等级 ====================
    // 升级所需经验：第 1→2 级 10 点，之后每升一级 +2（第 n→n+1 级 = 8 + 2n）
    const XP_STEP0 = 10, XP_STEP_INC = 2;
    function xpNeededFor(level) { return XP_STEP0 + (level - 1) * XP_STEP_INC; }   // level → level+1 所需
    // 累计到第 level 级的总经验 = Σ(xpNeededFor) ，在 INC=2 时化简为 (level-1)(level+8)
    function xpTotalFor(level) { return (level - 1) * (level + 8); }
    // (level-1)(level+8) = xp 的闭式反解
    function levelFromXp(xp) { return Math.max(1, Math.floor((-7 + Math.sqrt(81 + 4 * xp)) / 2)); }
    function gainXp(v) {
        world.xp += v;
        const newLevel = levelFromXp(world.xp);
        while (world.level < newLevel) {
            world.level++;
            world.score += 25;
            sfx('levelup');
            addPopup(world.player.x, world.player.y - 40, 'LEVEL UP! Lv.' + world.level, '#ffe066', true);
            // 5 的倍数等级改发装备补给箱；装备栏为空时退回道具补给箱
            dropPackage((world.level % 5 === 0 && weaponPool().length) ? 'weapon' : 'item');
            if (world.level === 10 && world.upgrades < 1) {
                world.upgrades = 1;
                world.tier = 1;
                addPopup(world.player.x, world.player.y - 70, '怪物强度提升！', '#ff9b6b', true);
            } else if (world.level === 20) {
                world.upgrades = 2;
                world.tier = 2;
                addPopup(world.player.x, world.player.y - 70, '怪物强化！BOSS 降临', '#ff6b6b', true);
                if (!world.boss && !world.planet.home) spawnBoss();
            }
        }
    }

    const DROP_HEIGHT = PLAY_H * 0.62 + 90;
    // 道具补给箱落点：以人物为中心、初始射程以外的环带内随机取点
    function itemDropTarget() {
        const p = world.player;
        const rIn = FIRE_RANGE + 34, rOut = FIRE_RANGE + 250;
        for (let k = 0; k < 12; k++) {
            const a = Math.random() * Math.PI * 2;
            const r = rand(rIn, rOut);
            const tx = wrapVal(p.x + Math.cos(a) * r, MAP_W);
            const ty = wrapVal(p.y + Math.sin(a) * r, MAP_H);
            if (Math.hypot(dX(tx, p.x), dY(ty, p.y)) >= FIRE_RANGE) return { x: tx, y: ty };
        }
        return { x: wrapVal(p.x + rIn, MAP_W), y: p.y };
    }
    // 装备补给箱落点：必定在当前画面之外，沿四边推出边界
    function weaponDropTarget(cam) {
        const side = randInt(0, 3);
        const out = rand(46, 230);
        let tx, ty;
        if (side === 0) { tx = cam.x + rand(-W * 0.5, W * 0.5); ty = cam.y - PLAY_H * 0.5 - out; }
        else if (side === 1) { tx = cam.x + rand(-W * 0.5, W * 0.5); ty = cam.y + PLAY_H * 0.5 + out; }
        else if (side === 2) { tx = cam.x - W * 0.5 - out; ty = cam.y + rand(-PLAY_H * 0.5, PLAY_H * 0.5); }
        else { tx = cam.x + W * 0.5 + out; ty = cam.y + rand(-PLAY_H * 0.5, PLAY_H * 0.5); }
        return { x: wrapVal(tx, MAP_W), y: wrapVal(ty, MAP_H) };
    }
    // kind: 'item' 道具补给箱（道具栏 + 固定栏）／'weapon' 装备补给箱（装备栏）
    function dropPackage(kind) {
        const cam = world.cam;
        const isWeapon = kind === 'weapon';
        const tgt = isWeapon ? weaponDropTarget(cam) : itemDropTarget();
        const tx = tgt.x, ty = tgt.y;
        // 从屏幕最上方下落
        const startY = wrapVal(ty - DROP_HEIGHT, MAP_H);
        let pool = isWeapon ? weaponPool() : itemPool();
        if (!pool.length) pool = ITEMS.filter((it) => !RELIC_BY_ITEM[it.id]);
        const picks = [];
        for (let i = 0; i < 3 && pool.length; i++) {
            const k = randInt(0, pool.length - 1);
            picks.push(pool.splice(k, 1)[0].id);
        }
        world.packages.push({
            x: tx, y: startY, tx: tx, ty: ty, tx0: DROP_HEIGHT,
            vy: 40, items: picks, kind: isWeapon ? 'weapon' : 'item', landed: false, ph: Math.random() * 6
        });
        sfx('drop');
    }

    // ==================== 玩法更新 ====================
    function updatePlay(dt) {
        const p = world.player;
        world.t += dt;
        if (world.launch) {
            // 取舍阶段：仅播放动画，场景保持原样
            updateLaunch(dt);
            return;
        }
        if (world.landing) {
            // 着陆阶段：仅播放动画，与正式游戏场景无缝衔接
            updateLanding(dt);
            for (let i = world.fx.length - 1; i >= 0; i--) {
                const f = world.fx[i];
                f.life -= dt;
                if (f.kind === 'spark') {
                    f.x = wrapVal(f.x + (f.vx || 0) * dt, MAP_W);
                    f.y = wrapVal(f.y + (f.vy || 0) * dt, MAP_H);
                }
                if (f.life <= 0) world.fx.splice(i, 1);
            }
            return;
        }
        if (!world.over) world.runTime += dt;
        const cam = world.cam;
        const planet = world.planet;

        // 失败锁定：人物不可控、场景静止、画面完全定格
        if (world.over) { cam.x = p.x; cam.y = p.y; return; }

        // 地球基地的补给航天飞船：靠近按 J/A 打开战备配置，菜单打开时屏蔽人物操作
        if (world.supply) {
            if (world.inv.on) {
                updateInvMenu(dt);
                return;
            }
            world.supplyNear = Math.hypot(dX(world.supply.x, p.x), dY(world.supply.y, p.y)) < SUPPLY_R;
            if (world.supplyNear && actPress()) { openInvMenu(); return; }
        }

        // 区域减速/伤害
        let slow = 1;
        let dmgT = 0;
        for (let i = 0; i < world.zones.length; i++) {
            const z = world.zones[i];
            const dz = Math.hypot(dX(z.x, p.x), dY(z.y, p.y));
            if (dz < z.r) {
                if (z.type === 'slow') slow = 0.32;
                else dmgT += dt;
            }
        }
        world.slowFactor = slow;
        if (dmgT > 0) {
            p.zoneTick = (p.zoneTick || 0) + dmgT;
            if (p.zoneTick >= 0.9) { p.zoneTick = 0; damagePlayer(1); }
        }

        // 移动
        const mv = moveVector();
        p.moving = false;
        if (p.rollT > 0) {
            p.rollT -= dt;
            p.rollAngle += dt * 13;
            p.x = wrapVal(p.x + p.rollVX * dt, MAP_W);
            p.y = wrapVal(p.y + p.rollVY * dt, MAP_H);
        } else if (mv.x || mv.y) {
            const sp = BASE_SPEED * p.speedMul * slow;
            p.x = wrapVal(p.x + mv.x * sp * dt, MAP_W);
            p.y = wrapVal(p.y + mv.y * sp * dt, MAP_H);
            p.dirIdx = dirFromVec(mv.x, mv.y);
            p.moveDirIdx = dirFromVec(mv.x, mv.y);
            rememberFaceSide(p, p.dirIdx);
            p.walkPhase += dt * (8.5 * sp / BASE_SPEED);
            p.moving = true;
        }
        if (p.rollCd > 0) p.rollCd -= dt;
        if (p.invuln > 0) p.invuln -= dt;
        if (p.hitFlash > 0) p.hitFlash -= dt;
        if (p.muzz > 0) p.muzz -= dt;

        // 自动开火
        p.fireCd -= dt;
        if (!world.over && !world.bossDefeated && !planet.home && p.fireCd <= 0) playerFire();

        // 道具环
        // 道具三选一：左/右轮换，静止时不动；10 秒未选则自动结算头顶
        if (world.pkg) {
            updatePkgTimer(dt);
            if (world.pkg) {
                if (menuEdge('left')) rotatePkg(-1);
                if (menuEdge('right')) rotatePkg(1);
            }
        }
        if (actPress()) playerAction();
        if (rollPress()) tryRoll();

        // 刷新敌人
        if (!planet.home && !world.bossDefeated && !world.over) {
            world.spawnTimer -= dt;
            if (world.spawnTimer <= 0) {
                world.spawnTimer = Math.max(0.20, 0.80 - world.tier * 0.24) * rand(0.7, 1.25);
                // BOSS 在场时压制杂兵数量，给玩家留出躲避空间
                const bossOn = !!(world.boss && !world.bossDefeated);
                const maxN = Math.round((55 + world.tier * 18) * (bossOn ? 0.5 : 1));
                // 单次刷怪数量：等级越高一次刷得越多
                let n = 1;
                if (Math.random() < 0.25 + world.level * 0.03) n++;
                if (world.level >= 8 && Math.random() < 0.16 + world.tier * 0.08) n++;
                n = Math.max(1, Math.round(n * (bossOn ? 0.6 : 1)));
                for (let s = 0; s < n; s++) {
                    if (world.enemies.length < maxN) spawnEnemy();
                }
            }
        }

        // 敌人
        const dodgeR = DODGE_BASE + p.dodge;
        for (let i = world.enemies.length - 1; i >= 0; i--) {
            const e = world.enemies[i];
            if (e.flash > 0) e.flash -= dt;
            const dx = dX(p.x, e.x), dy = dY(p.y, e.y);
            const d = Math.max(1, Math.hypot(dx, dy));
            const wob = Math.sin(world.t * 2.4 + e.ph) * 0.35;
            const nx = dx / d, ny = dy / d;
            const eslow = relicSlowAt(e);      // 水星装备的水洼会拖慢范围内的敌人
            e.x = wrapVal(e.x + (nx + -ny * wob) * e.speed * dt * eslow, MAP_W);
            e.y = wrapVal(e.y + (ny + nx * wob) * e.speed * dt * eslow, MAP_H);
            e.ang = Math.atan2(dy, dx);
            if (e.kind === 'ranged') {
                e.cd -= dt;
                // 场上还有自己的子弹在飞（未消失）时不发射第二发
                const busy = world.enemyBullets.some(b => b.owner === e);
                if (e.cd <= 0 && !busy && d < 430) {
                    e.cd = rand(3.2, 5.0);
                    const a = Math.atan2(dy, dx) + rand(-0.12, 0.12);
                    world.enemyBullets.push({
                        x: wrapVal(e.x + Math.cos(a) * 18, MAP_W), y: wrapVal(e.y + Math.sin(a) * 18, MAP_H),
                        vx: Math.cos(a) * 230, vy: Math.sin(a) * 230, r: 4.5, life: 3.4, col: planet.accent, homing: 0, ph: 0,
                        owner: e
                    });
                }
            }
            if (d < e.r + CHAR_S * 0.40) {
                e.x = wrapVal(e.x - nx * 46, MAP_W);
                e.y = wrapVal(e.y - ny * 46, MAP_H);
                damagePlayer(1, e.x, e.y);
                killEnemy(e, i, false);
            }
            // 闪避距离：顶回安全圈外，圈内的敌人无法贴身
            if (dodgeR > 0) {
                const ddx = dX(p.x, e.x), ddy = dY(p.y, e.y);
                const dd2 = Math.hypot(ddx, ddy);
                const keep = dodgeR + e.r;
                if (dd2 < keep && dd2 > 0.01) {
                    e.x = wrapVal(e.x + ddx / dd2 * (keep - dd2), MAP_W);
                    e.y = wrapVal(e.y + ddy / dd2 * (keep - dd2), MAP_H);
                    e.ang = Math.atan2(ddy, ddx);
                }
            }
            // 分离力：避免所有怪挤成一团
            for (let k = 0; k < world.enemies.length; k++) {
                const o = world.enemies[k];
                if (o === e) continue;
                const ox = dX(o.x, e.x), oy = dY(o.y, e.y);
                const dd = Math.hypot(ox, oy);
                if (dd < e.r + o.r && dd > 0.01) {
                    const push = (1 - dd / (e.r + o.r)) * 40 * dt;
                    e.x = wrapVal(e.x - ox / dd * push, MAP_W);
                    e.y = wrapVal(e.y - oy / dd * push, MAP_H);
                }
            }
        }

        // BOSS
        if (world.boss) bossUpdate(dt);
        if (world.boss && !world.bossDefeated) {
            const b = world.boss;
            const d = Math.hypot(dX(b.x, p.x), dY(b.y, p.y));
            if (d < b.r + CHAR_S * 0.45) damagePlayer(1, b.x, b.y);
        }

        // 玩家子弹
        for (let i = world.bullets.length - 1; i >= 0; i--) {
            const bu = world.bullets[i];
            bu.life -= dt;
            if (bu.homing > 0) {
                // 追踪冰弹（海王星装备）：持续朝最近的敌人修正方向
                let t2 = null, bd2 = 1e9;
                for (let j = 0; j < world.enemies.length; j++) {
                    const e = world.enemies[j];
                    const dd = dX(e.x, bu.x) * dX(e.x, bu.x) + dY(e.y, bu.y) * dY(e.y, bu.y);
                    if (dd < bd2) { bd2 = dd; t2 = e; }
                }
                if (!t2 && world.boss && !world.bossDefeated) t2 = world.boss;
                if (t2) {
                    const cur = Math.atan2(bu.vy, bu.vx);
                    const ta = Math.atan2(dY(t2.y, bu.y), dX(t2.x, bu.x));
                    const na = cur + clamp(angDiff(ta, cur), -bu.homing * dt, bu.homing * dt);
                    const sp = Math.hypot(bu.vx, bu.vy);
                    bu.vx = Math.cos(na) * sp; bu.vy = Math.sin(na) * sp;
                }
            }
            bu.x = wrapVal(bu.x + bu.vx * dt, MAP_W);
            bu.y = wrapVal(bu.y + bu.vy * dt, MAP_H);
            let hitSomething = false;
            for (let j = world.enemies.length - 1; j >= 0; j--) {
                const e = world.enemies[j];
                if (Math.hypot(dX(e.x, bu.x), dY(e.y, bu.y)) < e.r + bu.r) {
                    if (bu.boom) explodeBullet(bu);
                    else {
                        e.hp -= bu.dmg; e.flash = 0.12; sfx('hit');
                        if (e.hp <= 0) killEnemy(e, j);
                    }
                    // 地面类特色装备在命中位置发动
                    triggerGroundRelic(bu.x, bu.y);
                    hitSomething = true;
                    break;
                }
            }
            if (!hitSomething && world.boss && !world.bossDefeated) {
                const b = world.boss;
                if (Math.hypot(dX(b.x, bu.x), dY(b.y, bu.y)) < b.r + bu.r) {
                    if (bu.boom) explodeBullet(bu);
                    else {
                        b.hp -= bu.dmg; b.flash = 0.1; b.hurtT = 0.12; sfx('hit');
                    }
                    hitSomething = true;
                }
            }
            if (hitSomething || bu.life <= 0) world.bullets.splice(i, 1);
        }

        if (world.boss && !world.bossDefeated && world.boss.hp <= 0) {
            const b = world.boss;
            world.bossDefeated = true;
            // BOSS 一死，还没放完的技能与场上残留的攻击全部作废：
            // 预警队列倒计时不受 bossUpdate 的提前 return 影响，不清的话会照常发动
            world.pend.length = 0;
            world.warns.length = 0;
            world.zones.length = 0;
            world.blades.length = 0;
            world.beams.length = 0;
            world.marks.length = 0;
            world.score += 800;
            addFx({ kind: 'boom', x: b.x, y: b.y, life: 1.2, max: 1.2, r: 200, col: planet.accent });
            addFx({ kind: 'boom', x: b.x, y: b.y, life: 1.6, max: 1.6, r: 300, col: '#ffffff' });
            for (let i = 0; i < 8; i++) {
                addFx({ kind: 'boom', x: wrapVal(b.x + rand(-90, 90), MAP_W), y: wrapVal(b.y + rand(-90, 90), MAP_H), life: rand(0.6, 1.1), max: 1.1, r: rand(60, 130), col: planet.accent });
            }
            sfx('explode');
            sfx('clear');
            addPopup(scrX(b.x), scrY(b.y) - 60, 'BOSS 已被击败！', '#ffe066');
            // 清场
            for (let i = world.enemies.length - 1; i >= 0; i--) killEnemy(world.enemies[i], i);
            world.enemyBullets.length = 0;
            for (let i = 0; i < 14; i++) {
                world.orbs.push({ x: wrapVal(b.x + rand(-120, 120), MAP_W), y: wrapVal(b.y + rand(-120, 120), MAP_H), val: 2, ph: Math.random() * 6, homing: false, age: 0 });
            }
            spawnBossSpoils(b.x, b.y, b.r);
            recordRun(true);
        }

        // 敌弹
        for (let i = world.enemyBullets.length - 1; i >= 0; i--) {
            const eb = world.enemyBullets[i];
            eb.life -= dt;
            if (eb.homing > 0) {
                const dx = dX(p.x, eb.x), dy = dY(p.y, eb.y);
                const d = Math.max(1, Math.hypot(dx, dy));
                const cur = Math.atan2(eb.vy, eb.vx);
                const ta = Math.atan2(dy, dx);
                const na = cur + clamp(angDiff(ta, cur), -eb.homing * dt, eb.homing * dt);
                const sp = Math.hypot(eb.vx, eb.vy);
                eb.vx = Math.cos(na) * sp; eb.vy = Math.sin(na) * sp;
            }
            eb.x = wrapVal(eb.x + eb.vx * dt, MAP_W);
            eb.y = wrapVal(eb.y + eb.vy * dt, MAP_H);
            if (Math.hypot(dX(eb.x, p.x), dY(eb.y, p.y)) < eb.r + CHAR_S * 0.36) {
                damagePlayer(1, eb.x, eb.y);
                world.enemyBullets.splice(i, 1);
                continue;
            }
            if (eb.life <= 0) world.enemyBullets.splice(i, 1);
        }

        // 旋刃
        for (let i = world.blades.length - 1; i >= 0; i--) {
            const bl = world.blades[i];
            bl.life -= dt;
            bl.ang += bl.spin * dt;
            if (bl.hitT > 0) bl.hitT -= dt;
            for (let k = 0; k < bl.n; k++) {
                const a = bl.ang + k * Math.PI;
                const bx = wrapVal(bl.x + Math.cos(a) * bl.r, MAP_W);
                const by = wrapVal(bl.y + Math.sin(a) * bl.r * 0.85, MAP_H);
                if (Math.hypot(dX(bx, p.x), dY(by, p.y)) < 34 && bl.hitT <= 0) {
                    bl.hitT = 1.0;
                    damagePlayer(1, bx, by);
                }
            }
            if (bl.life <= 0) world.blades.splice(i, 1);
        }

        // 激光
        for (let i = world.beams.length - 1; i >= 0; i--) {
            const bm = world.beams[i];
            if (bm.warn > 0) bm.warn -= dt;
            else {
                bm.life -= dt;
                if (bm.hitT > 0) bm.hitT -= dt;
                const dx = dX(p.x, bm.x), dy = dY(p.y, bm.y);
                const proj = dx * Math.cos(bm.ang) + dy * Math.sin(bm.ang);
                const perp = Math.abs(-dx * Math.sin(bm.ang) + dy * Math.cos(bm.ang));
                if (proj > 0 && proj < bm.len && perp < bm.width * 0.5 + 14 && bm.hitT <= 0) {
                    bm.hitT = 1.2;
                    damagePlayer(1, bm.x, bm.y);
                }
            }
            if (bm.warn <= 0 && bm.life <= 0) world.beams.splice(i, 1);
        }

        // BOSS 技能预警倒计时：走完才真正发动攻击
        for (let i = world.pend.length - 1; i >= 0; i--) {
            const pe = world.pend[i];
            pe.t -= dt;
            if (pe.t <= 0) { world.pend.splice(i, 1); pe.fire(); }
        }
        for (let i = world.warns.length - 1; i >= 0; i--) {
            world.warns[i].t -= dt;
            if (world.warns[i].t <= 0) world.warns.splice(i, 1);
        }
        // 星球特色装备特效（只作用于敌人，无需预警）
        updateRelicFx(dt);
        // 信标与挖掘
        updateBeacon(dt);
        updateDig(dt);

        // 区域
        for (let i = world.zones.length - 1; i >= 0; i--) {
            const z = world.zones[i];
            z.life -= dt;
            if (z.life <= 0) world.zones.splice(i, 1);
        }
        // 标记（雷击 / 脉冲）
        for (let i = world.marks.length - 1; i >= 0; i--) {
            const mk = world.marks[i];
            mk.life -= dt;
            if (mk.kind === 'pulse') mk.r += mk.speed * dt;
            if (mk.kind === 'strike' && mk.life <= 0) {
                const d = Math.hypot(dX(mk.x, p.x), dY(mk.y, p.y));
                addFx({ kind: 'boom', x: mk.x, y: mk.y, life: 0.5, max: 0.5, r: mk.r, col: '#ffe066' });
                sfx('explode');
                if (d < mk.r) damagePlayer(1, mk.x, mk.y);
                world.marks.splice(i, 1);
                continue;
            }
            if (mk.kind === 'pulse' && mk.life <= 0) {
                addFx({ kind: 'boom', x: mk.x, y: mk.y, life: 0.4, max: 0.4, r: 90, col: '#c58cff' });
                const d = Math.hypot(dX(mk.x, p.x), dY(mk.y, p.y));
                if (d < mk.r) damagePlayer(1, mk.x, mk.y);
                world.marks.splice(i, 1);
                continue;
            }
            if (mk.life <= 0) world.marks.splice(i, 1);
        }

        // 经验球：必须先进入拾取圈才会被吸引；一旦被吸引必定拾取到
        // BOSS 击败后停止拾取，场上光点冻结为纯装饰
        // 未被拾取的经验球最多停留 ORB_LIFE 秒，超时淡出消失，避免光点无限堆积
        const pickR = PICKUP_BASE + p.pickupBonus;
        // 判定略宽于绘制的圈，抵消取整误差并让圈边缘的手感更跟手
        const lockR = pickR * PICKUP_TOL;
        const oby = playerBodyY();        // 身形中心（与范围圈一致）
        for (let i = world.orbs.length - 1; i >= 0; i--) {
            const o = world.orbs[i];
            o.age = (o.age || 0) + dt;
            if (!o.homing && o.age >= ORB_LIFE) {
                addFx({ kind: 'spark', x: o.x, y: o.y, life: 0.3, max: 0.3, r: 10, col: '#9bf6b0' });
                world.orbs.splice(i, 1);
                continue;
            }
            if (world.bossDefeated) continue;   // 场上光点冻结为纯装饰（但仍会超时消失）
            let dx = dX(p.x, o.x), dy = dY(oby, o.y);
            let d = Math.hypot(dx, dy);
            if (!o.homing) {
                // 未拾取的经验光点只在拾取圈内被吸引，超时则淡出
                if (d > lockR) continue;
                o.homing = true;
            }
            if (d <= 6 || d <= dt * ORB_HOMING_SPEED) {
                gainXp(o.val);
                world.score += 2;
                sfx('pickup');
                addFx({ kind: 'spark', x: o.x, y: o.y, life: 0.25, max: 0.25, r: 12, col: '#9bf6b0' });
                world.orbs.splice(i, 1);
                continue;
            }
            // 锁定后匀速直取玩家，速度高于玩家最大移动速度 => 必定拾取
            o.x = wrapVal(o.x + dx / d * ORB_HOMING_SPEED * dt, MAP_W);
            o.y = wrapVal(o.y + dy / d * ORB_HOMING_SPEED * dt, MAP_H);
        }

        // 补给箱
        for (let i = world.packages.length - 1; i >= 0; i--) {
            const pk = world.packages[i];
            if (!pk.landed) {
                pk.vy += 760 * dt;
                const step = pk.vy * dt;
                const remain = dY(pk.ty, pk.y);   // 剩余下落距离
                if (remain <= 0 || step >= remain) {
                    pk.y = pk.ty;
                    pk.vy = 0;
                    pk.landed = true;
                    addFx({ kind: 'boom', x: pk.x, y: pk.y, life: 0.45, max: 0.45, r: 66, col: '#ffffff' });
                    sfx('drop');
                } else {
                    pk.y = wrapVal(pk.y + step, MAP_H);
                }
            }
            if (Math.hypot(dX(pk.x, p.x), dY(pk.y, p.y)) < CHAR_S * 0.7) {
                // 未选择状态下又拾取新箱：当前头顶的直接算作已选，再开启新的一轮
                if (world.pkg && world.pkg.length) confirmPkg(true);
                world.pkgQueue.push(pk.items.slice());
                openPkg(world.pkgQueue.shift());
                const wBox = pk.kind === 'weapon';
                addFx({ kind: 'spark', x: pk.x, y: pk.y, life: 0.5, max: 0.5, r: 40, col: wBox ? '#d0a0ff' : '#ffe066' });
                addPopup(pk.x, pk.y - 30, (wBox ? '拾取装备补给箱！' : '拾取道具补给箱！') + PKG_TIME + ' 秒内按 J 选择', wBox ? '#e6c8ff' : '#ffe066');
                sfx('item');
                world.packages.splice(i, 1);
            }
        }

        // 特效 / 飘字
        updateWorldFx(dt);

        // 摄像机
        cam.x = p.x; cam.y = p.y;
    }
    // 特效与飘字的衰减
    function updateWorldFx(dt) {
        const p = world.player;
        for (let i = world.fx.length - 1; i >= 0; i--) {
            const f = world.fx[i];
            f.life -= dt;
            if (f.kind === 'spark') {
                f.x = wrapVal(f.x + (f.vx || 0) * dt, MAP_W);
                f.y = wrapVal(f.y + (f.vy || 0) * dt, MAP_H);
            }
            if (f.life <= 0) world.fx.splice(i, 1);
        }
        for (let i = world.popups.length - 1; i >= 0; i--) {
            const pp = world.popups[i];
            pp.life -= dt;
            if (pp.follow) { pp.x = p.x; pp.y = p.y; }
            if (pp.life <= 0) world.popups.splice(i, 1);
        }
    }

    // J：确认（登船 / 选用道具 / 挖掘）；K：翻滚
    function playerAction() {
        const p = world.player;
        if (world.over) return;
        if (world.planet.home || world.bossDefeated) {
            const dr = Math.hypot(dX(world.rocket.x, p.x), dY(world.rocket.y, p.y));
            if (dr < 92) { launchSequence(); return; }
        }
        handleAction();
        // 拾取信标之后，按确认键尝试挖掘
        if (world.beacon && world.beacon.held) tryDig();
    }

    function recordRun(cleared) {
        if (world.recorded) return;
        world.recorded = true;
        const id = world.planet.id;
        const rec = save.planets[id];
        rec.runs++;
        rec.kills += world.kills;
        rec.totalScore += world.score;
        rec.bestScore = Math.max(rec.bestScore, world.score);
        rec.bestLevel = Math.max(rec.bestLevel, world.level);
        rec.totalTime += world.runTime;
        if (cleared) {
            rec.clears++;
            if (world.runTime > 0 && (rec.bestTime === 0 || world.runTime < rec.bestTime)) rec.bestTime = world.runTime;
        }
        for (const k in world.stats.weapons) rec.weapons[k] = (rec.weapons[k] || 0) + world.stats.weapons[k];
        for (const k in world.stats.items) rec.items[k] = (rec.items[k] || 0) + world.stats.items[k];
        save.totalScore += world.score;
        save.totalKills += world.kills;
        persist();
    }

// ==================== 玩法绘制 ====================
    function drawRocketAt(x, y, ang, t, flame, scale) {
        const S = scale || 1;
        ctx.save();

        ctx.rotate(ang);
        ctx.scale(S, S);
        // 地面投影
        ctx.save();

        const sg = ctx.createRadialGradient(0, 46, 4, 0, 48, 58);

        sg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = sg;
        ctx.beginPath();
        ctx.ellipse(0, 46, 52, 17, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        // 尾焰
        if (flame > 0) {
            const fl = 34 + 30 * flame + 14 * Math.sin(t * 22);
            const fg = ctx.createRadialGradient(0, 44, 2, 0, 46, fl * 1.1);
            fg.addColorStop(0, 'rgba(255,220,150,0.22)');
            fg.addColorStop(1, 'rgba(255,90,20,0)');
            ctx.fillStyle = fg;
            ctx.beginPath();
            ctx.arc(0, 46, fl * 1.1, 0, Math.PI * 2);
            ctx.fill();
            const g = ctx.createLinearGradient(0, 40, 0, 40 + fl);
            g.addColorStop(0, 'rgba(255,248,214,0.95)');
            g.addColorStop(0.3, 'rgba(255,190,86,0.72)');

            g.addColorStop(1, 'rgba(255,60,20,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.moveTo(-20, 40);
            ctx.quadraticCurveTo(-13, 40 + fl * 1.02, 0, 40 + fl * 1.32);
            ctx.quadraticCurveTo(13, 40 + fl * 1.02, 20, 40);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,240,0.5)';
            ctx.beginPath();
            ctx.moveTo(-7, 40);
            ctx.quadraticCurveTo(0, 40 + fl * 0.62, 7, 40);
            ctx.closePath();
            ctx.fill();
        }

            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(s * 13, 20);
            ctx.lineTo(s * 42, 52);
            ctx.stroke();
            ctx.strokeStyle = '#aab4c4';
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.moveTo(s * 13, 20);
            ctx.lineTo(s * 42, 52);
            ctx.stroke();
            ctx.strokeStyle = '#8b96a8';
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.moveTo(s * 26, 36);
            ctx.lineTo(s * 40, 33);
            ctx.stroke();
            ctx.fillStyle = '#5e6878';
            ctx.beginPath();
            ctx.ellipse(s * 44, 55, 11, 5, s * 0.28, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(215,232,255,0.28)';
            ctx.beginPath();
            ctx.ellipse(s * 44, 53, 8, 2.6, s * 0.28, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.lineCap = 'butt';
        // 尾翼
        for (let s = -1; s <= 1; s += 2) {
            const fg = ctx.createLinearGradient(s * 13, 0, s * 46, 46);
            fg.addColorStop(0, '#e8634f');
            fg.addColorStop(1, '#9c2b24');
            ctx.fillStyle = fg;
            ctx.beginPath();
            ctx.moveTo(s * 13, 2);
            ctx.lineTo(s * 46, 38);

            ctx.lineTo(s * 13, 33);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = 'rgba(30,10,10,0.35)';
            ctx.lineWidth = 1;
            ctx.stroke();

        // 机身

        g2.addColorStop(0.16, '#bcc5d3');
        g2.addColorStop(0.4, '#ffffff');
        g2.addColorStop(0.66, '#dae0ea');
        g2.addColorStop(1, '#74808f');
        ctx.fillStyle = g2;
        ctx.beginPath();
        ctx.moveTo(0, -68);
        ctx.bezierCurveTo(15, -62, 25, -46, 27, -27);
        ctx.lineTo(27, 22);
        ctx.quadraticCurveTo(27, 33, 17, 33);
        ctx.lineTo(-17, 33);
        ctx.quadraticCurveTo(-27, 33, -27, 22);
        ctx.lineTo(-27, -27);
        ctx.bezierCurveTo(-25, -46, -15, -62, 0, -68);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(24,32,48,0.45)';
        ctx.lineWidth = 1.3;
        ctx.stroke();
        // 面板线

        ctx.fillRect(-27, 16, 54, 2);
        // 驾驶舱
        const cg = ctx.createRadialGradient(-4, -32, 2, 0, -25, 17);

        cg.addColorStop(0.45, '#3a7fb8');

        ctx.strokeStyle = 'rgba(228,244,255,0.8)';
        ctx.lineWidth = 1.8;
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath();
        ctx.ellipse(-5, -30, 3.4, 5.8, -0.5, 0, Math.PI * 2);
        ctx.fill();
        // 舷窗
        ctx.fillStyle = '#2f4f7a';
        ctx.strokeStyle = 'rgba(200,225,255,0.55)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(-14, -2, 5, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
        ctx.beginPath();
        ctx.arc(14, -2, 5, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
        // 引擎喷口
        ctx.fillStyle = '#525d6e';
        ctx.beginPath();
        ctx.moveTo(-14, 30); ctx.lineTo(14, 30); ctx.lineTo(18, 41); ctx.lineTo(-18, 41);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(20,26,38,0.6)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = '#2b3242';
        ctx.beginPath();
        ctx.ellipse(0, 41, 18, 5.5, 0, 0, Math.PI * 2);
        ctx.fill();
        // 航行灯：左红右绿，亮起时带对应颜色光晕
        const navOn = (t % 1.2) < 0.62;
        for (let s = -1; s <= 1; s += 2) {
            const col = s < 0 ? '255,96,96' : '120,255,170';
            const lx = s * 30, ly = -12;
            if (navOn) {
                const lg = ctx.createRadialGradient(lx, ly, 0.5, lx, ly, 10);
                lg.addColorStop(0, 'rgba(' + col + ',0.9)');
                lg.addColorStop(0.28, 'rgba(' + col + ',0.42)');
                lg.addColorStop(1, 'rgba(' + col + ',0)');
                ctx.fillStyle = lg;
                ctx.beginPath();
                ctx.arc(lx, ly, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(' + col + ',0.5)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(lx - 7, ly); ctx.lineTo(lx + 7, ly);
                ctx.moveTo(lx, ly - 7); ctx.lineTo(lx, ly + 7);
                ctx.stroke();
            }
            ctx.fillStyle = 'rgba(' + col + ',' + (navOn ? 0.95 : 0.3) + ')';
            ctx.beginPath();
            ctx.arc(lx, ly, 2.8, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    function drawZones() {
        for (let i = 0; i < world.zones.length; i++) {
            const z = world.zones[i];
            const x = scrX(z.x), y = scrY(z.y);
            const m = 220 / viewZoom;
            if (x < -m || x > W + m || y < -m || y > PLAY_H + m) continue;
            const fade = Math.min(1, z.life);
            const pulse = 0.5 + 0.5 * Math.sin(world.t * 3 + z.ph);
            ctx.save();
            ctx.translate(x, y);
            if (z.type === 'slow') {
                const g = ctx.createRadialGradient(0, 0, z.r * 0.2, 0, 0, z.r);
                g.addColorStop(0, 'rgba(120,210,255,' + (0.42 * fade) + ')');
                g.addColorStop(0.75, 'rgba(60,150,230,' + (0.30 * fade) + ')');
                g.addColorStop(1, 'rgba(40,120,200,0)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.ellipse(0, 0, z.r, z.r * 0.78, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(190,240,255,' + (0.5 * fade) + ')';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(0, 0, z.r * 0.9, z.r * 0.7, 0, 0, Math.PI * 2);
                ctx.stroke();
            } else if (z.type === 'fire') {
                for (let k = 0; k < 5; k++) {
                    const a = z.ph + k * 1.25;
                    const rr = z.r * (0.35 + 0.5 * ((k * 0.37 + pulse) % 1));
                    const fh = 26 + 22 * Math.sin(world.t * 9 + k + z.ph);
                    const g = ctx.createRadialGradient(Math.cos(a) * rr * 0.5, Math.sin(a) * rr * 0.35, 2, Math.cos(a) * rr * 0.5, Math.sin(a) * rr * 0.35, fh);
                    g.addColorStop(0, 'rgba(255,240,150,' + (0.75 * fade) + ')');
                    g.addColorStop(0.4, 'rgba(255,140,40,' + (0.55 * fade) + ')');
                    g.addColorStop(1, 'rgba(200,40,10,0)');
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.ellipse(Math.cos(a) * rr * 0.5, Math.sin(a) * rr * 0.35, fh * 0.6, fh, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else { // acid
                const g = ctx.createRadialGradient(0, 0, 2, 0, 0, z.r);
                g.addColorStop(0, 'rgba(190,255,120,' + (0.5 * fade) + ')');
                g.addColorStop(0.7, 'rgba(110,190,60,' + (0.34 * fade) + ')');
                g.addColorStop(1, 'rgba(70,140,30,0)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.ellipse(0, 0, z.r, z.r * 0.8, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(220,255,160,' + (0.25 * fade) + ')';
                for (let k = 0; k < 4; k++) {
                    const a = world.t * 1.4 + k * 1.6 + z.ph;
                    ctx.beginPath();
                    ctx.arc(Math.cos(a) * z.r * 0.4, Math.sin(a) * z.r * 0.3, 3 + 3 * pulse, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.restore();
        }
    }

    function drawMarks() {
        for (let i = 0; i < world.marks.length; i++) {
            const mk = world.marks[i];
            const x = scrX(mk.x), y = scrY(mk.y);
            if (mk.kind === 'strike') {
                const t = 1 - mk.life / mk.max;
                ctx.save();
                ctx.strokeStyle = 'rgba(255,230,100,' + (0.4 + 0.5 * t) + ')';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(x, y, mk.r * (0.4 + 0.6 * t), 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x - mk.r, y); ctx.lineTo(x + mk.r, y);
                ctx.moveTo(x, y - mk.r); ctx.lineTo(x, y + mk.r);
                ctx.stroke();
                ctx.restore();
            } else if (mk.kind === 'pulse') {
                ctx.save();
                ctx.strokeStyle = 'rgba(200,140,255,' + (mk.life / mk.max) + ')';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(x, y, mk.r, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
        }
    }

    function drawBlades() {

                ctx.moveTo(10, 0);
