    // ==================== 地球：十二柱星环 ====================
    // 十二根粗罗马石柱按钟表位围成一圈，3 / 6 / 9 / 12 点四个方位留空当作出入口；
    // 其余八个方位自 7 点钟（水星）起顺时针排给另外八颗行星。
    const COLONNADE_HOURS = [7, 8, 10, 11, 1, 2, 4, 5];
    // 上下左右四个空位：石柱本身和其它八根完全一样，只是没有对应的行星，陈列文字一律写 XX
    const COL_SEAT_ID = 'seat';
    const COL_SEAT = { id: COL_SEAT_ID, name: 'XX', colA: '#a9b8cf' };
    const COL_GEM_BEAM = 4;        // 集到这么多颗宝石就开始往外放光柱
    const COL_GEM_PORTAL = 8;      // 八颗全齐，圈心开启通往月球的传送门
    // 石柱围成的扁椭圆：长径 : 短径 ≈ 1120 : 630，整圈以火箭（飞船落点）为中心
    // 横向按「降落 / 起飞拉远到最小视角时，左右两端刚好进画」来定，见 LAUNCH_ZOOM_MIN
    // 纵向受取景高度卡死：1/5/7/11 点那四根柱子的柱脚必须留在画面内，短径再大就看不见了
    const COL_RING = { rX: 1120, rY: 630 };
    // 已挖到的行星宝石数量（地球自己不算；每颗宝石只算一次）
// ==================== 地球：海岛 · 沙滩 · 漂流瓶 ====================
// 岛的整体形状：极坐标下用四层正弦叠加扰动半径，边缘因此凸凹不规则；
// 横竖半径不同（贴近十二柱星环的椭圆比例），整体看起来仍是一枚近似的圆岛。
const ISLAND = { rx: 1480, ry: 1000, beach: 140, shells: 42 };
function islandCX() { return MAP_W * 0.5; }
function islandCY() { return MAP_H * 0.62; }
// 岸线半径系数（1 为基准，凸凹就来自这几层叠加）
function islandShape(a) {
    return 1 + 0.062 * Math.sin(3 * a + 0.6) + 0.045 * Math.sin(5 * a + 2.1)
        + 0.030 * Math.sin(7 * a - 1.2) + 0.019 * Math.sin(11 * a + 0.4);
}
// 沿 a 方向，一个归一化半径单位对应多少世界像素（椭圆上随方向变化）
function islandScale(a) { return Math.hypot(ISLAND.rx * Math.cos(a), ISLAND.ry * Math.sin(a)); }
function islandShore(a) { return islandShape(a); }                     // 水线：人物能走到的最外圈
function islandSand(a) { return islandShape(a) - ISLAND.beach / islandScale(a); }   // 沙滩内沿
// 一个世界坐标落在 sea / sand / grass 哪一块
function islandZone(x, y) {
    const nx = (x - islandCX()) / ISLAND.rx, ny = (y - islandCY()) / ISLAND.ry;
    const r = Math.hypot(nx, ny);
    if (r < 1e-6) return 'grass';
    const a = Math.atan2(ny, nx);
    if (r > islandShore(a) + 1e-6) return 'sea';   // 岸线本身算沙滩，越过去才是海
    if (r >= islandSand(a) - 1e-6) return 'sand';
    return 'grass';
}
// 把任何东西按回岸线以内：人物只能走到沙滩，不能走进大海
function clampToIsland(o) {
    const nx = (o.x - islandCX()) / ISLAND.rx, ny = (o.y - islandCY()) / ISLAND.ry;
    const r = Math.hypot(nx, ny);
    if (r < 1e-6 || !isFinite(r)) return;
    const a = Math.atan2(ny, nx);
    const lim = islandShore(a) - 2.5 / islandScale(a);   // 留一点余量，别把脚踩进水里
    if (r <= lim) return;
    const k = lim / r;
    o.x = wrapVal(islandCX() + nx * k * ISLAND.rx, MAP_W);
    o.y = wrapVal(islandCY() + ny * k * ISLAND.ry, MAP_H);
}
// 沙滩上的某个随机点（t：0 内沿 → 1 水线）
function islandBeachPoint(a, t) {
    const s = lerp(islandSand(a) + 0.06, islandShore(a) - 0.05, t);
    return {
        x: wrapVal(islandCX() + ISLAND.rx * s * Math.cos(a), MAP_W),
        y: wrapVal(islandCY() + ISLAND.ry * s * Math.sin(a), MAP_H)
    };
}

    // ---------- 地面绘制：大海 → 沙滩 → 草地 → 潮汐海浪 → 贝壳螃蟹 ----------
    function drawIslandGround() {
        const cx = scrX(islandCX()), cy = scrY(islandCY());
        const rx = ISLAND.rx, ry = ISLAND.ry;
        const R = Math.max(rx, ry);

        // 1) 大海：整屏铺满，海面由中心向外加深
        const og = ctx.createRadialGradient(cx, cy, R * 0.72, cx, cy, R * 2.2 + 700);
        og.addColorStop(0, '#2a6f9e');
        og.addColorStop(0.35, '#1a5382');
        og.addColorStop(0.75, '#113d64');
        og.addColorStop(1, '#0a2a48');
        ctx.fillStyle = og;
        ctx.fillRect(0, 0, W, H);
        // 海面波光：几道随时间缓慢漂移的横向亮带
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < 5; i++) {
            const yy = cy - R + ((world.t * (7 + i * 3) + i * 640) % (R * 2.6)) - 60;
            const gg = ctx.createLinearGradient(0, yy - 26, 0, yy + 26);
            gg.addColorStop(0, 'rgba(120,200,240,0)');
            gg.addColorStop(0.5, 'rgba(120,200,240,0.045)');
            gg.addColorStop(1, 'rgba(120,200,240,0)');
            ctx.fillStyle = gg;
            ctx.fillRect(0, yy - 26, W, 52);
        }
        ctx.restore();

        // 2) 近岸浅水：先沿岸线铺一层浅蓝，再让陆地盖住内侧一半
        const N = 240;
        function shorePath(getR) {
            ctx.beginPath();
            for (let i = 0; i <= N; i++) {
                const a = i / N * TAU;
                const rr = getR(a);
                const x = cx + rx * rr * Math.cos(a), y = cy + ry * rr * Math.sin(a);
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.closePath();
        }
        ctx.save();
        ctx.lineJoin = 'round';
        shorePath(islandShore);
        ctx.strokeStyle = 'rgba(122,214,255,0.22)'; ctx.lineWidth = 104; ctx.stroke();
        ctx.strokeStyle = 'rgba(168,235,255,0.30)'; ctx.lineWidth = 46; ctx.stroke();
        ctx.restore();
        // 湿沙：贴近水线的一圈颜色稍深
        shorePath(function (a) { return islandShore(a) - ISLAND.beach * 0.3 / islandScale(a); });
        ctx.fillStyle = '#cbb083';
        ctx.fill();
        shorePath(islandShore);
        ctx.fillStyle = '#e6d6a6';
        ctx.fill();
        // 草地：从沙滩内沿开始
        shorePath(islandSand);
        ctx.fillStyle = '#4f7f46';
        ctx.fill();
        // 草地与沙滩的交界：一圈深色草缘
        ctx.strokeStyle = 'rgba(58,92,48,0.45)';
        ctx.lineWidth = 5;
        ctx.stroke();
        // 浪花刚刚打湿的那条白线
        shorePath(islandShore);
        ctx.strokeStyle = 'rgba(255,255,255,0.45)';
        ctx.lineWidth = 2.6;
        ctx.stroke();

        // 3) 潮汐海浪：沿岸线一排排白浪，长边顺着岸线，随潮汐涨落并逐渐淡出
        const NW = 96;
        ctx.save();
        ctx.lineCap = 'round';
        for (let i = 0; i < NW; i++) {
            const a = i / NW * TAU;
            const S = islandShore(a);
            const wx = islandCX() + rx * S * Math.cos(a), wy = islandCY() + ry * S * Math.sin(a);
            const sx = scrX(wx), sy = scrY(wy);
            if (sx < -60 || sx > W + 60 || sy < -60 || sy > PLAY_H + 60) continue;
            let vx = rx * S * Math.cos(a), vy = ry * S * Math.sin(a);
            const vl = Math.hypot(vx, vy) || 1;
            vx /= vl; vy /= vl;
            const tang = Math.atan2(vy, vx) + Math.PI / 2;      // 泡沫长边贴着岸线走
            const tide = Math.sin(world.t * 1.15 + i * 0.44) * 9 + Math.sin(world.t * 0.53 + i * 0.17) * 6;
            for (let k = 0; k < 3; k++) {
                const off = 5 + k * 14 + tide * (1 - k * 0.35);
                const al = (0.42 - k * 0.12) * (0.5 + 0.5 * Math.sin(world.t * 1.7 - i * 0.31 + k * 0.8));
                if (al <= 0.02) continue;
                ctx.strokeStyle = 'rgba(236,251,255,' + al.toFixed(3) + ')';
                ctx.lineWidth = 2.8 - k * 0.7;
                ctx.beginPath();
                ctx.ellipse(sx + vx * off, sy + vy * off, 15 + k * 5, 6 + k * 2, tang, -1.05, 1.05);
                ctx.stroke();
            }
        }
        ctx.restore();

        // 4) 沙滩上的贝壳与螃蟹
        const bp = world.beachProps;
        if (bp) {
            for (let i = 0; i < bp.length; i++) {
                const b = bp[i];
                const sx = scrX(b.x), sy = scrY(b.y);
                if (sx < -24 || sx > W + 24 || sy < -24 || sy > PLAY_H + 24) continue;
                ctx.save();
                ctx.translate(sx, sy);
                if (b.kind === 1) drawBeachCrab(b, world.t);
                else drawBeachShell(b);
                ctx.restore();
            }
        }
    }
    // 贝壳：半开的扇形 + 放射纹
    function drawBeachShell(b) {
        ctx.save();
        ctx.rotate(b.rot);
        ctx.fillStyle = 'rgba(60,44,30,0.16)';
        ctx.beginPath();
        ctx.ellipse(1, 1.5, 8, 5.5, 0, 0, TAU);
        ctx.fill();
        ctx.fillStyle = b.tint;
        ctx.beginPath();
        ctx.moveTo(-7.5, 3);
        ctx.arc(0, 3, 7.8, Math.PI, 0);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(120,92,64,0.55)';
        ctx.lineWidth = 0.8;
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 0.9;
        for (let i = -2; i <= 2; i++) {
            ctx.beginPath();
            ctx.moveTo(0, 3);
            ctx.lineTo(Math.sin(i * 0.42) * 7.4, 3 - Math.cos(i * 0.42) * 6.6);
            ctx.stroke();
        }
        ctx.restore();
    }
    // 螃蟹：会在沙上小幅度横着挪动
    function drawBeachCrab(b, t) {
        const sc = Math.sin(t * 0.9 + b.seed) * 2.4;
        ctx.save();
        ctx.translate(sc, Math.sin(t * 1.8 + b.seed) * 0.8);
        ctx.fillStyle = 'rgba(60,30,20,0.18)';
        ctx.beginPath();
        ctx.ellipse(1, 3, 7.6, 3.4, 0, 0, TAU);
        ctx.fill();
        ctx.fillStyle = b.tint;
        ctx.beginPath();
        ctx.ellipse(0, 0, 7, 4.6, 0, 0, TAU);
        ctx.fill();
        // 腿
        ctx.strokeStyle = b.tint;
        ctx.lineWidth = 1.3;
        ctx.lineCap = 'round';
        for (let s = -1; s <= 1; s += 2) {
            for (let i = -1; i <= 1; i++) {
                const wig = Math.sin(t * 7 + i + (s > 0 ? 0 : 1.5)) * 1.6;
                ctx.beginPath();
                ctx.moveTo(s * 3.4, i * 2.2);
                ctx.lineTo(s * (7.4 + i), i * 3.4 + wig);
                ctx.stroke();
            }
            // 螯
            ctx.fillStyle = b.tint;
            ctx.beginPath();
            ctx.ellipse(s * 7.6, -2.6, 2.6, 1.9, s * 0.5, 0, TAU);
            ctx.fill();
        }
        // 眼
        ctx.fillStyle = '#2a1410';
        ctx.beginPath();
        ctx.arc(-1.7, -4.2, 0.9, 0, TAU);
        ctx.arc(1.7, -4.2, 0.9, 0, TAU);
        ctx.fill();
        ctx.restore();
    }

        const out = [];

            if (ctx.measureText(line + ch).width > maxW && line) { out.push(line); line = ch; }

        }

        return out;
    }

        world.ring = {

            rX: COL_RING.rX, rY: COL_RING.rY

            const y = wrapVal(world.ring.y + Math.sin(a) * COL_RING.rY, MAP_H);

            world.colonnade.push({

                id: idx >= 0 ? targets[idx].id : COL_SEAT_ID

        buildNoTreeZones(cx, cy);

        world.island = true;
        world.beachProps = buildBeachProps();
        buildBottles();
    }
    // 地表禁植区：石柱阵 / 基地广场 / 火箭 / 补给飞船一带不长树
    function buildNoTreeZones(cx, cy) {
        const zones = [];
        zones.push({ x: cx, y: cy, rx: 300 + 90, ry: 220 + 90 });
        zones.push({ x: world.rocket.x, y: world.rocket.y - 60, rx: 140, ry: 200 });
        if (world.supply) zones.push({ x: world.supply.x, y: world.supply.y - 40, rx: 160, ry: 130 });
        if (world.ring) {
            zones.push({ x: world.ring.x, y: world.ring.y, rx: world.ring.rX + 150, ry: world.ring.rY + 150 });
        }
        world.noTree = zones;

    function treeBlocked(wx, wy) {
        const zones = world.noTree;
        if (!zones) return false;
        for (let i = 0; i < zones.length; i++) {
            const z = zones[i];
            const dx = dX(z.x, wx) / z.rx, dy = dY(z.y, wy) / z.ry;
            if (dx * dx + dy * dy < 1) return true;
        }
        return false;
    }
    // 忽略旧版本已下架的武器 / 道具 id（如已删除的火箭炮）
    function fmtTime(s) {
        const m = Math.floor(s / 60), ss = Math.floor(s % 60);
        return (m < 10 ? '0' : '') + m + ':' + (ss < 10 ? '0' : '') + ss;

    // ---------------- 十二柱星环 ----------------
    // 单根石柱：柱脚 → 圆柱（柱体本身就是牢笼）→ 顶端外张的抱爪 → 悬空的宝石
    // 每一层都用「上下椭圆口 + 柱壁」的画法，堆出当前俯视角度下的体积感
    const COL_R = 46;           // 柱身半径（加粗）
    const COL_BODY_T = 126;     // 柱身顶端相对柱脚的高度
    const COL_BODY_B = 34;      // 柱身底端：正好落在上级台阶的踏面中心，柱脚才不会插进台阶里
    const COL_CLAW_T = 198;     // 抱爪顶端
    const COL_GEM_Y = 232;      // 宝石悬空的高度
    // 一块有厚度的石层：顶面受光、竖面自带上亮下暗的竖向渐变、底沿收一道暗边
    // 圆柱的立体感全靠竖面这道明暗；竖面若是一个平色，无论柱身还是台阶都会看着像贴纸。
    // bot：底沿椭圆的高度系数。柱身 / 柱头用默认 0.3；
    // 柱脚两级台阶要压到 0.10 —— 默认值下上级台阶的暗底沿会整片盖住下级的亮踏面，柱脚会看成上下两团死黑
    function colSlab(x, yTop, h, r, cTop, cBody, cBot, bot) {
        const capH = r * 0.3;
        const wall = ctx.createLinearGradient(x, yTop, x, yTop + h);
        wall.addColorStop(0, cTop);        // 贴着顶面最亮
        wall.addColorStop(0.42, cBody);
        wall.addColorStop(1, cBot);        // 落到下缘最暗
        ctx.fillStyle = wall;
        roundRectPath(x - r, yTop, r * 2, h, 3);
        ctx.fill();
        ctx.fillStyle = cBot;
        ctx.beginPath(); ctx.ellipse(x, yTop + h, r, bot === undefined ? capH : r * bot, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = cTop;
        ctx.beginPath(); ctx.ellipse(x, yTop, r, capH, 0, 0, TAU); ctx.fill();
    }
    // 笼口轮廓：上下两边都按柱身的椭圆口画，一律向前（屏幕下方）鼓出，
    // 这样洞口和柱身、柱头、柱脚用的是同一套圆弧，读起来是同一根柱子上的东西。
    // 注意 canvas 的角度是顺屏幕方向量的：0→PI 才是「经正下方」的下半圈，PI→0 才是往回绕的下半圈
    function colCagePath(x, yTop, h, r) {
        const capH = r * 0.3;
        ctx.beginPath();
        ctx.moveTo(x + r, yTop);
        ctx.ellipse(x, yTop, r, capH, 0, 0, Math.PI);            // 上缘：右 -> 左，经正下方鼓出
        ctx.lineTo(x - r, yTop + h);
        ctx.ellipse(x, yTop + h, r, capH, 0, Math.PI, 0, true);   // 下缘：左 -> 右，同样经正下方鼓出
        ctx.closePath();
    }
    // 一根石爪：整根沿同一条中线一次成形 —— 根部保持 w 的粗细，向上用 smoothstep 连续收到尖，
    // 两侧按法线等距外扩再首尾闭合，所以没有分段描边留下的接缝和毛刺。
    // 亮面外面再压一层加宽并右下错位的暗底，靠两条轮廓的错位挤出体积。
    function colClaw(x0, y0, x1, y1, cx, cy, w) {
        const TIP_W = w * 0.10;     // 爪尖留一点厚度，收成尖而不是针
        const SEG = 18;              // 取样段数，够密看不出折线
        function qp(t) {
            const u = 1 - t;
            return [u * u * x0 + 2 * u * t * cx + t * t * x1, u * u * y0 + 2 * u * t * cy + t * t * y1];
        }
        function qtan(t) {
            const u = 1 - t;
            const dx = 2 * u * (cx - x0) + 2 * t * (x1 - cx);
            const dy = 2 * u * (cy - y0) + 2 * t * (y1 - cy);
            const l = Math.hypot(dx, dy) || 1;
            return [dx / l, dy / l];
        }
        // 下微粗上细：根部 35% 几乎保持整根粗细，过半才开始收，最后收到爪尖
        function halfW(t, grow) {
            const u = clamp((t - 0.35) / 0.65, 0, 1);
            const e = u * u * (3 - 2 * u);
            return (w + (TIP_W - w) * e) / 2 + grow;
        }
        // 一侧走正法线、另一侧走负法线，首尾一接就是闭合轮廓
        function outline(ox, oy, grow) {
            let p = qp(0), d = qtan(0), h = halfW(0, grow);
            ctx.beginPath();
            ctx.moveTo(p[0] + ox - d[1] * h, p[1] + oy + d[0] * h);
            for (let i = 1; i <= SEG; i++) {
                p = qp(i / SEG); d = qtan(i / SEG); h = halfW(i / SEG, grow);
                ctx.lineTo(p[0] + ox - d[1] * h, p[1] + oy + d[0] * h);
            }
            for (let i = SEG; i >= 0; i--) {
                p = qp(i / SEG); d = qtan(i / SEG); h = halfW(i / SEG, grow);
                ctx.lineTo(p[0] + ox + d[1] * h, p[1] + oy - d[0] * h);
            }
            ctx.closePath();
        }
        // 暗底：加宽一圈并右下错位
        outline(1.6, 2.2, 1.75);
        ctx.fillStyle = '#3f4653';
        ctx.fill();
        // 亮面
        const g = ctx.createLinearGradient(x0, y0, x1, y1);
        g.addColorStop(0, '#79808f');
        g.addColorStop(0.5, '#c2c9d6');
        g.addColorStop(1, '#eef2f8');
        outline(0, 0, 0);
        ctx.fillStyle = g;
        ctx.fill();
        // 爪尖的小高光，压在还够宽的收拢段上，免得比爪身还粗、变成尖端一个白点
        const qh = qp(0.7);
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.beginPath(); ctx.arc(qh[0], qh[1], w * 0.24, 0, TAU); ctx.fill();
    }
    function drawRomanColumn(col, alpha) {
        const x = scrX(col.x), y = scrY(col.y);

        const seat = col.id === COL_SEAT_ID;
        const pl = col.id ? (seat ? COL_SEAT : PLANET_BY_ID[col.id]) : null;
        const rec = (col.id && !seat) ? save.planets[col.id] : null;
        const hasGem = !!(pl && !seat && save.gems[pl.id] > 0);
        const cleared = !!(rec && rec.clears > 0);
        const R = COL_R;
        const bodyT = y - COL_BODY_T, bodyB = y - COL_BODY_B;

            const inR = R - 8, inH = bodyH - 18;
            const it = bodyT + 9;
            const inCap = inR * 0.3;            // 洞口上下弧的鼓出高度，与柱身同一比例
            const hole = ctx.createLinearGradient(x, it, x, it + inH);
            hole.addColorStop(0, 'rgba(6,8,12,0.97)');
            hole.addColorStop(0.5, 'rgba(18,22,31,0.97)');
            hole.addColorStop(1, 'rgba(4,5,8,0.97)');
            ctx.fillStyle = hole;
            colCagePath(x, it, inH, inR);
            ctx.fill();
            // 洞口内圈的一层厚边
            ctx.strokeStyle = 'rgba(24,29,40,0.95)';
            ctx.lineWidth = 5;
            colCagePath(x, it, inH, inR);
            ctx.stroke();
            // 笼子里不写字：已通关的关着 BOSS，没通关的就空着，靠柱脚铭牌认人
            if (cleared) drawBossCage(pl, x, it + inH * 0.52, inR);
            // 铁栏压在 BOSS 之上：竖栏按笼口两条弧各自起止，横栏直接描那两段弧
            ctx.strokeStyle = 'rgba(160,172,192,0.88)';
            ctx.lineWidth = 2.8;
            for (let i = -2; i <= 2; i++) {
                const bx = x + i * inR * 0.5;
                // 该竖栏位置上笼口上下弧的鼓出量
                const k = inCap * Math.sqrt(Math.max(0, 1 - (i * 0.5) * (i * 0.5)));
                ctx.beginPath();
                ctx.moveTo(bx, it + k);
                ctx.lineTo(bx, it + inH + k);
                ctx.stroke();
            }
            ctx.strokeStyle = 'rgba(210,222,240,0.75)';
            ctx.lineWidth = 3.2;
            ctx.beginPath();
            ctx.ellipse(x, it, inR, inCap, 0, 0, Math.PI);
            ctx.moveTo(x - inR, it + inH);
            ctx.ellipse(x, it + inH, inR, inCap, 0, Math.PI, 0, true);
            ctx.stroke();
        }
        // 柱头托盘：同样是一块带上下椭圆口的厚石层
        const capR = R + 4;
        colSlab(x, bodyT - 14, 14, capR, '#b3bac7', '#818998', '#5b6270');
        // 托盘那块顶椭圆的上缘，就是柱子的「顶平面」，中间两根抱爪从这里起画
        const capPlaneY = bodyT - 14 - capR * 0.3;
        // 顶端抱爪：四根石爪朝外上方张开，爪尖一律离开柱身
        // 外侧两根从柱肩起画；中间两根只画上半截，根部收到托盘顶平面上缘，根与尖都比外侧张开得更开
        const clawT = y - COL_CLAW_T;
        const midY0 = capPlaneY, midY1 = clawT - 6, midCy = (midY0 + midY1) / 2;
        const midRootX = R * 0.35, midTipX = R * 0.63;
        colClaw(x - R * 0.72, bodyT - 8, x - R * 1.34, clawT + 8, x - R * 1.46, (bodyT + clawT) / 2, 7.5);
        colClaw(x - midRootX, midY0, x - midTipX, midY1, x - R * 0.80, midCy, 6.2);
        colClaw(x + midRootX, midY0, x + midTipX, midY1, x + R * 0.80, midCy, 6.2);
        colClaw(x + R * 0.72, bodyT - 8, x + R * 1.34, clawT + 8, x + R * 1.46, (bodyT + clawT) / 2, 7.5);
        // 宝石：居中悬在爪心，比原来更大，光效更炫
        const gemY = y - COL_GEM_Y + Math.sin(t * 1.9 + col.seed * 2) * 4;
        if (pl && hasGem) {
            const pulse = 0.74 + 0.26 * Math.sin(t * 2.6 + col.seed);
            const sp = 0.5 + 0.5 * Math.sin(t * 1.3 + col.seed * 1.7);
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            // 三层辉光：由内到外铺开
            for (let i = 0; i < 3; i++) {
                const rr = (34 + i * 26) * pulse;
                const gl = ctx.createRadialGradient(x, gemY, 1, x, gemY, rr);
                gl.addColorStop(0, hexA(pl.colA, (0.5 - i * 0.13) * pulse));
                gl.addColorStop(0.32, hexA(pl.colA, (0.24 - i * 0.07) * pulse));
                gl.addColorStop(1, hexA(pl.colA, 0));
                ctx.fillStyle = gl;
                ctx.beginPath(); ctx.arc(x, gemY, rr, 0, TAU); ctx.fill();
            }
            // 旋转的刻度光环
            ctx.save();
            ctx.translate(x, gemY);
            ctx.rotate(t * 0.55 + col.seed);
            ctx.scale(1, 0.42);
            ctx.strokeStyle = hexA(pl.colA, 0.34 * pulse);
            ctx.lineWidth = 2.4;
            ctx.beginPath(); ctx.arc(0, 0, 52 * pulse, 0, TAU); ctx.stroke();
            for (let i = 0; i < 8; i++) {
                const a = i / 8 * TAU;
                ctx.beginPath();
                ctx.moveTo(Math.cos(a) * 44 * pulse, Math.sin(a) * 44 * pulse);
                ctx.lineTo(Math.cos(a) * 54 * pulse, Math.sin(a) * 54 * pulse);
                ctx.stroke();
            }
            ctx.restore();
            // 缓慢反向自转的细环
            ctx.save();
            ctx.translate(x, gemY);
            ctx.rotate(-t * 0.34 + col.seed * 2);
            ctx.scale(1, 0.6);
            ctx.strokeStyle = hexA('#ffffff', 0.24 * sp);
            ctx.lineWidth = 1.6;
            ctx.setLineDash([12, 16]);
            ctx.beginPath(); ctx.arc(0, 0, 40 * pulse, 0, TAU); ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();
            // 六道长短不一的星芒
            ctx.strokeStyle = hexA(pl.colA, 0.5 * pulse);
            for (let i = 0; i < 6; i++) {
                const a = col.seed * 0.7 + t * 0.28 + i * Math.PI / 3;
                const len = (34 + 20 * (i % 2)) * pulse;
                ctx.lineWidth = i % 2 ? 2.6 : 1.4;
                ctx.beginPath();
                ctx.moveTo(x, gemY);
                ctx.lineTo(x + Math.cos(a) * len, gemY + Math.sin(a) * len);
                ctx.stroke();
            }
            // 环绕的火花
            for (let i = 0; i < 7; i++) {
                const a = t * 1.1 + i * TAU / 7 + col.seed;
                const rr = 44 + 12 * Math.sin(t * 2 + i);
                const fx = x + Math.cos(a) * rr, fy = gemY + Math.sin(a) * rr * 0.5;
                ctx.fillStyle = hexA(i % 2 ? '#ffffff' : pl.colA, 0.5 + 0.4 * Math.sin(t * 4 + i));
                ctx.beginPath(); ctx.arc(fx, fy, 1.6 + 1.2 * sp, 0, TAU); ctx.fill();
            }
            ctx.restore();
            // 本体：放大后仍然用宝石自己的多面结晶
            ctx.save();
            ctx.translate(x, gemY);
            ctx.scale(1.15, 1.15);
            drawGemIconBody(pl.id);
            ctx.restore();
        }
        // 柱脚铭牌
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        roundRectPath(x - 36, y + 14, 72, 20, 5);
        ctx.fillStyle = 'rgba(14,20,32,0.82)';
        ctx.fill();
        ctx.strokeStyle = hexA(pl.colA, cleared ? 0.55 : 0.28);
        ctx.lineWidth = 1.2;
        roundRectPath(x - 36, y + 14, 72, 20, 5);
        ctx.stroke();
        setFont(13, 'bold');
        ctx.fillStyle = cleared ? '#bfe98a' : 'rgba(220,233,250,0.9)';
        ctx.fillText(pl.name, x, y + 24);
        ctx.restore();
    }
    // 关在笼子里的 BOSS：画的是战场上那只的静态版——两层主体 + 甲壳纹路 + 眼睛 + 头冠尖刺，
    // 元素与 drawBoss 一致，只是不随时间动；不再额外补一块肩背，免得笼口下方多出半圆形色块
    function drawBossCage(pl, x, y, inR) {
        const c = pl.bossCol;
        const S = inR / 30 * 1.3;
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(S, S);
        // 主体
        ctx.fillStyle = c.dark;
        ctx.beginPath(); ctx.ellipse(0, -6, 25, 23, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = c.body;
        ctx.beginPath(); ctx.ellipse(-2, -9, 19, 17, 0, 0, TAU); ctx.fill();
        // 甲壳纹路
        ctx.strokeStyle = 'rgba(0,0,0,0.32)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 2; i++) {
            ctx.beginPath(); ctx.arc(-2, -9, 6 + i * 5, -0.8, 0.8); ctx.stroke();
        }
        // 眼窝的幽光
        ctx.fillStyle = c.eye;
        ctx.beginPath();
        ctx.arc(9, -12, 4.4, 0, TAU);
        ctx.arc(10, -1, 3.4, 0, TAU);
        ctx.fill();
        // 头冠尖刺：与战场上同一套，只是固定不动
        ctx.fillStyle = shade(c.dark, -0.2);
        for (let i = 0; i < 7; i++) {
            const a = -Math.PI * 0.92 + i * (Math.PI * 1.84 / 6);
            ctx.save();
            ctx.rotate(a);
            ctx.beginPath();
            ctx.moveTo(19, -5); ctx.lineTo(33, 1); ctx.lineTo(19, 7);
            ctx.closePath(); ctx.fill();
            ctx.restore();
        }
        ctx.restore();
    }
    function drawSupplyShip(x, y, t, alpha) {
        const m = 280 / viewZoom;
        if (x < -m || x > W + m || y < -m || y > PLAY_H + m) return;
        const pulse = 0.5 + 0.5 * Math.sin(t * 2.2);
ctx.save();
        ctx.globalAlpha = alpha;
        // 地面投影（不再铺半透明的停机坪衬底，直接落在地面上）
        ctx.fillStyle = 'rgba(0,0,0,0.34)';
        ctx.beginPath();
        ctx.ellipse(x + 6, y + 44, 96, 26, 0, 0, Math.PI * 2);
        ctx.fill();
        // 起落架
        for (let s = -1; s <= 1; s += 2) {
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#6f7a8c';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(x + s * 56, y - 6);
            ctx.lineTo(x + s * 82, y + 38);
            ctx.stroke();
            ctx.strokeStyle = '#aab4c4';
            ctx.lineWidth = 2.6;
            ctx.beginPath();
            ctx.moveTo(x + s * 56, y - 6);
            ctx.lineTo(x + s * 82, y + 38);
            ctx.stroke();
            ctx.lineCap = 'butt';
            ctx.fillStyle = '#5e6878';
            ctx.beginPath();
            ctx.ellipse(x + s * 82, y + 43, 14, 6, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(215,232,255,0.28)';
            ctx.beginPath();
            ctx.ellipse(x + s * 82, y + 41, 10, 2.8, 0, 0, Math.PI * 2);
            ctx.fill();
        }
        // 侧挂货舱
        for (let s = -1; s <= 1; s += 2) {
            const cx = x + s * 82;
            const g = ctx.createLinearGradient(cx, y - 64, cx, y + 18);
            g.addColorStop(0, '#93a0b2');
            g.addColorStop(0.45, '#dbe2ec');
            g.addColorStop(1, '#69737f');
            ctx.fillStyle = g;
            roundRectPath(cx - 24, y - 62, 48, 84, 16);
            ctx.fill();
            ctx.strokeStyle = 'rgba(24,32,48,0.45)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,0.22)';
            ctx.fillRect(cx - 15, y - 48, 30, 4);
            ctx.fillStyle = 'rgba(0,0,0,0.18)';
            ctx.fillRect(cx - 15, y - 38, 30, 3);
            // 货舱舷灯
            const c2 = s < 0 ? '255,110,110' : '120,255,180';
            ctx.fillStyle = 'rgba(' + c2 + ',' + (0.45 + 0.45 * pulse) + ')';
            ctx.beginPath();
            ctx.arc(cx, y - 16, 4.4, 0, Math.PI * 2);
            ctx.fill();
        }
        // 主机身
        const bg = ctx.createLinearGradient(x, y - 72, x, y + 30);
        bg.addColorStop(0, '#f4f8fc');
        bg.addColorStop(0.42, '#c6cfdc');
        bg.addColorStop(1, '#7b8694');
        ctx.fillStyle = bg;
        ctx.beginPath();
        ctx.moveTo(x, y - 74);
        ctx.bezierCurveTo(x + 34, y - 64, x + 46, y - 34, x + 46, y - 10);
        ctx.lineTo(x + 46, y + 18);
        ctx.quadraticCurveTo(x + 46, y + 28, x + 34, y + 28);
        ctx.lineTo(x - 34, y + 28);
        ctx.quadraticCurveTo(x - 46, y + 28, x - 46, y + 18);
        ctx.lineTo(x - 46, y - 10);
        ctx.bezierCurveTo(x - 46, y - 34, x - 34, y - 64, x, y - 74);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(24,32,48,0.45)';
        ctx.lineWidth = 1.6;
        ctx.stroke();
        // 面板线与涂装带
        ctx.strokeStyle = 'rgba(40,52,74,0.16)';
        ctx.lineWidth = 1;
        for (let py = -28; py <= 6; py += 17) {
            ctx.beginPath();
            ctx.moveTo(x - 46, y + py); ctx.lineTo(x + 46, y + py);
            ctx.stroke();
        }
        ctx.fillStyle = '#2f7fb8';
        ctx.fillRect(x - 46, y - 2, 92, 6);
        ctx.fillStyle = 'rgba(255,255,255,0.28)';
        ctx.fillRect(x - 46, y - 2, 92, 2);
        // 驾驶舱
        const cg = ctx.createRadialGradient(x - 5, y - 44, 2, x, y - 36, 20);
        cg.addColorStop(0, '#9ff0ff');
        cg.addColorStop(0.45, '#3a7fb8');
        cg.addColorStop(1, '#14304d');
        ctx.fillStyle = cg;
        ctx.beginPath();
        ctx.ellipse(x, y - 38, 17, 19, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(228,244,255,0.8)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.beginPath();
        ctx.ellipse(x - 6, y - 44, 4.4, 7, -0.5, 0, Math.PI * 2);
        ctx.fill();
        // 敞开的货舱（内透青色光）
        const bayG = ctx.createLinearGradient(x, y + 4, x, y + 30);
        bayG.addColorStop(0, 'rgba(124,224,255,0.55)');
        bayG.addColorStop(1, 'rgba(20,50,80,0.85)');
        ctx.fillStyle = bayG;
        roundRectPath(x - 20, y + 2, 40, 26, 5);
        ctx.fill();
        ctx.strokeStyle = 'rgba(160,230,255,0.75)';
        ctx.lineWidth = 1.6;
        roundRectPath(x - 20, y + 2, 40, 26, 5);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,' + (0.25 + 0.35 * pulse) + ')';
        for (let i = 0; i < 3; i++) {
            ctx.fillRect(x - 15 + i * 10, y + 7, 6, 16);
        }
        // 信标灯
        const on = (t % 1.1) < 0.6;
        if (on) {
            const bg2 = ctx.createRadialGradient(x, y - 70, 0.5, x, y - 70, 16);
            bg2.addColorStop(0, 'rgba(255,120,120,0.85)');
            bg2.addColorStop(0.3, 'rgba(255,120,120,0.35)');
            bg2.addColorStop(1, 'rgba(255,120,120,0)');
            ctx.fillStyle = bg2;
            ctx.beginPath();
            ctx.arc(x, y - 70, 16, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.fillStyle = 'rgba(255,120,120,' + (on ? 0.95 : 0.3) + ')';
        ctx.beginPath();
        ctx.arc(x, y - 70, 3.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        // 名称与提示（不受 alpha 影响，保持清晰）
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        setFont(16, 'bold');
        ctx.fillStyle = '#cfeeff';
        ctx.fillText('补给航天飞船', x, y - 108);
        if (world.supplyNear) {
            setFont(14, 'bold');
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillText('按 ' + hintConfirm() + ' 打开战备配置', x + 1, y - 90 + 1);
            ctx.fillStyle = '#ffd24a';
            ctx.fillText('按 ' + hintConfirm() + ' 打开战备配置', x, y - 90);
        } else {
            setFont(12, 'normal');
            ctx.fillStyle = 'rgba(200,220,245,0.55)';
            ctx.fillText('战备配置终端', x, y - 90);
        }
        ctx.restore();
    }

    // 基地标题（火箭上方的「地球 · 家园基地」）：火箭落地 HUB_TITLE_HOLD 秒后开始淡出
    const HUB_TITLE_HOLD = 3.0, HUB_TITLE_FADE = 0.9;
    function hubTitleAlpha() {
        const t = world.landed;
        if (t < 0) return 1;               // 还没落地（例如直接重进本局）时保持常显
        if (t <= HUB_TITLE_HOLD) return 1;
        return clamp(1 - (t - HUB_TITLE_HOLD) / HUB_TITLE_FADE, 0, 1);
    }
    function drawEarthHub() {
        const p = world.player;
        // 基地广场：不再铺半透明的地面衬底，只留标题文字；累计分数 / 累计击杀已移除
        const fade = hubTitleAlpha();
        if (fade > 0) {
            const cx = scrX(MAP_W * 0.5), cy = scrY(MAP_H * 0.62);
            ctx.save();
            ctx.globalAlpha = fade;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            setFont(20, 'bold');
            ctx.fillStyle = 'rgba(235,245,255,0.92)';
            ctx.fillText('地球 · 家园基地', cx, cy - 210);
            ctx.restore();
        }
        // 补给航天飞船（与石柱一样进入按 y 排序的地面景物队列）
        if (world.supply) {
            const sp = world.supply;
            groundProps.push({
                wy: sp.y, draw: (function (sx, sy) {
                    return function () { drawSupplyShip(sx, sy, world.t, 1); };
                })(scrX(sp.x), scrY(sp.y))
            });
        }
        // 十二根石柱同样进入队列，保证前后遮挡
        if (world.colonnade) {
            for (let i = 0; i < world.colonnade.length; i++) {
                const col = world.colonnade[i];
                groundProps.push({
                    wy: col.y, draw: (function (c) {
                        return function () { drawRomanColumn(c, 1); };
                    })(col)
                });
            }
        }
        // 石柱铺成的地面刻线 + 宝石光柱 + 圈心传送门（都画在人物之下）
        // 漂流瓶混进地面道具按 y 绘制，走近时提示按 J/A 阅读
        if (world.bottles) {
            for (let i = 0; i < world.bottles.length; i++) {
                const b = world.bottles[i];
                groundProps.push({
                    wy: b.y, draw: (function (sx, sy, bb, idx) {
                        return function () { drawBottleProp(sx, sy, world.t, bb, world.bottleNear === idx); };
                    })(scrX(b.x), scrY(b.y), b, i)
                });
            }
        }
        if (world.ring) drawColonnadeRing();
        drawColonnadeBeams();
        drawColonnadePortal();
    }

    // 石柱围出的地面：不铺衬底，也不再画任何刻线，只保留一圈很淡的虚线轮廓
    function drawColonnadeRing() {
        const r = world.ring;
        const x = scrX(r.x), y = scrY(r.y);
        const m = (r.rX + 320) / viewZoom;
        if (x < -m || x > W + m || y < -m || y > PLAY_H + m) return;
        ctx.save();
        ctx.setLineDash([10, 16]);
        ctx.lineDashOffset = -world.t * 14;
        ctx.strokeStyle = 'rgba(215,228,245,0.14)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.ellipse(x, y, r.rX, r.rY, 0, 0, TAU);
        ctx.stroke();
        ctx.restore();
    }
    // 每凑够 4 颗宝石，一根石柱上的宝石就朝圈心射出一道该宝石颜色的半透明光柱
    function drawColonnadeBeams() {
        if (!world.ring || gemTotal() < COL_GEM_BEAM) return;
        const cx = scrX(world.ring.x), cy = scrY(world.ring.y);
        for (let i = 0; i < world.colonnade.length; i++) {
            const col = world.colonnade[i];
            if (col.id === COL_SEAT_ID) continue;   // 空位没有宝石，也就没有光柱
            if (!col.id || !save.gems[col.id]) continue;
            const pl = PLANET_BY_ID[col.id];
            const a = -Math.PI / 2 + col.hour * Math.PI / 6;
            const bx = scrX(col.x);
            const by = scrY(col.y) - COL_GEM_Y;
            const flow = (world.t * 0.55 + col.seed * 0.13) % 1;
            const wob = 0.75 + 0.25 * Math.sin(world.t * 2 + col.seed);
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            const g = ctx.createLinearGradient(bx, by, cx, cy);
            g.addColorStop(0, hexA(pl.colA, 0.34 * wob));
            g.addColorStop(0.55, hexA(pl.colA, 0.17 * wob));
            g.addColorStop(1, hexA(pl.colA, 0));
            ctx.strokeStyle = g;
            ctx.lineWidth = 13;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(bx, by);
            ctx.lineTo(cx, cy);
            ctx.stroke();
            ctx.strokeStyle = hexA(pl.colA, 0.3 * wob);
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.moveTo(bx, by);
            ctx.lineTo(cx, cy);
            ctx.stroke();
            // 沿光柱往上跑的流光
            const tx = lerp(bx, cx, flow), ty = lerp(by, cy, flow);
            const tg = ctx.createRadialGradient(tx, ty, 0, tx, ty, 26);
            tg.addColorStop(0, hexA(pl.colA, 0.55 * wob));
            tg.addColorStop(1, hexA(pl.colA, 0));
            ctx.fillStyle = tg;
            ctx.beginPath();
            ctx.arc(tx, ty, 26, 0, TAU);
            ctx.fill();
            ctx.restore();
        }
    }
    // 八颗宝石集齐：圈心打开通往月球正面的传送门
    function drawColonnadePortal() {
        if (!world.portal) return;
        const x = scrX(world.portal.x), y = scrY(world.portal.y);
        const m = 400 / viewZoom;
        if (x < -m || x > W + m || y < -m || y > PLAY_H + m) return;
        const t = world.t;
        const open = clamp((t % 3) / 0.9, 0, 1);
        const R = 78 * (0.82 + 0.18 * open);
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        // 门口洒出来的地光
        const fl = ctx.createRadialGradient(x, y, 4, x, y, R * 1.5);
        fl.addColorStop(0, 'rgba(190,170,255,0.42)');
        fl.addColorStop(0.5, 'rgba(140,120,255,0.16)');
        fl.addColorStop(1, 'rgba(120,100,240,0)');
        ctx.fillStyle = fl;
        ctx.beginPath();
        ctx.ellipse(x, y, R * 1.5, R * 0.95, 0, 0, TAU);
        ctx.fill();
        // 漩涡
        for (let i = 0; i < 5; i++) {
            const ph = (t * 0.55 + i / 5) % 1;
            const rr = R * (0.35 + 0.8 * ph);
            ctx.strokeStyle = 'rgba(205,185,255,' + (0.42 * (1 - ph)) + ')';
            ctx.lineWidth = 4 * (1 - ph) + 1;
            ctx.beginPath();
            ctx.ellipse(x, y, rr, rr * 0.95, 0, 0, TAU);
            ctx.stroke();
        }
        // 门心
        const cg = ctx.createRadialGradient(x, y, 2, x, y, R * 0.55);
        cg.addColorStop(0, 'rgba(255,255,255,0.75)');
        cg.addColorStop(0.4, 'rgba(180,160,255,0.35)');
        cg.addColorStop(1, 'rgba(140,120,255,0)');
        ctx.fillStyle = cg;
        ctx.beginPath();
        ctx.ellipse(x, y, R * 0.55, R * 0.52, 0, 0, TAU);
        ctx.fill();
        ctx.restore();
        // 底座圆盘与提示文字（不用加色混合，保持清晰）
        ctx.save();
        ctx.strokeStyle = 'rgba(200,180,255,0.75)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(x, y, R, R * 0.62, 0, 0, TAU);
        ctx.stroke();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        setFont(15, 'bold');
        ctx.fillStyle = '#e6dcff';
        ctx.fillText('月球传送门', x, y - R * 0.62 - 24);
        setFont(12, 'normal');
        ctx.fillStyle = 'rgba(220,210,255,0.85)';
        ctx.fillText('按 ' + hintConfirm() + ' 前往月球正面', x, y + R * 0.62 + 22);
        ctx.restore();
    }
    // 走近石柱时说明这根柱子的来历
    // 提示框摆在「圈心 → 当前石柱」这条线的延长线上（越过石柱继续往外），
    // 由 drawPlay 在最外层调用，因此永远压在所有景物与 HUD 之上
    function drawColonnadeTip(p) {
        if (world.over || !world.colonnade || !world.ring) return;
        for (let i = 0; i < world.colonnade.length; i++) {
            const col = world.colonnade[i];
            if (Math.hypot(dX(col.x, p.x), dY(col.y, p.y)) > 130) continue;
            if (!col.id || col.id === COL_SEAT_ID) return;
            const pl = PLANET_BY_ID[col.id];
            const rec = save.planets[col.id];
            const gem = save.gems[col.id] > 0;
            const lines = [
                pl.name,
                'BOSS：' + (pl.boss || '—') + (rec.clears > 0 ? '（已关进牢笼）' : '（尚未击败）'),
                '战绩：' + rec.clears + ' 次　最高分：' + rec.bestScore,
                '宝石：' + (gem ? gemName(col.id) + '（已归位）' : '未获得'),
                '特色装备：' + (save.relics[col.id] && RELIC_BY_ID[col.id] ? RELIC_BY_ID[col.id].name + '（已入库）' : '未挖出')
            ];
            const bw = 370, bh = 32 + lines.length * 21;
            // 沿圈心指向石柱的方向再往外推，落在延长线上
            const ax = dX(col.x, world.ring.x), ay = dY(col.y, world.ring.y);
            const len = Math.max(1, Math.hypot(ax, ay));
            const reach = len + 210 + bh * 0.5;
            let ox = scrX(world.ring.x) + ax / len * reach;
            let oy = scrY(world.ring.y) + ay / len * reach - bh * 0.5;
            // 贴近屏幕边缘时翻到石柱另一侧，保证不出画
            if (ox < 12 || ox + bw > W - 12) {
                const back = len + 150 + bh * 0.5;
                ox = scrX(world.ring.x) - ax / len * back;
                oy = scrY(world.ring.y) - ay / len * back - bh * 0.5;
            }
            const bx = clamp(ox, 12, W - bw - 12);
            const by = clamp(oy, 12, PLAY_H - bh - 12);
            ctx.save();
            ctx.globalAlpha = 0.72;                  // 半透明，压得住底下的景物
            ctx.fillStyle = 'rgba(10,18,32,0.95)';
            roundRectPath(bx, by, bw, bh, 10);
            ctx.fill();
            ctx.strokeStyle = hexA(pl.colA, 0.5);
            ctx.lineWidth = 1.6;
            roundRectPath(bx + 1, by + 1, bw - 2, bh - 2, 9);
            ctx.stroke();
            ctx.globalAlpha = 1;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            for (let k = 0; k < lines.length; k++) {
                setFont(k === 0 ? 17 : 13, k === 0 ? 'bold' : 'normal');
                ctx.fillStyle = k === 0 ? hexA(pl.colA, 0.95) : 'rgba(220,234,252,0.9)';
                ctx.fillText(lines[k], bx + 18, by + 23 + k * 21);
            }
            // 一根细引线把提示框和柱顶连起来
            ctx.strokeStyle = hexA(pl.colA, 0.45);
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            const tipX = bx + bw / 2, tipY = ay < 0 ? by + bh : by;
            ctx.moveTo(tipX, tipY);
            ctx.lineTo(scrX(col.x), scrY(col.y) - COL_GEM_Y);
            ctx.stroke();
            ctx.restore();
            break;
        }
    }

        // 道具提示

        ctx.fillStyle = 'rgba(200,215,240,0.78)';

        if (!world.over && (world.bossDefeated || planet.home)) {
            const dr = Math.hypot(dX(world.rocket.x, world.player.x), dY(world.rocket.y, world.player.y));

        setFont(17, 'bold');

            ctx.fillText(pp.text, x, y);
        }
        ctx.globalAlpha = 1;
        ctx.restore();
    }

    // 屏幕边缘的指向提示：alpha 控制半透明，slot 让多个同类提示在边缘错开、不叠在一起
    function drawDirectionMarker(wx, wy, col, label, alpha, slot) {
        const x = scrX(wx), y = scrY(wy);
        const margin = 54;
        if (x > margin && x < W - margin && y > margin && y < PLAY_H - margin) return;
        const cx = W / 2, cy = PLAY_H / 2;
        let dx = x - cx, dy = y - cy;
        const len = Math.max(1, Math.hypot(dx, dy));
        dx /= len; dy /= len;
        const tx = dx !== 0 ? (W / 2 - margin) / Math.abs(dx) : Infinity;
        const ty = dy !== 0 ? (PLAY_H / 2 - margin) / Math.abs(dy) : Infinity;
        const tt = Math.min(tx, ty);
        const off = (slot || 0) * 26;
        const px = cx + dx * tt - dy * off, py = cy + dy * tt + dx * off;
        const dist = Math.round(len / 10);
        const a = alpha === undefined ? 1 : alpha;
        ctx.save();
        ctx.globalAlpha = a;
        ctx.translate(px, py);
        ctx.rotate(Math.atan2(dy, dx));
        ctx.fillStyle = 'rgba(8,12,22,0.75)';
        ctx.beginPath();
        ctx.arc(0, 0, 17, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.moveTo(11, 0); ctx.lineTo(-7, -8); ctx.lineTo(-7, 8);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        ctx.save();
        ctx.globalAlpha = a;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        setFont(11, 'bold');
        ctx.fillStyle = col;
        ctx.fillText(label + ' ' + dist + 'm', clamp(px + dx * 26, 50, W - 50), clamp(py + dy * 26, 24, PLAY_H - 14));
        ctx.restore();
    }

    // 拾取信标之后的挖掘提示：尘埃特效散去即可再次下铲，进度条与尘土特效同步
function drawDigPrompt() {
    const bc = world.beacon;
    if (!bc || !bc.held) return;
    const dg = world.dig;
    const sig = beaconSignal();
    const pulse = 0.5 + 0.5 * Math.sin(world.t * (3 + 10 * sig));
    const ready = dg.cd <= 0 && !dg.locked;
    const label = dg.locked ? '此处已挖掘完毕'
        : (ready ? ('按 ' + hintConfirm() + ' 尝试挖掘') : '挖掘冷却中…');
    const bw = 300, bh = 44, bx = (W - bw) / 2, by = PLAY_H - 62;
    ctx.save();
    ctx.fillStyle = 'rgba(8,14,26,0.78)';
    roundRectPath(bx, by, bw, bh, 10);
    ctx.fill();
    ctx.strokeStyle = ready ? 'rgba(255,214,102,' + (0.45 + 0.35 * pulse) + ')' : 'rgba(140,200,255,0.22)';
    ctx.lineWidth = 1.6;
    roundRectPath(bx + 0.5, by + 0.5, bw - 1, bh - 1, 9.5);
    ctx.stroke();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    setFont(15, 'bold');
    ctx.fillStyle = ready ? '#ffe066' : 'rgba(200,215,240,0.7)';
    ctx.fillText(label, W / 2, by + 15);
    // 冷却条：与尘土特效共用同一进度，尘土散尽即为就绪
    const k = clamp(1 - dg.dust / DIG_FX, 0, 1);
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    roundRectPath(bx + 16, by + 28, bw - 32, 7, 3.5);
    ctx.fill();
    ctx.fillStyle = ready ? '#9bf6b0' : '#c9b48a';
    roundRectPath(bx + 16, by + 28, Math.max(4, (bw - 32) * k), 7, 3.5);
    ctx.fill();
    ctx.restore();
}

function drawPlay() {
        if (!world) return;
        const p = world.player;
        // 升空拉远 / 着陆推近：整幅场景的镜头缩放
        const lz = world.launch ? launchZoom(world.launch.t)
            : (world.landing ? landingZoom(world.landing.t) : 1);
        viewZoom = lz;
        if (lz < 1) {
            ctx.fillStyle = world.planet.ground;
            ctx.fillRect(0, 0, W, H);
            ctx.save();
            ctx.translate(W / 2, PLAY_H / 2);
            ctx.scale(lz, lz);
            ctx.translate(-W / 2, -PLAY_H / 2);
        }
        drawGround();
        drawDigPits();            // 坑压在地面上，但压在所有景物与人物之下
        if (world.planet.home) drawEarthHub();
        if (world.moonSide === 'near' && world.lander) {
            // 月球正面的登录器遗址进入同一套按 y 排序的队列
            groundProps.push({
                wy: world.lander.y, draw: (function (a, b) {
                    return function () { drawMoonLander(a, b, world.t); };
                })(world.lander.x, world.lander.y)
            });
        }
        // 火箭（含着陆 / 升空动画）同样进入按 y 排序的队列，
        // 排序键取它在地面上的位置，这样地表景物与升降动画保持一致
        // 月球正面没有火箭，整段跳过
        if (world.moonSide === 'near') {
            // 无火箭
        } else if (world.landing) {
            groundProps.push({ wy: world.landing.y, draw: drawLanding });
        } else if (world.launch) {
            groundProps.push({ wy: world.rocket.y, draw: drawLaunchRocket });
        } else {
            const rk = world.rocket, rsx = scrX(rk.x), rsy = scrY(rk.y);
            groundProps.push({
                wy: rk.y, draw: (function (x, y) {
                    return function () { drawRocketAt(x, y, world.rocket.angle, world.t, 0, ROCKET_SCALE); };
                })(rsx, rsy)
            });
        }
        drawGroundProps(false);      // 主角北侧的景物（树 / 纪念碑 / 火箭）
        drawZones();
        drawBlasts();
        drawMarks();
        drawBossWarns();
        drawRelicFx();
        drawDigDust();
        drawFoundItem();
        drawPackages();
        drawOrbs();
        // 范围光影·身前层：拾取高亮 + 闪避圈（跟随主角的身形中心，画在角色之下）
        if (!world.landing && !world.launch) drawRangeRings(W / 2, PLAYER_CY - BODY_OFF, world.t);
        drawBlades();
        drawBeams();
        for (let i = 0; i < world.enemies.length; i++) drawEnemy(world.enemies[i]);
        drawBoss();
        drawBullets();
        if (!world.launch) drawFx();
        // 主角（着陆时未出舱则不画，避免地面上凭空出现人物）
        const flick = p.invuln > 0 && Math.floor(world.t * 18) % 2 === 0;
        const showHero = !world.launch && (!world.landing || world.landing.t > LAND_EXIT);
        if (showHero && !flick) {
            drawAstronaut(W / 2, PLAYER_CY, p.dirIdx, p.walkPhase, p.moving, {
                t: world.t, roll: p.rollT > 0 ? 1 : 0, rollAngle: p.rollAngle,
                rollProg: 1 - p.rollT / ROLL_TIME,
                rollDist: rollDist(p),
                chain: p.chainLv,                      // 电锨翻滚：给翻滚球加上锯齿外圈
                pkg: world.pkg,
                faceSide: p.faceSide
            });
        }
        // 浓烟盖在主角之上（与主角同层绘制），翻腾一阵后逐渐散淡
        if (showHero && !flick) drawDigDustFront();
        // 血量环与脚下充能条都在主角之上，任何时候都看得见
        if (showHero) { drawHpRing(); drawRollCharge(); }
        // 信标漂浮在人物上方，因此画在主角之后，避免被身形与景物挡住
        if (!world.launch && !world.landing) drawBeacon();
        // 主角南侧的景物始终绘制（与主角是否显示无关），保证升降动画期间地表内容完整
        drawGroundProps(true);
        if (lz < 1) { ctx.restore(); viewZoom = 1; }
        if (world.launch) drawLaunchOverlay();
        if (world.landing) drawLandingOverlay();
        // 范围光影·身后层：射程之外径向压暗
        drawRangeShade(W / 2, PLAYER_CY - BODY_OFF);
        if (world.landing) drawLandingFade();
        // 月球正反面互换后的入场黑场
        if (world.fade > 0) {
            ctx.fillStyle = 'rgba(2,3,10,' + (world.fade / MOON_FADE) + ')';
            ctx.fillRect(0, 0, W, H);
        }
        if (!world.over && !world.landing && !world.launch) {
            ctx.save();
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            setFont(12, 'normal');
            ctx.fillStyle = 'rgba(210,225,250,0.40)';
            ctx.fillText(hintMove() + ' 移动　·　' + hintConfirm() + ' 选用道具 / 登船　·　' + hintBack() + ' 翻滚（无敌）', 16, PLAY_H - 14);
            ctx.restore();
            if (world.boss && !world.bossDefeated) drawDirectionMarker(world.boss.x, world.boss.y, '#ff6b6b', 'BOSS');
            if (world.packages.length && !world.quiet) {
                // 所有未拾取的箱子都要有指向提示，多个箱子在边缘错开排列
                for (let i = 0; i < world.packages.length; i++) {
                    const pk = world.packages[i];
                    drawDirectionMarker(pk.x, pk.y,
                        pk.kind === 'weapon' ? '#d0a0ff' : '#ffd966',
                        pk.kind === 'weapon' ? '装备箱' : '道具箱', 0.72, i);
                }
            }
            if ((world.planet.home || world.bossDefeated) && world.moonSide !== 'near') drawDirectionMarker(world.rocket.x, world.rocket.y, '#7cf07c', '火箭');
            if (world.portal) drawDirectionMarker(world.portal.x, world.portal.y, '#c9b3ff', '月球传送门');
            if (world.lander) drawDirectionMarker(world.lander.x, world.lander.y, '#dfe6ff', '登录器遗址');
            if (world.beacon && !world.beacon.held) drawDirectionMarker(world.beacon.x, world.beacon.y, '#ffe066', '信标');
            if (world.found) drawDirectionMarker(world.found.x, world.found.y, world.found.kind === 'gem' ? '#bfe8ff' : '#ffd166', '战利品');
        }
        // 能力数据面板（左上角）和已选道具图标（右下角）
        if (!world.over && !world.landing && !world.launch) {
            drawStatsPanel();
            drawSelectedItems();
            drawDigPrompt();
        }
        drawHudPlay();
        // 地球石柱的说明框：压在最上面
        if (world.planet.home && !world.over && !world.landing && !world.launch) drawColonnadeTip(p);
        // 读漂流瓶里的字条（沿用石柱说明框的样式）
        drawBottleTip();
        // 战备配置菜单（地球 · 补给航天飞船）
        if (world.inv && world.inv.on) drawInvMenu();

        if (world.over) {
            ctx.fillStyle = 'rgba(20,4,8,0.78)';
            ctx.fillRect(0, 0, W, H);
            ctx.save();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            setFont(52, 'bold');
            ctx.fillStyle = '#ff6b6b';
            ctx.fillText('任务失败', W / 2, H / 2 - 40);
            setFont(17, 'normal');
            ctx.fillStyle = 'rgba(255,220,220,0.9)';
            ctx.fillText('本次得分 ' + world.score + '　击杀 ' + world.kills + '　等级 ' + world.level, W / 2, H / 2 + 6);
            setFont(15, 'bold');
            ctx.fillStyle = '#ffe066';
            ctx.fillText('按 ' + hintConfirm() + ' 返回太阳系', W / 2, H / 2 + 54);
            ctx.restore();
        }
    }

// ==================== 场景：着陆 / 起飞 ====================

    // ---------- 着陆（在真实场景内播放） ----------
    const LAND_DESCENT = 1.6, LAND_SETTLE = 2.4, LAND_EXIT = 2.32, LAND_DOOR = 3.5;
    function updateLanding(dt) {
        const L = world.landing;
        const p = world.player;
        L.t += dt;
        const gy = scrY(L.y);
        if (L.t < LAND_DESCENT) {
            const k = easeOutCubic(clamp(L.t / LAND_DESCENT, 0, 1));
            L.drawY = lerp(gy - 300, gy, k);
        } else {
            // 触地：从这一刻起累计，基地标题等界面元素据此延后消失
            world.landed = L.t - LAND_DESCENT;
            if (!L.landedFx) {
                L.landedFx = true;
                for (let i = 0; i < 16; i++) {
                    world.fx.push({
                        kind: 'spark', x: L.x + rand(-46, 46), y: L.y + rand(-8, 10),
                        life: rand(0.4, 0.95), max: 0.95, r: rand(5, 13), col: '#e8e2d0',
                        vx: rand(-140, 140), vy: rand(-70, -12)
                    });
                }
                sfx('land');
            }
            L.drawY = gy;
        }
        // 人物从火箭舱门走出（先被火箭图层遮住，再向右前方走出）
        const k = clamp((L.t - LAND_EXIT) / (LAND_DOOR - LAND_EXIT - 0.18), 0, 1);
        if (L.t > LAND_EXIT) {
            const e = easeOutCubic(k);
            p.x = wrapVal(L.x + 8 + 102 * e, MAP_W);
            p.y = wrapVal(L.y + 28 + 44 * e, MAP_H);
            p.dirIdx = 7;
            p.moving = k < 0.97;
            p.walkPhase += dt * 9;
        } else {
            // 出舱前人物仍留在舱内，贴在舱门处，不站在地面上
            p.x = wrapVal(L.x + 12, MAP_W);
            p.y = wrapVal(L.y + 30, MAP_H);
            p.dirIdx = 7;
            p.moving = false;
        }
        world.cam.x = L.t > LAND_EXIT ? p.x : L.x;
        world.cam.y = L.t > LAND_EXIT ? p.y : L.y;
        if (L.t >= LAND_DOOR) {
            L.done = true;
            world.landing = null;
            p.moving = false;
            sfx('uiSelect');
        }
    }
    function drawLanding() {
        const L = world.landing;
        const gx = scrX(L.x);
        const t = L.t;
        const flame = t < LAND_DESCENT ? 1 : 0.6;
        const RS = ROCKET_SCALE;
        drawRocketAt(gx, L.drawY, world.rocket.angle, t, flame * (t < LAND_DESCENT ? 1 : 0.7), RS);
        // 舱门：LAND_EXIT 起沿舱壁向上滑开，露出暖色舱内
        const dk = t > LAND_EXIT ? clamp((t - LAND_EXIT) / 0.42, 0, 1) : 0;
        if (dk > 0) {
            ctx.save();
            ctx.translate(gx, L.drawY);
            ctx.scale(RS, RS);
            // 舱口（凹进去的暗腔）
            ctx.fillStyle = 'rgba(20,26,40,0.94)';
            roundRectPath(1, -15, 20, 30, 8);
            ctx.fill();
            // 舱内暖光
            const ig = ctx.createLinearGradient(3, 0, 20, 0);
            ig.addColorStop(0, 'rgba(255,196,110,0.6)');
            ig.addColorStop(1, 'rgba(255,140,60,0.14)');
            ctx.fillStyle = ig;
            roundRectPath(3, -13, 16, 26, 7);
            ctx.fill();
            // 滑开的舱门
            ctx.fillStyle = '#b8c2d0';
            roundRectPath(-1, -17 - 15 * dk, 24, 17, 7);
            ctx.fill();
            ctx.strokeStyle = 'rgba(24,32,48,0.55)';
            ctx.lineWidth = 1.2;
            ctx.stroke();
            ctx.restore();
        }
    }
    // 着陆标题：画在缩放变换之外，保证位置和字号不被镜头缩放影响
    function drawLandingOverlay() {
        const L = world.landing;
        const t = L.t;
        ctx.save();
        ctx.globalAlpha = 1 - landingFadeIn(t);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        setFont(30, 'bold');
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 8;
        ctx.fillText(world.planet.name + ' 着陆中', W / 2, 70);
        setFont(14, 'normal');
        ctx.fillStyle = 'rgba(230,240,255,0.85)';
        ctx.fillText(t < LAND_DESCENT ? '进入大气层 · 自动着陆' :
            (t < LAND_SETTLE ? '着陆完成' : '舱门开启 · 准备出舱'), W / 2, 100);
        ctx.restore();
    }
    // 着陆入场：由全黑淡入。画在缩放与暗角之外，保证整屏覆盖
    function drawLandingFade() {
        const a = landingFadeIn(world.landing.t);
        if (a <= 0) return;
        ctx.fillStyle = 'rgba(2,3,10,' + a + ')';
        ctx.fillRect(0, 0, W, H);
    }

// 取消：住船引擎——在真实场景内播放，与着陆对称，保留原游戏画面
    const LAUNCH_BOARD = 0.55, LAUNCH_RISE = 2.9, LAUNCH_DUR = 3.3;
    function launchSequence() {
        if (!world) return;
        // 记下点击瞬间的镜头位置，用于平滑过渡，避免画面跳变
        world.launch = { t: 0, dur: LAUNCH_DUR, camFrom: { x: world.cam.x, y: world.cam.y } };
        sfx('launch');
    }
    function updateLaunch(dt) {
        const L = world.launch;
        L.t += dt;
        // 镜头由人物平滑移到火箭，而不是瞬间跳转
        const ce = easeInOut(clamp(L.t / LAUNCH_BOARD, 0, 1));
        world.cam.x = lerp(L.camFrom.x, world.rocket.x, ce);
        world.cam.y = lerp(L.camFrom.y, world.rocket.y, ce);
        // 尾气与烟尘（升空变慢，密度略提高以保持尾焰连贯）
        if (L.t > LAUNCH_BOARD * 0.8 && Math.random() < dt * 42) {
            world.fx.push({
                kind: 'spark', x: world.rocket.x + rand(-28, 28), y: world.rocket.y + rand(40, 74),
                life: rand(0.35, 0.9), max: 0.9, r: rand(4, 12), col: '#ffd08a'
            });
        }
        for (let i = world.fx.length - 1; i >= 0; i--) {
            const f = world.fx[i];
            f.life -= dt;
            if (f.kind === 'spark') {
                f.x = wrapVal(f.x + (f.vx || 0) * dt, MAP_W);
                f.y = wrapVal(f.y + (f.vy || 0) * dt, MAP_H);
            }
            if (f.life <= 0) world.fx.splice(i, 1);
        }
        if (L.t < L.dur) return;
        world.launch = null;
        scene = 'space';
        sceneT = 0;
        // 月球不在太阳系轨道上：离开月球时飞船停在太阳旁边
        if (world.moonSide) {
            ship.x = SUN.x + 250;
            ship.y = SUN.y - 96;
            ship.ang = -0.6;
            recordRun(world.bossDefeated);
            world = null;
            return;
        }
        const pp = planetPos(PLANET_BY_ID[pendingPlanet ? pendingPlanet.id : 'earth']);
        ship.x = pp.x;
        ship.y = pp.y - 96;
        ship.ang = -0.6;
    }
    // 升空中的火箭与尾焰
    function drawLaunchRocket() {
        const L = world.launch;
        const t = L.t;
        const gx = scrX(world.rocket.x), gy = scrY(world.rocket.y);
        let rise = 0, flame = 0;
        if (t < LAUNCH_BOARD) {
            rise = 0; flame = 0;
        } else if (t < LAUNCH_RISE) {
            rise = launchRise(t);
            flame = 1;
        } else {
            rise = 1;
            flame = 0;
        }
        // 点火到升空全程保持地面上的火箭尺寸，不再缩小
        const shake = t > LAUNCH_BOARD && t < LAUNCH_RISE ? (Math.random() - 0.5) * 4 : 0;
        drawRocketAt(gx + shake, gy - rise * LAUNCH_TRAVEL, world.rocket.angle, t, flame, ROCKET_SCALE);
        for (let i = 0; i < world.fx.length; i++) {
            const f = world.fx[i];
            const x = scrX(f.x), y = scrY(f.y) - rise * LAUNCH_TRAVEL;
            ctx.save();
            ctx.globalAlpha = (1 - f.life / f.max) * 0.8;
            ctx.fillStyle = f.col;
            ctx.beginPath();
            ctx.arc(x, y, f.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }
    // 升空标题与转场：画在缩放变换之外，
    // 否则 fillRect 只会盖住被拉小的中间区域，四周会露出黑边。
    function drawLaunchOverlay() {
        const t = world.launch.t;
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        setFont(26, 'bold');
        ctx.fillStyle = '#eaf4ff';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 8;
        ctx.fillText('升空中', W / 2, 70);
        ctx.restore();
        const a = launchDepart(t);
        if (a <= 0) return;
        ctx.fillStyle = 'rgba(2,3,10,' + a + ')';
        ctx.fillRect(0, 0, W, H);
        if (a > 0.55) {
            ctx.save();
            ctx.globalAlpha = (a - 0.55) / 0.45;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            setFont(26, 'bold');
            ctx.fillStyle = '#eaf4ff';
            ctx.fillText('返回太阳系轨道', W / 2, H / 2);
            ctx.restore();
        }
    }

// ==================== 触屏操作层 ====================
    // 右半屏上下区的分界（画在屏幕上）
    const TOUCH_SPLIT_Y = H * 0.5;
    function touchZoneLabel(cx, cy, label, sub, down, hot) {
        ctx.save();
        ctx.globalAlpha = hot ? 0.55 : 0.22;
        ctx.fillStyle = down ? '#ffe066' : 'rgba(200,220,245,1)';
        ctx.beginPath();
        ctx.arc(cx, cy, 44, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = hot ? 0.95 : 0.55;
        ctx.strokeStyle = down ? '#fff3b0' : 'rgba(210,230,255,0.5)';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.globalAlpha = hot ? 1 : 0.7;
        ctx.fillStyle = down ? '#3a2c00' : '#eaf2ff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        setFont(20, 'bold');
        ctx.fillText(label, cx, cy - 8);
        setFont(11, 'bold');
        ctx.fillText(sub, cx, cy + 14);
        ctx.restore();
    }
    function drawTouchUI() {
        // 右半屏上下区：上 = J，下 = K（任何场景都绘制）
        const jx = W * 0.82, ky = TOUCH_SPLIT_Y + (H - TOUCH_SPLIT_Y) * 0.42;
        const jy = TOUCH_SPLIT_Y * 0.44;
        touchZoneLabel(jx, jy, hintConfirm(), '确认 / 选择', touchBtn.jId >= 0, true);
        touchZoneLabel(jx, ky, hintBack(), '翻滚 / 返回', touchBtn.kId >= 0, true);
        // 分区提示虚线
        ctx.save();
        ctx.globalAlpha = 0.13;
        ctx.strokeStyle = '#cfe4ff';
        ctx.lineWidth = 2;
        ctx.setLineDash([10, 12]);
        ctx.beginPath();
        ctx.moveTo(W * 0.5, 0); ctx.lineTo(W * 0.5, H);
        ctx.moveTo(W * 0.5, TOUCH_SPLIT_Y); ctx.lineTo(W, TOUCH_SPLIT_Y);
        ctx.stroke();
        ctx.restore();
        // 左半屏方向键：按下才显示
        if (!stick.active) return;
        ctx.save();
        ctx.globalAlpha = 0.22;
        ctx.fillStyle = '#8fd6ff';
        ctx.beginPath();
        ctx.arc(stick.ox, stick.oy, STICK_MAX, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(180,225,255,0.55)';
        ctx.lineWidth = 2;
        ctx.stroke();
        // 方向指示
        ctx.globalAlpha = 0.8;
        ctx.strokeStyle = '#bfe9ff';
        ctx.lineWidth = 3;
        for (let d = 0; d < 8; d++) {
            const on = stick.dir === d;
            ctx.globalAlpha = on ? 0.95 : 0.3;
            ctx.beginPath();
            ctx.moveTo(stick.ox + DIRS[d].ix * (STICK_MAX - 16), stick.oy + DIRS[d].iy * (STICK_MAX - 16));
            ctx.lineTo(stick.ox + DIRS[d].ix * (STICK_MAX - 4), stick.oy + DIRS[d].iy * (STICK_MAX - 4));
            ctx.stroke();
        }
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = '#d8f2ff';
        ctx.beginPath();
        ctx.arc(stick.ox + stick.kx, stick.oy + stick.ky, 24, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

// ==================== 主循环 ====================
    function update(dt) {
        sceneT += dt;
        solarT += dt;
        switch (scene) {
            case 'title': sceneTitleUpdate(dt); break;
            case 'settings': sceneSettingsUpdate(dt); break;
            case 'space': sceneSpaceUpdate(dt); break;
            case 'play': updatePlay(dt); break;
        }
        if (scene === 'play' && world && world.over && (edge.KeyJ || pad.aEdge)) {
            recordRun(false);
            scene = 'space';
            sceneT = 0;
            // 月球不在轨道上，失败返回时同样停在太阳旁边
            const dp = world.moonSide ? { x: SUN.x + 250, y: SUN.y - 96 } : planetPos(world.planet);
            ship.x = dp.x;
            ship.y = dp.y - 96;
            ship.ang = -0.6;
            world = null;
        }
        syncBgm();
    }
    function draw() {
        applyCanvasTransform();
        ctx.clearRect(0, 0, W, H);
        switch (scene) {
            case 'title': sceneTitleDraw(); break;
            case 'settings': sceneSettingsDraw(); break;
            case 'space': sceneSpaceDraw(); break;
            case 'play': drawPlay(); break;
        }
        if (save.touchUI && touchSeen) drawTouchUI();
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
    }
    function clearEdges() {
        for (const k in edge) edge[k] = false;
        stick.dirEdge = null;
    }
    let lastTime = 0;
    function gameLoop(ts) {
        if (!lastTime) lastTime = ts;
        let dt = (ts - lastTime) / 1000;
        lastTime = ts;
        if (dt > 0.1) dt = 0.1;
        if (dt < 0.001) dt = 0.001;
        pollGamepad();
        update(dt);
        draw();
        clearEdges();
        requestAnimationFrame(gameLoop);
    }

    // ==================== 初始化 ====================
    detectRoundFont();
    normalizeLoadout();
    updateFullscreenButton();
    resizeCanvas();
    scene = 'title';
    sceneT = 0;
    requestAnimationFrame(() => { resizeCanvas(); requestAnimationFrame(resizeCanvas); });
    requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
