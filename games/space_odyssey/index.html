    // ==================== 道具三选一 ====================
    // 不操作时三个道具静止（一个在头上，两个在身侧），
    // 按 左/右 方向轮换顺序，按 J 确认头顶那个，选完清空。
    // 开启一轮选择（重新计时）
    function openPkg(items) {
        world.pkg = items;
        world.pkgSel = 0;
        world.pkgTimer = PKG_TIME;
    }
    // 结算当前选择：auto 为超时/重复拾取导致的自动选择
    function confirmPkg(auto) {
        if (!world.pkg || !world.pkg.length) { world.pkgTimer = 0; return; }
        const id = world.pkg[world.pkgSel];
        if (auto) addPopup(world.player.x, world.player.y - 66, '超时自动选用：' + ITEM_BY_ID[id].name, '#cfe4ff', true);
        applyItem(id);
        world.pkg = null;
        world.pkgSel = 0;
        world.pkgTimer = 0;
    }
    function rotatePkg(dir) {
        if (!world.pkg || world.pkg.length < 2) return;
        const n = world.pkg.length;
        world.pkgSel = ((world.pkgSel + dir) % n + n) % n;
        sfx('uiMove');
    }
    function updatePkgTimer(dt) {
        if (!world.pkg || !world.pkg.length) return;
        world.pkgTimer -= dt;
        if (world.pkgTimer <= 0) {
            confirmPkg(true);
            // 队列里还有则继续下一轮
            if (world.pkgQueue.length) openPkg(world.pkgQueue.shift());
        }
    }
    function drawPkgRing(px, py, t) {
        const n = world.pkg.length;
        if (!n) return;
        const R = 66;
        const top = world.pkgSel;
        const slots = [];
        slots.push({ id: world.pkg[top], x: px, y: py - 104, top: true });
        if (n > 1) slots.push({ id: world.pkg[(top + 1) % n], x: px + R, y: py - 46, top: false });
        if (n > 2) slots.push({ id: world.pkg[(top + 2) % n], x: px - R, y: py - 46, top: false });
        for (let i = 0; i < slots.length; i++) {
            const sl = slots[i];
            const size = sl.top ? 26 : 17;
            if (sl.top) {
                const g = ctx.createRadialGradient(sl.x, sl.y, 2, sl.x, sl.y, 34);
                g.addColorStop(0, 'rgba(255,255,255,0.42)');
                g.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(sl.x, sl.y, 34, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.save();
            ctx.globalAlpha = sl.top ? 1 : 0.6;
            ctx.fillStyle = 'rgba(12,20,34,0.82)';
            ctx.beginPath();
            ctx.arc(sl.x, sl.y, size * 0.95, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = ITEM_BY_ID[sl.id].color;
            ctx.lineWidth = sl.top ? 3 : 1.5;
            ctx.stroke();
            ctx.restore();
            drawItemIcon(sl.id, sl.x, sl.y, size * 0.86, sl.top ? 1 : 0.78);
            // 方向指示（只在头顶上方画）
            if (sl.top) {
                ctx.save();
                ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 5);
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(sl.x, sl.y - 46);
                ctx.lineTo(sl.x - 7, sl.y - 58);
                ctx.lineTo(sl.x + 7, sl.y - 58);
                ctx.closePath();

        }
        // 左右尖端提示

        ctx.fillStyle = '#cfe4ff';
        ctx.fillText('← 切换 →', px, py - 132);
        ctx.restore();
        // 选择倒计时圆环
        if (world.pkgTimer > 0) {
            const k = clamp(world.pkgTimer / PKG_TIME, 0, 1);
            const low = k < 0.3;
            const cxp = px, cyp = py - 104;
            ctx.save();
            ctx.strokeStyle = 'rgba(255,255,255,0.16)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(cxp, cyp, PKG_TIMER_R, 0, Math.PI * 2);
            ctx.stroke();
            ctx.strokeStyle = low ? 'rgba(255,120,120,' + (0.6 + 0.4 * Math.abs(Math.sin(t * 8))) + ')'
                : 'rgba(255,224,102,0.9)';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(cxp, cyp, PKG_TIMER_R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k);
            ctx.stroke();
            ctx.lineCap = 'butt';
            setFont(11, 'bold');
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = low ? '#ff9b9b' : '#ffe066';
            ctx.fillText(Math.ceil(world.pkgTimer) + 's', cxp, cyp + PKG_TIMER_R + 13);
            ctx.restore();
        }
    }

// ==================== 特效 ====================
    function addFx(o) { world.fx.push(o); }
    function addPopup(x, y, text, col, follow) {
        world.popups.push({ x: x, y: y, text: text, col: col || '#ffd966', life: 1.3, follow: !!follow });
    }
    // 坐标差：MAP_BOUNDED（月球）时不做环绕，直接相减；行星仍是四面环接的
    function wrapDX(wx) { let d = wx - world.cam.x; if (MAP_BOUNDED) return d; const hw = MAP_W / 2; if (d > hw) d -= MAP_W; else if (d < -hw) d += MAP_W; return d; }
    function wrapDY(wy) { let d = wy - world.cam.y; if (MAP_BOUNDED) return d; const hh = MAP_H / 2; if (d > hh) d -= MAP_H; else if (d < -hh) d += MAP_H; return d; }
    function dX(a, b) { let d = a - b; if (MAP_BOUNDED) return d; const hw = MAP_W / 2; if (d > hw) d -= MAP_W; else if (d < -hw) d += MAP_W; return d; }
    function dY(a, b) { let d = a - b; if (MAP_BOUNDED) return d; const hh = MAP_H / 2; if (d > hh) d -= MAP_H; else if (d < -hh) d += MAP_H; return d; }
    function scrX(wx) { return W / 2 + wrapDX(wx); }
    function scrY(wy) { return PLAY_H / 2 + wrapDY(wy); }

    // ==================== 敌人 ====================
    // 杂兵血量 = 触手数量：每 5 级刷新的杂兵 +1 点血
    function enemyStat(tier, kind) {
        const base = 58 + Math.random() * 24;
        const speed = base * (1 + tier * 0.18) * (kind === 'runner' ? 1.5 : 1);
        const hp = 1 + Math.floor(world.level / 5);
        return { speed: speed, hp: hp };
    }
    function spawnEnemy(forcedKind) {
        const p = world.planet;
        if (!p.enemy) return;
        const cam = world.cam;
        const m = 60;
        const side = randInt(0, 3);
        let x = 0, y = 0;
        if (side === 0) { x = cam.x + rand(-W / 2 - m, W / 2 + m); y = cam.y - PLAY_H / 2 - m; }
        else if (side === 1) { x = cam.x + rand(-W / 2 - m, W / 2 + m); y = cam.y + PLAY_H / 2 + m; }
        else if (side === 2) { x = cam.x - W / 2 - m; y = cam.y + rand(-PLAY_H / 2 - m, PLAY_H / 2 + m); }
        else { x = cam.x + W / 2 + m; y = cam.y + rand(-PLAY_H / 2 - m, PLAY_H / 2 + m); }
        let kind = 'grunt';
        if (world.tier >= 1 && Math.random() < 0.28) kind = 'runner';
        // 5 级后小概率出现远程射击敌人
        if (world.level >= 5 && Math.random() < 0.10 + (world.level - 5) * 0.012) kind = 'ranged';
        if (forcedKind) kind = forcedKind;
        const st = enemyStat(world.tier, kind);
        world.enemies.push({
            x: wrapVal(x, MAP_W), y: wrapVal(y, MAP_H),
            hp: st.hp, maxHp: st.hp, speed: st.speed, kind: kind,
            r: kind === 'runner' ? 13 : (kind === 'ranged' ? 17 : 16),
            ph: Math.random() * Math.PI * 2,
            flash: 0, cd: rand(1.0, 2.6), ang: Math.random() * Math.PI * 2,
            stun: 0, rollHit: 0, rollPush: 0,        // 硬直时长 / 本次翻滚的结算标记
            pushX0: 0, pushY0: 0, pushDx: 0, pushDy: 0, pushT: 0   // 被弹开的起点与推退位移
        });
    }

    function drawEnemy(e) {
        const x = scrX(e.x), y = scrY(e.y);
        const m = 60 / viewZoom;
        if (x < -m || x > W + m || y < -m || y > PLAY_H + m) return;
        const p = world.planet;
        const c = p.enemy;
        ctx.save();
        ctx.translate(x, y);
        // 影子
        ctx.globalAlpha = 0.25;
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.ellipse(3, e.r * 0.72, e.r * 0.85, e.r * 0.36, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        const wob = Math.sin(world.t * 6 + e.ph) * 0.10;
        if (e.kind === 'runner') {
            ctx.rotate(wob * 2);
            ctx.fillStyle = e.flash > 0 ? '#ffffff' : c.body;
            ctx.beginPath();
            ctx.moveTo(e.r * 1.15, 0);
            ctx.lineTo(-e.r * 0.6, -e.r * 0.85);
            ctx.lineTo(-e.r * 0.2, 0);
            ctx.lineTo(-e.r * 0.6, e.r * 0.85);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = c.dark;
            ctx.beginPath();
            ctx.moveTo(-e.r * 0.6, 0);
            ctx.lineTo(-e.r * 1.15, -e.r * 0.5);
            ctx.lineTo(-e.r * 1.15, e.r * 0.5);
            ctx.closePath();
            ctx.fill();
        } else if (e.kind === 'ranged') {
            ctx.fillStyle = e.flash > 0 ? '#ffffff' : c.dark;
            ctx.beginPath();
            ctx.ellipse(0, 0, e.r * 1.05, e.r * 1.15, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = e.flash > 0 ? '#ffffff' : c.body;
            ctx.beginPath();
            ctx.ellipse(0, -e.r * 0.2, e.r * 0.8, e.r * 0.8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.fillRect(-e.r * 0.9, e.r * 0.35, e.r * 1.8, e.r * 0.22);
        } else {
            ctx.rotate(wob);
            ctx.fillStyle = e.flash > 0 ? '#ffffff' : c.body;
            ctx.beginPath();
            ctx.ellipse(0, 0, e.r * 1.05, e.r * 1.15, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = c.dark;
            ctx.beginPath();
            ctx.ellipse(0, e.r * 0.28, e.r * 0.72, e.r * 0.5, 0, 0, Math.PI * 2);
            ctx.fill();
        }
        // 触手数量 = 当前血量（不再画血条）
        const tn = clamp(e.hp, 1, 9);
        ctx.strokeStyle = e.flash > 0 ? '#ffffff' : c.dark;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        for (let i = 0; i < tn; i++) {
            const a = tn === 1 ? -Math.PI / 2
                : (-Math.PI * 0.78 + (i / (tn - 1)) * Math.PI * 1.56 + wob * 2);
            const tx = Math.cos(a) * e.r * 1.38, ty = Math.sin(a) * e.r * 1.42 - 3;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * e.r * 0.66, Math.sin(a) * e.r * 0.72);
            ctx.lineTo(tx, ty);
            ctx.stroke();
            ctx.fillStyle = e.flash > 0 ? '#ffffff' : c.eye;
            ctx.beginPath();
            ctx.arc(tx, ty, 2.6, 0, Math.PI * 2);
            ctx.fill();
        }
        // 眼睛
        if (e.kind !== 'runner') {
            const dirX = dX(world.player.x, e.x);
            const dirY = dY(world.player.y, e.y);
            const m = Math.max(1, Math.hypot(dirX, dirY));
            const ex = dirX / m * e.r * 0.34, ey = dirY / m * e.r * 0.3 - e.r * 0.16;
            ctx.fillStyle = e.flash > 0 ? '#ff4444' : c.eye;
            ctx.beginPath();
            ctx.arc(ex - 3, ey, 3, 0, Math.PI * 2);
            ctx.arc(ex + 3, ey, 3, 0, Math.PI * 2);
            ctx.fill();
        }
        // 硬直状态：头顶三个小星星置旋，让“被打晕”一眼可辨
        if (e.stun > 0) {
            const sa = world.t * 7 + e.ph;
            for (let i2 = 0; i2 < 3; i2++) {
                const a2 = sa + i2 * TAU / 3;
                const sx2 = Math.cos(a2) * e.r * 0.62;
                const sy2 = -e.r * 1.25 + Math.sin(a2) * 3.2;
                ctx.globalAlpha = 0.9;
                ctx.fillStyle = '#fff0a8';
                ctx.beginPath();
                ctx.arc(sx2, sy2, 2.2, 0, TAU);
                ctx.fill();
                ctx.globalAlpha = 0.45;
                ctx.fillStyle = '#ffd24a';
                ctx.beginPath();
                ctx.arc(sx2, sy2, 4.4, 0, TAU);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }
        ctx.restore();
    }

    function killEnemy(e, i, gainXp) {
        world.enemies.splice(i, 1);
        world.kills++;
        world.score += 10 + world.tier * 5;
        const val = e.kind === 'ranged' ? 3 : (e.kind === 'runner' ? 2 : 1);
        world.orbs.push({ x: e.x, y: e.y, val: gainXp === false ? 0 : val, ph: Math.random() * 6, homing: false, age: 0 });
        addFx({ kind: 'boom', x: e.x, y: e.y, life: 0.36, max: 0.36, r: e.r * 2.2, col: world.planet.accent });
        sfx('enemyDie');
    }

    function damagePlayer(dmg, fromX, fromY) {
        const p = world.player;
        if (p.invuln > 0 || p.rollT > 0 || world.over || world.bossDefeated) return;
        p.hp -= dmg;
        p.invuln = 1.5;
        p.hitFlash = 0.35;
        addFx({ kind: 'boom', x: p.x, y: p.y, life: 0.3, max: 0.3, r: 40, col: '#ff6b6b' });
        sfx('hurt');
        if (fromX !== undefined) {
            const dx = dX(p.x, fromX), dy = dY(p.y, fromY);
            const m = Math.max(1, Math.hypot(dx, dy));
            p.x = wrapVal(p.x + dx / m * 34, MAP_W);
            p.y = wrapVal(p.y + dy / m * 34, MAP_H);
        }
        if (p.hp <= 0) {
            p.hp = 0;
            world.over = true;
            sfx('explode');
        }
    }

    // ==================== BOSS ====================
    function spawnBoss() {
        const p = world.planet;
        if (!p.boss) return;
        const cam = world.cam;
        world.boss = {
            x: wrapVal(cam.x + W / 2 + 90, MAP_W),
            y: wrapVal(cam.y, MAP_H),
            hp: 50, maxHp: 50,
            r: 54,
            ang: Math.PI,
            speed: 54 + world.tier * 10,
            cd: 2.0, cd2: 3.4,
            ph: 0, flash: 0, hurtT: 0, dying: 0
        };
        world.bossDefeated = false;
        sfx('boss');
        addPopup(wrapDX(world.boss.x) + W / 2, wrapDY(world.boss.y) + PLAY_H / 2 - 70, '警报：' + p.boss, '#ff6b6b');
    }

    function bossShootBullet(x, y, ang, spd, r, col, homing) {
        world.enemyBullets.push({
            x: wrapVal(x, MAP_W), y: wrapVal(y, MAP_H),
            vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
            r: r || 6, life: 5.5, col: col || world.planet.accent, homing: homing || 0, ph: Math.random() * 6
        });
    }
    function bossAddZone(x, y, r, type, life) {
        world.zones.push({ x: wrapVal(x, MAP_W), y: wrapVal(y, MAP_H), r: r, type: type, life: life || 7, tick: 0, ph: Math.random() * 6 });
    }
    function zoneWarnColor(type) {
        if (type === 'slow') return '#8fd8ff';
        if (type === 'fire') return '#ff9d5c';
        return '#b6ff6b';
    }
    // BOSS 特殊攻击：先把攻击范围画成预警图形倒计时，预警走完才真正发动，留下躲避窗口
    function queueBossAbility(abil, b, p) {
        const span = BOSS_WARN_TIME;
        const px3 = wrapVal(p.x + rand(-90, 90), MAP_W);
        const py3 = wrapVal(p.y + rand(-90, 90), MAP_H);
        const zones = [];
        const warns = [];
        let fire = null;
        switch (abil) {
            case 'water':
                zones.push({ x: px3, y: py3, r: rand(95, 150), type: 'slow', life: 8 });
                zones.push({ x: wrapVal(p.x, MAP_W), y: wrapVal(p.y, MAP_H), r: rand(90, 130), type: 'slow', life: 7 });
                break;
            case 'acid':
                zones.push({ x: px3, y: py3, r: rand(70, 100), type: 'acid', life: 8 });
                zones.push({ x: wrapVal(b.x, MAP_W), y: wrapVal(b.y, MAP_H), r: 120, type: 'acid', life: 5 });
                break;
            case 'fire':
                zones.push({ x: px3, y: py3, r: rand(60, 85), type: 'fire', life: 6.5 });
                zones.push({ x: wrapVal(p.x + rand(-150, 150), MAP_W), y: wrapVal(p.y + rand(-150, 150), MAP_H), r: rand(55, 80), type: 'fire', life: 5.5 });
                zones.push({ x: wrapVal(p.x + rand(-200, 200), MAP_W), y: wrapVal(p.y + rand(-200, 200), MAP_H), r: rand(48, 70), type: 'fire', life: 5 });
                break;
            case 'thunder':
                warns.push({ kind: 'circle', x: px3, y: py3, r: 62, col: '#ffe066' });
                fire = function () { world.marks.push({ kind: 'strike', x: px3, y: py3, r: 62, life: 0.85, max: 0.85 }); };
                break;
            case 'blade':
                warns.push({ kind: 'ring', x: b.x, y: b.y, r: 118, col: '#ffe9b8' });
                fire = function () { world.blades.push({ x: b.x, y: b.y, ang: b.ang, spin: 2.5, life: 7, r: 118, hitT: 0, n: 2 }); };
                break;
            case 'laser': {
                const ang = Math.atan2(dY(p.y, b.y), dX(p.x, b.x)) + rand(-0.5, 0.5);
                warns.push({ kind: 'beam', x: b.x, y: b.y, ang: ang, len: 1800, width: 26, col: '#ff8fd0' });
                fire = function () { world.beams.push({ x: b.x, y: b.y, ang: ang, warn: 0, life: 0.55, width: 26, len: 1800, hitT: 0 }); };
                break;
            }
            case 'homing': {
                const ph = b.ph * 2;
                for (let i = 0; i < 4; i++) warns.push({ kind: 'spoke', x: b.x, y: b.y, ang: ph + i * Math.PI / 2, len: 300, col: '#bfe8ff' });
                fire = function () {
                    for (let i = 0; i < 4; i++) bossShootBullet(b.x, b.y, ph + i * Math.PI / 2, 130, 8, '#bfe8ff', 1.5);
                };
                break;
            }
            case 'summon':
                warns.push({ kind: 'ring', x: b.x, y: b.y, r: 170, col: '#c58cff' });
                fire = function () {
                    spawnEnemy('grunt'); spawnEnemy('runner');
                    world.marks.push({ kind: 'pulse', x: b.x, y: b.y, r: 0, life: 1.1, max: 1.1, speed: 300 });
                };
                break;
        }
        for (let i = 0; i < zones.length; i++) {
            warns.push({ kind: 'circle', x: zones[i].x, y: zones[i].y, r: zones[i].r, col: zoneWarnColor(zones[i].type) });
        }
        if (!fire && !zones.length) return;
        for (let i = 0; i < warns.length; i++) { warns[i].t = span; warns[i].max = span; world.warns.push(warns[i]); }
        world.pend.push({
            t: span, max: span,
            fire: function () {
                if (fire) fire();
                for (let i = 0; i < zones.length; i++) bossAddZone(zones[i].x, zones[i].y, zones[i].r, zones[i].type, zones[i].life);
                sfx(abil === 'laser' ? 'laser' : 'hit');
            }
        });
    }
    // BOSS 技能预警图形：红色虚线范围 + 收拢的内环，临近发动时闪烁加快
    function drawBossWarns() {
        for (let i = 0; i < world.warns.length; i++) {
            const w = world.warns[i];
            const k = clamp(w.t / w.max, 0, 1);
            const x = scrX(w.x), y = scrY(w.y);
            const m = 2200 / viewZoom;
            if (x < -m || x > W + m || y < -m || y > PLAY_H + m) continue;
            const fast = 8 + 16 * (1 - k);
            const pulse = 0.5 + 0.5 * Math.sin(world.t * fast);
            const near = 0.55 + 0.35 * k;
            ctx.save();
            if (w.kind === 'circle') {
                const g = ctx.createRadialGradient(x, y, w.r * 0.2, x, y, w.r);
                g.addColorStop(0, hexA(w.col, 0.16 * near));
                g.addColorStop(1, hexA(w.col, 0));
                ctx.fillStyle = g;
                ctx.beginPath(); ctx.arc(x, y, w.r, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = hexA(w.col, 0.55 + 0.35 * pulse);
                ctx.lineWidth = 2.6;
                ctx.setLineDash([13, 10]);
                ctx.lineDashOffset = -world.t * 46;
                ctx.beginPath(); ctx.arc(x, y, w.r, 0, Math.PI * 2); ctx.stroke();
                ctx.setLineDash([]);
                ctx.strokeStyle = hexA(w.col, 0.85);
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(x, y, w.r * (1 - k) * 0.96 + w.r * 0.04, 0, Math.PI * 2); ctx.stroke();
            } else if (w.kind === 'ring') {
                ctx.strokeStyle = hexA(w.col, 0.6 + 0.3 * pulse);
                ctx.lineWidth = 5;
                ctx.setLineDash([26, 18]);
                ctx.lineDashOffset = world.t * 60;
                ctx.beginPath(); ctx.arc(x, y, w.r * (0.25 + 0.75 * (1 - k)), 0, Math.PI * 2); ctx.stroke();
                ctx.setLineDash([]);
                ctx.strokeStyle = hexA(w.col, 0.75);
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(x, y, w.r, 0, Math.PI * 2); ctx.stroke();
            } else if (w.kind === 'beam') {
                ctx.translate(x, y);
                ctx.rotate(w.ang);
                ctx.strokeStyle = hexA(w.col, 0.30 + 0.30 * pulse);
                ctx.lineWidth = 2.4;
                ctx.setLineDash([16, 13]);
                ctx.lineDashOffset = -world.t * 70;
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(w.len, 0); ctx.stroke();
                ctx.setLineDash([]);
                ctx.strokeStyle = hexA(w.col, 0.75);
                ctx.lineWidth = w.width * (0.3 + 0.7 * k);
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(w.len, 0); ctx.stroke();
            } else if (w.kind === 'spoke') {
                ctx.translate(x, y);
                ctx.rotate(w.ang);
                ctx.strokeStyle = hexA(w.col, 0.45 + 0.35 * pulse);
                ctx.lineWidth = 4;
                ctx.setLineDash([10, 16]);
                ctx.lineDashOffset = -world.t * 120;
                ctx.beginPath(); ctx.moveTo(24, 0); ctx.lineTo(w.len * (0.2 + 0.8 * k), 0); ctx.stroke();
                ctx.setLineDash([]);
                ctx.strokeStyle = hexA(w.col, 0.8);
                ctx.lineWidth = 2.4;
                ctx.beginPath(); ctx.arc(w.len * k, 0, 9, 0, Math.PI * 2); ctx.stroke();
            }
            ctx.restore();
        }
    }

    function bossUpdate(dt) {
        const b = world.boss;
        if (!b) return;
        if (world.bossDefeated) {
            // 击败后完全静止：不再位移、不再旋转，只让受击闪光消退
            if (b.flash > 0) b.flash -= dt;
            if (b.hurtT > 0) b.hurtT -= dt;
            return;
        }
        const p = world.player;
        const dx = dX(p.x, b.x), dy = dY(p.y, b.y);
        const d = Math.max(1, Math.hypot(dx, dy));
        b.ph += dt;
        // 保持中距离游走
        const want = 250;
        const moveDir = d < want - 40 ? -1 : (d > want + 60 ? 1 : 0);
        const wob = Math.sin(b.ph * 0.9) * 0.9;
        const mx = (dx / d), my = (dy / d);
        const px2 = -my, py2 = mx;
        const sp = b.speed;
        b.x = wrapVal(b.x + (mx * moveDir + px2 * wob) * sp * dt, MAP_W);
        b.y = wrapVal(b.y + (my * moveDir + py2 * wob) * sp * dt, MAP_H);
        b.ang += (angDiff(Math.atan2(dy, dx), b.ang)) * Math.min(1, dt * 3);
        b.cd -= dt;
        b.cd2 -= dt;
        if (b.flash > 0) b.flash -= dt;
        if (b.hurtT > 0) b.hurtT -= dt;

        const abil = world.planet.ability;
        // 普通弹幕
        if (b.cd <= 0) {
            b.cd = 2.2 - world.tier * 0.14;
            const base = Math.atan2(dy, dx);
            const n = 3 + world.tier;
            for (let i = 0; i < n; i++) {
                const a = base + (i - (n - 1) / 2) * 0.22;
                bossShootBullet(b.x, b.y, a, 190 + world.tier * 18, 6.5, world.planet.accent);
            }
        }
        if (b.cd2 <= 0) {
            b.cd2 = 5.2 - world.tier * 0.5;
            queueBossAbility(abil, b, p);
        }
    }

    function drawBoss() {
        const b = world.boss;
        if (!b) return;
        const x = scrX(b.x), y = scrY(b.y);
        const m = 140 / viewZoom;
        if (x < -m || x > W + m || y < -m || y > PLAY_H + m) return;
        const c = world.planet.bossCol;
        const t = world.t;
        ctx.save();
        ctx.translate(x, y);
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.ellipse(4, b.r * 0.8, b.r * 0.95, b.r * 0.34, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.rotate(b.ang);
        const flash = b.flash > 0;
        // 主体
        ctx.fillStyle = flash ? '#ffffff' : c.dark;
        ctx.beginPath();
        ctx.ellipse(0, 0, b.r * 1.05, b.r * 0.92, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = flash ? '#ffffff' : c.body;
        ctx.beginPath();
        ctx.ellipse(-b.r * 0.08, -b.r * 0.12, b.r * 0.78, b.r * 0.68, 0, 0, Math.PI * 2);
        ctx.fill();
        // 甲壳纹路
        ctx.strokeStyle = 'rgba(0,0,0,0.25)';
        ctx.lineWidth = 3;
        for (let i = 0; i < 3; i++) {
            ctx.beginPath();
            ctx.arc(-b.r * 0.1, -b.r * 0.1, b.r * (0.3 + i * 0.16), -0.8, 0.8);
            ctx.stroke();
        }
        // 眼睛
        ctx.fillStyle = flash ? '#ff5555' : c.eye;
        ctx.beginPath();
        ctx.ellipse(b.r * 0.52, -b.r * 0.22, 6.5, 8, 0, 0, Math.PI * 2);
        ctx.ellipse(b.r * 0.52, b.r * 0.26, 5, 6.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.beginPath();
        ctx.ellipse(b.r * 0.56, -b.r * 0.22, 2.4, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        // 尖刺
        ctx.fillStyle = flash ? '#ffffff' : shade(c.dark, -0.2);
        for (let i = 0; i < 6; i++) {
            const a = -Math.PI * 0.85 + i * (Math.PI * 1.7 / 5);
            ctx.save();
            ctx.rotate(a);
            ctx.beginPath();
            ctx.moveTo(b.r * 0.9, -7);
            ctx.lineTo(b.r * 1.32, 0);
            ctx.lineTo(b.r * 0.9, 7);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }
        ctx.restore();
        // 核心
        ctx.save();
        // 击败后核心停止脉动
        ctx.globalAlpha = world.bossDefeated ? 0.25 : 0.55 + 0.3 * Math.sin(t * 5);
        const g = ctx.createRadialGradient(x, y, 4, x, y, b.r * 1.5);
        g.addColorStop(0, world.bossDefeated ? '#5a5f6a' : c.eye);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, b.r * 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    // ==================== 玩家动作 ====================
    function applyItem(id) {
        const p = world.player;
        world.stats.items[id] = (world.stats.items[id] || 0) + 1;
        // 星球特色装备：首次获得直接生效，重复拾取逐级扩大特效范围
        const relic = RELIC_BY_ITEM[id];
        if (relic) {
            const lv = (p.relics[relic.id] || 0) + 1;
            p.relics[relic.id] = lv;
            addPopup(p.x, p.y - 30, lv === 1 ? ('获得 ' + relic.name + '！') : (relic.tag + '范围 +' + relic.stepR), relic.col, true);
            if (lv > 1) {
                for (let i = 0; i < 8; i++) {
                    addFx({ kind: 'spark', x: p.x + rand(-22, 22), y: p.y + rand(-18, 18), life: 0.4, max: 0.4, r: rand(3, 7), col: relic.col });
                }
            }
            sfx('item');
            return;
        }
        switch (id) {
            case 'heart':
                if (p.hp < p.maxHp) { p.hp++; addPopup(p.x, p.y - 30, '+1 生命', '#ff8fa3', true); }
                else { world.score += 50; addPopup(p.x, p.y - 30, '+50 分数', '#ffd966', true); }
                break;
            // 以下增益一律按「基础值的固定百分比」递增，第 n 件 = n × 百分比，
            // 因此数值来自已拾取个数 n，不在当前值上复利
            case 'shoes':
                p.speedMul += SPEED_STEP;
                addPopup(p.x, p.y - 30, '移动速度 +基础值 ' + Math.round(SPEED_STEP * 100) + '%', '#5ad2a0', true);
                break;
            case 'magnet': {
                // 每件把「初始值」抬高 50%（初始值本身会被神秘核心抬到 200，所以此时是 +100）
                const add = pickupBase(p) * PICKUP_STEP_R;
                p.pickupBonus += add;
                addPopup(p.x, p.y - 30, '拾取范围 +' + add, '#6fb7ff', true);
                break;
            }
            case 'dodge':
                p.dodgeLv++;
                addPopup(p.x, p.y - 30, '闪避距离 +' + ROLL_DIST_STEP, '#7ce0ff', true);
                break;
            case CHAIN_ID:
                // 首件：翻滚距离翻倍、取消弹开、对路径上的敌人造成攻击力 ×2 的伤害；
                // 之后每件再 +1 倍
                p.chainLv++;
                addPopup(p.x, p.y - 30, '电锨翻滚 ×' + chainMul(p), '#cfe4ff', true);
                break;
            case 'rate': {
                const old = p.fireCdMs;
                p.fireCdMs = Math.max(RATE_MIN_MS, Math.round(FIRE_CD_MS * (1 - RATE_STEP * itemCount(id))));
                addPopup(p.x, p.y - 30, '射击间隔 -' + (old - p.fireCdMs) + ' ms', '#ffc857', true);
                break;
            }
            case 'multi':
                p.bullets += 1;
                p.weapon = 'multi';
                addPopup(p.x, p.y - 30, '子弹 +1 发', '#c58cff', true);
                break;
            case 'dmg':
                p.dmg += 1;
                addPopup(p.x, p.y - 30, '攻击力 +1', '#ff8080', true);
                break;
            case 'scope':
                p.fireBonus += FIRE_STEP;
                addPopup(p.x, p.y - 30, '射击范围 +' + FIRE_STEP, '#9fe0a8', true);
                break;
            case 'rollcd': {
                const oldT = rollCdTime(p);
                p.rollCdMul = rollCdMulFor(itemCount(id));
                addPopup(p.x, p.y - 30, '闪避冷却 -' + (oldT - rollCdTime(p)).toFixed(2) + ' s', '#dfe8f5', true);
                break;
            }
            case 'boom': {
                const first = p.boomLv <= 0;
                p.boomLv++;
                addPopup(p.x, p.y - 30, first ? '获得爆炸子弹' : ('爆炸范围 +' + BOOM_STEP_R), '#ff9f43', true);
                break;
            }
            case CHEAT_ITEM_ID:
                // 立刻把拾取范围扩到「当前的」射击距离并就此定格：
                // 之后射击距离再被瞄镜推高，也不会再带着拾取范围一起涨
                p.dmg += CHEAT_DMG;
                if (!p.cheat) p.cheatPickup = fireRangeOf(p);
                p.cheat++;
                addPopup(p.x, p.y - 30, '神秘核心：攻击力 +' + CHEAT_DMG, '#ffd24a', true);
                break;
        }
        sfx('item');
    }

// 已拾取的道具个数（含本次），用来按「基础值 × 固定百分比 × 个数」算最终数值
function itemCount(id) { return world.stats.items[id] || 0; }
// 拾取范围的初始值：平时是 PICKUP_BASE；拿到神秘核心时定格为「当时的射击距离」
function pickupBase(p) { return p.cheat ? p.cheatPickup : PICKUP_BASE; }
    // 拾取范围与射击距离各自独立计算：
    //   拾取范围 = 初始值 + 磁力线圈加成（只有拾取类道具能推高它）
    //   射击距离 = 初始距离 + 远射瞄镜加成（只有射程类道具能推高它）
    function pickupRange(p) { return pickupBase(p) + p.pickupBonus; }
    function fireRangeOf(p) { return FIRE_RANGE + p.fireBonus; }
    // 翻滚冷却：每件冷却模块降低基础冷却时间的 15%，封顶为基础值的 15%
    function rollCdMulFor(n) { return Math.max(ROLLCD_MIN, Math.round((1 - ROLLCD_STEP * n) * 100) / 100); }
    function rollCdTime(p) { return ROLL_CD * p.rollCdMul; }
    // 闪避距离：按下 K 后向当前方向滚动的总距离（初始 150，每件闪避增长 +50；电锯翻滚再翻倍）
function rollDist(p) { return ROLL_DIST_BASE + p.dodgeLv * ROLL_DIST_STEP; }
    // 硬直：被弹开或被攻击打中时短暂停止行为（死了就不管）
    function stunEnemy(e, t) { if (e.hp > 0) e.stun = Math.max(e.stun || 0, Math.max(t, ROLL_PUSH_TIME + 0.08)); }
    // 被弹开：不是一款落地，而是一段逐步减速的推退（总位移约 dist），并带硬直
    function knockEnemy(e, dx, dy, dist) {
        const d = Math.hypot(dx, dy);
        if (d < 0.01) return;
        e.pushX0 = e.x;
        e.pushY0 = e.y;
        e.pushDx = dx / d * dist;      // 推退位移量（已计入地图围绕的最短方向）
        e.pushDy = dy / d * dist;
        e.pushT = ROLL_PUSH_TIME;
        e.ang = Math.atan2(dy, dx);
        stunEnemy(e, ROLL_STUN);
    }
    // 翻滚终点的范围性推开：翻滚刚结束的那一帧把周边怪物一弹开并硬直
    function rollEndPush(p) {
        for (let i = world.enemies.length - 1; i >= 0; i--) {
            const e = world.enemies[i];
            const dx = dX(p.x, e.x), dy = dY(p.y, e.y);
            const d = Math.hypot(dx, dy);
            if (d >= ROLL_END_R || d < 0.01) continue;
            // dx, dy 指向人物，取反才是偏离人物的方向
            knockEnemy(e, -dx, -dy, ROLL_END_D);
            addFx({ kind: 'spark', x: e.x, y: e.y, life: 0.32, max: 0.32, r: 20, col: '#9fd8ff' });
        }
    }
    // 电锨伤害倍率
    function chainMul(p) { return p.chainLv > 0 ? CHAIN_BASE_MUL + p.chainLv - 1 : 0; }

    // J：选用头顶道具（BOSS 击败后依然可以选择已拾取的补给箱）
    function handleAction() {
        if (world.over) return;
        if (world.pkg && world.pkg.length) {
            confirmPkg(false);
            if (world.pkgQueue.length) openPkg(world.pkgQueue.shift());
        }
    }

    // K：翻滚（无敌），冷却 3 秒，方向按当前移动方向，位移距离 = rollDist(p)（初始 150，每件闪避增长 +50）
    // 战斗结束（BOSS 已击败）后依然可以翻滚
    function tryRoll() {
        const p = world.player;
        if (world.over) return;
        if (p.rollCd > 0 || p.rollT > 0) return;
        p.rollT = ROLL_TIME;
        p.rollCd = rollCdTime(p);
        p.rollAngle = 0;
        p.rollId++;         // 本次翻滚的编号：用来保证同一只怪在一次翻滚里只被结算一次
        // 按当前移动方向滚动：优先使用移动方向，如果没有移动则使用朝向
        const mv = moveVector();
        let dirIdx;
        if (mv.x || mv.y) {
            dirIdx = dirFromVec(mv.x, mv.y);
        } else {
            dirIdx = p.moveDirIdx;
        }
        p.rollDir = dirIdx;
        const d = DIRS[dirIdx];
        const v = rollDist(p) / ROLL_TIME;
        p.rollVX = d.ix * v;
        p.rollVY = d.iy * v;
        p.dirIdx = dirIdx;            // 滚动时朝向也同步
        p.moveDirIdx = dirIdx;
        rememberFaceSide(p, dirIdx);
        sfx('roll');
        for (let i = 0; i < 6; i++) {
            addFx({
                kind: 'spark', x: p.x + rand(-14, 14), y: p.y + rand(-10, 10),
                life: 0.4, max: 0.4, r: rand(3, 7), col: '#ffffff'
            });
        }
    }

function boomRadius(lv) { return lv > 0 ? BOOM_BASE_R + (lv - 1) * BOOM_STEP_R : 0; }

// ==================== 星球特色装备特效 ====================
// 招式复刻对应星球 BOSS 的攻击，但由玩家发动、且只作用于敌人：
// 触发即生效，不需要 BOSS 那样的范围预警。
function relicRadius(r, lv) { return lv > 0 ? r.baseR + (lv - 1) * r.stepR : 0; }
function relicHit(f, e) {
    if (f.shape === 'circle') return Math.hypot(dX(e.x, f.x), dY(e.y, f.y)) < f.r + e.r;
    if (f.shape === 'ring') return Math.abs(Math.hypot(dX(e.x, f.x), dY(e.y, f.y)) - f.r) < 16 + e.r;
    if (f.shape === 'pulse') {
        const rr = Math.abs(Math.hypot(dX(e.x, f.x), dY(e.y, f.y)) - f.r);
        return rr < 26 + e.r;
    }
    if (f.shape === 'ray') {
        const dx = dX(e.x, f.x), dy = dY(e.y, f.y);
        const proj = dx * Math.cos(f.ang) + dy * Math.sin(f.ang);
        const perp = Math.abs(-dx * Math.sin(f.ang) + dy * Math.cos(f.ang));
        return proj > 0 && proj < f.len && perp < f.width * 0.5 + e.r;
    }
    return false;
}
function relicHurt(f) {
    for (let i = world.enemies.length - 1; i >= 0; i--) {
        const e = world.enemies[i];
        if (!relicHit(f, e)) continue;
        e.hp -= f.dmg; e.flash = 0.16; stunEnemy(e, HIT_STUN);
        if (e.hp <= 0) killEnemy(e, i);
    }
}
// 迟滞类特效（水星装备的水洼）额外拖慢范围内的敌人
function relicSlowAt(e) {
    let s = 1;
    for (let i = 0; i < world.rFx.length; i++) {
        const f = world.rFx[i];
        if (!f.slow) continue;
        if (Math.hypot(dX(e.x, f.x), dY(e.y, f.y)) < f.r + e.r) s = Math.min(s, 0.45);
    }
    return s;
}
function relicTarget() { return world.enemies.length ? pick(world.enemies) : null; }
    // 地面类招式（水幕 / 酸池 / 地火）：跟着子弹的命中点走，不再随开火自行选目标
    const RELIC_GROUND = { water: 1, acid: 1, fire: 1 };
    function relicGroundCount(abil) {
        let n = 0;
        for (let i = 0; i < world.rFx.length; i++) if (world.rFx[i].abil === abil) n++;
        return n;
    }
    function spawnRelicGround(r, lv, hx, hy) {
        const R = relicRadius(r, lv);
        const common = { shape: 'circle', abil: r.abil, col: r.col, x: wrapVal(hx, MAP_W), y: wrapVal(hy, MAP_H), r: R, life: 0, dmg: 0, tick: 0 };
        if (r.abil === 'water') { common.life = 4.2; common.slow = true; world.rFx.push(common); return; }
        if (r.abil === 'acid') { common.life = 4.2; common.dmg = 1; common.tick = 0.7; world.rFx.push(common); return; }
        common.life = 3.4; common.dmg = 1; common.tick = 0.5;
        world.rFx.push(common);
    }
    // 子弹击中敌人的瞬间，在命中位置生成所有已装备的地面类特效
    function triggerGroundRelic(hx, hy) {
        for (let i = 0; i < RELICS.length; i++) {
            const r = RELICS[i];
            if (!RELIC_GROUND[r.abil]) continue;
            const lv = world.player.relics[r.id];
            if (!lv) continue;
            if ((world.relicT[r.id] || 0) > 0) continue;
            if (relicGroundCount(r.abil) >= 8) continue;
            world.relicT[r.id] = r.hitCd;
            spawnRelicGround(r, lv, hx, hy);
        }
    }
    function spawnRelicFx(r, lv) {
        const p = world.player;
        const by = playerBodyY();
        const dmg = Math.max(1, p.dmg);
        const R = relicRadius(r, lv);
        const tgt = relicTarget();
        if (!tgt) return;
        switch (r.abil) {
            case 'thunder': {
            // 雷击：锁定离随机落点最近的一批敌人，瞬间结算
            const ax = wrapVal(tgt.x + rand(-70, 70), MAP_W), ay = wrapVal(tgt.y + rand(-70, 70), MAP_H);
            const f = { shape: 'circle', abil: r.abil, col: r.col, x: ax, y: ay, r: R, life: 0.32, dmg: dmg * 2, tick: 0, once: true };
            relicHurt(f);
            addFx({ kind: 'boom', x: ax, y: ay, life: 0.4, max: 0.4, r: R, col: r.col });
            world.rFx.push(f);
            sfx('laser');
            break;
        }
        case 'blade':
            world.rFx.push({ shape: 'ring', abil: r.abil, col: r.col, x: p.x, y: by, r: R, life: 3.6, dmg: 1, tick: 0.35, ang: rand(0, Math.PI), spin: 3.4 });
            sfx('roll');
            break;
        case 'laser': {
            const ang = Math.atan2(dY(tgt.y, by), dX(tgt.x, p.x));
            const f = { shape: 'ray', abil: r.abil, col: r.col, x: p.x, y: by, ang: ang, len: R, width: 30, life: 0.3, dmg: dmg * 2, tick: 0, once: true };
            relicHurt(f);
            world.rFx.push(f);
            sfx('laser');
            break;
        }
        case 'homing': {
            // 深渊追迹：四枚自动咬住敌人的冰弹
            for (let i = 0; i < 4; i++) {
                const a = Math.atan2(dY(tgt.y, by), dX(tgt.x, p.x)) + i * Math.PI / 2;
                world.bullets.push({
                    x: wrapVal(p.x + Math.cos(a) * 26, MAP_W), y: wrapVal(by + Math.sin(a) * 26, MAP_H),
                    vx: Math.cos(a) * 300, vy: Math.sin(a) * 300,
                    dmg: dmg, life: 3.0, r: 7, boom: false, ice: true, col: r.col,
                    homing: 2.2, ph: rand(0, 6)
                });
            }
            sfx('shoot');
            break;
        }
        case 'summon':
            world.rFx.push({ shape: 'pulse', abil: r.abil, col: r.col, x: p.x, y: by, r: R, life: 1.5, dmg: 1, tick: 0.3, spd: 260 });
            sfx('explode');
            break;
    }
}
function triggerRelics() {
    const p = world.player;
    if (!world.enemies.length) return;
    for (let i = 0; i < RELICS.length; i++) {
        const r = RELICS[i];
        if (RELIC_GROUND[r.abil]) continue;      // 地面类由子弹命中触发
        const lv = p.relics[r.id];
        if (!lv) continue;
        if ((world.relicT[r.id] || 0) > 0) continue;
        world.relicT[r.id] = r.cd;
        spawnRelicFx(r, lv);
    }
}
function updateRelicFx(dt) {
    for (const k in world.relicT) {
        if (world.relicT[k] > 0) world.relicT[k] -= dt;
    }
    for (let i = world.rFx.length - 1; i >= 0; i--) {
        const f = world.rFx[i];
        f.life -= dt;
        f.t = (f.t || 0) + dt;
        if (f.spin) f.ang += f.spin * dt;
        if (f.spd) f.r += f.spd * dt;
        if (f.dmg > 0 && !f.once) {
            f.tick -= dt;
            if (f.tick <= 0) { f.tick += 1; relicHurt(f); }
        }
        if (f.life <= 0) world.rFx.splice(i, 1);
    }
}
// 装备特效的绘制：与 BOSS 的招式同一套视觉语言，一眼能认出对应的是哪颗星球
function drawRelicFx() {
    for (let i = 0; i < world.rFx.length; i++) {
        const f = world.rFx[i];
        const x = scrX(f.x), y = scrY(f.y);
        const fade = clamp(f.life / 0.5, 0, 1);
        const pulse = 0.5 + 0.5 * Math.sin(world.t * 6 + (f.t || 0) * 2);
        ctx.save();
        ctx.translate(x, y);
        if (f.shape === 'circle') {
            const g = ctx.createRadialGradient(0, 0, f.r * 0.15, 0, 0, f.r);
            g.addColorStop(0, hexA(f.col, 0.30 * fade));
            g.addColorStop(0.7, hexA(f.col, 0.18 * fade));
            g.addColorStop(1, hexA(f.col, 0));
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.ellipse(0, 0, f.r, f.r * 0.8, 0, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = hexA(f.col, 0.5 * fade);
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.ellipse(0, 0, f.r * 0.9, f.r * 0.72, 0, 0, Math.PI * 2); ctx.stroke();
            if (f.abil === 'fire') {
                for (let k = 0; k < 5; k++) {
                    const a = (f.t || 0) * 1.6 + k * 1.25;
                    const rr = f.r * (0.25 + 0.55 * ((k * 0.37 + pulse) % 1));
                    const fh = 18 + 16 * Math.sin(world.t * 9 + k);
                    const fg = ctx.createRadialGradient(Math.cos(a) * rr * 0.5, Math.sin(a) * rr * 0.35, 2, Math.cos(a) * rr * 0.5, Math.sin(a) * rr * 0.35, fh);
                    fg.addColorStop(0, 'rgba(255,240,160,' + (0.6 * fade) + ')');
                    fg.addColorStop(1, 'rgba(220,60,10,0)');
                    ctx.fillStyle = fg;
                    ctx.beginPath(); ctx.ellipse(Math.cos(a) * rr * 0.5, Math.sin(a) * rr * 0.35, fh * 0.55, fh, 0, 0, Math.PI * 2); ctx.fill();
                }
            } else if (f.abil === 'acid') {
                ctx.fillStyle = hexA(f.col, 0.28 * fade);
                for (let k = 0; k < 5; k++) {
                    const a = world.t * 1.6 + k * 1.6 + (f.t || 0);
                    ctx.beginPath(); ctx.arc(Math.cos(a) * f.r * 0.45, Math.sin(a) * f.r * 0.34, 3 + 3 * pulse, 0, Math.PI * 2); ctx.fill();
                }
            } else {
                ctx.strokeStyle = hexA(f.col, 0.35 * fade);
                ctx.lineWidth = 1.6;
                for (let k = 1; k <= 2; k++) {
                    ctx.beginPath();
                    ctx.ellipse(0, 0, f.r * (0.35 * k), f.r * 0.28 * k, 0, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
        } else if (f.shape === 'ring') {
            ctx.strokeStyle = hexA(f.col, 0.9 * fade);
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.beginPath(); ctx.arc(0, 0, f.r, f.ang - 0.5, f.ang + 0.5); ctx.stroke();
            ctx.beginPath(); ctx.arc(0, 0, f.r, f.ang + Math.PI - 0.5, f.ang + Math.PI + 0.5); ctx.stroke();
            ctx.lineCap = 'butt';
            ctx.fillStyle = hexA(f.col, 0.95 * fade);
            ctx.beginPath(); ctx.arc(Math.cos(f.ang) * f.r, Math.sin(f.ang) * f.r, 9, 0, Math.PI * 2); ctx.fill();
        } else if (f.shape === 'pulse') {
            ctx.strokeStyle = hexA(f.col, 0.8 * fade);
            ctx.lineWidth = 7;
            ctx.beginPath(); ctx.arc(0, 0, f.r, 0, Math.PI * 2); ctx.stroke();
            ctx.strokeStyle = hexA(f.col, 0.28 * fade);
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(0, 0, f.r + 12, 0, Math.PI * 2); ctx.stroke();
        } else if (f.shape === 'ray') {
            ctx.rotate(f.ang);
            const g = ctx.createLinearGradient(0, -f.width / 2, 0, f.width / 2);
            g.addColorStop(0, hexA(f.col, 0.08));
            g.addColorStop(0.5, hexA(f.col, 0.85 * fade));
            g.addColorStop(1, hexA(f.col, 0.08));
            ctx.fillStyle = g;
            ctx.fillRect(0, -f.width / 2, f.len, f.width);
            ctx.fillStyle = 'rgba(255,255,255,' + (0.9 * fade) + ')';
            ctx.fillRect(0, -f.width * 0.14, f.len, f.width * 0.28);
        }
        ctx.restore();
    }
}

// ==================== 信标与挖掘 ====================
// BOSS 被击杀后：必定掉落一只闪光信标；同时在画面之外、飞船远处埋好一件看不见的东西
function hiddenRawTarget() {
    const cam = world.cam;
    const side = randInt(0, 3);
    const out = rand(90, 330);
    let tx, ty;
    if (side === 0) { tx = cam.x + rand(-W * 0.5, W * 0.5); ty = cam.y - PLAY_H * 0.5 - out; }
    else if (side === 1) { tx = cam.x + rand(-W * 0.5, W * 0.5); ty = cam.y + PLAY_H * 0.5 + out; }
    else if (side === 2) { tx = cam.x - W * 0.5 - out; ty = cam.y + rand(-PLAY_H * 0.5, PLAY_H * 0.5); }
