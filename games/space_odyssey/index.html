    function drawBeams() {
        for (let i = 0; i < world.beams.length; i++) {
            const bm = world.beams[i];
            const x = scrX(bm.x), y = scrY(bm.y);
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(bm.ang);
            if (bm.warn > 0) {
                const t = 1 - bm.warn / 0.95;
                ctx.strokeStyle = 'rgba(255,120,120,' + (0.25 + 0.4 * Math.sin(world.t * 20)) + ')';
                ctx.lineWidth = 2.5;
                ctx.setLineDash([14, 12]);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(bm.len, 0);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.strokeStyle = 'rgba(255,80,80,' + (0.25 * t) + ')';
                ctx.lineWidth = bm.width * (0.3 + 0.7 * t);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(bm.len, 0);
                ctx.stroke();
            } else {
                const g = ctx.createLinearGradient(0, -bm.width / 2, 0, bm.width / 2);
                g.addColorStop(0, 'rgba(255,120,255,0.1)');
                g.addColorStop(0.5, 'rgba(255,255,255,' + (0.85 * Math.min(1, bm.life / 0.2)) + ')');
                g.addColorStop(1, 'rgba(255,120,255,0.1)');
                ctx.fillStyle = g;
                ctx.fillRect(0, -bm.width / 2, bm.len, bm.width);
                ctx.fillStyle = 'rgba(255,255,255,0.95)';
                ctx.fillRect(0, -bm.width * 0.16, bm.len, bm.width * 0.32);
            }
            ctx.restore();
        }
    }

    function drawPackages() {
        for (let i = 0; i < world.packages.length; i++) {
            const pk = world.packages[i];
            const isWeapon = pk.kind === 'weapon';
            const x = scrX(pk.x), y = scrY(pk.y);
            const bob = pk.landed ? Math.sin(world.t * 4 + pk.ph) * 3 : 0;
            if (!pk.landed) {
                // 落点在地面上的轻微阴影（越接近越清晰）
                const gx = scrX(pk.tx), gy = scrY(pk.ty);
                const fall = clamp(1 - Math.abs(dY(pk.y, pk.ty)) / pk.tx0, 0, 1);
                ctx.save();
                ctx.globalAlpha = 0.10 + 0.30 * fall;
                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.ellipse(gx, gy + 26, 20 + 20 * (1 - fall), 6 + 7 * (1 - fall), 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            ctx.save();
            ctx.translate(x, y + bob);
            if (pk.landed) {
                ctx.fillStyle = 'rgba(0,0,0,0.25)';
                ctx.beginPath();
                ctx.ellipse(0, 28, 26, 9, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            if (!pk.landed) {
                // 降落伞
                ctx.strokeStyle = '#dfe8f5';
                ctx.lineWidth = 2.4;
                ctx.beginPath();
                ctx.moveTo(-30, -56); ctx.lineTo(0, 0);
                ctx.moveTo(30, -56); ctx.lineTo(0, 0);
                ctx.stroke();
                ctx.fillStyle = '#ff5c5c';
                ctx.beginPath();
                ctx.arc(0, -62, 30, Math.PI, 0);
                ctx.fill();
                ctx.fillStyle = '#f5f7fa';
                ctx.beginPath();
                ctx.arc(0, -62, 30, Math.PI, 1.5 * Math.PI);
                ctx.fill();
                ctx.fillStyle = '#ff5c5c';
                ctx.beginPath();
                ctx.arc(0, -62, 30, 2.5 * Math.PI, 2 * Math.PI);
                ctx.fill();
            } else {
                // 醒目脉冲光环
                const glow = 0.35 + 0.35 * Math.sin(world.t * 5 + pk.ph);
                const g = ctx.createRadialGradient(0, 0, 4, 0, 0, 72);
                g.addColorStop(0, isWeapon ? 'rgba(226,180,255,' + (0.55 * glow) + ')' : 'rgba(255,236,140,' + (0.5 * glow) + ')');
                g.addColorStop(0.55, isWeapon ? 'rgba(170,110,240,' + (0.24 * glow) + ')' : 'rgba(255,176,48,' + (0.22 * glow) + ')');
                g.addColorStop(1, isWeapon ? 'rgba(140,80,220,0)' : 'rgba(255,140,20,0)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(0, 0, 72, 0, Math.PI * 2);
                ctx.fill();
            }
            // ===== 箱体（52×42，比原来更大）=====
            const BW = 52, BH = 42, BX = -BW / 2, BY = -18;
            // 外壳
            const bg = ctx.createLinearGradient(0, BY, 0, BY + BH);
            if (isWeapon) {
                bg.addColorStop(0, '#e6b8ff');
                bg.addColorStop(0.5, '#b06af0');
                bg.addColorStop(1, '#6a2ea8');
            } else {
                bg.addColorStop(0, '#ffd75e');
                bg.addColorStop(0.5, '#ff9f1c');
                bg.addColorStop(1, '#e06a00');
            }
            ctx.fillStyle = bg;
            roundRectPath(BX, BY, BW, BH, 8);
            ctx.fill();
            ctx.strokeStyle = isWeapon ? '#3d1460' : '#7a3c00';
            ctx.lineWidth = 2.5;
            ctx.stroke();
            // 顶部高光
            ctx.fillStyle = 'rgba(255,255,255,0.45)';
            roundRectPath(BX + 4, BY + 3, BW - 8, 8, 4);
            ctx.fill();
            // 深色腰带 + 铆钉
            ctx.fillStyle = isWeapon ? '#31104f' : '#5a2d00';
            ctx.fillRect(BX, BY + 16, BW, 9);
            ctx.fillStyle = isWeapon ? 'rgba(226,200,255,0.9)' : 'rgba(255,220,140,0.9)';
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.arc(BX + 7 + i * 9.5, BY + 20.5, 1.8, 0, Math.PI * 2);
                ctx.fill();
            }
            // 四角护角
            ctx.fillStyle = isWeapon ? '#5a2490' : '#8a4a00';
            for (const [cx2, cy2] of [[BX + 5, BY + 5], [BX + BW - 5, BY + 5], [BX + 5, BY + BH - 5], [BX + BW - 5, BY + BH - 5]]) {
                ctx.beginPath();
                ctx.arc(cx2, cy2, 4.2, 0, Math.PI * 2);
                ctx.fill();
            }
            // 中央发光标记：道具箱 = 惊叹号，装备箱 = 五角星
            ctx.fillStyle = isWeapon ? '#2c0d47' : '#3a1c00';
            roundRectPath(-5, BY + 7, 10, 18, 4);
            ctx.fill();
            if (isWeapon) {
                ctx.fillStyle = '#f3e4ff';
                ctx.beginPath();
                for (let i = 0; i < 10; i++) {
                    const a = -Math.PI / 2 + i * Math.PI / 5;
                    const rr = i % 2 ? 4.4 : 10.5;
                    const vx = Math.cos(a) * rr, vy = BY + 16 + Math.sin(a) * rr;
                    if (i === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
                }
                ctx.closePath();
                ctx.fill();
            } else {
                ctx.fillStyle = '#fff4c2';
                roundRectPath(-2.6, BY + 9.5, 5.2, 9, 2.2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(0, BY + 22.5, 3, 0, Math.PI * 2);
                ctx.fill();
            }
            // 底部锁扣
            ctx.fillStyle = '#8a8f9a';
            roundRectPath(-7, BY + BH - 3, 14, 7, 2);
            ctx.fill();
            ctx.fillStyle = '#dfe4ec';
            ctx.fillRect(-5, BY + BH - 1, 10, 2);
            ctx.restore();
        }
    }

    function drawOrbs() {
        for (let i = 0; i < world.orbs.length; i++) {
            const o = world.orbs[i];
            const x = scrX(o.x), y = scrY(o.y);
            const bob = Math.sin(world.t * 4 + o.ph) * 3;
            const fade = world.bossDefeated ? 0.55 : 1;
            // 即将超时的经验球闪烁提醒，然后淡出
            const left = ORB_LIFE - (o.age || 0);
            let blink = 1;
            if (!o.homing && left < ORB_BLINK) {
                blink = 0.3 + 0.7 * Math.abs(Math.sin(world.t * 9 + o.ph));
            }
            const alpha = fade * blink;
            const pulse = 1 + 0.05 * Math.sin(world.t * 8 + o.ph);
            const R = (o.homing ? 15 : 16) * pulse;
            ctx.save();
            ctx.globalAlpha = alpha;
            const g = ctx.createRadialGradient(x, y + bob, 1, x, y + bob, R);
            g.addColorStop(0, 'rgba(180,255,220,' + (0.5 * alpha) + ')');
            g.addColorStop(1, 'rgba(120,255,190,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(x, y + bob, R, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = o.homing ? 'rgba(255,255,255,' + alpha + ')' : 'rgba(190,255,225,' + alpha + ')';
            ctx.beginPath();
            ctx.arc(x, y + bob, 5 * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,' + (0.9 * alpha) + ')';
            ctx.beginPath();
            ctx.arc(x - 1.4, y + bob - 1.6, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    function drawBullets() {
        for (let i = 0; i < world.bullets.length; i++) {
            const bu = world.bullets[i];
            const x = scrX(bu.x), y = scrY(bu.y);
            const ang = Math.atan2(bu.vy, bu.vx);
            if (bu.ice) {
                // 深渊追迹的冰弹
                const pulse = 1 + 0.14 * Math.sin(world.t * 12 + (bu.ph || 0));
                const R = bu.r * 2.1 * pulse;
                const g = ctx.createRadialGradient(x, y, 1, x, y, R);
                g.addColorStop(0, 'rgba(255,255,255,0.95)');
                g.addColorStop(0.35, bu.col || '#bfe8ff');
                g.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.save();
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(x, y, R, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.92)';
                ctx.beginPath();
                ctx.arc(x, y, bu.r * 0.42, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                continue;
            }
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(ang);
            if (bu.boom) {
                // 爆炸子弹：橙色弹头 + 尾焰 + 爆炸范围提示环
                ctx.strokeStyle = 'rgba(255,170,80,0.32)';
                ctx.lineWidth = 1.4;
                ctx.setLineDash([4, 6]);
                ctx.lineDashOffset = -world.t * 20;
                ctx.beginPath();
                ctx.arc(0, 0, bu.boomR, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = 'rgba(255,150,60,0.42)';
                ctx.beginPath();
                ctx.moveTo(-20, 0); ctx.lineTo(-6, -6); ctx.lineTo(-6, 6);
                ctx.closePath();
                ctx.fill();
                const bg = ctx.createRadialGradient(4, 0, 1, 4, 0, 10);
                bg.addColorStop(0, '#fff3dc');
                bg.addColorStop(0.5, '#ff9f43');
                bg.addColorStop(1, 'rgba(255,120,20,0)');
                ctx.fillStyle = bg;
                ctx.beginPath();
                ctx.arc(4, 0, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffd08a';
                ctx.beginPath();
                ctx.arc(4, 0, 3.4, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = 'rgba(140,220,255,0.5)';
                ctx.beginPath();
                ctx.ellipse(-7, 0, 13, 4.5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#e9faff';
                roundRectPath(-8, -2.2, 16, 4.4, 2.2);
                ctx.fill();
            }
            ctx.restore();
        }
        for (let i = 0; i < world.enemyBullets.length; i++) {
            const eb = world.enemyBullets[i];
            const x = scrX(eb.x), y = scrY(eb.y);
            ctx.save();
            ctx.translate(x, y);
            const pulse = 1 + 0.12 * Math.sin(world.t * 12 + eb.ph);
            const g = ctx.createRadialGradient(0, 0, 1, 0, 0, eb.r * 1.9 * pulse);
            g.addColorStop(0, 'rgba(255,255,255,0.95)');
            g.addColorStop(0.35, eb.col);
            g.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(0, 0, eb.r * 1.9 * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.92)';
            ctx.beginPath();
            ctx.arc(0, 0, eb.r * 0.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    function drawFx() {
        for (let i = 0; i < world.fx.length; i++) {
            const f = world.fx[i];
            const x = scrX(f.x), y = scrY(f.y);
            const t = 1 - f.life / f.max;
            if (f.kind === 'boom') {
                const g = ctx.createRadialGradient(x, y, f.r * 0.15 * t, x, y, f.r * (0.4 + 0.6 * t));
                g.addColorStop(0, 'rgba(255,255,255,' + (0.85 * (1 - t)) + ')');
                g.addColorStop(0.45, f.col + 'aa');
                g.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.globalAlpha = 1 - t;
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(x, y, f.r * (0.4 + 0.6 * t), 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            } else if (f.kind === 'spark') {
                ctx.globalAlpha = (1 - t) * 0.9;
                ctx.fillStyle = f.col;
                ctx.beginPath();
                ctx.arc(x, y, f.r * (1 - t * 0.6), 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            } else if (f.kind === 'muzzle') {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(f.ang);
                ctx.globalAlpha = 1 - t;
                ctx.fillStyle = f.col;
                ctx.beginPath();
                ctx.moveTo(0, -7);
                ctx.lineTo(20, 0);
                ctx.lineTo(0, 7);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
                ctx.globalAlpha = 1;
            } else if (f.kind === 'trail') {
                ctx.globalAlpha = (1 - t) * 0.5;
                ctx.fillStyle = f.col;
                ctx.beginPath();
                ctx.arc(x, y, f.r * (1 - t * 0.5), 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }
    }

    // ==================== 地球：碑文与陈列柜 ====================
    function buildEarthLayout() {
        const cx = MAP_W * 0.5, cy = MAP_H * 0.62;
        world.stones = [];
        // 荣誉榜单：立在基地广场左下方的空地上（远离火箭，也不压到最左端的水星碑文）
        world.board = { x: wrapVal(cx - 980, MAP_W), y: wrapVal(cy + 300, MAP_H) };
        // 补给宇宙航天飞船：停放在火箭的右下方，与火箭保持一段距离
        world.supply = {
            x: wrapVal(world.rocket.x + 288, MAP_W),
            y: wrapVal(world.rocket.y + 216, MAP_H)
        };
        const targets = PLANETS.filter((p) => !p.home);
        for (let i = 0; i < targets.length; i++) {
            const a = Math.PI * (1.02 + i * (0.96 / (targets.length - 1)));
            const r = 660;
            const x = wrapVal(cx + Math.cos(a) * r, MAP_W);
            const y = wrapVal(cy + Math.sin(a) * r * 0.92, MAP_H);
            world.stones.push({
                id: targets[i].id, x: x, y: y,
                caseX: wrapVal(cx + Math.cos(a) * (r + 118), MAP_W),
                caseY: wrapVal(cy + Math.sin(a) * (r + 118) * 0.92, MAP_H)
            });
        }
        buildNoTreeZones(cx, cy);
    }
    // 地表禁植区：已有绘图（基地广场 / 火箭 / 碑文 / 战利品柜 / 建筑）及附近小范围内不长树
    function buildNoTreeZones(cx, cy) {
        const zones = [];
        // 基地广场，连同圈外再留一小段
        zones.push({ x: cx, y: cy, rx: 300 + 90, ry: 220 + 90 });
        // 火箭本体及周围
        zones.push({ x: world.rocket.x, y: world.rocket.y - 60, rx: 140, ry: 200 });
        // 补给航天飞船停机坪
        if (world.supply) zones.push({ x: world.supply.x, y: world.supply.y - 40, rx: 160, ry: 130 });
        // 碑文与战利品陈列柜
        for (let i = 0; i < world.stones.length; i++) {
            zones.push({ x: world.stones[i].x, y: world.stones[i].y - 30, rx: 130, ry: 170 });
            zones.push({ x: world.stones[i].caseX, y: world.stones[i].caseY - 40, rx: 140, ry: 175 });
        }
        // 荣誉榜单
        if (world.board) zones.push({ x: world.board.x, y: world.board.y - 130, rx: 150, ry: 220 });
        // 建筑（若后续重新加入城区，这里会自动纳入禁植区）
        if (world.buildings) {
            for (let i = 0; i < world.buildings.length; i++) {
                const b = world.buildings[i];
                zones.push({ x: b.x, y: b.y - 60, rx: 130, ry: 160 });
            }
        }
        world.noTree = zones;
    }
    function treeBlocked(wx, wy) {
        const zones = world.noTree;
        if (!zones) return false;
        for (let i = 0; i < zones.length; i++) {
            const z = zones[i];
            const dx = dX(z.x, wx) / z.rx, dy = dY(z.y, wy) / z.ry;
            if (dx * dx + dy * dy < 1) return true;
        }
        return false;
    }
    // 忽略旧版本已下架的武器 / 道具 id（如已删除的火箭炮）
    function topWeapon(rec) {
        let best = null, bv = 0;
        for (const k in rec.weapons) {
            if (!WEAPON_NAMES[k]) continue;
            if (rec.weapons[k] > bv) { bv = rec.weapons[k]; best = k; }
        }
        return best;
    }
    function topItems(rec) {
        const arr = [];
        for (const k in rec.items) if (ITEM_NAMES[k] && rec.items[k] > 0) arr.push([k, rec.items[k]]);
        arr.sort((a, b) => b[1] - a[1]);
        return arr;
    }
    function fmtTime(s) {
        const m = Math.floor(s / 60), ss = Math.floor(s % 60);
        return (m < 10 ? '0' : '') + m + ':' + (ss < 10 ? '0' : '') + ss;
    }

        ctx.fill();
        roundRectPath(x + 2, y - BH + 30, 12, BH - 18, 4);
        ctx.fill();

        ctx.stroke();

        for (let py = -28; py <= 6; py += 17) {

    function drawEarthHub() {
        const p = world.player;
        // 基地广场
        const cx = scrX(MAP_W * 0.5), cy = scrY(MAP_H * 0.62);
        ctx.save();
        ctx.fillStyle = 'rgba(210,220,235,0.10)';
        ctx.beginPath();
        ctx.ellipse(cx, cy, 300, 220, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(210,220,235,0.16)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(cx, cy, 300, 220, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        setFont(20, 'bold');
        ctx.fillStyle = 'rgba(235,245,255,0.92)';
        ctx.fillText('地球 · 家园基地', cx, cy - 190);
        setFont(13, 'normal');
        ctx.fillStyle = 'rgba(200,220,245,0.75)';
        ctx.fillText('累计分数 ' + save.totalScore + '　累计击杀 ' + save.totalKills, cx, cy - 166);
        ctx.restore();
        // 补给航天飞船（与纪念碑一样进入按 y 排序的地面景物队列）
        if (world.supply) {
            const sp = world.supply;
            groundProps.push({
                wy: sp.y, draw: (function (sx, sy) {
                    return function () { drawSupplyShip(sx, sy, world.t, 1); };
                })(scrX(sp.x), scrY(sp.y))
            });
        }
        // 纪念碑进入按 y 排序的地面景物队列
        if (world.stones) {
            for (let i = 0; i < world.stones.length; i++) {
                const st = world.stones[i];
                groundProps.push({
                    wy: st.y, draw: (function (s) {
                        return function () { drawMemorialStone(s, 1); drawTrophyCase(s, 1); };
                    })(st)
                });
            }
        }
        // 荣誉榜单同样进入按 y 排序的地面景物队列
        if (world.board) {
            const bd = world.board;
            groundProps.push({
                wy: bd.y, draw: (function (b) {
                    return function () { drawHonorBoard(b, 1); };
                })(bd)
            });
        }
        // 近距离提示
        if (world.stones && !world.over) {
            for (let i = 0; i < world.stones.length; i++) {
                const st = world.stones[i];
                if (Math.hypot(dX(st.x, p.x), dY(st.y, p.y)) > 130) continue;
                const pl = PLANET_BY_ID[st.id];
                const rec = save.planets[st.id];
                const w = topWeapon(rec);
                const its = topItems(rec);
                const lines = [
                    pl.name + '　战绩：' + rec.clears + ' 次',
                    '最高分：' + rec.bestScore + '　累计：' + rec.totalScore,
                    '出击 ' + rec.runs + ' 次　最高等级：' + rec.bestLevel,
                    '最佳时间：' + (rec.bestTime ? fmtTime(rec.bestTime) : '—'),
                    '常用武器：' + (w ? WEAPON_NAMES[w] + ' ×' + rec.weapons[w] : '—'),
                    '常用道具：' + (its.length ? its.slice(0, 3).map((a) => ITEM_NAMES[a[0]] + '×' + a[1]).join('　') : '—'),
                    'BOSS：' + (pl.boss || '—') + (rec.clears > 0 ? '（已探索）' : '（未探索）'),
                    '宝石：' + (save.gems[st.id] ? gemName(st.id) + ' ×' + save.gems[st.id] + '（展览柜）' : '未获得'),
                    '特色装备：' + (save.relics[st.id] && RELIC_BY_ID[st.id] ? RELIC_BY_ID[st.id].name + '（已入库）' : '未挖出')
                ];
                const bw = 420, bh = 46 + lines.length * 22;
                const bx = clamp(scrX(st.x) - bw / 2, 10, W - bw - 10);
                const by = clamp(scrY(st.y) - bh - 110, 10, PLAY_H - bh - 10);
                ctx.save();
                ctx.fillStyle = 'rgba(10,18,32,0.92)';
                roundRectPath(bx, by, bw, bh, 10);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.18)';
                ctx.lineWidth = 1.5;
                roundRectPath(bx + 1, by + 1, bw - 2, bh - 2, 9);
                ctx.stroke();
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                for (let k = 0; k < lines.length; k++) {
                    setFont(k === 0 ? 17 : 14, k === 0 ? 'bold' : 'normal');
                    ctx.fillStyle = k === 0 ? '#ffe066' : 'rgba(215,230,250,0.9)';
                    ctx.fillText(lines[k], bx + 18, by + 28 + k * 22);
                }
                ctx.restore();
                break;
            }
        }
    }

        ctx.fillRect(0, PLAY_H, W, HUD_H);
        ctx.strokeStyle = 'rgba(120,170,210,0.30)';

        ctx.beginPath();
        ctx.moveTo(0, PLAY_H + 0.5);
        ctx.lineTo(W, PLAY_H + 0.5);
        ctx.stroke();

        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        setFont(19, 'bold');
        ctx.fillStyle = planet.accent;
        ctx.fillText(planet.name, 20, PLAY_H + 20);
        setFont(12, 'normal');
        ctx.fillStyle = 'rgba(190,210,240,0.75)';

        else ctx.fillText('BOSS：' + planet.boss + '　技能：' + planet.abilityName, 20, PLAY_H + 41);

        // 血量
        ctx.save();
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        setFont(12, 'bold');
        ctx.fillStyle = 'rgba(255,150,170,0.9)';
        ctx.fillText('HP', 150, PLAY_H + 19);
        for (let i = 0; i < p.maxHp; i++) {
            const hx = 174 + i * 20, hy = PLAY_H + 19;
            ctx.save();
            ctx.translate(hx, hy);
            ctx.scale(0.62, 0.62);
            ctx.fillStyle = i < p.hp ? '#ff5f86' : 'rgba(255,255,255,0.14)';
            ctx.beginPath();
            ctx.moveTo(0, 8);
            ctx.bezierCurveTo(-13, -2, -7, -13, 0, -6);
            ctx.bezierCurveTo(7, -13, 13, -2, 0, 8);
            ctx.fill();
            ctx.restore();
        }
        // 翻滚冷却
        const readyC = p.rollCd <= 0;
        setFont(12, 'bold');
        ctx.fillStyle = readyC ? '#7cf07c' : 'rgba(255,190,120,0.9)';
        ctx.fillText(hintBack() + ' 翻滚', 384, PLAY_H + 19);
        ctx.fillStyle = 'rgba(255,255,255,0.14)';
        roundRectPath(442, PLAY_H + 12, 106, 13, 6);
        ctx.fill();
        ctx.fillStyle = readyC ? '#7cf07c' : '#ffb45c';
        const rr = readyC ? 1 : (1 - p.rollCd / ROLL_CD);
        roundRectPath(442, PLAY_H + 12, Math.max(3, 106 * rr), 13, 6);
        ctx.fill();
        setFont(11, 'normal');
        ctx.fillStyle = 'rgba(200,215,240,0.7)';
        ctx.fillText(readyC ? '就绪' : p.rollCd.toFixed(1) + 's', 556, PLAY_H + 19);
        ctx.restore();

        // 等级 / 经验
        const barX = 596, barW = 260;
        ctx.save();
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        setFont(14, 'bold');
        ctx.fillStyle = '#ffe066';
        ctx.fillText('Lv.' + world.level, barX, PLAY_H + 19);
        setFont(11, 'normal');
        ctx.fillStyle = 'rgba(200,215,240,0.7)';
        ctx.fillText((world.xp - xpTotalFor(world.level)) + '/' + xpNeededFor(world.level) + ' EXP', barX + 52, PLAY_H + 19);
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        roundRectPath(barX + 126, PLAY_H + 12, barW, 14, 7);
        ctx.fill();
        const expF = clamp((world.xp - xpTotalFor(world.level)) / xpNeededFor(world.level), 0, 1);
        const eg = ctx.createLinearGradient(barX + 126, 0, barX + 126 + barW, 0);
        eg.addColorStop(0, '#4fc9a0');
        eg.addColorStop(1, '#8ef0c0');
        ctx.fillStyle = eg;
        roundRectPath(barX + 126, PLAY_H + 12, Math.max(4, barW * expF), 14, 7);
        ctx.fill();

        setFont(11, 'bold');
        if (world.pkg) {
            ctx.fillStyle = '#ffe066';
            ctx.fillText('道具三选一：← → 切换　' + hintConfirm() + ' 选择头顶道具', barX, PLAY_H + 41);
        } else if (world.packages.length && !planet.home) {

        } else {
            ctx.fillStyle = 'rgba(190,210,240,0.6)';

        ctx.restore();

        // 分数 / 时间
        ctx.save();

        ctx.textBaseline = 'middle';
        setFont(18, 'bold');
        ctx.fillStyle = '#ffd966';
        ctx.fillText('分数 ' + world.score, W - 20, PLAY_H + 19);
        setFont(12, 'normal');
        ctx.fillStyle = 'rgba(200,215,240,0.78)';
        ctx.fillText('击杀 ' + world.kills + '　时间 ' + fmtTime(world.runTime), W - 20, PLAY_H + 41);
        ctx.restore();

        // BOSS 血条
        if (world.boss && !world.bossDefeated) {
            const bw = 520, bh = 16, bx = (W - bw) / 2, by = 22;
            ctx.save();
            ctx.fillStyle = 'rgba(8,10,18,0.8)';
            roundRectPath(bx - 4, by - 18, bw + 8, bh + 24, 8);
            ctx.fill();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            setFont(13, 'bold');
            ctx.fillStyle = '#ff8a8a';
            ctx.fillText(planet.boss + '　HP ' + Math.max(0, Math.ceil(world.boss.hp)) + '/' + world.boss.maxHp, W / 2, by - 7);
            ctx.fillStyle = 'rgba(255,255,255,0.12)';
            roundRectPath(bx, by, bw, bh, 8);
            ctx.fill();
            const hf = clamp(world.boss.hp / world.boss.maxHp, 0, 1);
            const hg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
            hg.addColorStop(0, '#ff4d4d');
            hg.addColorStop(1, '#ff9a5c');
            ctx.fillStyle = hg;
            roundRectPath(bx, by, Math.max(6, bw * hf), bh, 8);

            ctx.restore();
        }
        // 目标提示（地球上只提示靠近登船，不显示「返回火箭飞船」的距离文字）
        if (!world.over && (world.bossDefeated || planet.home)) {
            const dr = Math.hypot(dX(world.rocket.x, world.player.x), dY(world.rocket.y, world.player.y));
            const near = dr < 92;
            if (near || !planet.home) {
                ctx.save();
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                setFont(14, 'bold');

                ctx.fillText(near ? ('按 ' + hintConfirm() + ' 登船起飞') : '返回火箭飞船（距离 ' + Math.round(dr / 10) + ' m）', W / 2, 34);
                ctx.restore();
            }
        }
        // 弹跳文字
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        setFont(17, 'bold');
        for (let i = 0; i < world.popups.length; i++) {
            const pp = world.popups[i];
            ctx.globalAlpha = Math.min(1, pp.life * 2);
            ctx.fillStyle = pp.col;
            const x = pp.follow ? W / 2 : clamp(scrX(pp.x), 60, W - 60);
            const y = pp.follow ? PLAY_H / 2 - 120 : clamp(scrY(pp.y) - 60 - (1.3 - pp.life) * 30, 40, PLAY_H - 40);
            ctx.fillText(pp.text, x, y);
        }
        ctx.globalAlpha = 1;
        ctx.restore();
    }

    // 屏幕边缘的指向提示：alpha 控制半透明，slot 让多个同类提示在边缘错开、不叠在一起
    function drawDirectionMarker(wx, wy, col, label, alpha, slot) {
        const x = scrX(wx), y = scrY(wy);
        const margin = 54;
        if (x > margin && x < W - margin && y > margin && y < PLAY_H - margin) return;
        const cx = W / 2, cy = PLAY_H / 2;
        let dx = x - cx, dy = y - cy;
        const len = Math.max(1, Math.hypot(dx, dy));
        dx /= len; dy /= len;
        const tx = dx !== 0 ? (W / 2 - margin) / Math.abs(dx) : Infinity;
        const ty = dy !== 0 ? (PLAY_H / 2 - margin) / Math.abs(dy) : Infinity;
        const tt = Math.min(tx, ty);
        const off = (slot || 0) * 26;
        const px = cx + dx * tt - dy * off, py = cy + dy * tt + dx * off;
        const dist = Math.round(len / 10);
        const a = alpha === undefined ? 1 : alpha;
        ctx.save();
        ctx.globalAlpha = a;
        ctx.translate(px, py);
        ctx.rotate(Math.atan2(dy, dx));
        ctx.fillStyle = 'rgba(8,12,22,0.75)';
        ctx.beginPath();
        ctx.arc(0, 0, 17, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.moveTo(11, 0); ctx.lineTo(-7, -8); ctx.lineTo(-7, 8);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        ctx.save();
        ctx.globalAlpha = a;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        setFont(11, 'bold');
        ctx.fillStyle = col;
        ctx.fillText(label + ' ' + dist + 'm', clamp(px + dx * 26, 50, W - 50), clamp(py + dy * 26, 24, PLAY_H - 14));
        ctx.restore();
    }

    // 拾取信标之后的挖掘提示：尘埃特效散去即可再次下铲，进度条与尘土特效同步
function drawDigPrompt() {
    const bc = world.beacon;
    if (!bc || !bc.held) return;
    const dg = world.dig;
    const sig = beaconSignal();
    const pulse = 0.5 + 0.5 * Math.sin(world.t * (3 + 10 * sig));
    const ready = dg.cd <= 0 && !dg.locked;
    const label = dg.locked ? '此处已挖掘完毕'
        : (ready ? ('按 ' + hintConfirm() + ' 尝试挖掘') : '挖掘冷却中…');
    const bw = 300, bh = 44, bx = (W - bw) / 2, by = PLAY_H - 62;
    ctx.save();
    ctx.fillStyle = 'rgba(8,14,26,0.78)';
    roundRectPath(bx, by, bw, bh, 10);
    ctx.fill();
    ctx.strokeStyle = ready ? 'rgba(255,214,102,' + (0.45 + 0.35 * pulse) + ')' : 'rgba(140,200,255,0.22)';
    ctx.lineWidth = 1.6;
    roundRectPath(bx + 0.5, by + 0.5, bw - 1, bh - 1, 9.5);
    ctx.stroke();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    setFont(15, 'bold');
    ctx.fillStyle = ready ? '#ffe066' : 'rgba(200,215,240,0.7)';
    ctx.fillText(label, W / 2, by + 15);
    // 冷却条：与尘土特效共用同一进度，尘土散尽即为就绪
    const k = clamp(1 - dg.dust / DIG_FX, 0, 1);
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    roundRectPath(bx + 16, by + 28, bw - 32, 7, 3.5);
    ctx.fill();
    ctx.fillStyle = ready ? '#9bf6b0' : '#c9b48a';
    roundRectPath(bx + 16, by + 28, Math.max(4, (bw - 32) * k), 7, 3.5);
    ctx.fill();
    ctx.restore();
}

function drawPlay() {
        if (!world) return;
        const p = world.player;
        // 升空拉远 / 着陆推近：整幅场景的镜头缩放
        const lz = world.launch ? launchZoom(world.launch.t)
            : (world.landing ? landingZoom(world.landing.t) : 1);
        viewZoom = lz;
        if (lz < 1) {
            ctx.fillStyle = world.planet.ground;
            ctx.fillRect(0, 0, W, H);
            ctx.save();
            ctx.translate(W / 2, PLAY_H / 2);
            ctx.scale(lz, lz);
            ctx.translate(-W / 2, -PLAY_H / 2);
        }
        drawGround();
        if (world.planet.home) drawEarthHub();
        // 火箭（含着陆 / 升空动画）同样进入按 y 排序的队列，
        // 排序键取它在地面上的位置，这样地表景物与升降动画保持一致
        if (world.landing) {
            groundProps.push({ wy: world.landing.y, draw: drawLanding });
        } else if (world.launch) {
            groundProps.push({ wy: world.rocket.y, draw: drawLaunchRocket });
        } else {
            const rk = world.rocket, rsx = scrX(rk.x), rsy = scrY(rk.y);
            groundProps.push({
                wy: rk.y, draw: (function (x, y) {
                    return function () { drawRocketAt(x, y, world.rocket.angle, world.t, 0, ROCKET_SCALE); };
                })(rsx, rsy)
            });
        }
        drawGroundProps(false);      // 主角北侧的景物（树 / 纪念碑 / 火箭）
        drawZones();
        drawMarks();
        drawBossWarns();
        drawRelicFx();
        drawDigDust();
        drawFoundItem();
        drawPackages();
        drawOrbs();
        // 范围光影·身前层：拾取高亮 + 闪避圈（跟随主角的身形中心，画在角色之下）
        if (!world.landing && !world.launch) drawRangeRings(W / 2, PLAYER_CY - BODY_OFF, world.t);
        drawBlades();
        drawBeams();
        for (let i = 0; i < world.enemies.length; i++) drawEnemy(world.enemies[i]);
        drawBoss();
        drawBullets();
        if (!world.launch) drawFx();
        // 主角（着陆时未出舱则不画，避免地面上凭空出现人物）
        const flick = p.invuln > 0 && Math.floor(world.t * 18) % 2 === 0;
        const showHero = !world.launch && (!world.landing || world.landing.t > LAND_EXIT);
        if (showHero && !flick) {
            drawAstronaut(W / 2, PLAYER_CY, p.dirIdx, p.walkPhase, p.moving, {
                t: world.t, roll: p.rollT > 0 ? 1 : 0, rollAngle: p.rollAngle,
                rollProg: 1 - p.rollT / ROLL_TIME,
                pkg: world.pkg,
                faceSide: p.faceSide
            });
        }
        if (showHero && p.rollCd > 0 && p.rollT <= 0) {
            ctx.save();
            ctx.strokeStyle = 'rgba(140,230,255,0.75)';
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.arc(W / 2, PLAYER_CY - BODY_OFF, 34, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - p.rollCd / ROLL_CD));
            ctx.stroke();
            ctx.restore();
        }
        // 信标漂浮在人物上方，因此画在主角之后，避免被身形与景物挡住
        if (!world.launch && !world.landing) drawBeacon();
        // 主角南侧的景物始终绘制（与主角是否显示无关），保证升降动画期间地表内容完整
        drawGroundProps(true);
        if (lz < 1) { ctx.restore(); viewZoom = 1; }
        if (world.launch) drawLaunchOverlay();
        if (world.landing) drawLandingOverlay();
        // 范围光影·身后层：射程之外径向压暗
        drawRangeShade(W / 2, PLAYER_CY - BODY_OFF);
        if (world.landing) drawLandingFade();
        if (!world.over && !world.landing && !world.launch) {
            ctx.save();
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            setFont(12, 'normal');
            ctx.fillStyle = 'rgba(210,225,250,0.40)';
            ctx.fillText(hintMove() + ' 移动　·　' + hintConfirm() + ' 选用道具 / 登船　·　' + hintBack() + ' 翻滚（无敌）', 16, PLAY_H - 14);
            ctx.restore();
            if (world.boss && !world.bossDefeated) drawDirectionMarker(world.boss.x, world.boss.y, '#ff6b6b', 'BOSS');
            if (world.packages.length && !world.planet.home) {
                // 所有未拾取的箱子都要有指向提示，多个箱子在边缘错开排列
                for (let i = 0; i < world.packages.length; i++) {
                    const pk = world.packages[i];
                    drawDirectionMarker(pk.x, pk.y,
                        pk.kind === 'weapon' ? '#d0a0ff' : '#ffd966',
                        pk.kind === 'weapon' ? '装备箱' : '道具箱', 0.72, i);
                }
            }
            if (world.planet.home || world.bossDefeated) drawDirectionMarker(world.rocket.x, world.rocket.y, '#7cf07c', '火箭');
            if (world.supply && !world.inv.on) drawDirectionMarker(world.supply.x, world.supply.y, '#7ce0ff', '补给飞船');
            if (world.beacon && !world.beacon.held) drawDirectionMarker(world.beacon.x, world.beacon.y, '#ffe066', '信标');
            if (world.found) drawDirectionMarker(world.found.x, world.found.y, world.found.kind === 'gem' ? '#bfe8ff' : '#ffd166', '战利品');
        }
        // 能力数据面板（左上角）和已选道具图标（右下角）
        if (!world.over && !world.landing && !world.launch) {
            drawStatsPanel();
            drawSelectedItems();
            drawDigPrompt();
        }
        drawHudPlay();
        // 战备配置菜单（地球 · 补给航天飞船）
        if (world.inv && world.inv.on) drawInvMenu();

        if (world.over) {
            ctx.fillStyle = 'rgba(20,4,8,0.78)';
            ctx.fillRect(0, 0, W, H);
            ctx.save();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            setFont(52, 'bold');
            ctx.fillStyle = '#ff6b6b';
            ctx.fillText('任务失败', W / 2, H / 2 - 40);
            setFont(17, 'normal');
            ctx.fillStyle = 'rgba(255,220,220,0.9)';
            ctx.fillText('本次得分 ' + world.score + '　击杀 ' + world.kills + '　等级 ' + world.level, W / 2, H / 2 + 6);
            setFont(15, 'bold');
            ctx.fillStyle = '#ffe066';
            ctx.fillText('按 ' + hintConfirm() + ' 返回太阳系', W / 2, H / 2 + 54);
            ctx.restore();
        }
    }

// ==================== 场景：着陆 / 起飞 ====================

    // ---------- 着陆（在真实场景内播放） ----------
    const LAND_DESCENT = 1.6, LAND_SETTLE = 2.4, LAND_EXIT = 2.32, LAND_DOOR = 3.5;
    function updateLanding(dt) {
        const L = world.landing;
        const p = world.player;
        L.t += dt;
        const gy = scrY(L.y);
        if (L.t < LAND_DESCENT) {
            const k = easeOutCubic(clamp(L.t / LAND_DESCENT, 0, 1));
            L.drawY = lerp(gy - 300, gy, k);
        } else {
            if (!L.landedFx) {
                L.landedFx = true;
                for (let i = 0; i < 16; i++) {
                    world.fx.push({
                        kind: 'spark', x: L.x + rand(-46, 46), y: L.y + rand(-8, 10),
                        life: rand(0.4, 0.95), max: 0.95, r: rand(5, 13), col: '#e8e2d0',
                        vx: rand(-140, 140), vy: rand(-70, -12)
                    });
                }
                sfx('land');
            }
            L.drawY = gy;
        }
        // 人物从火箭舱门走出（先被火箭图层遮住，再向右前方走出）
        const k = clamp((L.t - LAND_EXIT) / (LAND_DOOR - LAND_EXIT - 0.18), 0, 1);
        if (L.t > LAND_EXIT) {
            const e = easeOutCubic(k);
            p.x = wrapVal(L.x + 8 + 102 * e, MAP_W);
            p.y = wrapVal(L.y + 28 + 44 * e, MAP_H);
            p.dirIdx = 7;
            p.moving = k < 0.97;
            p.walkPhase += dt * 9;
        } else {
            // 出舱前人物仍留在舱内，贴在舱门处，不站在地面上
            p.x = wrapVal(L.x + 12, MAP_W);
            p.y = wrapVal(L.y + 30, MAP_H);
            p.dirIdx = 7;
            p.moving = false;
        }
        world.cam.x = L.t > LAND_EXIT ? p.x : L.x;
        world.cam.y = L.t > LAND_EXIT ? p.y : L.y;
        if (L.t >= LAND_DOOR) {
            L.done = true;
            world.landing = null;
            p.moving = false;
            sfx('uiSelect');
        }
    }
    function drawLanding() {
        const L = world.landing;
        const gx = scrX(L.x);
        const t = L.t;
        const flame = t < LAND_DESCENT ? 1 : 0.6;
        const RS = ROCKET_SCALE;
        drawRocketAt(gx, L.drawY, world.rocket.angle, t, flame * (t < LAND_DESCENT ? 1 : 0.7), RS);
        // 舱门：LAND_EXIT 起沿舱壁向上滑开，露出暖色舱内
        const dk = t > LAND_EXIT ? clamp((t - LAND_EXIT) / 0.42, 0, 1) : 0;
        if (dk > 0) {
            ctx.save();
            ctx.translate(gx, L.drawY);
            ctx.scale(RS, RS);
            // 舱口（凹进去的暗腔）
            ctx.fillStyle = 'rgba(20,26,40,0.94)';
            roundRectPath(1, -15, 20, 30, 8);
            ctx.fill();
            // 舱内暖光
            const ig = ctx.createLinearGradient(3, 0, 20, 0);
            ig.addColorStop(0, 'rgba(255,196,110,0.6)');
            ig.addColorStop(1, 'rgba(255,140,60,0.14)');
            ctx.fillStyle = ig;
            roundRectPath(3, -13, 16, 26, 7);
            ctx.fill();
            // 滑开的舱门
            ctx.fillStyle = '#b8c2d0';
            roundRectPath(-1, -17 - 15 * dk, 24, 17, 7);
            ctx.fill();
            ctx.strokeStyle = 'rgba(24,32,48,0.55)';
            ctx.lineWidth = 1.2;
            ctx.stroke();
            ctx.restore();
        }
    }
    // 着陆标题：画在缩放变换之外，保证位置和字号不被镜头缩放影响
    function drawLandingOverlay() {
        const L = world.landing;
        const t = L.t;
        ctx.save();
        ctx.globalAlpha = 1 - landingFadeIn(t);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        setFont(30, 'bold');
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 8;
        ctx.fillText(world.planet.name + ' 着陆中', W / 2, 70);
        setFont(14, 'normal');
        ctx.fillStyle = 'rgba(230,240,255,0.85)';
        ctx.fillText(t < LAND_DESCENT ? '进入大气层 · 自动着陆' :
            (t < LAND_SETTLE ? '着陆完成' : '舱门开启 · 准备出舱'), W / 2, 100);
        ctx.restore();
    }
    // 着陆入场：由全黑淡入。画在缩放与暗角之外，保证整屏覆盖
    function drawLandingFade() {
        const a = landingFadeIn(world.landing.t);
        if (a <= 0) return;
        ctx.fillStyle = 'rgba(2,3,10,' + a + ')';
        ctx.fillRect(0, 0, W, H);
    }

// 取消：住船引擎——在真实场景内播放，与着陆对称，保留原游戏画面
    const LAUNCH_BOARD = 0.55, LAUNCH_RISE = 2.9, LAUNCH_DUR = 2.45;
    function launchSequence() {
        if (!world) return;
        // 记下点击瞬间的镜头位置，用于平滑过渡，避免画面跳变
        world.launch = { t: 0, dur: LAUNCH_DUR, camFrom: { x: world.cam.x, y: world.cam.y } };
        sfx('launch');
    }
    function updateLaunch(dt) {
        const L = world.launch;
        L.t += dt;
        // 镜头由人物平滑移到火箭，而不是瞬间跳转
        const ce = easeInOut(clamp(L.t / LAUNCH_BOARD, 0, 1));
        world.cam.x = lerp(L.camFrom.x, world.rocket.x, ce);
        world.cam.y = lerp(L.camFrom.y, world.rocket.y, ce);
        // 尾气与烟尘（升空变慢，密度略提高以保持尾焰连贯）
        if (L.t > LAUNCH_BOARD * 0.8 && Math.random() < dt * 42) {
            world.fx.push({
                kind: 'spark', x: world.rocket.x + rand(-28, 28), y: world.rocket.y + rand(40, 74),
                life: rand(0.35, 0.9), max: 0.9, r: rand(4, 12), col: '#ffd08a'
            });
        }
        for (let i = world.fx.length - 1; i >= 0; i--) {
            const f = world.fx[i];
            f.life -= dt;
            if (f.kind === 'spark') {
                f.x = wrapVal(f.x + (f.vx || 0) * dt, MAP_W);
                f.y = wrapVal(f.y + (f.vy || 0) * dt, MAP_H);
            }
            if (f.life <= 0) world.fx.splice(i, 1);
        }
        if (L.t < L.dur) return;
        world.launch = null;
        scene = 'space';
        sceneT = 0;
        const pp = planetPos(PLANET_BY_ID[pendingPlanet ? pendingPlanet.id : 'earth']);
        ship.x = pp.x;
        ship.y = pp.y - 96;
        ship.ang = -0.6;
    }
    // 升空中的火箭与尾焰
    function drawLaunchRocket() {
        const L = world.launch;
        const t = L.t;
        const gx = scrX(world.rocket.x), gy = scrY(world.rocket.y);
        let rise = 0, flame = 0;
        if (t < LAUNCH_BOARD) {
            rise = 0; flame = 0;
        } else if (t < LAUNCH_RISE) {
            rise = launchRise(t);
            flame = 1;
        } else {
            rise = 1;
            flame = 0;
        }
        // 点火到升空全程保持地面上的火箭尺寸，不再缩小
        const shake = t > LAUNCH_BOARD && t < LAUNCH_RISE ? (Math.random() - 0.5) * 4 : 0;
        drawRocketAt(gx + shake, gy - rise * LAUNCH_TRAVEL, world.rocket.angle, t, flame, ROCKET_SCALE);
        for (let i = 0; i < world.fx.length; i++) {
            const f = world.fx[i];
            const x = scrX(f.x), y = scrY(f.y) - rise * LAUNCH_TRAVEL;
            ctx.save();
            ctx.globalAlpha = (1 - f.life / f.max) * 0.8;
            ctx.fillStyle = f.col;
            ctx.beginPath();
            ctx.arc(x, y, f.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }
    // 升空标题与转场：画在缩放变换之外，
    // 否则 fillRect 只会盖住被拉小的中间区域，四周会露出黑边。
    function drawLaunchOverlay() {
        const t = world.launch.t;
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        setFont(26, 'bold');
        ctx.fillStyle = '#eaf4ff';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 8;
        ctx.fillText('升空中', W / 2, 70);
        ctx.restore();
        const a = launchDepart(t);
        if (a <= 0) return;
        ctx.fillStyle = 'rgba(2,3,10,' + a + ')';
        ctx.fillRect(0, 0, W, H);
        if (a > 0.55) {
            ctx.save();
            ctx.globalAlpha = (a - 0.55) / 0.45;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            setFont(26, 'bold');
            ctx.fillStyle = '#eaf4ff';
            ctx.fillText('返回太阳系轨道', W / 2, H / 2);
            ctx.restore();
        }
    }

// ==================== 触屏操作层 ====================
    // 右半屏上下区的分界（画在屏幕上）
    const TOUCH_SPLIT_Y = H * 0.5;
    function touchZoneLabel(cx, cy, label, sub, down, hot) {
        ctx.save();
        ctx.globalAlpha = hot ? 0.55 : 0.22;
        ctx.fillStyle = down ? '#ffe066' : 'rgba(200,220,245,1)';
        ctx.beginPath();
        ctx.arc(cx, cy, 44, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = hot ? 0.95 : 0.55;
        ctx.strokeStyle = down ? '#fff3b0' : 'rgba(210,230,255,0.5)';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.globalAlpha = hot ? 1 : 0.7;
        ctx.fillStyle = down ? '#3a2c00' : '#eaf2ff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        setFont(20, 'bold');
        ctx.fillText(label, cx, cy - 8);
        setFont(11, 'bold');
        ctx.fillText(sub, cx, cy + 14);
        ctx.restore();
    }
    function drawTouchUI() {
        // 右半屏上下区：上 = J，下 = K（任何场景都绘制）
        const jx = W * 0.82, ky = TOUCH_SPLIT_Y + (H - TOUCH_SPLIT_Y) * 0.42;
        const jy = TOUCH_SPLIT_Y * 0.44;
        touchZoneLabel(jx, jy, hintConfirm(), '确认 / 选择', touchBtn.jId >= 0, true);
        touchZoneLabel(jx, ky, hintBack(), '翻滚 / 返回', touchBtn.kId >= 0, true);
        // 分区提示虚线
        ctx.save();
        ctx.globalAlpha = 0.13;
        ctx.strokeStyle = '#cfe4ff';
        ctx.lineWidth = 2;
        ctx.setLineDash([10, 12]);
        ctx.beginPath();
        ctx.moveTo(W * 0.5, 0); ctx.lineTo(W * 0.5, H);
        ctx.moveTo(W * 0.5, TOUCH_SPLIT_Y); ctx.lineTo(W, TOUCH_SPLIT_Y);
        ctx.stroke();
        ctx.restore();
        // 左半屏方向键：按下才显示
        if (!stick.active) return;
        ctx.save();
        ctx.globalAlpha = 0.22;
        ctx.fillStyle = '#8fd6ff';
        ctx.beginPath();
        ctx.arc(stick.ox, stick.oy, STICK_MAX, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(180,225,255,0.55)';
        ctx.lineWidth = 2;
        ctx.stroke();
        // 方向指示
        ctx.globalAlpha = 0.8;
        ctx.strokeStyle = '#bfe9ff';
        ctx.lineWidth = 3;
        for (let d = 0; d < 8; d++) {
            const on = stick.dir === d;
            ctx.globalAlpha = on ? 0.95 : 0.3;
            ctx.beginPath();
            ctx.moveTo(stick.ox + DIRS[d].ix * (STICK_MAX - 16), stick.oy + DIRS[d].iy * (STICK_MAX - 16));
            ctx.lineTo(stick.ox + DIRS[d].ix * (STICK_MAX - 4), stick.oy + DIRS[d].iy * (STICK_MAX - 4));
            ctx.stroke();
        }
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = '#d8f2ff';
        ctx.beginPath();
        ctx.arc(stick.ox + stick.kx, stick.oy + stick.ky, 24, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

// ==================== 主循环 ====================
    function update(dt) {
        sceneT += dt;
        solarT += dt;
        switch (scene) {
            case 'title': sceneTitleUpdate(dt); break;
            case 'settings': sceneSettingsUpdate(dt); break;
            case 'space': sceneSpaceUpdate(dt); break;
            case 'play': updatePlay(dt); break;
        }
        if (scene === 'play' && world && world.over && (edge.KeyJ || pad.aEdge)) {
            recordRun(false);
            scene = 'space';
            sceneT = 0;
            const dp = planetPos(world.planet);
            ship.x = dp.x;
            ship.y = dp.y - 96;
            ship.ang = -0.6;
            world = null;
        }
        syncBgm();
    }
    function draw() {
        applyCanvasTransform();
        ctx.clearRect(0, 0, W, H);
        switch (scene) {
            case 'title': sceneTitleDraw(); break;
            case 'settings': sceneSettingsDraw(); break;
            case 'space': sceneSpaceDraw(); break;
            case 'play': drawPlay(); break;
        }
        if (save.touchUI && touchSeen) drawTouchUI();
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
    }
    function clearEdges() {
        for (const k in edge) edge[k] = false;
        stick.dirEdge = null;
    }
    let lastTime = 0;
    function gameLoop(ts) {
        if (!lastTime) lastTime = ts;
        let dt = (ts - lastTime) / 1000;
        lastTime = ts;
        if (dt > 0.1) dt = 0.1;
        if (dt < 0.001) dt = 0.001;
        pollGamepad();
        update(dt);
        draw();
        clearEdges();
        requestAnimationFrame(gameLoop);
    }

    // ==================== 初始化 ====================
    detectRoundFont();
    normalizeLoadout();
    updateFullscreenButton();
    resizeCanvas();
    scene = 'title';
    sceneT = 0;
    requestAnimationFrame(() => { resizeCanvas(); requestAnimationFrame(resizeCanvas); });
    requestAnimationFrame(gameLoop);
})();
</script>
</body>
