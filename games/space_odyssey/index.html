<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-viewport=1.0, user-scalable=no">
<title>星球大冒险</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
        background: #05060f;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Courier New', 'Microsoft YaHei', monospace;
    }
    .game-container {
        background: #05060f;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 100%;
        max-height: 100%;
    }
    .canvas-wrap {
        position: relative;
        width: 100%;
        max-width: 1280px;
        line-height: 0;
    }
    canvas {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 1280 / 720;
        touch-action: none;
    }
    .fullscreen-btn {
        position: absolute;
        top: 6px; right: 6px;
        width: 30px; height: 30px;
        border: none;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.45);
        display: flex; align-items: center; justify-content: center;
        cursor: pointer;
        touch-action: manipulation;
        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
        transition: background 0.15s, color 0.15s, transform 0.1s;
        z-index: 10; padding: 0; outline: none;
    }
    .fullscreen-btn:hover { background: rgba(255, 255, 255, 0.18); color: rgba(255, 255, 255, 0.8); }
    .fullscreen-btn:active { background: rgba(255, 255, 255, 0.28); color: #ffffff; transform: scale(0.92); }
    .fullscreen-btn svg { width: 15px; height: 15px; display: block; pointer-events: none; }
    @media (max-width: 720px) {
        .fullscreen-btn { width: 26px; height: 26px; top: 5px; right: 5px; border-radius: 7px; }
        .fullscreen-btn svg { width: 13px; height: 13px; }
    }
    .game-container.is-fullscreen {
        width: 100vw; height: 100vh;
        max-width: none; max-height: none;
        background: #000;
        justify-content: center; align-items: center;
    }
    .game-container.is-fullscreen .canvas-wrap {
        width: 100%; height: 100%; max-width: none;
        display: flex; align-items: center; justify-content: center;
    }
    .game-container.is-fullscreen canvas {
        width: auto !important;
        height: auto !important;
        max-width: 100%;
        max-height: 100%;
    }
    .game-container.is-fullscreen .fullscreen-btn {
        top: 8px; right: 8px;
        background: rgba(255, 255, 255, 0.10);
        color: rgba(255, 255, 255, 0.55);
        z-index: 30;
    }
</style>
</head>
<body>
<div class="game-container" id="gameContainer">
    <div class="canvas-wrap" id="canvasWrap">
        <canvas id="gameCanvas" width="1280" height="720"></canvas>
        <button class="fullscreen-btn" id="fullscreenBtn" aria-label="全屏" title="全屏">
            <svg id="fsIconExpand" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 9V4h5"/><path d="M20 9V4h-5"/>
                <path d="M4 15v5h5"/><path d="M20 15v5h-5"/>
            </svg>
            <svg id="fsIconCompress" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                <path d="M9 4v5H4"/><path d="M15 4v5h5"/>
                <path d="M9 20v-5H4"/><path d="M15 20v-5h5"/>
            </svg>
        </button>
    </div>
</div>
<script>
(function() {
    'use strict';

    const VERSION = '20261016-1703';

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let P = ctx;
    const container = document.getElementById('gameContainer');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const fsIconExpand = document.getElementById('fsIconExpand');
    const fsIconCompress = document.getElementById('fsIconCompress');

    // ==================== 常量 ====================
    const W = 1280, H = 720;
    const HUD_H = 58;
    const PLAY_H = H - HUD_H;
    const FONT = '"Courier New","Microsoft YaHei",monospace';

    const SAVE_KEY = 'space_odyssey_save_v1';

    // ==================== 战备配置布局 ====================
    // 从左到右五个区域：1x4 道具 / 4x4 道具仓库 / 1x4 固定 / 4x4 装备仓库 / 1x4 装备
    // pair 为可与之互换物品的区域；固定栏 pair = null，选中但不可移动
    const INV_ROWS = 4;
    const INV_CELL = 58, INV_GAP = 8, INV_PITCH = INV_CELL + INV_GAP;
    const INV_TOP = 186;                       // 第一行格子的顶边
    const INV_HEAD = 30, INV_PAD = 12;         // 面板标题栏高度 / 内边距
    const INV_GAPX = 14;                       // 面板之间的水平间隙
    const INV_AREAS = [
        { id: 'item', title: '道具', cols: 1, pair: 'itemStore', color: '#7ce0ff' },
        { id: 'itemStore', title: '道具仓库', cols: 4, pair: 'item', color: '#7ce0ff' },
        { id: 'fixed', title: '固定', cols: 1, pair: null, color: '#ffd24a' },
        { id: 'equipStore', title: '装备仓库', cols: 4, pair: 'equip', color: '#c58cff' },
        { id: 'equip', title: '装备', cols: 1, pair: 'equipStore', color: '#c58cff' }
    ];
    const INV_SLOTS = {};
    for (const a of INV_AREAS) INV_SLOTS[a.id] = a.cols * INV_ROWS;
    const SUPPLY_R = 126;                      // 补给飞船的交互半径

    // 角色尺寸（俯视基准单位）
    const CHAR_S = 46;          // 一个"身位"
    const BODY_OFF = 30;         // 身形中心相对脚底锚点的上移量（范围圈以此为中心）
    // 人物绘制锚点固定在整幅画面的垂直中心，不受下方状态栏影响
    const PLAYER_CY = H / 2;
    const PLAYER_SCR_OFF = PLAYER_CY - PLAY_H / 2;   // 绘制锚点相对 scrY(p.y) 的偏移
    const MAP_W_BASE = 6400;   // 行星地图宽（约 100 个身位）
    const MAP_H_BASE = 5800;
    // 月球正面 / 背面两张地图，长宽均为行星地图的一半
    const MOON_MAP_W = MAP_W_BASE / 2;
    const MOON_MAP_H = MAP_H_BASE / 2;
    // 当前世界的地图尺寸与环绕开关：行星四面无限衔接，月球两面都有实体边界
    let MAP_W = MAP_W_BASE;
    let MAP_H = MAP_H_BASE;
    let MAP_BOUNDED = false;
    const TILE = 160;

    const BASE_SPEED = 168;     // 主角基础速度 px/s
    const FIRE_CD_MS = 1000;      // 基础开枪间隔（毫秒）
    const ROLL_TIME = 0.42;
    const ROLL_CD = 3.0;
    // 闪避距离 = 按下 K（手柄 B）后人物向当前方向滚动的距离
    const ROLL_DIST_BASE = 150;           // 初始 150px（约 3.3 个身位）
    const ROLL_DIST_STEP = 50;            // 每件「闪避增长」+50
    // 普通翻滚撞到敌人：弹开很远一点并让它硬直一下（同一只怪在一次翻滚里只结算一次）
    const ROLL_PUSH_D = CHAR_S * 2.6;
    const ROLL_PUSH_TIME = 0.34;          // 被弹开时的推退时长（逐步减速到停）
    const ROLL_STUN = 0.55;               // 被弹开的硬直时长（秒）
    const ROLL_END_R = CHAR_S * 2.2, ROLL_END_D = CHAR_S * 1.4;
    // 电锯翻滚：翻滚距离翻倍、取消弹开，改为对路径上的敌人造成攻击力 × N 的伤害
    const CHAIN_ID = 'chain';
    const CHAIN_BASE_MUL = 2;             // 首件：攻击力 ×2，之后每件再 +1 倍
    const CHAIN_KEEPS_DIST = 1;           // 电锨翻滚不再改动翻滚距离，距离始终等于当前闪避距离
    const HIT_STUN = 0.2;                 // 被任何攻击打中都会短暂硬直
    const CHAIN_HIT_R = CHAR_S * 0.8;     // 路径判定半径：比贴身判定（0.4 身位）略大
    const MAX_HP = 8;
    // 各项增益道具的固定增量：都按「基础值的百分之几」给，而不是在当前值上复利叠加
    const RATE_STEP = 0.10;             // 射速：每件降低基础射击间隔的 10%
    const RATE_MIN_MS = 70;             // 射击间隔下限
// 拾取范围：初始 50px（约 1.1 身位），每个磁力线圈把「初始值」抬高 50%（按当时的初始值算）
const PICKUP_BASE = 50;
    // 物品类（补给箱 / 闪光信标 / 挖出的掉落物）统一的拾取半径：与补给箱的判定完全一致。
    // 「拾取范围」这个技能数值只作用于经验球，不影响任何物品的拾取。
    const PICKUP_ITEM_R = CHAR_S * 0.7;
    const PICKUP_STEP_R = 0.5;
    const FIRE_RANGE = 200;             // 初始射击距离
    const FIRE_STEP = FIRE_RANGE * 0.15; // 每个远射瞄镜 +基础距离的 15%
    const SPEED_STEP = 0.15;            // 每个疾行靴 +基础速度的 15%
    const ROLLCD_STEP = 0.15;           // 每个冷却模块降低基础翻滚冷却的 15%
    const ROLLCD_MIN = 0.15;            // 翻滚冷却倍率下限（= 基础值的 15%）
    const BOOM_BASE_R = 62;           // 爆炸子弹初始爆炸半径
    const BOOM_STEP_R = 20;           // 重复拾取每次 +20 爆炸半径
    const BOOM_BLAST_WAIT = 0.12;     // 爆炸命中后延迟多久才结算范围伤害
    const BOOM_BLAST_LIFE = 0.34;     // 余波持续时长（这段时间里只有视觉表现）
    const BOSS_LEVEL_BASE = 20;      // 首个 BOSS 的触发等级
    const HP_RING_TIME = 3.0;        // 血量环满显示时长
    const HP_RING_FADE = 0.9;        // 之后渐渐隐去的时长
    const ROLL_BAR_W = 62, ROLL_BAR_H = 7, ROLL_BAR_DY = 18;  // 脚下翻滚充能条
    const ROCKET_SCALE = 1.7;          // 星球表面火箭的放大倍率
    const ORB_HOMING_SPEED = 620;       // 经验球锁定后的追踪速度（高于玩家最大速度，保证必拾取）
    const PICKUP_TOL = 1.15;             // 实际拾取判定相对绘制圈的放大系数（抵消取整误差）
    const PKG_TIME = 10.0;               // 装备箱选择时限（秒）
    const PKG_TIMER_R = 28;              // 选择倒计时圆环半径（紧贴头顶图标 26*0.95≈24.7）
    const BASE_DMG = 1;                  // 初始攻击力（不再随等级提升）
    // 秘籍道具：战备栏固定栏上按对确认键顺序才会解锁的调试道具，只在本次运行有效（不写存档）
    const CHEAT_ITEM_ID = 'cheat';
    const CHEAT_DMG = 10;                    // 每件攻击力 +10（重复拾取也只加攻击力）
    const CHEAT_AURA_CD = 1.0;               // 射程内的敌人每 1 秒吃一次伤害
    const CHEAT_CODE = ['heart', 'dmg', 'shoes', 'scope', 'shoes', 'dmg', 'heart'];

    // ==================== 工具 ====================
    function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function rand(a, b) { return a + Math.random() * (b - a); }
    function randInt(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); }
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function hash(n) {
        const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
    }
    function hash2(a, b) { return hash(a * 157.31 + b * 271.13); }
    function wrapVal(v, size) { v = v % size; if (v < 0) v += size; return v; }
    function dist(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); }
    function angDiff(a, b) {
        let d = (a - b) % (Math.PI * 2);
        if (d > Math.PI) d -= Math.PI * 2;
        if (d < -Math.PI) d += Math.PI * 2;
        return d;
    }
    function easeOutCubic(t) { const u = 1 - t; return 1 - u * u * u; }
    function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
    // 颜色串都是初始化时写死的常量，但 hexA / shade 每帧要解析几十遍；
    // 按字符串把解析结果缓存下来（返回的数组只被读取，不会被改）
    const HEX_RGB = Object.create(null);
    function hexRgb(h) {
        let c = HEX_RGB[h];
        if (c) return c;
        if (h[0] === '#') {
            if (h.length === 7) c = [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)];
            else if (h.length === 4) c = [parseInt(h[1] + h[1], 16), parseInt(h[2] + h[2], 16), parseInt(h[3] + h[3], 16)];
        }
        if (!c) c = [200, 200, 200];
        HEX_RGB[h] = c;
        return c;
    }
    // #rrggbb + 透明度 → rgba()，供预警与高亮一类需要按帧改透明度的绘制使用
    function hexA(h, a) {
        const c = hexRgb(h);
        return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + clamp(a, 0, 1) + ')';
    }
    function shade(h, amt) {
        const c = hexRgb(h);
        const f = amt >= 0 ? (v => v + (255 - v) * amt) : (v => v * (1 + amt));
        return 'rgb(' + Math.round(clamp(f(c[0]), 0, 255)) + ',' + Math.round(clamp(f(c[1]), 0, 255)) + ',' + Math.round(clamp(f(c[2]), 0, 255)) + ')';
    }
    function roundRectPath(x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        r = Math.max(0, r);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }
    function setFont(size, weight) { ctx.font = (weight || 'bold') + ' ' + size + 'px ' + FONT; }
    const ROUND_FONT = '"幼圆","YouYuan","STYuanti","Trebuchet MS","Microsoft YaHei",sans-serif';
    function setRoundFont(size, weight) { ctx.font = (weight || TITLE_WEIGHT) + ' ' + size + 'px ' + ROUND_FONT; }
    let TITLE_WEIGHT = 'bold';
    // ---------- 中文字距绘制 ----------
    // 逐字测量并绘制：保证 CJK 文本真正居中（不受字形左右边距影响），
    // 同时支持字与字之间插入额外间隙。
    // mode: 'center' 以 x 为整串中心，'left' 以 x 为整串左缘。
    function measureSpaced(text, spacing) {
        const chars = Array.from(text);
        let total = 0;
        for (const c of chars) total += ctx.measureText(c).width;
        return total + (chars.length > 1 ? spacing * (chars.length - 1) : 0);
    }
    function drawSpacedText(text, x, y, spacing, mode) {
        const chars = Array.from(text);
        if (!chars.length) return 0;
        const total = measureSpaced(text, spacing);
        let cx = mode === 'center' ? x - total / 2 : x;
        const prevAlign = ctx.textAlign;
        ctx.textAlign = 'center';   // 每个字在自己的字宽槽内居中
        for (const c of chars) {
            const w = ctx.measureText(c).width;
            ctx.fillText(c, cx + w / 2, y);
            cx += w + spacing;
        }
        ctx.textAlign = prevAlign;
        return total;
    }
    function detectRoundFont() {
        try {
            const probe = '太阳系奥德赛ABC';
            const saved = ctx.font;
            ctx.font = '40px monospace';
            const w1 = ctx.measureText(probe).width;
            ctx.font = '40px "幼圆","YouYuan"';
            const w2 = ctx.measureText(probe).width;
            ctx.font = saved;
            if (Math.abs(w1 - w2) > 0.5) TITLE_WEIGHT = 'normal';
        } catch (e) { }
    }

    // ==================== 音效 ====================
    let audioCtx = null, masterGain = null;
    function ensureAudio() {
        if (!audioCtx) {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 0.5;
                masterGain.connect(audioCtx.destination);
            } catch (e) { audioCtx = null; }
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        return !!audioCtx;
    }
    function tone(opt) {
        if (!save.sound || !audioCtx) return;
        const t = audioCtx.currentTime + (opt.delay || 0);
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = opt.type || 'sine';
        osc.frequency.setValueAtTime(opt.f0, t);
        if (opt.f1 && opt.f1 !== opt.f0) osc.frequency.exponentialRampToValueAtTime(Math.max(20, opt.f1), t + opt.dur);
        const vol = opt.vol === undefined ? 0.12 : opt.vol;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.02, opt.dur * 0.3));
        gain.gain.exponentialRampToValueAtTime(0.0001, t + opt.dur);
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(t);
        osc.stop(t + opt.dur + 0.02);
    }
    function noise(opt) {
        if (!save.sound || !audioCtx) return;
        const t = audioCtx.currentTime + (opt.delay || 0);
        const len = opt.dur;
        const buf = audioCtx.createBuffer(1, Math.max(1, Math.floor(audioCtx.sampleRate * len)), audioCtx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        const filt = audioCtx.createBiquadFilter();
        filt.type = opt.filter || 'lowpass';
        filt.frequency.setValueAtTime(opt.f0 || 1200, t);
        if (opt.f1) filt.frequency.exponentialRampToValueAtTime(Math.max(60, opt.f1), t + len);
        const gain = audioCtx.createGain();
        const vol = opt.vol === undefined ? 0.14 : opt.vol;
        gain.gain.setValueAtTime(vol, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + len);
        src.connect(filt); filt.connect(gain); gain.connect(masterGain);
        src.start(t);
        src.stop(t + len + 0.02);
    }
    const SFX = {
        uiMove: function () { tone({ type: 'square', f0: 620, f1: 760, dur: 0.06, vol: 0.06 }); },
        uiSelect: function () { tone({ type: 'square', f0: 520, f1: 880, dur: 0.1, vol: 0.08 }); tone({ type: 'square', f0: 880, f1: 1320, dur: 0.09, vol: 0.05, delay: 0.06 }); },
        uiBack: function () { tone({ type: 'square', f0: 500, f1: 260, dur: 0.12, vol: 0.07 }); },
        shoot: function () { tone({ type: 'square', f0: 900, f1: 320, dur: 0.09, vol: 0.07 }); noise({ f0: 3200, f1: 700, dur: 0.06, vol: 0.05, filter: 'bandpass' }); },
        hit: function () { noise({ f0: 2400, f1: 500, dur: 0.07, vol: 0.08, filter: 'bandpass' }); },
        enemyDie: function () { tone({ type: 'triangle', f0: 420, f1: 140, dur: 0.16, vol: 0.08 }); noise({ f0: 1400, f1: 300, dur: 0.14, vol: 0.07 }); },
        pickup: function () { tone({ type: 'sine', f0: 1320, dur: 0.1, vol: 0.07 }); tone({ type: 'sine', f0: 1980, dur: 0.12, vol: 0.05, delay: 0.06 }); },
        levelup: function () {
            tone({ type: 'square', f0: 660, dur: 0.09, vol: 0.07 });
            tone({ type: 'square', f0: 880, dur: 0.09, vol: 0.07, delay: 0.08 });
            tone({ type: 'square', f0: 1320, dur: 0.16, vol: 0.07, delay: 0.16 });
        },
        drop: function () { tone({ type: 'sine', f0: 300, f1: 900, dur: 0.35, vol: 0.06 }); },
        item: function () {
            tone({ type: 'triangle', f0: 523, dur: 0.09, vol: 0.08 });
            tone({ type: 'triangle', f0: 784, dur: 0.09, vol: 0.08, delay: 0.07 });
            tone({ type: 'triangle', f0: 1046, dur: 0.2, vol: 0.07, delay: 0.14 });
        },
        roll: function () { noise({ f0: 400, f1: 2600, dur: 0.3, vol: 0.09, filter: 'bandpass' }); },
        hurt: function () { tone({ type: 'sawtooth', f0: 300, f1: 70, dur: 0.3, vol: 0.12 }); noise({ f0: 700, f1: 150, dur: 0.22, vol: 0.1 }); },
        boss: function () {
            for (let i = 0; i < 3; i++) tone({ type: 'sawtooth', f0: 180, f1: 120, dur: 0.3, vol: 0.1, delay: i * 0.34 });

    // ==================== 氛围BGM ====================
    // 设计要点：60BPM 的缓慢和弦循环 + 稀疏的钟琴点缀 + 极轻的高频空气声。
    // 整体刻意避开低频（垫底和弦走高通、主旋律在 C5 以上），
    // 听感放松舒缓，且不会和战斗音效抢低频。
    const BGM_STEP = 1.0;                                   // 1 拍 = 1 秒（60BPM）
    const BGM_BEATS = 4;                                    // 每小节 4 拍
    const BGM_LOOKAHEAD = 0.6;                              // 预排程时长（秒）
    const BGM_FADE = 2.4, BGM_FADE_OUT = 1.3;              // 淡入 / 淡出时长
    const BGM_VOL = 0.9;                                    // 总线音量
    // pad：每小节的和弦音（MIDI 音高）；mel：该小节主旋律 [音高, 相对该拍的延迟秒数]
    const BGM_CHORDS = [
        { pad: [57, 60, 64, 71], mel: [[76, 0], [79, 0.5]] },   // Am9
        { pad: [53, 57, 60, 64], mel: [[72, 0], [76, 0.5]] },   // Fmaj7
        { pad: [52, 55, 59, 64], mel: [[79, 0], [76, 0.5]] },   // Cmaj7
        { pad: [55, 59, 62, 67], mel: [[74, 0], [71, 0.5]] },   // G6
        { pad: [57, 60, 64, 67], mel: [[72, 0], [76, 0.5]] },   // Am7
        { pad: [50, 53, 57, 62], mel: [[69, 0], [72, 0.5]] },   // Dm7
        { pad: [53, 57, 60, 64], mel: [[77, 0], [81, 0.5]] },   // Fmaj7
        { pad: [52, 56, 59, 64], mel: [[71, 0], [68, 0.5]] }    // E7sus4
    ];
    let bgmOut = null, bgmAirNodes = null, bgmTimer = 0, bgmStep = 0, bgmNext = 0, bgmOn = false;
    function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }
    function bgmBus() {
        if (!bgmOut) {
            // 低频削减：BGM 独占的一层 lowshelf，把 180Hz 以下的浑浊部分压下去，
            // 听感更清爽，也不会和战斗音效抢低频（战斗音效走 masterGain，不受这里影响）
            const lowHp = audioCtx.createBiquadFilter();
            lowHp.type = 'highpass';
            lowHp.frequency.value = 75;                 // 切掉最下面那一坨
            lowHp.Q.value = 0.5;
            const lowCut = audioCtx.createBiquadFilter();
            lowCut.type = 'lowshelf';
            lowCut.frequency.value = 200;               // 低频拐点
            lowCut.gain.value = -11;                    // 200Hz 以下最多压掉约 11dB
            bgmOut = audioCtx.createGain();
            bgmOut.gain.value = 0.0001;
            bgmOut.connect(lowHp); lowHp.connect(lowCut); lowCut.connect(masterGain);
        }
        return bgmOut;
    }
    // 和弦垫：慢起慢落 + 轻微失谐，带高通切掉多余的浑厚低频
    function bgmPad(t, dur, notes) {
        const lp = audioCtx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.setValueAtTime(1600, t);
        lp.frequency.linearRampToValueAtTime(950, t + dur);
        lp.Q.value = 0.4;
        const hp = audioCtx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 200;
        const env = audioCtx.createGain();
        env.gain.setValueAtTime(0.0001, t);
        env.gain.exponentialRampToValueAtTime(0.05, t + dur * 0.42);
        env.gain.setValueAtTime(0.05, t + dur * 0.62);
        env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        lp.connect(env); env.connect(hp); hp.connect(bgmBus());
        for (const m of notes) {
            const f = mtof(m);
            for (let i = 0; i < 2; i++) {
                const osc = audioCtx.createOscillator();
                osc.type = i ? 'triangle' : 'sine';
                osc.frequency.value = f;
                osc.detune.value = i ? 6 : -6;
                const vg = audioCtx.createGain();
                vg.gain.value = i ? 0.3 : 0.7;
                osc.connect(vg); vg.connect(lp);
                osc.start(t);
                osc.stop(t + dur + 0.05);
            }
        }
    }
    // 钟琴点缀：快起慢落，叠两个高次泛音并加极轻的颤音
    function bgmBell(t, m, vol) {
        const f = mtof(m);
        const dur = 2.6;
        const env = audioCtx.createGain();
        env.gain.setValueAtTime(0.0001, t);
        env.gain.exponentialRampToValueAtTime(vol, t + 0.02);
        env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        const vib = audioCtx.createOscillator();
        vib.frequency.value = 4.6;
        const vibAmt = audioCtx.createGain();
        vibAmt.gain.value = 3.2;
        vib.connect(vibAmt);
        vib.start(t);
        vib.stop(t + dur + 0.05);
        const parts = [[1, 1], [2, 0.2], [3.01, 0.07]];
        for (const p of parts) {
            const osc = audioCtx.createOscillator();
            osc.type = 'sine';
            osc.frequency.value = f * p[0];
            vibAmt.connect(osc.frequency);
            const g = audioCtx.createGain();
            g.gain.value = p[1];
            osc.connect(g); g.connect(env);
            osc.start(t);
            osc.stop(t + dur + 0.02);
        }
        env.connect(bgmBus());
    }
    // 空气声：循环白噪声经高通 + 低通，只保留中高频的“风”，并用极慢 LFO 让它呼吸
    function bgmAirStart(t) {
        const len = 3;
        const buf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * len), audioCtx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        src.loop = true;
        const hp = audioCtx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 700;
        const lp = audioCtx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 2000;
        lp.Q.value = 0.6;
        const g = audioCtx.createGain();
        g.gain.value = 0.02;
        const lfo = audioCtx.createOscillator();
        lfo.frequency.value = 0.055;
        const lfoAmt = audioCtx.createGain();
        lfoAmt.gain.value = 0.009;
        lfo.connect(lfoAmt); lfoAmt.connect(g.gain);
        const flfo = audioCtx.createOscillator();
        flfo.frequency.value = 0.031;
        const flfoAmt = audioCtx.createGain();
        flfoAmt.gain.value = 420;
        flfo.connect(flfoAmt); flfoAmt.connect(lp.frequency);
        src.connect(hp); hp.connect(lp); lp.connect(g); g.connect(bgmBus());
        src.start(t); lfo.start(t); flfo.start(t);
        bgmAirNodes = { src: src, lfo: lfo, flfo: flfo };
    }
    function bgmAirStop(t) {
        if (!bgmAirNodes) return;
        const n = bgmAirNodes;
        bgmAirNodes = null;
        n.src.stop(t); n.lfo.stop(t); n.flfo.stop(t);
    }
    // 每拍排一次程：和弦在每小节首拍铺开，主旋律按表落在对应延迟上
    function bgmScheduleStep(t) {
        const bar = Math.floor(bgmStep / BGM_BEATS) % BGM_CHORDS.length;
        const beat = bgmStep % BGM_BEATS;
        const c = BGM_CHORDS[bar];
        if (beat === 0) {
            bgmPad(t, BGM_STEP * BGM_BEATS + 0.6, c.pad);
            for (const n of c.mel) bgmBell(t + n[1], n[0], 0.055);
        }
        bgmStep++;
    }
    function bgmTick() {
        if (!audioCtx || !bgmOn || !save.sound) return;
        const now = audioCtx.currentTime;
        if (bgmNext < now) bgmNext = now + 0.05;
        while (bgmNext < now + BGM_LOOKAHEAD) {
            bgmScheduleStep(bgmNext);
            bgmNext += BGM_STEP;
        }
    }
    function startBgm() {
        if (bgmOn || !ensureAudio() || !audioCtx) return;
        bgmOn = true;
        const bus = bgmBus();
        const now = audioCtx.currentTime;
        bus.gain.cancelScheduledValues(now);
        bus.gain.setValueAtTime(Math.max(0.0001, bus.gain.value), now);
        bus.gain.exponentialRampToValueAtTime(BGM_VOL, now + BGM_FADE);
        bgmNext = now + 0.12;
        bgmStep = 0;
        bgmAirStart(now);
        if (!bgmTimer) bgmTimer = setInterval(bgmTick, 120);
    }
    function stopBgm() {
        if (!bgmOn) return;
        bgmOn = false;
        if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = 0; }
        if (bgmOut && audioCtx) {
            const now = audioCtx.currentTime;
            bgmOut.gain.cancelScheduledValues(now);
            bgmOut.gain.setValueAtTime(Math.max(0.0001, bgmOut.gain.value), now);
            bgmOut.gain.exponentialRampToValueAtTime(0.0001, now + BGM_FADE_OUT);
            bgmAirStop(now + BGM_FADE_OUT + 0.05);
        } else {
            bgmAirStop(0);
        }
    }
    // 统一按当前状态决定氛围BGM：仅地球着陆动画结束后播放，战斗中继续循环（音量已压低）
    function syncBgm() {
        const on = save.sound && scene === 'play' && world && !world.landing && !world.launch && !!(world.planet && world.planet.home);
        if (on) startBgm();
        else if (bgmOn) stopBgm();
    }

    function defaultPlanetRec() {
        return {
            clears: 0, runs: 0, kills: 0,
            bestScore: 0, totalScore: 0,
            bestLevel: 0, bestTime: 0, totalTime: 0,

    function defaultSave() {
        const s = { sound: true, touchUI: false, autoFire: true, totalScore: 0, totalKills: 0, planets: {}, loadout: {}, gems: {}, relics: {} };
        for (const p of savePlanetIds()) s.planets[p] = defaultPlanetRec();
        return s;
    }
    function loadSave() {
        let raw = null;
        try { raw = window.localStorage.getItem(SAVE_KEY); } catch (e) { raw = null; }
        const base = defaultSave();
        if (!raw) return base;
        try {
            const data = JSON.parse(raw);
            if (data && typeof data === 'object') {
                if (typeof data.sound === 'boolean') base.sound = data.sound;
                if (typeof data.touchUI === 'boolean') base.touchUI = data.touchUI;
                if (typeof data.autoFire === 'boolean') base.autoFire = data.autoFire;
                base.totalScore = data.totalScore | 0;
                base.totalKills = data.totalKills | 0;
                if (data.loadout && typeof data.loadout === 'object') base.loadout = data.loadout;
                if (data.gems && typeof data.gems === 'object') {
                    for (const p of PLANETS) base.gems[p.id] = data.gems[p.id] | 0;
                }
                if (data.relics && typeof data.relics === 'object') {
                    for (const r of RELICS) base.relics[r.id] = data.relics[r.id] ? 1 : 0;
                }
                if (data.planets) {
                    for (const pid of savePlanetIds()) {
                        const src = data.planets[pid];
                        if (!src) continue;
                        const rec = base.planets[pid];
                        rec.clears = src.clears | 0;
                        rec.runs = src.runs | 0;
                        rec.kills = src.kills | 0;
                        rec.bestScore = src.bestScore | 0;
                        rec.totalScore = src.totalScore | 0;
                        rec.bestLevel = src.bestLevel | 0;
                        rec.bestTime = src.bestTime | 0;
                        rec.totalTime = src.totalTime | 0;
                        if (src.weapons) for (const k in src.weapons) rec.weapons[k] = src.weapons[k] | 0;
                        if (src.items) for (const k in src.items) rec.items[k] = src.items[k] | 0;
                    }
                }
            }
        } catch (e) {
            // 读档出错不能静默吞掉：否则会像之前那样悄悄退化成部分读档（战绩清零）
            if (window.console && console.warn) console.warn('[space_odyssey] 读档失败，已退回默认值：', e);
        }
        return base;
    }
    function persist() {
        try {
            const out = JSON.parse(JSON.stringify(save));
            // 秘籍道具只在本次运行里有效：不写进存档
            if (out.loadout) {
                for (const k in out.loadout) {
                    const arr = out.loadout[k];
                    if (!Array.isArray(arr)) continue;
                    for (let i = 0; i < arr.length; i++) if (arr[i] === CHEAT_ITEM_ID) arr[i] = null;
                }
            }
            window.localStorage.setItem(SAVE_KEY, JSON.stringify(out));
        } catch (e) { }
    }

            sp: 0.6 + hash(i * 9.1 + 4) * 2.4,
            ph: hash(i * 11.3 + 5) * Math.PI * 2,
            dx: 0.28 + hash(i * 13.7 + 6) * 1.15,
            dy: (hash(i * 17.3 + 7) - 0.5) * 0.34,
            big: hash(i * 19.7 + 8) > 0.90
        });
    }
    let solarT = 0;
    function drawStarfield(t, alpha) {
        ctx.fillStyle = '#03040c';
        ctx.fillRect(0, 0, W, H);
        for (let i = 0; i < STARS.length; i++) {
            const s = STARS[i];
            let sx = (s.x + t * s.dx) % W; if (sx < 0) sx += W;
            let sy = (s.y + t * s.dy) % H; if (sy < 0) sy += H;
            const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
            ctx.globalAlpha = alpha * (0.25 + 0.75 * tw);
            ctx.fillStyle = i % 9 === 0 ? '#cfe4ff' : '#ffffff';
            ctx.beginPath();
            ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
            ctx.fill();
            if (s.big) {
                // 大星闪烁光晕
                ctx.globalAlpha = alpha * 0.35 * tw;
                const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, s.r * 7);
                g.addColorStop(0, 'rgba(200,225,255,0.55)');
                g.addColorStop(1, 'rgba(200,225,255,0)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(sx, sy, s.r * 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = alpha * 0.55 * tw;
                ctx.strokeStyle = '#dbeaff';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(sx - s.r * 4, sy); ctx.lineTo(sx + s.r * 4, sy);
                ctx.moveTo(sx, sy - s.r * 4); ctx.lineTo(sx, sy + s.r * 4);
                ctx.stroke();
            }
        }
        ctx.globalAlpha = 1;
    }
    function drawNebula(t) {
        ctx.save();
        ctx.globalAlpha = 0.5;
        const blobs = [
            { x: W * 0.18, y: H * 0.22, r: 300, c: 'rgba(80,40,140,0.20)' },
            { x: W * 0.72, y: H * 0.72, r: 340, c: 'rgba(20,90,150,0.18)' },
            { x: W * 0.45, y: H * 0.12, r: 240, c: 'rgba(150,40,90,0.12)' },
            { x: W * 0.92, y: H * 0.30, r: 260, c: 'rgba(40,120,130,0.14)' }
        ];
        for (let i = 0; i < blobs.length; i++) {
            const b = blobs[i];
            const cx = b.x + Math.sin(t * 0.012 + i * 1.7) * 22;
            const cy = b.y + Math.cos(t * 0.009 + i * 2.3) * 15;
            const rr = b.r * (1 + 0.05 * Math.sin(t * 0.05 + i));
            const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rr);
            g.addColorStop(0, b.c);
            g.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(cx, cy, rr, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    // ==================== 太阳系绘制 ====================
    function planetCleared(id) { return save.planets[id] && save.planets[id].clears > 0; }

    // ---- 通用绘制部件 ----
    // 表面横向流动的循环工具（模拟自转，而非旋转圆球）
    function wrapX(x, r) {
        const w = r * 2;
        x = ((x + r) % w + w) % w - r;
        return x;
    }
    function drawCrater(x, y, cr, rot) {
        const g = P.createRadialGradient(x - cr * 0.3, y - cr * 0.3, cr * 0.1, x, y, cr);
        g.addColorStop(0, 'rgba(40,36,32,0.42)');
        g.addColorStop(0.62, 'rgba(70,64,58,0.30)');
        g.addColorStop(0.86, 'rgba(215,208,196,0.30)');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        P.fillStyle = g;
        P.beginPath();
        P.arc(x, y, cr, 0, Math.PI * 2);
        P.fill();
    }
    function drawBands(r, rows, palette, wob, phase, alpha) {
        // 大气条带（带湍流起伏）
        const h = (r * 2) / rows;
        for (let i = 0; i < rows; i++) {
            const y = -r + i * h;
            P.fillStyle = palette[i % palette.length];
            P.beginPath();
            P.moveTo(-r - 2, y);
            for (let k = 0; k <= 12; k++) {
                const x = -r - 2 + (k / 12) * (r * 2 + 4);
                P.lineTo(x, y + Math.sin(k * 0.9 + i * 1.7 + phase) * wob);
            }
            for (let k = 12; k >= 0; k--) {
                const x = -r - 2 + (k / 12) * (r * 2 + 4);
                P.lineTo(x, y + h + Math.sin(k * 0.9 + i * 1.7 + phase + 0.6) * wob);
            }
            P.closePath();
            P.fill();
            if (alpha) {
                P.fillStyle = 'rgba(0,0,0,' + (0.04 + 0.03 * (i % 2)) + ')';
                P.fillRect(-r, y, r * 2, h * 0.35);
            }
        }
    }
    function fadeAlpha(col, a) {
        const i = col.lastIndexOf(',');
        return col.slice(0, i + 1) + a + ')';
    }
    function drawVortex(x, y, rx, ry, col, rot) {
        const g = P.createRadialGradient(x, y, 1, x, y, Math.max(rx, ry));
        g.addColorStop(0, col);
        g.addColorStop(0.6, fadeAlpha(col, 0.45));
        g.addColorStop(1, fadeAlpha(col, 0));
        P.fillStyle = g;
        P.beginPath();
        P.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2);
        P.fill();
    }
    // 晨昏线（太阳在左，光来自左侧）
    function drawTerminator(r) {
        const g = P.createLinearGradient(-r * 0.75, -r * 0.28, r * 0.85, r * 0.45);
        g.addColorStop(0, 'rgba(0,0,0,0)');
        g.addColorStop(0.42, 'rgba(0,0,0,0.04)');
        g.addColorStop(0.68, 'rgba(4,6,14,0.32)');
        g.addColorStop(0.88, 'rgba(2,3,9,0.66)');
        g.addColorStop(1, 'rgba(0,1,5,0.86)');
        P.fillStyle = g;
        P.fillRect(-r, -r, r * 2, r * 2);
    }
    // 大气边缘辉光
    function drawAtmosphere(r, col, w) {
        const g = P.createRadialGradient(0, 0, r * (1 - w), 0, 0, r * 1.06);
        g.addColorStop(0, col.replace('ALPHA', '0.55'));
        g.addColorStop(0.55, col.replace('ALPHA', '0.22'));
        g.addColorStop(1, col.replace('ALPHA', '0'));
        P.fillStyle = g;
        P.beginPath();
        P.arc(0, 0, r * 1.06, 0, Math.PI * 2);
        P.fill();
    }
    // 受光侧高光边
    function drawLimbLight(r, col) {
        P.save();
        P.beginPath();
        P.arc(0, 0, r, 0, Math.PI * 2);
        P.clip();
        const g = P.createRadialGradient(-r * 0.66, -r * 0.26, r * 0.50, -r * 0.66, -r * 0.26, r * 1.38);
        g.addColorStop(0, col.replace('ALPHA', '0'));
        g.addColorStop(0.42, col.replace('ALPHA', '0.10'));
        g.addColorStop(0.62, col.replace('ALPHA', '0.26'));
        g.addColorStop(0.80, col.replace('ALPHA', '0.08'));
        g.addColorStop(1, col.replace('ALPHA', '0'));
        P.fillStyle = g;
        P.beginPath();
        P.arc(0, 0, r, 0, Math.PI * 2);
        P.fill();
        P.restore();
    }

    function planetTexture(p, r, rot) {
        P.save();
        P.beginPath();
        P.arc(0, 0, r, 0, Math.PI * 2);
        P.clip();
        switch (p.id) {
            case 'mercury': {
                // 月海（暗色平原）
                P.fillStyle = 'rgba(96,90,82,0.45)';
                for (let i = 0; i < 3; i++) {
                    const a = hash(i * 3.3 + 11) * Math.PI * 2;
                    const d = hash(i * 5.1 + 12) * r * 0.6;
                    P.beginPath();
                    P.ellipse(Math.cos(a) * d, Math.sin(a) * d, r * (0.30 + hash(i * 2.3) * 0.26), r * (0.20 + hash(i * 3.7) * 0.18), a, 0, Math.PI * 2);
                    P.fill();
                }
                // 陨石坑（带受光边缘）
                for (let i = 0; i < 14; i++) {
                    const a = hash(i * 3 + 13) * Math.PI * 2;
                    const d = hash(i * 5 + 14) * r * 0.92;
                    const cr = r * (0.05 + hash(i * 7 + 15) * 0.13);
                    drawCrater(Math.cos(a) * d, Math.sin(a) * d * 0.9, cr, a);
                }
                break;
            }
            case 'venus': {
                // 硫酸云层 + 高速 Y 形气流
                P.fillStyle = '#e8c078';
                P.fillRect(-r, -r, r * 2, r * 2);
                for (let i = 0; i < 7; i++) {
                    const y = -r + (i / 7) * r * 2 + Math.sin(i * 2.1) * r * 0.08;
                    const flow = wrapX(rot * r * 0.35 + i * r * 0.42, r);
                    P.strokeStyle = i % 2 ? 'rgba(255,240,200,0.30)' : 'rgba(170,120,40,0.28)';
                    P.lineWidth = r * (0.10 + hash(i * 3) * 0.10);
                    P.beginPath();
                    P.moveTo(flow - r, y);
                    P.quadraticCurveTo(flow - r * 0.2, y + r * 0.30, flow + r * 0.35, y - r * 0.06);
                    P.quadraticCurveTo(flow + r * 0.8, y - r * 0.30, flow + r, y + r * 0.08);
                    P.stroke();
                }
                // 极地涡旋
                drawVortex(0, -r * 0.86, r * 0.5, r * 0.22, 'rgba(255,245,215,0.5)', 0);
                drawVortex(0, r * 0.88, r * 0.45, r * 0.20, 'rgba(180,130,50,0.4)', 0);
                break;
            }
            case 'earth': {
                // 海洋
                const og = P.createLinearGradient(-r, -r, r, r);
                og.addColorStop(0, '#2f7fd0');
                og.addColorStop(0.5, '#1f63b4');
                og.addColorStop(1, '#123f80');
                P.fillStyle = og;
                P.fillRect(-r, -r, r * 2, r * 2);
                // 陆地
                for (let i = 0; i < 6; i++) {
                    const a = hash(i * 3 + 21) * Math.PI * 2;
                    const d = hash(i * 5 + 22) * r * 0.62;
                    const cx = Math.cos(a) * d, cy = Math.sin(a) * d * 0.85;
                    P.fillStyle = ['#3f8f46', '#4d9c4a', '#7a8f3e', '#5a7a35'][i % 4];
                    P.beginPath();
                    for (let k = 0; k <= 10; k++) {
                        const ka = (k / 10) * Math.PI * 2;
                        const rr = r * (0.14 + hash(i * 7 + k) * 0.17);
                        const px = cx + Math.cos(ka) * rr, py = cy + Math.sin(ka) * rr * 0.8;
                        if (k === 0) P.moveTo(px, py); else P.lineTo(px, py);
                    }
                    P.closePath();
                    P.fill();
                    // 沙漠与高地
                    P.fillStyle = 'rgba(190,165,90,0.5)';
                    P.beginPath();
                    P.ellipse(cx + r * 0.04, cy, r * 0.07, r * 0.05, 0, 0, Math.PI * 2);
                    P.fill();
                }
                // 极冰冠
                // 北极冠：下沿逐渐变淡
                const iceE = P.createLinearGradient(0, -r * 1.25, 0, -r * 0.55);
                iceE.addColorStop(0, 'rgba(244,252,255,0.95)');
                iceE.addColorStop(0.45, 'rgba(240,250,255,0.72)');
                iceE.addColorStop(1, 'rgba(238,248,255,0)');
                P.fillStyle = iceE;
                P.beginPath();
                P.ellipse(0, -r * 0.95, r * 0.58, r * 0.34, 0, 0, Math.PI * 2);
                P.fill();
                // 云层（缓慢飘动）
                for (let i = 0; i < 8; i++) {
                    const ph = i * 1.7;
                    const cx = wrapX(hash(i * 11 + 31) * r * 1.6 + rot * r * 0.75, r);
                    const cy = (hash(i * 13 + 32) * 2 - 1) * r * 0.82;
                    P.fillStyle = 'rgba(255,255,255,' + (0.26 + 0.18 * (0.5 + 0.5 * Math.sin(rot * 0.8 + ph))) + ')';
                    P.beginPath();
                    P.ellipse(cx, cy, r * (0.24 + hash(i * 3 + 33) * 0.26), r * 0.10, hash(i * 5 + 34) * 1.2 - 0.6, 0, Math.PI * 2);
                    P.fill();
                }
                break;
            }
            case 'mars': {
                // 铁锈色平原
                P.fillStyle = '#c05a34';
                P.fillRect(-r, -r, r * 2, r * 2);
                // 暗色反照率区（沙暴与古海盆）
                for (let i = 0; i < 5; i++) {
                    const a = hash(i * 3 + 41) * Math.PI * 2;
                    const d = hash(i * 5 + 42) * r * 0.6;
                    P.fillStyle = i % 2 ? 'rgba(120,55,32,0.5)' : 'rgba(215,120,70,0.45)';
                    P.beginPath();
                    P.ellipse(Math.cos(a) * d, Math.sin(a) * d * 0.85, r * (0.20 + hash(i * 7 + 43) * 0.22), r * (0.13 + hash(i * 9 + 44) * 0.14), a, 0, Math.PI * 2);
                    P.fill();
                }
                // 陨石坑
                for (let i = 0; i < 8; i++) {
                    const a = hash(i * 3 + 45) * Math.PI * 2;
                    const d = hash(i * 5 + 46) * r * 0.85;
                    drawCrater(Math.cos(a) * d, Math.sin(a) * d * 0.9, r * (0.05 + hash(i * 7 + 47) * 0.11), a);
                }
                // 极冠
                const iceM = P.createLinearGradient(0, -r * 1.2, 0, -r * 0.62);
                iceM.addColorStop(0, 'rgba(248,252,255,0.95)');
                iceM.addColorStop(0.45, 'rgba(243,250,255,0.70)');
                iceM.addColorStop(1, 'rgba(240,248,255,0)');
                P.fillStyle = iceM;
                P.beginPath();
                P.ellipse(0, -r * 0.97, r * 0.48, r * 0.30, 0, 0, Math.PI * 2);
                P.fill();
                // 沙尘暴
                drawVortex(wrapX(-r * 0.35 + rot * r * 0.45, r), r * 0.1, r * 0.30, r * 0.16, 'rgba(235,180,130,0.30)', 0.3);
                break;
            }
            case 'jupiter': {
                // 多条带 + 湍流
                drawBands(r, 9, [
                    'rgba(226,196,160,0.95)', 'rgba(168,110,68,0.95)', 'rgba(238,214,182,0.95)',
                    'rgba(186,124,76,0.95)', 'rgba(232,205,172,0.95)', 'rgba(158,100,62,0.95)',
                    'rgba(240,220,190,0.95)', 'rgba(176,116,70,0.95)', 'rgba(226,200,166,0.95)'
                ], r * 0.035, rot * 0.22, true);
                // 白色风暴：沿带流向横向掠过球面
                for (let i = 0; i < 5; i++) {
                    const yy = -r * 0.62 + (i / 4) * r * 1.3 + Math.sin(i * 2.3) * r * 0.10;
                    const xx = wrapX(rot * r * 1.15 + i * r * 0.62, r);
                    drawVortex(xx, yy, r * (0.16 + hash(i * 5) * 0.10), r * 0.085,
                        i % 2 ? 'rgba(255,250,240,0.62)' : 'rgba(255,246,230,0.5)', 0.05);
                }
                // 大红斑
                drawVortex(r * 0.26, r * 0.22, r * 0.26, r * 0.15, 'rgba(196,74,44,0.9)', 0.05);
                drawVortex(r * 0.26, r * 0.22, r * 0.15, r * 0.08, 'rgba(232,130,90,0.75)', 0);
                break;
            }
            case 'saturn': {
                // 柔和奶油色条带
                drawBands(r, 7, [
                    'rgba(238,220,180,0.95)', 'rgba(206,182,132,0.95)', 'rgba(244,230,196,0.95)',
                    'rgba(198,172,120,0.95)', 'rgba(240,226,190,0.95)', 'rgba(212,190,140,0.95)',
                    'rgba(236,218,180,0.95)'
                ], r * 0.022, rot * 0.15, true);
                // 北极六边形霾（固定）
                drawVortex(0, -r * 0.86, r * 0.42, r * 0.16, 'rgba(160,150,120,0.35)', 0);
                for (let i = 0; i < 4; i++) {
                    const yy = -r * 0.45 + (i / 3) * r * 1.0;
                    const xx = wrapX(rot * r * 0.7 + i * r * 0.78, r);
                    drawVortex(xx, yy, r * (0.14 + hash(i * 7) * 0.09), r * 0.06,
                        'rgba(255,248,220,0.42)', 0);
                }
                break;
            }
            case 'uranus': {
                // 近乎无特征的淡青
                const ug = P.createLinearGradient(0, -r, 0, r);
                ug.addColorStop(0, '#b6f0f2');
                ug.addColorStop(0.55, '#8fdfe3');
                ug.addColorStop(1, '#68b9c2');
                P.fillStyle = ug;
                P.fillRect(-r, -r, r * 2, r * 2);
                P.strokeStyle = 'rgba(255,255,255,0.22)';
                P.lineWidth = r * 0.05;
                for (let i = 0; i < 4; i++) {
                    P.beginPath();
                    P.ellipse(0, -r * 0.6 + i * r * 0.4, r * 0.9, r * 0.12, 0.12, 0, Math.PI * 2);
                    P.stroke();
                }
                drawVortex(0, r * 0.55, r * 0.3, r * 0.12, 'rgba(255,255,255,0.35)', 0);
                break;
            }
            case 'neptune': {
                const ng = P.createLinearGradient(0, -r, 0, r);
                ng.addColorStop(0, '#4f7ce8');
                ng.addColorStop(0.6, '#3358c8');
                ng.addColorStop(1, '#20388f');
                P.fillStyle = ng;
                P.fillRect(-r, -r, r * 2, r * 2);
                // 大暗斑
                drawVortex(-r * 0.28, -r * 0.10, r * 0.30, r * 0.17, 'rgba(12,24,80,0.75)', 0.1);
                // 甲烷卷云亮斑
                for (let i = 0; i < 5; i++) {
                    const y = -r * 0.55 + i * r * 0.28;
                    const x = wrapX(rot * r * 0.9 + i * r * 0.56, r);
                    P.fillStyle = 'rgba(220,240,255,' + (0.20 + 0.10 * Math.sin(rot * 0.5 + i)) + ')';
                    P.beginPath();
                    P.ellipse(x, y, r * (0.26 + hash(i * 7) * 0.24), r * 0.055, 0.04, 0, Math.PI * 2);
                    P.fill();
                }
                drawVortex(r * 0.42, r * 0.42, r * 0.16, r * 0.09, 'rgba(255,255,255,0.5)', 0);
                break;
            }
            case 'pluto': {
                // 暗色赤道带（冥王星之海）
                P.fillStyle = '#8d7d6d';
                P.fillRect(-r, -r, r * 2, r * 2);
                P.fillStyle = 'rgba(70,58,62,0.55)';
                P.beginPath();
                P.ellipse(0, r * 0.10, r * 0.98, r * 0.30, 0, 0, Math.PI * 2);
                P.fill();
                // 汤博区（心形氮冰原）
                const hx = r * 0.16 + Math.sin(rot * 0.4) * r * 0.05, hy = r * 0.16, hs = r * 0.46;
                P.fillStyle = 'rgba(250,244,232,0.85)';
                P.beginPath();
                P.moveTo(hx, hy + hs);
                P.bezierCurveTo(hx - hs * 1.15, hy - hs * 0.45, hx - hs * 0.25, hy - hs * 1.15, hx, hy - hs * 0.38);
                P.bezierCurveTo(hx + hs * 0.25, hy - hs * 1.15, hx + hs * 1.15, hy - hs * 0.45, hx, hy + hs);
                P.fill();
                // 撞击坑
                for (let i = 0; i < 4; i++) {
                    const a = hash(i * 9 + 51) * Math.PI * 2;
                    drawCrater(Math.cos(a) * r * 0.7, Math.sin(a) * r * 0.6, r * (0.06 + hash(i * 3) * 0.08), a);
                }
                break;
            }
        }
        P.restore();
    }

    // ---- 行星环（前/后半环分别绘制，实现遮挡） ----
    const RING_LAYERS = [
        { k: 1.00, w: 0.07, c: 'rgba(206,190,152,0.38)' },
        { k: 0.90, w: 0.13, c: 'rgba(247,233,196,0.62)' },
        { k: 0.80, w: 0.035, c: 'rgba(28,22,16,0.42)' },
        { k: 0.70, w: 0.10, c: 'rgba(236,216,172,0.55)' },
        { k: 0.60, w: 0.03, c: 'rgba(28,22,16,0.30)' },
        { k: 0.52, w: 0.07, c: 'rgba(230,210,168,0.45)' }
    ];
    function drawPlanetRing(p, r, tilt, front) {
        const uranus = p.ringStyle === 'uranus';
        const rx = r * (uranus ? 1.26 : 1.42);
        const ry = rx * (uranus ? 0.90 : 0.40);
        P.save();
        P.rotate(tilt);
        for (let i = 0; i < RING_LAYERS.length; i++) {
            if (uranus && i > 1) continue;
            const L = RING_LAYERS[i];
            P.strokeStyle = uranus ? 'rgba(200,240,245,0.24)' : L.c;
            P.lineWidth = Math.max(1, rx * (uranus ? 0.03 : L.w));
            P.beginPath();
            P.ellipse(0, 0, rx * L.k, ry * L.k, 0, front ? 0 : Math.PI, front ? Math.PI : Math.PI * 2);
            P.stroke();
        }
        P.restore();
    }

    // ---- 星球本体（离屏缓存，旋转很慢所以低频重绘） ----
    function drawPlanetBody(p, r, rot) {
        const g = P.createRadialGradient(-r * 0.52, -r * 0.32, r * 0.06, 0, 0, r * 1.12);
        g.addColorStop(0, shade(p.colA, 0.30));
        g.addColorStop(0.45, p.colA);
        g.addColorStop(0.88, p.colB);
        g.addColorStop(1, shade(p.colB, -0.25));
        P.fillStyle = g;
        P.beginPath();
        P.arc(0, 0, r, 0, Math.PI * 2);
        P.fill();
        P.save();
        P.beginPath();
        P.arc(0, 0, r, 0, Math.PI * 2);
        P.clip();
        planetTexture(p, r, rot);
        drawTerminator(r);
        P.restore();
        if (p.id === 'earth') drawAtmosphere(r, 'rgba(140,205,255,ALPHA)', 0.16);
        else if (p.id === 'venus') drawAtmosphere(r, 'rgba(255,225,160,ALPHA)', 0.18);
        else if (p.id === 'neptune') drawAtmosphere(r, 'rgba(120,170,255,ALPHA)', 0.14);
        else if (p.id === 'uranus') drawAtmosphere(r, 'rgba(170,245,250,ALPHA)', 0.14);
        else if (p.id === 'saturn' || p.id === 'jupiter') drawAtmosphere(r, 'rgba(255,225,180,ALPHA)', 0.10);
        else if (p.id === 'pluto') drawAtmosphere(r, 'rgba(220,225,255,ALPHA)', 0.10);
        if (p.id === 'earth' || p.id === 'venus' || p.id === 'jupiter' ||
            p.id === 'saturn' || p.id === 'neptune' || p.id === 'uranus') {
            drawLimbLight(r, 'rgba(255,250,235,ALPHA)');
        }
    }

    const planetSprites = {};
    const SPRITE_SCALE = 2.2;
    function getPlanetSprite(p) {
        const rot = solarT * p.rotSp;
        const R = Math.ceil(p.r * 2.24);
        let c = planetSprites[p.id];
        if (!c || c.R !== R || Math.abs(rot - c.rot) > 0.022) {
            const cv = document.createElement('canvas');
            cv.width = Math.ceil(R * 2 * SPRITE_SCALE);
            cv.height = cv.width;
            const g2 = cv.getContext('2d');
            g2.setTransform(SPRITE_SCALE, 0, 0, SPRITE_SCALE, cv.width / 2, cv.height / 2);
            const savedP = P;
            P = g2;
            drawPlanetBody(p, p.r, rot);
            P = savedP;
            c = { canvas: cv, R: R, rot: rot };
            planetSprites[p.id] = c;
        }
        return c;
    }

    // 地球卫星：轨道远近两半分开画，卫星本体按所在半边决定前后
    function drawMoonOrbit(px, py, mR, front) {
        ctx.save();
        ctx.strokeStyle = 'rgba(190,205,225,0.18)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        if (front) ctx.ellipse(px, py, mR, mR * 0.40, 0, 0, Math.PI);
        else ctx.ellipse(px, py, mR, mR * 0.40, 0, Math.PI, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }
    function drawMoonDisc(mx, my) {
        const mg = ctx.createRadialGradient(mx - 1, my - 1, 0.4, mx, my, 3.6);
        mg.addColorStop(0, '#eef1f6');
        mg.addColorStop(1, '#9aa2b0');
        ctx.fillStyle = mg;
        ctx.beginPath();
        ctx.arc(mx, my, 3.4, 0, Math.PI * 2);
        ctx.fill();
    }
    function moonState(p, t, px, py, r) {
        const a = t * 0.5 + p.bobPh;
        const mR = r * 2.0;
        return { a: a, mR: mR, mx: px + Math.cos(a) * mR, my: py + Math.sin(a) * mR * 0.40 };
    }
    function drawPlanet(p, t, highlight) {
        const r = p.r;
        const ppos = planetPos(p);
        const px = ppos.x, py = ppos.y;
        const gc = hexRgb(p.colA);
        const breathe = 1 + 0.04 * Math.sin(t * 0.5 + p.bobPh);
        // 外晕（缓慢呼吸）
        ctx.save();
        const glow = ctx.createRadialGradient(p.x, py, r * 0.7, p.x, py, r * 2.0 * breathe);
        glow.addColorStop(0, 'rgba(' + gc[0] + ',' + gc[1] + ',' + gc[2] + ',0.20)');
        glow.addColorStop(1, 'rgba(' + gc[0] + ',' + gc[1] + ',' + gc[2] + ',0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(px, py, r * 2.0 * breathe, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        // 选中环
        if (highlight > 0) {
            ctx.save();
            ctx.strokeStyle = 'rgba(140,230,255,' + (0.30 + 0.35 * Math.sin(t * 6)) + ')';
            ctx.lineWidth = 2.5;
            ctx.setLineDash([9, 8]);
            ctx.beginPath();
            ctx.arc(px, py, r + 18 + Math.sin(t * 4) * 3, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
        // 行星环背面（被星球遮挡）
        const tilt = p.ringStyle === 'uranus' ? 1.15 : (-0.38 + Math.sin(t * p.ringSp) * 0.04);
        // 月球：远侧（画在星球之上）与近侧（画在星球之下）分开处理
        const moon = p.id === 'earth' ? moonState(p, t, px, py, r) : null;
        const moonFar = moon ? moon.my < py : false;
        if (moon) drawMoonOrbit(px, py, moon.mR, false);
        if (moon && moonFar) drawMoonDisc(moon.mx, moon.my);
        if (p.ring) {
            ctx.save();
            ctx.translate(px, py);
            drawPlanetRing(p, r, tilt, false);
            ctx.restore();
        }
        // 星球本体
        const sp = getPlanetSprite(p);
        ctx.drawImage(sp.canvas, px - sp.R, py - sp.R, sp.R * 2, sp.R * 2);
        // 行星环正面（遮挡星球）
        if (p.ring) {
            ctx.save();
            ctx.translate(px, py);
            drawPlanetRing(p, r, tilt, true);
            ctx.restore();
        }
        if (moon && !moonFar) {
            drawMoonDisc(moon.mx, moon.my);
            drawMoonOrbit(px, py, moon.mR, true);
        }
    }

    function drawSun(t) {
        const r = SUN.r;
        ctx.save();
        ctx.translate(SUN.x, SUN.y);
        // 日冕
        const cor = ctx.createRadialGradient(0, 0, r * 0.85, 0, 0, r * 2.7);
        cor.addColorStop(0, 'rgba(255,205,105,0.50)');
        cor.addColorStop(0.30, 'rgba(255,150,45,0.20)');
        cor.addColorStop(0.65, 'rgba(255,110,25,0.07)');
        cor.addColorStop(1, 'rgba(255,100,20,0)');
        ctx.fillStyle = cor;
        ctx.beginPath();
        ctx.arc(0, 0, r * 2.7, 0, Math.PI * 2);
        ctx.fill();
        // 缓慢旋转的日冕流光
        ctx.save();
        ctx.rotate(t * 0.035);
        ctx.globalAlpha = 0.12;
        ctx.fillStyle = '#ffcf6b';
        for (let i = 0; i < 20; i++) {
            const a = (i / 20) * Math.PI * 2;
            const len = r * (1.42 + 0.18 * Math.sin(t * 0.9 + i * 1.7));
            ctx.beginPath();
            ctx.moveTo(Math.cos(a - 0.035) * r * 0.92, Math.sin(a - 0.035) * r * 0.92);
            ctx.lineTo(Math.cos(a) * len, Math.sin(a) * len);
            ctx.lineTo(Math.cos(a + 0.035) * r * 0.92, Math.sin(a + 0.035) * r * 0.92);
            ctx.closePath();
            ctx.fill();
        }
        ctx.restore();
        // 光球
        const g = ctx.createRadialGradient(-r * 0.28, -r * 0.26, r * 0.08, 0, 0, r);
        g.addColorStop(0, '#fffbe6');
        g.addColorStop(0.38, '#ffe694');
        g.addColorStop(0.72, '#ffc247');
        g.addColorStop(0.93, '#ff9f24');
        g.addColorStop(1, '#ff7c14');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.save();
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.995, 0, Math.PI * 2);
        ctx.clip();
        // 米粒组织
        for (let i = 0; i < 70; i++) {
            const a = hash(i * 7.3 + 61) * Math.PI * 2 + t * 0.03 * (i % 3 + 1);
            const d = hash(i * 5.1 + 62) * r * 0.94;
            const rr = r * (0.025 + hash(i * 3.7 + 63) * 0.045);
            const dark = hash(i * 9.1 + 64) > 0.5;
            ctx.fillStyle = dark ? 'rgba(255,150,40,0.16)' : 'rgba(255,248,205,0.18)';
            ctx.beginPath();
            ctx.ellipse(Math.cos(a) * d, Math.sin(a) * d, rr, rr * 0.8, a, 0, Math.PI * 2);
            ctx.fill();
        }
        // 太阳黑子（缓慢漂移）
        for (let i = 0; i < 5; i++) {
            const a = hash(i * 11.3 + 65) * Math.PI * 2 + t * 0.012 * (i % 2 ? 1 : -1);
            const d = hash(i * 13.7 + 66) * r * 0.66;
            const rr = r * (0.045 + hash(i * 17.1 + 67) * 0.055);
            const cx = Math.cos(a) * d, cy = Math.sin(a) * d;
            ctx.fillStyle = 'rgba(190,80,20,0.55)';
            ctx.beginPath();
            ctx.ellipse(cx, cy, rr, rr * 0.68, a, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(120,45,10,0.5)';
            ctx.beginPath();
            ctx.ellipse(cx, cy, rr * 0.55, rr * 0.36, a, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
        // 色球边缘
        ctx.strokeStyle = 'rgba(255,116,26,0.85)';
        ctx.lineWidth = Math.max(1.5, r * 0.05);
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.985, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }

    // 轨道：front=false 画完整椭圆（在太阳之下）；front=true 只画近侧半弧（压在太阳之上）
    function drawOrbits(t, front) {
        ctx.save();
        ctx.strokeStyle = 'rgba(120,160,220,0.16)';
        ctx.lineWidth = 1.2;
        for (let i = 0; i < PLANETS.length; i++) {
            const p = PLANETS[i];
            ctx.beginPath();
            if (front) ctx.ellipse(SUN.x, SUN.y, p.orbA, p.orbB, 0, 0, Math.PI);
            else ctx.ellipse(SUN.x, SUN.y, p.orbA, p.orbB, 0, 0, Math.PI * 2);
            ctx.stroke();
        }
        ctx.restore();
    }

    function drawPlanetLabels(t, nearId) {
        for (let i = 0; i < PLANETS.length; i++) {
            const p = PLANETS[i];
            const near = p.id === nearId;
            const ppos = planetPos(p);
            const py = ppos.y, px = ppos.x;
            ctx.save();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            setFont(near ? 20 : 15, 'bold');
            ctx.fillStyle = near ? '#ffffff' : (p.home ? '#9be7ff' : 'rgba(205,220,245,0.78)');
            ctx.fillText(p.name, px, py + p.r + 20);
            if (near) {
                setFont(12, 'normal');
                ctx.fillStyle = 'rgba(180,230,255,0.9)';
                ctx.fillText(hintEnterPlanet(), px, py + p.r + 38);
            } else {
                setFont(11, 'normal');
                ctx.fillStyle = planetCleared(p.id) ? 'rgba(140,255,190,0.8)' : 'rgba(150,165,195,0.5)';
                ctx.fillText(p.home ? '家园' : (planetCleared(p.id) ? '已探索 ×' + save.planets[p.id].clears : '未探索'), px, py + p.r + 34);
            }
            ctx.restore();
        }
    }

    function drawSolarSystem(t, nearId, showShip) {
        const T = solarT;
        drawStarfield(T, 1);
        drawNebula(T);
        drawOrbits(T, false);
        drawSun(T);
        drawOrbits(T, true);      // 近侧轨道弧从太阳前方经过
        for (let i = 0; i < PLANETS.length; i++) {
            const p = PLANETS[i];
            drawPlanet(p, T, showShip && p.id === nearId ? 1 : 0);
        }
        drawPlanetLabels(T, showShip ? nearId : null);
        if (showShip) drawShip(ship.x, ship.y, ship.ang, ship.t);
    }

    // ==================== 飞船 ====================
    // 九大行星之间的巡航速度：刻意压得很慢，让航行成为一段需要耐心的等待
    const SHIP_SPEED = 105;
    // 转向按帧率无关的指数平滑收敛到目标朝向（1 - e^(-T·dt)），
    // 60 / 120 / 144 Hz 下转完同一角度花的时间完全一致，不会掉帧就变慢、帧率高就变快。
    // T 决定转得多快：仍保留一点惯性，但不再像原来那样转到位后还要磨蹭将近一秒
    const SHIP_TURN = 7;
    const ship = { x: 480, y: 300, ang: 0, t: 0, thrust: 0 };
    function drawShip(x, y, ang, t) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(ang);
        // 尾焰
        const fl = 16 + 12 * Math.sin(t * 18) + 10 * ship.thrust;
        const fg = ctx.createLinearGradient(-26, 0, -26 - fl, 0);
        fg.addColorStop(0, 'rgba(255,220,120,0.95)');
        fg.addColorStop(0.5, 'rgba(255,140,60,0.6)');
        fg.addColorStop(1, 'rgba(255,80,30,0)');
        ctx.fillStyle = fg;
        ctx.beginPath();
        ctx.moveTo(-24, -7);
        ctx.lineTo(-24 - fl, 0);
        ctx.lineTo(-24, 7);
        ctx.closePath();
        ctx.fill();
        // 尾翼
        ctx.fillStyle = '#c9433a';
        ctx.beginPath();
        ctx.moveTo(-8, -9); ctx.lineTo(-22, -22); ctx.lineTo(-16, -9);
        ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-8, 9); ctx.lineTo(-22, 22); ctx.lineTo(-16, 9);
        ctx.closePath(); ctx.fill();
        // 机身
        const bg = ctx.createLinearGradient(0, -12, 0, 12);
        bg.addColorStop(0, '#ffffff');
        bg.addColorStop(0.5, '#dfe6ef');
        bg.addColorStop(1, '#9aa6b6');
        ctx.fillStyle = bg;
        ctx.beginPath();
        ctx.moveTo(34, 0);
        ctx.quadraticCurveTo(22, -12, -2, -11);
        ctx.lineTo(-24, -9);
        ctx.lineTo(-24, 9);
        ctx.lineTo(-2, 11);
        ctx.quadraticCurveTo(22, 12, 34, 0);
        ctx.closePath();
        ctx.fill();
        // 舷窗
        ctx.fillStyle = '#2f4f7a';
        ctx.beginPath();
        ctx.arc(12, 0, 6.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(140,220,255,0.75)';
        ctx.beginPath();
        ctx.arc(10.5, -1.6, 3.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#e04b3c';
        ctx.beginPath();
        ctx.moveTo(-20, -8); ctx.lineTo(-27, -17); ctx.lineTo(-20, -15); ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-20, 8); ctx.lineTo(-27, 17); ctx.lineTo(-20, 15); ctx.closePath(); ctx.fill();
        ctx.restore();
    }

    // ==================== 菜单通用绘制 ====================
    function drawMenuPanel(x, y, w, items, sel, accent, gap, center) {
        ctx.save();
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        const sp = gap || 0;
        for (let i = 0; i < items.length; i++) {
            const iy = y + i * 58;
            const on = i === sel;
            ctx.fillStyle = on ? 'rgba(30,64,102,0.92)' : 'rgba(16,26,46,0.62)';
            roundRectPath(x, iy, w, 46, 10);
            ctx.fill();
            ctx.strokeStyle = on ? (accent || '#6fd3ff') : 'rgba(120,160,220,0.22)';
            ctx.lineWidth = on ? 2.2 : 1.2;
            roundRectPath(x + 1, iy + 1, w - 2, 44, 9);
            ctx.stroke();
            if (on) {
                ctx.save();
                ctx.translate(x - 30, iy + 23);
                ctx.fillStyle = accent || '#6fd3ff';
                ctx.beginPath();
                ctx.moveTo(16, 0); ctx.lineTo(-6, -11); ctx.lineTo(-6, 11);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
            setFont(19, 'bold');
            ctx.fillStyle = on ? '#ffffff' : 'rgba(200,215,240,0.72)';
            // 框体为 iy..iy+46，中心即 iy+23；文字水平、垂直都与框对齐
            if (center) {
                drawSpacedText(items[i], x + w / 2, iy + 23, sp, 'center');
            } else {
                drawSpacedText(items[i], x + 24, iy + 23, sp, 'left');
            }
        }
        ctx.restore();
    }

    // ==================== 场景：设置 ====================
    const settingsState = { sel: 0, confirmDelete: false, msg: '', msgT: 0, t: 0 };
    const SETTINGS_ITEMS = 3;      // 声音 / 触屏可视化 / 删除存档
    function sceneSettingsUpdate(dt) {
        settingsState.t += dt;
        if (settingsState.msgT > 0) settingsState.msgT -= dt;
        if (menuEdge('up') || menuEdge('left')) { settingsState.sel = (settingsState.sel + SETTINGS_ITEMS - 1) % SETTINGS_ITEMS; settingsState.confirmDelete = false; sfx('uiMove'); }
        if (menuEdge('down') || menuEdge('right')) { settingsState.sel = (settingsState.sel + 1) % SETTINGS_ITEMS; settingsState.confirmDelete = false; sfx('uiMove'); }

            save.sound = !save.sound;

    // ==================== 场景：太阳系巡航 ====================
    let scene = 'title';
    let sceneT = 0;
    let pendingPlanet = null;
    // 进入提示圈：星球边缘之外再多这么一圈，飞到圈内才亮出「按 键 进入行星」
    const ENTER_PAD = 52;
    function nearestPlanet() {
        let best = null, bd = 1e9;
        for (let i = 0; i < PLANETS.length; i++) {
            const p = PLANETS[i];
            const pp = planetPos(p);
            const d = dist(ship.x, ship.y, pp.x, pp.y);
            if (d < bd) { bd = d; best = p; }
        }
        return { planet: best, dist: bd };
    }
    // 某颗行星此刻是否已进入提示圈（判定与绘制共用，免得两处数字走偏）
    function inEnterRange(p, d) {
        return !!p && d < p.r + ENTER_PAD;
    }
    function sceneSpaceUpdate(dt) {
        sceneT += dt;
        ship.t += dt;
        const mv = moveVector();
        ship.thrust = Math.min(1, ship.thrust + (mv.x || mv.y ? dt * 4 : -dt * 5));
        ship.thrust = clamp(ship.thrust, 0, 1);
        if (mv.x || mv.y) {
            ship.x += mv.x * SHIP_SPEED * dt;
            ship.y += mv.y * SHIP_SPEED * dt;
            const target = Math.atan2(mv.y, mv.x);
            ship.ang += angDiff(target, ship.ang) * (1 - Math.exp(-SHIP_TURN * dt));
        }
        ship.x = clamp(ship.x, 46, W - 46);
        ship.y = clamp(ship.y, 120, H - 60);
        const np = nearestPlanet();
        if (inEnterRange(np.planet, np.dist)) {
            if (actPress()) startLanding(np.planet.id);
        }
    }
    function sceneSpaceDraw() {
        const np = nearestPlanet();
        const nearId = inEnterRange(np.planet, np.dist) ? np.planet.id : null;
        drawSolarSystem(sceneT, nearId, true);
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        setFont(15, 'bold');
        ctx.fillStyle = 'rgba(160,200,240,0.8)';
        ctx.fillText((padConnected ? '左摇杆 / 十字键' : '方向键 / WASD') + ' 驾驶飞船　　' + hintEnterPlanet() + '行星　　太阳系九大行星', W / 2, 36);
        if (nearId) {
            const p = PLANET_BY_ID[nearId];
            setFont(20, 'bold');
            ctx.fillStyle = '#ffffff';
            ctx.fillText('目标：' + p.name + (p.home ? '（家园 · 碑文陈列）' : (planetCleared(p.id) ? '　已探索 ×' + save.planets[p.id].clears : '　BOSS：' + p.boss)), W / 2, H - 46);
        }

    }
    function startGame() {
        scene = 'space';
        sceneT = 0;
        const earth = PLANET_BY_ID.earth;
        const ep = planetPos(earth);
        // 贴着地球提示圈的内沿停：开场就正好亮出「进入地球」的按键提示，不必先飞一段
        const d = earth.r + ENTER_PAD - 4;
        ship.x = ep.x;

    // 进入星球：着陆动画直接在真实场景内播放，与开始游戏无缝衔接
    function startLanding(id) {

        };

// ==================== 俯视游戏世界 ====================
    let world = null;
    let viewZoom = 1;      // 升空拉远镜头时 < 1，用于扩大可见范围

    // ---------- 升空镜头：从当前画面缓慢拉为远景，拉到位后停住一会儿再淡出 ----------
    const LAUNCH_ZOOM_END = 1.45;    // 拉远结束时刻，之后一直保持远景，等火箭升出画面
    const LAUNCH_ZOOM_MIN = 0.525;   // 远景缩放（升空与着陆共用同一个值，保证两端最远视角一致）
                                     // 横向：640 / 0.525 ≈ 1219。除了椭圆半径 rX = 1120，
                                     // 还要把石柱自身的半宽算进去（抱爪张到 COL_R*1.34 ≈ 62），
                                     // 合计 1182 * 0.525 ≈ 621，左右两端各留 ~19px 不被切到
                                     // 纵向：335 / 0.525 ≈ 638。1/5/7/11 点的柱脚在 0.87·rY ≈ 546，余量充足；
                                     // 12 / 6 点的空位柱脚在 630，刚好压着上／下边缘
    const LAUNCH_TRAVEL = 760;      // 火箭上升距离（缩放前的屏幕像素）
    const LAUNCH_DEPART = 0.26;     // 出画后淡出所需的额外上升进度比例
    function launchZoom(t) {
        if (t <= LAUNCH_BOARD) return 1;
        const k = clamp((t - LAUNCH_BOARD) / (LAUNCH_ZOOM_END - LAUNCH_BOARD), 0, 1);
        return lerp(1, LAUNCH_ZOOM_MIN, easeInOut(k));
    }
    function launchRise(t) {
        if (t <= LAUNCH_BOARD) return 0;
        return Math.pow(clamp((t - LAUNCH_BOARD) / (LAUNCH_RISE - LAUNCH_BOARD), 0, 1), 1.3);
    }
    // 火箭完全飞出画面后的转场进度（0~1）
    function launchDepart(t) {
        const z = launchZoom(t);
        const top = (PLAY_H / 2) / Math.max(0.05, z);   // 缩放后仍可见的顶部边界
        const d = launchRise(t) * LAUNCH_TRAVEL / top;
        return clamp((d - 1) / LAUNCH_DEPART, 0, 1);
    }
    // ---------- 着陆镜头：先在远景把整圈石柱阵看全，再由远及近推回常规视角 ----------
    const LAND_ZOOM_HOLD = 0.9;  // 远景停留：开场就是俯视全貌，别一进来就推近
    const LAND_ZOOM_DUR = 2.0;   // 远镜头推近时长，比下降段更长，收尾更从容
    function landingZoom(t) {
        if (t >= LAND_ZOOM_HOLD + LAND_ZOOM_DUR) return 1;
        if (t <= LAND_ZOOM_HOLD) return LAUNCH_ZOOM_MIN;
        const k = clamp((t - LAND_ZOOM_HOLD) / LAND_ZOOM_DUR, 0, 1);
        return lerp(LAUNCH_ZOOM_MIN, 1, easeInOut(k));
    }
    // 着陆入场黑场的浓度（1=全黑，0=完全显现）
    const LAND_FADE = 0.6;
    function landingFadeIn(t) { return t >= LAND_FADE ? 0 : 1 - easeOutCubic(clamp(t / LAND_FADE, 0, 1)); }

    const DIRS = [
        { ix: 0, iy: 1 }, { ix: -0.7071, iy: 0.7071 }, { ix: -1, iy: 0 }, { ix: -0.7071, iy: -0.7071 },
        { ix: 0, iy: -1 }, { ix: 0.7071, iy: -0.7071 }, { ix: 1, iy: 0 }, { ix: 0.7071, iy: 0.7071 }
    ];
    const DIR_VIEW = [
        { face: 'front', sx: 1, tilt: 0 },      // 0 下
        { face: 'front', sx: -1, tilt: 0.14 }, // 1 左下（整体镜像自 7）
        { face: 'side', sx: -1, tilt: 0 },      // 2 左
        { face: 'back', sx: -1, tilt: 0.16 },   // 3 左上（整体镜像自 5）
        { face: 'back', sx: 1, tilt: 0 },       // 4 上
        { face: 'back', sx: 1, tilt: 0.16 },    // 5 右上
        { face: 'side', sx: 1, tilt: 0 },       // 6 右
        { face: 'front', sx: 1, tilt: 0.14 }    // 7 右下
    ];
    function dirFromVec(x, y) {
        // 注意：DIRS / DIR_VIEW 以 0=下、6=右 为基准，
        // 而 atan2(y,x)=0 表示正右，故需要 +6 修正这 90° 偏移
        const a = Math.atan2(y, x);
        let idx = Math.round(a / (Math.PI / 4));
        idx = (((idx + 6) % 8) + 8) % 8;
        return idx;
    }
    // 记住最近一次朝左 / 朝右：直上直下时按它决定人物图形的左右朝向。
    // 只要方向里带水平分量就记录（含四条斜向），这样「按住下 + 按左 → 松开左」
    // 回到正下时仍保持朝左的姿态，不会跳回朝右。
    function rememberFaceSide(p, idx) {
        const ix = DIRS[idx].ix;
        if (ix < -0.01) p.faceSide = -1;
        else if (ix > 0.01) p.faceSide = 1;
    }

    // planetId: 行星 id，或 'moon' + side（'near' 正面 / 'far' 背面）
    function newWorld(planetId, side) {
        const planet = planetId === 'moon' ? moonDef(side) : PLANET_BY_ID[planetId];
        // 月球两张图都只有正常的一半，且四面都不环绕；行星维持原来的尺寸与环接
        if (planet.moon) { MAP_W = MOON_MAP_W; MAP_H = MOON_MAP_H; MAP_BOUNDED = true; }
        else { MAP_W = MAP_W_BASE; MAP_H = MAP_H_BASE; MAP_BOUNDED = false; }
        const startX = MAP_W * 0.5;
        const startY = MAP_H * 0.62;
        // 该星球已通关（击败 BOSS）的次数作为本局的起点，
        // 于是每多击败一次，下次 BOSS 出现的等级条件就整体上抬一级
        const clears = (save.planets[planetId] && save.planets[planetId].clears) || 0;
        return {
            planet: planet,
            island: false, beachProps: null, bottles: null, bottleNear: -1,
            t: 0,
            runTime: 0,
            cam: { x: startX, y: startY },
            player: {
                x: startX + 110, y: startY + 72,
