    for (let i = 0; i < world.pits.length; i++) {
        const pit = world.pits[i];
        if (Math.abs(wrapDX(pit.x)) > hw || Math.abs(wrapDY(pit.y)) > hDn) continue;
        drawDigPit(pit, col);
    }
}
// 浓烟·身前层：比身后的尘土更厚更暗的一层，翻腾着盖过主角，再一点点散淡
// 与 drawDigDust 共用 world.dust 数据，只负责表现；单独一层是为了压住角色的下半身
function drawDigDustFront() {
    for (let i = 0; i < world.dust.length; i++) {
        const d = world.dust[i];
        const x = scrX(d.x), y = scrY(d.y);
        const k = 1 - d.life / d.max;
        const fade = 1 - k;                     // 刚下铲最浓，随后单调变淡
        const thick = fade * fade;              // 浓度按平方衰减，前浓后淡更明显
        const rise = k * 38;                    // 烟整体向上翻腾
        const spread = 0.7 + 1.2 * k;           // 越翻越开
        ctx.save();
        // 底部一大团实心浓烟，铺满人物下半身
        const blob = 40 + 52 * k;
        const cy = y - rise * 0.4;
        const g = ctx.createRadialGradient(x, cy, 4, x, cy, blob);
        g.addColorStop(0, 'rgba(108,94,72,' + (fade * 0.62) + ')');
        g.addColorStop(0.45, 'rgba(96,83,63,' + (fade * 0.4) + ')');
        g.addColorStop(1, 'rgba(88,76,58,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.ellipse(x, cy, blob * 1.25, blob * 0.86, 0, 0, Math.PI * 2);
        ctx.fill();
        // 翻腾的烟团：深浅两层交错，自转并上升
        for (let j = 0; j < 14; j++) {
            const a = d.ph + j * 0.45 + k * 2.2;
            const rr = d.r * spread * (0.3 + 0.78 * ((j * 0.47 + k * 1.3) % 1));
            const px = x + Math.cos(a) * rr * 1.2;
            const py = y + Math.sin(a) * rr * 0.5 - rise * (0.15 + 1.0 * ((j * 0.31 + k) % 1));
            const sz = 13 + 20 * (1 - k) + 5 * Math.sin(j * 1.7 + k * 5);
            const lit = (j + (d.ph | 0)) % 2;
            ctx.globalAlpha = thick * (lit ? 0.30 : 0.42);
            ctx.fillStyle = lit ? '#cdb995' : '#7c6e57';
            ctx.beginPath();
            ctx.ellipse(px, py, sz, sz * 0.78, a * 0.6, 0, Math.PI * 2);
            ctx.fill();
        }
        // 最内圈的浓核：压住脚踝，让烟看起来是从地里涌出来的
        ctx.globalAlpha = thick * 0.34;
        ctx.fillStyle = '#6a5d48';
        for (let j = 0; j < 4; j++) {
            const a = d.ph * 1.7 + j * 1.9 + k * 3.1;
            ctx.beginPath();
            ctx.ellipse(x + Math.cos(a) * 16 * spread, y - rise * 0.25 + Math.sin(a) * 7,
                15 + 9 * k, 10 + 6 * k, a, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.restore();
    }
}
// 信标本体：掉落时从 BOSS 处跳出，落地后顶部按信号强度闪烁，拾取后在人物周围缓慢随机飘动
function drawBeacon() {
    const bc = world.beacon;
    if (!bc) return;
    const x = scrX(bc.x), y = scrY(bc.y);
    const gx = scrX(bc.gx === undefined ? bc.x : bc.gx);
    const gy = scrY(bc.gy === undefined ? bc.y : bc.gy);
    const m = 220 / viewZoom;
    if (x < -m || x > W + m || y < -m || y > PLAY_H + m) return;
    const fl = bc.flash || 0;
    const z = bc.z || 0;
    const air = clamp(z / BEACON_HOP, 0, 1);
    const bob = bc.held ? Math.sin(bc.t * 3) * 3 : 0;
    const cy = y + bob;

    // 地面投影：跳得越高，影子越大越淡
    ctx.save();
    ctx.globalAlpha = 0.34 * (1 - air * 0.62);
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(gx + 2, gy + 4, 9 * (1 + air * 0.55), 3.4 * (1 + air * 0.45), 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 尚未拾取时，向外辐射的光芒把方向指给玩家
    if (!bc.held) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < 10; i++) {
            const a = bc.t * 0.55 + i * (Math.PI / 5);
            const len = 44 + 26 * fl + 10 * Math.sin(bc.t * 2 + i);
            const g = ctx.createLinearGradient(x, cy - 19, x + Math.cos(a) * len, cy - 19 + Math.sin(a) * len);
            g.addColorStop(0, 'rgba(255,232,160,' + (0.30 + 0.30 * fl) + ')');
            g.addColorStop(1, 'rgba(255,190,70,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.moveTo(x + Math.cos(a - 0.12) * 8, cy - 19 + Math.sin(a - 0.12) * 8);
            ctx.lineTo(x + Math.cos(a) * len, cy - 19 + Math.sin(a) * len);
            ctx.lineTo(x + Math.cos(a + 0.12) * 8, cy - 19 + Math.sin(a + 0.12) * 8);
            ctx.closePath();
            ctx.fill();
        }
        ctx.restore();
    }

    ctx.save();
    ctx.translate(x, cy);
    ctx.scale(1.25, 1.25);
    ctx.translate(-x, -cy);
    // 棒身（较短）
    const bg = ctx.createLinearGradient(x - 3, 0, x + 3, 0);
    bg.addColorStop(0, '#5d6b78');
    bg.addColorStop(0.45, '#e4ecf5');
    bg.addColorStop(1, '#48545f');
    ctx.fillStyle = bg;
    roundRectPath(x - 3, cy - 16, 6, 17, 2.4);
    ctx.fill();
    // 底部蓝色封底（原底座）
    ctx.fillStyle = '#3d7fe0';
    roundRectPath(x - 5, cy - 3.5, 10, 6.5, 2.6);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.32)';
    roundRectPath(x - 4, cy - 2.8, 8, 2, 1);
    ctx.fill();
    ctx.fillStyle = 'rgba(20,50,110,0.45)';
    roundRectPath(x - 5, cy + 1.4, 10, 1.6, 0.8);
    ctx.fill();
    // 灯头 + 辉光
    const g = ctx.createRadialGradient(x, cy - 19, 1, x, cy - 19, 30 + 18 * fl);
    g.addColorStop(0, 'rgba(255,255,240,' + (0.35 + 0.65 * fl) + ')');
    g.addColorStop(0.32, 'rgba(255,214,102,' + (0.22 + 0.5 * fl) + ')');
    g.addColorStop(1, 'rgba(255,180,60,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, cy - 19, 30 + 18 * fl, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,246,200,' + (0.35 + 0.65 * fl) + ')';
    ctx.beginPath();
    ctx.arc(x, cy - 19, 4.6 + 2 * fl, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    if (bc.held && !bc.silent) {
        const sig = beaconSignal();
        const lv = sigLevel(sig);
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        setFont(11, 'bold');
        ctx.fillStyle = lv.col;
        ctx.fillText(lv.text, x, cy - 46);
        ctx.restore();
    }
}
// 挖出来的东西：从埋藏点跳出落到人物附近，四周向外辐射光芒，等角色走近即可拾取
function drawFoundItem() {
    const f = world.found;
    if (!f) return;
    const x = scrX(f.x), y = scrY(f.y);
    const gx = scrX(f.gx === undefined ? f.x : f.gx);
    const gy = scrY(f.gy === undefined ? f.y : f.gy);
    const m = 240 / viewZoom;
    if (x < -m || x > W + m || y < -m || y > PLAY_H + m) return;
    const grow = clamp(f.life / 0.35, 0, 1);
    const pop = 1 + 0.07 * Math.sin(f.life * 5);
    const fade = f.collect ? clamp(1 - (f.collectT || 0) / 0.42, 0, 1) : 1;
    const air = clamp((f.z || 0) / BEACON_HOP, 0, 1);
    const t = world.t;
    const col = foundColor(f);
    const S = (grow < 1 ? grow * 1.6 - 0.6 * grow * grow : 1) * pop;
    // 地面光斑：跟着落地点走，跳得越高越大越淡
    ctx.save();
    ctx.globalAlpha = fade * (1 - air * 0.6);
    ctx.fillStyle = hexA(col, 0.18);
    ctx.beginPath();
    ctx.ellipse(gx, gy + 4, 40 * (1 + air * 0.5), 16 * (1 + air * 0.4), 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.translate(x, y);
    // 向外辐射的光芒
    ctx.globalAlpha = fade;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 12; i++) {
        const a = t * 0.4 + i * (Math.PI / 6);
        const len = (58 + 16 * Math.sin(t * 2.2 + i)) * (0.7 + 0.3 * grow);
        const g = ctx.createLinearGradient(0, -30, Math.cos(a) * len, -30 + Math.sin(a) * len);
        g.addColorStop(0, hexA(col, 0.34));
        g.addColorStop(1, hexA(col, 0));
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a - 0.1) * 22, -30 + Math.sin(a - 0.1) * 22);
        ctx.lineTo(Math.cos(a) * len, -30 + Math.sin(a) * len);
        ctx.lineTo(Math.cos(a + 0.1) * 22, -30 + Math.sin(a + 0.1) * 22);
        ctx.closePath();
        ctx.fill();
    }
    ctx.restore();
    const g2 = ctx.createRadialGradient(0, -30, 3, 0, -30, 66);
    g2.addColorStop(0, hexA(col, 0.55));
    g2.addColorStop(0.45, hexA(col, 0.18));
    g2.addColorStop(1, hexA(col, 0));
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(0, -30, 66, 0, Math.PI * 2); ctx.fill();
    ctx.scale(S, S);
    ctx.fillStyle = 'rgba(12,20,34,0.86)';
    ctx.beginPath(); ctx.arc(0, -30, 30, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = hexA(col, 0.95);
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, -30, 30, 0, Math.PI * 2); ctx.stroke();
    drawItemIcon(f.item, 0, -30, 24, 1);
    // 四角旋转的闪光
    for (let i = 0; i < 4; i++) {
        const a = t * 2.2 + i * Math.PI / 2;
        const rr = 40;
        const al = 0.35 + 0.5 * Math.abs(Math.sin(t * 4 + i));
        ctx.fillStyle = hexA(col, al);
        ctx.beginPath();
        ctx.arc(Math.cos(a) * rr, -30 + Math.sin(a) * rr * 0.62, 3.2, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
}

// 爆炸子弹命中：子弹自身的伤害当场结算，范围伤害则延后 BOOM_BLAST_WAIT 由余波统一结算。
// direct 为被直接命中的目标，余波会跳过它，因此总伤害与「瞬发 AoE」保持一致。
function explodeBullet(bu, direct) {
        const R = bu.boomR;
        // 冲击力分层：白热核心 → 火球 → 外扩余焰 → 地面冲击环 → 四溅火星
        addFx({ kind: 'boom', x: bu.x, y: bu.y, life: 0.10, max: 0.10, r: R * 0.55, col: '#ffffff' });
        addFx({ kind: 'boom', x: bu.x, y: bu.y, life: 0.30, max: 0.30, r: R * 0.92, col: '#ffd08a' });
        addFx({ kind: 'boom', x: bu.x, y: bu.y, life: 0.46, max: 0.46, r: R * 1.35, col: '#ff9f43' });
        addFx({ kind: 'boom', x: bu.x, y: bu.y, life: 0.60, max: 0.60, r: R * 1.9, col: '#ff5a1e' });
        addFx({ kind: 'ring', x: bu.x, y: bu.y, life: 0.32, max: 0.32, r: R, col: '#ffe9b0' });
        addFx({ kind: 'ring', x: bu.x, y: bu.y, life: 0.52, max: 0.52, r: R * 1.6, col: '#ffb066' });
        for (let i = 0; i < 16; i++) {
            const a = (i / 16) * Math.PI * 2 + rand(-0.22, 0.22);
            const sp = rand(150, 400);
            addFx({
                kind: 'spark', x: bu.x, y: bu.y,
                vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                life: rand(0.22, 0.46), max: 0.46, r: rand(3, 7),
                col: i % 2 ? '#fff0c8' : '#ff8a3c'
            });
        }
        sfx('explode');
        // 子弹本身的伤害当场生效
        if (direct) direct.hp -= bu.dmg;
        // 范围伤害排进余波，等冲击波炸开之后再结算
        world.blasts.push({
            x: bu.x, y: bu.y, r: R, dmg: bu.dmg,
            wait: BOOM_BLAST_WAIT, life: BOOM_BLAST_LIFE, hit: false, skip: direct || null
        });
    }
    // 余波：先等一小会儿（让爆炸视觉铺开），再一次性结算范围内所有目标
    function updateBlasts(dt) {
        for (let i = world.blasts.length - 1; i >= 0; i--) {
            const z = world.blasts[i];
            if (z.wait > 0) { z.wait -= dt; continue; }
            if (!z.hit) {
                z.hit = true;
                for (let j = world.enemies.length - 1; j >= 0; j--) {
                    const e = world.enemies[j];
                    if (e === z.skip) continue;
                    if (Math.hypot(dX(e.x, z.x), dY(e.y, z.y)) < z.r + e.r) {
                        e.hp -= z.dmg; e.flash = 0.2; stunEnemy(e, HIT_STUN);
                        if (e.hp <= 0) killEnemy(e, j);
                    }
                }
                if (world.boss && !world.bossDefeated && world.boss !== z.skip) {
                    const b = world.boss;
                    if (Math.hypot(dX(b.x, z.x), dY(b.y, z.y)) < z.r + b.r) {
                        b.hp -= z.dmg; b.flash = 0.2; b.hurtT = 0.14;
                    }
                }
            }
            z.life -= dt;
            if (z.life <= 0) world.blasts.splice(i, 1);
        }
    }
    // 余波待结算期间在地面画一圈虚线，标出即将被覆盖的范围
    function drawBlasts() {
        for (let i = 0; i < world.blasts.length; i++) {
            const z = world.blasts[i];
            const x = scrX(z.x), y = scrY(z.y);
            const grow = z.wait > 0 ? 1 - z.wait / BOOM_BLAST_WAIT : 1;
            const fade = z.wait > 0 ? 0.55 * grow : 0.45 * (z.life / BOOM_BLAST_LIFE);
            ctx.save();
            ctx.globalAlpha = fade;
            ctx.strokeStyle = '#ffd9a0';
            ctx.lineWidth = 2.4;
            ctx.setLineDash([7, 9]);
            ctx.lineDashOffset = -world.t * 46;
            ctx.beginPath();
            ctx.ellipse(x, y, z.r, z.r * 0.6, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();
        }
    }
    function playerFire() {
        const p = world.player;
        const by = playerBodyY();   // 身形中心（与范围圈一致）
        let target = null, bd = 1e9;
        const pool = world.boss ? world.enemies.concat([world.boss]) : world.enemies;
        for (let i = 0; i < pool.length; i++) {
            const e = pool[i];
            const dx = dX(e.x, p.x), dy = dY(e.y, by);
            const d = dx * dx + dy * dy;
            if (d < bd) { bd = d; target = e; }
        }
        const range = fireRangeOf(p);
        if (!target || Math.sqrt(bd) > range) return;
        const tx = dX(target.x, p.x), ty = dY(target.y, p.y);
        const base = Math.atan2(ty, tx);
        // 朝向：目标大致在前方时才转身，避免边走边打出现"倒着走"
        const mv = moveVector();
if (!mv.x && !mv.y || (mv.x * tx + mv.y * ty) > 0) {
     p.dirIdx = dirFromVec(tx, ty);
            rememberFaceSide(p, p.dirIdx);
        }
        const n = p.bullets;
        const spread = n > 1 ? 0.14 : 0;
        const dmg = p.dmg;
        const boom = p.boomLv > 0;      // 爆炸子弹：命中后小范围爆炸，范围内伤害等同攻击力
        const boomR = boomRadius(p.boomLv);
        for (let i = 0; i < n; i++) {
            const off = (i - (n - 1) / 2) * spread;
            world.bullets.push({
                x: wrapVal(p.x + Math.cos(base) * 26, MAP_W),
                y: wrapVal(p.y + Math.sin(base) * 26, MAP_H),
                vx: Math.cos(base + off) * 760, vy: Math.sin(base + off) * 760,
                dmg: dmg, life: 0.95, r: boom ? 7 : 5.5,
                boom: boom, boomR: boomR
            });
        }
        world.stats.weapons[p.weapon] = (world.stats.weapons[p.weapon] || 0) + n;
        p.muzz = 0.08;
        p.fireCd = p.fireCdMs / 1000;
        sfx('shoot');
        // 星球特色装备：跟着开火一起发动，打敌人，不做预警
        triggerRelics();
        const mx = wrapVal(p.x + Math.cos(base) * 30, MAP_W), my = wrapVal(p.y + Math.sin(base) * 30, MAP_H);
        addFx({ kind: 'muzzle', x: mx, y: my, ang: base, life: 0.09, max: 0.09, col: '#bff0ff' });
    }
    // 神秘核心：射程内的敌人（含 BOSS）每 1 秒自动吃到一次攻击力伤害
    function updateCheatAura(dt) {
        const p = world.player;
        if (!p.cheat) return;
        p.cheatCd -= dt;
        if (p.cheatCd > 0) return;
        p.cheatCd = CHEAT_AURA_CD;
        const range = fireRangeOf(p);
        const by = playerBodyY();
        // 倒着遍历：killEnemy 会就地 splice，正序会让下标全部错位
        for (let i = world.enemies.length - 1; i >= 0; i--) {
            const e = world.enemies[i];
            if (Math.hypot(dX(e.x, p.x), dY(e.y, by)) > range) continue;
            e.hp -= p.dmg;
            e.flash = 0.16;
            stunEnemy(e, HIT_STUN);
            addFx({ kind: 'spark', x: e.x, y: e.y, life: 0.26, max: 0.26, r: 10, col: '#ffd24a' });
            if (e.hp <= 0) killEnemy(e, i);
        }
        const b = world.boss;
        if (b && !world.bossDefeated && Math.hypot(dX(b.x, p.x), dY(b.y, by)) <= range) {
            b.hp -= p.dmg;
            b.flash = 0.14; b.hurtT = 0.14;
            addFx({ kind: 'spark', x: b.x, y: b.y, life: 0.3, max: 0.3, r: 14, col: '#ffd24a' });
        }
    }

    // ==================== 经验与等级 ====================
    // 升级所需经验：第 1→2 级 10 点，之后每升一级 +2（第 n→n+1 级 = 8 + 2n）
    const XP_STEP0 = 10, XP_STEP_INC = 2;
    function xpNeededFor(level) { return XP_STEP0 + (level - 1) * XP_STEP_INC; }   // level → level+1 所需
    // 累计到第 level 级的总经验 = Σ(xpNeededFor) ，在 INC=2 时化简为 (level-1)(level+8)
    function xpTotalFor(level) { return (level - 1) * (level + 8); }
    // (level-1)(level+8) = xp 的闭式反解
    function levelFromXp(xp) { return Math.max(1, Math.floor((-7 + Math.sqrt(81 + 4 * xp)) / 2)); }
    // BOSS 出现的等级门槛：每在同一个星球上击败一次 BOSS 就 +1 级，于是 20 → 21 → 22 …
function bossLevelNeed() { return BOSS_LEVEL_BASE + world.bossKills; }
    function gainXp(v) {
        world.xp += v;
        const newLevel = levelFromXp(world.xp);
        while (world.level < newLevel) {
            world.level++;
            world.score += 25;
            sfx('levelup');
            addPopup(world.player.x, world.player.y - 40, 'LEVEL UP! Lv.' + world.level, '#ffe066', true);
            // 5 的倍数等级改发装备补给箱；装备栏为空时退回道具补给箱
            dropPackage((world.level % 5 === 0 && weaponPool().length) ? 'weapon' : 'item');
            if (world.level === 10 && world.upgrades < 1) {
                world.upgrades = 1;
                world.tier = 1;
                addPopup(world.player.x, world.player.y - 70, '怪物强度提升！', '#ff9b6b', true);
            } else if (world.level >= bossLevelNeed()) {
                world.upgrades = 2 + world.bossKills;
                world.tier = 2 + world.bossKills;
                // 场上已有 BOSS 时只推进强度，不重复刷弹幕
                if (!world.boss && !world.quiet) {
                    addPopup(world.player.x, world.player.y - 70, '怪物强化！BOSS 降临', '#ff6b6b', true);
                    spawnBoss();
                }
            }
        }
    }

    const DROP_HEIGHT = PLAY_H * 0.62 + 90;
    // 道具补给箱落点：以人物为中心、初始射程以外的环带内随机取点
    function itemDropTarget() {
        const p = world.player;
        const rIn = FIRE_RANGE + 34, rOut = FIRE_RANGE + 250;
        for (let k = 0; k < 12; k++) {
            const a = Math.random() * Math.PI * 2;
            const r = rand(rIn, rOut);
            const tx = wrapVal(p.x + Math.cos(a) * r, MAP_W);
            const ty = wrapVal(p.y + Math.sin(a) * r, MAP_H);
            if (Math.hypot(dX(tx, p.x), dY(ty, p.y)) >= FIRE_RANGE) return { x: tx, y: ty };
        }
        return { x: wrapVal(p.x + rIn, MAP_W), y: p.y };
    }
    // 装备补给箱落点：必定在当前画面之外，沿四边推出边界
    function weaponDropTarget(cam) {
        const side = randInt(0, 3);
        const out = rand(46, 230);
        let tx, ty;
        if (side === 0) { tx = cam.x + rand(-W * 0.5, W * 0.5); ty = cam.y - PLAY_H * 0.5 - out; }
        else if (side === 1) { tx = cam.x + rand(-W * 0.5, W * 0.5); ty = cam.y + PLAY_H * 0.5 + out; }
        else if (side === 2) { tx = cam.x - W * 0.5 - out; ty = cam.y + rand(-PLAY_H * 0.5, PLAY_H * 0.5); }
        else { tx = cam.x + W * 0.5 + out; ty = cam.y + rand(-PLAY_H * 0.5, PLAY_H * 0.5); }
        return { x: wrapVal(tx, MAP_W), y: wrapVal(ty, MAP_H) };
    }
    // kind: 'item' 道具补给箱（道具栏 + 固定栏）／'weapon' 装备补给箱（装备栏）
    function dropPackage(kind) {
        const cam = world.cam;
        const isWeapon = kind === 'weapon';
        const tgt = isWeapon ? weaponDropTarget(cam) : itemDropTarget();
        const tx = tgt.x, ty = tgt.y;
        // 从屏幕最上方下落
        const startY = wrapVal(ty - DROP_HEIGHT, MAP_H);
        let pool = isWeapon ? weaponPool() : itemPool();
        if (!pool.length) pool = ITEMS.filter((it) => !RELIC_BY_ITEM[it.id]);
        const picks = [];
        for (let i = 0; i < 3 && pool.length; i++) {
            const k = randInt(0, pool.length - 1);
            picks.push(pool.splice(k, 1)[0].id);
        }
        world.packages.push({
            x: tx, y: startY, tx: tx, ty: ty, tx0: DROP_HEIGHT,
            vy: 40, items: picks, kind: isWeapon ? 'weapon' : 'item', landed: false, ph: Math.random() * 6
        });
        sfx('drop');
    }

    // ==================== 玩法更新 ====================
    function updatePlay(dt) {
        const p = world.player;
        world.t += dt;
        if (world.launch) {
            // 取舍阶段：仅播放动画，场景保持原样
            updateLaunch(dt);
            return;
        }
        if (world.landing) {
            // 着陆阶段：仅播放动画，与正式游戏场景无缝衔接
            updateLanding(dt);
            for (let i = world.fx.length - 1; i >= 0; i--) {
                const f = world.fx[i];
                f.life -= dt;
                if (f.kind === 'spark') {
                    f.x = wrapVal(f.x + (f.vx || 0) * dt, MAP_W);
                    f.y = wrapVal(f.y + (f.vy || 0) * dt, MAP_H);
                }
                if (f.life <= 0) world.fx.splice(i, 1);
            }
            return;
        }
        if (!world.over) world.runTime += dt;
        // 触地计时：着陆阶段由 updateLanding 填，着陆结束后在这里继续累加
        if (world.landed >= 0) world.landed += dt;
        if (world.fade > 0) world.fade = Math.max(0, world.fade - dt);
        const cam = world.cam;
        const planet = world.planet;

        // 失败锁定：人物不可控、场景静止、画面完全定格
        if (world.over) { cam.x = p.x; cam.y = p.y; return; }

        // 地球基地的补给航天飞船：靠近按 J/A 打开战备配置，菜单打开时屏蔽人物操作
        if (world.supply) {
            if (world.inv.on) {
                updateInvMenu(dt);
                return;
            }
            world.supplyNear = Math.hypot(dX(world.supply.x, p.x), dY(world.supply.y, p.y)) < SUPPLY_R;
            if (world.supplyNear && actPress()) { openInvMenu(); return; }
        }

        // 区域减速/伤害
        let slow = 1;
        let dmgT = 0;
        for (let i = 0; i < world.zones.length; i++) {
            const z = world.zones[i];
            const dz = Math.hypot(dX(z.x, p.x), dY(z.y, p.y));
            if (dz < z.r) {
                if (z.type === 'slow') slow = 0.32;
                else dmgT += dt;
            }
        }
        world.slowFactor = slow;
        if (dmgT > 0) {
            p.zoneTick = (p.zoneTick || 0) + dmgT;
            if (p.zoneTick >= 0.9) { p.zoneTick = 0; damagePlayer(1); }
        }

        // 移动
        const mv = moveVector();
        p.moving = false;
        if (p.rollT > 0) {
            p.rollT -= dt;
            p.rollAngle += dt * 13;
            p.x = wrapVal(p.x + p.rollVX * dt, MAP_W);
            p.y = wrapVal(p.y + p.rollVY * dt, MAP_H);
            // 刚结束的那一帧：在终点周边做一次范围推开，保证终点不会立刻被触到
            if (p.rollT <= 0) p.rollEnd = true;
        } else if (mv.x || mv.y) {
            const sp = BASE_SPEED * p.speedMul * slow;
            p.x = wrapVal(p.x + mv.x * sp * dt, MAP_W);
            p.y = wrapVal(p.y + mv.y * sp * dt, MAP_H);
            p.dirIdx = dirFromVec(mv.x, mv.y);
            p.moveDirIdx = dirFromVec(mv.x, mv.y);
            rememberFaceSide(p, p.dirIdx);
            p.walkPhase += dt * (8.5 * sp / BASE_SPEED);
            p.moving = true;
        }
        if (p.rollEnd) { p.rollEnd = false; rollEndPush(p); }
        // 地球就是一座岛：人物只能沿沙滩走，不能进入大海
        if (world.island) clampToIsland(p);
        // 月球：正面越界翻到背面，背面把人按在实体边界内
        if (world.moonSide === 'far') {
            updateMoonBoundary(dt);
            clampWorldObjects();
        } else if (world.moonSide === 'near' && moonNearEdge()) {
            // 翻面会整个换掉 world，必须立刻退出这一帧，不能再用旧的人物对象往下跑
            startMoonSide('far');
            return;
        }
        if (p.rollCd > 0) p.rollCd -= dt;
        if (p.invuln > 0) p.invuln -= dt;
        if (p.hitFlash > 0) p.hitFlash -= dt;
        if (p.muzz > 0) p.muzz -= dt;
        // 血量环：血量只要发生任何变化（掉血或回血）就重新点亮，随后自动隐去
        if (p.hp !== p.hpShown) {
            p.hpShown = p.hp;
            p.hpRing = HP_RING_TIME + HP_RING_FADE;
        }
        if (p.hpRing > 0) p.hpRing = Math.max(0, p.hpRing - dt);

        // 自动开火：战备栏里关掉自动射击后，必须按住 J / 手柄 A 才会继续自动射击
        p.fireCd -= dt;
        if (!world.over && !world.bossDefeated && !world.quiet && p.fireCd <= 0 && fireReady()) playerFire();
        // 神秘核心的环绕伤害
        if (!world.over && !world.bossDefeated && p.cheat) updateCheatAura(dt);

        // 道具环
        // 道具三选一：左/右轮换，静止时不动；10 秒未选则自动结算头顶
        if (world.pkg) {
            updatePkgTimer(dt);
            if (world.pkg) {
                if (menuEdge('left')) rotatePkg(-1);
                if (menuEdge('right')) rotatePkg(1);
            }
        }
        // 漂流瓶：走近按 J/A 读瓶中字条（消费这次按键，避免同时触发接伋引擎）
        let bottleUsed = false;
        if (world.bottles && world.bottles.length) {
            world.bottleNear = -1;
            for (let i = 0; i < world.bottles.length; i++) {
                const b = world.bottles[i];
                if (b.readT > 0) b.readT -= dt;
                if (world.bottleNear < 0 && Math.hypot(dX(b.x, p.x), dY(b.y, p.y)) < BOTTLE_R) world.bottleNear = i;
            }
            const bn = world.bottleNear;
            if (bn >= 0 && actPress()) {
                const b = world.bottles[bn];
                if (b.readT <= 0) sfx('found');
                b.readT = BOTTLE_READ_T;
                bottleUsed = true;
            }
        }
        if (actPress() && !bottleUsed) playerAction();
        if (rollPress()) tryRoll();

        // 刷新敌人
        if (!world.quiet && !world.bossDefeated && !world.over) {
            world.spawnTimer -= dt;
            if (world.spawnTimer <= 0) {
                world.spawnTimer = Math.max(0.20, 0.80 - world.tier * 0.24) * rand(0.7, 1.25);
                // BOSS 在场时压制杂兵数量，给玩家留出躲避空间
                const bossOn = !!(world.boss && !world.bossDefeated);
                const maxN = Math.round((55 + world.tier * 18) * (bossOn ? 0.5 : 1));
                // 单次刷怪数量：等级越高一次刷得越多
                let n = 1;
                if (Math.random() < 0.25 + world.level * 0.03) n++;
                if (world.level >= 8 && Math.random() < 0.16 + world.tier * 0.08) n++;
                n = Math.max(1, Math.round(n * (bossOn ? 0.6 : 1)));
                for (let s = 0; s < n; s++) {
                    if (world.enemies.length < maxN) spawnEnemy();
                }
            }
        }

        // 敌人
        for (let i = world.enemies.length - 1; i >= 0; i--) {
            const e = world.enemies[i];
            if (e.flash > 0) e.flash -= dt;
            // 硬直时长统一归零（旧存档或其他路径生成的怪物可能没这个字段）
            const stun = e.stun || 0;
            if (stun > 0) e.stun = stun - dt;    // 硬直中：位置、起手、分离力全部暂停
            // 被弹开的推退：每帧按当前速度移动，速度随剩余时长线性衰减（渐进减速直到停下）
            if (e.pushT > 0) {
                // 从原位置沿推退方向平滑地滑到目标位置，速度逐帧减快、最后停下
                e.pushT -= dt;
                const pk = 1 - clamp(e.pushT / ROLL_PUSH_TIME, 0, 1);
                const ez = 1 - (1 - pk) * (1 - pk);        // easeOutQuad：开头快、逐步减速
                e.x = wrapVal(e.pushX0 + e.pushDx * ez, MAP_W);
                e.y = wrapVal(e.pushY0 + e.pushDy * ez, MAP_H);
                if (e.pushT <= 0) {
                    e.x = wrapVal(e.pushX0 + e.pushDx, MAP_W);
                    e.y = wrapVal(e.pushY0 + e.pushDy, MAP_H);
                    e.pushT = 0;
                }
            }
            const dx = dX(p.x, e.x), dy = dY(p.y, e.y);
            const d = Math.max(1, Math.hypot(dx, dy));
            const wob = Math.sin(world.t * 2.4 + e.ph) * 0.35;
            const nx = dx / d, ny = dy / d;
            const eslow = relicSlowAt(e);      // 水星装备的水洼会拖慢范围内的敌人
            if (stun <= 0) {
                e.x = wrapVal(e.x + (nx + -ny * wob) * e.speed * dt * eslow, MAP_W);
                e.y = wrapVal(e.y + (ny + nx * wob) * e.speed * dt * eslow, MAP_H);
            }
            e.ang = Math.atan2(dy, dx);
            if (e.kind === 'ranged' && stun <= 0) {
                e.cd -= dt;
                // 场上还有自己的子弹在飞（未消失）时不发射第二发
                const busy = world.enemyBullets.some(b => b.owner === e);
                if (e.cd <= 0 && !busy && d < 430) {
                    e.cd = rand(3.2, 5.0);
                    const a = Math.atan2(dy, dx) + rand(-0.12, 0.12);
                    world.enemyBullets.push({
                        x: wrapVal(e.x + Math.cos(a) * 18, MAP_W), y: wrapVal(e.y + Math.sin(a) * 18, MAP_H),
                        vx: Math.cos(a) * 230, vy: Math.sin(a) * 230, r: 4.5, life: 3.4, col: planet.accent, homing: 0, ph: 0,
                        owner: e
                    });
                }
            }
            // 与人物的接触处理：
            //   翻滚中 → 默认把敌人弹开一个身位；电锯翻滚取消弹开，改为对路径上的敌人造成伤害
            //   站桩撞上 → 敌人被击杀（不掉经验），自己掉 1 血并被击退
            if (p.rollT > 0) {
                const hitR = p.chainLv > 0 ? CHAIN_HIT_R : CHAR_S * 0.40;
                if (d < e.r + hitR) {
                    if (p.chainLv > 0) {
                        if (e.rollHit !== p.rollId) {
                            e.rollHit = p.rollId;
                            e.hp -= p.dmg * chainMul(p);
                            stunEnemy(e, HIT_STUN);
                            e.flash = 0.22;
                            addFx({ kind: 'spark', x: e.x, y: e.y, life: 0.32, max: 0.32, r: 14, col: '#cfe4ff' });
                            if (e.hp <= 0) killEnemy(e, i);
                        }
                    } else if (e.rollPush !== p.rollId) {
                        // 弹开时用 -n：(nx, ny) 指向人物，取反才是偏离人物的方向
                        e.rollPush = p.rollId;
                        knockEnemy(e, -nx, -ny, ROLL_PUSH_D);
                        addFx({ kind: 'spark', x: e.x, y: e.y, life: 0.34, max: 0.34, r: 22, col: '#9fd8ff' });
                    }
                }
            } else if (d < e.r + CHAR_S * 0.40) {
                e.x = wrapVal(e.x - nx * 46, MAP_W);
                e.y = wrapVal(e.y - ny * 46, MAP_H);
                damagePlayer(1, e.x, e.y);
                killEnemy(e, i, false);
            }
            // 分离力：避免所有怪挤成一团
            for (let k = 0; k < world.enemies.length; k++) {
                const o = world.enemies[k];
                if (o === e) continue;
                if (stun > 0 || (o.stun || 0) > 0) continue;
                const ox = dX(o.x, e.x), oy = dY(o.y, e.y);
                const dd = Math.hypot(ox, oy);
                if (dd < e.r + o.r && dd > 0.01) {
                    const push = (1 - dd / (e.r + o.r)) * 40 * dt;
                    e.x = wrapVal(e.x - ox / dd * push, MAP_W);
                    e.y = wrapVal(e.y - oy / dd * push, MAP_H);
                }
            }
        }

        // BOSS
        if (world.boss) bossUpdate(dt);
        if (world.boss && !world.bossDefeated) {
            const b = world.boss;
            const d = Math.hypot(dX(b.x, p.x), dY(b.y, p.y));
            if (p.rollT > 0 && p.chainLv > 0 && d < b.r + CHAIN_HIT_R && b.rollHit !== p.rollId) {
                // 电锯翻滚经过 BOSS：一次翻滚只结算一次伤害；BOSS 体积大，不参与弹开
                b.rollHit = p.rollId;
                b.hp -= p.dmg * chainMul(p);
                b.flash = 0.22; b.hurtT = 0.22;
                addFx({ kind: 'spark', x: b.x, y: b.y, life: 0.36, max: 0.36, r: 26, col: '#cfe4ff' });
            } else if (d < b.r + CHAR_S * 0.45) damagePlayer(1, b.x, b.y);
        }

        // 玩家子弹
        for (let i = world.bullets.length - 1; i >= 0; i--) {
            const bu = world.bullets[i];
            bu.life -= dt;
            if (bu.homing > 0) {
                // 追踪冰弹（海王星装备）：持续朝最近的敌人修正方向
                let t2 = null, bd2 = 1e9;
                for (let j = 0; j < world.enemies.length; j++) {
                    const e = world.enemies[j];
                    const dd = dX(e.x, bu.x) * dX(e.x, bu.x) + dY(e.y, bu.y) * dY(e.y, bu.y);
                    if (dd < bd2) { bd2 = dd; t2 = e; }
                }
                if (!t2 && world.boss && !world.bossDefeated) t2 = world.boss;
                if (t2) {
                    const cur = Math.atan2(bu.vy, bu.vx);
                    const ta = Math.atan2(dY(t2.y, bu.y), dX(t2.x, bu.x));
                    const na = cur + clamp(angDiff(ta, cur), -bu.homing * dt, bu.homing * dt);
                    const sp = Math.hypot(bu.vx, bu.vy);
                    bu.vx = Math.cos(na) * sp; bu.vy = Math.sin(na) * sp;
                }
            }
            bu.x = wrapVal(bu.x + bu.vx * dt, MAP_W);
            bu.y = wrapVal(bu.y + bu.vy * dt, MAP_H);
            let hitSomething = false;
            for (let j = world.enemies.length - 1; j >= 0; j--) {
                const e = world.enemies[j];
                if (Math.hypot(dX(e.x, bu.x), dY(e.y, bu.y)) < e.r + bu.r) {
                    if (bu.boom) { explodeBullet(bu, e); if (e.hp <= 0) killEnemy(e, j); }
                    else {
                        e.hp -= bu.dmg; e.flash = 0.12; stunEnemy(e, HIT_STUN); sfx('hit');
                        if (e.hp <= 0) killEnemy(e, j);
                    }
                    // 地面类特色装备在命中位置发动
                    triggerGroundRelic(bu.x, bu.y);
                    hitSomething = true;
                    break;
                }
            }
            if (!hitSomething && world.boss && !world.bossDefeated) {
                const b = world.boss;
                if (Math.hypot(dX(b.x, bu.x), dY(b.y, bu.y)) < b.r + bu.r) {
                    if (bu.boom) explodeBullet(bu, b);
                    else {
                        b.hp -= bu.dmg; b.flash = 0.1; b.hurtT = 0.12; sfx('hit');
                    }
                    hitSomething = true;
                }
            }
            if (hitSomething || bu.life <= 0) world.bullets.splice(i, 1);
        }
        // 爆炸余波：范围伤害比子弹本身晚一拍结算
        updateBlasts(dt);

        if (world.boss && !world.bossDefeated && world.boss.hp <= 0) {
            const b = world.boss;
            world.bossDefeated = true;
            // 记下刚打完的 BOSS 所在星球：回到地球时汇报蓝色漂流瓶
            justClearedPlanet = world.planet.id;
            world.bossKills++;          // 下一次 BOSS 的出现等级门槛随之上抬
            // BOSS 一死，还没放完的技能与场上残留的攻击全部作废：
            // 预警队列倒计时不受 bossUpdate 的提前 return 影响，不清的话会照常发动
            world.pend.length = 0;
            world.warns.length = 0;
            world.zones.length = 0;
            world.blades.length = 0;
            world.beams.length = 0;
            world.marks.length = 0;
            world.score += 800;
            addFx({ kind: 'boom', x: b.x, y: b.y, life: 1.2, max: 1.2, r: 200, col: planet.accent });
            addFx({ kind: 'boom', x: b.x, y: b.y, life: 1.6, max: 1.6, r: 300, col: '#ffffff' });
            for (let i = 0; i < 8; i++) {
                addFx({ kind: 'boom', x: wrapVal(b.x + rand(-90, 90), MAP_W), y: wrapVal(b.y + rand(-90, 90), MAP_H), life: rand(0.6, 1.1), max: 1.1, r: rand(60, 130), col: planet.accent });
            }
            sfx('explode');
            sfx('clear');
            addPopup(scrX(b.x), scrY(b.y) - 60, 'BOSS 已被击败！', '#ffe066');
            // 清场
            for (let i = world.enemies.length - 1; i >= 0; i--) killEnemy(world.enemies[i], i);
            world.enemyBullets.length = 0;
            for (let i = 0; i < 14; i++) {
                world.orbs.push({ x: wrapVal(b.x + rand(-120, 120), MAP_W), y: wrapVal(b.y + rand(-120, 120), MAP_H), val: 2, ph: Math.random() * 6, homing: false, age: 0 });
            }
            spawnBossSpoils(b.x, b.y, b.r);
            recordRun(true);
        }

        // 敌弹
        for (let i = world.enemyBullets.length - 1; i >= 0; i--) {
            const eb = world.enemyBullets[i];
            eb.life -= dt;
            if (eb.homing > 0) {
                const dx = dX(p.x, eb.x), dy = dY(p.y, eb.y);
                const d = Math.max(1, Math.hypot(dx, dy));
                const cur = Math.atan2(eb.vy, eb.vx);
                const ta = Math.atan2(dy, dx);
                const na = cur + clamp(angDiff(ta, cur), -eb.homing * dt, eb.homing * dt);
                const sp = Math.hypot(eb.vx, eb.vy);
                eb.vx = Math.cos(na) * sp; eb.vy = Math.sin(na) * sp;
            }
            eb.x = wrapVal(eb.x + eb.vx * dt, MAP_W);
            eb.y = wrapVal(eb.y + eb.vy * dt, MAP_H);
            if (Math.hypot(dX(eb.x, p.x), dY(eb.y, p.y)) < eb.r + CHAR_S * 0.36) {
                damagePlayer(1, eb.x, eb.y);
                world.enemyBullets.splice(i, 1);
                continue;
            }
            if (eb.life <= 0) world.enemyBullets.splice(i, 1);
        }

        // 旋刃
        for (let i = world.blades.length - 1; i >= 0; i--) {
            const bl = world.blades[i];
            bl.life -= dt;
            bl.ang += bl.spin * dt;
            if (bl.hitT > 0) bl.hitT -= dt;
            for (let k = 0; k < bl.n; k++) {
                const a = bl.ang + k * Math.PI;
                const bx = wrapVal(bl.x + Math.cos(a) * bl.r, MAP_W);
                const by = wrapVal(bl.y + Math.sin(a) * bl.r * 0.85, MAP_H);
                if (Math.hypot(dX(bx, p.x), dY(by, p.y)) < 34 && bl.hitT <= 0) {
                    bl.hitT = 1.0;
                    damagePlayer(1, bx, by);
                }
            }
            if (bl.life <= 0) world.blades.splice(i, 1);
        }

        // 激光
        for (let i = world.beams.length - 1; i >= 0; i--) {
            const bm = world.beams[i];
            if (bm.warn > 0) bm.warn -= dt;
            else {
                bm.life -= dt;
                if (bm.hitT > 0) bm.hitT -= dt;
                const dx = dX(p.x, bm.x), dy = dY(p.y, bm.y);
                const proj = dx * Math.cos(bm.ang) + dy * Math.sin(bm.ang);
                const perp = Math.abs(-dx * Math.sin(bm.ang) + dy * Math.cos(bm.ang));
                if (proj > 0 && proj < bm.len && perp < bm.width * 0.5 + 14 && bm.hitT <= 0) {
                    bm.hitT = 1.2;
                    damagePlayer(1, bm.x, bm.y);
                }
            }
            if (bm.warn <= 0 && bm.life <= 0) world.beams.splice(i, 1);
        }

        // BOSS 技能预警倒计时：走完才真正发动攻击
        for (let i = world.pend.length - 1; i >= 0; i--) {
            const pe = world.pend[i];
            pe.t -= dt;
            if (pe.t <= 0) { world.pend.splice(i, 1); pe.fire(); }
        }
        for (let i = world.warns.length - 1; i >= 0; i--) {
            world.warns[i].t -= dt;
            if (world.warns[i].t <= 0) world.warns.splice(i, 1);
        }
        // 星球特色装备特效（只作用于敌人，无需预警）
        updateRelicFx(dt);
        // 信标与挖掘
        updateBeacon(dt);
        updateDig(dt);

        // 区域
        for (let i = world.zones.length - 1; i >= 0; i--) {
            const z = world.zones[i];
            z.life -= dt;
            if (z.life <= 0) world.zones.splice(i, 1);
        }
        // 标记（雷击 / 脉冲）
        for (let i = world.marks.length - 1; i >= 0; i--) {
            const mk = world.marks[i];
            mk.life -= dt;
            if (mk.kind === 'pulse') mk.r += mk.speed * dt;
            if (mk.kind === 'strike' && mk.life <= 0) {
                const d = Math.hypot(dX(mk.x, p.x), dY(mk.y, p.y));
                addFx({ kind: 'boom', x: mk.x, y: mk.y, life: 0.5, max: 0.5, r: mk.r, col: '#ffe066' });
                sfx('explode');
                if (d < mk.r) damagePlayer(1, mk.x, mk.y);
                world.marks.splice(i, 1);
                continue;
            }
            if (mk.kind === 'pulse' && mk.life <= 0) {
                addFx({ kind: 'boom', x: mk.x, y: mk.y, life: 0.4, max: 0.4, r: 90, col: '#c58cff' });
                const d = Math.hypot(dX(mk.x, p.x), dY(mk.y, p.y));
                if (d < mk.r) damagePlayer(1, mk.x, mk.y);
                world.marks.splice(i, 1);
                continue;
            }
            if (mk.life <= 0) world.marks.splice(i, 1);
        }

        // 经验球：必须先进入拾取圈才会被吸引；一旦被吸引必定拾取到
        // BOSS 击败后停止拾取，场上光点冻结为纯装饰
        // 未被拾取的经验球最多停留 ORB_LIFE 秒，超时淡出消失，避免光点无限堆积
        const pickR = pickupRange(p);
        // 判定略宽于绘制的圈，抵消取整误差并让圈边缘的手感更跟手
        const lockR = pickR * PICKUP_TOL;
        const oby = playerBodyY();        // 身形中心（与范围圈一致）
        for (let i = world.orbs.length - 1; i >= 0; i--) {
            const o = world.orbs[i];
            o.age = (o.age || 0) + dt;
            if (!o.homing && o.age >= ORB_LIFE) {
                addFx({ kind: 'spark', x: o.x, y: o.y, life: 0.3, max: 0.3, r: 10, col: '#9bf6b0' });
                world.orbs.splice(i, 1);
                continue;
            }
            if (world.bossDefeated) continue;   // 场上光点冻结为纯装饰（但仍会超时消失）
            let dx = dX(p.x, o.x), dy = dY(oby, o.y);
            let d = Math.hypot(dx, dy);
            if (!o.homing) {
                // 未拾取的经验光点只在拾取圈内被吸引，超时则淡出
                if (d > lockR) continue;
                o.homing = true;
            }
            if (d <= 6 || d <= dt * ORB_HOMING_SPEED) {
                gainXp(o.val);
                world.score += 2;
                sfx('pickup');
                addFx({ kind: 'spark', x: o.x, y: o.y, life: 0.25, max: 0.25, r: 12, col: '#9bf6b0' });
                world.orbs.splice(i, 1);
                continue;
            }
            // 锁定后匀速直取玩家，速度高于玩家最大移动速度 => 必定拾取
            o.x = wrapVal(o.x + dx / d * ORB_HOMING_SPEED * dt, MAP_W);
            o.y = wrapVal(o.y + dy / d * ORB_HOMING_SPEED * dt, MAP_H);
        }

        // 补给箱
        for (let i = world.packages.length - 1; i >= 0; i--) {
            const pk = world.packages[i];
            if (!pk.landed) {
                pk.vy += 760 * dt;
                const step = pk.vy * dt;
                const remain = dY(pk.ty, pk.y);   // 剩余下落距离
                if (remain <= 0 || step >= remain) {
                    pk.y = pk.ty;
                    pk.vy = 0;
                    pk.landed = true;
                    addFx({ kind: 'boom', x: pk.x, y: pk.y, life: 0.45, max: 0.45, r: 66, col: '#ffffff' });
                    sfx('drop');
                } else {
                    pk.y = wrapVal(pk.y + step, MAP_H);
                }
            }
            if (Math.hypot(dX(pk.x, p.x), dY(pk.y, p.y)) < PICKUP_ITEM_R) {
                // 未选择状态下又拾取新箱：当前头顶的直接算作已选，再开启新的一轮
                if (world.pkg && world.pkg.length) confirmPkg(true);
                world.pkgQueue.push(pk.items.slice());
                openPkg(world.pkgQueue.shift());
                const wBox = pk.kind === 'weapon';
                addFx({ kind: 'spark', x: pk.x, y: pk.y, life: 0.5, max: 0.5, r: 40, col: wBox ? '#d0a0ff' : '#ffe066' });
                addPopup(pk.x, pk.y - 30, (wBox ? '拾取装备补给箱！' : '拾取道具补给箱！') + PKG_TIME + ' 秒内按 J 选择', wBox ? '#e6c8ff' : '#ffe066');
                sfx('item');
                world.packages.splice(i, 1);
            }
        }

        // 特效 / 飘字
        updateWorldFx(dt);

        // 摄像机
        cam.x = p.x; cam.y = p.y;
        if (MAP_BOUNDED) {
            // 允许镜头稍稍越过边界，好让界外的黑色虚空与能量墙看得见
            cam.x = clamp(cam.x, W / 2 - MOON_VOID, Math.max(W / 2 - MOON_VOID, MAP_W - W / 2 + MOON_VOID));
            cam.y = clamp(cam.y, PLAY_H / 2 - MOON_VOID, Math.max(PLAY_H / 2 - MOON_VOID, MAP_H - PLAY_H / 2 + MOON_VOID));
        }
    }
    // 特效与飘字的衰减
    function updateWorldFx(dt) {
        const p = world.player;
        for (let i = world.fx.length - 1; i >= 0; i--) {
            const f = world.fx[i];
            f.life -= dt;
            if (f.kind === 'spark') {
                f.x = wrapVal(f.x + (f.vx || 0) * dt, MAP_W);
                f.y = wrapVal(f.y + (f.vy || 0) * dt, MAP_H);
            }
            if (f.life <= 0) world.fx.splice(i, 1);
        }
        for (let i = world.popups.length - 1; i >= 0; i--) {
            const pp = world.popups[i];
            pp.life -= dt;
            if (pp.follow) { pp.x = p.x; pp.y = p.y; }
            if (pp.life <= 0) world.popups.splice(i, 1);
        }
    }

    // J：确认（登船 / 选用道具 / 挖掘）；K：翻滚
    function playerAction() {
        const p = world.player;
        if (world.over) return;
        // 月球背面在 BOSS 倒下之前不放人走（正面根本没有火箭）
        if ((world.planet.home || world.bossDefeated) && world.moonSide !== 'near') {
            const dr = Math.hypot(dX(world.rocket.x, p.x), dY(world.rocket.y, p.y));
            if (dr < 92) { launchSequence(); return; }
        }
        handleAction();
        // 拾取信标之后，按确认键尝试挖掘
        if (world.beacon && world.beacon.held) tryDig();
        // 地球石柱阵中心的传送门：八颗行星宝石集齐后开启
        if (world.portal && Math.hypot(dX(world.portal.x, p.x), dY(world.portal.y, p.y)) < PORTAL_R) {
            enterMoonNear();
        }
    }

    // ==================== 月球：正面 / 背面 ====================
    const MOON_EDGE = 46;        // 四边留出的实体边界宽度
    const MOON_VOID = 120;      // 镜头最多越过边界的距离，好让界外的黑看得见
    const MOON_FADE = 0.55;      // 换面时的黑场时长
    const PORTAL_R = 74;         // 传送门可进入的半径

    // 走进传送门：离开地球，前往月球正面
    function enterMoonNear() {
        recordRun(false);
        startMoonSide('near');
    }
    // 月球正面走出任意一条边界 = 翻到背面
    function startMoonSide(side) {
        recordRun(false);
        pendingPlanet = null;
        world = newWorld('moon', side);
        if (side === 'far') {
            // 背面照常从火箭着陆
            world.landing = {
                t: 0, dur: 3.5, done: false, landedFx: false,
                x: world.rocket.x, y: world.rocket.y, drawY: 0
            };
        } else {
            // 正面没有火箭，直接站在月球登录器遗址旁边
            const lx = MAP_W * 0.5, ly = MAP_H * 0.55;
            world.lander = { x: lx, y: ly };
            world.player.x = lx + 110;
            world.player.y = ly + 60;
            world.cam.x = world.player.x;
            world.cam.y = world.player.y;
            addPopup(world.player.x, world.player.y - 58, '从任意一条边界走出去即可抵达背面', '#cfe4ff', true);
        }
        scene = 'play';
        sceneT = 0;
        world.fade = MOON_FADE;      // 换面后由黑淡入
        sfx('warp');
    }
    // 月球正面：人物是否已经走出任意一条边界
    function moonNearEdge() {
        const p = world.player;
        const M = MOON_EDGE;
        return p.x < M || p.x > MAP_W - M || p.y < M || p.y > MAP_H - M;
    }
    // 月球背面的边界处理：实体边界，直接把人按回去
    function updateMoonBoundary(dt) {
        const p = world.player;
        const M = MOON_EDGE;
        if (world.edgeHit > 0) world.edgeHit = Math.max(0, world.edgeHit - dt);
        const bx = clamp(p.x, M, MAP_W - M);
        const by = clamp(p.y, M, MAP_H - M);
        if (bx !== p.x || by !== p.y) world.edgeHit = 0.3;
        p.x = bx; p.y = by;
    }
    // 不环绕的地图（月球）：越界的东西一律收掉 / 拉回，避免飞出地图后判定全乱
    function clampWorldObjects() {
        const M = MOON_EDGE;
        for (let i = world.enemies.length - 1; i >= 0; i--) {
            const e = world.enemies[i];
            e.x = clamp(e.x, M, MAP_W - M);
            e.y = clamp(e.y, M, MAP_H - M);
        }
        for (let i = world.bullets.length - 1; i >= 0; i--) {
            const bu = world.bullets[i];
            if (bu.x < 0 || bu.x > MAP_W || bu.y < 0 || bu.y > MAP_H) world.bullets.splice(i, 1);
        }
        for (let i = world.enemyBullets.length - 1; i >= 0; i--) {
            const eb = world.enemyBullets[i];
            if (eb.x < 0 || eb.x > MAP_W || eb.y < 0 || eb.y > MAP_H) world.enemyBullets.splice(i, 1);
        }
        for (let i = 0; i < world.orbs.length; i++) {
            const o = world.orbs[i];
            o.x = clamp(o.x, M, MAP_W - M);
            o.y = clamp(o.y, M, MAP_H - M);
        }
        if (world.boss) {
            world.boss.x = clamp(world.boss.x, M + world.boss.r, MAP_W - M - world.boss.r);
            world.boss.y = clamp(world.boss.y, M + world.boss.r, MAP_H - M - world.boss.r);
        }
    }

    function recordRun(cleared) {
        if (world.recorded) return;
        world.recorded = true;
        const id = world.planet.id;
        const rec = save.planets[id];
        rec.runs++;
        rec.kills += world.kills;
        rec.totalScore += world.score;
        rec.bestScore = Math.max(rec.bestScore, world.score);
        rec.bestLevel = Math.max(rec.bestLevel, world.level);
        rec.totalTime += world.runTime;
        if (cleared) {
            rec.clears++;
            if (world.runTime > 0 && (rec.bestTime === 0 || world.runTime < rec.bestTime)) rec.bestTime = world.runTime;
        }
        for (const k in world.stats.weapons) rec.weapons[k] = (rec.weapons[k] || 0) + world.stats.weapons[k];
        for (const k in world.stats.items) {
            if (k === CHEAT_ITEM_ID) continue;      // 秘籍道具不参与存档
            rec.items[k] = (rec.items[k] || 0) + world.stats.items[k];
        }
        save.totalScore += world.score;
        save.totalKills += world.kills;
        persist();
    }

// ==================== 玩法绘制 ====================
    function drawRocketAt(x, y, ang, t, flame, scale) {
        const S = scale || 1;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(ang);
        ctx.scale(S, S);
        // 地面投影
        ctx.save();
        ctx.globalAlpha = 0.34;
        const sg = ctx.createRadialGradient(0, 46, 4, 0, 48, 58);
        sg.addColorStop(0, 'rgba(0,0,0,0.85)');
        sg.addColorStop(0.6, 'rgba(0,0,0,0.35)');
        sg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = sg;
        ctx.beginPath();
        ctx.ellipse(0, 46, 52, 17, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        // 尾焰
        if (flame > 0) {
            const fl = 34 + 30 * flame + 14 * Math.sin(t * 22);
            const fg = ctx.createRadialGradient(0, 44, 2, 0, 46, fl * 1.1);
            fg.addColorStop(0, 'rgba(255,220,150,0.22)');
            fg.addColorStop(1, 'rgba(255,90,20,0)');
            ctx.fillStyle = fg;
            ctx.beginPath();
            ctx.arc(0, 46, fl * 1.1, 0, Math.PI * 2);
            ctx.fill();
            const g = ctx.createLinearGradient(0, 40, 0, 40 + fl);
            g.addColorStop(0, 'rgba(255,248,214,0.95)');
            g.addColorStop(0.3, 'rgba(255,190,86,0.72)');
            g.addColorStop(0.66, 'rgba(255,110,40,0.34)');
            g.addColorStop(1, 'rgba(255,60,20,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.moveTo(-20, 40);
            ctx.quadraticCurveTo(-13, 40 + fl * 1.02, 0, 40 + fl * 1.32);
            ctx.quadraticCurveTo(13, 40 + fl * 1.02, 20, 40);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,240,0.5)';
            ctx.beginPath();
            ctx.moveTo(-7, 40);
            ctx.quadraticCurveTo(0, 40 + fl * 0.62, 7, 40);
            ctx.closePath();
            ctx.fill();
        }
        // 支腿（先画，被机身压住）
        for (let s = -1; s <= 1; s += 2) {
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#6f7a8c';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(s * 13, 20);
            ctx.lineTo(s * 42, 52);
            ctx.stroke();
            ctx.strokeStyle = '#aab4c4';
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.moveTo(s * 13, 20);
            ctx.lineTo(s * 42, 52);
            ctx.stroke();
            ctx.strokeStyle = '#8b96a8';
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.moveTo(s * 26, 36);
            ctx.lineTo(s * 40, 33);
            ctx.stroke();
            ctx.fillStyle = '#5e6878';
            ctx.beginPath();
            ctx.ellipse(s * 44, 55, 11, 5, s * 0.28, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(215,232,255,0.28)';
            ctx.beginPath();
            ctx.ellipse(s * 44, 53, 8, 2.6, s * 0.28, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.lineCap = 'butt';
        // 尾翼
        for (let s = -1; s <= 1; s += 2) {
            const fg = ctx.createLinearGradient(s * 13, 0, s * 46, 46);
            fg.addColorStop(0, '#e8634f');
            fg.addColorStop(1, '#9c2b24');
            ctx.fillStyle = fg;
            ctx.beginPath();
            ctx.moveTo(s * 13, 2);
            ctx.lineTo(s * 46, 38);
            ctx.lineTo(s * 41, 45);
            ctx.lineTo(s * 13, 33);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = 'rgba(30,10,10,0.35)';
            ctx.lineWidth = 1;
            ctx.stroke();
        }
        // 机身
        const g2 = ctx.createLinearGradient(-30, 0, 30, 0);
        g2.addColorStop(0, '#7a8698');
        g2.addColorStop(0.16, '#bcc5d3');
        g2.addColorStop(0.4, '#ffffff');
        g2.addColorStop(0.66, '#dae0ea');
        g2.addColorStop(1, '#74808f');
        ctx.fillStyle = g2;
        ctx.beginPath();
        ctx.moveTo(0, -68);
        ctx.bezierCurveTo(15, -62, 25, -46, 27, -27);
        ctx.lineTo(27, 22);
        ctx.quadraticCurveTo(27, 33, 17, 33);
        ctx.lineTo(-17, 33);
        ctx.quadraticCurveTo(-27, 33, -27, 22);
        ctx.lineTo(-27, -27);
        ctx.bezierCurveTo(-25, -46, -15, -62, 0, -68);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(24,32,48,0.45)';
        ctx.lineWidth = 1.3;
        ctx.stroke();
        // 面板线
        ctx.strokeStyle = 'rgba(40,52,74,0.16)';
        ctx.lineWidth = 1;
        for (let y = -32; y <= 12; y += 16) {
            ctx.beginPath();
            ctx.moveTo(-27, y); ctx.lineTo(27, y); ctx.stroke();
        }
        // 涂装带
        ctx.fillStyle = '#e04b3c';
        ctx.fillRect(-27, 16, 54, 7);
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(-27, 16, 54, 2);
        // 驾驶舱
        const cg = ctx.createRadialGradient(-4, -32, 2, 0, -25, 17);
        cg.addColorStop(0, '#8ce8ff');
        cg.addColorStop(0.45, '#3a7fb8');
        cg.addColorStop(1, '#14304d');
        ctx.fillStyle = cg;
        ctx.beginPath();
        ctx.ellipse(0, -25, 13, 15, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(228,244,255,0.8)';
        ctx.lineWidth = 1.8;
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath();
        ctx.ellipse(-5, -30, 3.4, 5.8, -0.5, 0, Math.PI * 2);
        ctx.fill();
        // 舷窗
        ctx.fillStyle = '#2f4f7a';
        ctx.strokeStyle = 'rgba(200,225,255,0.55)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(-14, -2, 5, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
        ctx.beginPath();
        ctx.arc(14, -2, 5, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
        // 引擎喷口
        ctx.fillStyle = '#525d6e';
        ctx.beginPath();
        ctx.moveTo(-14, 30); ctx.lineTo(14, 30); ctx.lineTo(18, 41); ctx.lineTo(-18, 41);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(20,26,38,0.6)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = '#2b3242';
        ctx.beginPath();
        ctx.ellipse(0, 41, 18, 5.5, 0, 0, Math.PI * 2);
        ctx.fill();
        // 航行灯：左红右绿，亮起时带对应颜色光晕
        const navOn = (t % 1.2) < 0.62;
        for (let s = -1; s <= 1; s += 2) {
            const col = s < 0 ? '255,96,96' : '120,255,170';
            const lx = s * 30, ly = -12;
            if (navOn) {
                const lg = ctx.createRadialGradient(lx, ly, 0.5, lx, ly, 10);
                lg.addColorStop(0, 'rgba(' + col + ',0.9)');
                lg.addColorStop(0.28, 'rgba(' + col + ',0.42)');
                lg.addColorStop(1, 'rgba(' + col + ',0)');
                ctx.fillStyle = lg;
                ctx.beginPath();
                ctx.arc(lx, ly, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(' + col + ',0.5)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(lx - 7, ly); ctx.lineTo(lx + 7, ly);
                ctx.moveTo(lx, ly - 7); ctx.lineTo(lx, ly + 7);
                ctx.stroke();
            }
            ctx.fillStyle = 'rgba(' + col + ',' + (navOn ? 0.95 : 0.3) + ')';
            ctx.beginPath();
            ctx.arc(lx, ly, 2.8, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    function drawZones() {
        for (let i = 0; i < world.zones.length; i++) {
            const z = world.zones[i];
            const x = scrX(z.x), y = scrY(z.y);
            const m = 220 / viewZoom;
            if (x < -m || x > W + m || y < -m || y > PLAY_H + m) continue;
            const fade = Math.min(1, z.life);
            const pulse = 0.5 + 0.5 * Math.sin(world.t * 3 + z.ph);
            ctx.save();
            ctx.translate(x, y);
            if (z.type === 'slow') {
                const g = ctx.createRadialGradient(0, 0, z.r * 0.2, 0, 0, z.r);
                g.addColorStop(0, 'rgba(120,210,255,' + (0.42 * fade) + ')');
                g.addColorStop(0.75, 'rgba(60,150,230,' + (0.30 * fade) + ')');
                g.addColorStop(1, 'rgba(40,120,200,0)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.ellipse(0, 0, z.r, z.r * 0.78, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(190,240,255,' + (0.5 * fade) + ')';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(0, 0, z.r * 0.9, z.r * 0.7, 0, 0, Math.PI * 2);
                ctx.stroke();
            } else if (z.type === 'fire') {
                for (let k = 0; k < 5; k++) {
                    const a = z.ph + k * 1.25;
                    const rr = z.r * (0.35 + 0.5 * ((k * 0.37 + pulse) % 1));
                    const fh = 26 + 22 * Math.sin(world.t * 9 + k + z.ph);
                    const g = ctx.createRadialGradient(Math.cos(a) * rr * 0.5, Math.sin(a) * rr * 0.35, 2, Math.cos(a) * rr * 0.5, Math.sin(a) * rr * 0.35, fh);
                    g.addColorStop(0, 'rgba(255,240,150,' + (0.75 * fade) + ')');
                    g.addColorStop(0.4, 'rgba(255,140,40,' + (0.55 * fade) + ')');
                    g.addColorStop(1, 'rgba(200,40,10,0)');
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.ellipse(Math.cos(a) * rr * 0.5, Math.sin(a) * rr * 0.35, fh * 0.6, fh, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else { // acid
                const g = ctx.createRadialGradient(0, 0, 2, 0, 0, z.r);
                g.addColorStop(0, 'rgba(190,255,120,' + (0.5 * fade) + ')');
                g.addColorStop(0.7, 'rgba(110,190,60,' + (0.34 * fade) + ')');
                g.addColorStop(1, 'rgba(70,140,30,0)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.ellipse(0, 0, z.r, z.r * 0.8, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(220,255,160,' + (0.25 * fade) + ')';
                for (let k = 0; k < 4; k++) {
                    const a = world.t * 1.4 + k * 1.6 + z.ph;
                    ctx.beginPath();
                    ctx.arc(Math.cos(a) * z.r * 0.4, Math.sin(a) * z.r * 0.3, 3 + 3 * pulse, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.restore();
        }
    }

    function drawMarks() {
        for (let i = 0; i < world.marks.length; i++) {
            const mk = world.marks[i];
            const x = scrX(mk.x), y = scrY(mk.y);
            if (mk.kind === 'strike') {
                const t = 1 - mk.life / mk.max;
                ctx.save();
                ctx.strokeStyle = 'rgba(255,230,100,' + (0.4 + 0.5 * t) + ')';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(x, y, mk.r * (0.4 + 0.6 * t), 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x - mk.r, y); ctx.lineTo(x + mk.r, y);
                ctx.moveTo(x, y - mk.r); ctx.lineTo(x, y + mk.r);
                ctx.stroke();
                ctx.restore();
            } else if (mk.kind === 'pulse') {
                ctx.save();
                ctx.strokeStyle = 'rgba(200,140,255,' + (mk.life / mk.max) + ')';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(x, y, mk.r, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
        }
    }

    function drawBlades() {
        for (let i = 0; i < world.blades.length; i++) {
            const bl = world.blades[i];
            const x = scrX(bl.x), y = scrY(bl.y);
            ctx.save();
            ctx.translate(x, y);
            ctx.globalAlpha = Math.min(1, bl.life);
            for (let k = 0; k < bl.n; k++) {
                const a = bl.ang + k * Math.PI;
                ctx.save();
                ctx.rotate(a);
                const g = ctx.createLinearGradient(0, 0, bl.r, 0);
                g.addColorStop(0, 'rgba(255,240,190,0.9)');
                g.addColorStop(1, 'rgba(255,200,80,0.15)');
                ctx.strokeStyle = g;
                ctx.lineWidth = 12;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(10, 0);
                ctx.lineTo(bl.r, 0);
                ctx.stroke();
                ctx.fillStyle = '#fff6d8';
                ctx.beginPath();
                ctx.arc(bl.r, 0, 13, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            ctx.restore();
        }
    }

    function drawBeams() {
        for (let i = 0; i < world.beams.length; i++) {
            const bm = world.beams[i];
            const x = scrX(bm.x), y = scrY(bm.y);
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(bm.ang);
            if (bm.warn > 0) {
                const t = 1 - bm.warn / 0.95;
                ctx.strokeStyle = 'rgba(255,120,120,' + (0.25 + 0.4 * Math.sin(world.t * 20)) + ')';
                ctx.lineWidth = 2.5;
                ctx.setLineDash([14, 12]);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(bm.len, 0);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.strokeStyle = 'rgba(255,80,80,' + (0.25 * t) + ')';
                ctx.lineWidth = bm.width * (0.3 + 0.7 * t);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(bm.len, 0);
                ctx.stroke();
            } else {
                const g = ctx.createLinearGradient(0, -bm.width / 2, 0, bm.width / 2);
                g.addColorStop(0, 'rgba(255,120,255,0.1)');
                g.addColorStop(0.5, 'rgba(255,255,255,' + (0.85 * Math.min(1, bm.life / 0.2)) + ')');
                g.addColorStop(1, 'rgba(255,120,255,0.1)');
                ctx.fillStyle = g;
                ctx.fillRect(0, -bm.width / 2, bm.len, bm.width);
                ctx.fillStyle = 'rgba(255,255,255,0.95)';
                ctx.fillRect(0, -bm.width * 0.16, bm.len, bm.width * 0.32);
            }
            ctx.restore();
        }
    }

    function drawPackages() {
        for (let i = 0; i < world.packages.length; i++) {
            const pk = world.packages[i];
            const isWeapon = pk.kind === 'weapon';
            const x = scrX(pk.x), y = scrY(pk.y);
            const bob = pk.landed ? Math.sin(world.t * 4 + pk.ph) * 3 : 0;
            if (!pk.landed) {
                // 落点在地面上的轻微阴影（越接近越清晰）
                const gx = scrX(pk.tx), gy = scrY(pk.ty);
                const fall = clamp(1 - Math.abs(dY(pk.y, pk.ty)) / pk.tx0, 0, 1);
                ctx.save();
                ctx.globalAlpha = 0.10 + 0.30 * fall;
                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.ellipse(gx, gy + 26, 20 + 20 * (1 - fall), 6 + 7 * (1 - fall), 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            ctx.save();
            ctx.translate(x, y + bob);
            if (pk.landed) {
                ctx.fillStyle = 'rgba(0,0,0,0.25)';
                ctx.beginPath();
                ctx.ellipse(0, 28, 26, 9, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            if (!pk.landed) {
                // 降落伞
                ctx.strokeStyle = '#dfe8f5';
                ctx.lineWidth = 2.4;
                ctx.beginPath();
                ctx.moveTo(-30, -56); ctx.lineTo(0, 0);
                ctx.moveTo(30, -56); ctx.lineTo(0, 0);
                ctx.stroke();
                ctx.fillStyle = '#ff5c5c';
                ctx.beginPath();
                ctx.arc(0, -62, 30, Math.PI, 0);
                ctx.fill();
                ctx.fillStyle = '#f5f7fa';
                ctx.beginPath();
                ctx.arc(0, -62, 30, Math.PI, 1.5 * Math.PI);
                ctx.fill();
                ctx.fillStyle = '#ff5c5c';
                ctx.beginPath();
                ctx.arc(0, -62, 30, 2.5 * Math.PI, 2 * Math.PI);
                ctx.fill();
            } else {
                // 醒目脉冲光环
                const glow = 0.35 + 0.35 * Math.sin(world.t * 5 + pk.ph);
                const g = ctx.createRadialGradient(0, 0, 4, 0, 0, 72);
                g.addColorStop(0, isWeapon ? 'rgba(226,180,255,' + (0.55 * glow) + ')' : 'rgba(255,236,140,' + (0.5 * glow) + ')');
                g.addColorStop(0.55, isWeapon ? 'rgba(170,110,240,' + (0.24 * glow) + ')' : 'rgba(255,176,48,' + (0.22 * glow) + ')');
                g.addColorStop(1, isWeapon ? 'rgba(140,80,220,0)' : 'rgba(255,140,20,0)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(0, 0, 72, 0, Math.PI * 2);
                ctx.fill();
            }
            // ===== 箱体（52×42，比原来更大）=====
            const BW = 52, BH = 42, BX = -BW / 2, BY = -18;
            // 外壳
            const bg = ctx.createLinearGradient(0, BY, 0, BY + BH);
            if (isWeapon) {
                bg.addColorStop(0, '#e6b8ff');
                bg.addColorStop(0.5, '#b06af0');
                bg.addColorStop(1, '#6a2ea8');
            } else {
                bg.addColorStop(0, '#ffd75e');
                bg.addColorStop(0.5, '#ff9f1c');
                bg.addColorStop(1, '#e06a00');
            }
            ctx.fillStyle = bg;
            roundRectPath(BX, BY, BW, BH, 8);
            ctx.fill();
            ctx.strokeStyle = isWeapon ? '#3d1460' : '#7a3c00';
            ctx.lineWidth = 2.5;
            ctx.stroke();
            // 顶部高光
            ctx.fillStyle = 'rgba(255,255,255,0.45)';
            roundRectPath(BX + 4, BY + 3, BW - 8, 8, 4);
            ctx.fill();
            // 深色腰带 + 铆钉
            ctx.fillStyle = isWeapon ? '#31104f' : '#5a2d00';
            ctx.fillRect(BX, BY + 16, BW, 9);
            ctx.fillStyle = isWeapon ? 'rgba(226,200,255,0.9)' : 'rgba(255,220,140,0.9)';
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.arc(BX + 7 + i * 9.5, BY + 20.5, 1.8, 0, Math.PI * 2);
                ctx.fill();
            }
            // 四角护角
            ctx.fillStyle = isWeapon ? '#5a2490' : '#8a4a00';
            for (const [cx2, cy2] of [[BX + 5, BY + 5], [BX + BW - 5, BY + 5], [BX + 5, BY + BH - 5], [BX + BW - 5, BY + BH - 5]]) {
                ctx.beginPath();
                ctx.arc(cx2, cy2, 4.2, 0, Math.PI * 2);
                ctx.fill();
            }
            // 中央发光标记：道具箱 = 惊叹号，装备箱 = 五角星
            ctx.fillStyle = isWeapon ? '#2c0d47' : '#3a1c00';
            roundRectPath(-5, BY + 7, 10, 18, 4);
            ctx.fill();
            if (isWeapon) {
                ctx.fillStyle = '#f3e4ff';
                ctx.beginPath();
                for (let i = 0; i < 10; i++) {
                    const a = -Math.PI / 2 + i * Math.PI / 5;
                    const rr = i % 2 ? 4.4 : 10.5;
                    const vx = Math.cos(a) * rr, vy = BY + 16 + Math.sin(a) * rr;
                    if (i === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
                }
                ctx.closePath();
                ctx.fill();
            } else {
                ctx.fillStyle = '#fff4c2';
                roundRectPath(-2.6, BY + 9.5, 5.2, 9, 2.2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(0, BY + 22.5, 3, 0, Math.PI * 2);
                ctx.fill();
            }
            // 底部锁扣
            ctx.fillStyle = '#8a8f9a';
            roundRectPath(-7, BY + BH - 3, 14, 7, 2);
            ctx.fill();
            ctx.fillStyle = '#dfe4ec';
            ctx.fillRect(-5, BY + BH - 1, 10, 2);
            ctx.restore();
        }
    }

    function drawOrbs() {
        for (let i = 0; i < world.orbs.length; i++) {
            const o = world.orbs[i];
            const x = scrX(o.x), y = scrY(o.y);
            const bob = Math.sin(world.t * 4 + o.ph) * 3;
            const fade = world.bossDefeated ? 0.55 : 1;
            // 即将超时的经验球闪烁提醒，然后淡出
            const left = ORB_LIFE - (o.age || 0);
            let blink = 1;
            if (!o.homing && left < ORB_BLINK) {
                blink = 0.3 + 0.7 * Math.abs(Math.sin(world.t * 9 + o.ph));
            }
            const alpha = fade * blink;
            const pulse = 1 + 0.05 * Math.sin(world.t * 8 + o.ph);
            const R = (o.homing ? 15 : 16) * pulse;
            ctx.save();
            ctx.globalAlpha = alpha;
            const g = ctx.createRadialGradient(x, y + bob, 1, x, y + bob, R);
            g.addColorStop(0, 'rgba(180,255,220,' + (0.5 * alpha) + ')');
            g.addColorStop(1, 'rgba(120,255,190,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(x, y + bob, R, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = o.homing ? 'rgba(255,255,255,' + alpha + ')' : 'rgba(190,255,225,' + alpha + ')';
            ctx.beginPath();
            ctx.arc(x, y + bob, 5 * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,' + (0.9 * alpha) + ')';
            ctx.beginPath();
            ctx.arc(x - 1.4, y + bob - 1.6, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    function drawBullets() {
        for (let i = 0; i < world.bullets.length; i++) {
            const bu = world.bullets[i];
            const x = scrX(bu.x), y = scrY(bu.y);
            const ang = Math.atan2(bu.vy, bu.vx);
            if (bu.ice) {
                // 深渊追迹的冰弹
                const pulse = 1 + 0.14 * Math.sin(world.t * 12 + (bu.ph || 0));
                const R = bu.r * 2.1 * pulse;
                const g = ctx.createRadialGradient(x, y, 1, x, y, R);
                g.addColorStop(0, 'rgba(255,255,255,0.95)');
                g.addColorStop(0.35, bu.col || '#bfe8ff');
                g.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.save();
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(x, y, R, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.92)';
                ctx.beginPath();
                ctx.arc(x, y, bu.r * 0.42, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                continue;
            }
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(ang);
            if (bu.boom) {
                // 爆炸子弹：橙色弹头 + 尾焰 + 爆炸范围提示环
                ctx.strokeStyle = 'rgba(255,170,80,0.32)';
                ctx.lineWidth = 1.4;
                ctx.setLineDash([4, 6]);
                ctx.lineDashOffset = -world.t * 20;
                ctx.beginPath();
                ctx.arc(0, 0, bu.boomR, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = 'rgba(255,150,60,0.42)';
                ctx.beginPath();
                ctx.moveTo(-20, 0); ctx.lineTo(-6, -6); ctx.lineTo(-6, 6);
                ctx.closePath();
                ctx.fill();
                const bg = ctx.createRadialGradient(4, 0, 1, 4, 0, 10);
                bg.addColorStop(0, '#fff3dc');
                bg.addColorStop(0.5, '#ff9f43');
                bg.addColorStop(1, 'rgba(255,120,20,0)');
                ctx.fillStyle = bg;
                ctx.beginPath();
                ctx.arc(4, 0, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffd08a';
                ctx.beginPath();
                ctx.arc(4, 0, 3.4, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = 'rgba(140,220,255,0.5)';
                ctx.beginPath();
                ctx.ellipse(-7, 0, 13, 4.5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#e9faff';
                roundRectPath(-8, -2.2, 16, 4.4, 2.2);
                ctx.fill();
            }
            ctx.restore();
        }
        for (let i = 0; i < world.enemyBullets.length; i++) {
            const eb = world.enemyBullets[i];
            const x = scrX(eb.x), y = scrY(eb.y);
            ctx.save();
            ctx.translate(x, y);
            const pulse = 1 + 0.12 * Math.sin(world.t * 12 + eb.ph);
            const g = ctx.createRadialGradient(0, 0, 1, 0, 0, eb.r * 1.9 * pulse);
            g.addColorStop(0, 'rgba(255,255,255,0.95)');
            g.addColorStop(0.35, eb.col);
            g.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(0, 0, eb.r * 1.9 * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.92)';
            ctx.beginPath();
            ctx.arc(0, 0, eb.r * 0.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    function drawFx() {
        for (let i = 0; i < world.fx.length; i++) {
            const f = world.fx[i];
            const x = scrX(f.x), y = scrY(f.y);
            const t = 1 - f.life / f.max;
            if (f.kind === 'boom') {
                const g = ctx.createRadialGradient(x, y, f.r * 0.15 * t, x, y, f.r * (0.4 + 0.6 * t));
                g.addColorStop(0, 'rgba(255,255,255,' + (0.85 * (1 - t)) + ')');
                g.addColorStop(0.45, f.col + 'aa');
                g.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.globalAlpha = 1 - t;
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(x, y, f.r * (0.4 + 0.6 * t), 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            } else if (f.kind === 'spark') {
                ctx.globalAlpha = (1 - t) * 0.9;
                ctx.fillStyle = f.col;
                ctx.beginPath();
                ctx.arc(x, y, f.r * (1 - t * 0.6), 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            } else if (f.kind === 'muzzle') {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(f.ang);
                ctx.globalAlpha = 1 - t;
                ctx.fillStyle = f.col;
                ctx.beginPath();
                ctx.moveTo(0, -7);
                ctx.lineTo(20, 0);
                ctx.lineTo(0, 7);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
                ctx.globalAlpha = 1;
            } else if (f.kind === 'trail') {
                ctx.globalAlpha = (1 - t) * 0.5;
                ctx.fillStyle = f.col;
                ctx.beginPath();
                ctx.arc(x, y, f.r * (1 - t * 0.5), 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            } else if (f.kind === 'ring') {
                // 冲击环：快速外扩并同时变细，模拟冲击波被甩出去
                const k = easeOutCubic(t);
                const rr = f.r * (0.22 + 1.25 * k);
                ctx.save();
                ctx.globalAlpha = (1 - t) * (1 - t) * 0.95;
                ctx.strokeStyle = f.col;
                ctx.lineWidth = Math.max(0.6, 9 * (1 - t));
                ctx.beginPath();
                ctx.ellipse(x, y, rr, rr * 0.6, 0, 0, Math.PI * 2);
                ctx.stroke();
                // 内侧再补一圈更亮更细的边，制造厚度
                ctx.globalAlpha = (1 - t) * 0.55;
                ctx.lineWidth = Math.max(0.4, 3 * (1 - t));
                ctx.beginPath();
                ctx.ellipse(x, y, rr * 0.82, rr * 0.49, 0, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
                ctx.globalAlpha = 1;
            }
        }
    }

    // ==================== 月球：登录器遗址 ====================
    // 正面唯一的地面建筑：早已废弃的登月舱残骸，周围是被砸出的一片月壤
    function drawMoonLander(wx, wy, t) {
        const x = scrX(wx), y = scrY(wy);
        const m = 300 / viewZoom;
        if (x < -m || x > W + m || y < -m || y > PLAY_H + m) return;
        const lean = -0.14;                       // 整具舱体歪着，像被撞过
        ctx.save();
        // 落点上的月壤与脚印
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = '#6f6d68';
        ctx.beginPath();
        ctx.ellipse(x + 4, y + 6, 62, 20, 0, 0, TAU);
        ctx.fill();
        ctx.globalAlpha = 0.22;
        ctx.fillStyle = '#3c3a37';
        for (let i = 0; i < 9; i++) {
            const a = hash2(i * 3.7, 2.1) * TAU;
            const rr = 26 + hash2(i * 5.3, 1.7) * 46;
            ctx.beginPath();
            ctx.ellipse(x + Math.cos(a) * rr, y + Math.sin(a) * rr * 0.42,
                3 + hash2(i * 7.1, 3.3) * 4, 2 + hash2(i * 2.9, 4.1) * 3, a, 0, TAU);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.translate(x, y);
        ctx.rotate(lean);
        // 支腿
        ctx.strokeStyle = '#9aa0a8';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        for (let i = -1; i <= 1; i += 2) {
            ctx.beginPath();
            ctx.moveTo(i * 10, -34);
            ctx.lineTo(i * 40, 0);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(i * 40, 0);
            ctx.lineTo(i * 30, -6);
            ctx.stroke();
        }
