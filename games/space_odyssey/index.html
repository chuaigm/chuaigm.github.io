<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-viewport=1.0, user-scalable=no">
<title>太阳系奥德赛</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
        background: #05060f;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Courier New', 'Microsoft YaHei', monospace;
    }
    .game-container {
        background: #05060f;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 100%;
        max-height: 100%;
    }
    .canvas-wrap {
        position: relative;
        width: 100%;
        max-width: 1280px;
        line-height: 0;
    }
    canvas {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 1280 / 720;
        touch-action: none;
    }
    .fullscreen-btn {
        position: absolute;
        top: 6px; right: 6px;
        width: 30px; height: 30px;
        border: none;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.45);
        display: flex; align-items: center; justify-content: center;
        cursor: pointer;
        touch-action: manipulation;
        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
        transition: background 0.15s, color 0.15s, transform 0.1s;
        z-index: 10; padding: 0; outline: none;
    }
    .fullscreen-btn:hover { background: rgba(255, 255, 255, 0.18); color: rgba(255, 255, 255, 0.8); }
    .fullscreen-btn:active { background: rgba(255, 255, 255, 0.28); color: #ffffff; transform: scale(0.92); }
    .fullscreen-btn svg { width: 15px; height: 15px; display: block; pointer-events: none; }
    @media (max-width: 720px) {
        .fullscreen-btn { width: 26px; height: 26px; top: 5px; right: 5px; border-radius: 7px; }
        .fullscreen-btn svg { width: 13px; height: 13px; }
    }
    .game-container.is-fullscreen {
        width: 100vw; height: 100vh;
        max-width: none; max-height: none;
        background: #000;
        justify-content: center; align-items: center;
    }
    .game-container.is-fullscreen .canvas-wrap {
        width: 100%; height: 100%; max-width: none;
        display: flex; align-items: center; justify-content: center;
    }
    .game-container.is-fullscreen canvas {
        width: auto !important;
        height: auto !important;
        max-width: 100%;
        max-height: 100%;
    }
    .game-container.is-fullscreen .fullscreen-btn {
        top: 8px; right: 8px;
        background: rgba(255, 255, 255, 0.10);
        color: rgba(255, 255, 255, 0.55);
        z-index: 30;
    }
</style>
</head>
<body>
<div class="game-container" id="gameContainer">
    <div class="canvas-wrap" id="canvasWrap">
        <canvas id="gameCanvas" width="1280" height="720"></canvas>
        <button class="fullscreen-btn" id="fullscreenBtn" aria-label="全屏" title="全屏">
            <svg id="fsIconExpand" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 9V4h5"/><path d="M20 9V4h-5"/>
                <path d="M4 15v5h5"/><path d="M20 15v5h-5"/>
            </svg>
            <svg id="fsIconCompress" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                <path d="M9 4v5H4"/><path d="M15 4v5h5"/>
                <path d="M9 20v-5H4"/><path d="M15 20v-5h5"/>
            </svg>
        </button>
    </div>
</div>
<script>
(function() {
    'use strict';

    const VERSION = '20261012';

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let P = ctx;
    const container = document.getElementById('gameContainer');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const fsIconExpand = document.getElementById('fsIconExpand');
    const fsIconCompress = document.getElementById('fsIconCompress');

    // ==================== 常量 ====================
    const W = 1280, H = 720;
    const HUD_H = 58;
    const PLAY_H = H - HUD_H;
    const FONT = '"Courier New","Microsoft YaHei",monospace';

    const SAVE_KEY = 'space_odyssey_save_v1';

    // 角色尺寸（俯视基准单位）
    const CHAR_S = 46;          // 一个"身位"
    const CHAR_H = 56;          // 角色绘制高度
    const BODY_OFF = 30;         // 身形中心相对脚底锚点的上移量（范围圈以此为中心）
    // 人物绘制锚点固定在整幅画面的垂直中心，不受下方状态栏影响
    const PLAYER_CY = H / 2;
    const PLAYER_SCR_OFF = PLAYER_CY - PLAY_H / 2;   // 绘制锚点相对 scrY(p.y) 的偏移
    const MAP_W = 6400;         // 地图宽（约 100 个身位）
    const MAP_H = 5800;
    const TILE = 160;

    const BASE_SPEED = 168;     // 主角基础速度 px/s
    const BASE_FIRE_CD = 1.0;   // 基础开枪 CD
    const ROLL_TIME = 0.42;
    const ROLL_CD = 3.0;
    const ROLL_DIST = CHAR_S * 3.1;
    const MAX_HP = 10;
    // 拾取范围：50px（约 1.1 身位）
    const PICKUP_BASE = 50;
    const FIRE_RANGE = CHAR_H * 3.6;   // 3.6 个身位自动开火
    const ROCKET_SCALE = 1.5;          // 星球表面火箭的放大倍率
    const ORB_HOMING_SPEED = 620;       // 经验球锁定后的追踪速度（高于玩家最大速度，保证必拾取）
    const PICKUP_TOL = 1.15;             // 实际拾取判定相对绘制圈的放大系数（抵消取整误差）
    const PKG_TIME = 10.0;               // 武器箱选择时限（秒）
    const PKG_TIMER_R = 28;              // 选择倒计时圆环半径（紧贴头顶图标 26*0.95≈24.7）
    const BASE_DMG = 1;                  // 初始攻击力（不再随等级提升）

    // ==================== 工具 ====================
    function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function rand(a, b) { return a + Math.random() * (b - a); }
    function randInt(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); }
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function hash(n) {
        const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
    }
    function hash2(a, b) { return hash(a * 157.31 + b * 271.13); }
    function wrapVal(v, size) { v = v % size; if (v < 0) v += size; return v; }
    function dist(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); }
    function angDiff(a, b) {
        let d = (a - b) % (Math.PI * 2);
        if (d > Math.PI) d -= Math.PI * 2;
        if (d < -Math.PI) d += Math.PI * 2;
        return d;
    }
    function easeOutCubic(t) { const u = 1 - t; return 1 - u * u * u; }
    function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
    function lerpColor(c1, c2, t) {
        const r = Math.round(lerp(c1[0], c2[0], t)), g = Math.round(lerp(c1[1], c2[1], t)), b = Math.round(lerp(c1[2], c2[2], t));
        return 'rgb(' + r + ',' + g + ',' + b + ')';
    }
    function hexRgb(h) {
        if (h[0] === '#') {
            if (h.length === 7) return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)];
            if (h.length === 4) return [parseInt(h[1] + h[1], 16), parseInt(h[2] + h[2], 16), parseInt(h[3] + h[3], 16)];
        }
        return [200, 200, 200];
    }
    function shade(h, amt) {
        const c = hexRgb(h);
        const f = amt >= 0 ? (v => v + (255 - v) * amt) : (v => v * (1 + amt));
        return 'rgb(' + Math.round(clamp(f(c[0]), 0, 255)) + ',' + Math.round(clamp(f(c[1]), 0, 255)) + ',' + Math.round(clamp(f(c[2]), 0, 255)) + ')';
    }
    function roundRectPath(x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        r = Math.max(0, r);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }
    function setFont(size, weight) { ctx.font = (weight || 'bold') + ' ' + size + 'px ' + FONT; }
    const ROUND_FONT = '"幼圆","YouYuan","STYuanti","Trebuchet MS","Microsoft YaHei",sans-serif';
    function setRoundFont(size, weight) { ctx.font = (weight || TITLE_WEIGHT) + ' ' + size + 'px ' + ROUND_FONT; }
    let TITLE_WEIGHT = 'bold';
    // ---------- 中文字距绘制 ----------
    // 逐字测量并绘制：保证 CJK 文本真正居中（不受字形左右边距影响），
    // 同时支持字与字之间插入额外间隙。
    // mode: 'center' 以 x 为整串中心，'left' 以 x 为整串左缘。
    function measureSpaced(text, spacing) {
        const chars = Array.from(text);
        let total = 0;
        for (const c of chars) total += ctx.measureText(c).width;
        return total + (chars.length > 1 ? spacing * (chars.length - 1) : 0);
    }
    function drawSpacedText(text, x, y, spacing, mode) {
        const chars = Array.from(text);
        if (!chars.length) return 0;
        const total = measureSpaced(text, spacing);
        let cx = mode === 'center' ? x - total / 2 : x;
        const prevAlign = ctx.textAlign;
        ctx.textAlign = 'center';   // 每个字在自己的字宽槽内居中
        for (const c of chars) {
            const w = ctx.measureText(c).width;
            ctx.fillText(c, cx + w / 2, y);
            cx += w + spacing;
        }
        ctx.textAlign = prevAlign;
        return total;
    }
    function detectRoundFont() {
        try {
            const probe = '太阳系奥德赛ABC';
            const saved = ctx.font;
            ctx.font = '40px monospace';
            const w1 = ctx.measureText(probe).width;
            ctx.font = '40px "幼圆","YouYuan"';
            const w2 = ctx.measureText(probe).width;
            ctx.font = saved;
            if (Math.abs(w1 - w2) > 0.5) TITLE_WEIGHT = 'normal';
        } catch (e) { }
    }

    // ==================== 音效 ====================
    let audioCtx = null, masterGain = null;
    function ensureAudio() {
        if (!audioCtx) {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 0.5;
                masterGain.connect(audioCtx.destination);
            } catch (e) { audioCtx = null; }
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }
    function tone(opt) {
        if (!save.sound || !audioCtx) return;
        const t = audioCtx.currentTime + (opt.delay || 0);
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = opt.type || 'sine';
        osc.frequency.setValueAtTime(opt.f0, t);
        if (opt.f1 && opt.f1 !== opt.f0) osc.frequency.exponentialRampToValueAtTime(Math.max(20, opt.f1), t + opt.dur);
        const vol = opt.vol === undefined ? 0.12 : opt.vol;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.02, opt.dur * 0.3));
        gain.gain.exponentialRampToValueAtTime(0.0001, t + opt.dur);
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(t);
        osc.stop(t + opt.dur + 0.02);
    }
    function noise(opt) {
        if (!save.sound || !audioCtx) return;
        const t = audioCtx.currentTime + (opt.delay || 0);
        const len = opt.dur;
        const buf = audioCtx.createBuffer(1, Math.max(1, Math.floor(audioCtx.sampleRate * len)), audioCtx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        const filt = audioCtx.createBiquadFilter();
        filt.type = opt.filter || 'lowpass';
        filt.frequency.setValueAtTime(opt.f0 || 1200, t);
        if (opt.f1) filt.frequency.exponentialRampToValueAtTime(Math.max(60, opt.f1), t + len);
        const gain = audioCtx.createGain();
        const vol = opt.vol === undefined ? 0.14 : opt.vol;
        gain.gain.setValueAtTime(vol, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + len);
        src.connect(filt); filt.connect(gain); gain.connect(masterGain);
        src.start(t);
        src.stop(t + len + 0.02);
    }
    const SFX = {
        uiMove: function () { tone({ type: 'square', f0: 620, f1: 760, dur: 0.06, vol: 0.06 }); },
        uiSelect: function () { tone({ type: 'square', f0: 520, f1: 880, dur: 0.1, vol: 0.08 }); tone({ type: 'square', f0: 880, f1: 1320, dur: 0.09, vol: 0.05, delay: 0.06 }); },
        uiBack: function () { tone({ type: 'square', f0: 500, f1: 260, dur: 0.12, vol: 0.07 }); },
        shoot: function () { tone({ type: 'square', f0: 900, f1: 320, dur: 0.09, vol: 0.07 }); noise({ f0: 3200, f1: 700, dur: 0.06, vol: 0.05, filter: 'bandpass' }); },
        shootRocket: function () { noise({ f0: 900, f1: 200, dur: 0.28, vol: 0.13, filter: 'lowpass' }); tone({ type: 'sawtooth', f0: 180, f1: 60, dur: 0.26, vol: 0.08 }); },
        hit: function () { noise({ f0: 2400, f1: 500, dur: 0.07, vol: 0.08, filter: 'bandpass' }); },
        enemyDie: function () { tone({ type: 'triangle', f0: 420, f1: 140, dur: 0.16, vol: 0.08 }); noise({ f0: 1400, f1: 300, dur: 0.14, vol: 0.07 }); },
        pickup: function () { tone({ type: 'sine', f0: 1320, dur: 0.1, vol: 0.07 }); tone({ type: 'sine', f0: 1980, dur: 0.12, vol: 0.05, delay: 0.06 }); },
        levelup: function () {
            tone({ type: 'square', f0: 660, dur: 0.09, vol: 0.07 });
            tone({ type: 'square', f0: 880, dur: 0.09, vol: 0.07, delay: 0.08 });
            tone({ type: 'square', f0: 1320, dur: 0.16, vol: 0.07, delay: 0.16 });
        },
        drop: function () { tone({ type: 'sine', f0: 300, f1: 900, dur: 0.35, vol: 0.06 }); },
        item: function () {
            tone({ type: 'triangle', f0: 523, dur: 0.09, vol: 0.08 });
            tone({ type: 'triangle', f0: 784, dur: 0.09, vol: 0.08, delay: 0.07 });
            tone({ type: 'triangle', f0: 1046, dur: 0.2, vol: 0.07, delay: 0.14 });
        },
        roll: function () { noise({ f0: 400, f1: 2600, dur: 0.3, vol: 0.09, filter: 'bandpass' }); },
        hurt: function () { tone({ type: 'sawtooth', f0: 300, f1: 70, dur: 0.3, vol: 0.12 }); noise({ f0: 700, f1: 150, dur: 0.22, vol: 0.1 }); },
        boss: function () {
            for (let i = 0; i < 3; i++) tone({ type: 'sawtooth', f0: 180, f1: 120, dur: 0.3, vol: 0.1, delay: i * 0.34 });
            noise({ f0: 200, dur: 0.9, vol: 0.09, filter: 'lowpass' });
        },
        explode: function () { noise({ f0: 1600, f1: 90, dur: 0.6, vol: 0.2, filter: 'lowpass' }); tone({ type: 'sine', f0: 140, f1: 40, dur: 0.5, vol: 0.14 }); },
        laser: function () { tone({ type: 'sawtooth', f0: 1400, f1: 260, dur: 0.45, vol: 0.09 }); noise({ f0: 2600, f1: 900, dur: 0.45, vol: 0.06, filter: 'bandpass' }); },
        land: function () { noise({ f0: 500, f1: 80, dur: 0.5, vol: 0.16, filter: 'lowpass' }); tone({ type: 'sine', f0: 110, f1: 40, dur: 0.4, vol: 0.1 }); },
        launch: function () { noise({ f0: 200, f1: 1800, dur: 1.6, vol: 0.12, filter: 'lowpass' }); tone({ type: 'sawtooth', f0: 90, f1: 420, dur: 1.5, vol: 0.09 }); },
        warp: function () { tone({ type: 'sine', f0: 240, f1: 1600, dur: 0.55, vol: 0.08 }); tone({ type: 'sine', f0: 1600, f1: 240, dur: 0.5, vol: 0.06, delay: 0.45 }); },
        clear: function () {
            [523, 659, 784, 1046].forEach((f, i) => tone({ type: 'square', f0: f, dur: 0.22, vol: 0.08, delay: i * 0.13 }));
        }
    };
    function sfx(name) { const f = SFX[name]; if (f) { try { f(); } catch (e) { } } }

    // ==================== 存档 ====================
    function defaultPlanetRec() {
        return {
            clears: 0, runs: 0, kills: 0,
            bestScore: 0, totalScore: 0,
            bestLevel: 0, bestTime: 0, totalTime: 0,
            weapons: {}, items: {}
        };
    }
    function defaultSave() {
        const s = { sound: true, touchUI: false, visits: 0, totalScore: 0, totalKills: 0, planets: {} };
        for (const p of PLANETS) s.planets[p.id] = defaultPlanetRec();
        return s;
    }
    function loadSave() {
        let raw = null;
        try { raw = window.localStorage.getItem(SAVE_KEY); } catch (e) { raw = null; }
        const base = defaultSave();
        if (!raw) return base;
        try {
            const data = JSON.parse(raw);
            if (data && typeof data === 'object') {
                if (typeof data.sound === 'boolean') base.sound = data.sound;
                if (typeof data.touchUI === 'boolean') base.touchUI = data.touchUI;
                base.visits = data.visits | 0;
                base.totalScore = data.totalScore | 0;
                base.totalKills = data.totalKills | 0;
                if (data.planets) {
                    for (const p of PLANETS) {
                        const src = data.planets[p.id];
                        if (!src) continue;
                        const rec = base.planets[p.id];
                        rec.clears = src.clears | 0;
                        rec.runs = src.runs | 0;
                        rec.kills = src.kills | 0;
                        rec.bestScore = src.bestScore | 0;
                        rec.totalScore = src.totalScore | 0;
                        rec.bestLevel = src.bestLevel | 0;
                        rec.bestTime = src.bestTime | 0;
                        rec.totalTime = src.totalTime | 0;
                        if (src.weapons) for (const k in src.weapons) rec.weapons[k] = src.weapons[k] | 0;
                        if (src.items) for (const k in src.items) rec.items[k] = src.items[k] | 0;
                    }
                }
            }
        } catch (e) { }
        return base;
    }
    function persist() {
        try { window.localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { }
    }
    let save = null;

    // ==================== 行星数据 ====================
    const PLANETS = [
        {
            id: 'mercury', name: '水星', x: 222, y: 322, r: 17,
            colA: '#cfc7b8', colB: '#8d8578', ring: null,
            boss: '灰烬水王 · 阿刻罗米',
            ground: '#9c9488', ground2: '#7d766c', grid: '#6d675e', accent: '#bfe6ff',
            sky: '#2a2620',
            decor: 'crater',
            enemy: { body: '#9fb0a8', dark: '#5d6b64', eye: '#ffd166' },
            bossCol: { body: '#7f8f9c', dark: '#3f4b55', eye: '#7ff0ff' },
            ability: 'water',
            abilityName: '漫地水幕',
            abilityDesc: '喷洒大片水洼，踏入后移动大幅迟缓'
        },
        {
            id: 'venus', name: '金星', x: 306, y: 306, r: 25,
            colA: '#f0cf85', colB: '#a9762f', ring: null,
            boss: '硫酸冠冕 · 维纳斯',
            ground: '#c79a4e', ground2: '#9c7238', grid: '#8a6330', accent: '#ffe08a',
            sky: '#3a2a12',
            decor: 'dune',
            enemy: { body: '#d9a95a', dark: '#8a5f22', eye: '#ff6f61' },
            bossCol: { body: '#e0b264', dark: '#7d4f18', eye: '#ff4d4d' },
            ability: 'acid',
            abilityName: '酸雨灼烧',
            abilityDesc: '降下酸雨池，站在其中持续掉血'
        },
        {
            id: 'earth', name: '地球', x: 392, y: 336, r: 26, home: true,
            colA: '#4f9be0', colB: '#2b5f96', ring: null,
            boss: null,
            ground: '#4f7f46', ground2: '#3d6636', grid: '#35592f', accent: '#bfe98a',
            sky: '#0b1a2f',
            decor: 'grass',
            enemy: null, bossCol: null,
            ability: null, abilityName: '家园', abilityDesc: '无战斗 · 碑文与战利品陈列'
        },
        {
            id: 'mars', name: '火星', x: 470, y: 320, r: 19,
            colA: '#d9714a', colB: '#8a3c22', ring: null,
            boss: '炎狱火魔 · 阿里斯',
            ground: '#b4573a', ground2: '#8c3f28', grid: '#7a3623', accent: '#ff9d5c',
            sky: '#2b1009',
            decor: 'rock',
            enemy: { body: '#c9603c', dark: '#6f2f1c', eye: '#ffe066' },
            bossCol: { body: '#b34a2c', dark: '#4d1a10', eye: '#ff3b1f' },
            ability: 'fire',
            abilityName: '烈焰地火',
            abilityDesc: '向地面投下火焰，踩到持续扣血'
        },
        {
            id: 'jupiter', name: '木星', x: 625, y: 328, r: 74,
            colA: '#e0b083', colB: '#9b6b45', ring: null,
            boss: '大红斑暴君 · 泰坦',

        ctx.fillStyle = '#03040c';
        ctx.fillRect(0, 0, W, H);
        for (let i = 0; i < STARS.length; i++) {
            const s = STARS[i];
            let sx = (s.x + t * s.dx) % W; if (sx < 0) sx += W;
            let sy = (s.y + t * s.dy) % H; if (sy < 0) sy += H;
            const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
            ctx.globalAlpha = alpha * (0.25 + 0.75 * tw);
            ctx.fillStyle = i % 9 === 0 ? '#cfe4ff' : '#ffffff';
            ctx.beginPath();
            ctx.arc(sx, sy, s.r, 0, Math.PI * 2);

            if (s.big) {

                ctx.globalAlpha = alpha * 0.35 * tw;
                const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, s.r * 7);
                g.addColorStop(0, 'rgba(200,225,255,0.55)');
                g.addColorStop(1, 'rgba(200,225,255,0)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(sx, sy, s.r * 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = alpha * 0.55 * tw;
                ctx.strokeStyle = '#dbeaff';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(sx - s.r * 4, sy); ctx.lineTo(sx + s.r * 4, sy);
                ctx.moveTo(sx, sy - s.r * 4); ctx.lineTo(sx, sy + s.r * 4);

            const cx = b.x + Math.sin(t * 0.012 + i * 1.7) * 22;
            const cy = b.y + Math.cos(t * 0.009 + i * 2.3) * 15;
            const rr = b.r * (1 + 0.05 * Math.sin(t * 0.05 + i));

    function drawBands(r, rows, palette, wob, phase, alpha) {
        // 大气条带（带湍流起伏）
        const h = (r * 2) / rows;
        for (let i = 0; i < rows; i++) {
            const y = -r + i * h;
            P.fillStyle = palette[i % palette.length];
            P.beginPath();
            P.moveTo(-r - 2, y);
            for (let k = 0; k <= 12; k++) {
                const x = -r - 2 + (k / 12) * (r * 2 + 4);
                P.lineTo(x, y + Math.sin(k * 0.9 + i * 1.7 + phase) * wob);
            }
            for (let k = 12; k >= 0; k--) {
                const x = -r - 2 + (k / 12) * (r * 2 + 4);
                P.lineTo(x, y + h + Math.sin(k * 0.9 + i * 1.7 + phase + 0.6) * wob);
            }
            P.closePath();
            P.fill();
            if (alpha) {
                P.fillStyle = 'rgba(0,0,0,' + (0.04 + 0.03 * (i % 2)) + ')';
                P.fillRect(-r, y, r * 2, h * 0.35);
            }
        }
    }
    function fadeAlpha(col, a) {
        const i = col.lastIndexOf(',');
        return col.slice(0, i + 1) + a + ')';
    }
    function drawVortex(x, y, rx, ry, col, rot) {
        const g = P.createRadialGradient(x, y, 1, x, y, Math.max(rx, ry));
        g.addColorStop(0, col);
        g.addColorStop(0.6, fadeAlpha(col, 0.45));
        g.addColorStop(1, fadeAlpha(col, 0));
        P.fillStyle = g;
        P.beginPath();
        P.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2);
        P.fill();
    }
    // 晨昏线（太阳在左，光来自左侧）
    function drawTerminator(r) {
        const g = P.createLinearGradient(-r * 0.75, -r * 0.28, r * 0.85, r * 0.45);
        g.addColorStop(0, 'rgba(0,0,0,0)');
        g.addColorStop(0.42, 'rgba(0,0,0,0.04)');
        g.addColorStop(0.68, 'rgba(4,6,14,0.32)');
        g.addColorStop(0.88, 'rgba(2,3,9,0.66)');
        g.addColorStop(1, 'rgba(0,1,5,0.86)');
        P.fillStyle = g;
        P.fillRect(-r, -r, r * 2, r * 2);
    }
    // 大气边缘辉光
    function drawAtmosphere(r, col, w) {
        const g = P.createRadialGradient(0, 0, r * (1 - w), 0, 0, r * 1.06);
        g.addColorStop(0, col.replace('ALPHA', '0.55'));
        g.addColorStop(0.55, col.replace('ALPHA', '0.22'));
        g.addColorStop(1, col.replace('ALPHA', '0'));
        P.fillStyle = g;
        P.beginPath();
        P.arc(0, 0, r * 1.06, 0, Math.PI * 2);
        P.fill();
    }
    // 受光侧高光边
    function drawLimbLight(r, col) {
        P.save();
        P.beginPath();
        P.arc(0, 0, r, 0, Math.PI * 2);
        P.clip();
        const g = P.createRadialGradient(-r * 0.66, -r * 0.26, r * 0.50, -r * 0.66, -r * 0.26, r * 1.38);
        g.addColorStop(0, col.replace('ALPHA', '0'));
        g.addColorStop(0.42, col.replace('ALPHA', '0.10'));
        g.addColorStop(0.62, col.replace('ALPHA', '0.26'));
        g.addColorStop(0.80, col.replace('ALPHA', '0.08'));
        g.addColorStop(1, col.replace('ALPHA', '0'));
        P.fillStyle = g;
        P.beginPath();
        P.arc(0, 0, r, 0, Math.PI * 2);
        P.fill();
        P.restore();
    }

    function planetTexture(p, r, rot) {
        P.save();
        P.beginPath();
        P.arc(0, 0, r, 0, Math.PI * 2);
        P.clip();
        switch (p.id) {
            case 'mercury': {
                // 月海（暗色平原）
                P.fillStyle = 'rgba(96,90,82,0.45)';
                for (let i = 0; i < 3; i++) {
                    const a = hash(i * 3.3 + 11) * Math.PI * 2;
                    const d = hash(i * 5.1 + 12) * r * 0.6;
                    P.beginPath();
                    P.ellipse(Math.cos(a) * d, Math.sin(a) * d, r * (0.30 + hash(i * 2.3) * 0.26), r * (0.20 + hash(i * 3.7) * 0.18), a, 0, Math.PI * 2);
                    P.fill();
                }
                // 陨石坑（带受光边缘）
                for (let i = 0; i < 14; i++) {
                    const a = hash(i * 3 + 13) * Math.PI * 2;
                    const d = hash(i * 5 + 14) * r * 0.92;
                    const cr = r * (0.05 + hash(i * 7 + 15) * 0.13);
                    drawCrater(Math.cos(a) * d, Math.sin(a) * d * 0.9, cr, a);
                }
                break;
            }
            case 'venus': {
                // 硫酸云层 + 高速 Y 形气流
                P.fillStyle = '#e8c078';
                P.fillRect(-r, -r, r * 2, r * 2);
                for (let i = 0; i < 7; i++) {
                    const y = -r + (i / 7) * r * 2 + Math.sin(i * 2.1) * r * 0.08;
                    const flow = wrapX(rot * r * 0.35 + i * r * 0.42, r);
                    P.strokeStyle = i % 2 ? 'rgba(255,240,200,0.30)' : 'rgba(170,120,40,0.28)';
                    P.lineWidth = r * (0.10 + hash(i * 3) * 0.10);
                    P.beginPath();
                    P.moveTo(flow - r, y);
                    P.quadraticCurveTo(flow - r * 0.2, y + r * 0.30, flow + r * 0.35, y - r * 0.06);
                    P.quadraticCurveTo(flow + r * 0.8, y - r * 0.30, flow + r, y + r * 0.08);
                    P.stroke();
                }
                // 极地涡旋
                drawVortex(0, -r * 0.86, r * 0.5, r * 0.22, 'rgba(255,245,215,0.5)', 0);
                drawVortex(0, r * 0.88, r * 0.45, r * 0.20, 'rgba(180,130,50,0.4)', 0);
                break;
            }
            case 'earth': {
                // 海洋
                const og = P.createLinearGradient(-r, -r, r, r);
                og.addColorStop(0, '#2f7fd0');
                og.addColorStop(0.5, '#1f63b4');
                og.addColorStop(1, '#123f80');
                P.fillStyle = og;
                P.fillRect(-r, -r, r * 2, r * 2);
                // 陆地
                for (let i = 0; i < 6; i++) {
                    const a = hash(i * 3 + 21) * Math.PI * 2;
                    const d = hash(i * 5 + 22) * r * 0.62;
                    const cx = Math.cos(a) * d, cy = Math.sin(a) * d * 0.85;
                    P.fillStyle = ['#3f8f46', '#4d9c4a', '#7a8f3e', '#5a7a35'][i % 4];
                    P.beginPath();
                    for (let k = 0; k <= 10; k++) {
                        const ka = (k / 10) * Math.PI * 2;
                        const rr = r * (0.14 + hash(i * 7 + k) * 0.17);
                        const px = cx + Math.cos(ka) * rr, py = cy + Math.sin(ka) * rr * 0.8;
                        if (k === 0) P.moveTo(px, py); else P.lineTo(px, py);
                    }
                    P.closePath();
                    P.fill();
                    // 沙漠与高地
                    P.fillStyle = 'rgba(190,165,90,0.5)';
                    P.beginPath();
                    P.ellipse(cx + r * 0.04, cy, r * 0.07, r * 0.05, 0, 0, Math.PI * 2);
                    P.fill();
                }
                // 极冰冠
                // 北极冠：下沿逐渐变淡
                const iceE = P.createLinearGradient(0, -r * 1.25, 0, -r * 0.55);
                iceE.addColorStop(0, 'rgba(244,252,255,0.95)');
                iceE.addColorStop(0.45, 'rgba(240,250,255,0.72)');
                iceE.addColorStop(1, 'rgba(238,248,255,0)');
                P.fillStyle = iceE;
                P.beginPath();
                P.ellipse(0, -r * 0.95, r * 0.58, r * 0.34, 0, 0, Math.PI * 2);
                P.fill();
                // 云层（缓慢飘动）
                for (let i = 0; i < 8; i++) {
                    const ph = i * 1.7;
                    const cx = wrapX(hash(i * 11 + 31) * r * 1.6 + rot * r * 0.75, r);
                    const cy = (hash(i * 13 + 32) * 2 - 1) * r * 0.82;
                    P.fillStyle = 'rgba(255,255,255,' + (0.26 + 0.18 * (0.5 + 0.5 * Math.sin(rot * 0.8 + ph))) + ')';
                    P.beginPath();
                    P.ellipse(cx, cy, r * (0.24 + hash(i * 3 + 33) * 0.26), r * 0.10, hash(i * 5 + 34) * 1.2 - 0.6, 0, Math.PI * 2);
                    P.fill();
                }
                break;
            }
            case 'mars': {
                // 铁锈色平原
                P.fillStyle = '#c05a34';
                P.fillRect(-r, -r, r * 2, r * 2);
                // 暗色反照率区（沙暴与古海盆）
                for (let i = 0; i < 5; i++) {
                    const a = hash(i * 3 + 41) * Math.PI * 2;
                    const d = hash(i * 5 + 42) * r * 0.6;
                    P.fillStyle = i % 2 ? 'rgba(120,55,32,0.5)' : 'rgba(215,120,70,0.45)';
                    P.beginPath();
                    P.ellipse(Math.cos(a) * d, Math.sin(a) * d * 0.85, r * (0.20 + hash(i * 7 + 43) * 0.22), r * (0.13 + hash(i * 9 + 44) * 0.14), a, 0, Math.PI * 2);
                    P.fill();
                }
                // 陨石坑
                for (let i = 0; i < 8; i++) {
                    const a = hash(i * 3 + 45) * Math.PI * 2;
                    const d = hash(i * 5 + 46) * r * 0.85;
                    drawCrater(Math.cos(a) * d, Math.sin(a) * d * 0.9, r * (0.05 + hash(i * 7 + 47) * 0.11), a);
                }
                // 极冠
                const iceM = P.createLinearGradient(0, -r * 1.2, 0, -r * 0.62);
                iceM.addColorStop(0, 'rgba(248,252,255,0.95)');
                iceM.addColorStop(0.45, 'rgba(243,250,255,0.70)');
                iceM.addColorStop(1, 'rgba(240,248,255,0)');
                P.fillStyle = iceM;
                P.beginPath();
                P.ellipse(0, -r * 0.97, r * 0.48, r * 0.30, 0, 0, Math.PI * 2);
                P.fill();
                // 沙尘暴
                drawVortex(wrapX(-r * 0.35 + rot * r * 0.45, r), r * 0.1, r * 0.30, r * 0.16, 'rgba(235,180,130,0.30)', 0.3);
                break;
            }
            case 'jupiter': {
                // 多条带 + 湍流
                drawBands(r, 9, [
                    'rgba(226,196,160,0.95)', 'rgba(168,110,68,0.95)', 'rgba(238,214,182,0.95)',
                    'rgba(186,124,76,0.95)', 'rgba(232,205,172,0.95)', 'rgba(158,100,62,0.95)',
                    'rgba(240,220,190,0.95)', 'rgba(176,116,70,0.95)', 'rgba(226,200,166,0.95)'
                ], r * 0.035, rot * 0.22, true);
                // 白色风暴：沿带流向横向掠过球面
                for (let i = 0; i < 5; i++) {
                    const yy = -r * 0.62 + (i / 4) * r * 1.3 + Math.sin(i * 2.3) * r * 0.10;
                    const xx = wrapX(rot * r * 1.15 + i * r * 0.62, r);
                    drawVortex(xx, yy, r * (0.16 + hash(i * 5) * 0.10), r * 0.085,
                        i % 2 ? 'rgba(255,250,240,0.62)' : 'rgba(255,246,230,0.5)', 0.05);
                }
                // 大红斑
                drawVortex(r * 0.26, r * 0.22, r * 0.26, r * 0.15, 'rgba(196,74,44,0.9)', 0.05);
                drawVortex(r * 0.26, r * 0.22, r * 0.15, r * 0.08, 'rgba(232,130,90,0.75)', 0);
                break;
            }
            case 'saturn': {
                // 柔和奶油色条带
                drawBands(r, 7, [
                    'rgba(238,220,180,0.95)', 'rgba(206,182,132,0.95)', 'rgba(244,230,196,0.95)',
                    'rgba(198,172,120,0.95)', 'rgba(240,226,190,0.95)', 'rgba(212,190,140,0.95)',
                    'rgba(236,218,180,0.95)'
                ], r * 0.022, rot * 0.15, true);
                // 北极六边形霾（固定）
                drawVortex(0, -r * 0.86, r * 0.42, r * 0.16, 'rgba(160,150,120,0.35)', 0);
                for (let i = 0; i < 4; i++) {
                    const yy = -r * 0.45 + (i / 3) * r * 1.0;
                    const xx = wrapX(rot * r * 0.7 + i * r * 0.78, r);
                    drawVortex(xx, yy, r * (0.14 + hash(i * 7) * 0.09), r * 0.06,
                        'rgba(255,248,220,0.42)', 0);
                }
                break;
            }
            case 'uranus': {
                // 近乎无特征的淡青
                const ug = P.createLinearGradient(0, -r, 0, r);
                ug.addColorStop(0, '#b6f0f2');
                ug.addColorStop(0.55, '#8fdfe3');
                ug.addColorStop(1, '#68b9c2');
                P.fillStyle = ug;
                P.fillRect(-r, -r, r * 2, r * 2);
                P.strokeStyle = 'rgba(255,255,255,0.22)';
                P.lineWidth = r * 0.05;
                for (let i = 0; i < 4; i++) {
                    P.beginPath();
                    P.ellipse(0, -r * 0.6 + i * r * 0.4, r * 0.9, r * 0.12, 0.12, 0, Math.PI * 2);
                    P.stroke();
                }
                drawVortex(0, r * 0.55, r * 0.3, r * 0.12, 'rgba(255,255,255,0.35)', 0);
                break;
            }
            case 'neptune': {
                const ng = P.createLinearGradient(0, -r, 0, r);
                ng.addColorStop(0, '#4f7ce8');
                ng.addColorStop(0.6, '#3358c8');
                ng.addColorStop(1, '#20388f');
                P.fillStyle = ng;
                P.fillRect(-r, -r, r * 2, r * 2);
                // 大暗斑
                drawVortex(-r * 0.28, -r * 0.10, r * 0.30, r * 0.17, 'rgba(12,24,80,0.75)', 0.1);
                // 甲烷卷云亮斑
                for (let i = 0; i < 5; i++) {
                    const y = -r * 0.55 + i * r * 0.28;
                    const x = wrapX(rot * r * 0.9 + i * r * 0.56, r);
                    P.fillStyle = 'rgba(220,240,255,' + (0.20 + 0.10 * Math.sin(rot * 0.5 + i)) + ')';
                    P.beginPath();
                    P.ellipse(x, y, r * (0.26 + hash(i * 7) * 0.24), r * 0.055, 0.04, 0, Math.PI * 2);
                    P.fill();
                }
                drawVortex(r * 0.42, r * 0.42, r * 0.16, r * 0.09, 'rgba(255,255,255,0.5)', 0);
                break;
            }
            case 'pluto': {
                // 暗色赤道带（冥王星之海）
                P.fillStyle = '#8d7d6d';
                P.fillRect(-r, -r, r * 2, r * 2);
                P.fillStyle = 'rgba(70,58,62,0.55)';
                P.beginPath();
                P.ellipse(0, r * 0.10, r * 0.98, r * 0.30, 0, 0, Math.PI * 2);
                P.fill();
                // 汤博区（心形氮冰原）
                const hx = r * 0.16 + Math.sin(rot * 0.4) * r * 0.05, hy = r * 0.16, hs = r * 0.46;
                P.fillStyle = 'rgba(250,244,232,0.85)';
                P.beginPath();
                P.moveTo(hx, hy + hs);
                P.bezierCurveTo(hx - hs * 1.15, hy - hs * 0.45, hx - hs * 0.25, hy - hs * 1.15, hx, hy - hs * 0.38);
                P.bezierCurveTo(hx + hs * 0.25, hy - hs * 1.15, hx + hs * 1.15, hy - hs * 0.45, hx, hy + hs);
                P.fill();
                // 撞击坑
                for (let i = 0; i < 4; i++) {
                    const a = hash(i * 9 + 51) * Math.PI * 2;
                    drawCrater(Math.cos(a) * r * 0.7, Math.sin(a) * r * 0.6, r * (0.06 + hash(i * 3) * 0.08), a);
                }
                break;
            }
        }
        P.restore();
    }

    // ---- 行星环（前/后半环分别绘制，实现遮挡） ----
    const RING_LAYERS = [
        { k: 1.00, w: 0.07, c: 'rgba(206,190,152,0.38)' },
        { k: 0.90, w: 0.13, c: 'rgba(247,233,196,0.62)' },
        { k: 0.80, w: 0.035, c: 'rgba(28,22,16,0.42)' },
        { k: 0.70, w: 0.10, c: 'rgba(236,216,172,0.55)' },
        { k: 0.60, w: 0.03, c: 'rgba(28,22,16,0.30)' },
        { k: 0.52, w: 0.07, c: 'rgba(230,210,168,0.45)' }
    ];
    function drawPlanetRing(p, r, tilt, front) {
        const uranus = p.ringStyle === 'uranus';
        const rx = r * (uranus ? 1.26 : 1.42);
        const ry = rx * (uranus ? 0.90 : 0.40);
        P.save();
        P.rotate(tilt);
        for (let i = 0; i < RING_LAYERS.length; i++) {
            if (uranus && i > 1) continue;
            const L = RING_LAYERS[i];
            P.strokeStyle = uranus ? 'rgba(200,240,245,0.24)' : L.c;
            P.lineWidth = Math.max(1, rx * (uranus ? 0.03 : L.w));
            P.beginPath();
            P.ellipse(0, 0, rx * L.k, ry * L.k, 0, front ? 0 : Math.PI, front ? Math.PI : Math.PI * 2);
            P.stroke();
        }
        P.restore();
    }

    // ---- 星球本体（离屏缓存，旋转很慢所以低频重绘） ----
    function drawPlanetBody(p, r, rot) {
        const g = P.createRadialGradient(-r * 0.52, -r * 0.32, r * 0.06, 0, 0, r * 1.12);
        g.addColorStop(0, shade(p.colA, 0.30));
        g.addColorStop(0.45, p.colA);
        g.addColorStop(0.88, p.colB);
        g.addColorStop(1, shade(p.colB, -0.25));
        P.fillStyle = g;
        P.beginPath();
        P.arc(0, 0, r, 0, Math.PI * 2);
        P.fill();
        P.save();
        P.beginPath();
        P.arc(0, 0, r, 0, Math.PI * 2);
        P.clip();
        planetTexture(p, r, rot);
        drawTerminator(r);
        P.restore();
        if (p.id === 'earth') drawAtmosphere(r, 'rgba(140,205,255,ALPHA)', 0.16);
        else if (p.id === 'venus') drawAtmosphere(r, 'rgba(255,225,160,ALPHA)', 0.18);
        else if (p.id === 'neptune') drawAtmosphere(r, 'rgba(120,170,255,ALPHA)', 0.14);
        else if (p.id === 'uranus') drawAtmosphere(r, 'rgba(170,245,250,ALPHA)', 0.14);
        else if (p.id === 'saturn' || p.id === 'jupiter') drawAtmosphere(r, 'rgba(255,225,180,ALPHA)', 0.10);
        else if (p.id === 'pluto') drawAtmosphere(r, 'rgba(220,225,255,ALPHA)', 0.10);
        if (p.id === 'earth' || p.id === 'venus' || p.id === 'jupiter' ||
            p.id === 'saturn' || p.id === 'neptune' || p.id === 'uranus') {
            drawLimbLight(r, 'rgba(255,250,235,ALPHA)');
        }
    }

    const planetSprites = {};
    const SPRITE_SCALE = 2.2;
    function getPlanetSprite(p) {
        const rot = solarT * p.rotSp;
        const R = Math.ceil(p.r * 2.24);
        let c = planetSprites[p.id];
        if (!c || c.R !== R || Math.abs(rot - c.rot) > 0.022) {
            const cv = document.createElement('canvas');
            cv.width = Math.ceil(R * 2 * SPRITE_SCALE);
            cv.height = cv.width;
            const g2 = cv.getContext('2d');
            g2.setTransform(SPRITE_SCALE, 0, 0, SPRITE_SCALE, cv.width / 2, cv.height / 2);
            const savedP = P;
            P = g2;
            drawPlanetBody(p, p.r, rot);
            P = savedP;
            c = { canvas: cv, R: R, rot: rot };
            planetSprites[p.id] = c;
        }
        return c;
    }

    function drawPlanet(p, t, highlight) {
        const r = p.r;
        const ppos = planetPos(p);
        const px = ppos.x, py = ppos.y;
        const gc = hexRgb(p.colA);
        const breathe = 1 + 0.04 * Math.sin(t * 0.5 + p.bobPh);
        // 外晕（缓慢呼吸）
        ctx.save();
        const glow = ctx.createRadialGradient(p.x, py, r * 0.7, p.x, py, r * 2.0 * breathe);
        glow.addColorStop(0, 'rgba(' + gc[0] + ',' + gc[1] + ',' + gc[2] + ',0.20)');
        glow.addColorStop(1, 'rgba(' + gc[0] + ',' + gc[1] + ',' + gc[2] + ',0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(px, py, r * 2.0 * breathe, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        // 选中环
        if (highlight > 0) {
            ctx.save();
            ctx.strokeStyle = 'rgba(140,230,255,' + (0.30 + 0.35 * Math.sin(t * 6)) + ')';
            ctx.lineWidth = 2.5;
            ctx.setLineDash([9, 8]);
            ctx.beginPath();
            ctx.arc(px, py, r + 18 + Math.sin(t * 4) * 3, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
        // 行星环背面（被星球遮挡）
        const tilt = p.ringStyle === 'uranus' ? 1.15 : (-0.38 + Math.sin(t * p.ringSp) * 0.04);
        if (p.ring) {
            ctx.save();
            ctx.translate(px, py);
            drawPlanetRing(p, r, tilt, false);
            ctx.restore();
        }
        // 星球本体
        const sp = getPlanetSprite(p);
        ctx.drawImage(sp.canvas, px - sp.R, py - sp.R, sp.R * 2, sp.R * 2);
        // 行星环正面（遮挡星球）
        if (p.ring) {
            ctx.save();
            ctx.translate(px, py);
            drawPlanetRing(p, r, tilt, true);
            ctx.restore();
        }
        // 地球卫星
        if (p.id === 'earth') {
            const a = t * 0.5 + p.bobPh;
            const mR = r * 2.0;
            const mx = px + Math.cos(a) * mR, my = py + Math.sin(a) * mR * 0.40;
            ctx.save();
            ctx.strokeStyle = 'rgba(190,205,225,0.18)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.ellipse(px, py, mR, mR * 0.40, 0, 0, Math.PI * 2);
            ctx.stroke();
            const mg = ctx.createRadialGradient(mx - 1, my - 1, 0.4, mx, my, 3.6);
            mg.addColorStop(0, '#eef1f6');
            mg.addColorStop(1, '#9aa2b0');
            ctx.fillStyle = mg;
            ctx.beginPath();
            ctx.arc(mx, my, 3.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    function drawSun(t) {
        const r = SUN.r;
        ctx.save();
        ctx.translate(SUN.x, SUN.y);
        // 日冕
        const cor = ctx.createRadialGradient(0, 0, r * 0.85, 0, 0, r * 2.7);
        cor.addColorStop(0, 'rgba(255,205,105,0.50)');
        cor.addColorStop(0.30, 'rgba(255,150,45,0.20)');
        cor.addColorStop(0.65, 'rgba(255,110,25,0.07)');
        cor.addColorStop(1, 'rgba(255,100,20,0)');
        ctx.fillStyle = cor;
        ctx.beginPath();
        ctx.arc(0, 0, r * 2.7, 0, Math.PI * 2);
        ctx.fill();
        // 缓慢旋转的日冕流光
        ctx.save();
        ctx.rotate(t * 0.035);
        ctx.globalAlpha = 0.12;
        ctx.fillStyle = '#ffcf6b';
        for (let i = 0; i < 20; i++) {
            const a = (i / 20) * Math.PI * 2;
            const len = r * (1.42 + 0.18 * Math.sin(t * 0.9 + i * 1.7));
            ctx.beginPath();
            ctx.moveTo(Math.cos(a - 0.035) * r * 0.92, Math.sin(a - 0.035) * r * 0.92);
            ctx.lineTo(Math.cos(a) * len, Math.sin(a) * len);
            ctx.lineTo(Math.cos(a + 0.035) * r * 0.92, Math.sin(a + 0.035) * r * 0.92);
            ctx.closePath();
            ctx.fill();
        }
        ctx.restore();
        // 光球
        const g = ctx.createRadialGradient(-r * 0.28, -r * 0.26, r * 0.08, 0, 0, r);
        g.addColorStop(0, '#fffbe6');
        g.addColorStop(0.38, '#ffe694');
        g.addColorStop(0.72, '#ffc247');
        g.addColorStop(0.93, '#ff9f24');
        g.addColorStop(1, '#ff7c14');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.save();
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.995, 0, Math.PI * 2);
        ctx.clip();
        // 米粒组织
        for (let i = 0; i < 70; i++) {
            const a = hash(i * 7.3 + 61) * Math.PI * 2 + t * 0.03 * (i % 3 + 1);
            const d = hash(i * 5.1 + 62) * r * 0.94;
            const rr = r * (0.025 + hash(i * 3.7 + 63) * 0.045);
            const dark = hash(i * 9.1 + 64) > 0.5;
            ctx.fillStyle = dark ? 'rgba(255,150,40,0.16)' : 'rgba(255,248,205,0.18)';
            ctx.beginPath();
            ctx.ellipse(Math.cos(a) * d, Math.sin(a) * d, rr, rr * 0.8, a, 0, Math.PI * 2);
            ctx.fill();
        }
        // 太阳黑子（缓慢漂移）
        for (let i = 0; i < 5; i++) {
            const a = hash(i * 11.3 + 65) * Math.PI * 2 + t * 0.012 * (i % 2 ? 1 : -1);
            const d = hash(i * 13.7 + 66) * r * 0.66;
            const rr = r * (0.045 + hash(i * 17.1 + 67) * 0.055);
            const cx = Math.cos(a) * d, cy = Math.sin(a) * d;
            ctx.fillStyle = 'rgba(190,80,20,0.55)';
            ctx.beginPath();
            ctx.ellipse(cx, cy, rr, rr * 0.68, a, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(120,45,10,0.5)';
            ctx.beginPath();
            ctx.ellipse(cx, cy, rr * 0.55, rr * 0.36, a, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
        // 色球边缘
        ctx.strokeStyle = 'rgba(255,116,26,0.85)';
        ctx.lineWidth = Math.max(1.5, r * 0.05);
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.985, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }

    function drawOrbits(t) {
        ctx.save();

    // ==================== 场景：太阳系巡航 ====================
    let scene = 'title';
    let sceneT = 0;
    let pendingPlanet = null;
    function nearestPlanet() {
        let best = null, bd = 1e9;
        for (let i = 0; i < PLANETS.length; i++) {
            const p = PLANETS[i];
            const pp = planetPos(p);
            const d = dist(ship.x, ship.y, pp.x, pp.y);
            if (d < bd) { bd = d; best = p; }
        }
        return { planet: best, dist: bd };
    }
    function sceneSpaceUpdate(dt) {
        sceneT += dt;
        ship.t += dt;
        const mv = moveVector();
        ship.thrust = Math.min(1, ship.thrust + (mv.x || mv.y ? dt * 4 : -dt * 5));
        ship.thrust = clamp(ship.thrust, 0, 1);
        if (mv.x || mv.y) {
            ship.x += mv.x * SHIP_SPEED * dt;
            ship.y += mv.y * SHIP_SPEED * dt;
            const target = Math.atan2(mv.y, mv.x);
            ship.ang += angDiff(target, ship.ang) * Math.min(1, dt * 10);
        }
        ship.x = clamp(ship.x, 46, W - 46);
        ship.y = clamp(ship.y, 120, H - 60);
        const np = nearestPlanet();
        if (np.planet && np.dist < np.planet.r + 52) {
            if (actPress()) startLanding(np.planet.id);
        }
    }
    function sceneSpaceDraw() {

// ==================== 俯视游戏世界 ====================
    let world = null;
    let viewZoom = 1;      // 升空拉远镜头时 < 1，用于扩大可见范围

    // ---------- 升空镜头：从当前画面缓慢拉为远景 ----------
    const LAUNCH_ZOOM_END = 1.6;     // 拉远结束时刻
    const LAUNCH_ZOOM_MIN = 0.74;    // 远景缩放
    const LAUNCH_TRAVEL = 760;      // 火箭上升距离（缩放前的屏幕像素）
    const LAUNCH_DEPART = 0.26;     // 出画后淡出所需的额外上升进度比例
    function launchZoom(t) {
        if (t <= LAUNCH_BOARD) return 1;
        const k = clamp((t - LAUNCH_BOARD) / (LAUNCH_ZOOM_END - LAUNCH_BOARD), 0, 1);
        return lerp(1, LAUNCH_ZOOM_MIN, easeInOut(k));
    }
    function launchRise(t) {
        if (t <= LAUNCH_BOARD) return 0;
        return Math.pow(clamp((t - LAUNCH_BOARD) / (LAUNCH_RISE - LAUNCH_BOARD), 0, 1), 1.3);
    }
    // 火箭完全飞出画面后的转场进度（0~1）
    function launchDepart(t) {
        const z = launchZoom(t);
        const top = (PLAY_H / 2) / Math.max(0.05, z);   // 缩放后仍可见的顶部边界
        const d = launchRise(t) * LAUNCH_TRAVEL / top;
        return clamp((d - 1) / LAUNCH_DEPART, 0, 1);
    }
    // ---------- 着陆镜头：由远及近推回常规视角，与升空拉远对称 ----------
    function landingZoom(t) {
        if (t >= LAND_DESCENT) return 1;
        const k = clamp(t / LAND_DESCENT, 0, 1);
        return lerp(LAUNCH_ZOOM_MIN, 1, easeInOut(k));
    }
    // 着陆入场黑场的浓度（1=全黑，0=完全显现）
    const LAND_FADE = 0.6;
    function landingFadeIn(t) { return t >= LAND_FADE ? 0 : 1 - easeOutCubic(clamp(t / LAND_FADE, 0, 1)); }

    const DIRS = [
        { ix: 0, iy: 1 }, { ix: -0.7071, iy: 0.7071 }, { ix: -1, iy: 0 }, { ix: -0.7071, iy: -0.7071 },
        { ix: 0, iy: -1 }, { ix: 0.7071, iy: -0.7071 }, { ix: 1, iy: 0 }, { ix: 0.7071, iy: 0.7071 }
    ];
    const DIR_VIEW = [
        { face: 'front', sx: 1, tilt: 0 },     // 0 下
        { face: 'front', sx: 1, tilt: -0.14 }, // 1 左下
        { face: 'side', sx: -1, tilt: 0 },     // 2 左
        { face: 'back', sx: 1, tilt: 0.16 },   // 3 左上
        { face: 'back', sx: 1, tilt: 0 },      // 4 上
        { face: 'back', sx: 1, tilt: -0.16 },  // 5 右上
        { face: 'side', sx: 1, tilt: 0 },      // 6 右
        { face: 'front', sx: 1, tilt: 0.14 }   // 7 右下
    ];
    function dirFromVec(x, y) {
        // 注意：DIRS / DIR_VIEW 以 0=下、6=右 为基准，
        // 而 atan2(y,x)=0 表示正右，故需要 +6 修正这 90° 偏移
        const a = Math.atan2(y, x);
        let idx = Math.round(a / (Math.PI / 4));
        idx = (((idx + 6) % 8) + 8) % 8;
        return idx;
    }

    function newWorld(planetId) {
        const planet = PLANET_BY_ID[planetId];
        const startX = MAP_W * 0.5;

            planet: planet,
            t: 0,
            runTime: 0,
            cam: { x: startX, y: startY },
            player: {

                weapon: 'pistol',

    // ==================== 地形绘制 ====================
    function drawGround() {
        const p = world.planet;
        const cam = world.cam;
        const vz = viewZoom;
        const cx = W / 2, cy = PLAY_H / 2;
        // 缩放后实际可见的整幅画面（含状态栏区域）在 scrX/scrY 空间中的范围
        const hw = (W / 2) / vz + TILE;          // 左右半宽
        const hUp = cy / vz + TILE;              // 上半高
        const hDn = (H - cy) / vz + TILE;        // 下半高（画布比 PLAY_H 高）
        ctx.fillStyle = p.ground;
        ctx.fillRect(cx - hw, cy - hUp, hw * 2, hUp + hDn);
        const tx0 = Math.floor((cam.x - hw) / TILE) - 1;
        const tx1 = Math.ceil((cam.x + hw) / TILE) + 1;
        const ty0 = Math.floor((cam.y - hUp) / TILE) - 1;
        const ty1 = Math.ceil((cam.y + hDn) / TILE) + 1;
        for (let ty = ty0; ty <= ty1; ty++) {
            for (let tx = tx0; tx <= tx1; tx++) {
                const wx = wrapVal(tx * TILE, MAP_W);
                const wy = wrapVal(ty * TILE, MAP_H);
                const sx = wx - cam.x + W / 2;
                const sy = wy - cam.y + PLAY_H / 2;
                drawDecorTile(p, tx, ty, sx, sy, hash2(tx * 1.7, ty * 2.3), world.t);
            }
        }
    }
    function drawDecorTile(p, tx, ty, sx, sy, h, t) {
        const T = TILE;
        switch (p.decor) {
            case 'crater': {
                ctx.fillStyle = 'rgba(255,255,255,0.05)';
                ctx.fillRect(sx, sy, T, T);
                const n = 2;
                for (let i = 0; i < n; i++) {
                    const cx = sx + h * T + (hash2(tx * 3 + i, ty * 7) * (1 - h)) * T;
                    const cy = sy + hash2(tx * 11 + i, ty * 5) * T;
                    const r = 14 + hash2(tx + i * 2, ty - i) * 26;
                    ctx.fillStyle = 'rgba(0,0,0,0.16)';
                    ctx.beginPath();
                    ctx.ellipse(cx + 3, cy + 3, r, r * 0.72, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = shade(p.ground, 0.22);
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, r, r * 0.72, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(0,0,0,0.12)';
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, r * 0.62, r * 0.44, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                break;
            }
            case 'dune': {
                ctx.strokeStyle = 'rgba(255,235,180,0.16)';
                ctx.lineWidth = 3;
                for (let i = 0; i < 3; i++) {
                    const yy = sy + (0.25 + i * 0.28 + hash2(tx + i, ty) * 0.08) * T;
                    ctx.beginPath();
                    ctx.moveTo(sx, yy);
                    for (let k = 0; k <= 8; k++) {
                        ctx.lineTo(sx + k * T / 8, yy + Math.sin(k * 0.9 + tx + i) * 6);
                    }
                    ctx.stroke();
                }
                ctx.fillStyle = 'rgba(120,75,25,0.35)';
                for (let i = 0; i < 2; i++) {
                    const rx = sx + hash2(tx * 5 + i, ty * 9) * T;
                    const ry = sy + hash2(tx * 13 + i, ty * 3) * T;
                    const rr = 7 + hash2(tx * 2 + i, ty * 7) * 9;
                    ctx.beginPath();
                    ctx.ellipse(rx, ry, rr, rr * 0.7, hash2(tx, ty + i), 0, Math.PI * 2);
                    ctx.fill();
                }
                break;
            }
            case 'grass': {
                if (h > 0.62) {
                    const cx = sx + T * 0.5, cy = sy + T * 0.55;
                    const s = 0.85 + h * 0.5;
                    ctx.fillStyle = 'rgba(0,0,0,0.18)';
                    ctx.beginPath();
                    ctx.ellipse(cx + 6, cy + 4, 22 * s, 9 * s, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#6b4a2b';
                    ctx.fillRect(cx - 5 * s, cy - 26 * s, 10 * s, 28 * s);
                    ctx.fillStyle = '#2f6b32';
                    ctx.beginPath();
                    ctx.arc(cx, cy - 42 * s, 22 * s, 0, Math.PI * 2);
                    ctx.arc(cx - 15 * s, cy - 28 * s, 15 * s, 0, Math.PI * 2);
                    ctx.arc(cx + 15 * s, cy - 28 * s, 15 * s, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#438a3f';
                    ctx.beginPath();
                    ctx.arc(cx - 5 * s, cy - 47 * s, 12 * s, 0, Math.PI * 2);
                    ctx.fill();
                } else if (h < 0.22) {
                    ctx.strokeStyle = 'rgba(150,215,120,0.35)';
                    ctx.lineWidth = 2;
                    for (let i = 0; i < 7; i++) {
                        const gx = sx + hash2(tx * 17 + i, ty * 19) * T;
                        const gy = sy + hash2(tx * 23 + i, ty * 29) * T;
                        ctx.beginPath();
                        ctx.moveTo(gx, gy);
                        ctx.lineTo(gx + 4, gy - 9);
                        ctx.stroke();
                    }
                } else {
                    ctx.fillStyle = 'rgba(0,0,0,0.12)';
                    ctx.beginPath();
                    ctx.ellipse(sx + h * T, sy + (1 - h) * T, 12, 8, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                break;
            }
            case 'rock': {
                ctx.fillStyle = 'rgba(0,0,0,0.10)';
                ctx.fillRect(sx, sy, T, T);
                for (let i = 0; i < 3; i++) {
                    const rx = sx + hash2(tx * 3 + i * 5, ty * 7) * T;
                    const ry = sy + hash2(tx * 11 + i * 3, ty * 5) * T;
                    const rr = 9 + hash2(tx + i, ty * 2 + i) * 17;
                    ctx.fillStyle = 'rgba(0,0,0,0.2)';
                    ctx.beginPath();
                    ctx.ellipse(rx + 4, ry + 4, rr, rr * 0.6, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = h > 0.5 ? shade(p.ground, 0.18) : shade(p.ground2, -0.08);
                    ctx.beginPath();
                    ctx.moveTo(rx - rr, ry + rr * 0.5);
                    ctx.lineTo(rx - rr * 0.3, ry - rr * 0.7);
                    ctx.lineTo(rx + rr * 0.5, ry - rr * 0.5);
                    ctx.lineTo(rx + rr, ry + rr * 0.45);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.10)';
                    ctx.beginPath();
                    ctx.moveTo(rx - rr * 0.3, ry - rr * 0.7);
                    ctx.lineTo(rx + rr * 0.5, ry - rr * 0.5);
                    ctx.lineTo(rx + rr * 0.1, ry - rr * 0.1);
                    ctx.closePath();
                    ctx.fill();
                }
                break;
            }
            case 'bands': {
                const bands = 5;
                for (let i = 0; i < bands; i++) {
                    const yy = sy + (i / bands) * T;
                    ctx.fillStyle = i % 2 ? 'rgba(255,255,255,0.045)' : 'rgba(0,0,0,0.05)';
                    const wob = Math.sin(t * 0.5 + i + tx * 0.6) * 5;
                    ctx.beginPath();
                    ctx.moveTo(sx, yy);
                    for (let k = 0; k <= 8; k++) ctx.lineTo(sx + k * T / 8, yy + Math.sin(k * 0.8 + tx * 0.5 + t * 0.4) * 4 + wob);
                    ctx.lineTo(sx + T, yy + T / bands);
                    for (let k = 8; k >= 0; k--) ctx.lineTo(sx + k * T / 8, yy + T / bands + Math.sin(k * 0.8 + tx * 0.5 + t * 0.4) * 4 + wob);
                    ctx.closePath();
                    ctx.fill();
                }
                if (h > 0.78) {
                    ctx.fillStyle = 'rgba(255,255,255,0.09)';
                    ctx.beginPath();
                    ctx.ellipse(sx + T * 0.5, sy + T * 0.5, 30, 18, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(0,0,0,0.08)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.ellipse(sx + T * 0.5, sy + T * 0.5, 30, 18, 0, 0, Math.PI * 2);
                    ctx.stroke();
                }
                break;
            }
            case 'crystal': {
                ctx.fillStyle = 'rgba(255,255,255,0.07)';
                ctx.fillRect(sx, sy, T, T);
                for (let i = 0; i < 3; i++) {
                    const cx = sx + hash2(tx * 7 + i * 3, ty * 11) * T;
                    const cy = sy + hash2(tx * 13 + i, ty * 17) * T;
                    const s = 10 + hash2(tx * 5 + i, ty * 3) * 20;
                    const rot = hash2(tx + i, ty - i) * Math.PI;
                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.rotate(rot);
                    ctx.fillStyle = 'rgba(0,0,0,0.15)';
                    ctx.beginPath();
                    ctx.moveTo(-s * 0.6, s * 0.4); ctx.lineTo(s * 0.6, s * 0.4); ctx.lineTo(s * 0.8, s * 0.6); ctx.lineTo(-s * 0.8, s * 0.6);
                    ctx.closePath(); ctx.fill();
                    const g = ctx.createLinearGradient(0, -s, 0, s * 0.5);
                    g.addColorStop(0, 'rgba(255,255,255,0.75)');
                    g.addColorStop(1, 'rgba(140,225,235,0.45)');
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.moveTo(0, -s);
                    ctx.lineTo(s * 0.6, 0);
                    ctx.lineTo(0, s * 0.42);
                    ctx.lineTo(-s * 0.6, 0);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                }
                break;
            }
            case 'geyser': {
                ctx.fillStyle = 'rgba(0,0,0,0.12)';
                ctx.fillRect(sx, sy, T, T);
                for (let i = 0; i < 2; i++) {
                    const cx = sx + hash2(tx * 9 + i * 7, ty * 5) * T;
                    const cy = sy + hash2(tx * 3 + i, ty * 19) * T;
                    const rr = 13 + hash2(tx + i, ty + i) * 14;
                    const pulse = 0.5 + 0.5 * Math.sin(t * 1.6 + tx + i);
                    ctx.fillStyle = 'rgba(10,25,70,0.45)';
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, rr, rr * 0.6, 0, 0, Math.PI * 2);
                    ctx.fill();
                    const g = ctx.createRadialGradient(cx, cy, 2, cx, cy, rr * 1.6);
                    g.addColorStop(0, 'rgba(150,215,255,' + (0.20 + 0.25 * pulse) + ')');
                    g.addColorStop(1, 'rgba(150,215,255,0)');
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, rr * 1.6, rr, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                break;
            }
            case 'heart': {
                ctx.fillStyle = 'rgba(255,255,255,0.05)';
                ctx.fillRect(sx, sy, T, T);
                if (h > 0.45) {
                    const cx = sx + T * 0.5, cy = sy + T * 0.5, s = 34 + h * 16;
                    ctx.fillStyle = 'rgba(255,246,235,0.55)';
                    ctx.beginPath();
                    ctx.moveTo(cx, cy + s * 0.5);
                    ctx.bezierCurveTo(cx - s * 0.6, cy - s * 0.2, cx - s * 0.2, cy - s * 0.55, cx, cy - s * 0.2);
                    ctx.bezierCurveTo(cx + s * 0.2, cy - s * 0.55, cx + s * 0.6, cy - s * 0.2, cx, cy + s * 0.5);
                    ctx.fill();
                }
                ctx.fillStyle = 'rgba(0,0,0,0.14)';
                for (let i = 0; i < 2; i++) {
                    const rx = sx + hash2(tx * 5 + i * 3, ty * 9) * T;
                    const ry = sy + hash2(tx * 15 + i, ty * 3) * T;
                    ctx.beginPath();
                    ctx.ellipse(rx, ry, 10 + hash2(tx + i, ty) * 12, 7, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                break;
            }
        }
    }

    function drawVignette() {
        const g = ctx.createRadialGradient(W / 2, PLAY_H / 2, PLAY_H * 0.42, W / 2, PLAY_H / 2, PLAY_H * 0.95);
        g.addColorStop(0, 'rgba(0,0,0,0)');
        g.addColorStop(1, 'rgba(0,0,0,0.38)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, PLAY_H);
    }

    // ==================== 主角绘制（八方向） ====================
    function drawAstronaut(px, py, dirIdx, phase, moving, opts) {
        opts = opts || {};
        const view = DIR_VIEW[dirIdx];
        const roll = opts.roll || 0;
        const flip = view.sx < 0 ? -1 : 1;
        const sw = moving ? Math.sin(phase) : 0;
        const sw2 = moving ? Math.sin(phase + Math.PI) : 0;
        const bob = moving ? Math.abs(Math.sin(phase)) * 2.2 : Math.sin(opts.t * 2.2) * 0.8;

        ctx.save();
        ctx.translate(px, py);

        // 影子
        ctx.save();
        ctx.globalAlpha = 0.28 - roll * 0.1;
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.ellipse(3, 2 - roll * 6, 15 - roll * 3, 5.5 - roll, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (roll > 0) {
            ctx.rotate(opts.rollAngle);
            ctx.scale(0.92, 0.92);
        }
        const bodyY = -bob - roll * 4;

        // 腿部姿势
        let fL, fR, legLift = 0;
        switch (dirIdx) {
            case 0: // 向下
                fL = { x: -7 - sw * 8, y: -Math.max(0, sw) * 7 };
                fR = { x: 7 + sw * 8, y: -Math.max(0, sw2) * 7 };
                break;
            case 4: // 向上
                fL = { x: -6 + sw * 5, y: -Math.max(0, sw) * 5 };
                fR = { x: 6 + sw * 5, y: -Math.max(0, sw2) * 5 };
                legLift = 2;
                break;
            case 2: case 6: { // 左右
                const s = dirIdx === 6 ? 1 : -1;
                fL = { x: s * (-4 + sw * 12), y: -Math.max(0, sw) * 8 };
                fR = { x: s * (-4 + sw2 * 12), y: -Math.max(0, sw2) * 8 };
                break;
            }
            case 1: case 7: { // 左下 / 右下
                const s = dirIdx === 7 ? 1 : -1;
                fL = { x: -6 * s + sw * 9 * s, y: -Math.max(0, sw) * 8 };
                fR = { x: 6 * s + sw * 9 * s, y: -Math.max(0, sw2) * 8 };
                break;
            }
            default: { // 3 / 5 上斜
                const s = dirIdx === 5 ? 1 : -1;
                fL = { x: -6 * s + sw * 6 * s, y: -Math.max(0, sw) * 5 };
                fR = { x: 6 * s + sw * 6 * s, y: -Math.max(0, sw2) * 5 };
                legLift = 2;
                break;
            }
        }
        if (roll > 0) {
            fL = { x: -5, y: -5 };
            fR = { x: 6, y: -6 };
        }

        ctx.save();
        ctx.scale(flip, 1);
        ctx.rotate(view.tilt * 0.5);

        const suit = '#e9eef6', suitDark = '#b9c3d4', suitLine = '#8e99ad';
        const bootC = '#e0563f';

        // 腿
        for (let i = 0; i < 2; i++) {
            const f = i === 0 ? fL : fR;
            const hx = i === 0 ? -5 : 5;
            const hy = bodyY - 24;
            const kx = (hx + f.x) / 2, ky = (hy + f.y) / 2 - 2;
            ctx.strokeStyle = suit;
            ctx.lineWidth = 9;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(hx, hy);
            ctx.lineTo(kx, ky);
            ctx.lineTo(f.x, f.y - 3);
            ctx.stroke();
            ctx.strokeStyle = suitLine;
            ctx.lineWidth = 9;
            ctx.globalAlpha = 0.35;
            ctx.beginPath();
            ctx.moveTo(hx, hy + 3);
            ctx.lineTo(kx, ky + 3);
            ctx.stroke();
            ctx.globalAlpha = 1;
            ctx.fillStyle = bootC;
            ctx.beginPath();
            ctx.ellipse(f.x + (roll > 0 ? 0 : 1), f.y, 7, 4.4, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        // 背包（背面视角）
        if (view.face === 'back') {
            ctx.fillStyle = '#9aa6ba';
            roundRectPath(-13, bodyY - 44 + legLift, 26, 22, 7);
            ctx.fill();
            ctx.fillStyle = '#7d8a9e';
            ctx.fillRect(-8, bodyY - 40 + legLift, 16, 4);
            ctx.fillStyle = '#6fd3ff';
            ctx.beginPath();
            ctx.arc(-6, bodyY - 22 + legLift, 2.6, 0, Math.PI * 2);
            ctx.arc(6, bodyY - 22 + legLift, 2.6, 0, Math.PI * 2);
            ctx.fill();
        }

        // 躯干
        ctx.fillStyle = suit;
        roundRectPath(-13, bodyY - 46 + legLift, 26, 25, 9);
        ctx.fill();
        ctx.fillStyle = 'rgba(140,155,180,0.55)';
        roundRectPath(-13, bodyY - 30 + legLift, 26, 7, 4);
        ctx.fill();
        ctx.fillStyle = '#5b8def';
        roundRectPath(-5, bodyY - 38 + legLift, 10, 8, 3);
        ctx.fill();
        if (view.face !== 'back') {
            ctx.fillStyle = '#3a4a63';
            roundRectPath(-13, bodyY - 34 + legLift, 26, 5, 2.5);
            ctx.fill();
        }

        // 手臂 + 枪
        const gunUp = view.face === 'back';
        let armA, armB;
        if (moving) {
            armA = { x: 11 + sw * 6, y: bodyY - 26 + Math.abs(sw) * 3 };
            armB = { x: 11 - sw * 4, y: bodyY - 30 + Math.abs(sw2) * 2 };
        } else {
            armA = { x: 11, y: bodyY - 25 };
            armB = { x: 9, y: bodyY - 30 };
        }
        if (view.face === 'back') { armA = { x: 10, y: bodyY - 26 }; armB = { x: 8, y: bodyY - 30 }; }
        const drawArm = (a, w) => {
            ctx.strokeStyle = suit;
            ctx.lineWidth = w;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(9, bodyY - 42 + legLift);
            ctx.lineTo((9 + a.x) / 2 + 4, (bodyY - 34 + a.y) / 2 + 3);
            ctx.lineTo(a.x, a.y);
            ctx.stroke();
            ctx.fillStyle = '#8e99ad';
            ctx.beginPath();
            ctx.arc(a.x, a.y, w * 0.62, 0, Math.PI * 2);
            ctx.fill();
        };
        if (gunUp) { drawArm(armB, 7); drawArm(armA, 7); } else { drawArm(armA, 7); drawArm(armB, 7); }

        // 枪
        const gx = (armA.x + armB.x) / 2 + 4;
        const gy = (armA.y + armB.y) / 2 + (view.face === 'front' ? 6 : -2);
        ctx.save();
        ctx.translate(gx, gy);
        if (view.face === 'front') ctx.rotate(0.5);
        else if (view.face === 'back') ctx.rotate(-2.6);
        ctx.fillStyle = '#43506b';
        roundRectPath(-3, -4, 22, 8, 3);
        ctx.fill();
        ctx.fillStyle = '#6f7f9c';
        roundRectPath(13, -2.6, 10, 5.2, 2);
        ctx.fill();
        ctx.fillStyle = opts.rocket ? '#ff9a3d' : '#7fe8ff';
        ctx.beginPath();
        ctx.arc(20, 0, 2.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // 头盔
        ctx.save();
        ctx.translate(0, bodyY - 54 + legLift);
        ctx.fillStyle = suit;
        ctx.beginPath();
        ctx.arc(0, 0, 13, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#c3ccdb';
        ctx.beginPath();
        ctx.arc(0, 3, 12, 0, Math.PI * 2);
        ctx.fill();
        if (view.face === 'front') {
            ctx.fillStyle = '#2c3a52';
            ctx.beginPath();
            ctx.ellipse(1.5, -1.5, 8.5, 7, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(120,220,255,0.45)';
            ctx.beginPath();
            ctx.ellipse(4, -4, 3.4, 2.4, -0.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-1.5, -1, 1.7, 0, Math.PI * 2);
            ctx.arc(4.5, -1, 1.7, 0, Math.PI * 2);
            ctx.fill();
        } else if (view.face === 'side') {
            ctx.fillStyle = '#2c3a52';
            ctx.beginPath();
            ctx.ellipse(7, -1, 4.4, 7.4, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(120,220,255,0.5)';
            ctx.beginPath();
            ctx.ellipse(8, -4, 2, 3, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffd166';
            ctx.beginPath();
            ctx.arc(-7, -8, 2.4, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.fillStyle = '#b8c2d2';
            ctx.beginPath();
            ctx.ellipse(0, 1, 10, 9, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#9aa6ba';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, 7, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = '#ff6b6b';
            ctx.beginPath();

    // 人物身形中心的世界纵坐标：与 drawRangeRings 画在屏幕上的圆心完全一致

    // ==================== 范围圈 / 能力面板 ====================
    function playerStats() {

        return {
            dmg: p.dmg,
            rate: p.rate,
            bullets: p.bullets,

            speed: Math.round(BASE_SPEED * p.speedMul * world.slowFactor),
            pickup: Math.round(PICKUP_BASE * p.pickupMul),
            fireRange: Math.round(FIRE_RANGE * (isRocket ? 1.15 : 1))
        };

    function drawRangeRings(cx, cy, t) {
        const st = playerStats();

        // 射击范围：极淡红色虚线圈

        ctx.setLineDash([8, 12]);
        ctx.lineDashOffset = -t * 14;
        ctx.beginPath();
        ctx.arc(cx, cy, st.fireRange, 0, Math.PI * 2);
        ctx.stroke();
        // 拾取范围：同款线段风格，极淡绿色
        ctx.setLineDash([5, 9]);
        ctx.lineDashOffset = t * 9;
        ctx.strokeStyle = 'rgba(120,240,170,0.15)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(cx, cy, st.pickup, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

    // 新增：能力数据面板 + 已选道具图标
