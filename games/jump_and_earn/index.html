<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>跳跃得分</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            background: #0b1a2f;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            padding: 6px;
        }
        .game-container {
            background: #1e2f4a;
            padding: 10px;
            border-radius: 20px;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
            max-height: 100%;
            transition: border-radius 0.2s;
        }
        .canvas-wrap {
            position: relative;
            width: 100%;
            max-width: 1280px;
            line-height: 0;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1280 / 720;
            border-radius: 14px;
            box-shadow: inset 0 0 20px #00000055, 0 6px 12px black;
            touch-action: none;
        }
        .fullscreen-btn {
            position: absolute;
            top: 6px; right: 6px;
            width: 30px; height: 30px;
            min-width: 30px; min-height: 30px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.45);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            transition: background 0.15s, color 0.15s, transform 0.1s;
            z-index: 10; padding: 0; outline: none;
        }
        .fullscreen-btn:hover { background: rgba(255, 255, 255, 0.18); color: rgba(255, 255, 255, 0.8); }
        .fullscreen-btn:active { background: rgba(255, 255, 255, 0.28); color: #ffffff; transform: scale(0.92); }
        .fullscreen-btn svg { width: 15px; height: 15px; display: block; pointer-events: none; }
        @media (max-width: 720px) {
            .fullscreen-btn { width: 26px; height: 26px; top: 5px; right: 5px; border-radius: 7px; }
            .fullscreen-btn svg { width: 13px; height: 13px; }
        }
        .game-container.is-fullscreen {
            width: 100vw; height: 100vh;
            max-width: none; max-height: none;
            border-radius: 0; padding: 0; background: #000;
            justify-content: center; align-items: center;
        }
        .game-container.is-fullscreen .canvas-wrap {
            width: 100%; height: 100%; max-width: none;
            display: flex; align-items: center; justify-content: center;
        }
        .game-container.is-fullscreen canvas {
            width: auto !important;
            height: auto !important;
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 1280 / 720;
            border-radius: 0; box-shadow: none;
        }
        .game-container.is-fullscreen .fullscreen-btn {
            top: 8px; right: 8px;
            background: rgba(255, 255, 255, 0.10);
            color: rgba(255, 255, 255, 0.55);
            z-index: 30;
        }
    </style>
</head>
<body>
<div class="game-container" id="gameContainer">
    <div class="canvas-wrap" id="canvasWrap">
        <canvas id="gameCanvas" width="1280" height="720"></canvas>
        <button class="fullscreen-btn" id="fullscreenBtn" aria-label="全屏" title="全屏">
            <svg id="fsIconExpand" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 9V4h5"/><path d="M20 9V4h-5"/>
                <path d="M4 15v5h5"/><path d="M20 15v5h-5"/>
            </svg>
            <svg id="fsIconCompress" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
                 style="display:none;">
                <path d="M9 4v5H4"/><path d="M15 4v5h5"/>
                <path d="M9 20v-5H4"/><path d="M15 20v-5h5"/>
            </svg>
        </button>
    </div>
</div>
<script>
(function() {
    'use strict';

    const VERSION = '20261008';

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('gameContainer');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const fsIconExpand = document.getElementById('fsIconExpand');
    const fsIconCompress = document.getElementById('fsIconCompress');

    // ==================== 常量 ====================
    const W = 1280, H = 720;
    const HUD_H = 56;
    const PLAY_H = H - HUD_H;
    const FPS_BASE = 60;

    const PLAYER_W = 56;
    const PLAYER_H = 110;
    const PX_PER_M = PLAYER_H / 2;
    const GROUND_H = 90;
    const GRAVITY = 3200;
    const WALK_SPEED = 260;

    const TABLE_COUNT = 6;

    const touchStates = new Map();

    // ==================== 工具 ====================
    function roundRectPath(x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }

    function nextPrice(p) {
        const k = Math.pow(10, Math.floor(Math.log10(p)));
        const m = p / k;
        if (m === 1) return 2 * p;
        if (m === 2) return p * 2.5;
        return p * 2;
    }

    // ==================== 全屏控制 ====================
    const fullscreenApi = {
        request: () => {
            const el = document.documentElement;
            if (el.requestFullscreen) return el.requestFullscreen();
            if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
            if (el.msRequestFullscreen) return el.msRequestFullscreen();
        },
        exit: () => {
            if (document.exitFullscreen) return document.exitFullscreen();
            if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
            if (document.msExitFullscreen) return document.msExitFullscreen();
        },
        isFullscreen: () => !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement)
    };

    function updateFullscreenButton() {
        const fs = fullscreenApi.isFullscreen();
        if (fs) {
            fsIconExpand.style.display = 'none';
            fsIconCompress.style.display = 'block';
            fullscreenBtn.setAttribute('aria-label', '退出全屏');
            fullscreenBtn.setAttribute('title', '退出全屏');
        } else {
            fsIconExpand.style.display = 'block';
            fsIconCompress.style.display = 'none';
            fullscreenBtn.setAttribute('aria-label', '全屏');
            fullscreenBtn.setAttribute('title', '全屏');
        }
    }

    function toggleFullscreen() {
        if (fullscreenApi.isFullscreen()) fullscreenApi.exit();
        else fullscreenApi.request();
    }

    fullscreenBtn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); toggleFullscreen(); });
    fullscreenBtn.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
    fullscreenBtn.addEventListener('touchend', (e) => e.stopPropagation(), { passive: true });

    function onFullscreenChange() {
        const fs = fullscreenApi.isFullscreen();
        container.classList.toggle('is-fullscreen', fs);
        updateFullscreenButton();
        setTimeout(scheduleResize, 60);
        setTimeout(scheduleResize, 200);
        setTimeout(scheduleResize, 500);
    }
    document.addEventListener('fullscreenchange', onFullscreenChange);
    document.addEventListener('webkitfullscreenchange', onFullscreenChange);
    document.addEventListener('msfullscreenchange', onFullscreenChange);

    // ==================== 画布适配 ====================
    let cachedPadX = 0;

    function refreshCachedPad() {
        const cs = getComputedStyle(container);
        const containerPadX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
        const bs = getComputedStyle(document.body);
        const bodyPadX = (parseFloat(bs.paddingLeft) || 0) + (parseFloat(bs.paddingRight) || 0);
        cachedPadX = containerPadX + bodyPadX;
    }

    function applyCanvasTransform() {
        ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    }

    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        let availWidth, availHeight;
        if (fullscreenApi.isFullscreen()) {
            availWidth = window.innerWidth;
            availHeight = window.innerHeight;
        } else {
            availWidth = window.innerWidth - cachedPadX;
            availHeight = window.innerHeight - cachedPadX;
        }
        const availWidthFromHeight = availHeight * (W / H);
        let cssW = Math.min(availWidth, availWidthFromHeight);
        if (!fullscreenApi.isFullscreen()) cssW = Math.min(cssW, 1280);
        if (!isFinite(cssW) || cssW < 100) cssW = Math.max(100, Math.min(availWidth, 1280));
        const cssH = cssW * (H / W);
        canvas.style.width = cssW + 'px';
        canvas.style.height = cssH + 'px';
        canvas.width = Math.round(cssW * dpr);
        canvas.height = Math.round(cssH * dpr);
        applyCanvasTransform();
    }

    let resizeScheduled = false;
    function scheduleResize() {
        if (resizeScheduled) return;
        resizeScheduled = true;
        requestAnimationFrame(() => { resizeScheduled = false; resizeCanvas(); });
    }
    window.addEventListener('resize', scheduleResize);
    window.addEventListener('orientationchange', () => { setTimeout(scheduleResize, 120); setTimeout(scheduleResize, 350); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleResize);

    // ==================== 游戏状态 ====================
    let money = 0;
    let jumpAbility = 2;
    let bestHeight = 0;
    let camY = 0;
    let prices = [];
    let tables = [];
    let popups = [];
    let pets = [];
    let petTime = 0;
    let walkPhase = 0;
    let facing = 1;

    const player = {
        x: W / 2, y: 0,
        vy: 0, airborne: false, peak: 0, squash: 0
    };

    const keys = { ArrowLeft: false, ArrowRight: false, Space: false };

    // ==================== 手柄 ====================
    let gamepadConnected = false;
    let gamepadIndex = -1;
    let gamepadLeft = false, gamepadRight = false, gamepadA = false, gamepadB = false;
    let prevA = false, prevB = false, prevStart = false;

    // ==================== 桌子/价格 ====================
    function initTables() {
        tables = [];
        for (let i = 0; i < TABLE_COUNT; i++) {
            tables.push({ x: 150 + i * (W - 300) / (TABLE_COUNT - 1) });
        }
        prices = [];
        let p = 10;
        for (let i = 0; i < TABLE_COUNT; i++) { prices.push(p); p = nextPrice(p); }
    }

    function refreshTables(lastBought) {
        prices = [];
        let p = nextPrice(lastBought);
        for (let i = 0; i < TABLE_COUNT; i++) { prices.push(p); p = nextPrice(p); }
    }

    function nearestTableIndex() {
        let best = -1, bd = Infinity;
        for (let i = 0; i < tables.length; i++) {
            const d = Math.abs(player.x - tables[i].x);
            if (d < bd) { bd = d; best = i; }
        }
        return bd < 70 ? best : -1;
    }

    // ==================== 输入 ====================
    window.addEventListener('keydown', (e) => {
        const key = e.key;
        if (key === 'ArrowLeft' || key === 'ArrowRight' || key === ' ') e.preventDefault();
        if (key === 'ArrowLeft') keys.ArrowLeft = true;
        else if (key === 'ArrowRight') keys.ArrowRight = true;
        else if (key === ' ') { if (!keys.Space) tryJump(); keys.Space = true; }
        else if (key === 'b' || key === 'B') tryBuy();
    });

    window.addEventListener('keyup', (e) => {
        const key = e.key;
        if (key === 'ArrowLeft') keys.ArrowLeft = false;
        else if (key === 'ArrowRight') keys.ArrowRight = false;
        else if (key === ' ') keys.Space = false;
        if (key === 'ArrowLeft' || key === 'ArrowRight' || key === ' ') e.preventDefault();
    });

    function touchActionFromPoint(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) return null;
        const lx = (clientX - rect.left) * (W / rect.width);
        const ly = (clientY - rect.top) * (H / rect.height);
        if (lx < 0 || lx >= W || ly < 0 || ly >= H) return null;
        const left = lx < W / 2;
        const top = ly < H / 2;
        if (left && top) return 'jump';
        if (left && !top) return 'left';
        if (!left && top) return 'buy';
        return 'right';
    }

    let touchLeft = false, touchRight = false;
    function refreshTouchFlags() {
        touchLeft = false; touchRight = false;
        for (const s of touchStates.values()) {
            if (s.action === 'left') touchLeft = true;
            else if (s.action === 'right') touchRight = true;
        }
    }

    canvas.addEventListener('touchstart', (e) => {
        let consumed = false;
        for (let i = 0; i < e.changedTouches.length; i++) {
            const t = e.changedTouches[i];
            const a = touchActionFromPoint(t.clientX, t.clientY);
            if (!a) continue;
            consumed = true;
            touchStates.set(t.identifier, { action: a });
            if (a === 'jump') tryJump();
            else if (a === 'buy') tryBuy();
        }
        if (consumed) { e.preventDefault(); refreshTouchFlags(); }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
        let changed = false;
        for (let i = 0; i < e.changedTouches.length; i++) {
            const t = e.changedTouches[i];
            if (!touchStates.has(t.identifier)) continue;
            const a = touchActionFromPoint(t.clientX, t.clientY);
            if (!a) continue;
            const prev = touchStates.get(t.identifier);
            if (prev.action !== a) { prev.action = a; changed = true; }
        }
        if (changed) { e.preventDefault(); refreshTouchFlags(); }
    }, { passive: false });

    function onTouchEnd(e) {
        let changed = false;
        for (let i = 0; i < e.changedTouches.length; i++) {
            const t = e.changedTouches[i];
            if (touchStates.has(t.identifier)) { touchStates.delete(t.identifier); changed = true; }
        }
        if (changed) { e.preventDefault(); refreshTouchFlags(); }
    }
    canvas.addEventListener('touchend', onTouchEnd, { passive: false });
    canvas.addEventListener('touchcancel', onTouchEnd, { passive: false });

    window.addEventListener('blur', () => {
        keys.ArrowLeft = false; keys.ArrowRight = false; keys.Space = false;
        touchStates.clear(); touchLeft = false; touchRight = false;
    });

    // ==================== 游戏逻辑 ====================
    function tryJump() {
        if (player.airborne) return;
        player.airborne = true;
        player.squash = 0;
        const peakPx = jumpAbility * PX_PER_M;
        player.vy = -Math.sqrt(2 * GRAVITY * peakPx);
        player.peak = 0;
    }

    function tryBuy() {
        const idx = nearestTableIndex();
        if (idx < 0) return;
        const cost = prices[idx];
        if (money < cost) {
            popups.push({ x: player.x, y: player.y, text: '钱不够!', life: 1.0, color: '#ff6b6b' });
            return;
        }
        money -= cost;
        jumpAbility += cost / 10;
        popups.push({ x: player.x, y: player.y, text: '+' + (cost / 10) + 'm 能力!', life: 1.4, color: '#9bf6b0' });
        pets.push(makePet(pets.length));
        refreshTables(cost);
    }

    function restart() {
        money = 0;
        jumpAbility = 2;
        bestHeight = 0;
        camY = 0;
        popups = [];
        pets = [];
        initTables();
        player.x = W / 2; player.y = 0; player.vy = 0;
        player.airborne = false; player.peak = 0; player.squash = 0;
    }

    function pollGamepad() {
        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        let gp = null;
        for (let i = 0; i < gamepads.length; i++) {
            if (gamepads[i] && gamepads[i].connected) { gp = gamepads[i]; gamepadIndex = i; break; }
        }
        if (gp && !gamepadConnected) gamepadConnected = true;
        else if (!gp && gamepadConnected) {
            gamepadConnected = false;
            gamepadLeft = gamepadRight = gamepadA = gamepadB = false;
            prevA = prevB = prevStart = false;
        }
        if (!gp) { gamepadLeft = gamepadRight = gamepadA = gamepadB = false; return; }
        const b = gp.buttons;
        gamepadLeft = !!(b[14] && (b[14].pressed || b[14].value > 0.5));
        gamepadRight = !!(b[15] && (b[15].pressed || b[15].value > 0.5));
        if (gp.axes && gp.axes.length > 0) {
            if (gp.axes[0] < -0.5) gamepadLeft = true;
            if (gp.axes[0] > 0.5) gamepadRight = true;
        }
        const aPressed = !!(b[0] && (b[0].pressed || b[0].value > 0.5));
        if (aPressed && !prevA) tryJump();
        prevA = aPressed;
        const bPressed = !!(b[1] && (b[1].pressed || b[1].value > 0.5));
        if (bPressed && !prevB) tryBuy();
        prevB = bPressed;
        const startPressed = !!(b[9] && (b[9].pressed || b[9].value > 0.5));
        if (startPressed && !prevStart) restart();
        prevStart = startPressed;
    }

    function update(dt) {
        const left = keys.ArrowLeft || gamepadLeft || touchLeft;
        const right = keys.ArrowRight || gamepadRight || touchRight;
        if (left && !right) { player.x -= WALK_SPEED * dt; facing = -1; walkPhase += dt * 10; }
        else if (right && !left) { player.x += WALK_SPEED * dt; facing = 1; walkPhase += dt * 10; }
        if (player.x < 30) player.x = 30;
        if (player.x > W - 30) player.x = W - 30;

        if (player.airborne) {
            player.vy += GRAVITY * dt;
            player.y += -player.vy * dt;
            if (player.y > player.peak) player.peak = player.y;
            if (player.y <= 0) {
                player.y = 0;
                player.airborne = false;
                player.squash = 1;
                const meters = Math.max(0, Math.round(player.peak / PX_PER_M));
                if (meters > 0) {
                    money += meters;
                    popups.push({ x: player.x, y: 0, text: '+' + meters + ' 元', life: 1.2, color: '#ffd966' });
                    if (meters > bestHeight) bestHeight = meters;
                }
                player.peak = 0;
            }
        } else {
            player.y = 0;
            if (player.squash > 0) player.squash -= dt * 4;
        }

        const target = Math.max(0, player.y - PLAY_H * 0.45);
        camY += (target - camY) * Math.min(1, dt * 8);

        petTime += dt;
        updatePets(dt);

        for (let i = popups.length - 1; i >= 0; i--) {
            popups[i].life -= dt;
            if (popups[i].life <= 0) popups.splice(i, 1);
        }
    }

    // ==================== 绘制 ====================
    let skyGrad = null, hudBgGrad = null;
    function rebuildGradients() {
        skyGrad = ctx.createLinearGradient(0, 0, 0, PLAY_H);
        skyGrad.addColorStop(0, '#8fc7e8');
        skyGrad.addColorStop(1, '#d4eef9');
        hudBgGrad = ctx.createLinearGradient(0, PLAY_H, 0, H);
        hudBgGrad.addColorStop(0, 'rgba(13, 27, 42, 0.96)');
        hudBgGrad.addColorStop(1, 'rgba(6, 15, 26, 0.98)');
    }

    function worldToScreenY(altitudePx) {
        return PLAY_H - GROUND_H - altitudePx + camY;
    }

    function drawRuler() {
        ctx.save();
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        for (let m = 0; ; m++) {
            const y = worldToScreenY(m * PX_PER_M);
            if (y < -40) break;
            if (y > PLAY_H + 40) continue;
            const major = m % 5 === 0;
            ctx.strokeStyle = major ? 'rgba(90, 130, 160, 0.5)' : 'rgba(90, 130, 160, 0.22)';
            ctx.lineWidth = major ? 2.5 : 1.2;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(W, y);
            ctx.stroke();
            ctx.fillStyle = major ? 'rgba(60, 90, 120, 0.9)' : 'rgba(60, 90, 120, 0.55)';
            ctx.font = (major ? 'bold 20px' : '16px') + ' "Courier New", monospace';
            ctx.fillText(m + 'm', 14, y - 12);
        }
        ctx.restore();
    }

    function drawTables() {
        const groundScreenY = worldToScreenY(0);
        if (groundScreenY > PLAY_H + 200) return;
        for (let i = 0; i < tables.length; i++) {
            const tx = tables[i].x;
            const tableW = 90, tableH = 60;
            const topY = groundScreenY - tableH;

            ctx.fillStyle = '#8b5a2b';
            roundRectPath(tx - tableW / 2, topY, tableW, 14, 6);
            ctx.fill();
            ctx.fillStyle = '#6b4423';
            ctx.fillRect(tx - tableW / 2 + 8, topY + 14, 10, tableH - 14);
            ctx.fillRect(tx + tableW / 2 - 18, topY + 14, 10, tableH - 14);

            const bx = tx, by = topY - 26;
            ctx.fillStyle = '#e67e22';
            ctx.shadowColor = '#f39c12';
            ctx.shadowBlur = 10;
            roundRectPath(bx - 16, by, 32, 26, 4);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffd966';
            ctx.fillRect(bx - 3, by, 6, 26);
            ctx.fillRect(bx - 16, by + 10, 32, 5);

            ctx.font = 'bold 17px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const label = prices[i] + '元';
            const lw = ctx.measureText(label).width + 16;
            ctx.fillStyle = 'rgba(13, 27, 42, 0.85)';
            roundRectPath(bx - lw / 2, topY + 20, lw, 24, 12);
            ctx.fill();
            ctx.fillStyle = money >= prices[i] ? '#9bf6b0' : '#ff9b9b';
            ctx.fillText(label, bx, topY + 32);
        }
    }

    function drawLimb(x1, y1, x2, y2, x3, y3, w, color) {
        ctx.strokeStyle = color;
        ctx.lineWidth = w;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineTo(x3, y3);
        ctx.stroke();
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x2, y2, w * 0.55, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawPlayer() {
        const groundY = worldToScreenY(player.y);
        const cx = player.x;
        const squash = player.airborne ? 0 : Math.max(0, player.squash);
        const stretch = player.airborne ? Math.min(0.25, Math.abs(player.vy) / 4000 + 0.08) : 0;
        const hScale = 1 + stretch - squash * 0.35;
        const wScale = 1 - stretch * 0.6 + squash * 0.4;
        const h = PLAYER_H * hScale;
        const w = PLAYER_W * wScale;
        const feetY = groundY;
        const hipY = feetY - h * 0.42;
        const shoulderY = feetY - h * 0.70;
        const headR = h * 0.15;
        const headY = feetY - h + headR + 2;

        const moving = !player.airborne && (keys.ArrowLeft || keys.ArrowRight || gamepadLeft || gamepadRight || touchLeft || touchRight);

        ctx.save();
        ctx.lineCap = 'round';

        let footL = { x: cx - 11, y: feetY }, footR = { x: cx + 11, y: feetY };
        if (moving) {
            footL = { x: cx - Math.sin(walkPhase) * 18, y: feetY - Math.max(0, Math.sin(walkPhase + Math.PI / 2)) * 14 };
            footR = { x: cx + Math.sin(walkPhase) * 18, y: feetY - Math.max(0, Math.sin(walkPhase + 3 * Math.PI / 2)) * 14 };
        } else if (player.airborne) {
            if (player.vy < 0) {
                footL = { x: cx - 13, y: feetY - h * 0.16 };
                footR = { x: cx + 7, y: feetY - h * 0.26 };
            } else {
                footL = { x: cx - 13, y: feetY - h * 0.04 };
                footR = { x: cx + 13, y: feetY - h * 0.02 };
            }
        }
        const hip = { x: cx, y: hipY };
        const feet = [footL, footR];
        for (let fi = 0; fi < 2; fi++) {
            const foot = feet[fi];
            const bend = Math.hypot(foot.x - hip.x, foot.y - hip.y);
            const kneeBend = Math.max(6, 30 - bend * 0.22);
            const mx = (hip.x + foot.x) / 2 + facing * kneeBend * 0.9;
            const my = (hip.y + foot.y) / 2;
            drawLimb(hip.x, hip.y, mx, my, foot.x, foot.y, 8 * wScale, '#1f4a63');
        }

        ctx.fillStyle = '#3b9ddd';
        roundRectPath(cx - w * 0.30, shoulderY, w * 0.60, hipY - shoulderY + 8, 10);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        roundRectPath(cx - w * 0.24, shoulderY + 5, w * 0.18, hipY - shoulderY - 2, 6);
        ctx.fill();

        const shL = { x: cx - w * 0.28, y: shoulderY + 8 };
        const shR = { x: cx + w * 0.28, y: shoulderY + 8 };
        let handL, handR;
        if (player.airborne) {
            const up = player.vy < 0;
            handL = { x: cx - w * 0.75, y: shoulderY + 8 + (up ? -h * 0.34 : -h * 0.18) };
            handR = { x: cx + w * 0.75, y: shoulderY + 8 + (up ? -h * 0.34 : -h * 0.18) };
        } else if (moving) {
            const sw = Math.sin(walkPhase) * 16;
            handL = { x: cx - w * 0.30 - sw, y: shoulderY + h * 0.30 };
            handR = { x: cx + w * 0.30 + sw, y: shoulderY + h * 0.30 };
        } else {
            handL = { x: cx - w * 0.34, y: shoulderY + h * 0.28 };
            handR = { x: cx + w * 0.34, y: shoulderY + h * 0.28 };
        }
        const shHands = [[shL, handL, -1], [shR, handR, 1]];
        for (let si = 0; si < 2; si++) {
            const sh = shHands[si][0], hand = shHands[si][1], side = shHands[si][2];
            const mx = (sh.x + hand.x) / 2 + side * 10;
            const my = (sh.y + hand.y) / 2 + 6;
            drawLimb(sh.x, sh.y, mx, my, hand.x, hand.y, 7 * wScale, '#2f7fb8');
            ctx.fillStyle = '#ffdcb8';
            ctx.beginPath();
            ctx.arc(hand.x, hand.y, 5.5 * wScale, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.fillStyle = '#ffdcb8';
        ctx.beginPath();
        ctx.arc(cx, headY, headR, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#1e1e1e';
        const eyeDx = facing > 0 ? 4 : -4;
        ctx.beginPath();
        ctx.arc(cx - 5 + eyeDx, headY - 3, 2.4, 0, Math.PI * 2);
        ctx.arc(cx + 5 + eyeDx, headY - 3, 2.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#1e1e1e';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        if (player.airborne) ctx.arc(cx + eyeDx, headY + 2, 5.5, 0.15 * Math.PI, 0.85 * Math.PI);
        else ctx.arc(cx + eyeDx, headY + 3, 4.5, 0.1 * Math.PI, 0.9 * Math.PI);
        ctx.stroke();

        ctx.fillStyle = '#e84c3d';
        ctx.beginPath();
        ctx.arc(cx, headY - headR * 0.3, headR * 0.85, Math.PI, 0);
        ctx.fill();
        ctx.fillRect(cx - headR * 0.95, headY - headR * 0.38, headR * 1.9, 6);

        ctx.restore();
    }

    // ==================== 宠物 ====================
    const PET_PALETTES = [
        ['#ff6b81', '#ffd6dd'], ['#54a0ff', '#c8ddff'], ['#feca57', '#fff0c8'],
        ['#5f27cd', '#c8b2ff'], ['#00d2d3', '#c8f7f7'], ['#ff9f43', '#ffe0c0'],
        ['#10ac84', '#c8f0e2'], ['#ee5253', '#ffd0d0'], ['#48dbfb', '#d8f4ff'],
        ['#f368e0', '#ffd6f7']
    ];

    function makePet(index) {
        const type = index % 4;
        const palette = PET_PALETTES[Math.floor(Math.random() * PET_PALETTES.length)];
        return {
            type, c1: palette[0], c2: palette[1],
            x: player.x + (Math.random() - 0.5) * 60,
            alt: player.y + 90,
            phase: Math.random() * Math.PI * 2,
            size: 16 + Math.random() * 8
        };
    }

    function updatePets(dt) {
        for (let i = 0; i < pets.length; i++) {
            const p = pets[i];
            const targetX = player.x + (i - (pets.length - 1) / 2) * 46;
            const targetAlt = player.y + 85 + Math.sin(petTime * 2 + p.phase) * 14;
            p.x += (targetX - p.x) * Math.min(1, dt * 4);
            p.alt += (targetAlt - p.alt) * Math.min(1, dt * 5);
        }
    }

    function drawPet(p) {
        const y = worldToScreenY(p.alt);
        const x = p.x;
        const s = p.size;
        const flap = Math.sin(petTime * 10 + p.phase) * 0.7;
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(facing >= 0 ? 1 : -1, 1);

        ctx.fillStyle = p.c2;
        ctx.save();
        ctx.rotate(-0.5 - flap * 0.6);
        ctx.beginPath();
        ctx.ellipse(-s * 0.4, -s * 0.5, s * 0.9, s * 0.35, -0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.save();
        ctx.scale(-1, 1);
        ctx.rotate(-0.5 - flap * 0.6);
        ctx.beginPath();
        ctx.ellipse(-s * 0.4, -s * 0.5, s * 0.9, s * 0.35, -0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.fillStyle = p.c1;
        if (p.type === 1) {
            ctx.beginPath();
            ctx.moveTo(-s * 0.8, 0);
            ctx.quadraticCurveTo(-s * 1.8, Math.sin(petTime * 6 + p.phase) * s * 0.4, -s * 2.2, s * 0.5);
            ctx.quadraticCurveTo(-s * 1.4, s * 0.2, -s * 0.8, s * 0.3);
            ctx.closePath();
            ctx.fill();
        } else if (p.type === 3) {
            ctx.strokeStyle = p.c1;
            ctx.lineWidth = 3;
            for (let k = -1; k <= 1; k++) {
                ctx.beginPath();
                ctx.moveTo(-s * 0.8, 0);
                ctx.quadraticCurveTo(-s * 1.6, k * 6 + Math.sin(petTime * 5 + p.phase) * 5, -s * 2.1, k * 12);
                ctx.stroke();
            }
        } else {
            ctx.beginPath();
            ctx.moveTo(-s * 0.8, -s * 0.2);
            ctx.lineTo(-s * 1.5, Math.sin(petTime * 6 + p.phase) * s * 0.25);
            ctx.lineTo(-s * 0.8, s * 0.3);
            ctx.closePath();
            ctx.fill();
        }

        ctx.fillStyle = p.c1;
        ctx.beginPath();
        if (p.type === 1) ctx.ellipse(0, 0, s * 1.1, s * 0.5, 0, 0, Math.PI * 2);
        else if (p.type === 2) ctx.ellipse(0, 0, s * 0.8, s * 0.9, 0, 0, Math.PI * 2);
        else ctx.ellipse(0, 0, s * 0.9, s * 0.65, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = p.c2;
        ctx.beginPath();
        ctx.ellipse(s * 0.15, s * 0.25, s * 0.45, s * 0.3, 0, 0, Math.PI * 2);
        ctx.fill();

        if (p.type === 2) {
            ctx.fillStyle = p.c1;
            ctx.beginPath();
            ctx.moveTo(-s * 0.45, -s * 0.6); ctx.lineTo(-s * 0.25, -s * 1.1); ctx.lineTo(-s * 0.05, -s * 0.65);
            ctx.moveTo(s * 0.05, -s * 0.65); ctx.lineTo(s * 0.25, -s * 1.1); ctx.lineTo(s * 0.45, -s * 0.6);
            ctx.fill();
        } else if (p.type === 1) {
            ctx.strokeStyle = p.c2;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(s * 0.5, -s * 0.35); ctx.lineTo(s * 0.7, -s * 0.8);
            ctx.moveTo(s * 0.2, -s * 0.45); ctx.lineTo(s * 0.3, -s * 0.95);
            ctx.stroke();
        }

        ctx.fillStyle = '#1e1e1e';
        ctx.beginPath();
        ctx.arc(s * 0.45, -s * 0.15, 2.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f39c12';
        ctx.beginPath();
        ctx.moveTo(s * 0.85, -s * 0.1);
        ctx.lineTo(s * 1.25, 0);
        ctx.lineTo(s * 0.85, s * 0.15);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
    }

    function drawPets() {
        for (let i = 0; i < pets.length; i++) drawPet(pets[i]);
    }

    function drawPopups() {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = 'bold 26px "Courier New", monospace';
        for (let i = 0; i < popups.length; i++) {
            const p = popups[i];
            const y = worldToScreenY(p.y) - PLAYER_H - (1.4 - p.life) * 50;
            ctx.globalAlpha = Math.min(1, p.life * 2);
            ctx.fillStyle = p.color;
            ctx.shadowColor = '#00000088';
            ctx.shadowBlur = 4;
            ctx.fillText(p.text, p.x, y);
        }
        ctx.restore();
        ctx.globalAlpha = 1;
    }

    function drawBuyHint() {
        const idx = nearestTableIndex();
        if (idx < 0) return;
        const groundY = worldToScreenY(0);
        ctx.save();
        ctx.font = 'bold 18px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const text = '按 B 购买';
        const tw = ctx.measureText(text).width + 24;
        const x = tables[idx].x, y = groundY - 130;
        ctx.fillStyle = 'rgba(13, 27, 42, 0.85)';
        roundRectPath(x - tw / 2, y - 15, tw, 30, 15);
        ctx.fill();
        ctx.fillStyle = '#ffd966';
        ctx.fillText(text, x, y);
        ctx.restore();
    }

    const HUD_FONT = 'bold 18px "Courier New", monospace';
    let hudDirty = true;
    let hudMoneyStr = '', hudAbilityStr = '', hudBestStr = '';
    let hudMoneyW = 0, hudAbilityW = 0, hudBestW = 0;

    function rebuildHudCache() {
        hudMoneyStr = '金额: ' + money + ' 元';
        hudAbilityStr = '能力: ' + jumpAbility + ' m';
        hudBestStr = '最高: ' + bestHeight + ' m';
        const savedFont = ctx.font;
        ctx.font = HUD_FONT;
        const pad = 14;
        hudMoneyW = ctx.measureText(hudMoneyStr).width + pad * 2;
        hudAbilityW = ctx.measureText(hudAbilityStr).width + pad * 2;
        hudBestW = ctx.measureText(hudBestStr).width + pad * 2;
        ctx.font = savedFont;
        hudDirty = false;
    }

    function drawPillWithText(x, y, w, h, bgColor, text, textColor) {
        ctx.fillStyle = bgColor;
        roundRectPath(x, y, w, h, h / 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.lineWidth = 1;
        roundRectPath(x + 1, y + 1, w - 2, h - 2, (h - 2) / 2);
        ctx.stroke();
        ctx.fillStyle = textColor;
        ctx.fillText(text, x + 14, y + h / 2 + 1);
    }

    function drawHud() {
        if (hudDirty) rebuildHudCache();
        ctx.fillStyle = hudBgGrad;
        ctx.fillRect(0, PLAY_H, W, HUD_H);
        ctx.strokeStyle = 'rgba(120, 170, 210, 0.35)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, PLAY_H + 0.5);
        ctx.lineTo(W, PLAY_H + 0.5);
        ctx.stroke();

        const pillH = 36, gap = 10;
        const totalW = hudMoneyW + hudAbilityW + hudBestW + gap * 2;
        let x = (W - totalW) / 2;
        const y = PLAY_H + (HUD_H - pillH) / 2;
        ctx.font = HUD_FONT;
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'left';
        drawPillWithText(x, y, hudMoneyW, pillH, 'rgba(52, 78, 116, 0.9)', hudMoneyStr, '#ffd966');
        x += hudMoneyW + gap;
        drawPillWithText(x, y, hudAbilityW, pillH, 'rgba(30, 47, 74, 0.85)', hudAbilityStr, '#9bf6b0');
        x += hudAbilityW + gap;
        drawPillWithText(x, y, hudBestW, pillH, 'rgba(30, 47, 74, 0.85)', hudBestStr, '#dfeef8');
    }

    function draw() {
        applyCanvasTransform();
        ctx.clearRect(0, 0, W, H);

        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, W, PLAY_H);

        drawRuler();

        const groundY = worldToScreenY(0);
        ctx.fillStyle = '#7a9e7e';
        ctx.fillRect(0, groundY, W, PLAY_H - groundY + 200);
        ctx.fillStyle = '#5f7e5f';
        ctx.fillRect(0, groundY, W, 8);

        drawTables();
        drawPets();
        drawPlayer();
        drawPopups();
        drawBuyHint();
        drawHud();

        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
    }

    // ==================== 主循环 ====================
    let lastTime = 0;
    let lastHudMoney = -1, lastHudAbility = -1, lastHudBest = -1;
    function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        let dt = (timestamp - lastTime) / 1000;
        lastTime = timestamp;
        if (dt > 0.1) dt = 0.1;
        if (dt < 0.001) dt = 0.001;

        pollGamepad();
        update(dt);
        if (money !== lastHudMoney || jumpAbility !== lastHudAbility || bestHeight !== lastHudBest) hudDirty = true;
        lastHudMoney = money; lastHudAbility = jumpAbility; lastHudBest = bestHeight;
        draw();
        requestAnimationFrame(gameLoop);
    }

    // ==================== 初始化 ====================
    refreshCachedPad();
    updateFullscreenButton();
    resizeCanvas();
    rebuildGradients();
    initTables();
    requestAnimationFrame(() => { resizeCanvas(); requestAnimationFrame(resizeCanvas); });
    requestAnimationFrame(gameLoop);
})();
</script>
</body>
