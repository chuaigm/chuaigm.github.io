<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>跳跃得分</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            background: #0b1a2f;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
        }
        .game-container {
            background: #1e2f4a;
            padding: 0;
            border-radius: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
            max-height: 100%;
            transition: border-radius 0.2s;
        }
        .canvas-wrap {
            position: relative;
            width: 100%;
            max-width: 1280px;
            line-height: 0;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1280 / 720;
            border-radius: 0;
            box-shadow: none;
            touch-action: none;
        }
        .fullscreen-btn {
            position: absolute;
            top: 6px; right: 6px;
            width: 30px; height: 30px;
            min-width: 30px; min-height: 30px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.45);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            transition: background 0.15s, color 0.15s, transform 0.1s;
            z-index: 10; padding: 0; outline: none;
        }
        .fullscreen-btn:hover { background: rgba(255, 255, 255, 0.18); color: rgba(255, 255, 255, 0.8); }
        .fullscreen-btn:active { background: rgba(255, 255, 255, 0.28); color: #ffffff; transform: scale(0.92); }
        .fullscreen-btn svg { width: 15px; height: 15px; display: block; pointer-events: none; }
        @media (max-width: 720px) {
            .fullscreen-btn { width: 26px; height: 26px; top: 5px; right: 5px; border-radius: 7px; }
            .fullscreen-btn svg { width: 13px; height: 13px; }
        }
        .game-container.is-fullscreen {
            width: 100vw; height: 100vh;
            max-width: none; max-height: none;
            border-radius: 0; padding: 0; background: #000;
            justify-content: center; align-items: center;
        }
        .game-container.is-fullscreen .canvas-wrap {
            width: 100%; height: 100%; max-width: none;
            display: flex; align-items: center; justify-content: center;
        }
        .game-container.is-fullscreen canvas {
            width: auto !important;
            height: auto !important;
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 1280 / 720;
            border-radius: 0; box-shadow: none;
        }
        .game-container.is-fullscreen .fullscreen-btn {
            top: 8px; right: 8px;
            background: rgba(255, 255, 255, 0.10);
            color: rgba(255, 255, 255, 0.55);
            z-index: 30;
        }
    </style>
</head>
<body>
<div class="game-container" id="gameContainer">
    <div class="canvas-wrap" id="canvasWrap">
        <canvas id="gameCanvas" width="1280" height="720"></canvas>
        <button class="fullscreen-btn" id="fullscreenBtn" aria-label="全屏" title="全屏">
            <svg id="fsIconExpand" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 9V4h5"/><path d="M20 9V4h-5"/>
                <path d="M4 15v5h5"/><path d="M20 15v5h-5"/>
            </svg>
            <svg id="fsIconCompress" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
                 style="display:none;">
                <path d="M9 4v5H4"/><path d="M15 4v5h5"/>
                <path d="M9 20v-5H4"/><path d="M15 20v-5h5"/>
            </svg>
        </button>
    </div>
</div>
<script>
(function() {
    'use strict';

    const VERSION = '20261008';

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('gameContainer');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const fsIconExpand = document.getElementById('fsIconExpand');
    const fsIconCompress = document.getElementById('fsIconCompress');

    // ==================== 常量 ====================
    const W = 1280, H = 720;
    const HUD_H = 56;
    const PLAY_H = H - HUD_H;
    const FPS_BASE = 60;

    const PLAYER_W = 56;
    const PLAYER_H = 110;
    const PX_PER_M = PLAYER_H / 2;
    const GROUND_H = 90;
    const GRAVITY = 3200;
    const HOLD_GRAVITY = GRAVITY * 0.5;
    const APEX_HANG_FACTOR = 0.25;
    const MIN_JUMP_FRAC = 0.02;
    const RELEASE_DECAY = 12.74;
    const WALK_SPEED = 260;

    const TABLE_COUNT = 6;

    const EGG_W = 40, EGG_H = 54;
    const EGG_ALT = 60 + EGG_H / 2 - 2;

    const touchStates = new Map();

    // ==================== 工具 ====================
    function roundRectPath(x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }

    function traceEggPath(w, h) {
        const hw = w / 2, hh = h / 2;
        const wy = hh * 0.28;
        ctx.moveTo(0, -hh);
        ctx.bezierCurveTo(hw * 0.55, -hh, hw * 1.05, -hh * 0.30, hw, wy);
        ctx.bezierCurveTo(hw * 0.97, hh * 0.80, hw * 0.50, hh, 0, hh);
        ctx.bezierCurveTo(-hw * 0.50, hh, -hw * 0.97, hh * 0.80, -hw, wy);
        ctx.bezierCurveTo(-hw * 1.05, -hh * 0.30, -hw * 0.55, -hh, 0, -hh);
        ctx.closePath();
    }

    function nextPrice(p) {
        const k = Math.pow(10, Math.floor(Math.log10(p)));
        const m = p / k;
        if (m === 1) return 2 * p;
        if (m === 2) return p * 2.5;
        return p * 2;
    }

    // ==================== 全屏控制 ====================
    const fullscreenApi = {
        request: () => {
            const el = document.documentElement;
            if (el.requestFullscreen) return el.requestFullscreen();
            if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
            if (el.msRequestFullscreen) return el.msRequestFullscreen();
        },
        exit: () => {
            if (document.exitFullscreen) return document.exitFullscreen();
            if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
            if (document.msExitFullscreen) return document.msExitFullscreen();
        },
        isFullscreen: () => !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement)
    };

    function updateFullscreenButton() {
        const fs = fullscreenApi.isFullscreen();
        if (fs) {
            fsIconExpand.style.display = 'none';
            fsIconCompress.style.display = 'block';
            fullscreenBtn.setAttribute('aria-label', '退出全屏');
            fullscreenBtn.setAttribute('title', '退出全屏');
        } else {
            fsIconExpand.style.display = 'block';
            fsIconCompress.style.display = 'none';
            fullscreenBtn.setAttribute('aria-label', '全屏');
            fullscreenBtn.setAttribute('title', '全屏');
        }
    }

    function toggleFullscreen() {
        if (fullscreenApi.isFullscreen()) fullscreenApi.exit();
        else fullscreenApi.request();
    }

    fullscreenBtn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); toggleFullscreen(); });
    fullscreenBtn.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
    fullscreenBtn.addEventListener('touchend', (e) => e.stopPropagation(), { passive: true });

    function onFullscreenChange() {
        const fs = fullscreenApi.isFullscreen();
        container.classList.toggle('is-fullscreen', fs);
        updateFullscreenButton();
        setTimeout(scheduleResize, 60);
        setTimeout(scheduleResize, 200);
        setTimeout(scheduleResize, 500);
    }
    document.addEventListener('fullscreenchange', onFullscreenChange);
    document.addEventListener('webkitfullscreenchange', onFullscreenChange);
    document.addEventListener('msfullscreenchange', onFullscreenChange);

    // ==================== 画布适配 ====================
    function applyCanvasTransform() {
        ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    }

    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        const availWidth = window.innerWidth;
        const availHeight = window.innerHeight;
        const availWidthFromHeight = availHeight * (W / H);
        let cssW = Math.min(availWidth, availWidthFromHeight);
        if (!fullscreenApi.isFullscreen()) cssW = Math.min(cssW, 1280);
        if (!isFinite(cssW) || cssW < 100) cssW = Math.max(100, Math.min(availWidth, 1280));
        const cssH = cssW * (H / W);
        canvas.style.width = cssW + 'px';
        canvas.style.height = cssH + 'px';
        canvas.width = Math.round(cssW * dpr);
        canvas.height = Math.round(cssH * dpr);
        applyCanvasTransform();
    }

    let resizeScheduled = false;
    function scheduleResize() {
        if (resizeScheduled) return;
        resizeScheduled = true;
        requestAnimationFrame(() => { resizeScheduled = false; resizeCanvas(); });
    }
    window.addEventListener('resize', scheduleResize);
    window.addEventListener('orientationchange', () => { setTimeout(scheduleResize, 120); setTimeout(scheduleResize, 350); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleResize);

    // ==================== 游戏状态 ====================
    let money = 0;
    let jumpAbility = 2;
    let camY = 0;
    let prices = [];
    let tables = [];
    let popups = [];
    let explosions = [];
    let pets = [];
    let coins = [];
    let petTime = 0;
    let bgSeed = Math.random() * 1000;
    let walkPhase = 0;
    let facing = 1;

    const player = {
        x: W / 2, y: 0,
        vy: 0, vy0: 0, airborne: false, squash: 0, peakAwarded: false,
        airPose: 0, armPose: 0, armSide: 1, spinDir: 1
    };

    let jumpHeld = false;
    let jumpStartY = 0;
    let jumpPeakY = 0;
    let jumpCut = false;
    let jumpCapped = false;

    const keys = { ArrowLeft: false, ArrowRight: false, Space: false };

    // ==================== 手柄 ====================
    let gamepadConnected = false;
    let gamepadIndex = -1;
    let gamepadLeft = false, gamepadRight = false, gamepadA = false, gamepadB = false;
    let prevA = false, prevB = false, prevStart = false;

    // ==================== 桌子/价格 ====================
    function makeEggSpots() {
        const spots = [];
        const edgeCount = 2 + Math.floor(Math.random() * 2);
        const innerCount = 1 + Math.floor(Math.random() * 2);
        const hw = EGG_W / 2, hh = EGG_H / 2;

        function tryAdd(atEdge) {
            for (let attempt = 0; attempt < 60; attempt++) {
                let x, y, r, rx, ry;
                if (atEdge) {
                    y = Math.random() * 0.7 - 0.25;
                    r = 0.15 + Math.random() * 0.15;
                    rx = 0.90 + Math.random() * 0.55;
                    ry = 0.75 + Math.random() * 0.8;
                    const side = Math.random() < 0.5 ? -1 : 1;
                    const approxB = Math.sqrt(Math.max(0.05, 1 - y * y));
                    x = side * Math.max(0.3, approxB - r * rx * 0.30);
                } else {
                    x = (Math.random() - 0.5) * 0.6;
                    y = (Math.random() - 0.5) * 1.1;
                    r = 0.12 + Math.random() * 0.14;
                    rx = 0.75 + Math.random() * 0.8;
                    ry = 0.75 + Math.random() * 0.8;
                }
                let ok = true;
                for (let i = 0; i < spots.length; i++) {
                    const o = spots[i];
                    const ddx = (x - o.x) * hw;
                    const ddy = (y - o.y) * hh;
                    const minD = (r + o.r) * hw * 1.1 + 3;
                    if (ddx * ddx + ddy * ddy < minD * minD) { ok = false; break; }
                }
                if (!ok) continue;
                spots.push({
                    x: x, y: y, r: r,
                    rx: rx, ry: ry,
                    rot: Math.random() * Math.PI,
                    shade: Math.random()
                });
                return true;
            }
            return false;
        }

        for (let i = 0; i < edgeCount; i++) tryAdd(true);
        for (let i = 0; i < innerCount; i++) tryAdd(false);
        return spots;
    }

    function refreshEggs(withExplosion) {
        for (let i = 0; i < tables.length; i++) {
            tables[i].spots = makeEggSpots();
            tables[i].eggPhase = Math.random() * Math.PI * 2;
            if (withExplosion) addExplosion(tables[i].x, EGG_ALT);
        }
    }

    function initTables() {
        tables = [];
        for (let i = 0; i < TABLE_COUNT; i++) {
            tables.push({
                x: 150 + i * (W - 300) / (TABLE_COUNT - 1),
                spots: makeEggSpots(),
                eggPhase: Math.random() * Math.PI * 2
            });
        }
        prices = [];
        let p = 10;
        for (let i = 0; i < TABLE_COUNT; i++) { prices.push(p); p = nextPrice(p); }
    }

    function refreshTables(lastBought) {
        prices = [];
        let p = nextPrice(lastBought);
        for (let i = 0; i < TABLE_COUNT; i++) { prices.push(p); p = nextPrice(p); }
    }

    function nearestTableIndex() {
        let best = -1, bd = Infinity;
        for (let i = 0; i < tables.length; i++) {
            const d = Math.abs(player.x - tables[i].x);
            if (d < bd) { bd = d; best = i; }
        }
        return bd < 70 ? best : -1;
    }

    // ==================== 输入 ====================
    window.addEventListener('keydown', (e) => {
        const key = e.key;
        if (key === 'ArrowLeft' || key === 'ArrowRight' || key === ' ') e.preventDefault();
        ensureAudio();
        if (key === 'ArrowLeft') keys.ArrowLeft = true;
        else if (key === 'ArrowRight') keys.ArrowRight = true;
        else if (key === ' ') { if (!keys.Space) tryJump(); keys.Space = true; }
        else if (key === 'b' || key === 'B') tryBuy();
    });

    window.addEventListener('keyup', (e) => {
        const key = e.key;
        if (key === 'ArrowLeft') keys.ArrowLeft = false;
        else if (key === 'ArrowRight') keys.ArrowRight = false;
        else if (key === ' ') keys.Space = false;
        if (key === 'ArrowLeft' || key === 'ArrowRight' || key === ' ') e.preventDefault();
    });

    function touchActionFromPoint(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) return null;
        const lx = (clientX - rect.left) * (W / rect.width);
        const ly = (clientY - rect.top) * (H / rect.height);
        if (lx < 0 || lx >= W || ly < 0 || ly >= H) return null;
        const left = lx < W / 2;
        const top = ly < H / 2;
        if (left && top) return 'jump';
        if (left && !top) return 'left';
        if (!left && top) return 'buy';
        return 'right';
    }

    let touchLeft = false, touchRight = false, touchJump = false;
    function refreshTouchFlags() {
        touchLeft = false; touchRight = false; touchJump = false;
        for (const s of touchStates.values()) {
            if (s.action === 'left') touchLeft = true;
            else if (s.action === 'right') touchRight = true;
            else if (s.action === 'jump') touchJump = true;
        }
    }

    canvas.addEventListener('touchstart', (e) => {
        let consumed = false;
        ensureAudio();
        for (let i = 0; i < e.changedTouches.length; i++) {
            const t = e.changedTouches[i];
            const a = touchActionFromPoint(t.clientX, t.clientY);
            if (!a) continue;
            consumed = true;
            touchStates.set(t.identifier, { action: a });
            if (a === 'jump') tryJump();
            else if (a === 'buy') tryBuy();
        }
        if (consumed) { e.preventDefault(); refreshTouchFlags(); }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
        let changed = false;
        for (let i = 0; i < e.changedTouches.length; i++) {
            const t = e.changedTouches[i];
            if (!touchStates.has(t.identifier)) continue;
            const a = touchActionFromPoint(t.clientX, t.clientY);
            if (!a) continue;
            const prev = touchStates.get(t.identifier);
            if (prev.action !== a) { prev.action = a; changed = true; }
        }
        if (changed) { e.preventDefault(); refreshTouchFlags(); }
    }, { passive: false });

    function onTouchEnd(e) {
        let changed = false;
        for (let i = 0; i < e.changedTouches.length; i++) {
            const t = e.changedTouches[i];
            if (touchStates.has(t.identifier)) { touchStates.delete(t.identifier); changed = true; }
        }
        if (changed) { e.preventDefault(); refreshTouchFlags(); }
    }
    canvas.addEventListener('touchend', onTouchEnd, { passive: false });
    canvas.addEventListener('touchcancel', onTouchEnd, { passive: false });

    window.addEventListener('blur', () => {
        keys.ArrowLeft = false; keys.ArrowRight = false; keys.Space = false;
        touchStates.clear(); touchLeft = false; touchRight = false;
    });

    // ==================== 游戏逻辑 ====================
    let audioCtx = null;
    function ensureAudio() {
        if (!audioCtx) {
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playJumpSound() {
        ensureAudio();
        if (!audioCtx) return;
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(260, t);
        osc.frequency.exponentialRampToValueAtTime(640, t + 0.13);
        gain.gain.setValueAtTime(0.10, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.17);
    }

    function playLandSound() {
        ensureAudio();
        if (!audioCtx) return;
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(140, t);
        osc.frequency.exponentialRampToValueAtTime(45, t + 0.14);
        gain.gain.setValueAtTime(0.30, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.19);
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(320, t);
        gain2.gain.setValueAtTime(0.12, t);
        gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(t);
        osc2.stop(t + 0.06);
    }

    function playCoinSound(delay, freq) {
        ensureAudio();
        if (!audioCtx) return;
        const t = audioCtx.currentTime + delay;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, t);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.98, t + 0.12);
        gain.gain.setValueAtTime(0.09, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.15);
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(freq * 2.76, t);
        gain2.gain.setValueAtTime(0.045, t);
        gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(t);
        osc2.stop(t + 0.09);
    }

    function playSpendSound() {
        ensureAudio();
        if (!audioCtx) return;
        const t = audioCtx.currentTime;
        const noiseLen = 0.22;
        const noiseBuf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * noiseLen), audioCtx.sampleRate);
        const ndata = noiseBuf.getChannelData(0);
        for (let i = 0; i < ndata.length; i++) ndata[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = noiseBuf;
        const noiseFilter = audioCtx.createBiquadFilter();
        noiseFilter.type = 'bandpass';
        noiseFilter.frequency.value = 2500;
        noiseFilter.Q.value = 0.8;
        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0.18, t);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, t + noiseLen);
        noise.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);
        noise.start(t);
        noise.stop(t + noiseLen);
        const t2 = t + 0.18;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(400, t2);
        osc.frequency.exponentialRampToValueAtTime(180, t2 + 0.06);
        gain.gain.setValueAtTime(0.20, t2);
        gain.gain.exponentialRampToValueAtTime(0.001, t2 + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t2);
        osc.stop(t2 + 0.09);
        const t3 = t + 0.26;
        const bellFreq = 2500 * (0.95 + Math.random() * 0.1);
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(bellFreq, t3);
        const osc3 = audioCtx.createOscillator();
        const gain3 = audioCtx.createGain();
        osc3.type = 'sine';
        osc3.frequency.setValueAtTime(bellFreq * 2.76, t3);
        gain2.gain.setValueAtTime(0.10, t3);
        gain2.gain.exponentialRampToValueAtTime(0.001, t3 + 0.30);
        gain3.gain.setValueAtTime(0.045, t3);
        gain3.gain.exponentialRampToValueAtTime(0.001, t3 + 0.16);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc3.connect(gain3);
        gain3.connect(audioCtx.destination);
        osc2.start(t3);
        osc2.stop(t3 + 0.31);
        osc3.start(t3);
        osc3.stop(t3 + 0.17);
    }

    function playPetCoinSound() {
        ensureAudio();
        if (!audioCtx) return;
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(420, t);
        osc.frequency.exponentialRampToValueAtTime(900, t + 0.06);
        gain.gain.setValueAtTime(0.08, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.09);
    }

    function playPickupSound() {
        playCoinSound(0, 1760);
        playCoinSound(0.07, 2637);
    }

    function tryJump() {
        if (player.airborne) return;
        player.airborne = true;
        player.squash = 0;
        jumpStartY = player.y;
        jumpPeakY = player.y;
        jumpCut = false;
        jumpCapped = false;
        const peakPx = jumpAbility * PX_PER_M;
        player.vy = -Math.sqrt(2 * HOLD_GRAVITY * peakPx);
        player.vy0 = -player.vy;
        player.peakAwarded = false;
        player.airPose = Math.floor(Math.random() * 3);
        player.armPose = Math.floor(Math.random() * 3);
        player.armSide = Math.random() < 0.5 ? -1 : 1;
        player.spinDir = Math.random() < 0.5 ? -1 : 1;
        playJumpSound();
    }

    function tryBuy() {
        const idx = nearestTableIndex();
        if (idx < 0) return;
        const cost = prices[idx];
        if (money < cost) {
            popups.push({ x: player.x, y: player.y, text: '钱不够!', life: 1.0, color: '#ff6b6b' });
            return;
        }
        money -= cost;
        jumpAbility += cost / 10;
        playSpendSound();
        popups.push({ x: player.x, y: player.y, text: '+' + (cost / 10) + 'm 能力!', life: 1.4, color: '#9bf6b0' });
        pets.push(makePet(pets.length));
        refreshTables(cost);
        refreshEggs(true);
    }

    function restart() {
        money = 0;
        jumpAbility = 2;
        camY = 0;
        popups = [];
        explosions = [];
        pets = [];
        coins = [];
        bgSeed = Math.random() * 1000;
        initTables();
        player.x = W / 2; player.y = 0; player.vy = 0; player.vy0 = 0;
        player.airborne = false; player.squash = 0;
        jumpStartY = 0; jumpPeakY = 0; jumpCut = false; jumpCapped = false;
    }

    function pollGamepad() {
        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        let gp = null;
        for (let i = 0; i < gamepads.length; i++) {
            if (gamepads[i] && gamepads[i].connected) { gp = gamepads[i]; gamepadIndex = i; break; }
        }
        if (gp && !gamepadConnected) gamepadConnected = true;
        else if (!gp && gamepadConnected) {
            gamepadConnected = false;
            gamepadLeft = gamepadRight = gamepadA = gamepadB = false;
            prevA = prevB = prevStart = false;
        }
        if (!gp) { gamepadLeft = gamepadRight = gamepadA = gamepadB = false; return; }
        const b = gp.buttons;
        gamepadLeft = !!(b[14] && (b[14].pressed || b[14].value > 0.5));
        gamepadRight = !!(b[15] && (b[15].pressed || b[15].value > 0.5));
        if (gp.axes && gp.axes.length > 0) {
            if (gp.axes[0] < -0.5) gamepadLeft = true;
            if (gp.axes[0] > 0.5) gamepadRight = true;
        }
        const aPressed = !!(b[0] && (b[0].pressed || b[0].value > 0.5));
        if (aPressed && !prevA) tryJump();
        prevA = aPressed;
        gamepadA = aPressed;
        const bPressed = !!(b[1] && (b[1].pressed || b[1].value > 0.5));
        if (bPressed && !prevB) tryBuy();
        prevB = bPressed;
        gamepadB = bPressed;
        const startPressed = !!(b[9] && (b[9].pressed || b[9].value > 0.5));
        if (startPressed && !prevStart) restart();
        prevStart = startPressed;
    }

    function update(dt) {
        jumpHeld = keys.Space || gamepadA || touchJump;
        const left = keys.ArrowLeft || gamepadLeft || touchLeft;
        const right = keys.ArrowRight || gamepadRight || touchRight;
        if (left && !right) { player.x -= WALK_SPEED * dt; facing = -1; walkPhase += dt * 10; }
        else if (right && !left) { player.x += WALK_SPEED * dt; facing = 1; walkPhase += dt * 10; }
        if (player.x < 30) player.x = 30;
        if (player.x > W - 30) player.x = W - 30;

        if (player.airborne) {
            const peakPx = jumpAbility * PX_PER_M;
            const capY = jumpStartY + peakPx;
            const minY = jumpStartY + peakPx * MIN_JUMP_FRAC;
            const rising = player.vy < 0;
            if (!jumpHeld && rising) jumpCut = true;
            const thrusting = rising && (player.y < minY || (!jumpCut && player.y < capY));
            if (thrusting) {
                player.y += -player.vy * dt - 0.5 * HOLD_GRAVITY * dt * dt;
                player.vy += HOLD_GRAVITY * dt;
            } else {
                if (jumpCut && rising) {
                    player.vy *= Math.exp(-RELEASE_DECAY * dt);
                    if (player.vy > -1) player.vy = 0;
                }
                const apexT = player.vy0 > 0 ? Math.max(-1, Math.min(1, player.vy / player.vy0)) : 0;
                const apexSlow = 1 - APEX_HANG_FACTOR * (1 - Math.abs(apexT));
                player.y += -player.vy * dt - 0.5 * GRAVITY * apexSlow * dt * dt;
                player.vy += GRAVITY * apexSlow * dt;
            }
            if (player.y >= capY) { player.y = capY; player.vy = 0; jumpCapped = true; }
            if (player.y > jumpPeakY) jumpPeakY = player.y;
            if (player.vy >= 0 && !player.peakAwarded) {
                player.peakAwarded = true;
                const meters = (jumpCapped || !jumpCut)
                    ? Math.round(jumpAbility)
                    : Math.max(0, Math.round((jumpPeakY - jumpStartY) / PX_PER_M));
                if (meters > 0) {
                    money += meters;
                    popups.push({ x: player.x, y: player.y, text: '+' + meters + ' $', life: 1.2, color: '#ffd966', follow: true });
                    playCoinSound(0, 1568);
                    playCoinSound(0.09, 2093);
                    playCoinSound(0.18, 2637);
                }
            }
            if (player.y <= 0) {
                player.y = 0;
                player.airborne = false;
                player.squash = 1;
                player.peakAwarded = false;
                playLandSound();
            }
        } else {
            player.y = 0;
            if (player.squash > 0) player.squash -= dt * 4;
        }

        const target = Math.max(0, player.y - PLAY_H * 0.45);
        camY += (target - camY) * Math.min(1, dt * 14);

        petTime += dt;
        updatePets(dt);
        updateCoins(dt);
        updateExplosions(dt);

        for (let i = popups.length - 1; i >= 0; i--) {
            popups[i].life -= dt;
            if (popups[i].follow) {
                popups[i].x = player.x;
                popups[i].y = player.y;
            }
            if (popups[i].life <= 0) popups.splice(i, 1);
        }
    }

    // ==================== 绘制 ====================
    let skyGrad = null, hudBgGrad = null;
    function rebuildGradients() {
        skyGrad = ctx.createLinearGradient(0, 0, 0, PLAY_H);
        skyGrad.addColorStop(0, '#8fc7e8');
        skyGrad.addColorStop(1, '#d4eef9');
        hudBgGrad = ctx.createLinearGradient(0, PLAY_H, 0, H);
        hudBgGrad.addColorStop(0, 'rgba(13, 27, 42, 0.96)');
        hudBgGrad.addColorStop(1, 'rgba(6, 15, 26, 0.98)');
    }

    function worldToScreenY(altitudePx) {
        return PLAY_H - GROUND_H - altitudePx + camY;
    }

    function drawRuler() {
        ctx.save();
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        for (let m = 0; ; m++) {
            const y = worldToScreenY(m * PX_PER_M);
            if (y < -40) break;
            if (y > PLAY_H + 40) continue;
            const major = m % 5 === 0;
            ctx.strokeStyle = major ? 'rgba(90, 130, 160, 0.5)' : 'rgba(90, 130, 160, 0.22)';
            ctx.lineWidth = major ? 2.5 : 1.2;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(W, y);
            ctx.stroke();
            ctx.fillStyle = major ? 'rgba(60, 90, 120, 0.9)' : 'rgba(60, 90, 120, 0.55)';
            ctx.font = (major ? 'bold 20px' : '16px') + ' "Courier New", monospace';
            ctx.fillText(m + 'm', 14, y - 12);
        }
        ctx.restore();
    }

    function drawTables() {
        const groundScreenY = worldToScreenY(0);
        if (groundScreenY > PLAY_H + 200) return;
        for (let i = 0; i < tables.length; i++) {
            const tx = tables[i].x;
            const tableW = 90, tableH = 60;
            const topY = groundScreenY - tableH;

            ctx.fillStyle = '#8b5a2b';
            roundRectPath(tx - tableW / 2, topY, tableW, 14, 6);
            ctx.fill();
            ctx.fillStyle = '#6b4423';
            ctx.fillRect(tx - tableW / 2 + 8, topY + 14, 10, tableH - 14);
            ctx.fillRect(tx + tableW / 2 - 18, topY + 14, 10, tableH - 14);

            const bx = tx;
            const ew = EGG_W, eh = EGG_H;
            const by = topY + 2 - eh / 2;
            const sway = Math.sin(petTime * 2.2 + tables[i].eggPhase) * 0.10;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
            ctx.beginPath();
            ctx.ellipse(bx, topY + 3, 21, 6, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.save();
            ctx.translate(bx, by + eh / 2);
            ctx.rotate(sway);
            ctx.translate(0, -eh / 2);
            const glowA = 0.18 + 0.10 * (0.5 + 0.5 * Math.sin(petTime * 2.6 + tables[i].eggPhase * 2));
            const glowGrad = ctx.createRadialGradient(0, -eh * 0.32, eh * 0.05, 0, -eh * 0.32, eh * 0.80);
            glowGrad.addColorStop(0, 'rgba(255, 222, 135, ' + glowA + ')');
            glowGrad.addColorStop(0.45, 'rgba(255, 212, 115, ' + (glowA * 0.5) + ')');
            glowGrad.addColorStop(1, 'rgba(255, 205, 100, 0)');
            ctx.fillStyle = glowGrad;
            ctx.beginPath();
            ctx.arc(0, -eh * 0.32, eh * 0.80, 0, Math.PI * 2);
            ctx.fill();
            const eggGrad = ctx.createRadialGradient(-ew * 0.12, -eh * 0.20, eh * 0.06, 0, 0, eh * 0.72);
            eggGrad.addColorStop(0, '#f5f5f3');
            eggGrad.addColorStop(0.55, '#cfcfcc');
            eggGrad.addColorStop(1, '#8e8e8a');
            ctx.fillStyle = eggGrad;
            ctx.beginPath();
            traceEggPath(ew, eh);
            ctx.fill();
            ctx.save();
            ctx.beginPath();
            traceEggPath(ew, eh);
            ctx.clip();
            for (let si = 0; si < tables[i].spots.length; si++) {
                const sp = tables[i].spots[si];
                ctx.fillStyle = 'hsl(150, 55%, ' + (14 + sp.shade * 14) + '%)';
                ctx.beginPath();
                ctx.ellipse(sp.x * ew / 2, sp.y * eh / 2, sp.r * ew * 0.5 * sp.rx, sp.r * ew * 0.5 * sp.ry, sp.rot, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
            for (let k = 0; k < 3; k++) {
                const tw = Math.sin(petTime * 3.2 + tables[i].eggPhase * 3 + k * 2.1);
                const a = tw > 0 ? tw * tw * 0.9 : 0;
                if (a <= 0.01) continue;
                const ox = (k - 1) * ew * 0.55;
                const oy = -eh * (k === 1 ? 0.60 : 0.30);
                const ss = 2.5 + tw * 3.0;
                ctx.save();
                ctx.globalAlpha = a;
                ctx.fillStyle = '#ffe9a8';
                ctx.beginPath();
                ctx.moveTo(ox, oy - ss);
                ctx.quadraticCurveTo(ox, oy, ox + ss, oy);
                ctx.quadraticCurveTo(ox, oy, ox, oy + ss);
                ctx.quadraticCurveTo(ox, oy, ox - ss, oy);
                ctx.quadraticCurveTo(ox, oy, ox, oy - ss);
                ctx.fill();
                ctx.restore();
            }
            ctx.restore();

            ctx.font = 'bold 17px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const label = prices[i] + '$';
            const lw = ctx.measureText(label).width + 16;
            ctx.fillStyle = 'rgba(13, 27, 42, 0.85)';
            roundRectPath(bx - lw / 2, topY + 20, lw, 24, 12);
            ctx.fill();
            ctx.fillStyle = money >= prices[i] ? '#9bf6b0' : '#ff9b9b';
            ctx.fillText(label, bx, topY + 32);
        }
    }

    function addExplosion(x, alt) {
        const particles = [];
        const count = 14 + Math.floor(Math.random() * 8);
        for (let i = 0; i < count; i++) {
            const ang = Math.random() * Math.PI * 2;
            const spd = 50 + Math.random() * 120;
            particles.push({
                dx: Math.cos(ang) * 5,
                dy: Math.sin(ang) * 5,
                vx: Math.cos(ang) * spd,
                vy: Math.sin(ang) * spd * 0.75 - 25,
                r: 5 + Math.random() * 9
            });
        }
        explosions.push({ x: x, alt: alt, particles: particles, life: 0.8, maxLife: 0.8, flash: 0.18 });
    }

    function updateExplosions(dt) {
        for (let i = explosions.length - 1; i >= 0; i--) {
            const ex = explosions[i];
            ex.life -= dt;
            if (ex.life <= 0) { explosions.splice(i, 1); continue; }
            if (ex.flash > 0) ex.flash -= dt;
            for (let j = 0; j < ex.particles.length; j++) {
                const pt = ex.particles[j];
                pt.dx += pt.vx * dt;
                pt.dy += pt.vy * dt;
                pt.vx *= 1 - Math.min(1, dt * 2.2);
                pt.vy *= 1 - Math.min(1, dt * 2.2);
                pt.r += 34 * dt;
            }
        }
    }

    function drawExplosions() {
        ctx.save();
        for (let i = 0; i < explosions.length; i++) {
            const ex = explosions[i];
            const y = worldToScreenY(ex.alt);
            const fade = Math.min(1, ex.life / (ex.maxLife * 0.45));
            if (ex.flash > 0) {
                const fa = Math.max(0, ex.flash / 0.18);
                ctx.fillStyle = 'rgba(255, 240, 200, ' + (fa * 0.5) + ')';
                ctx.beginPath();
                ctx.arc(ex.x, y, 14 + 26 * (1 - fa), 0, Math.PI * 2);
                ctx.fill();
            }
            for (let j = 0; j < ex.particles.length; j++) {
                const pt = ex.particles[j];
                ctx.fillStyle = 'rgba(212, 212, 212, ' + (fade * 0.55) + ')';
                ctx.beginPath();
                ctx.arc(ex.x + pt.dx, y + pt.dy, pt.r, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        ctx.restore();
    }

    function drawLimb(x1, y1, x2, y2, x3, y3, w, color) {
        ctx.strokeStyle = color;
        ctx.lineWidth = w;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineTo(x3, y3);
        ctx.stroke();
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x2, y2, w * 0.55, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawShoe(x, y, angle, scale) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(facing * scale, scale);
        ctx.rotate(angle);
        ctx.fillStyle = '#e84c3d';
        ctx.beginPath();
        ctx.moveTo(-5, -3);
        ctx.quadraticCurveTo(1, -5, 7, -2);
        ctx.quadraticCurveTo(14, 0, 14.5, 3.5);
        ctx.quadraticCurveTo(15, 6, 11, 6);
        ctx.lineTo(-6, 6);
        ctx.quadraticCurveTo(-7.5, 0, -5, -3);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#c0392b';
        ctx.beginPath();
        ctx.moveTo(8.5, -1.2);
        ctx.quadraticCurveTo(14, 0.6, 14.5, 3.5);
        ctx.quadraticCurveTo(15, 6, 11, 6);
        ctx.lineTo(8.5, 6);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#f5f6fa';
        ctx.beginPath();
        ctx.moveTo(-7, 5);
        ctx.lineTo(15, 5);
        ctx.quadraticCurveTo(16, 5, 15.5, 6.6);
        ctx.lineTo(14.5, 8);
        ctx.lineTo(-6, 8);
        ctx.quadraticCurveTo(-7.5, 8, -7.5, 6.4);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }

    function drawPlayer() {
        const groundY = worldToScreenY(player.y);
        const cx = player.x;
        const squash = player.airborne ? 0 : Math.max(0, player.squash);
        const stretch = player.airborne ? Math.min(0.25, Math.abs(player.vy) / 4000 + 0.08) : 0;
        const hScale = 1 + stretch - squash * 0.35;
        const wScale = 1 - stretch * 0.6 + squash * 0.4;
        const h = PLAYER_H * hScale;
        const w = PLAYER_W * wScale;
        const feetY = groundY;
        const hipY = feetY - h * 0.45;
        const shoulderY = feetY - h * 0.71;
        const headR = PLAYER_H * 0.12;
        const headY = shoulderY - headR + 2;

        const moving = !player.airborne && (keys.ArrowLeft || keys.ArrowRight || gamepadLeft || gamepadRight || touchLeft || touchRight);

        ctx.save();
        ctx.lineCap = 'round';

        if (player.airborne && player.airPose === 2) {
            const t = player.vy0 > 0 ? Math.max(-1, Math.min(1, player.vy / player.vy0)) : 0;
            const rotMidY = feetY - h * 0.55;
            const rot = ((t + 1) / 2) * Math.PI * 2 * player.spinDir;
            ctx.translate(cx, rotMidY);
            ctx.rotate(rot);
            ctx.translate(-cx, -rotMidY);
        }

        const SHOE_H = 8;
        let footL, footR, angL = 0, angR = 0, airFold = 0;
        if (moving) {
            const s = Math.sin(walkPhase);
            const liftL = Math.max(0, Math.sin(walkPhase + Math.PI / 2)) * 14;
            const liftR = Math.max(0, Math.sin(walkPhase + 3 * Math.PI / 2)) * 14;
            footL = { x: cx + facing * s * 18, y: feetY - SHOE_H - liftL };
            footR = { x: cx - facing * s * 18, y: feetY - SHOE_H - liftR };
            angL = -(liftL / 14) * 0.55;
            angR = -(liftR / 14) * 0.55;
        } else if (player.airborne) {
            const t = player.vy0 > 0 ? Math.max(-1, Math.min(1, player.vy / player.vy0)) : 0;
            const s = (t + 1) / 2;
            let alt = 1 - t * t;
            if (t > 0) alt *= 1 - t * 0.35;
            airFold = alt;
            if (player.airPose === 1) {
                footL = { x: cx - 20, y: feetY - h * 0.10 * alt - SHOE_H };
                footR = { x: cx + 20, y: feetY - h * 0.10 * alt - SHOE_H };
                angL = 0.40 * (0.4 + 0.6 * alt);
                angR = -0.40 * (0.4 + 0.6 * alt);
                airFold = alt * 0.5;
            } else {
                footL = { x: cx - 13, y: feetY - h * 0.04 * alt - SHOE_H };
                footR = { x: cx + 7 + 6 * s, y: feetY - h * 0.07 * alt - SHOE_H };
                angL = -0.20 + 0.40 * s + airFold * 0.30;
                angR = -0.12 + 0.26 * s + airFold * 0.26;
            }
        } else {
            footL = { x: cx - 11, y: feetY - SHOE_H };
            footR = { x: cx + 11, y: feetY - SHOE_H };
        }
        const hip = { x: cx, y: hipY };
        const feet = [footL, footR];
        const angles = [angL, angR];
        for (let fi = 0; fi < 2; fi++) {
            const foot = feet[fi];
            let kneeBend;
            if (player.airborne) kneeBend = 3 + airFold * 13;
            else if (moving) kneeBend = Math.min(17, 3 + (feetY - SHOE_H - foot.y) * 0.85);
            else kneeBend = 3;
            const mx = (hip.x + foot.x) / 2 + facing * kneeBend * 0.9;
            const my = (hip.y + foot.y) / 2;
            drawLimb(hip.x, hip.y, mx, my, foot.x, foot.y, 8 * wScale, '#1f4a63');
            drawShoe(foot.x, foot.y, angles[fi], wScale);
        }

        ctx.fillStyle = '#3b9ddd';
        roundRectPath(cx - w * 0.28, shoulderY, w * 0.56, hipY - shoulderY + 8, 10);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        roundRectPath(cx - w * 0.22, shoulderY + 5, w * 0.16, hipY - shoulderY - 2, 6);
        ctx.fill();

        const shL = { x: cx - w * 0.26, y: shoulderY + 8 };
        const shR = { x: cx + w * 0.26, y: shoulderY + 8 };
        let handL, handR;
        if (player.airborne) {
            const up = player.vy < 0;
            const liftY = up ? -h * 0.34 : -h * 0.18;
            if (player.armPose === 1) {
                const wideY = up ? -h * 0.12 : h * 0.02;
                handL = { x: cx - w * 0.95, y: shoulderY + 8 + wideY };
                handR = { x: cx + w * 0.95, y: shoulderY + 8 + wideY };
            } else if (player.armPose === 2) {
                if (player.armSide < 0) {
                    handL = { x: cx - w * 0.90, y: shoulderY + 8 + liftY };
                    handR = { x: cx + w * 0.95, y: shoulderY + 8 - h * 0.05 };
                } else {
                    handL = { x: cx - w * 0.95, y: shoulderY + 8 - h * 0.05 };
                    handR = { x: cx + w * 0.90, y: shoulderY + 8 + liftY };
                }
            } else {
                handL = { x: cx - w * 0.75, y: shoulderY + 8 + liftY };
                handR = { x: cx + w * 0.75, y: shoulderY + 8 + liftY };
            }
        } else if (moving) {
            const sw = Math.sin(walkPhase) * 16;
            handL = { x: cx - w * 0.30 - sw, y: shoulderY + h * 0.30 };
            handR = { x: cx + w * 0.30 + sw, y: shoulderY + h * 0.30 };
        } else {
            handL = { x: cx - w * 0.34, y: shoulderY + h * 0.28 };
            handR = { x: cx + w * 0.34, y: shoulderY + h * 0.28 };
        }
        const shHands = [[shL, handL, -1], [shR, handR, 1]];
        for (let si = 0; si < 2; si++) {
            const sh = shHands[si][0], hand = shHands[si][1], side = shHands[si][2];
            const mx = (sh.x + hand.x) / 2 + side * 10;
            const my = (sh.y + hand.y) / 2 + 6;
            drawLimb(sh.x, sh.y, mx, my, hand.x, hand.y, 7 * wScale, '#2f7fb8');
            ctx.fillStyle = '#ffdcb8';
            ctx.beginPath();
            ctx.arc(hand.x, hand.y, 5.5 * wScale, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.fillStyle = '#ffdcb8';
        ctx.beginPath();
        ctx.arc(cx, headY, headR, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#1e1e1e';
        const eyeDx = facing > 0 ? 4 : -4;
        ctx.beginPath();
        ctx.arc(cx - 5 + eyeDx, headY - 3, 2.4, 0, Math.PI * 2);
        ctx.arc(cx + 5 + eyeDx, headY - 3, 2.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#1e1e1e';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        if (player.airborne) ctx.arc(cx + eyeDx, headY + 2, 5.5, 0.15 * Math.PI, 0.85 * Math.PI);
        else ctx.arc(cx + eyeDx, headY + 3, 4.5, 0.1 * Math.PI, 0.9 * Math.PI);
        ctx.stroke();

        ctx.fillStyle = '#e84c3d';
        ctx.beginPath();
        ctx.arc(cx, headY - headR * 0.45, headR * 0.85, Math.PI, 0);
        ctx.fill();
        ctx.fillRect(cx - headR * 0.95, headY - headR * 0.55, headR * 1.9, headR * 0.32);

        ctx.restore();
    }

    // ==================== 宠物 ====================
    const PET_PALETTES = [
        ['#ff6b81', '#ffd6dd'], ['#54a0ff', '#c8ddff'], ['#feca57', '#fff0c8'],
        ['#5f27cd', '#c8b2ff'], ['#00d2d3', '#c8f7f7'], ['#ff9f43', '#ffe0c0'],
        ['#10ac84', '#c8f0e2'], ['#ee5253', '#ffd0d0'], ['#48dbfb', '#d8f4ff'],
        ['#f368e0', '#ffd6f7']
    ];

    const COIN_VALUES = [1, 2, 5, 10, 20, 50, 100];
    const COIN_GRAVITY = 1400;

    function makePet(index) {
        const type = index % 4;
        const palette = PET_PALETTES[Math.floor(Math.random() * PET_PALETTES.length)];
        const oa = Math.random() * Math.PI * 2;
        const od = 90 + Math.random() * 90;
        const ho = Math.random() * 100;
        return {
            type, c1: palette[0], c2: palette[1],
            x: player.x + Math.cos(oa) * od,
            alt: player.y + 95 + ho,
            phase: Math.random() * Math.PI * 2,
            size: 16 + Math.random() * 8,
            coinTimer: 3 + Math.random() * 2,
            orbitAngle: oa, orbitDist: od, heightOffset: ho,
            orbitSpeed: 0.15 + Math.random() * 0.25
        };
    }

    function updatePets(dt) {
        for (let i = 0; i < pets.length; i++) {
            const p = pets[i];
            p.orbitAngle += p.orbitSpeed * dt;
            const targetX = Math.max(40, Math.min(W - 40, player.x + Math.cos(p.orbitAngle) * p.orbitDist));
            const targetAlt = player.y + 95 + p.heightOffset + Math.sin(petTime * 2 + p.phase) * 14;
            p.x += (targetX - p.x) * Math.min(1, dt * 4);
            p.alt += (targetAlt - p.alt) * Math.min(1, dt * 5);
            p.coinTimer -= dt;
            if (p.coinTimer <= 0) {
                p.coinTimer = 3 + Math.random() * 2;
                if (Math.random() < 0.2 && Math.abs(p.x - player.x) >= 70) {
                    let value, big = false;
                    if (Math.random() < 0.02) {
                        value = 1000;
                        big = true;
                    } else {
                        value = COIN_VALUES[Math.floor(Math.random() * COIN_VALUES.length)];
                    }
                    coins.push({
                        x: p.x, alt: p.alt - p.size, altV: -60,
                        value: value, big: big,
                        phase: Math.random() * Math.PI * 2, life: 10
                    });
                    playPetCoinSound();
                }
            }
        }
    }

    function updateCoins(dt) {
        for (let i = coins.length - 1; i >= 0; i--) {
            const c = coins[i];
            if (c.alt > 4) {
                c.altV -= COIN_GRAVITY * dt;
                c.alt += c.altV * dt;
                if (c.alt <= 4) { c.alt = 4; c.altV = 0; c.life = 10; }
            } else {
                c.life -= dt;
                if (c.life <= 0) { coins.splice(i, 1); continue; }
                const dx = c.x - player.x;
                const dy = c.alt - player.y;
                if (dx * dx + dy * dy < 45 * 45) {
                    money += c.value;
                    popups.push({ x: c.x, y: c.alt, text: '+' + c.value + ' $', life: 1.2, color: c.big ? '#ff9ff3' : '#ffd966', follow: false });
                    playPickupSound();
                    coins.splice(i, 1);
                }
            }
        }
    }

    function drawPet(p) {
        const y = worldToScreenY(p.alt);
        const x = p.x;
        const s = p.size;
        const flap = Math.sin(petTime * 10 + p.phase) * 0.7;
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(facing >= 0 ? 1 : -1, 1);

        ctx.fillStyle = p.c2;
        ctx.save();
        ctx.rotate(-0.5 - flap * 0.6);
        ctx.beginPath();
        ctx.ellipse(-s * 0.4, -s * 0.5, s * 0.9, s * 0.35, -0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.save();
        ctx.scale(-1, 1);
        ctx.rotate(-0.5 - flap * 0.6);
        ctx.beginPath();
        ctx.ellipse(-s * 0.4, -s * 0.5, s * 0.9, s * 0.35, -0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.fillStyle = p.c1;
        if (p.type === 1) {
            ctx.beginPath();
            ctx.moveTo(-s * 0.8, 0);
            ctx.quadraticCurveTo(-s * 1.8, Math.sin(petTime * 6 + p.phase) * s * 0.4, -s * 2.2, s * 0.5);
            ctx.quadraticCurveTo(-s * 1.4, s * 0.2, -s * 0.8, s * 0.3);
            ctx.closePath();
            ctx.fill();
        } else if (p.type === 3) {
            ctx.strokeStyle = p.c1;
            ctx.lineWidth = 3;
            for (let k = -1; k <= 1; k++) {
                ctx.beginPath();
                ctx.moveTo(-s * 0.8, 0);
                ctx.quadraticCurveTo(-s * 1.6, k * 6 + Math.sin(petTime * 5 + p.phase) * 5, -s * 2.1, k * 12);
                ctx.stroke();
            }
        } else {
            ctx.beginPath();
            ctx.moveTo(-s * 0.8, -s * 0.2);
            ctx.lineTo(-s * 1.5, Math.sin(petTime * 6 + p.phase) * s * 0.25);
            ctx.lineTo(-s * 0.8, s * 0.3);
            ctx.closePath();
            ctx.fill();
        }

        ctx.fillStyle = p.c1;
        ctx.beginPath();
        if (p.type === 1) ctx.ellipse(0, 0, s * 1.1, s * 0.5, 0, 0, Math.PI * 2);
        else if (p.type === 2) ctx.ellipse(0, 0, s * 0.8, s * 0.9, 0, 0, Math.PI * 2);
        else ctx.ellipse(0, 0, s * 0.9, s * 0.65, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = p.c2;
        ctx.beginPath();
        ctx.ellipse(s * 0.15, s * 0.25, s * 0.45, s * 0.3, 0, 0, Math.PI * 2);
        ctx.fill();

        if (p.type === 2) {
            ctx.fillStyle = p.c1;
            ctx.beginPath();
            ctx.moveTo(-s * 0.45, -s * 0.6); ctx.lineTo(-s * 0.25, -s * 1.1); ctx.lineTo(-s * 0.05, -s * 0.65);
            ctx.moveTo(s * 0.05, -s * 0.65); ctx.lineTo(s * 0.25, -s * 1.1); ctx.lineTo(s * 0.45, -s * 0.6);
            ctx.fill();
        } else if (p.type === 1) {
            ctx.strokeStyle = p.c2;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(s * 0.5, -s * 0.35); ctx.lineTo(s * 0.7, -s * 0.8);
            ctx.moveTo(s * 0.2, -s * 0.45); ctx.lineTo(s * 0.3, -s * 0.95);
            ctx.stroke();
        }

        ctx.fillStyle = '#1e1e1e';
        ctx.beginPath();
        ctx.arc(s * 0.45, -s * 0.15, 2.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f39c12';
        ctx.beginPath();
        ctx.moveTo(s * 0.85, -s * 0.1);
        ctx.lineTo(s * 1.25, 0);
        ctx.lineTo(s * 0.85, s * 0.15);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
    }

    function drawPets() {
        for (let i = 0; i < pets.length; i++) drawPet(pets[i]);
    }

    function drawCoins() {
        for (let i = 0; i < coins.length; i++) {
            const c = coins[i];
            const sy = worldToScreenY(c.alt);
            if (sy < -60 || sy > PLAY_H + 60) continue;
            const r = c.big ? 17 : 6.5 + Math.log10(c.value) * 2.2;
            const bob = Math.sin(petTime * 4 + c.phase) * 2;
            const spin = Math.abs(Math.cos(petTime * 5 + c.phase));
            ctx.save();
            ctx.translate(c.x, sy + bob);
            ctx.scale(Math.max(0.25, spin), 1);
            if (c.big) {
                const glow = ctx.createRadialGradient(0, 0, r * 0.4, 0, 0, r * 2.4);
                glow.addColorStop(0, 'rgba(255, 215, 90, 0.55)');
                glow.addColorStop(1, 'rgba(255, 215, 90, 0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(0, 0, r * 2.4, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.fillStyle = c.big ? '#ffd23e' : '#f5b921';
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = c.big ? '#c78f00' : '#d19a0a';
            ctx.lineWidth = c.big ? 3 : 2;
            ctx.stroke();
            ctx.fillStyle = 'rgba(170, 105, 0, 0.95)';
            ctx.font = 'bold ' + Math.max(9, Math.round(r * 1.15)) + 'px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('$', 0, 1);
            ctx.restore();
        }
    }

    function drawPopups() {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = 'bold 26px "Courier New", monospace';
        for (let i = 0; i < popups.length; i++) {
            const p = popups[i];
            const y = worldToScreenY(p.y) - PLAYER_H - (1.4 - p.life) * 50;
            ctx.globalAlpha = Math.min(1, p.life * 2);
            ctx.fillStyle = p.color;
            ctx.shadowColor = '#00000088';
            ctx.shadowBlur = 4;
            ctx.fillText(p.text, p.x, y);
        }
        ctx.restore();
        ctx.globalAlpha = 1;
    }

    function drawBuyHint() {
        const idx = nearestTableIndex();
        if (idx < 0) return;
        const groundY = worldToScreenY(0);
        ctx.save();
        ctx.font = 'bold 18px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const text = '按 B 购买';
        const tw = ctx.measureText(text).width + 24;
        const x = tables[idx].x, y = groundY - 130;
        ctx.fillStyle = 'rgba(13, 27, 42, 0.85)';
        roundRectPath(x - tw / 2, y - 15, tw, 30, 15);
        ctx.fill();
        ctx.fillStyle = '#ffd966';
        ctx.fillText(text, x, y);
        ctx.restore();
    }

    // ==================== 背景景观 ====================
    function hash(n) {
        const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
    }

    function lerpColor(r1, g1, b1, r2, g2, b2, t) {
        return 'rgb(' + Math.round(r1 + (r2 - r1) * t) + ',' + Math.round(g1 + (g2 - g1) * t) + ',' + Math.round(b1 + (b2 - b1) * t) + ')';
    }

    function getDarkness() {
        const d = (player.y - 390 * PX_PER_M) / (150 * PX_PER_M);
        return Math.max(0, Math.min(1, d));
    }

    function drawSky() {
        const dark = getDarkness();
        const g = ctx.createLinearGradient(0, 0, 0, PLAY_H);
        g.addColorStop(0, lerpColor(0x8f, 0xc7, 0xe8, 0x05, 0x05, 0x14, dark));
        g.addColorStop(1, lerpColor(0xd4, 0xee, 0xf9, 0x0c, 0x0c, 0x22, dark));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, PLAY_H);
    }

    function drawMountain(mx, baseY, mw, mh, body, shade, snow) {
        const peakX = mx - mw * 0.08;
        const peakY = baseY - mh;
        const lx = mx - mw / 2, rx = mx + mw / 2;
        ctx.fillStyle = body;
        ctx.beginPath();
        ctx.moveTo(lx, baseY);
        ctx.lineTo(peakX, peakY);
        ctx.lineTo(mx + mw * 0.22, baseY);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = shade;
        ctx.beginPath();
        ctx.moveTo(peakX, peakY);
        ctx.lineTo(rx, baseY);
        ctx.lineTo(mx + mw * 0.22, baseY);
        ctx.closePath();
        ctx.fill();
        const sw = mw * 0.15;
        const sy0 = peakY + mh * 0.30;
        ctx.fillStyle = snow;
        ctx.beginPath();
        ctx.moveTo(peakX - sw, sy0);
        ctx.lineTo(peakX, peakY);
        ctx.lineTo(peakX + sw, sy0);
        ctx.lineTo(peakX + sw * 0.5, sy0 - mh * 0.06);
        ctx.lineTo(peakX, sy0 + mh * 0.03);
        ctx.lineTo(peakX - sw * 0.5, sy0 - mh * 0.06);
        ctx.closePath();
        ctx.fill();
        const tn = 2 + Math.floor(hash(mx * 0.13) * 3);
        ctx.fillStyle = 'rgba(46, 90, 60, 0.9)';
        for (let i = 0; i < tn; i++) {
            const tx = lx + mw * (0.12 + 0.76 * hash(mx * 0.07 + i * 3.1));
            const ts = 0.4 + hash(mx * 0.11 + i * 5.3) * 0.35;
            ctx.beginPath();
            ctx.moveTo(tx, baseY - 30 * ts);
            ctx.lineTo(tx - 9 * ts, baseY);
            ctx.lineTo(tx + 9 * ts, baseY);
            ctx.closePath();
            ctx.fill();
        }
    }

    function drawMountains() {
        const farY = PLAY_H - GROUND_H + camY * 0.3;
        if (farY > -300 && farY < PLAY_H + 300) {
            for (let i = 0; i < 4; i++) {
                const mx = hash(i * 3 + 1 + bgSeed) * W;
                const mw = 300 + hash(i * 3 + 2 + bgSeed) * 340;
                const mh = 130 + hash(i * 3 + 3 + bgSeed) * 170;
                drawMountain(mx, farY, mw, mh, '#9db4c8', '#8ba3b8', 'rgba(255,255,255,0.7)');
            }
        }
        const nearY = PLAY_H - GROUND_H + camY * 0.5;
        if (nearY > -300 && nearY < PLAY_H + 300) {
            for (let i = 0; i < 5; i++) {
                const mx = hash(i * 5 + 21 + bgSeed) * W;
                const mw = 270 + hash(i * 5 + 22 + bgSeed) * 310;
                const mh = 165 + hash(i * 5 + 23 + bgSeed) * 230;
                drawMountain(mx, nearY, mw, mh, '#7d93ab', '#6b8298', 'rgba(255,255,255,0.88)');
            }
        }
    }

    function drawTree(x, baseY, s) {
        ctx.fillStyle = '#6b4423';
        ctx.fillRect(x - 4 * s, baseY - 26 * s, 8 * s, 26 * s);
        ctx.fillStyle = '#3e7d44';
        ctx.beginPath();
        ctx.arc(x, baseY - 38 * s, 16 * s, 0, Math.PI * 2);
        ctx.arc(x - 11 * s, baseY - 28 * s, 11 * s, 0, Math.PI * 2);
        ctx.arc(x + 11 * s, baseY - 28 * s, 11 * s, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#4c9452';
        ctx.beginPath();
        ctx.arc(x - 4 * s, baseY - 42 * s, 9 * s, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawGroundDecor() {
        const groundY = worldToScreenY(0);
        if (groundY > PLAY_H + 400) return;
        for (let i = 0; i < 7; i++) {
            const tx = hash(i * 7 + 11 + bgSeed) * W;
            const ts = 1.8 + hash(i * 7 + 12 + bgSeed) * 1.2;
            drawTree(tx, groundY, ts);
        }
    }

    function drawBirdShape(x, y, s, flap, color) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(s, s);
        ctx.strokeStyle = color;
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        const w = 10;
        const lift = flap * 5;
        ctx.beginPath();
        ctx.moveTo(-w, 0);
        ctx.quadraticCurveTo(-w * 0.5, -4 - lift, 0, 0);
        ctx.quadraticCurveTo(w * 0.5, -4 - lift, w, 0);
        ctx.stroke();
        ctx.restore();
    }

    function drawBirds() {
        const band = 10 * PX_PER_M;
        const sy = worldToScreenY(band);
        if (sy < -150 || sy > PLAY_H + 150) return;
        for (let i = 0; i < 6; i++) {
            const dir = hash(i * 5 + 1) > 0.5 ? 1 : -1;
            const speed = 40 + hash(i * 5 + 2) * 50;
            const range = W + 120;
            let x = (hash(i * 5 + 3) * range + petTime * speed * dir) % range;
            if (x < 0) x += range;
            x -= 60;
            const y = sy - 30 + Math.sin(petTime * 1.5 + i * 1.7) * 25 + hash(i * 5 + 4) * 40;
            const flap = Math.sin(petTime * 9 + i * 2.3);
            drawBirdShape(x, y, 0.8 + hash(i * 5 + 5) * 0.4, flap, 'rgba(60, 60, 70, 0.9)');
        }
    }

    function drawEagle() {
        const band = 20 * PX_PER_M;
        const sy = worldToScreenY(band);
        if (sy < -200 || sy > PLAY_H + 200) return;
        for (let i = 0; i < 2; i++) {
            const dir = i === 0 ? 1 : -1;
            const speed = 55 + i * 20;
            const range = W + 200;
            let x = (hash(i * 13 + 7) * range + petTime * speed * dir) % range;
            if (x < 0) x += range;
            x -= 100;
            const y = sy - 20 + Math.sin(petTime * 0.9 + i * 3) * 35;
            const flap = Math.sin(petTime * 5 + i * 2) * 0.7 + 0.3;
            drawBirdShape(x, y, 2.6, flap, 'rgba(40, 32, 28, 0.95)');
        }
    }

    function drawCloudShape(x, y, s) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(s, s);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
        ctx.beginPath();
        ctx.arc(-28, 6, 16, 0, Math.PI * 2);
        ctx.arc(-8, -6, 20, 0, Math.PI * 2);
        ctx.arc(14, -2, 17, 0, Math.PI * 2);
        ctx.arc(30, 8, 13, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(228, 236, 244, 0.88)';
        ctx.beginPath();
        ctx.ellipse(0, 10, 38, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    function drawClouds() {
        const band = 40 * PX_PER_M;
        const sy = worldToScreenY(band);
        if (sy < -250 || sy > PLAY_H + 250) return;
        for (let i = 0; i < 5; i++) {
            const dir = hash(i * 17 + 3) > 0.5 ? 1 : -1;
            const speed = 12 + hash(i * 17 + 4) * 18;
            const range = W + 260;
            let x = (hash(i * 17 + 5) * range + petTime * speed * dir) % range;
            if (x < 0) x += range;
            x -= 130;
            const y = sy - 60 + hash(i * 17 + 6) * 130;
            const s = 0.7 + hash(i * 17 + 7) * 0.9;
            drawCloudShape(x, y, s);
        }
    }

    function drawPlaneShape(x, y, dir) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(dir * 2, 2);
        ctx.fillStyle = '#b8c4d2';
        ctx.beginPath();
        ctx.moveTo(-6, -5);
        ctx.lineTo(-13, -24);
        ctx.lineTo(1, -24);
        ctx.lineTo(8, -5);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-6, 5);
        ctx.lineTo(-13, 24);
        ctx.lineTo(1, 24);
        ctx.lineTo(8, 5);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-30, -4);
        ctx.lineTo(-37, -14);
        ctx.lineTo(-29, -14);
        ctx.lineTo(-24, -4);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-30, 4);
        ctx.lineTo(-37, 14);
        ctx.lineTo(-29, 14);
        ctx.lineTo(-24, 4);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#dfe6ee';
        roundRectPath(-34, -6, 68, 12, 6);
        ctx.fill();
        ctx.fillStyle = '#c3ccd8';
        ctx.beginPath();
        ctx.moveTo(34, -6);
        ctx.quadraticCurveTo(48, 0, 34, 6);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#4a6a8a';
        ctx.beginPath();
        ctx.ellipse(25, 0, 5, 3.2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#5a7a9a';
        for (let i = 0; i < 5; i++) {
            ctx.beginPath();
            ctx.arc(-20 + i * 10, 0, 1.7, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    function drawPlane() {
        const band = 90 * PX_PER_M;
        const sy = worldToScreenY(band);
        if (sy < -200 || sy > PLAY_H + 200) return;
        const x0 = -130, x1 = W + 130;
        const span = x1 - x0;
        const phase = ((petTime * 150) % (span * 2)) / span;
        const p = phase < 1 ? phase : 2 - phase;
        const dir = phase < 1 ? 1 : -1;
        const x = x0 + p * span;
        const y = sy - 40 + Math.sin(petTime * 2) * 8;
        drawPlaneShape(x, y, dir);
    }

    function drawMissileShape(x, y, dir) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(dir * 2, 2);
        const fl = 14 + Math.sin(petTime * 40) * 5;
        const grad = ctx.createLinearGradient(-18, 0, -18 - fl, 0);
        grad.addColorStop(0, 'rgba(255, 200, 60, 0.9)');
        grad.addColorStop(1, 'rgba(255, 80, 30, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(-18, -3);
        ctx.lineTo(-18 - fl, 0);
        ctx.lineTo(-18, 3);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(200, 200, 200, 0.30)';
        ctx.beginPath();
        ctx.ellipse(-40 - fl * 0.4, 0, 24, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#c8ccd4';
        roundRectPath(-18, -4, 36, 8, 4);
        ctx.fill();
        ctx.fillStyle = '#e84c3d';
        ctx.beginPath();
        ctx.moveTo(18, -4);
        ctx.quadraticCurveTo(30, 0, 18, 4);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#9aa2ae';
        ctx.beginPath();
        ctx.moveTo(-18, -4);
        ctx.lineTo(-26, -11);
        ctx.lineTo(-22, -4);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-18, 4);
        ctx.lineTo(-26, 11);
        ctx.lineTo(-22, 4);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }

    function drawMissile() {
        const band = 190 * PX_PER_M;
        const sy = worldToScreenY(band);
        if (sy < -200 || sy > PLAY_H + 200) return;
        const x0 = -130, x1 = W + 130;
        const span = x1 - x0;
        const phase = ((petTime * 260) % (span * 2)) / span;
        const p = phase < 1 ? phase : 2 - phase;
        const dir = phase < 1 ? 1 : -1;
        const x = x0 + p * span;
        const y = sy + 30 + Math.sin(petTime * 3) * 10;
        drawMissileShape(x, y, dir);
    }

    function drawUfoShape(x, y) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(3, 3);
        const beam = ctx.createLinearGradient(0, 6, 0, 64);
        beam.addColorStop(0, 'rgba(120, 255, 180, 0.28)');
        beam.addColorStop(1, 'rgba(120, 255, 180, 0)');
        ctx.fillStyle = beam;
        ctx.beginPath();
        ctx.moveTo(-14, 6);
        ctx.lineTo(14, 6);
        ctx.lineTo(32, 64);
        ctx.lineTo(-32, 64);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#aab4c0';
        ctx.beginPath();
        ctx.ellipse(0, 0, 34, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#c8d2dc';
        ctx.beginPath();
        ctx.ellipse(0, -5, 19, 9, 0, Math.PI, 0);
        ctx.fill();
        ctx.fillStyle = 'rgba(140, 220, 255, 0.85)';
        ctx.beginPath();
        ctx.ellipse(0, -7, 12, 7, 0, Math.PI, 0);
        ctx.fill();
        for (let i = 0; i < 5; i++) {
            const a = (i / 5) * Math.PI * 2 + petTime * 2;
            const lx = Math.cos(a) * 26;
            const ly = Math.sin(a) * 6 + 2;
            const blink = 0.5 + 0.5 * Math.sin(petTime * 8 + i * 1.3);
            ctx.fillStyle = 'rgba(255, 90, 90, ' + (0.4 + 0.6 * blink) + ')';
            ctx.beginPath();
            ctx.arc(lx, ly, 2.5, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    function drawUfo() {
        const band = 390 * PX_PER_M;
        const sy = worldToScreenY(band);
        if (sy < -250 || sy > PLAY_H + 250) return;
        const x0 = 110, x1 = W - 110;
        const span = x1 - x0;
        const phase = ((petTime * 110) % (span * 2)) / span;
        const p = phase < 1 ? phase : 2 - phase;
        const x = x0 + p * span;
        const y = sy - 30 + Math.sin(petTime * 1.5) * 18;
        drawUfoShape(x, y);
    }

    function drawHighAltitude() {
        drawBirds();
        drawEagle();
        drawClouds();
        drawPlane();
        drawMissile();
        drawUfo();
    }

    function drawStars() {
        const vis = Math.max(0, Math.min(1, (player.y - 390 * PX_PER_M) / (100 * PX_PER_M)));
        if (vis <= 0) return;
        for (let i = 0; i < 50; i++) {
            const sx = hash(i * 23 + 1) * W;
            const sy = hash(i * 23 + 2) * PLAY_H;
            const tw = 0.5 + 0.5 * Math.sin(petTime * (1.5 + hash(i * 23 + 3) * 3) + i);
            const r = 0.6 + hash(i * 23 + 4) * 1.4;
            ctx.fillStyle = 'rgba(255, 255, 240, ' + (vis * (0.35 + 0.65 * tw)) + ')';
            ctx.beginPath();
            ctx.arc(sx, sy, r, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function drawMoon() {
        const vis = Math.max(0, Math.min(1, (player.y - 890 * PX_PER_M) / (100 * PX_PER_M)));
        if (vis <= 0) return;
        const mx = W * 0.78, my = PLAY_H * 0.24, mr = 42;
        ctx.save();
        ctx.globalAlpha = vis;
        const glow = ctx.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 2.2);
        glow.addColorStop(0, 'rgba(255, 248, 220, 0.35)');
        glow.addColorStop(1, 'rgba(255, 248, 220, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(mx, my, mr * 2.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f5eeda';
        ctx.beginPath();
        ctx.arc(mx, my, mr, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(190, 180, 155, 0.7)';
        ctx.beginPath();
        ctx.arc(mx - 12, my - 8, 8, 0, Math.PI * 2);
        ctx.arc(mx + 10, my + 12, 6, 0, Math.PI * 2);
        ctx.arc(mx + 16, my - 14, 4.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    function drawBlackHole() {
        const vis = Math.max(0, Math.min(1, (player.y - 1890 * PX_PER_M) / (100 * PX_PER_M)));
        if (vis <= 0) return;
        const bx = W * 0.5, by = PLAY_H * 0.38, br = 34;
        ctx.save();
        ctx.globalAlpha = vis;
        const glow = ctx.createRadialGradient(bx, by, br * 0.8, bx, by, br * 3.2);
        glow.addColorStop(0, 'rgba(255, 170, 60, 0.55)');
        glow.addColorStop(0.4, 'rgba(255, 120, 30, 0.25)');
        glow.addColorStop(1, 'rgba(255, 100, 20, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(bx, by, br * 3.2, 0, Math.PI * 2);
        ctx.fill();
        const rot = petTime * 1.5;
        for (let i = 0; i < 3; i++) {
            const a0 = rot + i * (Math.PI * 2 / 3);
            ctx.strokeStyle = i === 0 ? 'rgba(255, 220, 140, 0.95)' : 'rgba(255, 150, 50, 0.7)';
            ctx.lineWidth = 5 - i;
            ctx.beginPath();
            ctx.ellipse(bx, by, br * 1.9, br * 0.75, 0.35, a0, a0 + Math.PI * 1.1);
            ctx.stroke();
        }
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(bx, by, br, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    const HUD_FONT = 'bold 18px "Courier New", monospace';
    let hudDirty = true;
    let hudMoneyStr = '', hudAbilityStr = '';
    let hudMoneyW = 0, hudAbilityW = 0;

    function rebuildHudCache() {
        hudMoneyStr = '金币: ' + money + ' $';
        hudAbilityStr = '跳跃能力: ' + jumpAbility + ' m';
        const savedFont = ctx.font;
        ctx.font = HUD_FONT;
        const pad = 14;
        hudMoneyW = ctx.measureText(hudMoneyStr).width + pad * 2;
        hudAbilityW = ctx.measureText(hudAbilityStr).width + pad * 2;
        ctx.font = savedFont;
        hudDirty = false;
    }

    function drawPillWithText(x, y, w, h, bgColor, text, textColor) {
        ctx.fillStyle = bgColor;
        roundRectPath(x, y, w, h, h / 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.lineWidth = 1;
        roundRectPath(x + 1, y + 1, w - 2, h - 2, (h - 2) / 2);
        ctx.stroke();
        ctx.fillStyle = textColor;
        ctx.fillText(text, x + 14, y + h / 2 + 1);
    }

    function drawHud() {
        if (hudDirty) rebuildHudCache();
        ctx.fillStyle = hudBgGrad;
        ctx.fillRect(0, PLAY_H, W, HUD_H);
        ctx.strokeStyle = 'rgba(120, 170, 210, 0.35)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, PLAY_H + 0.5);
        ctx.lineTo(W, PLAY_H + 0.5);
        ctx.stroke();

        const pillH = 36, gap = 10;
        const totalW = hudMoneyW + hudAbilityW + gap;
        let x = (W - totalW) / 2;
        const y = PLAY_H + (HUD_H - pillH) / 2;
        ctx.font = HUD_FONT;
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'left';
        drawPillWithText(x, y, hudMoneyW, pillH, 'rgba(52, 78, 116, 0.9)', hudMoneyStr, '#ffd966');
        x += hudMoneyW + gap;
        drawPillWithText(x, y, hudAbilityW, pillH, 'rgba(30, 47, 74, 0.85)', hudAbilityStr, '#9bf6b0');
    }

    function draw() {
        applyCanvasTransform();
        ctx.clearRect(0, 0, W, H);

        drawSky();
        drawMountains();
        drawRuler();

        const groundY = worldToScreenY(0);
        ctx.fillStyle = '#7a9e7e';
        ctx.fillRect(0, groundY, W, PLAY_H - groundY + 200);
        ctx.fillStyle = '#5f7e5f';
        ctx.fillRect(0, groundY, W, 8);

        drawGroundDecor();
        drawHighAltitude();

        drawTables();
        drawPets();
        drawCoins();
        drawPlayer();
        drawExplosions();

        const dark = getDarkness();
        if (dark > 0.001) {
            ctx.fillStyle = 'rgba(3, 3, 14, ' + (dark * 0.35) + ')';
            ctx.fillRect(0, 0, W, PLAY_H);
        }

        drawStars();
        drawMoon();
        drawBlackHole();

        drawPopups();
        drawBuyHint();
        drawHud();

        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
    }

    // ==================== 主循环 ====================
    let lastTime = 0;
    let lastHudMoney = -1, lastHudAbility = -1;
    function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        let dt = (timestamp - lastTime) / 1000;
        lastTime = timestamp;
        if (dt > 0.1) dt = 0.1;
        if (dt < 0.001) dt = 0.001;

        pollGamepad();
        update(dt);
        if (money !== lastHudMoney || jumpAbility !== lastHudAbility) hudDirty = true;
        lastHudMoney = money; lastHudAbility = jumpAbility;
        draw();
        requestAnimationFrame(gameLoop);
    }

    // ==================== 初始化 ====================
    updateFullscreenButton();
    resizeCanvas();
    rebuildGradients();
    initTables();
    requestAnimationFrame(() => { resizeCanvas(); requestAnimationFrame(resizeCanvas); });
    requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
